services:
  postgres:
    image: pgvector/pgvector:pg17
    # Off the network the Bots are on, because a Bot's computer is on it and a Bot has a shell.
    #
    # With no `networks:` anywhere, Compose puts every service on one network with DNS by service
    # name, so `agent-computer` could open `postgres:5432` and the credentials three lines below are
    # in this file. That is the audit trail, the policy store and the agent tables, reachable from
    # the one container whose whole job is to run what a Bot asks for. `agent-computer/src/shell.ts`
    # says it plainly: isolation is the container's job, a shell can reach whatever the container
    # can reach.
    #
    # `migrate` reaches this by name, and so do `server` and `worker` when an installed OpenBot runs
    # them; those are all that belong here. In local development the API server and the worker run
    # on the host instead and connect through the published port below.
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot
    ports:
      # Loopback, like every other port in this file, and for the reason the network split above
      # exists. Published on every interface, this is reachable from the Bot's computer at the
      # container's default gateway, which is the host: taking `postgres` off that network removes
      # the name and leaves the address. Proven from inside `agent-computer`, where the gateway on
      # :5432 answered and began authenticating as `openbot` on `openbot`, with the password in
      # this file. The server on the host still reaches it, because that is what loopback is.
      # Both loopback addresses, because `localhost` is not one address.
      #
      # It resolves to ::1 and 127.0.0.1 in an order the platform decides, and a client that gets
      # ::1 first does not fall back: Bun and Node both fail the connection outright rather than
      # trying the other. Publishing on one of them makes `localhost` work on some machines and not
      # others, for a reason nothing in the error mentions. Publishing on both is still loopback,
      # so nothing here is reachable from another host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "[::1]:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  migrate:
    # PULLED, NEVER BUILT HERE. This image, and the computer's and the supervisor's below, are the
    # published OpenBot images, all at one tag: OPENBOT_BACKEND_TAG, set in backend-images.env.
    # scripts/start.sh, CI and Desktop's local build read that file and hand the tag to Compose
    # here. SERVER_IMAGE still wins over it, which is how OpenBot Desktop pins a
    # release's digest.
    #
    # A Compose run by hand without the tag still reads this file, so `ps`, `logs` and `down` work as
    # they always did. Only a pull fails, and the tag it fails on says where the real one is. Pass
    # backend-images.env to it (`docker compose --env-file backend-images.env --env-file .env ...`).
    #
    # `missing` rather than `always`: a `sha-` tag names one build and never moves, so an image this
    # machine already has is the right one. OpenBot Desktop sets `missing` too.
    image: &server-image ${SERVER_IMAGE:-ghcr.io/copilotkit/openbot-server:${OPENBOT_BACKEND_TAG:-see-backend-images.env}}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    # The server's own migrator, which is what this image ships, and not `drizzle-kit`, which will
    # skip a migration stamped below what the database has already recorded and still report
    # success. The local stack is a developer's database and therefore one of the places that
    # happens.
    command: ["bun", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://openbot:openbot@postgres:5432/openbot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  # OpenBot itself, the API and the app it serves, as an installed OpenBot runs it.
  #
  # BEHIND A PROFILE, so a plain `docker compose up -d` starts only what it always did. Naming
  # `server` on the command line still starts it, profile or not, which is how `scripts/start.sh`
  # and an installed OpenBot ask for it.
  #
  # The image `migrate` runs, because it is one image: the API, the built app at `APP_DIST_DIR`, and
  # the worker below. A machine with that image needs Docker and nothing else, which is the point.
  server:
    profiles: ["openbot"]
    # See migrate above for where the image comes from.
    image: *server-image
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    # The deployment's settings, `.env`. Optional, because `docker compose config` and a first start
    # both come before anything wrote it. `scripts/start.sh` names a file of its own instead, `.env`
    # with its run's environment on top (scripts/server-env.ts), removed once the container exists.
    #
    # Everything in `environment:` below wins over this file. That is what lets the addresses there
    # name services on this network: the file says `127.0.0.1`, which inside this container is the
    # container.
    env_file:
      - path: ${OPENBOT_SERVER_ENV_FILE:-./.env}
        required: false
    environment:
      # Both names, because `.env` carries `SERVER_PORT` for the host port, and the server refuses to
      # start when the two disagree (`serverPort` in server/src/config.ts). Inside this container it
      # is always 3001; the host port is the mapping's business, below.
      PORT: "3001"
      SERVER_PORT: "3001"
      # Not production, as a host server is not. The image says production, and in production the
      # server refuses `AGENT_COMPUTER_ALLOW_PRIVATE_HOSTS`, which a local OpenBot needs: its
      # supervisor, computers and Bots are all at private addresses, on purpose. Empty rather than
      # `development`, because unset is what a host server has, and libraries that look at this
      # treat the two alike.
      NODE_ENV: ""
      # Every address below names a service on this network rather than the loopback port the host
      # server reaches it on.
      DATABASE_URL: postgres://openbot:openbot@postgres:5432/openbot
      AGENT_COMPUTER_URL: http://agent-computer:4100
      # Per-Bot computers too, which is not automatic: the supervisor publishes each on a loopback
      # port unless `COMPUTER_NETWORK` names this project's `default` network, and a loopback port on
      # the host is not one this container can open. Whoever starts this service sets that as well.
      #
      # `-` and not `:-`: unset is the supervisor, as it always was, and set empty is no supervisor,
      # which is how OpenBot Desktop runs the personal edition on its one computer.
      COMPUTER_SUPERVISOR_URL: ${COMPUTER_SUPERVISOR_CONTAINER_URL-http://supervisor:4300}
      # The managed Bot by name, when the deployment has one. `:+` keeps an empty setting empty, which
      # is how a deployment without that Bot says so: the package drops its row while this is blank.
      MANAGED_AGENT_AG_UI_URL: ${MANAGED_AGENT_AG_UI_URL:+http://agent-langgraph-agui:4206/}
      # These three have a container address only the deployment knows, so they take the shape
      # `OPENAI_CONTAINER_BASE_URL` already has on the Bots below: the container's own address when
      # one is given, and otherwise the deployment's, which for anything not on this machine is
      # already right. The picked harness's path, a model endpoint on the host, and Intelligence.
      PICKED_HARNESS_URL: ${PICKED_HARNESS_CONTAINER_URL:-${PICKED_HARNESS_URL:-}}
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      INTELLIGENCE_API_URL: ${INTELLIGENCE_CONTAINER_API_URL:-${INTELLIGENCE_API_URL:-}}
      INTELLIGENCE_GATEWAY_WS_URL: ${INTELLIGENCE_CONTAINER_GATEWAY_WS_URL:-${INTELLIGENCE_GATEWAY_WS_URL:-}}
      # The browser opens the gateway too, at the address the server gives it in `/info`, and the
      # browser is on the host. So it gets the deployment's own address, the one a host server would
      # have used, whatever this container uses itself.
      INTELLIGENCE_BROWSER_GATEWAY_WS_URL: ${INTELLIGENCE_GATEWAY_WS_URL:-}
      # The person's own browser, where a host-side computer runs it (scripts/start.sh's personal
      # edition), listening on the host's loopback, and its container address when one is given.
      # Unset, the person's browser runs on the computers the Bots run on and shows in the page.
      OPENBOT_BROWSER_URL: ${OPENBOT_BROWSER_CONTAINER_URL:-${OPENBOT_BROWSER_URL:-}}
      # The name this container reaches the person's machine by, which OpenBot Desktop writes. With
      # it, an agent a person registers on their own loopback (`http://127.0.0.1:8765/ag-ui`) is
      # dialled there rather than at this container. A container name only, so a host server reading
      # the same `.env` never translates its own loopback.
      OPENBOT_THIS_MACHINE_HOST: ${OPENBOT_THIS_MACHINE_CONTAINER_HOST:-}
      # The deployment's secrets, from the environment Compose runs in and then from `.env`, which
      # Compose reads for these `${...}` and the host server reads for itself. OpenBot Desktop keeps
      # them out of that file and hands them to Compose in its environment, so they reach this
      # container only by being named here. The defaults are the ones every other service in this
      # file and `scripts/start.sh` agree on.
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-openbot-dev-computer-token}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-openbot-dev-supervisor-token}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-openbot-dev-worker-secret}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # The desktop's host-access broker proves itself with this. Minted per start and given to the
      # server alone, so it is named here and nowhere else in this file.
      OPENBOT_DESKTOP_HOST_TOKEN: ${OPENBOT_DESKTOP_HOST_TOKEN:-}
      # The app broker's settings. A Composio key the desktop provisioned at CopilotKit sign-in lives
      # in its protected store, never in `.env`, so it reaches this container only by being named
      # here. A key the person put in `.env` wins and arrives the same way.
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      ARCADE_API_KEY: ${ARCADE_API_KEY:-}
      OPENBOT_BROKER_PROVIDER: ${OPENBOT_BROKER_PROVIDER:-}
      # A Google or xAI sign-in, which the server reads and renews itself. The file is on the host,
      # at `.openbot/model-oauth.json` beside this one, and reaches the container through the mount
      # below, so a host path here becomes the mount's. Empty stays empty: no sign-in, no file.
      OPENBOT_MODEL_OAUTH_FILE: ${OPENBOT_MODEL_OAUTH_FILE:+/openbot/model-oauth.json}
      # The secret local Intelligence's Learning agent sends when it asks the person's Claude or
      # ChatGPT plan for a step (server/src/learning/model-endpoint.ts). OpenBot Desktop mints it
      # once per installation and gives it to this service and that agent alone.
      OPENBOT_LEARNING_MODEL_TOKEN: ${LEARNING_MODEL_TOKEN:-}
    # Who the server runs as. The image's own user by default. On Linux the desktop names the host's,
    # because the sign-in file below is the host user's and readable by nobody else, and a bind mount
    # there keeps the host's numbers; Docker Desktop's file sharing on macOS and Windows does not.
    # Under rootless Podman on Linux it names container root, which that user namespace maps to the
    # host user; any other uid there is one of their subordinate ids and cannot read the file.
    user: "${OPENBOT_SERVER_USER:-1001:1001}"
    volumes:
      # The directory, not the file: the server renews the token by writing a sibling and renaming it
      # over the original, which a single-file mount cannot take. Not created here, because Docker
      # would create it as root on Linux and the desktop could then not write its sign-in into it;
      # whoever starts this service makes it first.
      - type: bind
        source: ./.openbot
        target: /openbot
        bind:
          create_host_path: false
    ports:
      # Two host ports, one process. The app's is the address a window is given: the server serves
      # the built app itself, so that one port reaches both halves on one origin. The server's is
      # where everything else on the host already calls it, OpenBot Desktop's host-access broker
      # among them. Loopback, for the reason every other port here is.
      #
      # SERVER_APP_PORT set empty publishes the app's copy on no fixed port, which is how
      # `scripts/start.sh` leaves APP_PORT to the checkout's own app, served by Vite. `-`, not `:-`,
      # so empty is not the same as unset.
      - "127.0.0.1:${SERVER_APP_PORT-${APP_PORT:-3010}}:3001"
      - "[::1]:${SERVER_APP_PORT-${APP_PORT:-3010}}:3001"
      - "127.0.0.1:${SERVER_PORT:-3001}:3001"
      - "[::1]:${SERVER_PORT:-3001}:3001"
    # For whatever stays on the host and is addressed as such: a model endpoint on this machine, and
    # anything else the Bots below already reach the same way. OpenBot Desktop sets
    # `OPENBOT_HOST_GATEWAY` under rootless Podman on Linux, where `host-gateway` is not this
    # machine's loopback and the address it gives is.
    extra_hosts:
      - "host.docker.internal:${OPENBOT_HOST_GATEWAY:-host-gateway}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://127.0.0.1:3001/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    # Both: `data` for the database, `default` for the Bots, the computers and the supervisor. This is
    # the one service the note on `networks:` at the end of this file says may sit on both.
    networks:
      - data
      - default

  # The routines worker, from the same image: the server's own sweep in a loop, which a local
  # deployment runs rather than a CronJob.
  worker:
    profiles: ["openbot"]
    image: *server-image
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    command: ["bun", "../worker/src/index.ts"]
    # Its three settings and nothing else. It is handed no `.env`: it does not read the deployment's
    # configuration, and the less this process holds, the less a mistake in it can spend.
    environment:
      DATABASE_URL: postgres://openbot:openbot@postgres:5432/openbot
      SERVER_INTERNAL_URL: http://server:3001
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-openbot-dev-worker-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
      server:
        condition: service_started
    restart: unless-stopped
    # `data` only. It reaches the database there, and the server, which is on it too. Nothing a Bot
    # can reach can reach this.
    networks:
      - data

  # The Bot's computer is long-lived so browser sessions remain signed in across turns.
  agent-computer:
    # Named rather than Compose-derived, because the supervisor starts one computer per Bot from this
    # image by name. Pulled like the server's; see migrate above.
    image: &computer-image ${COMPUTER_IMAGE:-ghcr.io/copilotkit/openbot-agent-computer:${OPENBOT_BACKEND_TAG:-see-backend-images.env}}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    # A Bot's shell runs `ping`, which needs raw ICMP sockets. Docker grants NET_RAW by default and
    # Podman does not, so without this ping fails with "Operation not permitted" on Podman (the
    # Desktop's engine on Windows), even as root. Asked for here so both engines give the same.
    cap_add:
      - NET_RAW
    ports:
      # Loopback only. This process drives a browser holding real logins; COMPUTER_TOKEN is the
      # request control, and loopback keeps the surface off routed networks.
      - "127.0.0.1:${COMPUTER_PORT:-4100}:4100"
      - "[::1]:${COMPUTER_PORT:-4100}:4100"
    # Per-Bot egress, in a file of its own because the names are not knowable here.
    #
    # `EGRESS_PROXY_<BOT>` is derived from the Bot's id, so there is no fixed list to write out the
    # way COMPUTER_TOKEN is. Not `.env`: that holds the deployment's secrets, and this container
    # drives a browser and runs a Bot's shell, so it is given what it needs and not the rest.
    # Optional, because going out directly is the ordinary case and must still start.
    env_file:
      - path: ./egress.env
        required: false
    environment:
      # The secret every caller must present. The container refuses to start without it.
      #
      # The default matches the one scripts/start.sh applies when .env leaves this blank, which
      # .env.example does. Without it the two paths disagree: the script exports a value and brings
      # the stack up working, while a plain `docker compose up -d` -- which this project's own
      # shutdown notes tell you to use -- hands the container an empty string instead. Reaches only
      # a loopback-bound port; a deployment sets a real value in .env.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-openbot-dev-computer-token}
      # Headed by default: full Chromium on the container's own X server, behind the same streamed
      # screen, which bot checks such as Cloudflare's challenge far less than headless. `headless`
      # still chooses headless, for a smaller footprint where the sites a Bot uses do not mind.
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headed}
      # How many Bots may hold a running browser at once, and how long an untouched one is kept.
      # A few hundred MB each, so on a deployment with many Bots these are the difference between
      # a container that holds steady and one that is killed for memory. Defaults are 8 and 30
      # minutes; closing a browser costs only a relaunch, because the profile is on the volume below.
      COMPUTER_MAX_BROWSERS: ${COMPUTER_MAX_BROWSERS:-}
      COMPUTER_BROWSER_IDLE_MS: ${COMPUTER_BROWSER_IDLE_MS:-}
      # At what share of the container's memory it starts closing browsers nobody is using, least
      # recently used first, down to ten points under (default 85), and how long a Bot's background
      # tab may sit untouched (default ten minutes). A container with no --memory is measured against
      # the machine's memory. 0 switches either off.
      COMPUTER_MEMORY_HIGH_PERCENT: ${COMPUTER_MEMORY_HIGH_PERCENT:-}
      COMPUTER_TAB_IDLE_MS: ${COMPUTER_TAB_IDLE_MS:-}
      # Every Bot without a computer of its own reaches this one, so each gets its own folder of
      # files and its shell starts there. The supervisor's per-Bot computers do not need it.
      COMPUTER_SEPARATE_WORKSPACES: "on"
      # Set by scripts/start.sh in the personal edition, where every Bot on this computer is the one
      # person's: it is theirs, so Record runs in their Bots' browsers here (person-access.ts). Empty
      # everywhere else, where the Bots here may be anybody's and Record is refused.
      COMPUTER_PERSON_ID: ${COMPUTER_PERSON_ID:-}
      # The edition, read beside it: the personal edition's one computer also runs the person's own
      # browser, shown in the page, because every Bot here is theirs (person-access.ts). A team's
      # person's computer never does.
      OPENBOT_EDITION: ${OPENBOT_EDITION:-}
      # The laptop's loopback addresses a browser here is handed, as this container reaches them
      # (`<port>=<host>:<port>`, comma-separated). The Recorder reaches OpenBot only at https or at
      # loopback, so on a laptop it is given `http://127.0.0.1:<port>`, which in here is this
      # container. OpenBot Desktop sets it; unset, nothing is relayed (loopback-relay.ts).
      COMPUTER_LOOPBACK_RELAYS: ${COMPUTER_LOOPBACK_RELAYS:-}
    # Where a relay above sends a local Intelligence gateway: this machine. As for the server.
    extra_hosts:
      - "host.docker.internal:${OPENBOT_HOST_GATEWAY:-host-gateway}"
    volumes:
      - agent-workspace:/workspace
      # Chromium's user-data directory is volume-backed so logins survive container restarts.
      - agent-profiles:/profiles
    # Gives Chromium time to flush its profile after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # One computer per Bot.
  #
  # Each Bot gets a container with its own files, browser session and processes. The Docker socket is
  # root-equivalent on the host, so only the supervisor holds it and only exposes Bot-level verbs.
  supervisor:
    # Pulled like the server's; see migrate above.
    image: ${SUPERVISOR_IMAGE:-ghcr.io/copilotkit/openbot-supervisor:${OPENBOT_BACKEND_TAG:-see-backend-images.env}}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    # The same file, because this process does not read these itself: it forwards every EGRESS_PROXY
    # key out of its own environment into each computer it creates, so it has to be given them first.
    env_file:
      - path: ./egress.env
        required: false
    environment:
      PORT: "4300"
      # Shared with the API server. The Bot-level verb set is the boundary; this token keeps other
      # services on the network from calling those verbs.
      # Defaulted for the same reason as agent-computer's above: so `docker compose up -d` by hand
      # configures the same stack scripts/start.sh does, rather than a silently unauthenticated one.
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-openbot-dev-supervisor-token}
      # Never handed to a computer as it is. Each computer this creates is given a token of its own,
      # derived from this and whose computer it is, and the server derives the same one to call it
      # (shared/computer-token.ts), so a Bot that reads its own computer's token opens no other.
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-openbot-dev-computer-token}
      # Forwarded into every per-Bot computer the supervisor creates. Headed, as above.
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headed}
      # The same image the shared computer above runs.
      COMPUTER_IMAGE: *computer-image
      # Which deployment the computers it creates belong to, so two stacks on one Docker host never
      # derive the same container and volume names for the same Bot.
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-openbot}
      # Empty by default because the API server runs on the host in local development and reaches
      # computers by published loopback ports. Deployments running the server inside this network set
      # the network name so computers publish no host ports.
      COMPUTER_NETWORK: ${COMPUTER_NETWORK:-}
      # Set to runsc to run every computer under gVisor, when the host has it. Left unset each
      # computer is an ordinary container and shares the host kernel.
      COMPUTER_RUNTIME: ${COMPUTER_RUNTIME:-}
    ports:
      # For the server on the host to ask for a Bot's computer.
      #
      # Loopback only, like the computer's own port and for a stronger version of the same reason.
      # This process holds the Docker socket, so reaching it is root on the host through four verbs,
      # and SUPERVISOR_TOKEN is a shared secret rather than a network boundary. Published without an
      # interface in front of it this answered every address the host has.
      #
      # A deployment running the server inside this network does not use this mapping at all: it sets
      # COMPUTER_NETWORK and reaches the supervisor as `supervisor:4300`, which is unaffected because
      # the process still listens on every interface inside its own container.
      - "127.0.0.1:${SUPERVISOR_PORT:-4500}:4300"
      - "[::1]:${SUPERVISOR_PORT:-4500}:4300"
    volumes:
      # Read-only because this service only ever needs to ask; it is still root-equivalent, which is
      # the whole reason nothing else here gets it.
      #
      # The source is a setting because the default is wrong on one of the engines this runs on.
      # Docker puts its socket at this path, and so does Podman on macOS, where `podman machine`
      # symlinks it to the rootless socket inside the virtual machine. Rootless Podman on Linux does
      # not: the path is either absent or, with podman-docker installed, a symlink to
      # /run/podman/podman.sock, which is the *rootful* socket and is not the one running. The
      # supervisor then holds a dead socket and reports that it cannot reach Docker. Point
      # ENGINE_SOCKET at $XDG_RUNTIME_DIR/podman/podman.sock there.
      - ${ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    security_opt:
      # The engine socket carries an SELinux label this container is not allowed to read.
      - label=disable
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:4300/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # The harness somebody picked during setup, whichever one it is.
  #
  # ONE SERVICE RATHER THAN TWELVE, because a picked harness is a choice and not twelve branches in
  # this file. The image and the port come from `.env`, which the shell writes from the pick, and
  # both are facts about the image: each harness fixes its own port in its own Dockerfile.
  #
  # Behind a profile so a deployment that has picked nothing does not try to start it.
  #
  # The image still needs a value when nothing is picked. Older Compose (v2.24.5, as
  # shipped with Docker Desktop in early 2024) checks every service before it looks at profiles,
  # and a blank image there fails `compose config` for the whole project with "has neither
  # an image nor a build context specified". The stand-in is busybox: it is never pulled or started
  # while the profile is off, and the desktop shell only turns the profile on after writing the
  # picked image to `.env`.
  #
  # No `build:`, so `pull_policy` cannot be `build` here as it is elsewhere: this image is only ever
  # published, never built from this tree.
  agent-harness:
    profiles: ["harness"]
    image: ${PICKED_HARNESS_IMAGE:-busybox:1.37}
    pull_policy: missing
    ports:
      # Loopback, and on the image's own port on both sides. The server is a host process, so it
      # reaches this the same way it reaches the managed Bot: over the published port, not the
      # compose network.
      - "127.0.0.1:${PICKED_HARNESS_PORT:-4202}:${PICKED_HARNESS_PORT:-4202}"
      - "[::1]:${PICKED_HARNESS_PORT:-4202}:${PICKED_HARNESS_PORT:-4202}"
    environment:
      # Every harness refuses without this; it is what makes the endpoint the server's alone.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      # Deployment-owned tools use the same signed callback as the managed Bot.
      OPENBOT_TOOL_URL: ${OPENBOT_TOOL_URL:-http://host.docker.internal:3001/api/agent-tools/call}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
      # Whichever the model screen chose. A harness reads the one its provider needs and ignores the
      # rest, and the ones the choice did not imply are written empty rather than left stale: see
      # `ModelCredential`.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_BASE_URL: ${GOOGLE_GENERATIVE_AI_BASE_URL:-}
      BOT_PROVIDER: ${BOT_PROVIDER:-openai}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # A path into the mount below, set only when a ChatGPT plan was signed in to. The file is
      # there either way; this variable is what tells the harness to read it.
      CHATGPT_AUTH_FILE: ${CHATGPT_AUTH_FILE:-}
      # Empty when nobody named one, never a stand-in that looks like a choice. The server sends the
      # model on every run (`forwardedProps.openbotModel`): the one named here when the credential
      # lists it, otherwise the middle of the provider's line. A stand-in here was how a ChatGPT
      # plan ran gpt-5.5, which it refuses.
      BOT_MODEL: ${BOT_MODEL:-}
    extra_hosts:
      - "host.docker.internal:${OPENBOT_HOST_GATEWAY:-host-gateway}"
    volumes:
      # A bind mount, not a named volume, and read-write on purpose. The signed-in plan's access
      # token expires within the hour and the harness renews it, so the renewal has to land back on
      # this machine or every restart would replay a refresh token that had already been spent.
      #
      # The provider writes by atomically replacing the file with a sibling temporary file, so the
      # mount has to be the containing directory rather than the file mount point.
      - ./.langchain:/root/.langchain

  # The managed Bot: the one the deployment runs for itself, registered the way a customer's own Bot
  # is, as an AG-UI endpoint in the registry (the tenant package names it by MANAGED_AGENT_AG_UI_URL).
  # It is the LangGraph harness, the same image a person can pick in setup.
  agent-langgraph-agui:
    build:
      context: .
      dockerfile: agent-langgraph-agui/Dockerfile
    # Built from this checkout. A release publishes it too, and IMAGE_PULL_POLICY=missing pulls that
    # instead, as OpenBot Desktop does.
    image: ${LANGGRAPH_IMAGE:-openbot-agent-langgraph-agui:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    ports:
      # Loopback, not every interface. The token is the boundary; this means an attacker needs to be
      # on the machine before they can even try it. Nothing legitimate reaches a Bot from another
      # host: the server calls it over loopback, and other containers use the compose network.
      #
      # LANGGRAPH_PORT on the host and the image's own 4206 inside, so a picked harness that is this
      # same image keeps 4206 on the host to itself.
      - "127.0.0.1:${LANGGRAPH_PORT:-4201}:4206"
      - "[::1]:${LANGGRAPH_PORT:-4201}:4206"
    environment:
      # The selected provider reads its own key.
      BOT_PROVIDER: ${BOT_PROVIDER:-openai}
      # The server sends this on every call to the managed Bot, which refuses every call without it.
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_BASE_URL: ${GOOGLE_GENERATIVE_AI_BASE_URL:-}
      # Empty when nobody named one: the server sends the model on every run.
      BOT_MODEL: ${BOT_MODEL:-}
      # Where this Bot runs a tool: back through the deployment that granted it, never at the vendor.
      # `host.docker.internal` because the API server runs on the host, not in this network.
      #
      # Left as the default even though `server` above is now in this file, because the default is
      # what `scripts/start.sh` relies on and that server is on the host. A deployment that starts
      # `server` sets this to `http://server:3001/api/agent-tools/call`, for every Bot at once.
      OPENBOT_TOOL_URL: ${OPENBOT_TOOL_URL:-http://host.docker.internal:3001/api/agent-tools/call}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:${OPENBOT_HOST_GATEWAY:-host-gateway}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4206/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # The database and the services that reach it by name. Nothing a Bot can reach is on it.
  #
  # `server` is on both this and `default`, which is the one place the two are meant to meet.
  data:
  # Everything else, which is where `default` already put it. Named here only so that adding a
  # service without a `networks:` key keeps landing beside the Bots rather than beside the database.
  default:

volumes:
  postgres-data:
  agent-workspace:
  agent-profiles:
