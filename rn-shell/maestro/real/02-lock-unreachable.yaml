# REAL NETWORK: a backend address that does not resolve. Sign in finds no server: the lock screen.
appId: ai.openbot.rnshell
---
- launchApp:
    clearState: true
    arguments:
      openbot.base_url: "https://openbot-unreachable.invalid"
      openbot.reset: "1"
      openbot.test_name: "real-lock"
- extendedWaitUntil:
    visible:
      id: "sign-in-button"
    timeout: 30000
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible: "Cannot reach the OpenBot backend"
    timeout: 30000
- assertVisible:
    id: "debug-state"
    text: ".*lock=load-failed.*"
- takeScreenshot: lock-unreachable
