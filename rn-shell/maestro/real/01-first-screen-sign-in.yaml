# REAL BACKEND (https://my.open.bot, the default of every build). The first screen, then Sign in. Since
# 28 Nov 2026 my.open.bot answers the hand-off config ({"handoff":true,"callback":"scheme"}), so the
# system sheet opens the real hand-off: iOS asks for consent first. The sheet shows the real sign-in
# page; nobody signs in (no Google sign-ins in CI), the sheet is closed, and the first screen is back.
# A server without the hand-off would open the web sign-in instead (tested on mock stack B).
appId: ai.openbot.rnshell
---
- launchApp:
    clearState: true
    arguments:
      openbot.reset: "1"
      openbot.test_name: "real-first-screen"
- extendedWaitUntil:
    visible:
      id: "sign-in-button"
    timeout: 30000
- takeScreenshot: first-screen
- tapOn:
    id: "sign-in-button"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 20000
      - takeScreenshot: sheet-consent
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "(?i).*(google|github|microsoft|continue with|sign in|log in|email).*"
          timeout: 40000
      - takeScreenshot: real-sign-in-sheet
      - tapOn: "Cancel"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "(?i).*(google|github|microsoft|continue with|sign in|log in|email).*"
          timeout: 40000
      - takeScreenshot: real-sign-in-custom-tab
      - back
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*phase=signedOut signIn=idle.*"
    timeout: 15000
- assertVisible:
    id: "sign-in-button"
