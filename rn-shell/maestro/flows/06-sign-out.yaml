# Sign out is the web app's own (Account menu); the bridge's signed-out returns to the first screen.
appId: ai.openbot.rnshell
# Android: read the web view's content through DevTools (test builds enable web view debugging);
# Chromium's accessibility tree is sometimes not populated when UiAutomator asks.
androidWebViewHierarchy: devtools
---
- runFlow: ../subflows/launch-signed-in.yaml
- extendedWaitUntil:
    visible: "Account"
    timeout: 20000
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 10000
- takeScreenshot: account-menu
- tapOn: "Sign out"
- extendedWaitUntil:
    visible:
      id: "sign-in-button"
    timeout: 20000
- assertVisible:
    id: "debug-state"
    text: ".*phase=signedOut.*"
- assertNotVisible:
    id: "openbot-webview"
- takeScreenshot: signed-out
