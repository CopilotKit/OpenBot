# A relaunch keeps the session (the web view's cookie store): straight to the tabs, no first screen.
appId: ai.openbot.rnshell
---
- runFlow: ../subflows/launch-signed-in.yaml
# Home first, and a moment: WebKit writes cookies to disk lazily.
- pressKey: Home
- extendedWaitUntil:
    visible: "a text that never appears, to wait 3 s"
    timeout: 3000
    optional: true
- launchApp:
    stopApp: true
    arguments:
      openbot.base_url: "${BASE_A}"
      openbot.test_name: "relaunch"
- runFlow: ../subflows/wait-signed-in.yaml
- assertNotVisible:
    id: "sign-in-button"
- takeScreenshot: relaunched
