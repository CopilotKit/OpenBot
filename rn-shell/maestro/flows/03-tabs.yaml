# The tab bar asks the page to navigate (openbot:open); the page's route reports select the tab.
appId: ai.openbot.rnshell
---
- runFlow: ../subflows/launch-signed-in.yaml
- tapOn:
    id: "tab-conversations"
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*tab=conversations nav=event.*path=/conversations.*"
    timeout: 20000
- takeScreenshot: conversations
- tapOn:
    id: "tab-bots"
# "New Bot" is at the top of the Bots page (its list scrolls; the emulator also ghosts this page's
# drawing, the same as for the native shell).
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*tab=bots.*path=/bots.*"
    timeout: 20000
- takeScreenshot: bots
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*tab=home.*path=/ .*"
    timeout: 20000
