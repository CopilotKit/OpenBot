# Part 2: after the kill the app recovers to a page (skeleton, reload), never a white page or a crash.
appId: ai.openbot.rnshell
---
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*phase=signedIn.*skeleton=0.*"
    timeout: 45000
# The page is back on Bots (native state: the page reported its route and drew text).
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*tab=bots.*path=/bots.*ready=1.*"
    timeout: 30000
- takeScreenshot: after-kill
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*tab=home.*path=/ .*"
    timeout: 20000
