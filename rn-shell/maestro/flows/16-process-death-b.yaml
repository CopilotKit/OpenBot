# Part 2: after the kill the app recovers to a page (skeleton, reload), never a white page or a crash.
appId: ai.openbot.rnshell
# Android: read the web view's content through DevTools (test builds enable web view debugging);
# Chromium's accessibility tree is sometimes not populated when UiAutomator asks.
androidWebViewHierarchy: devtools
---
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*phase=signedIn.*skeleton=0.*"
    timeout: 45000
- extendedWaitUntil:
    visible: "New Bot"
    timeout: 30000
- takeScreenshot: after-kill
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Start a conversation"
    timeout: 20000
