# Offline for 8 s while signed in: the lock screen, then the app comes back by itself.
appId: ai.openbot.rnshell
# Android: read the web view's content through DevTools (test builds enable web view debugging);
# Chromium's accessibility tree is sometimes not populated when UiAutomator asks.
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
    arguments:
      openbot.base_url: "${BASE_A}"
      openbot.reset: "1"
      openbot.plain_session_cookie: "mock"
      openbot.force_offline_seconds: "8"
      openbot.test_name: "lock-recovers"
- extendedWaitUntil:
    visible: "Cannot reach the OpenBot backend"
    timeout: 15000
- takeScreenshot: lock-before
- extendedWaitUntil:
    notVisible: "Cannot reach the OpenBot backend"
    timeout: 30000
- runFlow: ../subflows/wait-signed-in.yaml
- assertVisible: "Start a conversation"
- takeScreenshot: lock-lifted
