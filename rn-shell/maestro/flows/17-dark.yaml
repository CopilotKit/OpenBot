# Dark mode: the first screen and the lock screen.
appId: ai.openbot.rnshell
# Android: read the web view's content through DevTools (test builds enable web view debugging);
# Chromium's accessibility tree is sometimes not populated when UiAutomator asks.
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
    arguments:
      openbot.base_url: "${BASE_A}"
      openbot.reset: "1"
      openbot.force_dark: "1"
      openbot.test_name: "dark"
- extendedWaitUntil:
    visible:
      id: "sign-in-button"
    timeout: 30000
- takeScreenshot: first-screen-dark
- launchApp:
    stopApp: true
    arguments:
      openbot.base_url: "${BASE_A}"
      openbot.force_dark: "1"
      openbot.force_offline: "1"
- extendedWaitUntil:
    visible: "Cannot reach the OpenBot backend"
    timeout: 20000
- takeScreenshot: lock-dark
