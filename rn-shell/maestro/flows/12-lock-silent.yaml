# A server that never answers: the skeleton covers the wait, the lock screen replaces it at the 20 s
# watchdog, never a blank frame between.
appId: ai.openbot.rnshell
# Android: read the web view's content through DevTools (test builds enable web view debugging);
# Chromium's accessibility tree is sometimes not populated when UiAutomator asks.
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
    arguments:
      openbot.base_url: "${BASE_SILENT}"
      openbot.reset: "1"
      openbot.plain_session_cookie: "mock"
      openbot.test_name: "lock-silent"
- extendedWaitUntil:
    visible:
      id: "loading-skeleton"
    timeout: 15000
- takeScreenshot: silent-skeleton
- extendedWaitUntil:
    visible: "Cannot reach the OpenBot backend"
    timeout: 40000
- assertVisible:
    id: "debug-state"
    text: ".*lock=load-failed.*"
- takeScreenshot: silent-lock
