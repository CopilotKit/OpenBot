# The keyboard in a conversation: the message box and Send above it, sending keeps it up, a drag down
# puts it away and the tab bar comes back.
appId: ai.openbot.rnshell
---
- runFlow: ../subflows/launch-signed-in.yaml
- tapOn:
    id: "tab-conversations"
- extendedWaitUntil:
    visible: "Quarterly forecast"
    timeout: 20000
- tapOn: "Quarterly forecast"
- extendedWaitUntil:
    visible: "Here is the first draft."
    timeout: 20000
# The conversation may have focused its box already; tap it either way.
- tapOn:
    text: "(Message|Ask anything)"
    # Home's orb keeps moving: do not wait for the screen to settle.
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*keyboard=1.*"
    timeout: 10000
- inputText: "Changes?"
- assertVisible: "Send message"
- takeScreenshot: conversation-keyboard
- tapOn: "Send message"
- assertVisible:
    id: "debug-state"
    text: ".*keyboard=1.*"
- takeScreenshot: conversation-sent
# While the keyboard is up the tab bar is hidden (by design); a drag down puts the keyboard away and
# the tab bar comes back right under the web view.
- swipe:
    start: "50%, 30%"
    end: "50%, 60%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*keyboard=0.*"
    timeout: 10000
- assertVisible:
    id: "tab-bar"
- takeScreenshot: conversation-keyboard-down
