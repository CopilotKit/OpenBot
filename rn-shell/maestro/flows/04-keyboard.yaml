# The keyboard on Home: the web view ends at its top edge (Send stays above it), the tab bar hides
# while it is up and comes back after, and a drag down on a page that does not scroll puts it away.
appId: ai.openbot.rnshell
---
- runFlow: ../subflows/launch-signed-in.yaml
- tapOn:
    text: "(Message|Ask anything)"
    # Home's orb keeps moving: do not wait for the screen to settle.
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*keyboard=1.*"
    timeout: 10000
- inputText: "Hello"
- assertNotVisible:
    id: "tab-bar"
- assertVisible: "Send message"
- takeScreenshot: home-keyboard
- swipe:
    start: "50%, 30%"
    end: "50%, 60%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*keyboard=0.*"
    timeout: 10000
- assertVisible:
    id: "tab-bar"
- takeScreenshot: home-keyboard-down
