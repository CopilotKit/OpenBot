# The keyboard on Home: the web view ends at its top edge (Send stays above it), the tab bar hides
# while it is up and comes back after, and a drag down on a page that does not scroll puts it away.
appId: ai.openbot.rnshell
# Android: read the web view's content through DevTools (test builds enable web view debugging);
# Chromium's accessibility tree is sometimes not populated when UiAutomator asks.
androidWebViewHierarchy: devtools
---
- runFlow: ../subflows/launch-signed-in.yaml
- tapOn: "(Message|Ask anything)"
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*keyboard=1.*"
    timeout: 10000
- inputText: "Hello from Maestro"
- assertNotVisible:
    id: "tab-bar"
- assertVisible: "Send message"
- takeScreenshot: home-keyboard
- swipe:
    start: "50%, 30%"
    end: "50%, 60%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*keyboard=0.*"
    timeout: 10000
- assertVisible:
    id: "tab-bar"
- takeScreenshot: home-keyboard-down
