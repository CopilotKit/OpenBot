# Sign in from the first screen through the system sign-in sheet on mock stack A.
# iOS: ASWebAuthenticationSession asks first ("OpenBot" Wants to Use "localhost" to Sign In); the mock
# page then follows its own link (openbot.handoff_auto). Android: a Chrome Custom Tab, which follows it
# too (flow 18 taps the link by hand).
appId: ai.openbot.rnshell
# Android: read the web view's content through DevTools (test builds enable web view debugging);
# Chromium's accessibility tree is sometimes not populated when UiAutomator asks.
androidWebViewHierarchy: devtools
---
- tapOn:
    id: "sign-in-button"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 20000
      - takeScreenshot: sheet-consent
      - tapOn: "Continue"
# Android: Chrome follows the mock's automatic link (openbot.handoff_auto) on its own.
