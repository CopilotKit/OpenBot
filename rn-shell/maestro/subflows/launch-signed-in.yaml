# A known starting state for flows that need a signed-in app: app data cleared, then signed in with
# the mock's session cookie (a test build's hook), straight to Home. The hand-off itself is tested on
# its own (flow 02), so its flakiness never fails the flows after it.
appId: ai.openbot.rnshell
---
- launchApp:
    clearState: true
    arguments:
      openbot.base_url: "${BASE_A}"
      openbot.reset: "1"
      openbot.plain_session_cookie: "mock"
- runFlow: wait-signed-in.yaml
# Native state, not the page's text: Chromium's accessibility tree is sometimes not populated when
# UiAutomator asks, so the flows check the web content only where they act on it.
- extendedWaitUntil:
    visible:
      id: "debug-state"
      text: ".*path=/ .*ready=1.*"
    timeout: 20000
