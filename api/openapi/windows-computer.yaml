# Windows computer: the Windows computer a person and a Bot take turns on, and the person's teaching recordings on it.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
#
# Experimental. An OpenBot has a Windows computer only when one is set up for it, and it answers only the one
# person it was set up for; to anybody else it does not exist.
paths:
  /api/v2/organizations/{organizationId}/windows-computer:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Windows computer]
      operationId: getWindowsComputer
      summary: Read the caller's Windows computer
      description: >-
        Say whether the caller's Windows computer is ready, who is using it,
        the caller or their Bot, and what is being recorded on it. Each person
        reads only their own: a person has one in each organization.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [computers:read]
        - apiKey: []
      responses:
        '200':
          description: The Windows computer, who is using it, and its recording.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowsComputer'
              examples:
                answer:
                  $ref: '#/components/examples/WindowsComputerExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WindowsComputerNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/windows-computer/control/take:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Windows computer]
      operationId: takeWindowsComputerControl
      summary: Take over the Windows computer
      description: >-
        Give the caller the Windows computer's mouse and keyboard. The Bot's actions
        are refused until it is handed back. The audit trail records the
        takeover.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Who is using the Windows computer afterwards.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowsComputerControl'
              examples:
                answer:
                  $ref: '#/components/examples/WindowsComputerControlTakenExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WindowsComputerNotFound'
        '409':
          $ref: '#/components/responses/WindowsComputerConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/WindowsComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/windows-computer/control/release:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Windows computer]
      operationId: releaseWindowsComputerControl
      summary: Hand the Windows computer back
      description: >-
        Hand the Windows computer's mouse and keyboard back to the Bot. The Bot looks
        at the screen again before its next action. The audit trail records
        the hand-back.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Who is using the Windows computer afterwards.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowsComputerControl'
              examples:
                answer:
                  $ref: '#/components/examples/WindowsComputerControlReleasedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WindowsComputerNotFound'
        '409':
          $ref: '#/components/responses/WindowsComputerConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/WindowsComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/windows-computer/recording/start:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Windows computer]
      operationId: startWindowsComputerRecording
      summary: Start recording on the Windows computer
      description: >-
        Start recording what the caller does in the named apps on their
        Windows computer, so OpenBot can learn how they do the task. What they type
        into a password field, or a field whose kind can't be told, is never
        recorded. The recording goes to the caller's own Learning space.
        Saying what you are showing, in narration, is what OpenBot learns
        most from.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsComputerRecordingStart'
            examples:
              start:
                value:
                  title: Save a meeting note
                  narration: I open Notepad, type the note, press Ctrl+S and save it under the meeting's date.
                  apps: [notepad.exe]
      responses:
        '200':
          description: The recording, started.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowsComputerRecording'
              examples:
                answer:
                  $ref: '#/components/examples/WindowsComputerRecordingStartedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WindowsComputerNotFound'
        '409':
          $ref: '#/components/responses/WindowsComputerConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/WindowsComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/windows-computer/recording/stop:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Windows computer]
      operationId: stopWindowsComputerRecording
      summary: Stop recording on the Windows computer
      description: >-
        Stop the recording, send what is left of it to Learning, and say
        whether the task worked. Answers once everything recorded has been
        sent, or once it has waited long enough; what could not be sent is
        counted in gaps.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsComputerRecordingStop'
            examples:
              worked:
                value:
                  outcome: succeeded
              failed:
                value:
                  outcome: failed
                  reason: The save dialog asked for a folder I don't have.
      responses:
        '200':
          description: The recording, stopped.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowsComputerRecording'
              examples:
                answer:
                  $ref: '#/components/examples/WindowsComputerRecordingStoppedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WindowsComputerNotFound'
        '409':
          $ref: '#/components/responses/WindowsComputerConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/WindowsComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/windows-computer/enrollment-codes:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Windows computer]
      operationId: createWindowsComputerEnrollmentCode
      summary: Make a code that connects a Windows computer
      description: >-
        Make a one-time code that connects a Windows computer to the caller:
        OpenBot's program on that computer exchanges it
        (exchangeWindowsComputerEnrollmentCode) and from then on connects to
        OpenBot by itself, so OpenBot never has to reach into the computer's
        network. The code is in this answer and never again, works once and
        expires in fifteen minutes. Because it is a credential the answer is
        not kept: a retry with the same Idempotency-Key is refused as a
        conflict rather than answered with the code again, so make a new code
        with a new key. A person makes codes only for their own Windows
        computer, and only so many at once.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The code, shown this once.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowsComputerEnrollmentCode'
              examples:
                answer:
                  $ref: '#/components/examples/WindowsComputerEnrollmentCodeExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WindowsComputerNotFound'
        '409':
          $ref: '#/components/responses/WindowsComputerConflict'
        '429':
          $ref: '#/components/responses/TooManyWindowsComputerEnrollmentCodes'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/windows-computer/connections:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Windows computer]
      operationId: exchangeWindowsComputerEnrollmentCode
      summary: Connect a Windows computer with a code
      description: >-
        Exchange an enrollment code (createWindowsComputerEnrollmentCode) for
        the Windows computer's own credential, shown this once, which it opens
        its link to OpenBot with from now on (the windowsComputerLink socket).
        Nobody is signed in here: the code in the body is the credential and
        works once. organizationId is `default` or the code's own
        organization, and either way the Windows computer is connected in the
        organization the code was made in. A Windows computer connected
        before, for the same person, is disconnected: a person has one. Every
        refusal is written to the audit trail. The answer is never kept,
        because it holds the credential.
      security: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsComputerEnrollmentExchange'
            examples:
              exchange:
                value:
                  code: obwe_3q2-7wEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE0
                  name: DESKTOP-4F2K9QA
      responses:
        '201':
          description: The Windows computer's credential, shown this once.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowsComputerConnectionGrant'
              examples:
                answer:
                  $ref: '#/components/examples/WindowsComputerConnectionGrantExample'
        '400':
          $ref: '#/components/responses/InvalidWindowsComputerEnrollmentCode'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  schemas:
    WindowsComputer:
      type: object
      description: >-
        The caller's Windows computer in this organization, who is using it, and
        what is being recorded on it. Every Bot of theirs set to work on a Windows
        computer (computer: windows) works on this one.
      required: [available, control, recording]
      properties:
        available:
          type: boolean
          description: True when the Windows computer answers, its session is unlocked and a Bot can use it.
        connected:
          type: boolean
          description: >-
            True when the Windows computer has connected with an enrollment
            code and its link to OpenBot is open now. False when none is
            connected yet (make an enrollment code) or it is off, asleep or
            offline.
        enrolled:
          type: boolean
          description: True when a Windows computer was connected with an enrollment code and not disconnected since.
        unavailableReason:
          type: string
          description: >-
            Why it isn't available, when it isn't: not_enrolled,
            not_connected, locked, secure_desktop, driver_down, stopped,
            unavailable or unreachable.
        control:
          description: Who is using it. Null when the Windows computer did not answer.
          oneOf:
            - $ref: '#/components/schemas/WindowsComputerControl'
            - type: 'null'
        recording:
          $ref: '#/components/schemas/WindowsComputerRecording'
    WindowsComputerControl:
      type: object
      description: Who has the Windows computer's mouse and keyboard.
      required: [holder, since, snapshotRequired]
      properties:
        holder:
          type: string
          enum: [bot, human]
        since:
          type: string
          description: When it changed hands.
        reason:
          type: string
          description: >-
            Why it is with whoever has it. A person: taken (they took over in
            OpenBot) or interference (the Windows computer saw them use it while
            the Bot was). The Bot: idle (the Windows computer handed it back
            because the person who had taken it over had not used it for a
            while); absent when it was handed back by name.
        snapshotRequired:
          type: boolean
          description: True when the Bot must look at the screen again before it acts.
    WindowsComputerRecordingEvents:
      type: object
      description: How much of the recording has reached Learning.
      required: [received, sent, pending, rejected]
      properties:
        received:
          type: integer
          minimum: 0
          description: Steps OpenBot has taken from the Windows computer.
        sent:
          type: integer
          minimum: 0
          description: Steps Learning has accepted.
        pending:
          type: integer
          minimum: 0
          description: Steps waiting to be sent.
        rejected:
          type: integer
          minimum: 0
          description: Steps Learning refused.
    WindowsComputerRecording:
      type: object
      description: A teaching recording on the Windows computer, or idle when there is none.
      required: [state, events, gaps]
      properties:
        state:
          type: string
          x-extensible-enum: [idle, starting, recording, stopping, stopped]
        recordingId:
          type: string
          description: The recording, which is also its trajectory in Learning.
        title:
          type: string
        apps:
          type: array
          items:
            type: string
          description: The apps being recorded, by their program name.
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [succeeded, failed]
        events:
          $ref: '#/components/schemas/WindowsComputerRecordingEvents'
        gaps:
          type: integer
          minimum: 0
          description: >-
            Times something was not recorded or could not be sent: another
            app in front, a locked screen, a step Learning refused.
        buffered:
          type: integer
          minimum: 0
          description: Steps the Windows computer is still holding, when it answered.
        problem:
          type: string
          description: Why the recording isn't reaching Learning right now, when it isn't.
    WindowsComputerRecordingStart:
      type: object
      additionalProperties: false
      required: [title, apps]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The task being shown, in a few words.
        narration:
          type: string
          maxLength: 2000
          description: What you are showing and when to do it this way, in your own words.
        apps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 260
            pattern: \S
          description: The apps to record, by their program name, like notepad.exe. Other apps are left out.
    WindowsComputerRecordingStop:
      type: object
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [succeeded, failed]
          description: Whether the task worked. Succeeded when left out.
        reason:
          type: string
          maxLength: 500
          description: What went wrong, when it failed.
    WindowsComputerEnrollmentCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: The one-time code. A credential, shown this once.
        expiresAt:
          type: string
          format: date-time
    WindowsComputerEnrollmentExchange:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 200
          description: The enrollment code.
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          description: The Windows computer's name, as it calls itself.
    WindowsComputerConnectionGrant:
      type: object
      required: [credential, computerId, organizationId]
      properties:
        credential:
          type: string
          description: >-
            The Windows computer's credential (windowsComputerCredential). A
            credential, shown this once: keep it where only the Windows
            account that runs OpenBot's program can read it.
        computerId:
          type: string
          description: The Windows computer, as OpenBot knows it.
        organizationId:
          type: string
          description: The organization it is connected in, the one the code was made in.
  responses:
    TooManyWindowsComputerEnrollmentCodes:
      description: Too many enrollment codes are live for this person at once.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            codes:
              value:
                type: https://open.bot/errors/rate-limited
                title: Too many requests.
                status: 429
                detail: Too many codes were asked for at once. Wait a few minutes and try again.
                code: RATE_LIMITED
                category: rate_limit
                retryable: true
                requestId: req_example
                traceId: trace_example
    InvalidWindowsComputerEnrollmentCode:
      description: >-
        The request was not complete, the Idempotency-Key is missing, or the
        code is unknown, expired or already used, which all read the same.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            code:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: This code has expired or was already used. Make a new one in OpenBot.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    WindowsComputerNotFound:
      description: >-
        There is no Windows computer here: Windows computers are not on for this
        OpenBot, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/not-found
                title: Not found.
                status: 404
                detail: Windows computers aren't on for this OpenBot.
                code: NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    WindowsComputerConflict:
      description: >-
        The Windows computer can't do this now: a recording is already running, or
        none is, or the Windows computer refused. Or the Idempotency-Key was already
        used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            recording:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: A recording is already running on the Windows computer. Stop it first.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request. Use a new key for a new write.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    WindowsComputerUnavailable:
      description: >-
        The Windows computer didn't answer, or Learning isn't set up or didn't answer:
        nothing was done, and it is worth trying again in a moment.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            windowsComputer:
              value:
                type: https://open.bot/errors/service-unavailable
                title: A service OpenBot depends on is unavailable.
                status: 503
                detail: The Windows computer isn't answering. Try again.
                code: SERVICE_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
            learning:
              value:
                type: https://open.bot/errors/learning-unavailable
                title: Learning is unavailable.
                status: 503
                detail: Couldn't reach Learning to start the recording. Try again.
                code: LEARNING_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
  examples:
    WindowsComputerEnrollmentCodeExample:
      value:
        code: obwe_3q2-7wEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE0
        expiresAt: '2026-11-23T10:15:00.000Z'
    WindowsComputerConnectionGrantExample:
      value:
        credential: obwc_Zk1-EXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLEEX0
        computerId: 6f1d2c3b-4a5e-4f60-8b7a-9c0d1e2f3a4b
        organizationId: default
    WindowsComputerExample:
      value:
        available: true
        control:
          holder: bot
          since: '2026-11-20T09:12:00.000Z'
          snapshotRequired: false
        recording:
          state: recording
          recordingId: 019a8c3e-2b4f-7c1d-9e2a-5f6b7c8d9e0f
          title: Save a meeting note
          apps: [notepad.exe]
          startedAt: '2026-11-20T09:14:03.000Z'
          events:
            received: 12
            sent: 12
            pending: 0
            rejected: 0
          gaps: 0
          buffered: 0
    WindowsComputerControlTakenExample:
      value:
        holder: human
        since: '2026-11-20T09:13:41.000Z'
        reason: taken
        snapshotRequired: true
    WindowsComputerControlReleasedExample:
      value:
        holder: bot
        since: '2026-11-20T09:20:05.000Z'
        snapshotRequired: true
    WindowsComputerRecordingStartedExample:
      value:
        state: recording
        recordingId: 019a8c3e-2b4f-7c1d-9e2a-5f6b7c8d9e0f
        title: Save a meeting note
        apps: [notepad.exe]
        startedAt: '2026-11-20T09:14:03.000Z'
        events:
          received: 0
          sent: 0
          pending: 3
          rejected: 0
        gaps: 0
    WindowsComputerRecordingStoppedExample:
      value:
        state: stopped
        recordingId: 019a8c3e-2b4f-7c1d-9e2a-5f6b7c8d9e0f
        title: Save a meeting note
        apps: [notepad.exe]
        startedAt: '2026-11-20T09:14:03.000Z'
        stoppedAt: '2026-11-20T09:16:40.000Z'
        outcome: succeeded
        events:
          received: 27
          sent: 27
          pending: 0
          rejected: 0
        gaps: 1
