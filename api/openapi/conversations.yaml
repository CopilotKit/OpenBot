      operationId: getAttachment
      summary: Download an attachment
      description: Return the bytes of a file attached to a message, in the type
        OpenBot recognised it as. Only somebody in the conversation it was sent
        in, or the person still holding it to send, can read it.
      security:
        - webSession: []
        - appOAuth:
            - conversations:read
        - apiKey: []
      responses:
        '200':
          description: The file.
          headers:
            ETag:
              description: Names these bytes, for If-None-Match.
              schema:
                type: string
          content:
            # The file's own bytes, in its own type. No schema: a schema here would describe JSON.
            '*/*':
              schema: {}
        '304':
          description: The copy the caller holds is current.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
