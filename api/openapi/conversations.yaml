      - $ref: '#/components/parameters/TaskId'
    post:
      tags:
        - Tasks
      operationId: retryTask
      summary: Try a failed task again
      description: Run the task's failed turn once more, in the task's own
        conversation. Only a task that failed can be tried again. The answer is
        the task as it stands now, which is working.
      security:
        - webSession: []
        - appOAuth:
            - tasks:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The task as it stands now.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              examples:
                example:
                  $ref: '#/components/examples/TaskResponseExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/tasks/{taskId}/stop:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags:
        - Tasks
      operationId: stopTask
      summary: Stop a task
      description: Stop the task's work, as Stop in its conversation does. A
        step it is in the middle of is cut off; the steps it finished stay done,
        and its conversation and the one that asked for it say how far it got.
        What it waits on the person for is no longer asked. Only a task that is
        working or waiting on the person can be stopped. The answer is the task
        as it stands now, which is stopped.
      security:
        - webSession: []
        - appOAuth:
            - tasks:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The task as it stands now.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              examples:
                example:
                  $ref: '#/components/examples/TaskResponseExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/transcriptions:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags:
        - Conversations
      operationId: createTranscription
      summary: Turn a recording into text
      description: Transcribe a short recording of the caller speaking, for
        dictating a message. The recording is WebM, MP4 or WAV audio under 10
        MiB, and is not kept. One recording at a time for each person.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TranscriptionUpload'
      responses:
        '200':
          description: What was said.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
              examples:
                example:
                  $ref: '#/components/examples/TranscriptionExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFile'
        '422':
          $ref: '#/components/responses/NoSpeech'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/product-events:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags:
        - Product events
      operationId: recordProductEvent
      summary: Record that the caller saw or copied a Bot's answer
      description: >-
        Tell OpenBot that the caller saw a Bot's answer on screen, or copied
        it, so OpenBot can count which answers people use. It is best effort:
        a client sends one for each answer it shows or copies, waits on
        nothing, and sends it with keepalive so it still leaves when the page
        closes. The event counts for the caller, and names only the answer.
        Where this OpenBot has product telemetry switched off, it is accepted
        and dropped.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEvent'
            examples:
              viewed:
                $ref: '#/components/examples/ProductEventViewed'
      responses:
        '204':
          description: The event is accepted.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/app-errors:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags:
        - Product events
      operationId: recordAppError
      summary: Report an error the app did not handle
      description: >-
        Tell OpenBot about an error the app hit and did not handle: one its
        error screen caught, or one the page threw or left unhandled. OpenBot
        forwards it with the rest of its product telemetry, so the app never
        holds a telemetry key, and takes out of its message and stack anything
        that could name a person, quote what they wrote, or carry a secret
        before it leaves. It is best effort: a client sends one per error,
        waits on nothing, and sends it with keepalive. Where this OpenBot has
        product telemetry switched off, it is accepted and dropped.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppError'
            examples:
              errorScreen:
                $ref: '#/components/examples/AppErrorBoundary'
      responses:
        '204':
          description: The error is accepted.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  parameters:
    ConversationLimit:
      name: limit
      in: query
      description: Most items in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    MemberId:
      name: memberId
      in: path
      required: true
      description: The person's id.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
      example: usr_9b1c6f0e
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: The attachment's id.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
      example: 0b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
    ConversationThreadId:
      name: threadId
      in: path
      required: true
      description: The thread's id.
      schema:
        type: string
        format: uuid
      example: 6f3d6b1f-6f10-4a53-9d51-5f0d6c0e2f1a
    TaskId:
      name: taskId
      in: path
      required: true
      description: The task's id.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
      example: 7c2d6b1f-6f10-4a53-9d51-5f0d6c0e2f1a
  schemas:
    Reaction:
      type: object
      required: [messageId, agentId, emoji, createdAt]
      properties:
        messageId:
          type: string
          description: The person's message the reaction is on, by the id its conversation gives it.
        agentId:
          type: string
          description: The Bot that reacted.
        emoji:
          type: string
          description: The reaction itself.
          example: 👍
        createdAt:
          type: string
          format: date-time
    ReactionPage:
      type: object
      required: [reactions, nextCursor]
      properties:
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    ConversationJoinToken:
      type: object
      description: >-
        What a client needs to watch a conversation live: a token, and the
        socket and topic to use it on (the threadStream channel of
        api/asyncapi.yaml).
      required:
        - joinToken
        - expiresAt
        - threadId
        - runId
        - realtime
      properties:
        joinToken:
          type: string
          minLength: 1
          description: >-
            Sent as the join_token query parameter when opening the socket. It
            works once.
        expiresAt:
          type: string
          format: date-time
          description: >-
            After this the token no longer opens a socket. A socket it already
            opened stays open.
        threadId:
          type: string
          minLength: 1
          description: The conversation's thread, as the caller sees it.
        runId:
          type:
            - string
            - 'null'
          description: The run in progress in the thread, or null when the Bot is not working.
        realtime:
          type: object
          description: Where to use the token.
          required:
            - clientUrl
            - topic
          properties:
            clientUrl:
              type: string
              minLength: 1
              description: >-
                The socket's address, without the /websocket it ends in or its
                query. A ws or wss address, or a path on this server, which is
                resolved against the address the API was called at. Where it
                is on this server, the socket is opened with the credential
                that made the token (see createConversationJoinToken).
            topic:
              type: string
              pattern: ^thread:.+$
              description: >-
                The topic to join on the socket, as the realtime gateway knows
                the thread. Use it as given: outside the organization default
                it does not name threadId, so a topic made from threadId joins
                nothing.
    Conversation:
      type: object
      description: A conversation between the caller and one or more Bots.
      required:
        - id
        - name
        - botIds
        - threadId
        - active
        - lastMessageAt
      properties:
        id:
          type: string
          description: The conversation's id.
        name:
          type: string
          description: The name OpenBot gave it from its Bots.
        botIds:
          type: array
          description: The Bots in the conversation.
          items:
            type: string
        threadId:
          type: string
          description: The caller's own thread in the conversation, which its
            messages, approvals and reactions name.
        active:
          type: boolean
          description: False once every Bot in it is gone, so nothing more can be said.
        lastMessageAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When something was last said in it. Null for a conversation
            nobody has used.
        work:
          type: array
          description: What a Bot is still working on in the conversation. Present
            when the conversation is read by its id.
          items:
            $ref: '#/components/schemas/ConversationWork'
    ConversationWork:
      type: object
      description: 'Something still owed an answer in a conversation: another Bot
        that was asked and has not answered (handoff), or a routine running into
        it (routine).'
      required:
        - kind
        - key
        - botId
        - botName
        - since
      properties:
        kind:
          type: string
          enum:
            - handoff
            - routine
        key:
          type: string
          description: Names this piece of work, so two asks of one Bot are two entries.
        botId:
          type: string
          description: The Bot that was asked, or that the routine runs as.
        botName:
          type:
            - string
            - 'null'
          description: That Bot's name when the work started.
        since:
          type: string
          format: date-time
          description: When it started.
        routineId:
          type: string
          description: The routine, for a routine.
    ConversationSummary:
      type: object
      description: A conversation as the caller's list shows it.
      required:
        - id
        - name
        - botIds
        - threadId
        - active
        - lastMessageAt
        - summary
        - opening
        - lastMessage
        - lastMessageBotId
        - createdAt
        - pinned
        - lastReadAt
        - canRename
        - task
        - work
      properties:
        id:
          type: string
          description: The conversation's id.
        name:
          type: string
          description: The name OpenBot gave it from its Bots.
        botIds:
          type: array
          description: The Bots in the conversation.
          items:
            type: string
        threadId:
          type: string
          description: The caller's own thread in the conversation, which its
            messages, approvals and reactions name.
        active:
          type: boolean
          description: False once every Bot in it is gone, so nothing more can be said.
        lastMessageAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When something was last said in it. Null for a conversation
            nobody has used.
        summary:
          type:
            - string
            - 'null'
          description: 'What the conversation is called: the name its owner gave it,
            or the few words OpenBot wrote. Null until it has one.'
        opening:
          type:
            - string
            - 'null'
          description: The person's first words in it, which name it until it has a summary.
        lastMessage:
          type:
            - string
            - 'null'
          description: The last thing said in it.
        lastMessageBotId:
          type:
            - string
            - 'null'
          description: The Bot that said it, or null when a person did.
        createdAt:
          type: string
          format: date-time
          description: When it was started.
        pinned:
          type: boolean
          description: Whether the caller pinned it.
        lastReadAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the caller last had it open. Null for never.
        canRename:
          type: boolean
          description: Whether the caller started it, and so may rename it.
        task:
          type: boolean
          description: Whether it is a task's own conversation, which holds one piece
            of work.
        work:
          type: array
          description: What a Bot is still working on in it.
          items:
            $ref: '#/components/schemas/ConversationWork'
        busy:
          type: boolean
          description: Present and true while a Bot is working in it.
    ConversationPage:
      type: object
      required:
        - conversations
        - nextCursor
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written
            in URL-safe base64, the only form the cursor parameter accepts.
    ConversationResponse:
      type: object
      required:
        - conversation
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
    CreateConversationRequest:
      type: object
      required:
        - botIds
      additionalProperties: false
      properties:
        botIds:
          type: array
          description: The Bots to talk to, each once.
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
            pattern: \S
        group:
          type: boolean
          default: false
          description: 'True for a group conversation: two or more Bots answering in
            the order given, on one transcript.'
    UpdateConversationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type:
            - string
            - 'null'
          description: The new name, on one line and at most 80 characters as a person
            counts them. Null or blank lets OpenBot name it.
          maxLength: 2000
        pinned:
          type: boolean
          description: Whether the caller has it pinned.
    UpdatedConversation:
      type: object
      description: What was changed, as it now stands.
      properties:
        summary:
          type:
            - string
            - 'null'
          description: What the conversation is called now, when its name was changed.
            Null when OpenBot has not named it yet.
        pinned:
          type: boolean
          description: Whether the caller has it pinned, when that was changed.
    ConversationActivity:
      type: object
      additionalProperties: false
      required:
        - text
        - botId
        - at
      properties:
        text:
          type: string
          description: What was said.
          minLength: 1
          pattern: \S
        botId:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The Bot that said it, or null when the person did.
        at:
          type: string
          format: date-time
          description: When it was said.
    ConversationBusy:
      type: object
      additionalProperties: false
      required:
        - busy
      properties:
        busy:
          type: boolean
          description: True when a Bot started answering, false when it stopped.
    ProductEvent:
      type: object
      description: The caller saw a Bot's answer, or copied it. Names the answer and
        nothing about the person, who is the caller.
      additionalProperties: false
      required:
        - kind
        - threadId
        - messageId
        - surface
      properties:
        kind:
          type: string
          enum:
            - result_viewed
            - result_copied
          description: What the caller did with the answer, result_viewed when it was
            on screen and result_copied when they copied it.
        threadId:
          type: string
          description: The thread the answer is in, as its messages name it.
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9_:.-]+$
        messageId:
          type: string
          description: The answer's message, by the id its thread gives it.
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9_:.-]+$
        runId:
          type: string
          description: The run that wrote the answer, when the client knows it.
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9_:.-]+$
        surface:
          type: string
          enum:
            - web
            - desktop
            - mobile
          description: Where the caller saw or copied it.
    AppError:
      type: object
      description: An error the app hit and did not handle, as the app saw it.
        OpenBot scrubs and bounds it again before it is sent anywhere.
      additionalProperties: false
      required:
        - source
        - type
        - message
        - surface
      properties:
        source:
          type: string
          enum:
            - error_boundary
            - window_error
            - unhandled_rejection
          description: How the app caught it. error_boundary when its error screen
            was shown, window_error for an error the page threw, and
            unhandled_rejection for a promise nobody handled.
        type:
          type: string
          description: The error's name, such as TypeError.
          minLength: 1
          maxLength: 128
        message:
          type: string
          description: The error's message.
          maxLength: 2048
        stack:
          type: string
          description: The error's stack, as the browser wrote it.
          maxLength: 12288
        surface:
          type: string
          enum:
            - web
            - desktop
            - mobile
          description: Where the app runs.
        appVersion:
          type: string
          description: The release the app was built for, such as 1.1.0-rc.2, when
            the build knows it.
          minLength: 1
          maxLength: 32
          pattern: ^v?\d+(?:\.\d+){1,3}(?:-[a-z]+(?:\.\d{1,9})?)?$
    RouteMessageRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          description: The message.
          minLength: 1
          maxLength: 10000
          pattern: \S
        botId:
          type: string
          minLength: 1
          maxLength: 200
          description: The Bot the person chose, to confirm they can use it.
        skillSlugs:
          type: array
          description: Skills the message asks for, by their commands.
          maxItems: 50
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]*$
            maxLength: 200
    RoutedMessage:
      type: object
      required:
        - botId
        - name
        - reason
        - fallback
        - viaMention
      properties:
        botId:
          type: string
          description: The Bot to send the message to.
        name:
          type: string
          description: Its name.
        reason:
          type: string
          description: Why it was chosen, in a few words.
        fallback:
          type: boolean
          description: True when nothing decided and the default Bot was taken.
        viaMention:
          type: boolean
          description: True when the message named the Bot.
        undecided:
          type:
            - string
            - 'null'
          description: Why the choice fell back to the default Bot, when it did and a
            model was asked. Absent when the person chose the Bot.
    ConversationMember:
      type: object
      description: A Bot or a person in a group conversation.
      required:
        - kind
        - id
        - name
      properties:
        kind:
          type: string
          enum:
            - bot
            - person
        id:
          type: string
          description: The Bot's id, or the person's.
        name:
          type:
            - string
            - 'null'
          description: The Bot's name, or the person's. Null for a person with none.
        email:
          type: string
          description: The person's email address, for a person.
        creator:
          type: boolean
          description: 'For a person: whether they started the group, and so may take
            others out of it.'
    ConversationMemberPage:
      type: object
      required:
        - members
        - nextCursor
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMember'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written
            in URL-safe base64, the only form the cursor parameter accepts.
    AddConversationMemberRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          description: The email address the person signs in to this OpenBot with.
          format: email
          minLength: 3
          maxLength: 320
    AddedConversationMember:
      type: object
      required:
        - personId
      properties:
        personId:
          type: string
          description: The person who is now in the conversation.
    ConversationMessage:
      type: object
      description: "One thing said in a conversation: a person's message, or one
        Bot's reply."
      required:
        - id
        - role
        - personId
        - botId
        - text
        - status
        - createdAt
      properties:
        id:
          type: string
          description: The message's id.
        role:
          type: string
          enum:
            - person
            - bot
            - tool
            - system
          description: Who it is from. tool and system are what a Bot's run recorded
            beside its reply, in a conversation that is not a group.
        personId:
          type:
            - string
            - 'null'
          description: Who sent it, for a person's message; whose turn it answered,
            for a Bot's reply.
        botId:
          type:
            - string
            - 'null'
          description: The Bot that replied. Null for a person's message.
        text:
          type: string
          description: What was said. Empty while another person's Bot is still writing it.
        status:
          type: string
          enum:
            - queued
            - running
            - waiting
            - completed
            - failed
          description: Where a Bot's reply stands. A person's message is completed.
        createdAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was said. Null where the time was not kept.
        reason:
          type: string
          description: Why a waiting Bot is waiting.
        answeredBy:
          type: string
          description: 'For an answer passed on from another Bot: which Bot answered.'
        consent:
          type: object
          description: A Team Bot asking the person whose turn it was to use their own
            account.
          required:
            - botId
            - serverId
          properties:
            botId:
              type: string
            serverId:
              type: string
        toolCalls:
          type: integer
          minimum: 0
          description: How many tools the Bot called in this message, when it called any.
    ConversationMessagePage:
      type: object
      required:
        - messages
        - nextCursor
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written
            in URL-safe base64, the only form the cursor parameter accepts.
    SendConversationMessageRequest:
      type: object
      required:
        - id
        - text
      additionalProperties: false
      properties:
        id:
          type: string
          description: The caller's own id for the message, any string, so a retry in the
            same conversation is the same message. The conversation's messages
            list it under this id.
          minLength: 1
          maxLength: 160
        text:
          type: string
          description: The message.
          minLength: 1
          maxLength: 16000
          pattern: \S
        botId:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 200
          description: The one Bot to answer. Needed in a conversation that is not a
            group; in a group, leave it out for every Bot or the ones the
            message names.
    SentConversationMessage:
      type: object
      required:
        - queued
      properties:
        id:
          type: string
          description: The message's id.
        queued:
          type: boolean
          description: True when the message is waiting for its answer. False when the
            same message was already accepted.
    Attachment:
      type: object
      description: A file held for a message, or sent with one.
      required:
        - id
        - name
        - mimeType
        - sizeBytes
      properties:
        id:
          type: string
          description: The attachment's id.
        name:
          type: string
          description: The file's name.
        mimeType:
          type: string
          description: The type OpenBot recognised it as.
        sizeBytes:
          type: integer
          minimum: 0
    AttachmentUpload:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: The file.
        uploadGroup:
          type: string
          description: Names the message being written, so the files of two windows
            are counted apart.
          maxLength: 200
    ConversationThread:
      type: object
      required:
        - threadId
      properties:
        threadId:
          type: string
          description: The new thread's id.
        liveThreadId:
          type: string
          description: The id that live updates about this thread carry. Compare
            an incoming update with this one, and use threadId everywhere else.
            It is threadId itself in the organization default. Left out by a
            server that names threads one way only, where it is threadId.
    ConversationThreadStatus:
      type: object
      required:
        - threadId
        - known
      properties:
        threadId:
          type: string
        known:
          type: boolean
          description: Whether the thread still holds the caller's conversation.
        liveThreadId:
          type: string
          description: The id that live updates about this thread carry. Compare
            an incoming update with this one, and use threadId everywhere else.
            It is threadId itself in the organization default. Left out by a
            server that names threads one way only, where it is threadId.
    TaskStatus:
      type: string
      enum:
        - needs_input
        - working
        - resolved
        - failed
        - ready_for_review
      description: 'Where a task stands: waiting on the person, being worked on,
        marked done, failed, or finished and ready to read.'
    Task:
      type: object
      description: A piece of work a Bot does for a person in a conversation of its own.
      required:
        - id
        - botId
        - conversationId
        - threadId
        - title
        - why
        - origin
        - suggestionId
        - sourceApp
        - sourceLink
        - originConversationId
        - status
        - failure
        - failedAt
        - next
        - resolvedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: The task's id.
        botId:
          type: string
          description: The Bot doing it.
        agent:
          type: [object, 'null']
          description: >-
            The agent doing the work, when the Bot handed it to one of the
            agents it may use. Null for a task the Bot does itself, which is
            every task before agents were a list. Absent from a server that
            does not name it.
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
              description: The agent's id.
            name:
              type: string
              description: >-
                What the agent is called. An agent private to somebody other
                than the caller is named Private agent.
        conversationId:
          type: string
          description: The task's own conversation, where the person reads it and replies.
        threadId:
          type:
            - string
            - 'null'
          description: That conversation's thread. Null once it is gone.
        title:
          type: string
          description: What the task is.
        why:
          type:
            - string
            - 'null'
          description: Why it was raised.
        origin:
          type: string
          enum:
            - check_in
            - delegated
          description: Whether the person started it from a check-in, or a Bot was
            asked to do it.
        suggestionId:
          type:
            - string
            - 'null'
          description: The check-in item it was started from.
        sourceApp:
          type:
            - string
            - 'null'
          description: The app the item came from.
        sourceLink:
          type:
            - string
            - 'null'
          description: Where the item is in that app.
        originConversationId:
          type:
            - string
            - 'null'
          description: The conversation a delegated task was asked for in, where its
            result is said.
        status:
          $ref: '#/components/schemas/TaskStatus'
        failure:
          type:
            - string
            - 'null'
          description: Why its turn could not finish, while it is failed.
        failedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it failed.
        stoppedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the person stopped its run. Its status is failed while this is set. Null or absent otherwise, and once it carries on.
        canTryAgain:
          type: boolean
          description: Whether trying a failed task again could change how it ends. False when it couldn't finish for a reason asking again gets the same answer to, such as a Bot it asked that isn't shared with the person, or this Bot no longer being shared with them. Absent from a server that does not say, which reads as true.
        workingSince:
          type:
            - string
            - 'null'
          format: date-time
          description: When the work it is doing now began. Null or absent unless it is working.
        tryingAgainAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the task's turn will next be tried, while it waits to try again after a failure that passes (a rate limit, a service that did not answer). Null or absent when it is not waiting to try again.
        lastActivityAt:
          type: string
          format: date-time
          description: When it last did something, a step of its work or a line said in its conversation. Absent from a server that does not record it.
        next:
          type:
            - string
            - 'null'
          description: One line on what comes next.
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the person marked it done.
        steer:
          oneOf:
            - $ref: '#/components/schemas/TaskSteer'
            - type: 'null'
          description: The latest thing the person told the task directly in its conversation, when the task had not asked them for anything. Null or absent when they have not.
        createdAt:
          type: string
          format: date-time
          description: When it was started.
        updatedAt:
          type: string
          format: date-time
          description: When it last changed.
    TaskSteer:
      type: object
      description: What the person told a task directly in its conversation, as its card says it in the conversation that started the task.
      required:
        - text
        - at
      properties:
        text:
          type: string
          description: The person's words, on one line and cut short when they run long.
        at:
          type: string
          format: date-time
          description: When they said it.
    TaskPage:
      type: object
      required:
        - tasks
        - nextCursor
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written
            in URL-safe base64, the only form the cursor parameter accepts.
    TaskTurn:
      type: object
      description: One finished turn of a task's work, answering one thing it was asked in its conversation.
      required:
        - askId
        - startedAt
        - endedAt
        - workedSeconds
        - runs
        - model
      properties:
        askId:
          type: string
          description: The id of the message the turn answered, as the conversation's history names it.
        startedAt:
          type: string
          format: date-time
          description: When its first run began.
        endedAt:
          type: string
          format: date-time
          description: When its last run ended.
        workedSeconds:
          type: integer
          minimum: 0
          description: How long its runs took, added up. A wait on the person between two runs (an approval, a question) is not counted.
        runs:
          type: integer
          minimum: 1
          description: How many runs it took. More than one when it stopped for the person and carried on after.
        model:
          type:
            - string
            - 'null'
          description: The model its last run used. Null when the Bot chooses its own model and did not name it.
    TaskTurnPage:
      type: object
      required:
        - turns
        - nextCursor
      properties:
        turns:
          type: array
          items:
            $ref: '#/components/schemas/TaskTurn'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written
            in URL-safe base64, the only form the cursor parameter accepts.
    TaskResponse:
      type: object
      required:
        - task
      properties:
        task:
          $ref: '#/components/schemas/Task'
    Transcription:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: What was said.
    TranscriptionUpload:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: 'The recording: WebM, MP4 or WAV audio.'
    VoiceConfiguration:
      type: object
      required:
        - transport
      properties:
        transport:
          type: string
          enum:
            - webrtc
            - websocket
          description: How a call connects.
    VoiceCallRequest:
      type: object
      additionalProperties: false
      properties:
        sdp:
          type: string
          description: The caller's audio offer, where calls run over WebRTC.
          minLength: 1
          maxLength: 65536
    VoiceConnection:
      type: object
      description: "How to connect a call. Over WebRTC: the answer to the caller's
        offer, as sdp. Over a WebSocket: where to connect, the short-lived
        secret to connect with, and the session to open."
      required:
        - transport
      properties:
        transport:
          type: string
          enum:
            - webrtc
            - websocket
        sdp:
          type: string
          description: The answer to the caller's offer.
        url:
          type: string
          description: The socket to open.
        clientSecret:
          type: string
          description: A secret that opens that socket once, for a few minutes.
        session:
          type: object
          description: The session to open on the socket, as the voice service reads it.
          additionalProperties: true
    VoiceTranscriptEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - role
        - text
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
        role:
          type: string
          enum:
            - user
            - assistant
          description: The person, or the Bot.
        text:
          type: string
          minLength: 1
          maxLength: 60000
          pattern: \S
    VoiceSessionInput:
      type: object
      additionalProperties: false
      required:
        - id
        - anchorMessageId
        - startedAt
        - endedAt
        - transcript
      properties:
        id:
          type: string
          description: The caller's own id for the call.
          minLength: 1
          maxLength: 256
          pattern: \S
        anchorMessageId:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 256
          pattern: \S
          description: The message the call followed, so it is shown after it. Null at
            the start of a conversation.
        startedAt:
          type: string
          format: date-time
          description: When the call started.
        endedAt:
          type: string
          format: date-time
          description: 'When it ended: after it started, within a day.'
        transcript:
          type: array
          minItems: 1
          maxItems: 300
          description: What was said, in order, at most 60,000 characters in all.
          items:
            $ref: '#/components/schemas/VoiceTranscriptEntry'
    VoiceSession:
      type: object
      description: A saved voice call.
      required:
        - id
        - conversationId
        - anchorMessageId
        - startedAt
        - endedAt
        - transcript
        - durationSeconds
        - summary
        - summaryStatus
      properties:
        id:
          type: string
        conversationId:
          type: string
          description: The conversation the call was in.
        anchorMessageId:
          type:
            - string
            - 'null'
          description: The message the call followed.
        startedAt:
          type: string
          format: date-time
          description: When the call started.
        endedAt:
          type: string
          format: date-time
          description: When it ended.
        transcript:
          type: array
          items:
            $ref: '#/components/schemas/VoiceTranscriptEntry'
        durationSeconds:
          type: integer
          minimum: 0
        summary:
          type:
            - string
            - 'null'
          description: What the call was about, in a few lines. Null when it could not
            be written.
        summaryStatus:
          type: string
          enum:
            - ready
            - failed
    VoiceSessionPage:
      type: object
      required:
        - sessions
        - nextCursor
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/VoiceSession'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written
            in URL-safe base64, the only form the cursor parameter accepts.
    VoiceSessionResponse:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/VoiceSession'
        notice:
          type: string
          description: Present when the call is saved but its summary could not be
            written yet, because too many are being written. Says so, in words
            for the person. Saving the same call again later writes it.
  responses:
    ConversationNotJoinable:
      description: >-
        The conversation has nothing to join: no Bot has run in it yet, or it
        is a group conversation, which has no single thread. Or the
        Idempotency-Key was already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notStarted:
              value:
                type: https://open.bot/errors/conversation-not-started
                title: Nothing to join yet.
                status: 409
                detail: No Bot has run in this conversation yet.
                code: CONVERSATION_NOT_STARTED
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    LiveChannelsUnavailable:
      description: The service that carries live runs did not answer. Try again.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://open.bot/errors/live-channels-unavailable
                title: Live updates are unavailable.
                status: 502
                detail: Couldn't reach live updates. Try again.
                code: LIVE_CHANNELS_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    ConversationConflict:
      description: 'The conversation cannot take this: it comes with OpenBot and
        cannot be deleted, it is no longer active, or the call was already saved
        in another conversation. Or the Idempotency-Key was already used for a
        different request.'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            builtIn:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: This conversation is built in and can't be deleted.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    NoBotToAnswer:
      description: 'No Bot can answer the message: the caller has none, none
        offers every skill asked for, or more than one has the name the message
        used. Or the Idempotency-Key was already used for a different request.'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            none:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: No Bot is available.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            ambiguous:
              value:
                type: https://open.bot/errors/bot-name-ambiguous
                title: More than one Bot has that name.
                status: 409
                detail: More than one Bot has that name. Research Helper, Research
                  Helper. Choose one with @.
                code: BOT_NAME_AMBIGUOUS
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    AttachmentNotFound:
      description: The attachment does not exist or the caller may not read it, or
        the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/not-found
                title: Not found.
                status: 404
                detail: No such attachment.
                code: NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    AttachmentConflict:
      description: 'The file cannot be taken: the message already holds as many
        files as it may, or the caller is holding too many unsent files. Or it
        cannot be removed because it is already part of a sent message. Or the
        Idempotency-Key was already used for a different request.'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            sent:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: This attachment is already part of a sent message.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    TaskNotFound:
      description: The task does not exist or is another person's, or the
        organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/not-found
                title: Not found.
                status: 404
                detail: Couldn't find that task.
                code: NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    TaskConflict:
      description: The task is not in a state this can change. Or the
        Idempotency-Key was already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notFailed:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: Only a task that failed can be tried again.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    UnsupportedFile:
      description: The file is not a type OpenBot can read.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            unsupported:
              value:
                type: https://open.bot/errors/unsupported-media-type
                title: That media type is not supported.
                status: 415
                detail: This recording format is not supported. Use WebM, MP4, or WAV audio.
                code: UNSUPPORTED_MEDIA_TYPE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    NoSpeech:
      description: The recording held no speech to write down.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            silent:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 422
                detail: No speech was detected. Try recording again.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    TooManyRequests:
      description: The caller already has one of these running, or asked too
        often. Try again after the time Retry-After gives.
      headers:
        Retry-After:
          description: Seconds to wait before trying again, when the server knows.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            busy:
              value:
                type: https://open.bot/errors/rate-limited
                title: Too many requests.
                status: 429
                detail: Too many call attempts. Try again in a moment.
                code: RATE_LIMITED
                category: rate_limit
                retryable: true
                requestId: req_example
                traceId: trace_example
    ServiceUnavailable:
      description: "Something this needs is not set up or did not answer: the
