# Conversations: a person's conversations and what is said in them (members, messages, attachments,
# reactions, dictation and voice calls), their tasks, joining a conversation's live channel, and
# the product events that count which of a Bot's answers people saw or copied.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/reactions:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Reactions]
      operationId: listReactions
      summary: List reactions in a conversation
      description: >-
        Return one page of the reactions Bots left on the caller's messages in
        one of their conversations, named by its thread. Another person's
        thread answers with an empty list. A missing cursor starts at the
        first page and nextCursor null ends the list. Today's server returns
        every reaction on the first page.
      security:
        - webSession: []
        - appOAuth: [reactions:read]
        - apiKey: []
      parameters:
        - name: threadId
          in: query
          required: true
          description: The conversation's thread, as its messages name it.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of reactions.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/ReactionPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations/{conversationId}/join-tokens:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: createConversationJoinToken
      summary: Get a token to watch a conversation live
      description: >-
        Make a join token for the conversation's thread, and say where to use
        it. The token opens the threadStream channel of api/asyncapi.yaml: a
        WebSocket that replays the Bot's runs in the conversation, a run in
        progress from its start, and then carries on live. The token works
        once and for about half a minute, so ask for a new one for every
        connection, and again to reconnect. Only a person in the conversation
        may have one, and it opens the thread they see there and no other. A
        conversation no Bot has run in yet has nothing to join (409). Where
        realtime.clientUrl is on this server, open it with the same
        credential that made the token: the session, an app's access token,
        or an API key, as Authorization: Bearer or x-api-key. So a script
        that holds only an API key can watch a conversation live.
      security:
        - webSession: []
        - appOAuth: [conversations:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: A join token, and where to use it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationJoinToken'
              examples:
                running:
                  $ref: '#/components/examples/ConversationJoinTokenExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: '#/components/responses/ConversationNotJoinable'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/LiveChannelsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags:
        - Conversations
      operationId: listConversations
      summary: List conversations
      description: "Return one page of the caller's conversations: pinned ones
        first, then the most recently used. Each says what was last said in it,
        whether the caller has read it, and what a Bot is still working on
        there. With q the page holds only the conversations whose name or words
        match, for a search of the whole list; a search page holds at most 50. A
        missing cursor starts at the first page and nextCursor null ends the
        list."
      security:
        - webSession: []
        - appOAuth:
            - conversations:read
        - apiKey: []
      parameters:
        - name: q
          in: query
          description: 'What the person typed to search their conversations: 2 to 200
            characters, with no control characters.'
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - $ref: '#/components/parameters/ConversationLimit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of conversations.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
              examples:
                example:
                  $ref: '#/components/examples/ConversationPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags:
        - Conversations
      operationId: createConversation
      summary: Start a conversation
      description: 'Start a conversation between the caller and one or more Bots
        they can use. A conversation with the same Bots that the caller already
        has is returned rather than made twice. With group true it is a group
        conversation: two or more Bots that answer in the order given, on one
        transcript other people can be added to. A repeated request with the
        same Idempotency-Key and body returns the first result.'
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: The conversation.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            Location:
              description: The new conversation's address.
              schema:
                type: string
              example: /api/v2/organizations/default/conversations/5f0d6c0e-2f1a-4a53-9d51-6f3d6b1f6f10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              examples:
                example:
                  $ref: '#/components/examples/ConversationResponseExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/BotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations/route:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags:
        - Conversations
      operationId: routeConversationMessage
      summary: Choose the Bot for a message
      description: "Say which of the caller's Bots should answer a message that
        names none: the Bot the message mentions, the one whose role fits it, or
        the caller's default when nothing decides. With botId it only confirms
        that Bot is one the caller can use. With skillSlugs only a Bot that
        offers every one of them is chosen. Nothing is sent and no conversation
        is made."
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteMessageRequest'
      responses:
        '200':
          description: The Bot to send the message to.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutedMessage'
              examples:
                example:
                  $ref: '#/components/examples/RoutedMessageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/BotNotFound'
        '409':
          $ref: '#/components/responses/NoBotToAnswer'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations/{conversationId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
    get:
      tags:
        - Conversations
      operationId: getConversation
      summary: Get a conversation
      description: Return one of the caller's conversations, with what a Bot is
        still working on in it. A conversation the caller is not in is not
        found.
      security:
        - webSession: []
        - appOAuth:
            - conversations:read
        - apiKey: []
      responses:
        '200':
          description: The conversation.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              examples:
                example:
                  $ref: '#/components/examples/ConversationResponseExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    patch:
      tags:
        - Conversations
      operationId: updateConversation
      summary: Rename or pin a conversation
      description: Change what the conversation is called, whether the caller has it
        pinned, or both. Only the person who started a conversation may rename
        it; title null, or blank, gives the name back to OpenBot to write. A pin
        is the caller's own and moves nothing for anybody else. The answer holds
        what was changed.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: What the conversation is now.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedConversation'
              examples:
                example:
                  $ref: '#/components/examples/UpdatedConversationExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    delete:
      tags:
        - Conversations
      operationId: deleteConversation
      summary: Delete a conversation
      description: Remove the conversation from the caller's list. Deleting one that
        is already gone answers the same way. A conversation that comes with
        OpenBot cannot be deleted. discardFailedStart removes a conversation
        whose first message never reached its Bot, and only that.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
        - name: discardFailedStart
          in: query
          description: true when the conversation is one whose first message failed to
            send, so it is removed only if nothing was ever said in it.
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: The conversation is gone.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: '#/components/responses/ConversationConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations/{conversationId}/mark-read:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
    post:
      tags:
        - Conversations
      operationId: markConversationRead
      summary: Mark a conversation read
      description: Record that the caller has the conversation open now, so nothing
        in it counts as unread for them.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The conversation is read.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations/{conversationId}/activity:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
    post:
      tags:
        - Conversations
      operationId: recordConversationActivity
      summary: Report the last thing said in a conversation
      description: Tell the server what was just said in the conversation, by the
        person or by a Bot, so the caller's list shows it and orders by it. A
        time in the future is read as now.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationActivity'
      responses:
        '204':
          description: The activity is recorded.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations/{conversationId}/signal-busy:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
    post:
      tags:
        - Conversations
      operationId: signalConversationBusy
      summary: Say a Bot started or stopped answering
      description: Tell the caller's other windows and devices that a Bot started
        answering in the conversation, or stopped, so each shows it as working
        without waiting for the answer.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationBusy'
      responses:
        '204':
          description: The signal was sent.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations/{conversationId}/members:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
    get:
      tags:
        - Conversations
      operationId: listConversationMembers
      summary: List who is in a group conversation
      description: "Return one page of a group conversation's members: its Bots the
        caller can use, in the order they answer, then its people, in the order
        they joined. The first person started the group. A missing cursor starts
        at the first page and nextCursor null ends the list."
      security:
        - webSession: []
        - appOAuth:
            - conversations:read
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of members.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMemberPage'
              examples:
                example:
                  $ref: '#/components/examples/ConversationMemberPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags:
        - Conversations
      operationId: addConversationMember
      summary: Add a person to a group conversation
      description: Add somebody who has signed in to this OpenBot to a group
        conversation the caller is in, by their email address. They see the
        whole transcript. Adding somebody already in it changes nothing.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConversationMemberRequest'
      responses:
        '201':
          description: The person is in the conversation.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddedConversationMember'
              examples:
                example:
                  $ref: '#/components/examples/AddedConversationMemberExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations/{conversationId}/members/{memberId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/MemberId'
    delete:
      tags:
        - Conversations
      operationId: removeConversationMember
      summary: Leave a group conversation, or take somebody out
      description: Take a person out of a group conversation. Anybody may take
        themselves out; only the person who started the group may take out
        somebody else, and they cannot leave while others are still in it.
      security:
        - webSession: []
        - appOAuth:
            - conversations:write
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The person is out of the conversation.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/conversations/{conversationId}/messages:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
    get:
      tags:
        - Conversations
      operationId: listConversationMessages
      summary: List the messages in a conversation
      description: Return one page of what was said in the conversation, newest
        first. A group conversation answers its shared transcript, with each
        Bot's reply and where it stands. Any other conversation answers the
        caller's own exchange with one of its Bots, named by botId. A reply
        still being written is empty to everybody but the person whose Bot is
        writing it. A missing cursor starts at the newest page and nextCursor
        null ends the list.
      security:
        - webSession: []
        - appOAuth:
            - conversations:read
        - apiKey: []
      parameters:
        - name: botId
          in: query
          description: Which Bot's exchange to read, in a conversation that is not a
            group. Leave it out for a group conversation.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: '#/components/parameters/ConversationLimit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of messages.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagePage'
              examples:
                example:
                  $ref: '#/components/examples/ConversationMessagePageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
