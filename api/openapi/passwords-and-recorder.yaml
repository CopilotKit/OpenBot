                detail: Couldn't find that organization.
                code: ORGANIZATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignInForbidden:
      description: >-
        The request is somebody else's, which only they may answer, or
        saved passwords are turned off for this person.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
