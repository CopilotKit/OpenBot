                detail: Saved passwords are turned off for this workspace.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignInRequestConflict:
      description: >-
        The request is no longer in a state this action applies to, or
        the site did not take what was typed after the request had
        moved on. Or the Idempotency-Key was used for a different
        request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            closed:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: This sign-in request is no longer open.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    SavedLoginNotFound:
      description: >-
        The person has no such saved login, it was deleted, or the
        organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/saved-login-not-found
                title: Saved login not found.
                status: 404
                detail: There is no such saved login.
                code: SAVED_LOGIN_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
            organization:
              value:
                type: https://open.bot/errors/organization-not-found
                title: Organization not found.
                status: 404
                detail: Couldn't find that organization.
                code: ORGANIZATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    RecorderConnectionNotFound:
      description: >-
        There is no such live connection: it was never the person's,
        or it has already ended. Or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/recorder-connection-not-found
                title: Recorder connection not found.
                status: 404
                detail: That connection was not found.
                code: RECORDER_CONNECTION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
            organization:
              value:
                type: https://open.bot/errors/organization-not-found
                title: Organization not found.
                status: 404
                detail: Couldn't find that organization.
                code: ORGANIZATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    RecorderSecretConflict:
      description: >-
        This write was already done with this Idempotency-Key. Its
        answer held a credential, which is never kept, so it cannot be
        sent again: make the request again with a new key. Or the key
        was used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notKept:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: That write was already done, and its answer held a credential that is never kept. Use a new Idempotency-Key to make a new one.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidRecorderConnectCode:
      description: >-
        The request was not complete, the Idempotency-Key is missing,
        or the code is unknown, expired or already used, which all
        read the same.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            code:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: This connection code has expired or was already used. Choose Connect this browser in OpenBot again.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    RecorderOriginRefused:
      description: >-
        The request did not come from the OpenBot Recorder extension,
        by its browser Origin.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            origin:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only the OpenBot Recorder extension can finish connecting.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    RecorderSignedOut:
      description: >-
        The request carries no live connection token: the connection
        was ended, is unknown, the person was removed, or their
        organization sign-in ended. reason says which, and the
        Recorder forgets its connection.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RecorderProblem'
          examples:
            revoked:
              value:
                type: https://open.bot/errors/recorder-signed-out
                title: This browser's Recorder is no longer connected.
                status: 401
                detail: This browser is no longer connected to OpenBot. Connect it again.
                code: RECORDER_SIGNED_OUT
                category: auth
                retryable: false
                requestId: req_example
                traceId: trace_example
                reason: revoked
    SignInComputersUnavailable:
      description: >-
        This OpenBot has no computers for Bots, so there is nowhere to sign
        a Bot in. Nothing was opened.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            noComputers:
              value:
                type: https://open.bot/errors/service-unavailable
                title: A service OpenBot depends on is unavailable.
                status: 503
                detail: This OpenBot has no computers for Bots.
                code: SERVICE_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    RecorderAuthorityUnavailable:
      description: >-
        The organization's sign-in server could not answer for now.
        Never a sign-out: the Recorder keeps its connection and tries
        again.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://open.bot/errors/recorder-authority-unavailable
                title: The organization's sign-in could not answer.
                status: 503
                detail: Your organization could not answer. Try again in a moment.
                code: RECORDER_AUTHORITY_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    RecordingsUnavailable:
      description: >-
        This OpenBot keeps no recordings.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            off:
              value:
                type: https://open.bot/errors/recordings-unavailable
                title: Recordings aren't available here.
                status: 503
                detail: Recordings are not available here.
                code: RECORDINGS_UNAVAILABLE
                category: dependency
                retryable: false
                requestId: req_example
                traceId: trace_example
    RecorderJsonOnly:
      description: >-
        The body was not sent as application/json, which a cross-site
        form cannot send.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            json:
              value:
                type: https://open.bot/errors/unsupported-media-type
                title: Unsupported media type.
                status: 415
                detail: Send the request as JSON.
                code: UNSUPPORTED_MEDIA_TYPE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    TooManyRecorderConnectCodes:
      description: >-
        Too many connect codes are live for this person at once.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            codes:
              value:
                type: https://open.bot/errors/rate-limited
                title: Too many requests.
                status: 429
                detail: Too many connection codes were asked for at once. Wait a few minutes and try again.
                code: RATE_LIMITED
                category: rate_limit
                retryable: true
                requestId: req_example
                traceId: trace_example
