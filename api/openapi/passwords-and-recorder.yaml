# Sign-in requests, saved logins and the Recorder: handing a Bot a sign-in, the logins a person keeps, and the browsers connected to record.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/people/{personId}/sign-in-requests:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Sign-in requests]
      operationId: listSignInRequests
      summary: List a person's open sign-in requests
      description: >-
        Return one page of the sign-in requests a person's Bots are
        waiting on: the ones still open (pending, code_required or
        taken_over) and not yet expired, newest first. Never a
        credential. Only the person themselves may list them. A missing
        cursor starts at the first page and nextCursor null ends the
        list.
      security:
        - webSession: []
        - appOAuth: [sign-in-requests:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of open sign-in requests.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequestPage'
              examples:
                example:
                  $ref: '#/components/examples/SignInRequestPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Sign-in requests]
      operationId: createSignInRequest
      summary: Ask a person to sign a Bot in to a website
      description: >-
        Open a sign-in request: a Bot in the person's open conversation
        asking them to sign it in to one website. The person answers it
        on a private form, and what they type goes to the Bot's browser
        and nowhere else. The request names the site by its origin, and
        expires if it is not answered. Only the person themselves may
        open one, for a Bot whose computer they may use. On an OpenBot
        with no computers for Bots there is nowhere to sign a Bot in, and
        the answer is 503, as the computers answer there: nothing was
        opened. The deployment's botComputers says so beforehand.
      security:
        - webSession: []
        - appOAuth: [sign-in-requests:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignInRequestRequest'
            examples:
              example:
                value:
                  botId: research-bot
                  site: https://example.com/login
                  reason: To read your invoices.
      responses:
        '201':
          description: The request that was opened.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequestEnvelope'
              examples:
                example:
                  $ref: '#/components/examples/SignInRequestExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: '#/components/responses/SignInBotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/SignInComputersUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/sign-in-requests/{signInRequestId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/SignInRequestId'
    get:
      tags: [Sign-in requests]
      operationId: getSignInRequest
      summary: Read a sign-in request
      description: >-
        Return one sign-in request as its private form shows it: where
        it has got to, the last thing that happened, and the usernames
        of the person's saved logins for that site while the password
        manager is on. Never a credential. Only the person it was opened
        for may read it; anybody else's is not found. A request belongs to
        the organization the Bot asked in, and is not found in any other, so
        the link a Bot hands the person (/sign-in/{signInRequestId}) opens
        only while they are working in that organization.
      security:
        - webSession: []
        - appOAuth: [sign-in-requests:read]
        - apiKey: []
      responses:
        '200':
          description: The request.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequestEnvelope'
              examples:
                example:
                  $ref: '#/components/examples/SignInRequestExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: '#/components/responses/SignInRequestNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/sign-in-requests/{signInRequestId}/submit:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/SignInRequestId'
    post:
      tags: [Sign-in requests]
      operationId: submitSignIn
      summary: Sign in with a typed login
      description: >-
        Type a username and password into the site in the Bot's browser.
        The credential goes to that browser and nowhere else: it is
        never written to the conversation, the audit trail, a log or the
        record of this write. The answer says whether the site took it:
        signed_in, code_required when the site then asked for a
        verification code, or pending again with why it did not work.
        With save, and the password manager on, a login the site
        accepted is kept for next time.
      security:
        - webSession: []
        - appOAuth: [sign-in-requests:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSignInRequest'
            examples:
              example:
                value:
                  username: sam@example.com
                  password: correct horse battery staple
                  save: false
      responses:
        '200':
          description: The request as this left it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequestEnvelope'
              examples:
                example:
                  $ref: '#/components/examples/SignInRequestExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '404':
          $ref: '#/components/responses/SignInRequestNotFound'
        '409':
          $ref: '#/components/responses/SignInRequestConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/sign-in-requests/{signInRequestId}/code:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/SignInRequestId'
    post:
      tags: [Sign-in requests]
      operationId: submitSignInCode
      summary: Enter the verification code a site sent
      description: >-
        Type the verification code the site asked for, once the request
        is code_required. The code goes to the Bot's browser and nowhere
        else, and is never saved: a code is good once.
      security:
        - webSession: []
        - appOAuth: [sign-in-requests:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSignInCodeRequest'
            examples:
              example:
                value:
                  code: '482913'
      responses:
        '200':
          description: The request as this left it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequestEnvelope'
              examples:
                example:
                  $ref: '#/components/examples/SignInRequestExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '404':
          $ref: '#/components/responses/SignInRequestNotFound'
        '409':
          $ref: '#/components/responses/SignInRequestConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/sign-in-requests/{signInRequestId}/use-saved:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/SignInRequestId'
    post:
      tags: [Sign-in requests]
      operationId: useSavedLogin
      summary: Sign in with a saved login
      description: >-
        Sign in with one of the person's saved logins for exactly this
        site, which is the person's confirmation to use it this once.
        Refused while the password manager is off, and for a login saved
        for any other site.
      security:
        - webSession: []
        - appOAuth: [sign-in-requests:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UseSavedLoginRequest'
            examples:
              example:
                value:
                  savedLoginId: 7b1d6f0e-3c2a-4b5d-8e9f-0a1b2c3d4e5f
      responses:
        '200':
          description: The request as this left it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequestEnvelope'
              examples:
                example:
                  $ref: '#/components/examples/SignInRequestExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '404':
          $ref: '#/components/responses/SignInRequestNotFound'
        '409':
          $ref: '#/components/responses/SignInRequestConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/sign-in-requests/{signInRequestId}/take-over:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/SignInRequestId'
    post:
      tags: [Sign-in requests]
      operationId: takeOverSignIn
      summary: Sign in by hand instead
      description: >-
        Hand the person the Bot's browser so they sign in themselves,
        from a request that is pending or waiting on a verification
        code. The request becomes taken_over and names the control
        request that hands the browser over.
      security:
        - webSession: []
        - appOAuth: [sign-in-requests:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The request as this left it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequestEnvelope'
              examples:
                example:
                  $ref: '#/components/examples/SignInRequestExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '404':
          $ref: '#/components/responses/SignInRequestNotFound'
        '409':
          $ref: '#/components/responses/SignInRequestConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/sign-in-requests/{signInRequestId}/finish:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/SignInRequestId'
    post:
      tags: [Sign-in requests]
      operationId: finishSignIn
      summary: Say the sign-in by hand is done
      description: >-
        After taking the browser over, say the person is signed in, so
        the Bot carries on. Refused unless the request is taken_over.
      security:
        - webSession: []
        - appOAuth: [sign-in-requests:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The request as this left it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequestEnvelope'
              examples:
                example:
                  $ref: '#/components/examples/SignInRequestExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '404':
          $ref: '#/components/responses/SignInRequestNotFound'
        '409':
          $ref: '#/components/responses/SignInRequestConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/sign-in-requests/{signInRequestId}/cancel:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/SignInRequestId'
    post:
      tags: [Sign-in requests]
      operationId: cancelSignIn
      summary: Decline a sign-in request
      description: >-
        Decline to sign the Bot in. The Bot is told the person chose not
        to, and not to ask for the login another way. Refused once the
        request is no longer open.
      security:
        - webSession: []
        - appOAuth: [sign-in-requests:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The request as this left it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInRequestEnvelope'
              examples:
                example:
                  $ref: '#/components/examples/SignInRequestExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '404':
          $ref: '#/components/responses/SignInRequestNotFound'
        '409':
          $ref: '#/components/responses/SignInRequestConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/saved-logins:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Saved logins]
      operationId: listSavedLogins
      summary: List a person's saved logins
      description: >-
        Return one page of the logins a person saved for their Bots to
        sign in with, by site and username, and whether the password
        manager is on for them. Never a password: one goes in and is
        never read back out. Only the person themselves may list them. A
        missing cursor starts at the first page and nextCursor null ends
        the list.
      security:
        - webSession: []
        - appOAuth: [saved-logins:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of saved logins.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedLoginPage'
              examples:
                example:
                  $ref: '#/components/examples/SavedLoginPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/saved-logins/{savedLoginId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/SavedLoginId'
    delete:
      tags: [Saved logins]
      operationId: deleteSavedLogin
      summary: Delete a saved login
      description: >-
        Forget a saved login, password included. Only the person who
        saved it may delete it. One already deleted is not found, which
        a client can read as done.
      security:
        - webSession: []
        - appOAuth: [saved-logins:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The saved login was deleted.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: '#/components/responses/SavedLoginNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/recorder-connect-codes:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    post:
      tags: [Recorder]
      operationId: createRecorderConnectCode
      summary: Make a code that connects a browser's Recorder
      description: >-
        Make a one-time code the OpenBot Recorder in a browser exchanges
        for a connection as this person (exchangeRecorderConnectCode).
        The code is in this answer and never again, works once and
        expires in five minutes. Because it is a credential the answer
        is not kept: a retry with the same Idempotency-Key is refused as
        a conflict rather than answered with the code again, so make a
        new code with a new key. Only the person themselves may make
        one, and only so many at once.
      security:
        - webSession: []
        - appOAuth: [recorder:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecorderConnectCodeRequest'
            examples:
              example:
                value:
                  via: web
      responses:
        '201':
          description: The code, shown this once.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderConnectCode'
              examples:
                example:
                  $ref: '#/components/examples/RecorderConnectCodeExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/RecorderSecretConflict'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/RecorderJsonOnly'
        '429':
          $ref: '#/components/responses/TooManyRecorderConnectCodes'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/recorder-connections:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Recorder]
      operationId: listRecorderConnections
      summary: List a person's connected browsers
      description: >-
        Return one page of the browsers whose Recorder is connected as
        this person, oldest first, each with whether it is recording now
        by its own latest report, and the Recorder extension ids this
        OpenBot trusts. Never a connection's token. Only the person
        themselves may list them. A missing cursor starts at the first
        page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [recorder:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of connected browsers.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderConnectionPage'
              examples:
                example:
                  $ref: '#/components/examples/RecorderConnectionPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/recorder-connections/{recorderConnectionId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/RecorderConnectionId'
    delete:
      tags: [Recorder]
      operationId: deleteRecorderConnection
      summary: Disconnect a browser
      description: >-
        End one of the person's Recorder connections from OpenBot: from
        now on that browser's Recorder is refused as signed out, and
        where OpenBot can reach the browser it is told at once. Only the
        person themselves may disconnect their browsers. One already
        ended is not found, which a client can read as done.
      security:
        - webSession: []
        - appOAuth: [recorder:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The browser was disconnected.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: '#/components/responses/RecorderConnectionNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/recordings:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Recorder]
      operationId: listRecordings
      summary: List a person's recordings
      description: >-
        Return one page of the recordings a person made with the
        Recorder, newest first, each with how it ended. Only the person
        themselves may list them. A page that could not be read in full
        says so in unavailable and keeps its cursor, so asking again
        retries it. A missing cursor starts at the first page and
        nextCursor null ends the list. A page holds at most 50 recordings,
        whatever limit asks for.
      security:
        - webSession: []
        - appOAuth: [recorder:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of recordings.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPage'
              examples:
                example:
                  $ref: '#/components/examples/RecordingPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '503':
          $ref: '#/components/responses/RecordingsUnavailable'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/recorder-connections:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Recorder]
      operationId: exchangeRecorderConnectCode
      summary: Connect a browser's Recorder with a code
      description: >-
        Exchange a connect code (createRecorderConnectCode) for a
        connection: the token the Recorder signs its own requests with
        from now on, shown this once. Nobody is signed in here: the code
        in the body is the credential, it works once, and only the
        OpenBot Recorder extension may ask, by its browser Origin. Every
        refusal is written to the audit trail. The code working once is
        what makes this write happen once; the Idempotency-Key is
        required as on every write, and the answer is never kept,
        because it holds the token.
      security: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRecorderConnectCodeRequest'
            examples:
              example:
                value:
                  code: obc_3q2-7wEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE0
                  label: Chrome on Sam's Mac
                  installId: 0123456789abcdef0123456789abcdef
      responses:
        '201':
          description: The connection, with its token shown this once.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderConnectionGrant'
              examples:
                example:
                  $ref: '#/components/examples/RecorderConnectionGrantExample'
        '400':
          $ref: '#/components/responses/InvalidRecorderConnectCode'
        '403':
          $ref: '#/components/responses/RecorderOriginRefused'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/RecorderJsonOnly'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/recorder-connections/current:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    delete:
      tags: [Recorder]
      operationId: deleteCurrentRecorderConnection
      summary: Disconnect this browser's Recorder
      description: >-
        End the connection the request is signed with: the Recorder's
        own Disconnect. Signed with the Recorder's connection token and
        nothing else. organizationId is `default` or the connection's own
        organization, and either way the call acts in the connection's
        organization.
      security:
        - recorderConnection: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: This browser was disconnected.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/RecorderSignedOut'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RecorderConnectionNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/RecorderAuthorityUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/recorder/me:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Recorder]
      operationId: getRecorderIdentity
      summary: Read who a Recorder is connected as
      description: >-
        Return the person this Recorder's connection acts as, and the
        connection's id. Signed with the Recorder's connection token and
        nothing else. organizationId is `default` or the connection's own
        organization, and either way the answer is for the connection's
        organization. A connection that has ended is refused as signed
        out, with why.
      x-openbot-singleton: true
      security:
        - recorderConnection: []
      responses:
        '200':
          description: The person and the connection.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderIdentity'
              examples:
                example:
                  $ref: '#/components/examples/RecorderIdentityExample'
        '401':
          $ref: '#/components/responses/RecorderSignedOut'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/RecorderAuthorityUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/recorder/learning:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Recorder]
      operationId: getRecorderLearning
      summary: Read where a Recorder's recordings are learned from
      description: >-
        Return whether the recordings this Recorder's person makes land
        in their own Learning space, which is made on first need. Signed
        with the Recorder's connection token and nothing else.
        organizationId is `default` or the connection's own organization,
        and either way the answer is for the connection's organization.
      x-openbot-singleton: true
      security:
        - recorderConnection: []
      responses:
        '200':
          description: The person's Learning space.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderLearning'
              examples:
                example:
                  $ref: '#/components/examples/RecorderLearningExample'
        '401':
          $ref: '#/components/responses/RecorderSignedOut'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/RecorderAuthorityUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/recorder/activity:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Recorder]
      operationId: reportRecorderActivity
      summary: Say what a Recorder is doing now
      description: >-
        Report what this browser's Recorder is doing, which it says
        whenever its recording phase changes and every 30 seconds while
        a recording runs, so OpenBot can show a recording wherever the
        person made it. Kept against the connection in place of the last
        report, and never audited: it is a heartbeat. Signed with the
        Recorder's connection token and nothing else. organizationId is
        `default` or the connection's own organization, and either way the
        report is kept in the connection's organization.
      security:
        - recorderConnection: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecorderActivity'
            examples:
              example:
                value:
                  phase: recording
                  recordingId: 5f0d6c0e-2f1a-4a53-9d51-6f3d6b1f6f10
                  title: File an expense
                  startedAt: 1794650000000
                  actions: 12
      responses:
        '204':
          description: The report was kept.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/RecorderSignedOut'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/RecorderJsonOnly'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/RecorderAuthorityUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  parameters:
    SignInRequestId:
      name: signInRequestId
      in: path
      required: true
      description: The sign-in request's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    SavedLoginId:
      name: savedLoginId
      in: path
      required: true
      description: The saved login's id. Never its password.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    RecorderConnectionId:
      name: recorderConnectionId
      in: path
      required: true
      description: The connection's id. Never its token.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
  schemas:
    RecorderProblem:
      description: >-
        A problem for the OpenBot Recorder: the shared problem details, with why its connection ended.
      allOf:
        - $ref: './common.yaml#/components/schemas/Problem'
        - type: object
          properties:
            reason:
              type: string
              enum: [revoked, removed, organization]
              description: >-
                Why a Recorder's connection ended, on RECORDER_SIGNED_OUT: the
                connection was ended or is unknown (revoked), the person was
                removed (removed), or their organization sign-in ended
                (organization).
    SignInStatus:
      type: string
      x-extensible-enum:
        - pending
        - filling
        - code_required
        - taken_over
        - signed_in
        - failed
        - cancelled
        - expired
      description: >-
        Where a sign-in request has got to. code_required: the site took the
        password and sent a verification code, and the form now asks for only
        that. signed_in, failed, cancelled and expired are final.
    SignInRequest:
      type: object
      description: >-
        A Bot's request to be signed in to a website, as the private form
        shows it. Never a credential.
      required:
        - id
        - botId
        - origin
        - reason
        - status
        - method
        - outcome
        - threadId
        - toolCallId
        - controlRequestId
        - createdAt
        - expiresAt
        - resolvedAt
        - fillingUntil
        - savedLogins
        - passwordManager
      properties:
        id:
          type: string
          description: The request's id.
        botId:
          type: string
          description: The Bot that asked.
        origin:
          type: string
          description: The site, as the origin a login belongs to, such as https://example.com.
        reason:
          type: [string, 'null']
          description: Why the Bot asked, in its own words.
        status:
          $ref: '#/components/schemas/SignInStatus'
        method:
          type: [string, 'null']
          enum: [typed, saved, takeover, null]
          description: How the person answered, once they have.
        outcome:
          type: [string, 'null']
          description: The last thing that happened, such as why a typed login did not work.
        threadId:
          type: [string, 'null']
          description: The conversation the Bot asked in.
        toolCallId:
          type: [string, 'null']
          description: The tool call that asked, so its card in the conversation can find this request.
        controlRequestId:
          type: [string, 'null']
          description: The request that hands the person the Bot's browser, once they took over.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time
        fillingUntil:
          type: [string, 'null']
          format: date-time
          description: While filling, when the attempt is given up on as abandoned.
        savedLogins:
          type: array
          description: >-
            The person's saved logins for this site, by username, while the
            password manager is on. Never a password.
          items:
            type: object
            required: [id, username]
            properties:
              id:
                type: string
              username:
                type: string
        passwordManager:
          type: boolean
          description: Whether the person may save a login and use a saved one.
    SignInRequestEnvelope:
      type: object
      required: [signInRequest]
      properties:
        signInRequest:
          $ref: '#/components/schemas/SignInRequest'
    SignInRequestPage:
      type: object
      required: [signInRequests, nextCursor]
      properties:
        signInRequests:
          type: array
          description: The newest request first, then by id.
          items:
            $ref: '#/components/schemas/SignInRequest'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    CreateSignInRequestRequest:
      type: object
      additionalProperties: false
      required: [botId, site]
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 200
          description: The Bot to sign in.
        site:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            The website: an http or https address, or a bare host, which is
            read as https. Kept as its origin.
        reason:
          type: string
          maxLength: 500
          description: Why the Bot needs it, shown to the person.
        threadId:
          type: string
          maxLength: 200
          description: The conversation the Bot asked in.
        toolCallId:
          type: string
          maxLength: 200
          description: The tool call that asked.
    SubmitSignInRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        username:
          type: string
          maxLength: 512
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Goes to the Bot's browser and nowhere else.
        save:
          type: boolean
          description: Keep this login for next time, if the site accepts it and the password manager is on.
    SubmitSignInCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          writeOnly: true
          description: The verification code the site sent. Good once, and never saved.
    UseSavedLoginRequest:
      type: object
      additionalProperties: false
      required: [savedLoginId]
      properties:
        savedLoginId:
          type: string
          minLength: 1
          maxLength: 200
          description: One of the request's savedLogins.
    SavedLogin:
      type: object
      description: A saved login as the API shows it. Never its password.
      required: [id, origin, username, createdAt, updatedAt, lastUsedAt]
      properties:
        id:
          type: string
        origin:
          type: string
          description: The one site the login is for, as its origin.
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
    SavedLoginPage:
      type: object
      required: [savedLogins, nextCursor, passwordManager]
      properties:
        savedLogins:
          type: array
          description: By site, then username, then id.
          items:
            $ref: '#/components/schemas/SavedLogin'
        passwordManager:
          type: boolean
          description: Whether the person may save a login and use a saved one.
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    CreateRecorderConnectCodeRequest:
      type: object
      additionalProperties: false
      required: [via]
      properties:
        via:
          type: string
          enum: [web, desktop]
          description: 'How the browser is being connected: from OpenBot in a browser, or by OpenBot Desktop.'
    RecorderConnectCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: The one-time code. A credential, shown this once.
        expiresAt:
          type: string
          format: date-time
    RecorderConnection:
      type: object
      description: A browser whose Recorder is connected as a person. Never its token.
      required: [id, label, via, extensionId, installId, createdAt, lastUsedAt]
      properties:
        id:
          type: string
        label:
          type: string
          description: The browser's name, as its Recorder gave it.
        via:
          type: string
          enum: [web, desktop, openbot-browser, bot-browser]
          description: >-
            How it was connected: from OpenBot in a browser, by OpenBot
            Desktop, by OpenBot for the person's own OpenBot browser, or by
            OpenBot for one recording in a Bot's browser.
        extensionId:
          type: string
          description: The Recorder extension's id.
        installId:
          type: string
          description: 'The connecting copy''s install id: 32 lower-case hex digits.'
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
    ListedRecorderConnection:
      allOf:
        - $ref: '#/components/schemas/RecorderConnection'
        - type: object
          required: [recording]
          properties:
            recording:
              type: boolean
              description: Its Recorder said it is recording, in a report recent enough to stand.
    RecorderConnectionPage:
      type: object
      required: [recorderConnections, extensionIds, nextCursor]
      properties:
        recorderConnections:
          type: array
          description: The oldest connection first, then by id.
          items:
            $ref: '#/components/schemas/ListedRecorderConnection'
        extensionIds:
          type: array
          description: The Recorder extension ids this OpenBot trusts.
          items:
            type: string
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    Recording:
      type: object
      required: [id, title, recordedAt, ended, reason]
      properties:
        id:
          type: string
        title:
          type: [string, 'null']
        recordedAt:
          type: string
          format: date-time
        ended:
          type: string
          enum: [succeeded, stopped, sending, unknown, missing]
          description: >-
            How it ended: sending while it has not all arrived, missing when
            it can no longer be found, unknown when that could not be read.
        reason:
          type: [string, 'null']
          description: Why it stopped, when it said.
    RecordingPage:
      type: object
      required: [recordings, nextCursor]
      properties:
        recordings:
          type: array
          description: The newest recording first, then by id.
          items:
            $ref: '#/components/schemas/Recording'
        unavailable:
          type: string
          enum: [unavailable, unreachable]
          description: >-
            Present when this page could not be read in full: what holds the
            recordings is turned off (unavailable) or could not be reached
            (unreachable).
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    ExchangeRecorderConnectCodeRequest:
      type: object
      additionalProperties: false
      required: [code, label, installId]
      properties:
        code:
          type: string
          maxLength: 80
          pattern: ^obc_
          writeOnly: true
          description: The connect code. The credential of this request.
        label:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          description: The browser's name, to list it by. Trimmed.
        installId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: 'This copy of the Recorder''s install id: 32 lower-case hex digits.'
    RecorderUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
          description: Their name, or their email where they have none.
        email:
          type: string
    RecorderConnectionGrant:
      type: object
      required: [token, connection, user]
      properties:
        token:
          type: string
          description: The connection token (recorderConnection). A credential, shown this once.
        connection:
          $ref: '#/components/schemas/RecorderConnection'
        user:
          $ref: '#/components/schemas/RecorderUser'
        organizationId:
          type: string
          description: >-
            The organization the connection works in, the one the connect
            code was made in. The Recorder names it in every address it calls
            from now on. Absent from a server that keeps every connection in
            `default`.
    RecorderIdentity:
      type: object
      required: [user, connectionId]
      properties:
        user:
          $ref: '#/components/schemas/RecorderUser'
        connectionId:
          type: string
    RecorderLearning:
      type: object
      required: [learning]
      properties:
        learning:
          type: object
          required: [state, containerId]
          properties:
            state:
              type: string
              enum: [assigned, unassigned, missing, learning-off, unverified, unjoined]
              description: >-
                assigned: the space exists. unassigned: Automatic Learning is
                off, so there is none. missing: it does not exist and could
                not be made. learning-off: Learning is off, so it was not
                checked. unverified: it could not be checked for now.
                unjoined: the recording joined no space in time.
            containerId:
              type: [string, 'null']
    RecorderActivity:
      type: object
      additionalProperties: false
      required: [phase, actions]
      properties:
        phase:
          type: string
          enum: [idle, starting, recording, stopping]
        recordingId:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          maxLength: 200
        startedAt:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: When the recording started, in milliseconds since 1970.
        actions:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: How many actions the recording holds so far.
  responses:
    SignInRequestNotFound:
      description: >-
        The person has no such sign-in request, the saved login named
        is not one of theirs for this site, or the organization does
        not exist.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/sign-in-request-not-found
                title: Sign-in request not found.
                status: 404
                detail: There is no such sign-in request.
                code: SIGN_IN_REQUEST_NOT_FOUND
