components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        The web app's server-side session, so no token ever reaches the
        browser. Served over HTTPS the cookie is
        __Secure-better-auth.session_token. A single-user install signs its
        one person in without a cookie.
    appOAuth:
      type: oauth2
      description: >-
        Desktop and mobile. OAuth 2.1 authorization code with PKCE
        (RFC 7636, S256 only); the access token is sent as a bearer token.


        Clients. Three public clients are registered: `openbot-desktop-oauth`,
        `openbot-mobile` and `openbot-cli`. A public client has no secret and
        must use PKCE with S256. Dynamic client registration is off, so an
        app uses one of these ids.


        Redirect addresses. A client on the person's own computer listens on
        a loopback address and any port:
        `http://127.0.0.1:<any port>/callback` or
        `http://[::1]:<any port>/callback`. `localhost` is not accepted.


        Endpoints. The authorization server's metadata (RFC 8414) is at
        `/.well-known/oauth-authorization-server/api/auth`. The person is
        sent to `/api/auth/oauth2/authorize`. The code is exchanged, and a
        token refreshed, at `/api/auth/oauth2/token`, with a form-encoded
        body (`application/x-www-form-urlencoded`) that carries `client_id`
        and no secret: the token and revocation endpoints take no client
        authentication (`none` in the metadata's
        `token_endpoint_auth_methods_supported`). A wrong `code_verifier` is
        answered 400 `invalid_grant`, and the code cannot be used again. A
        token is revoked (RFC 7009) at `/api/auth/oauth2/revoke`; revoking a
        token the server does not know, or one already revoked, answers 200.


        Tokens. An access token starts `oba_` and lasts one hour. A refresh
        token starts `obr_`, is issued only when the `offline_access` scope
        is asked for, and rotates on every use: each refresh answers a new
        refresh token and ends the one it was given. Access tokens work on
        /api/v2, and on four addresses outside it that an app's screens need,
        each with the scope given: `GET /api/me`, who is signed in
        (people:read); the chat runtime at `/api/copilotkit` and everything
        under it (conversations:write); a file's download at
        `GET /api/attachments/{attachmentId}`, the address a sent message
        keeps (conversations:read); and the relayed realtime socket at
        `/api/intelligence/client/websocket` (conversations:read), which is
        also on /api/v2 at
        `/api/v2/organizations/{organizationId}/realtime/websocket`. They work
        nowhere else.


        Organization. An access token carries no memory of which
        organization the person is working in. An address under
        `/api/v2/organizations/{organizationId}` names it. Where an address
        names none, such as the list of the person's own organizations, an
        app sends the header `OpenBot-Organization` with the organization's
        id. It is checked against the person's membership on every request,
        and an organization they are not in answers not found. With no
        header, the app works in the person's own organization.


        Consent. The person is asked once for each app, and not again for
        scopes they already allowed it.


        An install for one person on one computer has no sign-in, so it has
        no OAuth: there is nobody to authorize an app as.
      flows:
        authorizationCode:
          authorizationUrl: /api/auth/oauth2/authorize
          tokenUrl: /api/auth/oauth2/token
          refreshUrl: /api/auth/oauth2/token
          scopes:
            conversations:read: Read the signed-in person's conversations, and watch a Bot's runs in them.
            conversations:write: Start, rename, pin and delete the signed-in person's conversations, and send messages and files in them.
            tasks:read: Read the signed-in person's tasks.
            tasks:write: Mark the signed-in person's tasks done, reopen them and try them again.
            bots:read: Read the Bots the signed-in person can see, and what each is doing for them.
            bots:write: Create, change and delete the signed-in person's Bots, and pause, reset, hide and pin any Bot they can see, for themselves.
            team-bots:read: Read the Team Bots the signed-in person may use or manages.
            team-bots:write: Publish the signed-in person's Bots to the team, answer Team Bots' requests to use their accounts, and for an administrator assign Team Bots to groups.
            computers:read: Watch the signed-in person's Bots' screens and terminals, read their computers and browsers, and for an administrator list the organization's computers.
            computers:write: Use the mouse and keyboard on the signed-in person's Bots' computers and browsers, act on them as a Bot, and for an administrator stop, reset and update the organization's computers.
            reactions:read: Read the reactions Bots left on the signed-in person's messages.
            audit-events:read: Read the organization's audit trail, when the signed-in person is an administrator.
            people:read: Read the signed-in person, their standing instructions and preferences, and for an administrator everybody in the organization.
            people:write: Change the signed-in person's name, onboarding, standing instructions and preferences, and for an administrator anybody's role and access.
            linked-accounts:read: Read the signed-in person's linked accounts, and which services can be linked.
            linked-accounts:write: Link and unlink the signed-in person's accounts at other services.
            identity-providers:read: Read the organization's identity providers, when the signed-in person is an administrator.
            identity-providers:write: Remove the organization's identity providers, when the signed-in person is an administrator.
            settings:read: Read the organization's settings, when the signed-in person is an administrator.
            settings:write: Change the organization's settings and stop idle computers, when the signed-in person is an administrator.
            capabilities:read: Read the permission switches, and describe and preview changes to them, when the signed-in person is an administrator.
            capabilities:write: Change the permission switches, when the signed-in person is an administrator.
            network-policies:read: Read where Bot computers may connect, and describe and test a policy, when the signed-in person is an administrator.
            network-policies:write: Set and remove where Bot computers may connect, when the signed-in person is an administrator.
            model-usage:read: Read which models Bots ran on, when the signed-in person is an administrator.
            computer-actions:read: Read the actions recorded on Bot computers, when the signed-in person is an administrator.
            setup-checklist:read: Read the setup checklist, and check it again.
            credentials:read: Read which credentials the vault keeps and where the Bots' model key is filed, never a secret, when the signed-in person is an administrator.
            credentials:write: Add credentials to the vault and revoke them, when the signed-in person is an administrator.
            model-catalogue:read: Read the models Bots can run on.
            model-choices:read: Read the model the signed-in person chose for each of their conversations.
            model-choices:write: Choose the model the signed-in person's conversations answer on.
            ai-connection:read: Read how OpenBot reaches its AI provider, never a key, when the signed-in person is an administrator.
            ai-connection:write: Change how OpenBot reaches its AI provider, when the signed-in person is an administrator.
            apps:read: Read the apps the organization has added, the directory of apps it can add, and how apps are set up here.
            apps:write: Add, change, refresh and remove apps, when the signed-in person may.
            connections:read: Read the signed-in person's connections to apps, and each app's shared account.
            connections:write: Connect and disconnect the signed-in person's apps, and an app's shared account when the signed-in person is an administrator.
            bot-grants:read: Read what the signed-in person's Bots may use, and describe or test a change to it.
            bot-grants:write: Give and take back what the signed-in person's Bots may use.
            app-access-requests:read: Read requests for apps, the signed-in person's own or, for an administrator, everybody's.
            app-access-requests:write: Ask for an app, withdraw a request, and for an administrator approve or dismiss one.
            components:read: Read the components Bots draw, check whether a Bot may draw one, and read the data a component shows.
            components:write: Tell OpenBot which components the app can draw, and, when the signed-in person is an admin, write, publish and delete components and choose which Bots and data each may use.
            skills:read: Read the skills the signed-in person can use, and for an admin everybody's.
            skills:write: Write and delete the signed-in person's skills, and for an admin the organization's and anybody's.
            devices:read: Read the phones the signed-in person registered for push notifications.
            devices:write: Register the signed-in person's phones for push notifications, and remove them.
            destinations:read: Read where the signed-in person continues conversations in Slack, Microsoft Teams and text messages.
            destinations:write: Connect and disconnect the signed-in person's Slack, Microsoft Teams and text message destinations.
            deliveries:read: Read what Bots sent the signed-in person outside OpenBot.
            notification-settings:read: Read where the signed-in person's updates go, how much each Bot may send them, and the ways this deployment can reach people.
            notification-settings:write: Change where the signed-in person's updates go and how much each Bot may send them.
            routines:read: Read the signed-in person's routines and their runs.
            routines:write: Create, pause, resume, run and delete the signed-in person's routines.
            check-ins:read: Read the signed-in person's check-ins and the items they raised, and for an administrator how check-ins are going.
            check-ins:write: Turn the signed-in person's check-ins on and off, change and run them, and start or hide the items they raised.
            goals:read: Read the signed-in person's goals, their runs, their triggers and their GitHub event sources. Reading a trigger's secret needs goals:write.
            goals:write: Create, change, pause, resume, complete, run and delete the signed-in person's goals, their triggers and their GitHub event sources.
            organizations:read: Read the organizations the signed-in person is a member of, and their members.
            organizations:write: Create organizations and add members to them, where the signed-in person may.
            approvals:read: Read what the signed-in person's Bots are waiting on them for, and their own approval preferences and rules.
            approvals:write: Decide the signed-in person's approvals, answer their Bots' questions, and change their own approval preferences and rules.
            approval-rules:read: Read the organization's approval rules and its guidance for auto-review, and describe, check and test them, when the signed-in person is an administrator.
            approval-rules:write: Save the organization's approval rules and its guidance for auto-review, when the signed-in person is an administrator.
            boundaries:read: Read the boundaries on what Bots may do, and describe and test a rule, when the signed-in person is an administrator.
            boundaries:write: Set the boundaries on what Bots may do, when the signed-in person is an administrator.
            shared-use:read: Read a Bot's use of shared app accounts, when the signed-in person owns the Bot, and the requests waiting for an answer, when they are an administrator.
            shared-use:write: Ask that a Bot may use a shared app account, when the signed-in person owns the Bot, and approve or decline a request, when they are an administrator.
            host-access:read: Read the folders on the signed-in person's own computer that they gave their Bots.
            host-access:write: Give a Bot a folder on the signed-in person's own computer, take one away, and stop folder access.
            sign-in-requests:read: Read the sign-in requests the signed-in person's Bots are waiting on, never a credential.
            sign-in-requests:write: Open, answer and decline sign-in requests for the signed-in person.
            saved-logins:read: Read which logins the signed-in person saved, never a password.
            saved-logins:write: Delete the signed-in person's saved logins.
            recorder:read: Read the signed-in person's connected browsers and their recordings.
            recorder:write: Connect and disconnect the signed-in person's browsers.
            learning:read: Read what Learning proposed in the signed-in person's own spaces, their Learning choices and skills, and for an administrator the organization's Learning settings, spaces, people's proposals and sharing requests.
            learning:write: Approve and reject what Learning proposed and start Learning in the signed-in person's own spaces, change their Learning choices, and for an administrator change the organization's Learning settings and decide sharing requests.
            memories:read: Read the signed-in person's memories and memory sources.
            memories:write: Write, change and forget the signed-in person's memories, and add, change, sync and remove their memory sources.
            bot-agents:read: Read the agents the signed-in person's Bots may hand work to, and for an administrator every agent in the organization.
            bot-agents:write: Add, change and delete the signed-in person's own agents and their callback tokens, and for an administrator the organization's.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: OpenBot API key
      description: >-
        Automation. An API key acts as the person who created it, like a
        personal access token: in every organization they are a member of,
        or in one organization only when it was made for that one
        (organizationOnly). The address of each request names the
        organization, and one the key does not work in answers not found. A
        key starts `obk_` and is sent as
        `Authorization: Bearer <key>` or in an `x-api-key` header, on /api/v2
        (the relayed realtime socket at
        `/api/v2/organizations/{organizationId}/realtime/websocket` included)
        and on the relayed realtime socket at
        `/api/intelligence/client/websocket`, where a join token the key made
        is spent (createConversationJoinToken). A person makes one in the web
        app, signed in, under Settings, then API keys (createApiKey).
    recorderConnection:
      type: http
      scheme: bearer
      bearerFormat: OpenBot Recorder connection token
      description: >-
        The OpenBot Recorder. A connection token, made when a browser's
        Recorder exchanges a connect code (exchangeRecorderConnectCode),
        acts as the person who connected it, and only on the Recorder's own
        operations: the server accepts it nowhere else. It ends when the
        person disconnects the browser, when their sign-in ends, or when it
        expires.
    # ---- computers sub-area C (sign-in requests, saved logins, the Recorder): security scheme end ----
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: >-
        The organization, by its id or its slug. One the caller is not a
        member of answers as one that does not exist, `default` included.
      schema:
        type: string
        minLength: 1
      example: default
    PersonId:
      name: personId
      in: path
      required: true
      description: >-
        The person: me for the caller, or a person's id. A person's own
        things (their instructions, preferences, API keys, sessions and
        linked accounts) answer only the person themselves, by either.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
      example: me
    ApiKeyId: { $ref: './accounts.yaml#/components/parameters/ApiKeyId' }
    SessionId: { $ref: './accounts.yaml#/components/parameters/SessionId' }
    LinkedAccountId: { $ref: './accounts.yaml#/components/parameters/LinkedAccountId' }
    IdentityProviderId: { $ref: './accounts.yaml#/components/parameters/IdentityProviderId' }
    CapabilityIdParameter: { $ref: './admin-settings.yaml#/components/parameters/CapabilityIdParameter' }
    NetworkPolicyId: { $ref: './admin-settings.yaml#/components/parameters/NetworkPolicyId' }
    BotId: { $ref: './bots.yaml#/components/parameters/BotId' }
    AppId: { $ref: './apps.yaml#/components/parameters/AppId' }
    Limit:
      name: limit
      in: query
      description: Most items in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque continuation from the previous page's nextCursor, bound to the
        organization and the filters that made it. The server only ever issues
        cursors written in URL-safe base64 (letters, digits, - and _, no
        padding) and refuses anything else, so the pattern says so. A cursor
        that fits the pattern can still be refused: one this list never gave
        out, or one made for another organization or other filters.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: ^[A-Za-z0-9_-]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Generated by the caller for each write it means to make once. Reuse the
        same key and the same request for 24 hours after an uncertain response;
        the same key with a different request is a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuditEventTypes: { $ref: './audit-events.yaml#/components/parameters/AuditEventTypes' }
    AuditExcludedEventTypes: { $ref: './audit-events.yaml#/components/parameters/AuditExcludedEventTypes' }
    AuditExcludedCalls: { $ref: './audit-events.yaml#/components/parameters/AuditExcludedCalls' }
    AuditActor: { $ref: './audit-events.yaml#/components/parameters/AuditActor' }
    AuditInitiatorKinds: { $ref: './audit-events.yaml#/components/parameters/AuditInitiatorKinds' }
    AuditTargetTypes: { $ref: './audit-events.yaml#/components/parameters/AuditTargetTypes' }
    AuditTargetId: { $ref: './audit-events.yaml#/components/parameters/AuditTargetId' }
    AuditBots: { $ref: './audit-events.yaml#/components/parameters/AuditBots' }
    AuditApps: { $ref: './audit-events.yaml#/components/parameters/AuditApps' }
