    ComputerActionPage: { $ref: './admin-settings.yaml#/components/schemas/ComputerActionPage' }
    SetupChecklist: { $ref: './admin-settings.yaml#/components/schemas/SetupChecklist' }
    Problem:
      type: object
      description: >-
        RFC 9457 problem details, in the shape CopilotKit Intelligence's v2
        API uses. status equals the HTTP status; code and type name the same
        stable error. detail is the sentence a person reads.
      required:
        - type
        - title
        - status
        - detail
        - code
        - category
        - retryable
        - requestId
        - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
        category:
          type: string
          enum:
            - validation
            - auth
            - permission
            - not_found
            - conflict
            - rate_limit
            - internal
            - dependency
        retryable:
          type: boolean
        requestId:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        capability:
          type: string
          description: >-
            The switch an administrator can turn on for this person, when the
            refusal is for want of one (isolatedComputers).
        problems:
          type: array
          description: >-
            What is wrong, item by item, when a refusal has more than one
            reason: each entry names the item and says what is wrong with it.
          items:
            type: object
        client:
          type: string
          x-extensible-enum: [web, desktop, mobile, recorder]
          description: >-
            On CLIENT_UPDATE_REQUIRED, the app the OpenBot-Client header named
            that is older than this OpenBot serves. A later OpenBot may name
            another app; read one you don't know as other.
        minimumVersion:
          type: string
          description: On CLIENT_UPDATE_REQUIRED, the oldest release of that app this OpenBot serves.
        security:
          type: boolean
          description: >-
            On CLIENT_UPDATE_REQUIRED, true when the minimum the app is below
            was raised because of a security problem in older releases.
