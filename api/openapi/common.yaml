# OpenBot's REST API: the root of the spec, and the conventions every area shares (info, servers,
# tags, security schemes and OAuth scopes, problem details, paging, Idempotency-Key, shared headers
# and responses). Each area's operations and the components only it uses live in their own file
# beside this one; `paths` below points at them.
#
# `bun run api:bundle` joins them into api/openapi.yaml, the file every client and check reads.
# Never edit api/openapi.yaml by hand. See api/README.md.
#
# Parallel branches append to the tags, the scopes and the paths here, so git merges this file with
# its union driver (.gitattributes): both sides' new lines are kept. A component listed here as a
# $ref into an area file is listed only to keep the bundle's order; a new one needs no line here.
openapi: 3.1.1
info:
  title: OpenBot API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    The one API every OpenBot client uses: the web app, Desktop, mobile, the
    Recorder and the CLI. It follows the conventions of CopilotKit
    Intelligence's v2 API so both read as one API, and OpenBot's resources sit
    beside Intelligence's under the same organization address
    (/api/v2/organizations/{organizationId}/...). Errors are RFC 9457 problem
    details (application/problem+json), lists page with an opaque cursor and a
    limit, and every write takes an Idempotency-Key.


    Until multi-organization lands, an OpenBot install has exactly one
    organization, and organizationId is that organization. Clients address it
    as `default`; the server treats any other value as an organization that
    does not exist.


    This file is the single source of truth: the clients, the server's types,
    the docs and the contract tests are all generated from it or checked
    against it. A change that breaks an existing client fails the pull request.
servers:
  - url: http://127.0.0.1:3001
    description: An OpenBot server on this machine (the default local port).
tags:
  - { name: Bots, description: "The Bots a person can see: their own, those shared with them, the ones an administrator assigned them, and the ones that come with OpenBot." }
  - { name: Reactions, description: "The reactions a Bot leaves on a person's message in place of a line of its own, when the message only needs an acknowledgement." }
  - { name: Audit events, description: "The audit trail: what people and Bots did in the organization, and what its policy refused, newest first. Only an administrator can read it. It is read-only: events are written by what they record, never through the API." }
  - { name: People, description: "The people in the organization: who they are, what they may do, and what is theirs alone (their standing instructions, preferences and first-run onboarding). An administrator sees everybody; anybody else sees themselves, as me." }
  - { name: Linked accounts, description: "A person's accounts at other services, such as Slack and GitHub, that OpenBot knows are theirs, so a Bot answering there knows who it is talking to." }
  - { name: Identity providers, description: "The companies' own identity providers registered for single sign-on, by email domain. Only an administrator manages them." }
  - { name: API keys, description: "The keys a person makes for automation. A key acts as them, inside the organization, on the API only, and only a person signed in to OpenBot can make or manage one." }
  - { name: Sessions, description: "Where a person is signed in to OpenBot, so they can see each browser and device and sign one out." }
  - { name: Organization settings, description: "What an administrator sets for everybody, and what this OpenBot offers: sign-in, recording, idle computers, allowlists, the setup checklist, and which models Bots ran on." }
  - { name: Capabilities, description: "The permission switches that decide what people may do, set for the organization, a role or a directory group, and each person's answer." }
  - { name: Network policies, description: "Where Bot computers may connect, for the organization and for a directory group." }
  - { name: Conversations, description: "A person's conversations with Bots. What a Bot is doing in one streams over a WebSocket, described in api/asyncapi.yaml; the operations here hand out what that socket needs." }
  - { name: Credentials, description: "The vault: the model keys, app keys and app tokens OpenBot keeps encrypted for its Bots. A secret goes in and is never read back out. Only an administrator manages them." }
  - { name: Models, description: "The models Bots can run on, and the one a person chose for each of their conversations." }
  - { name: Apps, description: "The apps this OpenBot has added for its Bots to use, from the directory of apps it can add or by a server's address, and how apps are set up here." }
  - { name: Connections, description: "A person's connections to apps: the accounts they signed in with so their Bots can act there for them, and an app's one shared account when an administrator connects it for everybody." }
  - { name: Bot grants, description: "What each Bot may use: the app actions, skills and other Bots it was given, and each app as it stands for the person asking." }
  - { name: App access requests, description: "A person asking an administrator to turn an app on, give it to a Bot, or connect its shared account." }
