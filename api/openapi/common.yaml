    Problem:
      type: object
      description: >-
        RFC 9457 problem details, in the shape CopilotKit Intelligence's v2
        API uses. status equals the HTTP status; code and type name the same
        stable error. detail is the sentence a person reads.
      required:
        - type
        - title
        - status
        - detail
        - code
        - category
        - retryable
        - requestId
        - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
        category:
          type: string
          enum:
            - validation
            - auth
            - permission
            - not_found
            - conflict
            - rate_limit
            - internal
            - dependency
        retryable:
          type: boolean
        requestId:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        capability:
          type: string
          description: >-
            The switch an administrator can turn on for this person, when the
            refusal is for want of one (isolatedComputers).
