# OpenBot's REST API: the root of the spec, and the conventions every area shares (info, servers,
# tags, security schemes and OAuth scopes, problem details, paging, Idempotency-Key, shared headers
# and responses). Each area's operations and the components only it uses live in their own file
# beside this one; `paths` below points at them.
#
# `bun run api:bundle` joins them into api/openapi.yaml, the file every client and check reads.
# Never edit api/openapi.yaml by hand. See api/README.md.
#
# Parallel branches append to the tags, the scopes and the paths here, so git merges this file with
# its union driver (.gitattributes): both sides' new lines are kept. A component listed here as a
# $ref into an area file is listed only to keep the bundle's order; a new one needs no line here.
openapi: 3.1.1
info:
  title: OpenBot API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    The one API every OpenBot client uses: the web app, Desktop, mobile and
    the Recorder. It follows the conventions of CopilotKit
    Intelligence's v2 API so both read as one API, and OpenBot's resources sit
    beside Intelligence's under the same organization address
    (/api/v2/organizations/{organizationId}/...). Errors are RFC 9457 problem
    details (application/problem+json), lists page with an opaque cursor and a
    limit, and every write takes an Idempotency-Key.


    An OpenBot install holds one or more organizations, and a person may be a
    member of several. Where an install allows more than one, everybody has
    an organization of their own, made for them when they first sign in, and
    joins others by invitation. Otherwise, and on an install for one person
    with no sign-in, everybody works in the organization `default`.
    organizationId is an organization's id or its slug, and the caller must
    be a member of it: an organization the caller is not in answers exactly
    as one that does not exist, `default` included.


    A program of your own signs its requests in one of two ways. An API key
    acts as the person who made it, in every organization they are a member
    of, like a personal access token: the address names the organization
    each request is for. Keys start `obk_` and are sent as
    `Authorization: Bearer <key>` or in an `x-api-key` header, on /api/v2
    and on the socket a join token is spent on (createConversationJoinToken).
    To get a first key, sign in to OpenBot's web app, open Settings, then API
    keys, and create one. The key is shown once. Only a person signed in to
    the web app can make or delete keys: a key or an app's sign-in cannot.
    An app that signs people in uses OAuth 2.1 instead, described under the
    appOAuth security scheme: its client ids, redirect addresses, endpoints,
    how long tokens last and the four addresses outside /api/v2 a token also
    works at.


    An install for one person on one computer has no sign-in. It signs
    nobody in, so it has neither OAuth nor API keys, and the operations
    that manage keys and sessions answer 503 with the code
    SIGN_IN_UNAVAILABLE.


    OpenBot's own apps name themselves on every request in the header
    `OpenBot-Client`: `<kind>/<version>`, where kind is web, desktop,
    mobile or recorder, such as `OpenBot-Client: desktop/1.1.0`. A header
    may name more than one, separated by spaces: OpenBot Desktop adds its
    own to the one its window's page sent. getDeployment says which API
    versions this OpenBot serves and the oldest release of each app it
    serves (minimumClients). Every other operation under /api/v2 refuses
    an app older than that with 400 and the code CLIENT_UPDATE_REQUIRED, whose problem
    names the app (client) and its minimum (minimumVersion) and whose
    detail tells the person to update OpenBot. When that minimum was raised
    because of a security problem in older releases, the problem also says
    security: true, and getDeployment lists it under securityMinimumClients.
    A program of your own need not send the header; without it nothing is
    refused for a version.


    This file is the single source of truth: the clients, the server's types,
    the docs and the contract tests are all generated from it or checked
    against it. A change that breaks an existing client fails the pull request.
servers:
  - url: http://127.0.0.1:3001
    description: An OpenBot server on this machine (the default local port).
tags:
  - { name: Bots, description: "The Bots a person can see: their own, those shared with them, the ones an administrator assigned them, and the ones that come with OpenBot." }
  - { name: Team Bots, description: "Bots their owners published to the team, or to named people and directory groups, and the ones an administrator assigned to a group. Each person's conversations with a Team Bot are private to them." }
  - { name: Reactions, description: "The reactions a Bot leaves on a person's message in place of a line of its own, when the message only needs an acknowledgement." }
  - { name: Audit events, description: "The audit trail: what people and Bots did in the organization, and what its policy refused, newest first. Only an administrator can read it. It is read-only: events are written by what they record, never through the API." }
  - { name: People, description: "The people in the organization: who they are, what they may do, and what is theirs alone (their standing instructions, preferences and first-run onboarding). An administrator sees everybody; anybody else sees themselves, as me." }
  - { name: Linked accounts, description: "A person's accounts at other services, such as Slack and GitHub, that OpenBot knows are theirs, so a Bot answering there knows who it is talking to." }
  - { name: Identity providers, description: "The companies' own identity providers registered for single sign-on, by email domain. Only an administrator manages them." }
  - { name: API keys, description: "The keys a person makes for automation. A key acts as them, in every organization they are a member of, on the API, and only a person signed in to OpenBot can make or manage one." }
  - { name: Sessions, description: "Where a person is signed in to OpenBot, so they can see each browser and device and sign one out." }
  - { name: Organization settings, description: "What an administrator sets for everybody, and what this OpenBot offers: sign-in, recording, idle computers, allowlists, the setup checklist, and which models Bots ran on." }
  - { name: Capabilities, description: "The permission switches that decide what people may do, set for the organization, a role or a directory group, and each person's answer." }
  - { name: Network policies, description: "Where Bot computers may connect, for the organization and for a directory group." }
  - { name: Conversations, description: "A person's conversations with Bots. What a Bot is doing in one streams over a WebSocket, described in api/asyncapi.yaml; the operations here hand out what that socket needs." }
  - { name: Tasks, description: "The work a Bot does for a person in a conversation of its own: started from something a check-in found, or handed to the Bot by another. Where a task stands is read from its conversation, never stored." }
  - { name: Voice, description: "Voice calls with a conversation's Bot: how a call connects, and the calls a person saved in a conversation with their transcripts." }
  - { name: Credentials, description: "The organization's vault: the model keys, app keys and app tokens OpenBot keeps encrypted for its Bots. A secret goes in and is never read back out. Only an administrator manages them." }
  - { name: Models, description: "The models Bots can run on, and the one a person chose for each of their conversations." }
  - { name: Apps, description: "The apps the organization has added for its Bots to use, from the directory of apps it can add or by a server's address, and how apps are set up here." }
  - { name: Connections, description: "A person's connections to apps: the accounts they signed in with so their Bots can act there for them, and an app's one shared account when an administrator connects it for everybody." }
  - { name: Bot grants, description: "What each Bot may use: the app actions, skills and other Bots it was given, and each app as it stands for the person asking." }
  - { name: App access requests, description: "A person asking an administrator to turn an app on, give it to a Bot, or connect its shared account." }
  - { name: Components, description: "The charts, cards and other components a Bot draws in a conversation instead of answering in text. Most come with OpenBot, and an admin can write more in Playground. An admin decides what each tells the model, which Bots may draw it and which data it may read." }
  - { name: Skills, description: "Named instructions a person runs by typing / in a conversation. Anybody can write their own, and an admin writes the organization's. A skill adds no access: a Bot that runs one uses only the apps it can already use." }
  - { name: Devices, description: "The phones a person signed in to the OpenBot app on and turned notifications on for, which their Bots send push notifications to." }
  - { name: Destinations, description: "Where a person continues a conversation with a Bot outside OpenBot: a Slack or Microsoft Teams chat, or a phone number for text messages." }
  - { name: Deliveries, description: "What Bots sent a person outside OpenBot, and where each one got to." }
  - { name: Notification settings, description: "How a person hears from their Bots while they're away: which ways each kind of update may use, how much each Bot may send, and which ways this deployment can reach anyone at all." }
  - { name: Routines, description: "A person's routines: what a Bot does for them on a schedule, in a conversation they share. A routine belongs to the person who made it and answers only them." }
  - { name: Check-ins, description: "A Bot's check-ins: quiet looks through what a person connected, the items a check-in raised for them, and an administrator's numbers for how check-ins are going." }
  - { name: Goals, description: "A person's goals: an outcome a Bot works toward, run on request, on a routine's schedule or when an outside event arrives through one of the goal's triggers." }
  - { name: Follow-ups, description: "Work a Bot scheduled for itself to come back to later in a conversation." }
  - { name: Organizations, description: "The organizations the caller is a member of, and each one's members. An organization keeps its own Bots and conversations, apart from every other's." }
  - { name: Teams, description: "An organization's teams: named groups of its members, and each team's people. What is granted to a team is its people's to use, and nobody else's in the organization. A team is made here or kept in step with a group of the company's directory." }
  - { name: Approvals, description: "What a person's Bots are waiting on them for: the actions that ask before they run, the questions a Bot asked, and what the person set for themselves about asking (their preferences, their own rules, and what they allowed for one conversation). Each person's are theirs alone." }
  - { name: Approval rules, description: "The organization's approval rules: which actions every member's Bots take without asking, ask a person about first, or hand to the person. An administrator can describe rules in English, test them against what Bots already did, and save several as one change." }
  - { name: Reviewer guidance, description: "What an administrator tells auto-review, in plain English: what to ask about and what is routine for the organization. Checked by an independent reading before it is saved, and never able to switch built-in safety off." }
  - { name: Boundaries, description: "The rules that decide what every Bot may do, on its computer and in the apps it calls. A deny rule refuses, an allow rule permits, and an action no rule permits is refused. Only an administrator reads or sets them." }
  - { name: What-if, description: "What OpenBot's controls would decide about one action a Bot might take, and what they say now about one already on the audit trail. Nothing is carried out. Only an administrator can ask." }
  - { name: Shared use, description: "A Bot's use of a shared app's one account: the audience an administrator approved it for, and the requests a Bot's owner files when the Bot reaches further than that." }
  - { name: Host access, description: "The folders on a person's own computer that they gave their Bots through OpenBot Desktop. Each person sees and ends only their own." }
  - { name: Computers, description: "The computer a Bot works on for a person: its state, its screen, who is driving it, the actions a Bot takes on it through the app, and for an administrator the organization's computers. The live screen and terminal stream over WebSockets, described in api/asyncapi.yaml." }
  - { name: Browsers, description: "The browsers people work in: the one on a Bot's computer, which a person drives and records in while they hold control of it, and the one OpenBot runs for each person, with the OpenBot Recorder in it already connected." }
  - { name: Sign-in requests, description: "A Bot asking the person it works for to sign it in to a website, and the person's answer on a private form. What they type goes to the Bot's browser and nowhere else; the Bot is told only whether the sign-in worked." }
  - { name: Saved logins, description: "The logins a person saved for their Bots to sign in with, by site. A password goes in and is never read back out." }
  - { name: Recorder, description: "The OpenBot Recorder, the browser extension a person records what they do with: the browsers connected as a person, their recordings, and the Recorder's own operations, which it signs with its connection token." }
  - { name: Product events, description: "What a person did with a Bot's answer, seen on screen or copied, counted so OpenBot knows which answers people use. Best effort: a client never waits on one." }
  - { name: Learning, description: "Automatic learning: the skills Learning proposed, the evidence behind them, approving and rejecting them, and its runs, in the organization's spaces and each person's own; which space each Bot learns into, who reviews what people's recordings propose, each person's sharing choices, requests to share a skill with every Bot, and the skills delivered to Bots." }
  - { name: Memory, description: "The facts a person's Bots remember about them, and the app actions those facts are read in from. Each person's are theirs alone: an administrator can't read them either." }
  - { name: Agents, description: "The agents an organization's Bots hand work to: OpenBot's own, a framework OpenBot runs, or an agent somebody runs at its own address. An administrator adds the organization's, and anybody may add a private one for their own Bots. A Bot's delegation says whether it works on one agent or hands work to several, and which." }
