              value:
                type: https://open.bot/errors/service-unavailable
                title: OpenBot isn't available right now.
                status: 503
                detail: OpenBot isn't available right now. Try again in a moment.
                code: SERVICE_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
            clientUpdateRequired:
              value:
                type: https://open.bot/errors/client-update-required
                title: This app is too old for this OpenBot.
                status: 400
                detail: This OpenBot needs OpenBot Desktop 1.2.0 or later. Update OpenBot, then try again.
                code: CLIENT_UPDATE_REQUIRED
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
                client: desktop
                minimumVersion: 1.2.0
            clientUpdateRequiredSecurity:
              value:
                type: https://open.bot/errors/client-update-required
                title: This app is too old for this OpenBot.
                status: 400
                detail: This version of OpenBot has a security problem. Update to keep using it.
                code: CLIENT_UPDATE_REQUIRED
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
                client: desktop
                minimumVersion: 1.2.0
                security: true
