# CopilotKit management: connecting this OpenBot to CopilotKit's management service.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/management:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [CopilotKit management]
      operationId: getManagementEnrollment
      summary: Read whether this OpenBot is connected to CopilotKit management
      description: >-
        Return where connecting this OpenBot to CopilotKit's management
        service stands: not connected; waiting for somebody at CopilotKit's
        page to approve the code; waiting for the management agent to be
        installed in the cluster with the Helm command given; or connected,
        with the agent's last heartbeat and version. Management is for the
        whole OpenBot, so it is answered only in the organization `default`,
        and only to its administrators. It applies only to the team edition
        that a company runs itself: on the personal edition, on OpenBot
        Cloud, and in any other organization it answers 404 with the code
        MANAGEMENT_UNAVAILABLE, which a client reads as nothing to show.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [settings:read]
        - apiKey: []
      responses:
        '200':
          description: Where connecting this OpenBot stands.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementEnrollment'
              examples:
                notConnected:
                  $ref: '#/components/examples/ManagementNotConnectedExample'
                waitingForApproval:
                  $ref: '#/components/examples/ManagementWaitingForApprovalExample'
                waitingForAgent:
                  $ref: '#/components/examples/ManagementWaitingForAgentExample'
                connected:
                  $ref: '#/components/examples/ManagementConnectedExample'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/ManagementUnavailable'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/management/enrollment:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [CopilotKit management]
      operationId: startManagementEnrollment
      summary: Start connecting this OpenBot to CopilotKit management
      description: >-
        Ask CopilotKit's management service to connect this OpenBot. OpenBot
        sends its CopilotKit licence and its name, and gets back a short code
        and the page where somebody signed in to CopilotKit, as an admin of
        the organization the licence names, approves it (the OAuth device
        authorization grant, RFC 8628). OpenBot then waits for the approval
        on its own; read getManagementEnrollment to follow it. Once approved,
        the answer carries the Helm command that installs the management
        agent, with nothing secret in it. Started again while it is already
        waiting, it changes nothing and answers where it stands. Already
        connected answers 409. Only an administrator of the organization
        `default` may start it, and only where getManagementEnrollment
        applies.
      security:
        - webSession: []
        - appOAuth: [settings:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Where connecting this OpenBot stands now.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementEnrollment'
              examples:
                waitingForApproval:
                  $ref: '#/components/examples/ManagementWaitingForApprovalExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/ManagementUnavailable'
        '409':
          $ref: '#/components/responses/ManagementConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ManagementServiceFailed'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    delete:
      tags: [CopilotKit management]
      operationId: cancelManagementEnrollment
      summary: Stop connecting this OpenBot to CopilotKit management
      description: >-
        Stop a connection that is waiting for approval or for the agent, and
        forget its code and its one-time token, so the agent can no longer
        collect it. Nothing is changed in the cluster. Not connected answers
        204 too. Connected answers 409: disconnecting is uninstalling the
        management agent with Helm. Only an administrator of the organization
        `default` may stop it, and only where getManagementEnrollment
        applies.
      security:
        - webSession: []
        - appOAuth: [settings:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: OpenBot is not connecting to CopilotKit management.
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/ManagementUnavailable'
        '409':
          $ref: '#/components/responses/ManagementConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  schemas:
    ManagementEnrollment:
      type: object
      description: >-
        Where connecting this OpenBot to managed updates stands. Which fields
        are present depends on state.
      required:
        - state
      properties:
        state:
          type: string
          x-extensible-enum:
            - not-connected
            - waiting-for-approval
            - waiting-for-agent
            - connected
          description: >-
            not-connected: nothing is under way. waiting-for-approval: the
            code is waiting for somebody to approve it at verificationUri.
            waiting-for-agent: approved, and waiting for the management agent
            to be installed with helmCommand and to report in. connected: the
            agent reports in. A later OpenBot may add a state; read one you
            don't know as not connected.
        userCode:
          type: string
          pattern: ^[A-Z0-9]{4}-[A-Z0-9]{4}$
          description: The code to approve, while waiting for approval.
        verificationUri:
          type: string
          format: uri
          description: The page where the code is approved, while waiting for approval.
        verificationUriComplete:
          type: string
          format: uri
          description: >-
            The same page with the code already filled in, while waiting for
            approval.
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working, while waiting for approval.
        installId:
          type: string
          minLength: 1
          description: >-
            The id the managed updates service gave this OpenBot, once the
            code is approved.
        helmCommand:
          type: string
          minLength: 1
          description: >-
            The command that installs the management agent in this OpenBot's
            cluster, while waiting for the agent. It holds nothing secret:
            the agent collects its one-time token from OpenBot itself.
        lastHeartbeatAt:
          type: string
          format: date-time
          description: When the agent last reported in, once connected.
        agentVersion:
          type: string
          minLength: 1
          description: The version of the agent that last reported in, once connected.
        lastError:
          type: string
          minLength: 1
          description: >-
            What went wrong with the last attempt, in a sentence a person
            reads, with what to do next: for example a code that expired
            before anybody approved it, an approval that was refused, or the
            management service out of reach. Absent when nothing did.
  responses:
    ManagementUnavailable:
      description: >-
        CopilotKit management doesn't apply here: the personal edition,
        OpenBot Cloud, or an organization other than `default`.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://open.bot/errors/management-unavailable
                title: Managed updates aren't available here.
                status: 404
                detail: Managed updates aren't available for this OpenBot.
                code: MANAGEMENT_UNAVAILABLE
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    ManagementConflict:
      description: >-
        This OpenBot is already connected, CopilotKit's management service
        refused to connect it, or the Idempotency-Key was used for a
        different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            connected:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: OpenBot already gets managed updates. To stop them, uninstall the management agent with Helm.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            refused:
              value:
                type: https://open.bot/errors/management-refused
                title: The managed updates service refused this OpenBot.
                status: 409
                detail: The licence in COPILOTKIT_LICENSE_TOKEN wasn't accepted. Check it, or contact OpenBot by CopilotKit.
                code: MANAGEMENT_REFUSED
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    ManagementServiceFailed:
      description: CopilotKit's management service couldn't be reached, or answered in a way OpenBot doesn't understand.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            unreachable:
              value:
                type: https://open.bot/errors/management-service-failed
                title: The managed updates service didn't answer.
                status: 502
                detail: Couldn't reach the managed updates service at enroll.bot.copilotkit.ai. Check that OpenBot can reach it, then try again.
                code: MANAGEMENT_SERVICE_FAILED
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
  examples:
    ManagementNotConnectedExample:
      value:
        state: not-connected
    ManagementWaitingForApprovalExample:
      value:
        state: waiting-for-approval
        userCode: WDJB-MJHT
        verificationUri: https://enroll.bot.copilotkit.ai/connect
        verificationUriComplete: https://enroll.bot.copilotkit.ai/connect?code=WDJB-MJHT
        expiresAt: '2026-11-20T10:15:00Z'
    ManagementWaitingForAgentExample:
      value:
        state: waiting-for-agent
        installId: 6f1d2c3b-8a4e-4b5f-9c7d-0e1f2a3b4c5d
        helmCommand: >-
          helm install openbot-agent
          oci://ghcr.io/copilotkit/charts/openbot-agent --namespace
          openbot-system --create-namespace --set
          enrollment.serverUrl=http://openbot-server-internal.openbot.svc:9464
    ManagementConnectedExample:
      value:
        state: connected
        installId: 6f1d2c3b-8a4e-4b5f-9c7d-0e1f2a3b4c5d
        lastHeartbeatAt: '2026-11-20T10:31:12Z'
        agentVersion: 0.4.0
