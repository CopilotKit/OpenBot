# CopilotKit management: connecting this OpenBot to CopilotKit's management service.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/management:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [CopilotKit management]
      operationId: getManagementEnrollment
      summary: Read whether this OpenBot is connected to CopilotKit management
      description: >-
        Return where connecting this OpenBot to CopilotKit's management
        service stands: not connected; connecting by itself, by its licence,
        with the management agent OpenBot's own chart installed; waiting for
        somebody at CopilotKit's page to approve the code; waiting for the
        management agent to be installed in the cluster with the Helm command
        given; connected, with the agent's last heartbeat and version; or
        opted out, after an administrator disconnected it. A team OpenBot
        whose chart installs the management agent connects by itself when
        it starts, and tries again every hour until it is connected, unless
        an administrator disconnected it or the chart turned management off
        (`management.enabled: false`). Management is for the
        whole OpenBot, so it is answered only in the organization `default`,
        and only to its administrators. It applies only to the team edition
        that a company runs itself: on the personal edition, on OpenBot
        Cloud, and in any other organization it answers 404 with the code
        MANAGEMENT_UNAVAILABLE, which a client reads as nothing to show.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [settings:read]
        - apiKey: []
      responses:
        '200':
          description: Where connecting this OpenBot stands.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementEnrollment'
              examples:
                notConnected:
                  $ref: '#/components/examples/ManagementNotConnectedExample'
                waitingForApproval:
                  $ref: '#/components/examples/ManagementWaitingForApprovalExample'
                waitingForAgent:
                  $ref: '#/components/examples/ManagementWaitingForAgentExample'
                connected:
                  $ref: '#/components/examples/ManagementConnectedExample'
                connecting:
                  $ref: '#/components/examples/ManagementConnectingExample'
                optedOut:
                  $ref: '#/components/examples/ManagementOptedOutExample'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/ManagementUnavailable'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/management/enrollment:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [CopilotKit management]
      operationId: startManagementEnrollment
      summary: Start connecting this OpenBot to CopilotKit management
      description: >-
        Ask CopilotKit's management service to connect this OpenBot. OpenBot
        sends its CopilotKit licence and its name. Where OpenBot's own chart
        installs the management agent (agentInstalledByChart true), it
        connects by licence: a team licence is accepted at once, with no code
        to approve, OpenBot collects the install's one-time token on its own,
        the agent picks it up, and the answer is connecting. This also ends
        an opt-out: after an administrator disconnected OpenBot, this is how
        managed updates are turned back on, and OpenBot connects by itself
        again from then on. Where the chart turned the agent off, it is the
        approval flow: OpenBot gets back a short code and the page where
        somebody signed in to CopilotKit, as an admin of the organization the
        licence names, approves it (the OAuth device authorization grant, RFC
        8628); OpenBot then waits for the approval on its own, and once
        approved the answer carries the Helm command that installs the agent,
        with nothing secret in it. Read getManagementEnrollment to follow
        either. A licence the service refuses answers 409 with the service's
        sentence, and the state keeps lastErrorCode. Started again while it
        is already under way, it changes nothing and answers where it stands.
        Already connected answers 409. Only an administrator of the organization
        `default` may start it, and only where getManagementEnrollment
        applies.
      security:
        - webSession: []
        - appOAuth: [settings:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Where connecting this OpenBot stands now.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementEnrollment'
              examples:
                waitingForApproval:
                  $ref: '#/components/examples/ManagementWaitingForApprovalExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/ManagementUnavailable'
        '409':
          $ref: '#/components/responses/ManagementConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ManagementServiceFailed'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    delete:
      tags: [CopilotKit management]
      operationId: cancelManagementEnrollment
      summary: Stop connecting this OpenBot to CopilotKit management
      description: >-
        Stop a connection that is under way, or disconnect a connected one,
        and record that an administrator opted out, so OpenBot doesn't
        connect itself again (opted-out) until somebody starts it again with
        startManagementEnrollment. Stopping forgets the code and the one-time
        token, so the agent can no longer collect it. CopilotKit's management service is told: a code nobody
        approved yet is withdrawn, so its approval page refuses it, and an
        install it already made is retired. Nothing is changed in the
        cluster. Not connected answers 204 too, and records the opt-out.
        Connected with the agent OpenBot's chart installed
        (agentInstalledByChart true), it retires the install at the service
        at once, which stops the agent's managed updates though it keeps
        running, and answers 204. The same goes for an agent the chart
        installed before management was turned off with Helm
        (agentRemovedWithChart true): that upgrade already removed it. Connected
        with an agent installed as its own Helm release, it finishes
        disconnecting after that agent is uninstalled with Helm:
        while the service still hears from the agent it answers 409, and once
        the agent hasn't reported in for more than five minutes it retires the
        install at the service, forgets the connection and answers 204, so
        OpenBot can be connected again later. Telling the service is best
        effort: out of reach, OpenBot stops anyway and lastError says the
        service wasn't told. Connected with the service out of reach, the last
        heartbeat OpenBot saw decides, and a recent one answers 502. Only an
        administrator of the organization `default` may stop it, and only
        where getManagementEnrollment applies.
      security:
        - webSession: []
        - appOAuth: [settings:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: OpenBot is not connecting to CopilotKit management.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/ManagementUnavailable'
        '409':
          $ref: '#/components/responses/ManagementConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ManagementServiceFailed'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  schemas:
    ManagementEnrollment:
      type: object
      description: >-
        Where connecting this OpenBot to managed updates stands. Which fields
        are present depends on state.
      required:
        - state
      properties:
        state:
          type: string
          x-extensible-enum:
            - not-connected
            - waiting-for-approval
            - waiting-for-agent
            - connected
            - connecting
            - opted-out
          description: >-
            not-connected: nothing is under way. waiting-for-approval: the
            code is waiting for somebody to approve it at verificationUri.
            waiting-for-agent: approved, and waiting for the management agent
            to be installed with helmCommand and to report in. connected: the
            agent reports in. connecting: OpenBot is connecting by itself, by
            its licence, and the management agent its chart installed is
            collecting its one-time token and reporting in for the first
            time; nobody needs to do anything. opted-out: an administrator
            disconnected OpenBot, so it doesn't connect by itself; starting a
            connection turns managed updates back on. A later OpenBot may add
            a state; read one you don't know as not connected.
        userCode:
          type: string
          pattern: ^[A-Z0-9]{4}-[A-Z0-9]{4}$
          description: The code to approve, while waiting for approval.
        verificationUri:
          type: string
          format: uri
          description: The page where the code is approved, while waiting for approval.
        verificationUriComplete:
          type: string
          format: uri
          description: >-
            The same page with the code already filled in, while waiting for
            approval.
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working, while waiting for approval.
        installId:
          type: string
          minLength: 1
          description: >-
            The id the managed updates service gave this OpenBot, once the
            code is approved.
        helmCommand:
          type: string
          minLength: 1
          description: >-
            The command that installs the management agent in this OpenBot's
            cluster, while waiting for the agent. It holds nothing secret:
            the agent collects its one-time token from OpenBot itself. On a
            release it pins the agent chart to this OpenBot's own version
            with --version, so the agent always matches the server that
            printed it.
        helmCommandNote:
          type: string
          minLength: 1
          description: >-
            A sentence a person reads beside helmCommand, present only when
            this OpenBot isn't a published release (a build of main or a
            development build). No published agent chart matches such a
            build, so helmCommand names no chart version and Helm installs
            the newest published one. Absent on a release.
        agentInstalledByChart:
          type: boolean
          description: >-
            True when OpenBot's own chart installs the management agent
            beside it (`management.enabled`, on by default), so connecting
            needs no Helm command and OpenBot connects by itself. False when
            the chart turned it off: connecting then gives helmCommand to
            install the agent by hand. Present in every state.
        agentRemovedWithChart:
          type: boolean
          description: >-
            True when OpenBot is connected through the agent its own chart
            installed, and the chart has since turned management off
            (`management.enabled=false`, so agentInstalledByChart is false).
            That Helm upgrade removed the agent along with OpenBot's own
            release, so there is no Helm release to uninstall: Disconnect
            retires the install at the service at once. Absent when the
            connected agent is a release of its own (installed with
            helmCommand, or the openbot-agent release that runs upgrades),
            which is uninstalled with Helm before Disconnect, and in every
            other state.
        installName:
          type: string
          minLength: 1
          description: >-
            The name this OpenBot gave itself when it asked to be connected,
            which the approval page shows the approver, so they can match it.
            Present while waiting for approval.
        window:
          $ref: '#/components/schemas/ManagementWindow'
        lastHeartbeatAt:
          type: string
          format: date-time
          description: When the agent last reported in, once connected.
        agentVersion:
          type: string
          minLength: 1
          description: The version of the agent that last reported in, once connected.
        upgrades:
          type: string
          x-extensible-enum:
            - 'on'
            - not-set-up
          description: >-
            Whether the managed updates service can upgrade this OpenBot, as
            the agent last reported, once connected. on: upgrades are set up,
            and happen in the maintenance window. not-set-up: the agent is
            connected and reports health, but upgrading needs a one-time setup
            in the cluster first. Absent when the agent hasn't said (an older
            agent). A later OpenBot may add a value; read one you don't know as
            absent.
        lastError:
          type: string
          minLength: 1
          description: >-
            What went wrong with the last attempt, in a sentence a person
            reads, with what to do next: for example a code that expired
            before anybody approved it, an approval that was refused, the
            management service out of reach, a connected agent that has
            stopped reporting in, or a Stop the service couldn't be told
            about. Absent when nothing did.
        lastErrorCode:
          type: string
          x-extensible-enum:
            - not-entitled
            - invalid-licence
            - unreachable
          description: >-
            Which refusal lastError is, where a client acts on it.
            not-entitled: this OpenBot's licence doesn't include managed
            updates (it isn't a team licence, or managed updates were turned
            off for its organization), so connecting again fails the same way
            until they are added to it. invalid-licence: the licence wasn't
            accepted (invalid or expired). unreachable: the managed updates
            service couldn't be reached when OpenBot last tried to connect by
            itself; it tries again within the hour. A later OpenBot may add a
            code; read one you don't know as no code.
    ManagementWindow:
      type: object
      description: >-
        The weekly maintenance window the managed updates service upgrades
        this OpenBot in, as the service last reported it, once connected.
        It is agreed for each install; the default is Tuesdays from 14:00
        UTC for four hours.
      required:
        - weekday
        - startUtc
        - hours
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: The day it starts, 0 for Sunday to 6 for Saturday.
        startUtc:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: When it starts, as HH:MM in UTC.
        hours:
          type: number
          minimum: 4
          maximum: 168
          description: How many hours it lasts.
  responses:
    ManagementUnavailable:
      description: >-
        CopilotKit management doesn't apply here: the personal edition,
        OpenBot Cloud, or an organization other than `default`.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://open.bot/errors/management-unavailable
                title: Managed updates aren't available here.
                status: 404
                detail: Managed updates aren't available for this OpenBot.
                code: MANAGEMENT_UNAVAILABLE
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    ManagementConflict:
      description: >-
        This OpenBot is already connected, CopilotKit's management service
        refused to connect it, or the Idempotency-Key was used for a
        different request.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            connected:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: OpenBot already gets managed updates. To stop them, uninstall the management agent with Helm.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            refused:
              value:
                type: https://open.bot/errors/management-refused
                title: The managed updates service refused this OpenBot.
                status: 409
                detail: The licence in COPILOTKIT_LICENSE_TOKEN wasn't accepted. Check it, or contact OpenBot by CopilotKit.
                code: MANAGEMENT_REFUSED
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    ManagementServiceFailed:
      description: CopilotKit's management service couldn't be reached, or answered in a way OpenBot doesn't understand.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            unreachable:
              value:
                type: https://open.bot/errors/management-service-failed
                title: The managed updates service didn't answer.
                status: 502
                detail: Couldn't reach the managed updates service at enroll.bot.copilotkit.ai. Check that OpenBot can reach it, then try again.
                code: MANAGEMENT_SERVICE_FAILED
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
  examples:
    ManagementNotConnectedExample:
      value:
        state: not-connected
    ManagementWaitingForApprovalExample:
      value:
        state: waiting-for-approval
        userCode: WDJB-MJHT
        verificationUri: https://enroll.bot.copilotkit.ai/connect
        verificationUriComplete: https://enroll.bot.copilotkit.ai/connect?code=WDJB-MJHT
        expiresAt: '2026-11-20T10:15:00Z'
    ManagementWaitingForAgentExample:
      value:
        state: waiting-for-agent
        installId: 6f1d2c3b-8a4e-4b5f-9c7d-0e1f2a3b4c5d
        helmCommand: >-
          helm install openbot-agent
          oci://ghcr.io/copilotkit/charts/openbot-agent --version 1.2.0
          --namespace openbot-system --create-namespace --set
          enrollment.serverUrl=http://openbot-server-internal.openbot.svc:9464
    ManagementConnectingExample:
      value:
        state: connecting
        installId: 6f1d2c3b-8a4e-4b5f-9c7d-0e1f2a3b4c5d
        agentInstalledByChart: true
    ManagementOptedOutExample:
      value:
        state: opted-out
        agentInstalledByChart: true
    ManagementConnectedExample:
      value:
        state: connected
        installId: 6f1d2c3b-8a4e-4b5f-9c7d-0e1f2a3b4c5d
        lastHeartbeatAt: '2026-11-20T10:31:12Z'
        agentVersion: 0.4.0
        upgrades: not-set-up
        agentInstalledByChart: true
