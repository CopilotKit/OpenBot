# Learning: OpenBot's side of Automatic learning.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
#
# CopilotKit Intelligence learns skills from conversations and recordings, in Learning spaces
# (containers) inside the organization's Intelligence project. What it proposes, the evidence behind
# each proposal, approving and rejecting one, and its runs live in Intelligence: OpenBot reads and
# changes them for a person, after checking which spaces that person may reach, and answers in the
# shapes below. Beside them is what OpenBot keeps: which space each Bot learns into, who reviews
# what people's recordings propose, each person's own spaces and sharing choices, requests to share
# a skill with every Bot, and the published skills OpenBot delivers to Bots.
#
# The organization's spaces (the one every Bot learns into, and each Bot's own) are an
# administrator's, under settings/learning, picked with botId. A person's own spaces are under
# people/{personId}, picked with containerId; an administrator may read and review them too.
paths:
  /api/v2/organizations/{organizationId}/settings/learning:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Learning]
      operationId: getLearningSettings
      summary: Read the organization's Learning settings
      description: >-
        Return whether Automatic learning is on, the Learning space every
        Bot learns into and each Bot's own, who reviews what people's
        recordings propose, and what OpenBot last found when it looked for
        the space it assigns by itself. Only an administrator may read them.
        A single-person OpenBot has no such settings: it answers not found.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      responses:
        '200':
          description: The Learning settings.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningConfiguration'
              examples:
                assigned:
                  $ref: '#/components/examples/LearningConfigurationExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    patch:
      tags: [Learning]
      operationId: updateLearningSettings
      summary: Change the organization's Learning settings
      description: >-
        Change the settings sent and keep the rest. bots replaces every
        Bot's own space at once. At least one is required. Only an
        administrator may change them. Recorded on the audit trail.
      security:
        - webSession: []
        - appOAuth: [learning:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearningSettingsRequest'
            examples:
              people:
                value:
                  personalReview: people
              on:
                value:
                  enabled: true
                  defaultTarget:
                    containerId: openbot
      responses:
        '200':
          description: The Learning settings, as saved.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningConfiguration'
              examples:
                assigned:
                  $ref: '#/components/examples/LearningConfigurationExample'
        '400':
          $ref: '#/components/responses/InvalidLearningSettings'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/settings/learning/create-container:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Learning]
      operationId: createAutomaticLearningSpace
      summary: Create the Learning space OpenBot assigns by itself
      description: >-
        Create, in the organization's backend, the Learning
        space OpenBot assigns when nobody chose one, with the credential this
        deployment holds for it, then assign it. Offered only where the
        settings say canCreate. Only an administrator may. Recorded on the
        audit trail.
      security:
        - webSession: []
        - appOAuth: [learning:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: What OpenBot found once it tried.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningAutomaticResult'
              examples:
                assigned:
                  value:
                    automatic:
                      state: assigned
                      containerId: openbot
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/AutomaticLearningOff'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/settings/learning/overview:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Learning]
      operationId: getLearningOverview
      summary: Read how Learning is going for a space
      description: >-
        Return how Learning stands in the space every Bot learns into, or in
        one Bot's own: whether it is set up, how much waits for review, how
        many skills and insights it published, whether a run is going, links
        into the backend dashboard where there is one, and why Learning
        can't run on this machine's model where that is known. A
        backend with no dashboard can't count waiting conversations,
        published skills or insights: those are null then, and so is every
        link. Only an administrator may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/LearningBotFilter'
      responses:
        '200':
          description: How Learning stands.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningOverview'
              examples:
                configured:
                  $ref: '#/components/examples/LearningOverviewExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LearningAdminOnly'
        '404':
          $ref: '#/components/responses/LearningSpaceNotFound'
        '409':
          $ref: '#/components/responses/LearningOff'
        '429':
          $ref: '#/components/responses/LearningBusy'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/LearningUnreachable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/personal-learning-proposals:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Learning]
      operationId: listPersonalLearningProposals
      summary: List what people's recordings proposed
      description: >-
        Return one page of the people whose recordings Learning reads, each
        with their own Learning space and the proposals in it that wait for
        review. A person whose space could not be read has proposals null;
        one who never recorded has none. Only an
        administrator may list them. A missing cursor starts at the first page
        and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of people.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPersonPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/LearningPersonPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/LearningUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/settings/learning/skills:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Learning]
      operationId: listPublishedSkills
      summary: List the skills published to a space
      description: >-
        Return one page of the skills Learning published to the space every
        Bot learns into, or to one Bot's own, by name, as OpenBot delivers
        them to Bots. containerId is null, and the list empty, where no space
        is assigned. Only an administrator may list them. A missing cursor
        starts at the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/LearningBotFilter'
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of published skills.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedSkillPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/PublishedSkillPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/LearningUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/settings/learning/skills/{skillName}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SkillName'
    get:
      tags: [Learning]
      operationId: getPublishedSkill
      summary: Read a skill published to a space
      description: >-
        Return one skill Learning published to the space every Bot learns
        into, or to one Bot's own, with its files. Only an administrator may
        read it.
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/LearningBotFilter'
      responses:
        '200':
          description: The skill and its files.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnedSkill'
              examples:
                skill:
                  $ref: '#/components/examples/LearnedSkillExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/LearnedSkillNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/LearningUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/learning-status:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    get:
      tags: [Learning]
      operationId: getBotLearningStatus
      summary: Read how a Bot's learned skills reach it
      description: >-
        Return whether a Bot learns into a space, which revision of that
        space's skills it last received, whether that is out of date, and why
        the last check failed. Only an administrator may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      responses:
        '200':
          description: How the Bot's learned skills reach it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDelivery'
              examples:
                current:
                  value:
                    configured: true
                    containerId: openbot
                    revision: '17'
                    initialized: true
                    stale: false
                    lastCheckedAt: '2026-11-14T09:00:00.000Z'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/LearningUnreachable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/skill-sharing-requests:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Learning]
      operationId: listSkillSharingRequests
      summary: List requests to share a skill with every Bot
      description: >-
        Return one page of the requests people made to open a skill they
        approved for themselves to every Bot, oldest first. Only an
        administrator may list them. A missing cursor starts at the first page
        and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of sharing requests.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillSharingRequestPage'
              examples:
                lastPage:
                  value:
                    requests:
                      - id: dXNlcl8zZjFjOWEAV2Vla2x5IHJlcG9ydA
                        personId: user_3f1c9a
                        name: Ada Lovelace
                        skillName: Weekly report
                        requestedAt: '2026-11-14T08:30:00.000Z'
                    nextCursor: null
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/learning-settings:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Learning]
      operationId: getPersonLearningSettings
      summary: Read a person's Learning choices and skills
      description: >-
        Return who else's Bots use the skills learned in a person's own
        Learning space, whether an administrator lets people open skills to
        every Bot, and the skills published in the person's spaces with what
        they chose for each. skills is null, and unavailable says why, when
        they could not be read. Only the person themselves may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      responses:
        '200':
          description: The person's Learning choices and skills.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonLearning'
              examples:
                closed:
                  $ref: '#/components/examples/PersonLearningExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LearningOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    patch:
      tags: [Learning]
      operationId: updatePersonLearningSettings
      summary: Change a person's Learning choices
      description: >-
        Change who else's Bots use the skills learned in the person's own
        space, and, in a single-person OpenBot, whether proposals are
        approved without a review. Opening skills to every Bot waits for an
        administrator to allow it; closing them never does. At least one is
        required. Only the person themselves may change them. Recorded on the
        audit trail.
      security:
        - webSession: []
        - appOAuth: [learning:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonLearningRequest'
            examples:
              open:
                value:
                  mode: open
      responses:
        '200':
          description: The person's Learning choices, as saved.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonLearningChoices'
              examples:
                open:
                  value:
                    mode: open
                    autoApprove: null
        '400':
          $ref: '#/components/responses/InvalidLearningChoice'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SharingNotAllowed'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/learning-review:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Learning]
      operationId: getPersonLearningReview
      summary: Read what a person's Learning spaces proposed
      description: >-
        Return each Learning space the person reviews (always their own,
        which their recordings join, and in a single-person OpenBot the
        spaces its Bots learn into), with the proposals in it that wait for
        review and its latest run, and whether the person may decide on them
        themselves. In a single-person OpenBot with automatic approval on,
        reading it first approves what waits. Only the person themselves may
        read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      responses:
        '200':
          description: The person's Learning spaces and what waits in them.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonLearningReview'
              examples:
                waiting:
                  $ref: '#/components/examples/PersonLearningReviewExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LearningOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/LearningUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/learning-proposals:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Learning]
      operationId: listPersonLearningProposals
      summary: List the skills Learning proposed from one recording
      description: >-
        Return one page of the proposals in the person's own spaces made since
        a recording of theirs stopped whose evidence cites a recording of
        theirs by that title, newest first and a few at most, each with the
        Learning space it is in. Rejected proposals and removals are left
        out, and a recording that isn't
        theirs never matches. Only the person themselves may list them. A
        missing cursor starts at the first page and nextCursor null ends the
        list.
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      parameters:
        - name: recordingTitle
          in: query
          required: true
          description: The recording's title.
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: \S
        - name: since
          in: query
          required: true
          description: When the recording stopped, in milliseconds since 1970.
          schema:
            type: integer
            minimum: 0
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of proposed skills.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSkillPage'
              examples:
                none:
                  value:
                    skills: []
                    nextCursor: null
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LearningOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/LearningUnreachable'
        '503':
          $ref: '#/components/responses/LearningUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/recording-titles:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Learning]
      operationId: getRecordingTitles
      summary: Read the titles of a person's recordings
      description: >-
        Return the title of each recording named, by the id the backend
        gives it, so a proposal's evidence can name the recordings it was
        learned from. A recording that isn't the person's is left out. The
        person themselves or an administrator may read them.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      parameters:
        - name: ids
          in: query
          required: true
          description: The recordings, by the backend's id, at most 50.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: The titles of the person's recordings among those named.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingTitles'
              examples:
                titled:
                  value:
                    recordings:
                      - id: 4b6f0a3e-2c1d-4e5f-8a9b-0c1d2e3f4a5b
                        title: File an expense report
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
