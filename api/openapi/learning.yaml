      responses:
        '200':
          description: The proposal, approved.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningReview'
              examples:
                approved:
                  $ref: '#/components/examples/LearningReviewApprovedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LearningReviewNotYours'
        '404':
          $ref: '#/components/responses/LearningProposalNotFound'
        '409':
          $ref: '#/components/responses/LearningProposalReviewed'
        '422':
          $ref: '#/components/responses/LearningProposalUnnamed'
        '429':
          $ref: '#/components/responses/LearningBusy'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/LearningUnreachable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/learning-proposals/{proposalId}/reject:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Learning]
      operationId: rejectPersonLearningProposal
      summary: Reject a proposal in a person's space
      description: >-
        Reject a proposal in one of a person's own Learning spaces: nothing
        is published. Who may is as for approving. Recorded on the audit
        trail.
      security:
        - webSession: []
        - appOAuth: [learning:write]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/PersonLearningSpace'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The proposal, rejected.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningReview'
              examples:
                rejected:
                  $ref: '#/components/examples/LearningReviewRejectedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LearningReviewNotYours'
        '404':
          $ref: '#/components/responses/LearningProposalNotFound'
        '409':
          $ref: '#/components/responses/LearningProposalReviewed'
        '429':
          $ref: '#/components/responses/LearningBusy'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/LearningUnreachable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/learning-insights/{insightId}/evidence:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/InsightId'
    get:
      tags: [Learning]
      operationId: getPersonLearningEvidence
      summary: Read what an insight in a person's space was learned from
      description: >-
        Return the evidence behind one insight in one of a person's own
        Learning spaces: the messages it cites from conversations and the
        events it cites from recordings. The person themselves or an
        administrator may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [learning:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/PersonLearningSpace'
      responses:
        '200':
          description: The insight's evidence.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningEvidenceList'
              examples:
                recording:
                  $ref: '#/components/examples/LearningEvidenceExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/PersonForbidden'
        '404':
          $ref: '#/components/responses/LearningInsightNotFound'
        '409':
          $ref: '#/components/responses/LearningOff'
        '429':
          $ref: '#/components/responses/LearningBusy'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/LearningUnreachable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/learning-runs:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    post:
      tags: [Learning]
      operationId: startPersonLearningRun
      summary: Learn now in a person's space
      description: >-
        Start Learning over one of the person's own spaces. Only the person
        themselves may, and only where they review their own (an
        administrator's choice, and always in a single-person OpenBot). A run
        already going is answered instead of starting another. Recorded on
        the audit trail.
      security:
        - webSession: []
        - appOAuth: [learning:write]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/PersonLearningSpace'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The run, queued or already going.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRun'
              examples:
                queued:
                  $ref: '#/components/examples/LearningRunQueuedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LearningReviewNotYours'
        '404':
          $ref: '#/components/responses/LearningSpaceNotFound'
        '409':
          $ref: '#/components/responses/LearningCannotRun'
        '429':
          $ref: '#/components/responses/LearningBusy'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/LearningUnreachable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  parameters:
    ProposalId:
      name: proposalId
      in: path
      required: true
      description: The proposal's id.
      schema:
        type: string
        format: uuid
      example: 936d0a2e-e252-48be-8803-e2f8ec15343c
    InsightId:
      name: insightId
      in: path
      required: true
      description: The insight's id, as a proposal lists it.
      schema:
        type: string
        format: uuid
      example: 7a2b9c4d-1e3f-4a5b-8c6d-0e1f2a3b4c5d
    PersonLearningSpace:
      name: containerId
      in: query
      description: >-
        Which of the person's own Learning spaces, as their review lists
        them. Without it, the one their recordings join. A space that isn't
        one of theirs is not found.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    SkillName:
      name: skillName
      in: path
      required: true
      description: >-
        A learned skill's name as OpenBot publishes it: 1 to 200
        characters, no slash, backslash or control character, not . or ..,
        and no space at either end.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[^/\\\x00-\x1F\x7F]+$
      example: Weekly report
    SkillSharingRequestId:
      name: skillSharingRequestId
      in: path
      required: true
      description: The request's id, as listSkillSharingRequests gives it.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: ^[A-Za-z0-9_-]+$
      example: dXNlcl8zZjFjOWEAV2Vla2x5IHJlcG9ydA
    LearningBotFilter:
      name: botId
      in: query
      description: >-
        One Bot's own Learning space. Without it, the space every Bot learns
        into.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    LearningTarget:
      type: object
      description: A Learning space, by its id in the organization's backend.
      additionalProperties: false
      required: [containerId]
      properties:
        containerId:
          $ref: '#/components/schemas/LearningSpaceId'
        revision:
          type: string
          minLength: 1
          maxLength: 128
          description: A published revision to hold the space's skills at. Absent follows the latest.
    LearningSpaceId:
      type: string
      description: A Learning space's id in the backend (its container).
      minLength: 1
      maxLength: 64
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    LearningSettings:
      type: object
      required: [enabled, defaultTarget, bots, personalReview]
      properties:
        enabled:
          type: boolean
          description: Whether Bots' conversations are learned from and their skills delivered.
        defaultTarget:
          description: The space every Bot learns into. Null when none is assigned.
          oneOf:
            - $ref: '#/components/schemas/LearningTarget'
            - type: 'null'
        bots:
          type: object
          description: >-
            Each Bot's own space, by Bot id. A Bot not named learns into the
            default; null keeps one out of Learning.
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/LearningTarget'
              - type: 'null'
        personalReview:
          type: string
          enum: [admins, people]
          description: Who reviews what people's own recordings propose.
    UpdateLearningSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        defaultTarget:
          oneOf:
            - $ref: '#/components/schemas/LearningTarget'
            - type: 'null'
        bots:
          type: object
          description: Replaces every Bot's own space.
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/LearningTarget'
              - type: 'null'
        personalReview:
          type: string
          enum: [admins, people]
    LearningAutomatic:
      type: object
      description: >-
        What OpenBot last found when it looked for the space it assigns by
        itself. off: switched off, or the environment names a space. saved:
        an administrator's settings decide. assigned: OpenBot assigned it.
        absent: the project has no such space yet. not_entitled: the plan
        doesn't include Learning. learning_off: the backend has Learning
        switched off. unavailable: the backend couldn't be asked. pending:
        not asked yet.
      required: [state]
      properties:
        state:
          type: string
          enum: [off, saved, assigned, absent, not_entitled, learning_off, unavailable, pending]
        containerId:
          $ref: '#/components/schemas/LearningSpaceId'
        instructions:
          type: string
          description: Where the space is absent, what an operator runs to create it.
        canCreate:
          type: boolean
          description: Where the space is absent, whether this deployment can create it (createAutomaticLearningSpace).
        createError:
          type: string
          description: Why the last attempt to create it failed.
    LearningConfiguration:
      type: object
      required: [settings, automatic]
      properties:
        settings:
          $ref: '#/components/schemas/LearningSettings'
        automatic:
          description: Null where OpenBot never assigns a space by itself.
          oneOf:
            - $ref: '#/components/schemas/LearningAutomatic'
            - type: 'null'
    LearningAutomaticResult:
      type: object
      required: [automatic]
      properties:
        automatic:
          $ref: '#/components/schemas/LearningAutomatic'
    LearningOverview:
      type: object
      required:
        - configuration
        - pendingThreadCount
        - pendingCandidateCount
        - publishedSkillCount
        - insightCount
        - hasActiveRun
        - latestRunStatus
        - links
      properties:
        configuration:
          type: string
          enum: [not_configured, invalid, configured, selection_required]
        container:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        pendingThreadCount:
          type: [integer, 'null']
          minimum: 0
        pendingCandidateCount:
          type: integer
          minimum: 0
        publishedSkillCount:
          type: [integer, 'null']
          minimum: 0
        insightCount:
          type: [integer, 'null']
          minimum: 0
        hasActiveRun:
          type: boolean
        latestRunStatus:
          type: [string, 'null']
        links:
          type: object
          required: [learning, candidates, runs]
          properties:
            learning:
              type: [string, 'null']
              format: uri
            candidates:
              type: [string, 'null']
              format: uri
            runs:
              type: [string, 'null']
              format: uri
        modelProblem:
          type: string
          description: Why Learning can't run on this machine's model, and what to do. Absent when it can.
    LearningPerson:
      type: object
      required: [personId, name, containerId, proposals]
      properties:
        personId:
          type: string
        name:
          type: string
        containerId:
          $ref: '#/components/schemas/LearningSpaceId'
        proposals:
          type: [array, 'null']
          description: >-
            What waits for review in their space. Null when their space could
            not be read.
          items:
            $ref: '#/components/schemas/LearningProposal'
    LearningPersonPage:
      type: object
      required: [people, nextCursor]
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/LearningPerson'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    PublishedSkillSummary:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
    PublishedSkillPage:
      type: object
      required: [containerId, skills, nextCursor]
      properties:
        containerId:
          oneOf:
            - $ref: '#/components/schemas/LearningSpaceId'
            - type: 'null'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/PublishedSkillSummary'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    LearnedSkill:
      type: object
      required: [name, description, files]
      properties:
        name:
          type: string
        description:
          type: string
        files:
          type: array
          description: Every file the skill holds, SKILL.md first.
          items:
            type: object
            required: [path, text]
            properties:
              path:
                type: string
              text:
                type: [string, 'null']
                description: The file's text, or null for a binary file.
        recordings:
          type: array
          description: >-
            The person's own recordings it was learned from. Absent where
            those could not be read or don't apply.
          items:
            type: object
            required: [id, title, available]
            properties:
              id:
                type: string
                description: The backend's id for the recording.
              title:
                type: [string, 'null']
              available:
                type: boolean
                description: False when the backend no longer has the recording.
    SkillDelivery:
      type: object
      required: [configured, initialized, stale]
      properties:
        configured:
          type: boolean
        containerId:
          type: string
        revision:
          type: string
        initialized:
          type: boolean
        stale:
          type: boolean
        lastCheckedAt:
          type: string
          format: date-time
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
    SkillSharingRequest:
      type: object
      required: [id, personId, name, skillName, requestedAt]
      properties:
        id:
          type: string
          description: The request's id, which approve and decline address it by.
        personId:
          type: string
        name:
          type: string
          description: The person's name.
        skillName:
          type: string
        requestedAt:
          type: string
          description: When the request was made, as approve and decline take it back.
    SkillSharingRequestPage:
      type: object
      required: [requests, nextCursor]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/SkillSharingRequest'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    SkillSharingDecision:
      type: object
      additionalProperties: false
      required: [requestedAt]
      properties:
        requestedAt:
          type: string
          minLength: 1
          maxLength: 64
          description: The request's requestedAt, as the administrator read it.
    SkillSharingOutcome:
      type: object
      required: [skillName, sharing]
      properties:
        skillName:
          type: string
        sharing:
          type: string
          enum: [requested, approved, declined]
    LearningSharingMode:
      type: string
      enum: [closed, open, choose]
      description: >-
        Who else's Bots use the skills learned in a person's own space.
        closed: only their own Bots. open: every Bot. choose: every Bot, for
        the skills they open one by one.
    PersonalLearnedSkill:
      type: object
      required: [name, description, open, approvedBy, sharing]
      properties:
        name:
          type: string
        description:
          type: string
        open:
          type: boolean
          description: Whether the person opened it to every Bot, where they choose.
        approvedBy:
          type: [string, 'null']
          enum: [person, admin, null]
          description: Who approved it into their space. Null when no approval is on record.
        sharing:
          type: string
          enum: [none, requested, approved, declined]
          description: Where the person's request to share it with every Bot stands.
    PersonLearning:
      type: object
      required: [mode, sharingAllowed, autoApprove, skills]
      properties:
        mode:
          $ref: '#/components/schemas/LearningSharingMode'
        sharingAllowed:
          type: boolean
          description: >-
            Whether an administrator lets people open skills to every Bot.
            While it is false only closed takes effect.
        autoApprove:
          type: [boolean, 'null']
          description: In a single-person OpenBot, whether proposals are approved without a review. Null elsewhere.
        skills:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/PersonalLearnedSkill'
        unavailable:
          type: string
          enum: [off, unavailable]
          description: >-
            Why skills is null. off: Automatic learning is off. unavailable:
            the backend did not deliver them.
    UpdatePersonLearningRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        mode:
          $ref: '#/components/schemas/LearningSharingMode'
        autoApprove:
          type: boolean
          description: Only in a single-person OpenBot.
    PersonLearningChoices:
      type: object
      required: [mode, autoApprove]
      properties:
        mode:
          $ref: '#/components/schemas/LearningSharingMode'
        autoApprove:
          type: [boolean, 'null']
    LearningProposal:
      type: object
      description: A skill change Learning proposed in a space, waiting for review or reviewed.
      required:
        - id
        - runId
        - operation
        - status
        - title
        - description
        - reason
        - createdAt
        - reviewedAt
        - publishedSkillId
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
          description: The run that proposed it.
        operation:
          type: string
          enum: [add, update, remove]
          description: Whether it adds a skill, changes one, or removes one.
        status:
          type: string
          enum: [pending_review, approved, rejected]
        title:
          type: string
          description: The skill's name.
        description:
          type: string
        reason:
          type: string
          description: Why Learning proposes it.
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
        publishedSkillId:
          type: [string, 'null']
          description: The skill an approval published. Null until approved.
    LearningProposalPage:
      type: object
      required: [proposals, nextCursor]
      properties:
        proposals:
          type: array
          description: Newest first, reviewed ones included.
          items:
            $ref: '#/components/schemas/LearningProposal'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    LearningProposalDetail:
      description: >-
        One proposal with every file it would publish and the insights behind
        it. Read each insight's evidence on its own.
      allOf:
        - $ref: '#/components/schemas/LearningProposal'
        - type: object
          required: [files, insights]
          properties:
            files:
              type: array
              description: Every file the skill would hold.
              items:
                type: object
                required: [path, content]
                properties:
                  path:
                    type: string
                  content:
                    type: string
            insights:
              type: array
              description: What Learning noticed that led to it.
              items:
                type: object
                required: [id, statement, impact]
                properties:
                  id:
                    type: string
                    format: uuid
                  statement:
                    type: string
                  impact:
                    type: string
    LearningEvidence:
      description: >-
        One piece of what an insight was learned from: messages cited from a
        conversation, or events from a recording.
      oneOf:
        - type: object
          required: [kind, threadId, threadName, threadPresent, unavailable, messageCount, cited]
          properties:
            kind:
              type: string
              const: conversation
            threadId:
              type: string
              description: The backend's id for the conversation.
            threadName:
              type: [string, 'null']
            threadPresent:
              type: boolean
              description: False when the conversation is gone.
            unavailable:
              type: [string, 'null']
              enum: [snapshot-missing, snapshot-unreadable, null]
              description: Why what was cited can't be read, if it can't.
            messageCount:
              type: integer
              minimum: 0
            cited:
              type: array
              items:
                type: object
                required: [id, role, content]
                properties:
                  id:
                    type: string
                  role:
                    type: string
                    enum: [user, assistant, tool]
                  content:
                    type: string
        - type: object
          required: [kind, trajectoryId, trajectoryPresent, unavailable, eventCount, events]
          properties:
            kind:
              type: string
              const: recording
            trajectoryId:
              type: string
              description: The backend's id for the recording.
            trajectoryPresent:
              type: boolean
              description: False when the recording is gone.
            unavailable:
              type: [string, 'null']
              enum: [snapshot-missing, snapshot-unreadable, null]
            eventCount:
              type: integer
              minimum: 0
            events:
              type: array
              description: The cited events, in order.
              items:
                type: object
                required: [seq, name, offsetMs]
                properties:
                  seq:
                    type: integer
                    minimum: 0
                  name:
                    type: string
                  offsetMs:
                    type: number
    LearningEvidenceList:
      type: object
      required: [evidence]
      properties:
        evidence:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LearningEvidence'
    LearningReview:
      type: object
      description: A proposal as a review left it.
      required: [proposalId, operation, status, publishedSkillId]
      properties:
        proposalId:
          type: string
          format: uuid
        operation:
          type: string
          enum: [add, update, remove]
        status:
          type: string
          enum: [approved, rejected]
        publishedSkillId:
          type: [string, 'null']
    LearningRun:
      type: object
      description: One run of Learning over a space.
      required:
        - id
        - status
        - triggerSource
        - proposalCount
        - insightCount
        - failureCode
        - failure
        - createdAt
        - startedAt
        - completedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, freezing, batching, reducing, finalizing, succeeded, failed]
        triggerSource:
          type: string
          enum: [automatic, manual]
        proposalCount:
          type: [integer, 'null']
          minimum: 0
          description: How many proposals it made. Null until it finishes.
        insightCount:
          type: [integer, 'null']
          minimum: 0
        failureCode:
          type: [string, 'null']
        failure:
          type: [string, 'null']
          description: Why a failed run stopped, in a sentence for the person, with what to do. Null unless it failed.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    LearningRunPage:
      type: object
      required: [runs, nextCursor]
      properties:
        runs:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/LearningRun'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    LearningSpace:
      type: object
      required: [containerId, kind, label, proposals, latestRun]
      properties:
        containerId:
          $ref: '#/components/schemas/LearningSpaceId'
        kind:
          type: string
          enum: [recordings, conversations]
        label:
          type: string
        proposals:
          type: [array, 'null']
          description: What waits for review in it. Null when it could not be read.
          items:
            $ref: '#/components/schemas/LearningProposal'
        latestRun:
          oneOf:
            - $ref: '#/components/schemas/LearningRun'
            - type: 'null'
        unavailable:
          type: string
          enum: [learning-off]
          description: Learning is switched off in the backend, so there is nothing to read.
    PersonLearningReview:
      type: object
      required: [canReview, autoApprove, approved, spaces]
      properties:
        canReview:
          type: boolean
          description: Whether the person decides on proposals themselves.
        autoApprove:
          type: [boolean, 'null']
          description: In a single-person OpenBot, whether proposals are approved without a review. Null elsewhere.
        approved:
          type: integer
          minimum: 0
          description: How many proposals reading this approved automatically.
        modelProblem:
          type: string
          description: Why Learning can't run on this machine at all. Absent when nothing is known to be wrong.
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/LearningSpace'
    RecordingSkill:
      type: object
      required: [containerId, proposal]
      properties:
        containerId:
          $ref: '#/components/schemas/LearningSpaceId'
        proposal:
          $ref: '#/components/schemas/LearningProposal'
    RecordingSkillPage:
      type: object
      required: [skills, nextCursor]
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/RecordingSkill'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    RecordingTitles:
      type: object
      required: [recordings]
      properties:
        recordings:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: string
              title:
                type: [string, 'null']
    UpdateLearnedSkillRequest:
      type: object
