        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Shared use]
      operationId: createSharedUseRequest
      summary: Ask that a Bot may use a shared app account
      description: >-
        Ask an administrator to approve a Bot's use of a shared app's one
        account. What is asked for is never sent: it is the Bot's audience as
        the server reads it now, so a request can't be worded wider than the
        Bot is. A request already waiting for the same audience is answered
        again rather than filed twice, and one waiting for a different
        audience is replaced. Recorded on the audit trail. Only the Bot's
        owner or an administrator may ask. Asking matters only where the
        organization's apps are locked down (getAppsSetting): while they're
        open, anybody who can use a Bot may use its shared accounts, and there
        is nothing to approve.
      security:
        - webSession: []
