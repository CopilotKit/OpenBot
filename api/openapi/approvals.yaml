              schema:
                $ref: '#/components/schemas/SharedUseRequestFiled'
              examples:
                filed:
                  $ref: '#/components/examples/SharedUseRequestFiledExample'
        '400':
          $ref: '#/components/responses/InvalidSharedUseRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SharedUseOwnerOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/shared-use-requests/{sharedUseRequestId}/approve:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SharedUseRequestId'
    post:
      tags: [Shared use]
      operationId: approveSharedUseRequest
      summary: Approve a request to use a shared app account
      description: >-
        Approve a waiting request, so the Bot may use the shared app's account
        for exactly the audience the request names. Recorded on the audit
        trail. Only an administrator may approve one. A request that is not
        waiting, because it was answered, replaced or never filed, is refused
        as already decided.
      security:
        - webSession: []
        - appOAuth: [shared-use:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The request, approved.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedUseRequest'
              examples:
                approved:
                  $ref: '#/components/examples/SharedUseRequestApprovedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/SharedUseRequestDecided'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/shared-use-requests/{sharedUseRequestId}/decline:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SharedUseRequestId'
    post:
      tags: [Shared use]
      operationId: declineSharedUseRequest
      summary: Decline a request to use a shared app account
      description: >-
        Decline a waiting request, leaving what the Bot is approved for as it
        is. Recorded on the audit trail. Only an administrator may decline
        one. A request that is not waiting, because it was answered, replaced
        or never filed, is refused as already decided.
      security:
        - webSession: []
        - appOAuth: [shared-use:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The request, declined.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedUseRequest'
              examples:
                declined:
                  $ref: '#/components/examples/SharedUseRequestDeclinedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/SharedUseRequestDecided'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/shared-use:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    get:
      tags: [Shared use]
      operationId: getBotSharedUse
      summary: Read a Bot's use of shared app accounts
      description: >-
        Return the shared apps a Bot holds, each with the audience it is
        approved for, the audience the Bot needs now, and whether the first
        covers the second, and the Bot's requests still waiting for an
        administrator. A Bot that holds no shared app answers with none.
        While the organization's apps are open (getAppsSetting), every shared
        app reads as covered. Only the Bot's owner or an administrator may
        read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [shared-use:read]
        - apiKey: []
      responses:
        '200':
          description: The Bot's shared apps and its waiting requests.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSharedUse'
              examples:
                oneApp:
                  $ref: '#/components/examples/BotSharedUseExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SharedUseOwnerOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/host-access:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Host access]
      operationId: getHostAccess
      summary: Read a person's folder access
      description: >-
        Return the folders on a person's own computer that they gave their
        Bots, what is waiting for an answer in OpenBot Desktop, whether
        Desktop is connected, and whether this OpenBot runs in Desktop at
        all. A folder is named as the person sees it, never by its path.
        Only the person themselves may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [host-access:read]
        - apiKey: []
      responses:
        '200':
          description: The person's folder access.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostAccess'
              examples:
                oneFolder:
                  $ref: '#/components/examples/HostAccessExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/HostAccessOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/host-access/grants:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    post:
      tags: [Host access]
      operationId: createHostAccessGrant
      summary: Give a Bot a folder on this computer
      description: >-
        Ask OpenBot Desktop to open its folder chooser, and wait for the
        person to pick a folder there for the Bot. The answer arrives when
        they choose, turn it down, or the chooser runs out of time, which can
        take up to two minutes. Recorded on the audit trail with the folder's
        name, never its path. Only the person themselves may ask, for a Bot
        they can use, where an administrator lets them use this computer, and
        only where this OpenBot runs in Desktop and Desktop is connected.
      security:
        - webSession: []
        - appOAuth: [host-access:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHostAccessGrantRequest'
            examples:
              bot:
                value:
                  botId: agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
      responses:
        '201':
          description: The folder the person chose.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostAccessGrant'
              examples:
                granted:
                  $ref: '#/components/examples/HostAccessGrantExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/HostAccessForbidden'
        '404':
          $ref: './common.yaml#/components/responses/BotNotFound'
        '409':
          $ref: '#/components/responses/HostAccessConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/host-access/grants/{hostAccessGrantId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/HostAccessGrantId'
    delete:
      tags: [Host access]
      operationId: deleteHostAccessGrant
      summary: Take a folder away from a Bot
      description: >-
        End a Bot's access to one folder, and stop anything it was doing
        there. Recorded on the audit trail. Only the person who gave the
        folder may take it away; anybody else's, or one that was never given,
        is not found.
      security:
        - webSession: []
        - appOAuth: [host-access:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The Bot no longer has the folder.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/HostAccessOwnOnly'
        '404':
          $ref: '#/components/responses/HostAccessGrantNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/host-access/stop:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    post:
      tags: [Host access]
      operationId: stopHostAccess
      summary: Stop a person's folder access
      description: >-
        End every folder a person gave their Bots, stop anything the Bots
        were doing in them, and tell OpenBot Desktop to stop too. Recorded on
        the audit trail with the folders it ended. Only the person themselves
        may stop it. Stopping when nothing is open is still a stop.
      security:
        - webSession: []
        - appOAuth: [host-access:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Folder access was stopped.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/HostAccessOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  parameters:
    ApprovalId:
      name: approvalId
      in: path
      required: true
      description: The approval's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
      example: 6f1d2c3b-4a5e-4f60-8a7b-9c0d1e2f3a4b
    QuestionId:
      name: questionId
      in: path
      required: true
      description: The question's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    ApprovalRuleId:
      name: approvalRuleId
      in: path
      required: true
      description: The rule's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
      example: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
    ConversationGrantId:
      name: conversationGrantId
      in: path
      required: true
      description: The id of one "Allow for this conversation".
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    ApprovalConversationId:
      name: conversationId
      in: path
      required: true
      description: >-
        The conversation, by the thread its messages are in: the threadId an
        approval's action names.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
      example: 5f0d6c0e-2f1a-4a53-9d51-6f3d6b1f6f10
    ReviewerGuidanceReplaySize:
      name: limit
      in: query
      description: How many requests the replay would cover at most. 25 when absent.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    AuditEventId:
      name: auditEventId
      in: path
      required: true
      description: The audit event's id.
      schema:
        type: string
        format: uuid
      example: 0b8f3a52-5d0e-4f5c-9a43-1c2b6c3e9f10
    SharedUseRequestId:
      name: sharedUseRequestId
      in: path
      required: true
      description: The request's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    HostAccessGrantId:
      name: hostAccessGrantId
      in: path
      required: true
      description: The folder grant's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
  schemas:
    ApprovalDecision:
      type: string
      description: >-
        What a person answers an approval with. allow_once runs it this once.
        allow_conversation runs it and the same action for the rest of the
        conversation. allow_always runs it and saves a rule of the person's
        own. deny declines it. handled answers an action handed to the
        person: they did it themselves, so it is never run for them.
      enum: [allow_once, allow_conversation, allow_always, deny, handled]
    ApprovalStatus:
      type: string
      description: >-
        Where an approval stands. pending waits for the person. approved and
        denied are decided, and consumed is started; the server then carries
        the conversation on. completed is finished.
      x-extensible-enum: [pending, approved, denied, consumed, completed]
    ApprovalActionKind:
      type: string
      description: >-
        A kind of action OpenBot recognises by name and asks about whatever a
        person's own switch says.
      enum:
        - deleting
        - sending
        - sharing
        - publishing
        - payments
        - credentials
        - security_settings
    ApprovalActionKindPolicy:
      type: string
      description: >-
        What the organization lets people do about one kind of action. open,
        the default, asks, and the person can allow it once, for the
        conversation, or always. ask asks every time, with allow once and
        deny only. hand_off leaves it to the person to do themselves.
      enum: [open, ask, hand_off]
    ApprovalRuleBehaviour:
      type: string
      description: >-
        What a matching rule does. allow takes the action without asking.
        pre_approved takes it only when the person asked for that exact
        action in the request. ask asks first. hand_off leaves it to the
        person.
      enum: [allow, pre_approved, ask, hand_off]
    HostCommandPolicy:
      type: string
      description: >-
        Commands on a person's own computer: ask each time, allow them, or
        never run them.
      enum: [ask, allow, never]
    ApprovalPolicyOutcome:
      type: object
      description: Why an action asks, as the card that asks about it says.
      required: [behaviour, source, reason]
      properties:
        behaviour:
          type: string
          enum: [allow, ask, hand_off, deny]
        source:
          type: string
          minLength: 1
          description: >-
            Which layer decided: safety, team_rule, personal_rule,
            auto_review, default, person_declined, conversation or task.
        reason:
          type: string
        kind:
          $ref: '#/components/schemas/ApprovalActionKind'
        closed:
          type: boolean
          description: >-
            The organization set this kind to ask every time, so the only
            answers are allow_once and deny.
    ApprovalAction:
      type: object
      description: The action an approval is about.
      required: [botId, toolRef, effect, scope, threadId]
      properties:
        botId:
          type: string
        toolRef:
          type: string
          description: The tool or app the action calls.
        effect:
          type: string
          description: What kind of effect the action has, such as read or write.
        scope:
          type: string
          description: What the action is aimed at.
        threadId:
          type: string
          description: The thread of the conversation the action was asked in.
        toolCallId:
          type: string
          description: The call in that conversation, so a screen draws the approval where the action was.
        args:
          description: >-
            What the action was called with, cut short for showing, with
            values that look like secrets masked. Any JSON value.
        target:
          description: >-
            What the action was aimed at, cut short for showing. Any JSON
            value.
        account:
          type: string
          description: Which of the person's accounts at the app, where they hold several.
        policy:
          $ref: '#/components/schemas/ApprovalPolicyOutcome'
    ApprovalResult:
      type: object
      description: What came of a decided action.
      properties:
        error:
          type: string
          description: Why the action was not done. Absent when it was.
    ApprovalLeft:
      type: object
      description: >-
        Set when the conversation could not be carried on after the approval
        was decided: whether the action was done, the sentence that says so,
        and the answer the Bot never received.
      required: [done, message, answer]
      properties:
        done:
          type: boolean
        message:
          type: string
        answer:
          type: string
    Approval:
      type: object
      description: One action a Bot asked a person about before running it.
      required:
        - id
        - status
        - decision
        - result
        - createdAt
        - decidedAt
        - consumedAt
        - completedAt
        - action
      properties:
        id:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        decision:
          description: What the person answered. Null while it waits.
          oneOf:
            - $ref: '#/components/schemas/ApprovalDecision'
            - type: 'null'
        result:
          description: What came of it. Null until the action has an outcome.
          oneOf:
            - $ref: '#/components/schemas/ApprovalResult'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        consumedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        left:
          $ref: '#/components/schemas/ApprovalLeft'
        action:
          $ref: '#/components/schemas/ApprovalAction'
    ApprovalPage:
      type: object
      required: [approvals, nextCursor]
      properties:
        approvals:
          type: array
          description: The newest first.
          items:
            $ref: '#/components/schemas/Approval'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    DecideApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
    QuestionPart:
      type: object
      description: One decision inside a question, answered on its own.
      required: [header, question]
      properties:
        header:
          type: string
        question:
          type: string
        options:
          type: array
          description: The likely answers. Absent for an answer the person types.
          items:
            type: string
    Question:
      type: object
      description: A question a Bot asked a person, waiting for their answer.
      required: [id, botId, conversationBotId, threadId, question, createdAt]
      properties:
        id:
          type: string
          minLength: 1
        botId:
          type: string
          description: The Bot that asked.
        conversationBotId:
          type: string
          description: >-
            The Bot whose conversation the question belongs to: for work one
            Bot handed to another, the Bot that handed it on.
        threadId:
          type: string
        channelId:
          type: string
          description: The conversation it was asked in, which is where it is answered.
        question:
          type: string
        why:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/QuestionPart'
        createdAt:
          type: string
          format: date-time
    QuestionPage:
      type: object
      required: [questions, nextCursor]
      properties:
        questions:
          type: array
          description: The newest first.
          items:
            $ref: '#/components/schemas/Question'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    RespondToQuestionRequest:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response:
          type: string
          minLength: 1
          maxLength: 6000
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: The person's answer. Trimmed.
        inConversation:
          type: boolean
          description: >-
            Sent from the open conversation, which then runs the answer as
            its own next turn when that is where it belongs.
    QuestionAnswer:
      type: object
      required: [id, continueHere]
      properties:
        id:
          type: string
          minLength: 1
        continueHere:
          type: boolean
          description: >-
            True when the question is closed and the open conversation runs
            the answer as its next turn. False when the server carries the
            Bot's work on with the answer.
    ApprovalPreferences:
      type: object
      description: What a person set for themselves about asking.
      required: [enabled, autoReview, hostCommands, effectiveHostCommands]
      properties:
        enabled:
          type: boolean
          description: Ask before a Bot makes changes.
        autoReview:
          type: boolean
          description: Let the reviewer decide what is safe to run without asking.
        hostCommands:
          $ref: '#/components/schemas/HostCommandPolicy'
        effectiveHostCommands:
          description: >-
            The person's choice after the organization's limit: the stricter
            of the two applies.
          allOf:
            - $ref: '#/components/schemas/HostCommandPolicy'
    UpdateApprovalPreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        autoReview:
          type: boolean
        hostCommands:
          $ref: '#/components/schemas/HostCommandPolicy'
    ApprovalRulePattern:
      type: string
      minLength: 1
      maxLength: 300
      pattern: ^[^\x00]*[^\s\x00][^\x00]*$
      description: >-
        An exact value, or a pattern where * matches anything, so
        mcp/gmail/* names every Gmail tool. Trimmed.
    ApprovalRuleInput:
      type: object
      additionalProperties: false
      required: [toolRef, behaviour]
      properties:
        botId:
          description: Which Bot. Every Bot when left out.
          default: '*'
          allOf:
            - $ref: '#/components/schemas/ApprovalRulePattern'
        toolRef:
          description: Which tool or app.
          allOf:
            - $ref: '#/components/schemas/ApprovalRulePattern'
        effect:
          description: Which kind of effect. Every kind when left out.
          default: '*'
          allOf:
            - $ref: '#/components/schemas/ApprovalRulePattern'
        scope:
          description: Which target. Every target when left out.
          default: '*'
          allOf:
            - $ref: '#/components/schemas/ApprovalRulePattern'
        behaviour:
          $ref: '#/components/schemas/ApprovalRuleBehaviour'
    ApprovalRuleChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        botId:
          $ref: '#/components/schemas/ApprovalRulePattern'
        toolRef:
          $ref: '#/components/schemas/ApprovalRulePattern'
        effect:
          $ref: '#/components/schemas/ApprovalRulePattern'
        scope:
          $ref: '#/components/schemas/ApprovalRulePattern'
        behaviour:
          $ref: '#/components/schemas/ApprovalRuleBehaviour'
    PersonApprovalRule:
      type: object
      description: A rule a person saved for their own Bots' actions.
      required:
        - id
        - botId
        - toolRef
        - effect
        - scope
        - behaviour
        - account
        - kind
        - createdAt
      properties:
        id:
          type: string
          minLength: 1
        botId:
          type: string
        toolRef:
          type: string
        effect:
          type: string
        scope:
          type: string
        behaviour:
          $ref: '#/components/schemas/ApprovalRuleBehaviour'
        account:
          type: [string, 'null']
          description: The one account at the app the rule is for, or null for whichever account.
        kind:
          description: >-
            The kind of action the rule was saved from, by always allowing
            that kind's approval, or null.
          oneOf:
            - $ref: '#/components/schemas/ApprovalActionKind'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
    PersonApprovalRulePage:
      type: object
      required: [approvalRules, nextCursor]
      properties:
        approvalRules:
          type: array
          description: The newest first.
          items:
            $ref: '#/components/schemas/PersonApprovalRule'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    ApprovalRule:
      type: object
      description: A rule the organization set for everybody's Bots' actions.
      required: [id, botId, toolRef, effect, scope, behaviour, createdBy, createdAt]
      properties:
        id:
          type: string
          minLength: 1
        botId:
          type: string
        toolRef:
          type: string
        effect:
          type: string
        scope:
          type: string
        behaviour:
          $ref: '#/components/schemas/ApprovalRuleBehaviour'
        createdBy:
          type: [string, 'null']
          description: The id of the administrator who made it, where that is known.
        createdAt:
          type: string
          format: date-time
    ApprovalRulePage:
      type: object
      required: [approvalRules, nextCursor]
      properties:
        approvalRules:
          type: array
          description: The newest first.
          items:
            $ref: '#/components/schemas/ApprovalRule'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    ConversationGrant:
      type: object
      description: >-
        One "Allow for this conversation": one action, in one conversation,
        for one person, until they turn it off or delete the conversation.
      required: [id, threadId, botId, toolRef, effect, scope, createdAt]
      properties:
        id:
          type: string
          minLength: 1
        threadId:
          type: string
          description: The thread of the conversation it holds in.
        botId:
          type: string
        toolRef:
          type: string
        effect:
          type: string
        scope:
          type: string
        account:
          type: string
        kind:
          $ref: '#/components/schemas/ApprovalActionKind'
        createdAt:
          type: string
          format: date-time
    ConversationGrantPage:
      type: object
      required: [conversationGrants, nextCursor]
      properties:
        conversationGrants:
          type: array
          description: The newest first.
          items:
            $ref: '#/components/schemas/ConversationGrant'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    ApprovalMode:
      type: object
      description: How one conversation asks.
      required: [asksEveryStep]
      properties:
        asksEveryStep:
          type: boolean
          description: >-
            True for the conversation of a task started from a check-in,
            where every change asks first whatever the person's rules say.
    ComputerStepConversation:
      type: object
      additionalProperties: false
      description: >-
        The conversation a computer step was called in, as the client holds
        it: an AG-UI run input, with the call the step answers. The messages
        are AG-UI's own, so each one is an open object here and is checked
        as AG-UI checks it.
      required: [runId, threadId, toolCallId, toolName, messages, context]
      properties:
        runId:
          type: string
          minLength: 1
        threadId:
          type: string
          minLength: 1
        toolCallId:
          type: string
          minLength: 1
          description: The unanswered tool call in the messages that this step is.
        toolName:
          type: string
          minLength: 1
          description: The computer tool called, which the call in the messages names too.
        args:
          description: The call's arguments, equal to the ones the call in the messages carries. Any JSON value.
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
            description: An AG-UI message.
        state:
          description: The run's state. Any JSON value.
        context:
          type: array
          items:
            type: object
            additionalProperties: true
            description: An AG-UI context entry.
        forwardedProps:
          description: What the client forwards to the run. Any JSON value.
    ComputerStepRequest:
      type: object
      additionalProperties: false
      required: [botId, conversation]
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The Bot whose computer takes the step.
        conversation:
          $ref: '#/components/schemas/ComputerStepConversation'
    ComputerStepHandoff:
      type: object
      description: The request for a person that holds the computer.
      required: [id, reason, source, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        toolCallId:
          type: string
        reason:
          type: string
        source:
          type: string
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        expiresAt:
          type: string
        finishedAt:
          type: string
        interruption:
          type: string
        url:
          type: string
        keepsPage:
          type: boolean
    ComputerStepDone:
      type: object
      description: The step ran. What the computer answered is the result.
      required: [outcome]
      properties:
        outcome:
          type: string
          const: done
        result:
          description: What the computer answered, as the tool's result. Any JSON value.
    ComputerStepWaiting:
      type: object
      description: >-
        The step waits for the person's approval. Nothing ran. The decision
        runs it once and carries the conversation on.
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          const: waiting
        approvalId:
          type: string
          description: The approval to decide.
        reason:
          type: string
    ComputerStepHeld:
      type: object
      description: >-
        The computer is held for a person, so nothing ran. The error is what
        the Bot is told.
      required: [outcome, error, humanHasControl]
      properties:
        outcome:
          type: string
          const: held
        error:
          type: string
        humanHasControl:
          type: boolean
          const: true
        requestId:
          type: string
        handoff:
          $ref: '#/components/schemas/ComputerStepHandoff'
    ComputerStepOutcome:
      description: What came of a computer step, by its outcome.
      oneOf:
        - $ref: '#/components/schemas/ComputerStepDone'
        - $ref: '#/components/schemas/ComputerStepWaiting'
        - $ref: '#/components/schemas/ComputerStepHeld'
      discriminator:
        propertyName: outcome
        mapping:
          done: '#/components/schemas/ComputerStepDone'
          waiting: '#/components/schemas/ComputerStepWaiting'
          held: '#/components/schemas/ComputerStepHeld'
    ApprovalActionKinds:
      type: object
      additionalProperties: false
      description: >-
        What the organization lets people do about each kind of action. A
        kind not named is open.
      properties:
        deleting:
          $ref: '#/components/schemas/ApprovalActionKindPolicy'
        sending:
          $ref: '#/components/schemas/ApprovalActionKindPolicy'
        sharing:
          $ref: '#/components/schemas/ApprovalActionKindPolicy'
        publishing:
          $ref: '#/components/schemas/ApprovalActionKindPolicy'
        payments:
          $ref: '#/components/schemas/ApprovalActionKindPolicy'
        credentials:
          $ref: '#/components/schemas/ApprovalActionKindPolicy'
        security_settings:
          $ref: '#/components/schemas/ApprovalActionKindPolicy'
    ApprovalSettings:
      type: object
      description: What the organization decides about asking, for everybody.
      required: [enforceAutoReview, customRulesEnabled, hostCommandsCap, actionKinds]
      properties:
        enforceAutoReview:
          type: boolean
          description: The reviewer reads every action, whatever a person chose.
        customRulesEnabled:
          type: boolean
          description: People may save rules of their own.
        hostCommandsCap:
          description: The most a person may allow for commands on their own computer.
          allOf:
            - $ref: '#/components/schemas/HostCommandPolicy'
        actionKinds:
          $ref: '#/components/schemas/ApprovalActionKinds'
    UpdateApprovalSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enforceAutoReview:
          type: boolean
        customRulesEnabled:
          type: boolean
        hostCommandsCap:
          $ref: '#/components/schemas/HostCommandPolicy'
        actionKinds:
          description: The kinds to change. A kind left out stays as it was set.
          allOf:
            - $ref: '#/components/schemas/ApprovalActionKinds'
    ApprovalRuleDraftDescription:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: The rule in a sentence or two, at most 1,000 characters once trimmed.
    ApprovalRuleDraftBehaviour:
      type: string
      enum: [allow, pre_approved, ask, hand_off]
      description: >-
        What happens to an action a rule matches. allow: the Bot takes it
        without asking. pre_approved: without asking only when the person
        asked for that exact action in the conversation. ask: the Bot asks
        first. hand_off: the person does it themselves.
    ApprovalRuleDraftRow:
      type: object
      description: >-
        One candidate rule. The four patterns are globs, where * matches any
        run of characters and every other character matches itself.
      additionalProperties: false
      required: [botId, toolRef, effect, scope, behaviour]
      properties:
        botId:
          type: string
          maxLength: 300
          pattern: ^[^\x00]*$
          description: The Bot taking the action, by its id, or * for every Bot.
        toolRef:
          type: string
          maxLength: 300
          pattern: ^[^\x00]*$
          description: The tool, such as composio-gmail/* for every tool of that app.
        effect:
          type: string
          maxLength: 300
          pattern: ^[^\x00]*$
          description: The kind of action, such as read or write.
        scope:
          type: string
          maxLength: 300
          pattern: ^[^\x00]*$
          description: The target. For an app's tool it is the app's id.
        behaviour:
          $ref: '#/components/schemas/ApprovalRuleDraftBehaviour'
    ApprovalRuleDraftWrittenRow:
      type: object
      description: >-
        A rule as the model wrote it. When the check passes it is a valid
        ApprovalRuleDraftRow; when it does not, it is kept as written so an
        administrator can see and fix what failed.
      required: [botId, toolRef, effect, scope, behaviour]
      properties:
        botId:
          type: string
        toolRef:
          type: string
        effect:
          type: string
        scope:
          type: string
        behaviour:
          type: string
    ApprovalRuleDraftProblem:
      type: object
      description: What is wrong with one field of one rule.
      required: [row, field, message]
      properties:
        row:
          type: integer
          minimum: 1
          description: Which rule, counted from 1.
        field:
          type: string
          enum: [botId, toolRef, effect, scope, behaviour]
        message:
          type: string
    ApprovalRuleDraftCheck:
      type: object
      description: >-
        Whether every rule matches real tools, kinds of action and Bots, by
        the approval gate's own matcher. error and problems say what is wrong
        when one does not.
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRuleDraftProblem'
    ApprovalRuleDraftTranslation:
      type: object
      required: [rules, summary, explanation, check, warning]
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRuleDraftWrittenRow'
        summary:
          type: [string, 'null']
          description: The rules in one sentence, read from the rules alone. Null when they don't check.
        explanation:
          type: [string, 'null']
          description: What the rules do, read from the rules alone. Null when they don't check.
        check:
          $ref: '#/components/schemas/ApprovalRuleDraftCheck'
        warning:
          type: [string, 'null']
          description: Set when a rule covers every action every Bot takes.
    ApprovalRuleDraftReplayInput:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/ApprovalRuleDraftRow'
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: How many recent actions of each kind to test against. 500 when absent.
    ApprovalRuleDraftSubject:
      type: object
      description: What an action was aimed at, where the record names it.
      properties:
        file:
          type: string
        page:
          type: string
        command:
          type: string
        folder:
          type: string
    ApprovalRuleDraftInitiator:
      type: object
      description: What started the run the action was part of, such as a person or a routine.
      required: [kind, id]
      properties:
        kind:
          type: string
        id:
          type: [string, 'null']
    ApprovalRuleDraftReplayChange:
      type: object
      description: One action the approval gate already decided that the rules are about.
      required:
        - id
        - createdAt
        - ownerUserId
        - initiator
        - bot
        - toolRef
        - effect
        - scope
        - subject
        - was
        - wasSource
        - would
        - change
        - person
        - rule
        - reason
      properties:
        id:
          type: string
        createdAt:
          type: string
        ownerUserId:
          type: [string, 'null']
          description: The person the Bot acted for.
        initiator:
          $ref: '#/components/schemas/ApprovalRuleDraftInitiator'
        bot:
          type: string
        toolRef:
          type: string
        effect:
          type: string
        scope:
          type: string
        subject:
          $ref: '#/components/schemas/ApprovalRuleDraftSubject'
        was:
          type: string
          enum: [allow, ask, hand_off, deny]
          description: What happened.
        wasSource:
          type: string
          description: What decided it, such as safety, team_rule, personal_rule or default.
        would:
          type: string
          enum: [allow, ask, hand_off, deny]
          description: What would happen with the rules.
        change:
          type: string
          enum: [removes_ask, adds_ask, stricter, looser, fixed]
          description: >-
            fixed is an action whose answer no rule changes, such as one a
            safety requirement decided.
        person:
          type: [string, 'null']
          enum: [allow_once, allow_conversation, allow_always, deny, handled, waiting, withdrawn, null]
          description: What the person answered, where they were asked.
        rule:
          type: integer
          minimum: 1
          description: Which candidate rule decided it, counted from 1.
        reason:
          type: string
    ApprovalRuleDraftReplayReport:
      type: object
      required: [scanned, matched, changed, removedAsks, removedDenied, addedAsks, fixed, changes]
      properties:
        scanned:
          type: integer
          description: Actions replayed, each once.
        matched:
          type: integer
          description: Actions any of the rules is about.
        changed:
          type: integer
        removedAsks:
          type: integer
        removedDenied:
          type: integer
          description: Of the removed asks, the ones a person had denied.
        addedAsks:
          type: integer
        fixed:
          type: integer
          description: Actions the rules are about whose answer no rule changes.
        changes:
          type: array
          description: >-
            The changed actions, denied asks first, then the fixed ones. At
            most 70; the counts cover every action replayed.
          items:
            $ref: '#/components/schemas/ApprovalRuleDraftReplayChange'
    ApprovalRuleDraftReplay:
      type: object
      required: [check, warning, report]
      properties:
        check:
          $ref: '#/components/schemas/ApprovalRuleDraftCheck'
        warning:
          type: [string, 'null']
        report:
          $ref: '#/components/schemas/ApprovalRuleDraftReplayReport'
    ApprovalRuleDraftAuthoring:
      type: object
      description: Where the rules came from, when they were written from a description.
      additionalProperties: false
      required: [source, text]
      properties:
        source:
          type: string
          enum: [english]
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: The sentence the rules were written from, at most 2,000 characters once trimmed.
    ApprovalRuleDraftBatch:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/ApprovalRuleDraftRow'
        authoring:
          $ref: '#/components/schemas/ApprovalRuleDraftAuthoring'
    ApprovalRuleDraftSavedRule:
      type: object
      description: One of the organization's approval rules, as saved.
      required: [id, botId, toolRef, effect, scope, behaviour, createdBy, revokedAt, createdAt]
      properties:
        id:
          type: string
        botId:
          type: string
        toolRef:
          type: string
        effect:
          type: string
        scope:
          type: string
        behaviour:
          $ref: '#/components/schemas/ApprovalRuleDraftBehaviour'
        createdBy:
          type: [string, 'null']
          description: The administrator who saved it.
        revokedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    ApprovalRuleDraftSavedRules:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRuleDraftSavedRule'
    ReviewerGuidance:
      type: object
      required: [guidance]
      properties:
        guidance:
          type: [string, 'null']
          description: The words auto-review reads now, or null when there are none.
    ReviewerGuidanceInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: The guidance, at most 2,000 characters once trimmed.
    ReviewerGuidanceCheck:
      type: object
      description: Whether the words read as guidance. error says why not when they don't.
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    ReviewerGuidanceReading:
      type: object
      description: The words read back by a call that saw nothing else.
      required: [summary, explanation, check]
      properties:
        summary:
          type: [string, 'null']
          description: What the guidance changes, in one sentence.
        explanation:
          type: string
          description: What auto-review will do differently.
        check:
          $ref: '#/components/schemas/ReviewerGuidanceCheck'
    ReviewerGuidanceSaved:
      type: object
      required: [guidance, summary, explanation, check]
      properties:
        guidance:
          type: string
          description: The words as saved, trimmed.
        summary:
          type: [string, 'null']
        explanation:
          type: string
        check:
          $ref: '#/components/schemas/ReviewerGuidanceCheck'
    ReviewerGuidanceReplaySample:
      type: object
      required: [calls, skippedSafety]
      properties:
        calls:
          type: integer
          description: The requests a replay would cover, one model call each.
        skippedSafety:
          type: integer
          description: Decided requests passed over because a built-in safety requirement decides them first.
    ReviewerGuidanceReplayInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: The guidance to test, at most 2,000 characters once trimmed.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          description: How many requests to replay at most, one model call each. 25 when absent.
    ReviewerGuidanceReplayRow:
      type: object
      description: One request a person decided, with what auto-review would do about it.
      required:
        - id
        - createdAt
        - ownerUserId
        - initiator
        - bot
        - toolRef
        - effect
        - scope
        - subject
        - person
        - would
        - outcome
        - reason
        - hadRequest
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        ownerUserId:
          type: string
        initiator:
          $ref: '#/components/schemas/ApprovalRuleDraftInitiator'
        bot:
          type: string
        toolRef:
          type: string
        effect:
          type: string
        scope:
          type: string
        subject:
          $ref: '#/components/schemas/ApprovalRuleDraftSubject'
        person:
          type: string
          enum: [allow_once, allow_always, deny]
          description: What the person pressed when they were asked.
        would:
          type: string
          enum: [proceed, ask, hand_off, unreviewed]
          description: What auto-review would have done. unreviewed is no usable answer.
        outcome:
          type: string
          enum: [agree, let_through_denied, asked_allowed, unreviewed]
        reason:
          type: string
          description: Auto-review's own reason, or why it gave none.
        hadRequest:
          type: boolean
          description: Whether the conversation had words from a person for auto-review to read.
    ReviewerGuidanceReplay:
      type: object
      required:
        - sample
        - reviewed
        - agreed
        - letThroughDenied
        - askedAllowed
        - unreviewed
        - withoutRequest
        - skippedSafety
        - rows
      properties:
        sample:
          type: integer
          description: Requests replayed, one model call each.
        reviewed:
          type: integer
          description: Of those, the ones auto-review answered. Agreement is counted over these.
        agreed:
          type: integer
        letThroughDenied:
          type: integer
          description: Auto-review would have let it run, and the person had denied it.
        askedAllowed:
          type: integer
          description: Auto-review would have asked, or handed it off, and the person had allowed it.
        unreviewed:
          type: integer
        withoutRequest:
          type: integer
        skippedSafety:
          type: integer
        rows:
          type: array
          description: Disagreements first, the ones it would have let through first of all.
          items:
            $ref: '#/components/schemas/ReviewerGuidanceReplayRow'
    BoundaryMode:
      type: string
      enum: [enforce, dry-run]
      description: >-
        enforce refuses what the rules refuse. dry-run records what they would
        have refused and lets it through, to try a rule before it stops
        anybody's work.
    BoundaryRuleLabel:
      type: object
      description: What a rule is called and what it stops, in words. Never evaluated.
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
    BoundaryRuleLabelInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: 1 to 80 characters once trimmed.
        description:
          type: string
          maxLength: 300
          pattern: ^[^\x00]*$
          description: At most 300 characters once trimmed.
    Boundaries:
      type: object
      description: >-
        What every Bot may do. Deny rules are read first: an action any of
        them is true for is refused, whatever an allow rule says. Then an
        action any allow rule is true for is permitted, and one that none is
        true for is refused.
      required: [mode, deny, allow, labels]
      properties:
        mode:
          $ref: '#/components/schemas/BoundaryMode'
        deny:
          type: array
          description: The deny rules, each a CEL expression.
          items:
            type: string
        allow:
          type: array
          description: The allow rules, each a CEL expression.
          items:
            type: string
        labels:
          type: object
          description: Each rule's name and description, keyed by the rule's own text.
          additionalProperties:
            $ref: '#/components/schemas/BoundaryRuleLabel'
    BoundariesDraft:
      type: object
      additionalProperties: false
      description: Boundaries to test, as a save would take them.
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/BoundaryMode'
        deny:
          type: array
          default: []
          items:
            type: string
        allow:
          type: array
          default: []
          items:
            type: string
        labels:
          type: object
          description: >-
            Each rule's name and description, keyed by the rule's own text. A
            label for a rule in neither list is dropped.
          additionalProperties:
            $ref: '#/components/schemas/BoundaryRuleLabelInput'
    BoundariesInput:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/BoundaryMode'
        deny:
          type: array
          default: []
          description: >-
            The deny rules, each a CEL expression. One added here must be one
            OpenBot can evaluate.
          items:
            type: string
        allow:
          type: array
          default: []
          description: >-
            The allow rules, each a CEL expression. Empty permits nothing.
          items:
            type: string
        labels:
          type: object
          description: >-
            Each rule's name and description, keyed by the rule's own text. A
            label for a rule in neither list is dropped.
          additionalProperties:
            $ref: '#/components/schemas/BoundaryRuleLabelInput'
        authoring:
          $ref: './common.yaml#/components/schemas/Authoring'
    BoundaryTranslation:
      type: object
      required: [rule, effect, summary, explanation, compile, warning]
      properties:
        rule:
          type: string
          description: The rule the model wrote, as a CEL expression.
        effect:
          type: string
          enum: [deny, allow]
          description: Which list the rule belongs in.
        summary:
          type: [string, 'null']
          description: >-
            What the rule does in one sentence, read from the rule alone. Null
            when the rule does not compile, or the reading gave none.
        explanation:
          type: [string, 'null']
          description: >-
            What the rule does, read from the rule alone by a call that never
            saw the description. Null when the rule does not compile.
        compile:
          $ref: './common.yaml#/components/schemas/RuleCheck'
        warning:
          type: [string, 'null']
          description: >-
            Set when the rule answers the same for every action, so it would
            stop everything or nothing.
    BoundaryReplayRequest:
      type: object
      additionalProperties: false
      required: [boundaries]
      properties:
        boundaries:
          $ref: '#/components/schemas/BoundariesDraft'
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
          description: How many of the newest recorded actions to test against.
    BoundaryReplayChange:
      type: object
      description: One recorded action the boundaries would decide differently.
      required:
        - id
        - createdAt
        - kind
        - action
        - bot
        - page
        - element
        - command
        - file
        - initiator
        - was
        - would
        - rule
        - reason
      properties:
        id:
          type: string
          description: The audit event that recorded the action.
        createdAt:
          type: string
          format: date-time
        kind:
          type: string
          enum: [computer, app]
          description: Where the action was taken, on a Bot's computer or in an app.
        action:
          type: string
          description: >-
            The computer's tool, such as computer_click, or the app's tool as
            app/tool.
        bot:
          type: string
        page:
          type: string
          description: The page the Bot's browser was on. Empty for an app call.
        element:
          type: [object, 'null']
          description: The button, link or field acted on, when there was one.
          required: [role, name]
          properties:
            role:
              type: string
            name:
              type: string
        command:
          type: [string, 'null']
        file:
          type: [string, 'null']
        initiator:
          type: object
          description: What started the run.
          required: [kind, id]
          properties:
            kind:
              type: string
            id:
              type: string
              description: The routine or Bot that started it. Empty for a person.
        was:
          type: string
          enum: [allowed, refused]
          description: What the boundaries in force decided at the time.
        would:
          type: string
          enum: [allowed, refused]
          description: What the boundaries being tested decide.
        rule:
          type: [string, 'null']
          description: >-
            The rule that decides it. Null when no rule permits the action, so
            it is refused.
        reason:
          type: string
    BoundaryReplayReport:
      type: object
      required: [scanned, wouldRefuse, wouldAllow, unchanged, changes]
      properties:
        scanned:
          type: integer
          description: How many recorded actions were tested.
        wouldRefuse:
          type: integer
        wouldAllow:
          type: integer
        unchanged:
          type: integer
        changes:
          type: array
          description: >-
            The actions decided differently, newest first, at most 50. The
            counts cover every action tested.
          items:
            $ref: '#/components/schemas/BoundaryReplayChange'
    WhatIfInitiator:
      type: string
      enum: [person, routine, handoff, responsibility, memory]
      description: >-
        What starts the run: a person chatting, a routine, another Bot handing
        work on, a goal the Bot watches for, or a follow-up it set itself.
    WhatIfLayerId:
      type: string
      enum:
        - grant
        - app_allowlist
        - capabilities
        - network
        - boundaries
        - safety
        - approvals
      description: One of OpenBot's controls.
    WhatIfOutcome:
      type: string
      enum: [allowed, refused, asks, hands_off]
      description: >-
        allowed: every control lets it through. refused: a control stops it.
        asks: it waits for a person to approve it. hands_off: it stops for a
        person to do it themselves.
    WhatIfAction:
      type: object
      additionalProperties: false
      description: >-
        One action a Bot might take. Who: a Bot, and either the person whose
        accounts it runs on or a team or directory group, for any member of it. What
        starts the run. Then either an app's tool, or something on the Bot's
        computer. A field that does not apply is empty.
      required:
        - bot
        - person
        - group
        - initiator
        - surface
        - app
        - tool
        - intent
        - host
        - label
        - command
        - file
      properties:
        bot:
          type: string
          description: The Bot's id.
        person:
          type: string
          description: The person's id. Empty when a group is named.
        group:
          type: string
          description: >-
            A directory group's name, or team:<id> for one of the
            organization's teams. Empty when a person is named.
        initiator:
          $ref: '#/components/schemas/WhatIfInitiator'
        surface:
          type: string
          enum: [app, computer]
        app:
          type: string
          description: The app's id. App calls only.
        tool:
          type: string
          description: The tool's own name. App calls only.
        intent:
          type: string
          enum:
            - ''
            - navigate
            - activate
            - type
            - read
            - read_file
            - write_file
            - list_files
            - download_file
            - run_command
          description: What the Bot does on its computer. Computer actions only.
        host:
          type: string
          description: >-
            The page's host, such as mail.google.com. Computer actions only,
            and empty for a file or a command.
        label:
          type: string
          description: The button's or field's label, at most 300 characters.
        command:
          type: string
          description: The command, at most 300 characters.
        file:
          type: string
          description: The file's path, at most 300 characters.
    WhatIfLabels:
      type: object
      description: The names to show for the ids in an action.
      properties:
        bot:
          type: string
        person:
          type: string
        group:
          type: string
        app:
          type: string
    WhatIfQuestion:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: The question, 1 to 500 characters once trimmed.
    WhatIfActionRead:
      type: object
      description: The question names one action.
      required: [understood, action, labels, missing]
      properties:
        understood:
          type: string
          const: 'yes'
        action:
          $ref: '#/components/schemas/WhatIfAction'
        labels:
          $ref: '#/components/schemas/WhatIfLabels'
        missing:
          type: [string, 'null']
          description: >-
            What is still to choose before the action can be checked, in a
            sentence. Null when nothing is.
    WhatIfNotUnderstood:
      type: object
      description: The question names no one action a Bot takes.
      required: [understood, unclear]
      properties:
        understood:
          type: string
          const: 'no'
        unclear:
          type: string
          description: What to ask instead, in a sentence.
    WhatIfReading:
      description: A question read as one action, or why it names none.
      oneOf:
        - $ref: '#/components/schemas/WhatIfActionRead'
        - $ref: '#/components/schemas/WhatIfNotUnderstood'
      discriminator:
        propertyName: understood
        mapping:
          'yes': '#/components/schemas/WhatIfActionRead'
          'no': '#/components/schemas/WhatIfNotUnderstood'
    WhatIfCheckRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/WhatIfAction'
        question:
          type: string
          maxLength: 500
          pattern: ^[^\x00]*$
          description: The question the action was read from, recorded with the check.
    WhatIfLayer:
      type: object
      description: What one control says about the action.
      required: [id, title, verdict, summary, decides, unreached]
      properties:
        id:
          $ref: '#/components/schemas/WhatIfLayerId'
        title:
          type: string
        verdict:
          type: string
          enum: [allows, refuses, asks, hands_off, trial]
          description: >-
            refuses stops the action. asks and hands_off stop it until a
            person answers or does it themselves. trial is a boundary in trial
            mode: it would refuse, records that, and lets the action through.
            allows lets it past this control.
        summary:
          type: string
          description: What this control says about the action, and why, in a sentence.
        basis:
          type: string
          description: The rule, grant or switch that decided it, by name.
        rule:
          type: string
          description: The rule as written, where it is a rule.
        page:
          type: string
          enum:
            - /admin/plugins
            - /admin/permissions
            - /admin/computers
            - /admin/boundaries
            - /admin/approvals
          description: The admin page the control is set on. Absent for what is built in.
        decides:
          type: boolean
          description: This control is the one that settles the action.
        unreached:
          type: boolean
          description: An earlier control already stopped the action.
        caveat:
          type: string
          description: Something this control would check that a what-if can't know.
    WhatIfResult:
      type: object
      required:
        - outcome
        - decidedBy
        - headline
        - layers
        - notApplicable
        - notChecked
      properties:
        outcome:
          $ref: '#/components/schemas/WhatIfOutcome'
        decidedBy:
          description: The control that settles it. Null when every control lets it through.
          oneOf:
            - $ref: '#/components/schemas/WhatIfLayerId'
            - type: 'null'
        headline:
          type: string
          description: The outcome and the control that settles it, in a line.
        layers:
          type: array
          description: The controls that apply, in the order OpenBot applies them.
          items:
            $ref: '#/components/schemas/WhatIfLayer'
        notApplicable:
          type: array
          description: The controls that don't apply to this kind of action, by title.
          items:
            type: string
        notChecked:
          type: array
          description: >-
            What a real action is also checked for that depends on what it
            sends, so a what-if can't say.
          items:
            type: string
        effect:
          type: string
          enum: [read, write]
          description: The app's own classification of the tool. App calls only.
    WhatIfCheck:
      type: object
      required: [action, labels, result]
      properties:
        action:
          $ref: '#/components/schemas/WhatIfAction'
        labels:
          $ref: '#/components/schemas/WhatIfLabels'
        result:
          $ref: '#/components/schemas/WhatIfResult'
    WhatIfRecorded:
      type: object
      description: What the audit event recorded at the time.
      required: [outcome, layer, summary]
      properties:
        outcome:
          type: string
          enum: [allowed, refused, asks, hands_off, failed]
        layer:
          description: The control the event says stopped it, where it says.
          oneOf:
            - $ref: '#/components/schemas/WhatIfLayerId'
            - type: 'null'
        summary:
          type: string
    WhatIfExplanation:
      type: object
      required: [action, labels, result, recorded]
      properties:
        action:
          $ref: '#/components/schemas/WhatIfAction'
        labels:
          $ref: '#/components/schemas/WhatIfLabels'
        result:
          $ref: '#/components/schemas/WhatIfResult'
        recorded:
          $ref: '#/components/schemas/WhatIfRecorded'
    WhatIfVocabulary:
      type: object
      description: What an action can name in this organization.
      required: [bots, people, groups, apps]
      properties:
        bots:
          type: array
          items:
            type: object
            required: [id, name, owner]
            properties:
              id:
                type: string
              name:
                type: string
              owner:
                type: [string, 'null']
                description: The person who owns the Bot, by id. Null when nobody does.
        people:
          type: array
          items:
            type: object
            required: [id, name, email]
            properties:
              id:
                type: string
              name:
                type: [string, 'null']
              email:
                type: string
        groups:
          type: array
          description: The directory groups, by name.
          items:
            type: string
        teams:
          type: array
          description: >-
            The organization's teams. An action names one in group, as
            team:<id>.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        apps:
          type: array
          items:
            type: object
            required: [id, name, tools]
            properties:
              id:
                type: string
              name:
                type: string
              tools:
                type: array
                items:
                  type: object
                  required: [name, effect, destructive]
                  properties:
                    name:
                      type: string
                    effect:
                      type: string
                      enum: [read, write]
                      description: Whether a call to the tool changes something.
                    destructive:
                      type: boolean
                      description: The app marks the tool destructive.
    SharedUseAudience:
      type: string
      enum: [owner, people, team]
      description: >-
        Who may steer a Bot that uses a shared app's account: only the Bot's
        owner, the people, teams and directory groups named, or everyone in
        the organization (team).
    SharedUseMember:
      type: object
      description: One person, team or directory group an audience names.
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [user, group, team]
        value:
          type: string
          description: The person's id, the team's id, or the directory group's name.
    SharedUseApproval:
      type: object
      description: >-
        An audience for a Bot's use of a shared app's account: who may steer
        the Bot there, and whether a run started by outside input (an email, a
        webhook) may use the account too.
      required: [audience, outsideInput, members]
      properties:
        audience:
          $ref: '#/components/schemas/SharedUseAudience'
        outsideInput:
          type: boolean
          description: Whether runs started by outside input are covered.
        members:
          type: array
          description: The people, teams and groups named, when the audience is people. Empty otherwise.
          items:
            $ref: '#/components/schemas/SharedUseMember'
    SharedUseRequest:
      type: object
      description: >-
        A request that a Bot may use a shared app's one account, for the
        audience the Bot had when it was asked.
      required:
        - id
        - botId
        - botName
        - ownerUserId
        - serverId
        - title
        - proposed
        - current
        - reason
        - requestedBy
        - status
        - createdAt
      properties:
        id:
          type: string
          description: The request's id.
        botId:
          type: string
          description: The Bot asking.
        botName:
          type: string
          description: The Bot's name.
        ownerUserId:
          type: [string, 'null']
          description: The id of the Bot's owner. Null for a Bot that comes with OpenBot.
        serverId:
          type: string
          description: The shared app's id.
        title:
          type: string
          description: The shared app's name.
        proposed:
          $ref: '#/components/schemas/SharedUseApproval'
        current:
          description: What the Bot is approved for at the app now. Null when it has no approval.
          oneOf:
            - $ref: '#/components/schemas/SharedUseApproval'
            - type: 'null'
        reason:
          type: string
          enum: [publish, trigger, grant, refused_call]
          description: >-
            Why it was asked: the Bot was shared with more people (publish),
            given a way to start from outside input (trigger), given the app
            (grant), or refused a call to it (refused_call).
        requestedBy:
          type: string
          description: The id of the person who asked.
        status:
          type: string
          x-extensible-enum: [pending, approved, declined, superseded]
          description: >-
            pending until an administrator answers it. superseded when a later
            request for the same Bot and app replaced it.
        createdAt:
          type: string
          format: date-time
    SharedUseRequestPage:
      type: object
      required: [sharedUseRequests, nextCursor]
      properties:
        sharedUseRequests:
          type: array
          description: The waiting requests, newest first.
          items:
            $ref: '#/components/schemas/SharedUseRequest'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    CreateSharedUseRequestRequest:
      type: object
      additionalProperties: false
      required: [botId, serverId, reason]
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The Bot to ask for.
        serverId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The shared app's id. The Bot must already hold the app.
        reason:
          type: string
          enum: [publish, trigger]
          description: >-
            Why the Bot's audience grew: it was shared with more people
            (publish), or given a way to start from outside input (trigger).
    SharedUseRequestFiled:
      type: object
      required: [id, created]
      properties:
        id:
          type: string
          description: The id of the request now waiting.
        created:
          type: boolean
          description: >-
            True when this call filed it. False when a request for the same
            audience was already waiting, which is the one named.
    BotSharedApp:
      type: object
      description: One shared app a Bot holds, and whether its approval covers the Bot as it is now.
      required: [serverId, title, approval, needed, covered]
      properties:
        serverId:
          type: string
          description: The app's id.
        title:
          type: string
          description: The app's name.
        approval:
          description: What the Bot is approved for at the app. Null when it has no approval.
          oneOf:
            - $ref: '#/components/schemas/SharedUseApproval'
            - type: 'null'
        needed:
          $ref: '#/components/schemas/SharedUseApproval'
        covered:
          type: boolean
          description: Whether the approval covers what the Bot needs now.
    BotSharedUse:
      type: object
      required: [apps, pending]
      properties:
        apps:
          type: array
          description: The shared apps the Bot holds.
          items:
            $ref: '#/components/schemas/BotSharedApp'
        pending:
          type: array
          description: The Bot's requests still waiting for an administrator, newest first.
          items:
            $ref: '#/components/schemas/SharedUseRequest'
    HostAccessGrant:
      type: object
      description: >-
        One folder on a person's own computer that they gave a Bot. The
        folder's path stays in OpenBot Desktop and is never part of a grant.
      required: [id, botId, actorId, displayName, revoked]
      properties:
        id:
          type: string
          description: The grant's id.
        botId:
          type: string
          description: The Bot the folder was given to.
        actorId:
          type: string
          description: The id of the person who gave it.
        displayName:
          type: string
          description: The folder's name, as the person sees it.
        revoked:
          type: boolean
          description: Whether the grant has ended. An ended grant stays listed until the server restarts.
    HostAccessOperationKind:
      type: string
      enum:
        - choose_folder
        - list_files
        - read_file
        - write_file
        - run_command
        - cancel
        - stop
      description: What OpenBot Desktop is asked to do on the person's computer.
    HostAccessOperation:
      type: object
      description: >-
        Something OpenBot Desktop has been asked to do for a Bot and has not
        answered yet.
      required: [operationId, kind, botId, actorId]
      properties:
        operationId:
          type: string
          description: The operation's id.
        targetOperationId:
          type: string
          description: For a cancel, the operation it cancels.
        kind:
          $ref: '#/components/schemas/HostAccessOperationKind'
        botId:
          type: string
          description: The Bot it is for. `*` for a stop, which is for every Bot.
        actorId:
          type: string
          description: The id of the person whose computer it is.
        grantId:
          type: string
          description: The folder grant it works in.
        botName:
          type: string
          description: The Bot's name, as the folder chooser shows it.
        relativePath:
          type: string
          description: The file or folder inside the grant, for a list, read or write.
        content:
          type: string
          description: The text to write, for a write.
        command:
          type: string
          description: The command to run.
        writable:
          type: boolean
          description: Whether the folder is asked for with permission to change files.
        commandPolicy:
          type: string
          enum: [ask, allow, never]
          description: For a command, what the person's rules say about running it.
        expiresAt:
          type: integer
          description: When the operation runs out of time, in milliseconds since the Unix epoch.
    HostAccess:
      type: object
      description: A person's folder access on their own computer.
      required: [connected, desktop, grants, pending]
      properties:
        connected:
          type: boolean
          description: Whether OpenBot Desktop is connected now.
        desktop:
          type: boolean
          description: >-
            Whether this OpenBot runs in OpenBot Desktop, the only thing that
            can open folders on the person's computer.
        grants:
          type: array
          description: The folders the person gave their Bots since the server started.
          items:
            $ref: '#/components/schemas/HostAccessGrant'
        pending:
          type: array
          description: What OpenBot Desktop has been asked to do for the person and has not answered.
          items:
            $ref: '#/components/schemas/HostAccessOperation'
    CreateHostAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [botId]
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The Bot to give a folder to.
  responses:
    ApprovalsOwnOnly:
      description: >-
        The caller asked about somebody else's approvals, questions,
        preferences or rules, which only that person may read or change: an
        administrator can't either.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can see or answer what their Bots are waiting on.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    ApprovalsForbidden:
      description: >-
        The caller asked about somebody else's, or an administrator hasn't
        turned Custom rules on for them, which saving a rule or a preference
        of their own needs.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can see or answer what their Bots are waiting on.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            customRules:
              value:
                type: https://open.bot/errors/capability-required
