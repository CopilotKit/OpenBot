# Approvals and governance: approvals and questions, approval rules and settings, reviewer guidance,
# boundaries, what-if, shared app accounts and folder access.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/people/{personId}/approvals:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List a person's approvals
      description: >-
        Return one page of the actions a person's Bots asked them about before
        running: the ones still waiting, and the recent ones already decided,
        newest first, up to the last hundred. What an action was called with is
        cut short for showing, with values that look like secrets masked. Only
        the person themselves may read them. A missing cursor starts at the
        first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [approvals:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of approvals.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
              examples:
                waiting:
                  $ref: '#/components/examples/ApprovalPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/approvals/{approvalId}/decide:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/ApprovalId'
    post:
      tags: [Approvals]
      operationId: decideApproval
      summary: Decide an approval
      description: >-
        Answer one waiting action: allow it once, for the rest of its
        conversation, or always; deny it; or, for an action handed to the
        person, say they did it themselves. An allowed action runs once and its
        conversation carries on. Always allowing saves a rule of the person's
        own, which needs the Custom rules switch. An action the organization set
        to ask every time, or one a task started from a check-in asked about,
        takes allow_once or deny only. An approval already decided is refused.
        Recorded on the audit trail. Only the person themselves may decide it.
      security:
        - webSession: []
        - appOAuth: [approvals:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideApprovalRequest'
            examples:
              allowOnce:
                value:
                  decision: allow_once
      responses:
        '200':
          description: The approval, as decided.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              examples:
                allowedOnce:
                  $ref: '#/components/examples/ApprovalDecidedExample'
        '400':
          $ref: '#/components/responses/ApprovalRefused'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsForbidden'
        '404':
          $ref: '#/components/responses/ApprovalNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/questions:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Approvals]
      operationId: listQuestions
      summary: List the questions a person's Bots asked
      description: >-
        Return one page of the questions a person's Bots asked them and still
        wait on, newest first, up to the last hundred. Only the person
        themselves may read them. A missing cursor starts at the first page and
        nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [approvals:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of questions.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
              examples:
                waiting:
                  $ref: '#/components/examples/QuestionPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/questions/{questionId}/respond:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [Approvals]
      operationId: respondToQuestion
      summary: Answer a Bot's question
      description: >-
        Answer a question a Bot asked, so the work that asked carries on with
        the answer. Sent from the open conversation (inConversation), a question
        the person's own turn asked is closed and that conversation runs the
        answer as its next turn: continueHere says which happened. A question
        already answered is refused. Only the person themselves may answer it.
      security:
        - webSession: []
        - appOAuth: [approvals:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondToQuestionRequest'
            examples:
              answer:
                value:
                  response: Q4, please.
      responses:
        '200':
          description: The question was answered.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionAnswer'
              examples:
                queued:
                  $ref: '#/components/examples/QuestionAnswerExample'
        '400':
          $ref: '#/components/responses/ApprovalRefused'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/questions/{questionId}/dismiss:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [Approvals]
      operationId: dismissQuestion
      summary: Put a Bot's question down unanswered
      description: >-
        Stop a question waiting on the person without answering it. The work
        that asked has already ended, so nothing is carried on and the Bot is
        told nothing. Only the person themselves may dismiss it.
      security:
        - webSession: []
        - appOAuth: [approvals:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The question no longer waits.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/approval-preferences:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Approvals]
      operationId: getApprovalPreferences
      summary: Read a person's approval preferences
      description: >-
        Return what a person set for themselves about asking: whether their Bots
        ask before making changes, whether the reviewer decides what is safe,
        and commands on their own computer, with that last one as it applies
        after the organization's limit. A person who never chose reads the
        defaults. Only the person themselves may read them.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [approvals:read]
        - apiKey: []
      responses:
        '200':
          description: The person's approval preferences.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPreferences'
              examples:
                asks:
                  $ref: '#/components/examples/ApprovalPreferencesExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    patch:
      tags: [Approvals]
      operationId: updateApprovalPreferences
      summary: Change a person's approval preferences
      description: >-
        Change the preferences sent and keep the rest. At least one is required.
        Turning asking off closes the approvals that were only waiting because
        of it, and their conversations carry on. Recorded on the audit trail.
        Needs the Custom rules switch. Only the person themselves may change
        them.
      security:
        - webSession: []
        - appOAuth: [approvals:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApprovalPreferencesRequest'
            examples:
              askFirst:
                value:
                  enabled: true
      responses:
        '200':
          description: Every approval preference, as saved.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPreferences'
              examples:
                asks:
                  $ref: '#/components/examples/ApprovalPreferencesExample'
        '400':
          $ref: '#/components/responses/ApprovalRefused'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsForbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/approval-rules:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Approvals]
      operationId: listPersonApprovalRules
      summary: List a person's own approval rules
      description: >-
        Return one page of the rules a person saved for their own Bots' actions,
        newest first. The organization's rules (listApprovalRules) come ahead of
        them. Only the person themselves may read them. A missing cursor starts
        at the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [approvals:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the person's rules.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonApprovalRulePage'
              examples:
                one:
                  $ref: '#/components/examples/PersonApprovalRulePageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Approvals]
      operationId: createPersonApprovalRule
      summary: Save an approval rule of a person's own
      description: >-
        Save a rule for the person's own Bots: which Bot, tool, effect and
        target it covers, each an exact value or a pattern, and what happens to
        an action it covers. A rule that allows closes the approvals it now
        covers that were only waiting on the person, and their conversations
        carry on. Recorded on the audit trail. Needs the Custom rules switch,
        and is refused while the organization has switched people's own rules
        off. Only the person themselves may save one.
      security:
        - webSession: []
        - appOAuth: [approvals:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRuleInput'
            examples:
              allowGmail:
                value:
                  toolRef: mcp/gmail/send_email
                  behaviour: allow
      responses:
        '201':
          description: The rule was saved.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            Location:
              description: The new rule's address.
              schema:
                type: string
              example: /api/v2/organizations/default/people/me/approval-rules/1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonApprovalRule'
              examples:
                saved:
                  $ref: '#/components/examples/PersonApprovalRuleExample'
        '400':
          $ref: '#/components/responses/ApprovalRefused'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsForbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/approval-rules/{approvalRuleId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/ApprovalRuleId'
    patch:
      tags: [Approvals]
      operationId: updatePersonApprovalRule
      summary: Change an approval rule of a person's own
      description: >-
        Change the fields sent on one of the person's own rules and keep the
        rest. At least one is required. Recorded on the audit trail. Needs the
        Custom rules switch, and is refused while the organization has switched
        people's own rules off. Only the person themselves may change it.
      security:
        - webSession: []
        - appOAuth: [approvals:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRuleChange'
            examples:
              ask:
                value:
                  behaviour: ask
      responses:
        '200':
          description: The rule, as saved.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonApprovalRule'
              examples:
                saved:
                  $ref: '#/components/examples/PersonApprovalRuleExample'
        '400':
          $ref: '#/components/responses/ApprovalRefused'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsForbidden'
        '404':
          $ref: '#/components/responses/ApprovalRuleNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    delete:
      tags: [Approvals]
      operationId: deletePersonApprovalRule
      summary: Remove an approval rule of a person's own
      description: >-
        Remove one of the person's own rules, so the actions it covered are
        decided without it. Recorded on the audit trail. Only the person
        themselves may remove it.
      security:
        - webSession: []
        - appOAuth: [approvals:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The rule was removed.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: '#/components/responses/ApprovalRuleNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/conversation-grants:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Approvals]
      operationId: listConversationGrants
      summary: List what a person allowed for a conversation
      description: >-
        Return one page of the person's "Allow for this conversation" answers
        still in force, in every conversation, newest first, up to the last
        hundred. One ends when the person turns it off or deletes its
        conversation. Only the person themselves may read them. A missing cursor
        starts at the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [approvals:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of conversation approvals.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationGrantPage'
              examples:
                one:
                  $ref: '#/components/examples/ConversationGrantPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/conversation-grants/{conversationGrantId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/ConversationGrantId'
    delete:
      tags: [Approvals]
      operationId: deleteConversationGrant
      summary: Turn off what a person allowed for a conversation
      description: >-
        Turn off one "Allow for this conversation", so the next such action in
        that conversation asks again. Recorded on the audit trail. Only the
        person themselves may turn it off.
      security:
        - webSession: []
        - appOAuth: [approvals:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: It was turned off.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: '#/components/responses/ConversationGrantNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/approval-modes/{conversationId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/ApprovalConversationId'
    get:
      tags: [Approvals]
      operationId: getApprovalMode
      summary: Read how a conversation asks
      description: >-
        Say whether one of the person's conversations asks before every step,
        which the conversation of a task started from a check-in does, whatever
        the person's rules say. A client asks before it sends a Bot's look at a
        page straight to the computer. Anybody else's conversation, and one that
        does not exist, reads as one that does not. Only the person themselves
        may ask.
      security:
        - webSession: []
        - appOAuth: [approvals:read]
        - apiKey: []
      responses:
        '200':
          description: How the conversation asks.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalMode'
              examples:
                ordinary:
                  $ref: '#/components/examples/ApprovalModeExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalsOwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
