    delete:
      tags: [Models]
      operationId: deletePersonalAiConnection
      summary: Remove a person's own AI connection
      description: >-
        Stop a person's runs using their own AI, and revoke every key kept
        for them. With several connections of their own
        (listPersonalAiConnections) it removes all of them, not only the
        default; removePersonalAiConnection removes one. Their next run uses
        the organization's AI where it has one;
        where it has none and an AI is required, they connect one again before
