      description: >-
        Finish a sign-in whose finish is code: send the code the provider's
        page showed the person once they approved it. OpenBot hands it to the
        provider at once and answers where the sign-in stands: approved, with
        what the provider handed back kept for the person and never in this
        answer, or failed with detail saying why in OpenBot's own words. A
