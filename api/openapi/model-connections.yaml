  /api/v2/organizations/{organizationId}/ai-connection-sign-ins/{signInId}/code:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SignInId'
    post:
      tags: [Models]
      operationId: finishAiSignIn
      summary: Finish the organization's sign-in with the provider's code
      description: >-
        Finish a sign-in for the organization whose finish is code, as
        finishPersonalAiSignIn does. Only an administrator of the
        organization may finish it.
      security:
        - webSession: []
        - appOAuth: [ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSignInCodeInput'
            examples:
              claude:
                value:
                  code: Zm9vYmFyLWNvZGU#c3RhdGUtZXhhbXBsZQ
      responses:
        '200':
          description: Where the sign-in stands. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSignInStatus'
              examples:
                approved:
                  $ref: '#/components/examples/AiSignInClaudeApprovedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/AiSignInNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/ai-connections:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Models]
      operationId: listPersonalAiConnections
      summary: List a person's own AI connections
      description: >-
        Return one page of the AI connections a person connected for
        themselves, one per provider, never a key. They are theirs alone, as
        getPersonalAiConnection describes, and a person's runs use them ahead
        of the organization's: a person with any of their own never runs on
        the organization's. A run with no pick uses the one that isDefault;
        connections can exist with none the default, as listAiConnections
        describes. signIns names the providers the server signs the person in
        to itself. Only the person themselves may list them, and only where
        available is true. A missing cursor starts at the first page and
        nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [personal-ai-connection:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the person's own AI connections. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnectionPage'
              examples:
                two:
                  $ref: '#/components/examples/AiConnectionPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/PersonNotFound'
        '409':
          $ref: '#/components/responses/PersonalAiConnectionUnavailable'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Models]
      operationId: connectPersonalAiConnection
      summary: Connect an AI provider of a person's own
      description: >-
        Connect one more AI provider for a person, beside the ones they
        already connected, as connectAiConnection does for the organization:
        checked with the provider first, one connection per provider, a
        provider already connected replaced with its id kept, and the first
        one the default. A plan or a provider sign-in is accepted once the
        person signed in to it through OpenBot (startPersonalAiSignIn). The
        key is kept for the person alone, never in the organization's vault,
        and never sent back. Recorded on the audit trail, never with a key.
        Only the person themselves may connect one, and only where available
        is true.
      security:
        - webSession: []
        - appOAuth: [personal-ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiConnectionInput'
            examples:
              chatgptPlan:
                value:
                  provider: openai
                  login: plan
      responses:
        '201':
          description: The connection, as saved. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnectionEntry'
              examples:
                connected:
                  $ref: '#/components/examples/AiConnectionEntryExample'
        '400':
          $ref: '#/components/responses/InvalidAiConnection'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/PersonNotFound'
        '409':
          $ref: '#/components/responses/PersonalAiConnectionUnavailable'
        '422':
          $ref: '#/components/responses/AiConnectionRefused'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/ai-connections/{connectionId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/AiConnectionId'
    delete:
      tags: [Models]
      operationId: removePersonalAiConnection
      summary: Remove one of a person's own AI connections
      description: >-
        Stop a person's runs using one of their own AI connections and revoke
        its key or sign-in, as removeAiConnection does for the organization:
        picks on it stop applying, and the default moves as removeAiConnection
        says: to the one left, when exactly one is left. Removing their last one sends
        their runs back to the organization's AI. Recorded on the audit
        trail. Only the person themselves may remove one.
      security:
        - webSession: []
        - appOAuth: [personal-ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The connection was removed.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: '#/components/responses/AiConnectionNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/ai-connections/{connectionId}/make-default:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/AiConnectionId'
    post:
      tags: [Models]
      operationId: makePersonalAiConnectionDefault
      summary: Make one of a person's own AI connections the default
      description: >-
        Make the person's runs with no pick use this connection of their own,
        as makeAiConnectionDefault does for the organization. A connection
        that can't run now is refused. Only the person themselves may change
        it.
      security:
        - webSession: []
        - appOAuth: [personal-ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The connection, now the default. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnectionEntry'
              examples:
                default:
                  $ref: '#/components/examples/AiConnectionEntryExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: '#/components/responses/AiConnectionNotFound'
        '409':
          $ref: '#/components/responses/AiConnectionNotReady'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  parameters:
    AiConnectionId:
      name: connectionId
      in: path
      required: true
      description: The AI connection's id, as listAiConnections or listPersonalAiConnections gave it. Opaque.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9_.:-]+$
    SignInId:
      name: signInId
      in: path
      required: true
      description: The sign-in's id, as startPersonalAiSignIn gave it.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: ^[A-Za-z0-9_-]+$
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: The credential's id.
      schema:
        type: string
        format: uuid
      example: 3b9a5f8e-6c1d-4e2a-9f47-1d2c3b4a5e6f
    ModelCatalogueView:
      name: view
      in: query
      description: >-
        offered, the default: the models people may pick, narrowed to the
        ones an administrator allowed. all: every model the provider or
        gateway lists, before that narrowing, for an administrator choosing
        which to allow. Only an administrator may ask for all.
      schema:
        type: string
        enum: [offered, all]
        default: offered
  schemas:
    CredentialKind:
      type: string
      description: >-
        What a credential is for. model: a key OpenBot's Bots call a model
        with. connector: an app's key. mcp: a token for an app's server.
        agent: a key for a company's own agent. mcp_oauth_client: the
        organization's registration with an app. mcp_user_token: one person's
        sign-in to an app, kept when they connected it.
      enum:
        - model
        - connector
        - agent
        - mcp
        - mcp_oauth_client
        - mcp_user_token
    Credential:
      type: object
      description: >-
        A credential in the organization's vault as the API shows it: what it
        is for and
        whether it is live. Never its secret, which only ever goes in.
      required: [id, kind, provider, keyId, metadata, createdAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CredentialKind'
        provider:
          type: string
          description: >-
            Who the secret is for: a model provider such as openai, an app, or
            an app's server.
        keyId:
          type: string
          description: >-
            The name it is kept under. A key holds one live credential at a
            time.
        metadata:
          type: object
          additionalProperties: true
          description: What was said about it when it was added. Never secret.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: When it was revoked. Null while it is live.
    CredentialPage:
      type: object
      required: [credentials, nextCursor]
      properties:
        credentials:
          type: array
          description: Oldest first, and by id among credentials added at the same moment.
          items:
            $ref: '#/components/schemas/Credential'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    CredentialInput:
      type: object
      additionalProperties: false
      required: [kind, provider, secret]
      properties:
        kind:
          type: string
          description: >-
            model, connector, mcp or mcp_oauth_client. mcp_oauth_client is the
            organization's own OAuth client for an app that connects with a
            server-to-server grant: provider is the app's slug in the app
            directory, keyId is server-to-server, metadata.clientId is the
            client's id and secret is the client's secret. The organization's
            app then connects with that client, and the app is offered to the
            organization once it is kept. The other kinds are written by what
            they belong to: an app's registration when it is added, a person's
            sign-in when they connect it.
          enum: [model, connector, mcp, mcp_oauth_client]
        provider:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: >-
            Who the secret is for: for a model key, the provider the Bots run
            on (getModelKey). Trimmed.
        keyId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: >-
            The name to keep it under. Required, except for a model key, which
            is filed under the name the Bots read (getModelKey). Trimmed.
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 1000
          description: What to say about it. Never secret. Empty when left out.
        secret:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: >-
            The secret itself. Encrypted before it is kept, and never sent
            back: no answer includes it, now or later.
    ModelKey:
      type: object
      description: >-
        Where OpenBot's own Bots find their model key in the vault, and
        whether one is kept there. Never the key.
      required: [provider, keyId, set]
      properties:
        provider:
          type: string
          enum: [openai, anthropic]
          description: The provider the Bots run on.
        keyId:
          type: string
          description: The name the key is kept under.
        set:
          type: boolean
          description: Whether a live model key is kept under that name.
    ModelOption:
      type: object
      description: One model a Bot can run on.
      required: [id, label]
      properties:
        id:
          type: string
          description: What a run sends upstream.
        label:
          type: string
          description: What a model picker shows.
        vendor:
          type: string
          description: >-
            Who makes it, as a brand id such as openai or anthropic. Absent
            for a gateway's own alias, which names no maker.
        efforts:
          type: array
          description: >-
            How hard it can be asked to think, weakest first, such as none,
            minimal, low, medium, high, xhigh and max. Absent when it takes no
            effort, or nothing says which it takes.
          items:
            type: string
        defaultEffort:
          type: string
          description: The effort it thinks at when none is sent, when its provider says.
    ModelCatalogue:
      type: object
      description: The models Bots can run on, and which one a run uses by default.
      required: [provider, source, exposure, default, models, choosable, listed]
      properties:
        provider:
          type: string
          enum: [openai, anthropic]
          description: >-
            The provider prefix the model allowlist names models with
            (provider/model). Not who serves the models: that is source.
        source:
          type: string
          enum: [openai, anthropic, google, xai, gateway, chatgpt, claude]
          description: >-
            Who serves the models: a provider's own API, an OpenAI-compatible
            gateway in front of one, or a ChatGPT or Claude plan.
        exposure:
          type: string
          enum: [all, allowed]
          description: >-
            Who decides what people may pick. all: one person on their own
            machine, offered every model listed. allowed: a team, offered every
            model listed until an administrator narrows it with the model
            allowlist (on, with at least one model allowed).
        default:
          type: string
          description: What a run uses when nobody picked. Always one of models.
        models:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/ModelOption'
        choosable:
          type: boolean
          description: >-
            Whether people have anything to pick. False until an administrator
            allows a model in a team, or while the listing can't be read.
        listed:
          type: boolean
          description: >-
            Whether the listing was read. False means only the deployment's own
            model is known.
        connections:
          type: array
          description: >-
            Every AI connection the person's runs can use, each with its own
            models, the default first: their own connections where they have
            any, the organization's otherwise. The fields above describe the
            default connection. Absent from an OpenBot older than several
            connections; a client then offers the models above.
          items:
            $ref: '#/components/schemas/ModelCatalogueConnection'
    ModelCatalogueConnection:
      type: object
      description: >-
        One AI connection's models, as a person picks from them. Never a key
        or an address. For a member reading the organization's connections,
        login is null and a problem's detail says an administrator has to fix
        it.
      required: [id, owner, provider, login, source, isDefault, ready, problem, default, models, listed]
      properties:
        id:
          type: string
          description: The connection's id, as a pick names it (replaceModelChoice).
        owner:
          type: string
          x-extensible-enum: [personal, organization]
          description: >-
            Whose connection it is. personal: the person's own, which they fix
            themselves. organization: the organization's, which an
            administrator fixes.
        provider:
          $ref: '#/components/schemas/AiConnectionProviderAnswer'
        login:
          description: How OpenBot signs in to it. Null for a member reading the organization's.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionLogin'
            - type: 'null'
        source:
          type: string
          x-extensible-enum: [openai, anthropic, google, xai, gateway, chatgpt, claude]
          description: >-
            Who serves its models, as ModelCatalogue's source says it. What a
            Bot's default model is matched on.
        isDefault:
          type: boolean
          description: Whether a run with no pick uses it.
        ready:
          type: boolean
          description: Whether a run can use it now.
        problem:
          description: Why it can't run now. Null while ready.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionProblem'
            - type: 'null'
        default:
          type: string
          description: The model a run on it uses when nobody picked one. Always one of models.
        models:
          type: array
          description: Newest first, narrowed to what an administrator allowed.
          items:
            $ref: '#/components/schemas/ModelOption'
        listed:
          type: boolean
          description: Whether its listing was read.
    AiConnectionProblem:
      type: object
      description: Why an AI connection can't run now, in OpenBot's own words.
      required: [code, detail]
      properties:
        code:
          type: string
          x-extensible-enum: [sign-in-ended, key-refused, unreachable, no-key, no-default]
          description: >-
            sign-in-ended: the provider stopped renewing the sign-in, so it
            has to be signed in to again. key-refused: the provider refuses
            its key. unreachable: its address doesn't answer. no-key: its key
            is no longer kept. no-default: several connections are connected
            and none is the default, so a run with no pick has nothing to use
            until one is made default.
        detail:
          type: string
          description: One sentence a person reads, saying what to do.
    AiConnectionEntry:
      type: object
      description: One AI connection in a list. Never a key.
      required: [id, provider, login, model, endpointHost, isDefault, ready, problem, connectedAt]
      properties:
        id:
          type: string
          description: >-
            The connection's id. Opaque; clients never read anything into it.
            Unique within its list only: a person's own connection and the
            organization's may share an id, so a client says whose it means.
        provider:
          $ref: '#/components/schemas/AiConnectionProviderAnswer'
        login:
          $ref: '#/components/schemas/AiConnectionLogin'
        model:
          type: [string, 'null']
          description: The model named for an endpoint or a sign-in. Null for an API key or a plan.
        endpointHost:
          type: [string, 'null']
          description: The host of the endpoint's address, never its path or anything that signs in. Null unless the login is endpoint.
        isDefault:
          type: boolean
          description: Whether a run with no pick uses it.
        ready:
          type: boolean
          description: Whether a run can use it now.
        problem:
          description: Why it can't run now. Null while ready.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionProblem'
            - type: 'null'
        connectedAt:
          type: string
          format: date-time
          description: When it was connected or last changed.
        sharedSignIn:
          description: Whose plan or provider sign-in it shares, for an organization's connection on OpenBot Cloud. Null otherwise.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionSharedSignIn'
            - type: 'null'
    AiConnectionPage:
      type: object
      description: One page of AI connections, and the providers the server signs in to itself.
      required: [connections, nextCursor, signIns]
      properties:
        connections:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/AiConnectionEntry'
        nextCursor:
          type: [string, 'null']
          description: Where the next page starts. Null ends the list.
        signIns:
          type: array
          description: >-
            The providers the server can sign in to itself for whoever owns
            this list (startAiSignIn for the organization,
            startPersonalAiSignIn for a person). Every provider not listed
            connects with a key or an address.
          items:
            $ref: '#/components/schemas/AiConnectionProvider'
    ModelChoice:
      type: object
      description: >-
        The model and thinking effort a person chose for one conversation.
        Null model: the default model. Null effort: none is sent, so the model
        thinks on its own default.
      required: [model, effort]
      properties:
        model:
          type: [string, 'null']
        effort:
          type: [string, 'null']
        defaultModel:
          type: object
          description: The Bot default saved when the conversation was created. Absent when it follows the deployment default.
          required: [model, effort, source]
          properties:
            model:
              type: string
            effort:
              type: [string, 'null']
            source:
              type: string
        unverified:
          $ref: '#/components/schemas/UnverifiedModel'
        connection:
          type: [string, 'null']
          description: >-
            The AI connection the chosen model is on, by id. Null for the
            default connection. Absent from an OpenBot older than several
            connections.
        stopped:
          description: >-
            The connection the conversation's next run would use (the
            choice's, or the default with no choice) when it is connected but
            can't run now, and why; or, with no choice and no default, that a
            default has to be chosen (connection null, code no-default). Null
            when it can run. A client shows this after a refused run instead
            of reading the refusal's words.
          oneOf:
            - $ref: '#/components/schemas/StoppedAiConnection'
            - type: 'null'
    StoppedAiConnection:
      type: object
      description: >-
        Why a conversation's next run can't start: the connection it would use
        can't run now, or there is no default to use.
      required: [connection, problem]
      properties:
        connection:
          type: [string, 'null']
          description: The connection's id. Null when there is no default connection to name (no-default).
        problem:
          $ref: '#/components/schemas/AiConnectionProblem'
    UnverifiedModel:
      type: object
      description: >-
        The model a person chose for this conversation, set aside because it
        hasn't been checked to work with the client this Bot's harness
        ships. Runs answer on the default model until it has been. Absent when
        the choice is in use, or set aside for another reason.
      required: [model, label]
      properties:
        model:
          type: string
          description: The chosen model's id.
        label:
          type: string
          description: Its name, as a model picker shows it.
    ModelChoiceInput:
      type: object
      additionalProperties: false
      required: [model, effort]
      properties:
        model:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          pattern: \S
          description: A model the catalogue offers, or null for the default. Trimmed.
        effort:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
          pattern: \S
          description: >-
            An effort the model takes, or null for its own. Trimmed, and read
            in lower case.
        pinModel:
          type: boolean
          description: >-
            Keep an explicitly named model as an override even when it is the
            deployment's default. Omit to use the default as a reset.
        connection:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9_.:-]+$
          description: >-
            The AI connection the model is on, by id, one the catalogue lists
            in connections. Absent or null: the default connection.
    AiConnectionProvider:
      type: string
      description: >-
        The AI provider OpenBot's Bots run on. openai: OpenAI. anthropic:
        Anthropic. google: Google Gemini. xai: xAI. unbiased: Unbiased AI.
        trustedrouter: TrustedRouter. openai-compatible: any server that
        speaks OpenAI's API, at an address given.
      enum: [openai, anthropic, google, xai, unbiased, trustedrouter, openai-compatible]
    AiConnectionProviderAnswer:
      type: string
      x-extensible-enum: [openai, anthropic, google, xai, unbiased, trustedrouter, openai-compatible]
      description: >-
        The AI provider OpenBot's Bots run on, as the server answers it.
        openai: OpenAI. anthropic: Anthropic. google: Google Gemini. xai:
        xAI. unbiased: Unbiased AI. trustedrouter: TrustedRouter.
        openai-compatible: any server that speaks OpenAI's API, at an address
        given. The list can grow: a client shows a provider it doesn't know
        by its id. A request still names one of AiConnectionProvider.
    AiConnectionLogin:
      type: string
      description: >-
        How OpenBot signs in to the provider. plan: the person's Claude or
        ChatGPT plan (openai, anthropic). api-key: a key from the provider
        (openai, anthropic). endpoint: an address and, where it asks for one,
        a key (google, xai, unbiased, trustedrouter, openai-compatible).
        oauth: the person's Google or xAI sign-in (google, xai).
      enum: [plan, api-key, endpoint, oauth]
    AiConnectionSaved:
      type: object
      description: >-
        A connection with a key still kept in the vault, which can be used
        again without pasting the key (useSavedKey). Never the key.
      required: [provider, login, endpointHost]
      properties:
        provider:
          $ref: '#/components/schemas/AiConnectionProviderAnswer'
        login:
          $ref: '#/components/schemas/AiConnectionLogin'
        endpointHost:
          type: [string, 'null']
          description: The host of its address, for an endpoint. Null for an API key.
    AiConnection:
      type: object
      description: >-
        How OpenBot reaches its AI provider: who, how it signs in, and
        whether a run can use it now. Never a key.
      required:
        - provider
        - login
        - model
        - endpointHost
        - keySet
        - ready
        - source
        - editable
        - saved
        - changedAt
      properties:
        provider:
          description: The provider. Null while none is chosen yet.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionProviderAnswer'
            - type: 'null'
        login:
          description: How OpenBot signs in to it. Null while none is chosen yet.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionLogin'
            - type: 'null'
        model:
          type: [string, 'null']
          description: >-
            The model named for an endpoint or a sign-in. Null for an API key
            or a plan, where the model catalogue offers the provider's models.
        endpointHost:
          type: [string, 'null']
          description: >-
            The host of the endpoint's address, never its path, query or
            anything that signs in. Null unless the login is endpoint.
        keySet:
          type: boolean
          description: Whether a live key for this connection is kept in the vault.
        ready:
          type: boolean
          description: >-
            Whether a run can use it now: its key is kept, its sign-in can be
            read, or its plan's engine answers.
        source:
          type: string
          enum: [stored, environment, none]
          description: >-
            stored: set here, or carried over from how OpenBot was set up.
            environment: set by whoever runs OpenBot, in its configuration.
            none: nothing set yet.
        editable:
          type: boolean
          description: >-
            Whether an administrator can change it here. False where whoever
            runs OpenBot sets the provider: its key is changed in the vault.
        saved:
          type: array
          description: >-
            The connections with a key still kept in the vault, so a switch
            to one of them needs no key pasted.
          items:
            $ref: '#/components/schemas/AiConnectionSaved'
        changedAt:
          type: [string, 'null']
          format: date-time
          description: When it was last changed. Null if never.
        sharedSignIn:
          description: >-
            Whose plan or provider sign-in the organization's AI runs on, when
            an administrator shared their own on OpenBot Cloud. Null for a key,
            an address, a sign-in held on this computer, or none. A server
            older than this field leaves it out.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionSharedSignIn'
            - type: 'null'
    AiConnectionSharedSignIn:
      type: object
      description: The person whose own sign-in the organization's AI shares. Never a token.
      required: [personId, name, ready]
      properties:
        personId:
          type: string
          description: The person's id.
        name:
          type: string
          description: Their name as OpenBot shows it, or their email address where they have none.
        ready:
          type: boolean
          description: >-
            Whether their sign-in is still kept and can run a Bot. False once
            they removed it or the provider stopped renewing it.
    AiConnectionInput:
      type: object
      additionalProperties: false
      description: >-
        The connection to switch to. openai and anthropic take plan or
        api-key; google and xai take endpoint or oauth; unbiased,
        trustedrouter and openai-compatible take endpoint. Any other pair is
        refused.
      required: [provider, login]
      properties:
        provider:
          $ref: '#/components/schemas/AiConnectionProvider'
        login:
          $ref: '#/components/schemas/AiConnectionLogin'
        apiKey:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: >-
            The provider's key. Required for api-key unless useSavedKey;
            optional for an endpoint that asks for none. Encrypted into the
            vault before anything else, and never sent back: no answer
            includes it, now or later.
        useSavedKey:
          type: boolean
          description: >-
            Use the key already kept for this provider (and, for an endpoint,
            this address) instead of sending one.
        baseUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://[^@/?#]+([/?#].*)?$
          description: >-
            The endpoint's address, http or https, with nothing in it that
            signs in. Required for endpoint.
        model:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
          description: The model to run on. Required for endpoint and oauth. Trimmed.
    PersonalAiConnection:
      type: object
      description: >-
        A person's own AI connection, and which AI their runs use. Never a
        key. uses, required and available are the server's verdicts; a client
        renders them and never recomputes them.
      required: [connection, organization, uses, required, available, signIns]
      properties:
        connection:
          $ref: '#/components/schemas/AiConnection'
        organization:
          $ref: '#/components/schemas/OrganizationAiSummary'
        uses:
          type: string
          x-extensible-enum: [personal, organization, none]
          description: >-
            The AI the person's next run uses. personal: their own.
            organization: the organization's, which they have none of their
            own to put ahead of. none: neither, so Bots can't run for them yet.
        required:
          type: boolean
          description: >-
            Whether the person has to have an AI (their own or the
            organization's) before they use OpenBot. True on OpenBot Cloud,
            which brings no AI of its own: while uses is none, the apps send
            them to connect their own, and the server runs no Bot for them.
        available:
          type: boolean
          description: >-
            Whether the person can set an AI connection of their own here.
            False where the organization's AI is the only one.
        signIns:
          type: array
          description: >-
            The providers the server can sign the person in to itself
            (startPersonalAiSignIn): a ChatGPT plan (openai), a Claude plan
            (anthropic), Google and xAI sign-ins, and Unbiased AI, each where
            this server is set up for it. Each still connects with a key or an
            address too, and every provider not listed connects only that way.
          items:
            $ref: '#/components/schemas/AiConnectionProviderAnswer'
    OrganizationAiSummary:
      type: object
      description: >-
        Whether the organization has an AI for everyone in it, as a member may
        know it: never its key, its address or who set it.
      required: [ready, provider]
      properties:
        ready:
          type: boolean
          description: Whether the organization's AI can run a Bot now.
        provider:
          description: The organization's provider. Null while it has none.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionProviderAnswer'
            - type: 'null'
    AiSignInInput:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/AiConnectionProvider'
        method:
          type: string
          enum: [browser, device]
          description: >-
            How to sign in, for a provider that offers more than one way.
            openai: browser (the default) approves in the browser and
            finishes with the address ChatGPT sends the browser to; device
            shows a code to enter at ChatGPT instead, which works only once
            the person has turned on device code sign-in in ChatGPT's
            security settings. Every other provider has one way and ignores
            it.
        loopbackPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: >-
            anthropic only: the port OpenBot Desktop listens on, on the
            person's own computer, for Claude's redirect. Claude then sends
            the browser to http://localhost:{loopbackPort}/callback instead
            of a page that shows a code, and the app sends the code and state
            that arrive there (code#state) with finishPersonalAiSignIn, so
            the person copies nothing. Absent, Claude's page shows the code
            to copy. Every other provider ignores it.
    AiSignInCodeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: \S
          writeOnly: true
          description: >-
            What the person copied once they approved the sign-in: the code
            the provider's page showed (Claude), or the whole address the
            provider sent their browser to (ChatGPT). Trimmed. Never sent
            back.
    AiSignIn:
      type: object
      description: A sign-in to an AI provider, waiting for the person to approve it in their browser.
      required: [id, provider, url, userCode, expiresAt, interval, finish]
      properties:
        id:
          type: string
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: The sign-in's id, for reading where it stands.
        provider:
          $ref: '#/components/schemas/AiConnectionProviderAnswer'
        url:
          type: string
          format: uri
          description: The provider's page where the person approves the sign-in.
        userCode:
          type: [string, 'null']
          description: The code the provider's page shows, for the person to check. Null when it shows none.
        expiresAt:
          type: string
          format: date-time
          description: When the sign-in can no longer be approved.
        interval:
          type: integer
          minimum: 1
          maximum: 600
          description: How many seconds to wait between reads.
        finish:
          type: string
          x-extensible-enum: [poll, code]
          description: >-
            How the sign-in finishes. poll: read it (getPersonalAiSignIn)
            every interval seconds until it is approved, failed or expired.
            code: once the person approves it, the provider shows them a
            code (Claude) or sends their browser to an address that doesn't
            load (ChatGPT), and they send that code or address back with
            finishPersonalAiSignIn.
    AiSignInStatus:
      type: object
      description: Where a sign-in to an AI provider stands. Never a key.
      required: [id, provider, status, detail, interval]
      properties:
        id:
          type: string
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
        provider:
          $ref: '#/components/schemas/AiConnectionProviderAnswer'
        status:
          type: string
          x-extensible-enum: [pending, approved, failed, expired]
          description: >-
            pending: not approved yet. approved: what the provider handed
            OpenBot (a key, or a sign-in the server renews) is kept for the
            person. failed or expired: over; start another.
        detail:
          type: [string, 'null']
          description: Why it failed or expired, in OpenBot's own words. Null otherwise.
        interval:
          type: integer
          minimum: 1
          maximum: 600
          description: How many seconds to wait before reading it again, while it is pending.
  responses:
    PersonalAiConnectionUnavailable:
      description: >-
        A person can't set an AI connection of their own here (available is
        false): the organization's AI is the only one. Or the Idempotency-Key
        was already used for a different request.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            organizationOnly:
              value:
                type: https://open.bot/errors/personal-ai-connection-unavailable
                title: This OpenBot uses its organization's AI.
                status: 409
                detail: Bots here use your organization's AI. An admin changes it in Settings.
                code: PERSONAL_AI_CONNECTION_UNAVAILABLE
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    AiConnectionNotFound:
      description: >-
        No AI connection has that id here: it was never connected, was
        removed, or belongs to somebody else.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/ai-connection-not-found
                title: AI connection not found.
                status: 404
                detail: That AI connection isn't connected anymore.
                code: AI_CONNECTION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    AiConnectionNotReady:
      description: >-
        The AI connection can't run now (ready false), so it can't be the
        default. Or the Idempotency-Key was already used for a different
        request.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notReady:
              value:
                type: https://open.bot/errors/ai-connection-not-ready
                title: This AI connection can't run now.
                status: 409
                detail: Your Claude plan sign-in ended. Sign in again before you make it the default.
                code: AI_CONNECTION_NOT_READY
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    AiSignInNotFound:
      description: >-
        No sign-in has that id for this person: it was never started, was
        started by somebody else, or its id was changed.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/ai-sign-in-not-found
                title: Sign-in not found.
                status: 404
                detail: That sign-in isn't there. Sign in again.
                code: AI_SIGN_IN_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidCredential:
      description: >-
        A field is missing or out of bounds, a connector or app token was sent
        without a key id, or a name or a note holds text that can't be kept.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            invalid:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Credential input is invalid.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    CredentialNotFound:
      description: >-
        No live credential has that id: it never existed or is revoked
        already. Or the organization does not exist.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/credential-not-found
                title: Credential not found.
                status: 404
                detail: Credential was not found or already revoked
                code: CREDENTIAL_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    CredentialsUnavailable:
      description: This OpenBot keeps no vault.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            noVault:
              value:
                type: https://open.bot/errors/service-unavailable
                title: A service OpenBot depends on is unavailable.
                status: 503
                detail: Credential storage is not configured.
                code: SERVICE_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    ModelKeyNotFound:
      description: >-
        This OpenBot's Bots don't read a model key from the vault. Or the
        organization does not exist.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            none:
              value:
                type: https://open.bot/errors/model-key-not-found
                title: Model key not found.
                status: 404
                detail: The Bots here don't read a model key from the vault.
                code: MODEL_KEY_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidModelChoice:
      description: >-
        The body is malformed, the model isn't one the catalogue offers, or
        the model can't think at that effort.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notOffered:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: That model isn't available. Pick another one.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            effort:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: That model can't think at that level. Pick another one.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    ModelChoiceForbidden:
      description: >-
        The conversation is somebody else's choice to make, an administrator
        turned choosing a model off, or the caller may not use Bots.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can choose the model for their conversations.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            turnedOff:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Choosing a model is turned off. Ask an admin to turn it on.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidAiConnection:
      description: >-
        The body is malformed, the provider doesn't take that login, the
        address isn't http or https or has something in it that signs in, or
        a key, an address or a model the login needs is missing.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            pair:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Google Gemini doesn't take a plan. Pick an API key or a sign-in.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            keyMissing:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Paste a key, or use the saved key.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            credentialsInAddress:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Take the user name and password out of the address, and paste the key in its own field.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    AiConnectionFixed:
      description: >-
        Whoever runs this OpenBot sets its AI provider (editable is false), so
        it can't be changed here. Or the Idempotency-Key was already used for
        a different request.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            fixed:
              value:
                type: https://open.bot/errors/ai-connection-fixed
                title: The AI provider is set by whoever runs OpenBot.
                status: 409
                detail: This OpenBot's AI provider is set by whoever runs it. Change its key in the vault.
                code: AI_CONNECTION_FIXED
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    AiConnectionRefused:
      description: >-
        OpenBot checked the connection and can't use it, so nothing was saved
        and the connection in use keeps running. code says why:
        AI_CONNECTION_KEY_REFUSED, the provider didn't accept the key;
        AI_CONNECTION_UNREACHABLE, the address didn't answer;
        AI_CONNECTION_MODEL_UNAVAILABLE, the key can't use that model;
        AI_CONNECTION_SIGN_IN_MISSING, there's no sign-in to read;
        AI_CONNECTION_ENGINE_NOT_READY, the plan's engine isn't answering
        yet. detail is OpenBot's own sentence, naming the provider or the
        host, never what the provider said.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            keyRefused:
              value:
                type: https://open.bot/errors/ai-connection-refused
                title: OpenBot couldn't use that connection.
                status: 422
                detail: Anthropic didn't accept that key. Check it and paste it again.
                code: AI_CONNECTION_KEY_REFUSED
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            unreachable:
              value:
                type: https://open.bot/errors/ai-connection-refused
                title: OpenBot couldn't use that connection.
                status: 422
                detail: OpenBot couldn't reach api.example.com. Check the address.
                code: AI_CONNECTION_UNREACHABLE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            modelUnavailable:
              value:
                type: https://open.bot/errors/ai-connection-refused
                title: OpenBot couldn't use that connection.
