# Model connections: the vault of credentials, the Bots' model key, the model catalogue and each conversation's model choice.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/credentials:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List the credentials in the vault
      description: >-
        Return one page of the credentials the organization's vault keeps,
        live and revoked, oldest first. Each organization has its own vault,
        and another organization's credentials are never listed. A credential
        says what it is for and whether it is live, and never holds its
        secret: nothing in the API reads a secret back out. Only an
        administrator of the organization may list them. A missing cursor
        starts at the
        first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [credentials:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of credentials.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPage'
              examples:
                modelKey:
                  $ref: '#/components/examples/CredentialPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Credentials]
      operationId: createCredential
      summary: Add a credential to the vault
      description: >-
        Encrypt a secret and keep it in the organization's vault under one
        key: a kind, a
        provider and a key id. A key holds one live credential, so adding one
        for a key that already has one replaces it, and the one it replaces is
        revoked in the same write. A model key sent without a key id is filed
        under the name OpenBot's own Bots read (getModelKey). The secret is
        write-only: no answer includes it, now or later. Recorded on the audit
        trail. Only an administrator of the organization may add one.
      security:
        - webSession: []
        - appOAuth: [credentials:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInput'
            examples:
              modelKey:
                value:
                  kind: model
                  provider: openai
                  secret: sk-example
              serverToServerClient:
                value:
                  kind: mcp_oauth_client
                  provider: shopify
                  keyId: server-to-server
                  metadata:
                    clientId: example-client-id
                  secret: example-client-secret
      responses:
        '201':
          description: The credential, as kept. Never its secret.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                modelKey:
                  $ref: '#/components/examples/CredentialExample'
        '400':
          $ref: '#/components/responses/InvalidCredential'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/credentials/{credentialId}/revoke:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [Credentials]
      operationId: revokeCredential
      summary: Revoke a credential
      description: >-
        Stop a live credential being used, and keep its record. Nothing reads
        a revoked credential again. Recorded on the audit trail. Only an
        administrator of the organization may revoke one. One that does not
        exist, is in another organization's vault, or is revoked already, is
        not found.
      security:
        - webSession: []
        - appOAuth: [credentials:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The credential, revoked. Never its secret.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                revoked:
                  $ref: '#/components/examples/RevokedCredentialExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/CredentialNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/model-key:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Credentials]
      operationId: getModelKey
      summary: Read where the Bots find their model key
      description: >-
        Return the provider OpenBot's own Bots run on, the key id their model
        key is filed under in the organization's vault, and whether a live key
        is kept there. Never the key. A model key added without a key id is
        filed here. Only an administrator of the organization may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [credentials:read]
        - apiKey: []
      responses:
        '200':
          description: Where the Bots find their model key, and whether one is kept there.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelKey'
              examples:
                kept:
                  $ref: '#/components/examples/ModelKeyExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/ModelKeyNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/model-catalogue:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Models]
      operationId: getModelCatalogue
      summary: Read the models Bots can run on
      description: >-
        Return the models a person may pick for a conversation, with how hard
        each can think, the one a run uses when nobody picked, and who serves
        them. The models come from whatever serves OpenBot's model, the
        provider or a gateway in front of it, read in the background. They
        are narrowed for the caller in two ways. The organization's: only
        once an administrator turns on the model allowlist and allows at
        least one; an empty allowlist means every model. And the caller's
        teams': when any team they are in, or a team above one, lists models
        (getTeamModels), only the models one of those lists names, within
        what the organization allows. The default is then one of those when
        any can run, and nothing is left to pick when none can. With
        view=all, every
        model listed before either narrowing, for an administrator choosing
        which to allow. When the listing can't be read, the catalogue holds
        the deployment's own model and nothing to pick. Where several AI
        connections are connected, connections lists each with its own
        models, and the fields beside it describe the default connection.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [model-catalogue:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ModelCatalogueView'
      responses:
        '200':
          description: The models Bots can run on.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogue'
              examples:
                offered:
                  $ref: '#/components/examples/ModelCatalogueExample'
                connections:
                  $ref: '#/components/examples/ModelCatalogueConnectionsExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/model-choices/{conversationId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
    get:
      tags: [Models]
      operationId: getModelChoice
      summary: Read the model a person chose for a conversation
      description: >-
        Return the model and thinking effort a person chose for one of their
        conversations, each null for the default. Null too while the choice
        can't be used: the model is no longer offered, or the deployment moved
        to another provider. The choice is kept for when it can be used again.
        Where several AI connections are connected, connection names the one
        the model is on, and a connection that was removed is a choice that
        can't be used. Only the person themselves may read it.
      security:
        - webSession: []
        - appOAuth: [model-choices:read]
        - apiKey: []
      responses:
        '200':
          description: The person's choice, as a run in the conversation reads it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelChoice'
              examples:
                chosen:
                  $ref: '#/components/examples/ModelChoiceExample'
                onConnection:
                  $ref: '#/components/examples/ModelChoiceOnConnectionExample'
                noDefault:
                  $ref: '#/components/examples/ModelChoiceNoDefaultExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    put:
      tags: [Models]
      operationId: replaceModelChoice
      summary: Choose the model for a conversation
      description: >-
        Set the model and thinking effort a person's runs in one of their
        conversations answer on, or null either to go back to the default. The
        model must be one the catalogue offers (getModelCatalogue), and the
        effort one that model takes. Every later run in the conversation reads
        it, from any device. Where several AI connections are connected,
        connection names the one the model is on, and the model must be one
        that connection offers; without it, the default connection. Changing
        the default connection never changes a choice. Only the person
        themselves may choose, and only while choosing a model is on.
      security:
        - webSession: []
        - appOAuth: [model-choices:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelChoiceInput'
            examples:
              chosen:
                value:
                  model: gpt-6.1-pro
                  effort: xhigh
              defaults:
                value:
                  model: null
                  effort: null
              onConnection:
                value:
                  model: claude-opus-5-5
                  effort: high
                  connection: anthropic
      responses:
        '200':
          description: The person's choice, as saved.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelChoice'
              examples:
                chosen:
                  $ref: '#/components/examples/ModelChoiceExample'
        '400':
          $ref: '#/components/responses/InvalidModelChoice'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ModelChoiceForbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/ai-connection:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Models]
      operationId: getAiConnection
      summary: Read how OpenBot reaches its AI provider
      description: >-
        Return the AI provider OpenBot's Bots run on, the way OpenBot signs in
        to it, the model or address host where one was named, and whether a
        run can use it now. Never a key. Also which other connections still
        have a key kept, so they can be used again without pasting it. Where
        whoever runs OpenBot sets the provider, editable is false and the
        connection can't be changed here. Where several AI connections are
        connected (listAiConnections), this is the default one. Only an
        administrator of the organization may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [ai-connection:read]
        - apiKey: []
      responses:
        '200':
          description: How OpenBot reaches its AI provider. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnection'
              examples:
                apiKey:
                  $ref: '#/components/examples/AiConnectionExample'
                endpoint:
                  $ref: '#/components/examples/AiConnectionEndpointExample'
                fixed:
                  $ref: '#/components/examples/AiConnectionFixedExample'
                none:
                  $ref: '#/components/examples/AiConnectionNoneExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    put:
      tags: [Models]
      operationId: replaceAiConnection
      summary: Change how OpenBot reaches its AI provider
      description: >-
        Switch the AI provider OpenBot's Bots run on, with no restart. OpenBot
        checks the connection with the provider first: a key, an address or a
        sign-in it can't use is refused, nothing is saved, and the connection
        in use keeps running. Once saved, the next run uses it, and runs
        already going finish on the one they started with. A key goes into
        the organization's vault and is never sent back; the key of the
        connection it replaces stays kept, so it can be used again (saved).
        Recorded on the audit trail, never with a key. Only an administrator
        of the organization may change it, and not where whoever runs OpenBot
        sets the provider. On OpenBot Cloud an administrator may also share
        their own plan (openai, anthropic) or provider sign-in (google, xai)
        as the organization's AI: send that login once they have signed in to
        the provider through OpenBot (startPersonalAiSignIn) and the sign-in
        is kept for them. Bots across the organization then run on that
        sign-in for everyone with no AI of their own, and sharedSignIn names
        whose it is. It stops working if that person removes their own
        sign-in; another administrator can switch it at any time. With
        several connections (listAiConnections) this changes the default: the
        connection saved becomes the default, in place of the provider's own
        connection where it already had one (its id stays the provider), and
        a default of another provider stays connected as one of the others,
        no longer the default.
      security:
        - webSession: []
        - appOAuth: [ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiConnectionInput'
            examples:
              apiKey:
                value:
                  provider: anthropic
                  login: api-key
                  apiKey: sk-ant-example
              savedKey:
                value:
                  provider: openai
                  login: api-key
                  useSavedKey: true
              endpoint:
                value:
                  provider: google
                  login: endpoint
                  apiKey: example-gemini-key
                  baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
                  model: gemini-3-pro
              signIn:
                value:
                  provider: xai
                  login: oauth
                  model: grok-5
              plan:
                value:
                  provider: anthropic
                  login: plan
      responses:
        '200':
          description: The connection, as saved and in use. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnection'
              examples:
                apiKey:
                  $ref: '#/components/examples/AiConnectionExample'
                endpoint:
                  $ref: '#/components/examples/AiConnectionEndpointExample'
                sharedPlan:
                  $ref: '#/components/examples/AiConnectionSharedPlanExample'
        '400':
          $ref: '#/components/responses/InvalidAiConnection'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/AiConnectionFixed'
        '422':
          $ref: '#/components/responses/AiConnectionRefused'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    delete:
      tags: [Models]
      operationId: deleteAiConnection
      summary: Disconnect OpenBot's AI provider
      description: >-
        Stop the organization's Bots using the AI connection in use, with no
        restart, and revoke the key it used. Runs already going finish on it.
        Keys still kept for other connections stay kept (saved), so a switch
        to one of them needs no key pasted. With several connections
        (listAiConnections) this disconnects the default only, and the others
        stay connected: where exactly one is left it becomes the default;
        where more are left none is, and a run with no model picked is
        refused until an administrator makes one the default
        (makeAiConnectionDefault). With no other connection the organization
        has no AI afterwards: on OpenBot Cloud a person's runs use their own
        AI where they connected one, and nobody else's run until an
        administrator connects another (replaceAiConnection). Disconnecting a
        connection that isn't there changes nothing. Recorded on the audit trail, never with a key.
        Only an administrator of the organization may disconnect it, and not
        where whoever runs OpenBot sets the provider.
      security:
        - webSession: []
        - appOAuth: [ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The connection after it was disconnected. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnection'
              examples:
                disconnected:
                  $ref: '#/components/examples/AiConnectionDisconnectedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/AiConnectionFixed'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/ai-connection:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    get:
      tags: [Models]
      operationId: getPersonalAiConnection
      summary: Read a person's own AI connection
      description: >-
        Return the AI connection a person set for themselves, never its key,
        and which AI their runs use: their own, the organization's, or none
        yet. On OpenBot Cloud each person brings their own AI, and it is
        theirs alone: it follows them into every organization they are in,
        no administrator can read or use it, and the organization's Bots
        never run on it for anybody else. Where an organization's AI is the
        only one (a self-hosted OpenBot, OpenBot Desktop on its own),
        available is false and the person's runs use the organization's.
        Where the person connected several of their own
        (listPersonalAiConnections), connection is the default one. Only the
        person themselves may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [personal-ai-connection:read]
        - apiKey: []
      responses:
        '200':
          description: The person's own AI connection, and which AI their runs use. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAiConnection'
              examples:
                own:
                  $ref: '#/components/examples/PersonalAiConnectionExample'
                organization:
                  $ref: '#/components/examples/PersonalAiConnectionOrganizationExample'
                none:
                  $ref: '#/components/examples/PersonalAiConnectionNoneExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/PersonNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    put:
      tags: [Models]
      operationId: replacePersonalAiConnection
      summary: Set a person's own AI connection
      description: >-
        Connect the AI a person's runs use, with their own key or an address,
        or a key a sign-in through OpenBot kept for them (useSavedKey). OpenBot
        checks the connection with the provider first: a key, an address or a
        model it can't use is refused and nothing is saved. Once saved, the
        person's next run uses it, ahead of the organization's. The key is
        encrypted and kept for the person alone, never in the organization's
        vault, and never sent back. A plan (openai, anthropic) or a provider
        sign-in (google, xai) is accepted only once the person has signed in
        to that provider through OpenBot (startPersonalAiSignIn) and the
        sign-in was approved: the server keeps that sign-in for them alone
        and renews it itself. Without one it is refused, since the server
        runs the person's Bots and can't use a sign-in held on a computer.
