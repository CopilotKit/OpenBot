  /api/v2/organizations/{organizationId}/ai-connections:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Models]
      operationId: listAiConnections
      summary: List the organization's AI connections
      description: >-
        Return one page of the AI connections the organization's Bots can
        run on, one per provider, never a key. A person picks a model from
        any of them for a conversation (replaceModelChoice with connection);
        a run with no pick uses the one that isDefault, which is the
        connection getAiConnection describes. When a removal leaves exactly
        one connection, it becomes the default. With more left and none the
        default (after an older app disconnected the default,
        deleteAiConnection), a run with no pick is refused with a stopped
        choice saying to choose a default (getModelChoice, no-default), and a
        run whose pick names a connection that is ready still runs. signIns
        names the providers the server signs in to for the organization itself
        (startAiSignIn): on OpenBot Cloud and a self-hosted OpenBot. OpenBot
        Desktop running its own OpenBot keeps its own plan sign-in, and its
        signIns is empty. Where whoever runs OpenBot
        sets the provider, the list holds that one connection and none can
        be added. Only an administrator of the organization may list them. A
        missing cursor starts at the first page and nextCursor null ends the
        list.
      security:
        - webSession: []
        - appOAuth: [ai-connection:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the organization's AI connections. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnectionPage'
              examples:
                two:
                  $ref: '#/components/examples/AiConnectionPageExample'
                noDefault:
                  $ref: '#/components/examples/AiConnectionPageNoDefaultExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Models]
      operationId: connectAiConnection
      summary: Connect an AI provider for the organization
      description: >-
        Connect one more AI provider the organization's Bots can run on,
        beside the ones already connected. OpenBot checks the connection with
        the provider first: a key, an address or a sign-in it can't use is
        refused and nothing is saved. Each provider has at most one
        connection: connecting a provider that already has one replaces it
        (a key replaced, a plan swapped for a key) and keeps its id, so
        conversations that picked it keep running on it. The first connection
        becomes the default; a later one does not (makeAiConnectionDefault).
        A key goes into the organization's vault and is never sent back. A
        plan or a provider sign-in is accepted once an administrator signed
        in to it for the organization (startAiSignIn). Recorded on the audit
        trail, never with a key. Only an administrator of the organization
        may connect one, and not where whoever runs OpenBot sets the
        provider.
      security:
        - webSession: []
        - appOAuth: [ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiConnectionInput'
            examples:
              apiKey:
                value:
                  provider: openai
                  login: api-key
                  apiKey: sk-example
              plan:
                value:
                  provider: anthropic
                  login: plan
      responses:
        '201':
          description: The connection, as saved. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnectionEntry'
              examples:
                connected:
                  $ref: '#/components/examples/AiConnectionEntryExample'
        '400':
          $ref: '#/components/responses/InvalidAiConnection'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/AiConnectionFixed'
        '422':
          $ref: '#/components/responses/AiConnectionRefused'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/ai-connections/{connectionId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AiConnectionId'
    delete:
      tags: [Models]
      operationId: removeAiConnection
      summary: Remove one of the organization's AI connections
      description: >-
        Stop the organization's Bots using one AI connection, with no
        restart, and revoke its key or sign-in. Runs already going finish on
        it. Conversations that picked it keep their pick, which stops
        applying: their next run uses the default. The server moves the
        default only when a removal leaves exactly one connection, which
        becomes the default. Removing the default with more than one left
        leaves the organization with no default until an administrator makes
        another one default (makeAiConnectionDefault), and a client that wants
        a particular one to take over makes it default first. Recorded on the
        audit trail, never with
        a key. Only an administrator of the organization may remove one, and
        not where whoever runs OpenBot sets the provider.
      security:
        - webSession: []
        - appOAuth: [ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The connection was removed.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/AiConnectionNotFound'
        '409':
          $ref: '#/components/responses/AiConnectionFixed'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/ai-connections/{connectionId}/make-default:
