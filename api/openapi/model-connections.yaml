# Model connections: the vault of credentials, the Bots' model key, the model catalogue and each conversation's model choice.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/credentials:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List the credentials in the vault
      description: >-
        Return one page of the credentials the organization's vault keeps,
        live and revoked, oldest first. Each organization has its own vault,
        and another organization's credentials are never listed. A credential
        says what it is for and whether it is live, and never holds its
        secret: nothing in the API reads a secret back out. Only an
        administrator of the organization may list them. A missing cursor
        starts at the
        first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [credentials:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of credentials.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPage'
              examples:
                modelKey:
                  $ref: '#/components/examples/CredentialPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Credentials]
      operationId: createCredential
      summary: Add a credential to the vault
      description: >-
        Encrypt a secret and keep it in the organization's vault under one
        key: a kind, a
        provider and a key id. A key holds one live credential, so adding one
        for a key that already has one replaces it, and the one it replaces is
        revoked in the same write. A model key sent without a key id is filed
        under the name OpenBot's own Bots read (getModelKey). The secret is
        write-only: no answer includes it, now or later. Recorded on the audit
        trail. Only an administrator of the organization may add one.
      security:
        - webSession: []
        - appOAuth: [credentials:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInput'
            examples:
              modelKey:
                value:
                  kind: model
                  provider: openai
                  secret: sk-example
      responses:
        '201':
          description: The credential, as kept. Never its secret.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                modelKey:
                  $ref: '#/components/examples/CredentialExample'
        '400':
          $ref: '#/components/responses/InvalidCredential'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/credentials/{credentialId}/revoke:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [Credentials]
      operationId: revokeCredential
      summary: Revoke a credential
      description: >-
        Stop a live credential being used, and keep its record. Nothing reads
        a revoked credential again. Recorded on the audit trail. Only an
        administrator of the organization may revoke one. One that does not
        exist, is in another organization's vault, or is revoked already, is
        not found.
      security:
        - webSession: []
        - appOAuth: [credentials:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The credential, revoked. Never its secret.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                revoked:
                  $ref: '#/components/examples/RevokedCredentialExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/CredentialNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/model-key:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Credentials]
      operationId: getModelKey
      summary: Read where the Bots find their model key
      description: >-
        Return the provider OpenBot's own Bots run on, the key id their model
        key is filed under in the organization's vault, and whether a live key
        is kept there. Never the key. A model key added without a key id is
        filed here. Only an administrator of the organization may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [credentials:read]
        - apiKey: []
      responses:
        '200':
          description: Where the Bots find their model key, and whether one is kept there.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelKey'
              examples:
                kept:
                  $ref: '#/components/examples/ModelKeyExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/ModelKeyNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/model-catalogue:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Models]
      operationId: getModelCatalogue
      summary: Read the models Bots can run on
      description: >-
        Return the models a person may pick for a conversation, with how hard
        each can think, the one a run uses when nobody picked, and who serves
        them. The models come from whatever serves OpenBot's model, the
        provider or a gateway in front of it, read in the background, and are
        narrowed to the ones an administrator allowed. With view=all, every
        model listed before that narrowing, for an administrator choosing
        which to allow. When the listing can't be read, the catalogue holds
        the deployment's own model and nothing to pick.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [model-catalogue:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ModelCatalogueView'
      responses:
        '200':
          description: The models Bots can run on.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogue'
              examples:
                offered:
                  $ref: '#/components/examples/ModelCatalogueExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/model-choices/{conversationId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: './common.yaml#/components/parameters/ConversationId'
    get:
      tags: [Models]
      operationId: getModelChoice
      summary: Read the model a person chose for a conversation
      description: >-
        Return the model and thinking effort a person chose for one of their
        conversations, each null for the default. Null too while the choice
        can't be used: the model is no longer offered, or the deployment moved
        to another provider. The choice is kept for when it can be used again.
        Only the person themselves may read it.
      security:
        - webSession: []
        - appOAuth: [model-choices:read]
        - apiKey: []
      responses:
        '200':
          description: The person's choice, as a run in the conversation reads it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelChoice'
              examples:
                chosen:
                  $ref: '#/components/examples/ModelChoiceExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    put:
      tags: [Models]
      operationId: replaceModelChoice
      summary: Choose the model for a conversation
      description: >-
        Set the model and thinking effort a person's runs in one of their
        conversations answer on, or null either to go back to the default. The
        model must be one the catalogue offers (getModelCatalogue), and the
        effort one that model takes. Every later run in the conversation reads
        it, from any device. Only the person themselves may choose, and only
        while choosing a model is on.
      security:
        - webSession: []
        - appOAuth: [model-choices:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelChoiceInput'
            examples:
              chosen:
                value:
                  model: gpt-6.1-pro
                  effort: xhigh
              defaults:
                value:
                  model: null
                  effort: null
      responses:
        '200':
          description: The person's choice, as saved.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelChoice'
              examples:
                chosen:
                  $ref: '#/components/examples/ModelChoiceExample'
        '400':
          $ref: '#/components/responses/InvalidModelChoice'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ModelChoiceForbidden'
        '404':
          $ref: './common.yaml#/components/responses/ConversationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/ai-connection:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Models]
      operationId: getAiConnection
      summary: Read how OpenBot reaches its AI provider
      description: >-
        Return the AI provider OpenBot's Bots run on, the way OpenBot signs in
        to it, the model or address host where one was named, and whether a
        run can use it now. Never a key. Also which other connections still
        have a key kept, so they can be used again without pasting it. Where
        whoever runs OpenBot sets the provider, editable is false and the
        connection can't be changed here. Only an administrator of the
        organization may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [ai-connection:read]
        - apiKey: []
      responses:
        '200':
          description: How OpenBot reaches its AI provider. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnection'
              examples:
                apiKey:
                  $ref: '#/components/examples/AiConnectionExample'
                endpoint:
                  $ref: '#/components/examples/AiConnectionEndpointExample'
                fixed:
                  $ref: '#/components/examples/AiConnectionFixedExample'
                none:
                  $ref: '#/components/examples/AiConnectionNoneExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    put:
      tags: [Models]
      operationId: replaceAiConnection
      summary: Change how OpenBot reaches its AI provider
      description: >-
        Switch the AI provider OpenBot's Bots run on, with no restart. OpenBot
        checks the connection with the provider first: a key, an address or a
        sign-in it can't use is refused, nothing is saved, and the connection
        in use keeps running. Once saved, the next run uses it, and runs
        already going finish on the one they started with. A key goes into
        the organization's vault and is never sent back; the key of the
        connection it replaces stays kept, so it can be used again (saved).
        Recorded on the audit trail, never with a key. Only an administrator
        of the organization may change it, and not where whoever runs OpenBot
        sets the provider.
      security:
        - webSession: []
        - appOAuth: [ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiConnectionInput'
            examples:
              apiKey:
                value:
                  provider: anthropic
                  login: api-key
                  apiKey: sk-ant-example
              savedKey:
                value:
                  provider: openai
                  login: api-key
                  useSavedKey: true
              endpoint:
                value:
                  provider: google
                  login: endpoint
                  apiKey: example-gemini-key
                  baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
                  model: gemini-3-pro
              signIn:
                value:
                  provider: xai
                  login: oauth
                  model: grok-5
              plan:
                value:
                  provider: anthropic
                  login: plan
      responses:
        '200':
          description: The connection, as saved and in use. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConnection'
              examples:
                apiKey:
                  $ref: '#/components/examples/AiConnectionExample'
                endpoint:
                  $ref: '#/components/examples/AiConnectionEndpointExample'
        '400':
          $ref: '#/components/responses/InvalidAiConnection'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/AiConnectionFixed'
        '422':
          $ref: '#/components/responses/AiConnectionRefused'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  parameters:
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: The credential's id.
      schema:
        type: string
        format: uuid
      example: 3b9a5f8e-6c1d-4e2a-9f47-1d2c3b4a5e6f
    ModelCatalogueView:
      name: view
      in: query
      description: >-
        offered, the default: the models people may pick, narrowed to the
        ones an administrator allowed. all: every model the provider or
        gateway lists, before that narrowing, for an administrator choosing
        which to allow. Only an administrator may ask for all.
      schema:
        type: string
        enum: [offered, all]
        default: offered
  schemas:
    CredentialKind:
      type: string
      description: >-
        What a credential is for. model: a key OpenBot's Bots call a model
        with. connector: an app's key. mcp: a token for an app's server.
        agent: a key for a company's own agent. mcp_oauth_client: the
        organization's registration with an app. mcp_user_token: one person's
        sign-in to an app, kept when they connected it.
      enum:
        - model
        - connector
        - agent
        - mcp
        - mcp_oauth_client
        - mcp_user_token
    Credential:
      type: object
      description: >-
        A credential in the organization's vault as the API shows it: what it
        is for and
        whether it is live. Never its secret, which only ever goes in.
      required: [id, kind, provider, keyId, metadata, createdAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CredentialKind'
        provider:
          type: string
          description: >-
            Who the secret is for: a model provider such as openai, an app, or
            an app's server.
        keyId:
          type: string
          description: >-
            The name it is kept under. A key holds one live credential at a
            time.
        metadata:
          type: object
          additionalProperties: true
          description: What was said about it when it was added. Never secret.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: When it was revoked. Null while it is live.
    CredentialPage:
      type: object
      required: [credentials, nextCursor]
      properties:
        credentials:
          type: array
          description: Oldest first, and by id among credentials added at the same moment.
          items:
            $ref: '#/components/schemas/Credential'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    CredentialInput:
      type: object
      additionalProperties: false
      required: [kind, provider, secret]
      properties:
        kind:
          type: string
          description: >-
            model, connector or mcp. The other kinds are written by what they
            belong to: an app's registration when it is added, a person's
            sign-in when they connect it.
          enum: [model, connector, mcp]
        provider:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: >-
            Who the secret is for: for a model key, the provider the Bots run
            on (getModelKey). Trimmed.
        keyId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: >-
            The name to keep it under. Required, except for a model key, which
            is filed under the name the Bots read (getModelKey). Trimmed.
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 1000
          description: What to say about it. Never secret. Empty when left out.
        secret:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: >-
            The secret itself. Encrypted before it is kept, and never sent
            back: no answer includes it, now or later.
    ModelKey:
      type: object
      description: >-
        Where OpenBot's own Bots find their model key in the vault, and
        whether one is kept there. Never the key.
      required: [provider, keyId, set]
      properties:
        provider:
          type: string
          enum: [openai, anthropic]
          description: The provider the Bots run on.
        keyId:
          type: string
          description: The name the key is kept under.
        set:
          type: boolean
          description: Whether a live model key is kept under that name.
    ModelOption:
      type: object
      description: One model a Bot can run on.
      required: [id, label]
      properties:
        id:
          type: string
          description: What a run sends upstream.
        label:
          type: string
          description: What a model picker shows.
        vendor:
          type: string
          description: >-
            Who makes it, as a brand id such as openai or anthropic. Absent
            for a gateway's own alias, which names no maker.
        efforts:
          type: array
          description: >-
            How hard it can be asked to think, weakest first, such as none,
            minimal, low, medium, high, xhigh and max. Absent when it takes no
            effort, or nothing says which it takes.
          items:
            type: string
        defaultEffort:
          type: string
          description: The effort it thinks at when none is sent, when its provider says.
    ModelCatalogue:
      type: object
      description: The models Bots can run on, and which one a run uses by default.
      required: [provider, source, exposure, default, models, choosable, listed]
      properties:
        provider:
          type: string
          enum: [openai, anthropic]
          description: >-
            The provider prefix the model allowlist names models with
            (provider/model). Not who serves the models: that is source.
        source:
          type: string
          enum: [openai, anthropic, google, xai, gateway, chatgpt, claude]
          description: >-
            Who serves the models: a provider's own API, an OpenAI-compatible
            gateway in front of one, or a ChatGPT or Claude plan.
        exposure:
          type: string
          enum: [all, allowed]
          description: >-
            Who decides what people may pick. all: one person on their own
            machine, offered every model listed. allowed: a team, offered the
            models an administrator allowed.
        default:
          type: string
          description: What a run uses when nobody picked. Always one of models.
        models:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/ModelOption'
        choosable:
          type: boolean
          description: >-
            Whether people have anything to pick. False until an administrator
            allows a model in a team, or while the listing can't be read.
        listed:
          type: boolean
          description: >-
            Whether the listing was read. False means only the deployment's own
            model is known.
    ModelChoice:
      type: object
      description: >-
        The model and thinking effort a person chose for one conversation.
        Null model: the default model. Null effort: none is sent, so the model
        thinks on its own default.
      required: [model, effort]
      properties:
        model:
          type: [string, 'null']
        effort:
          type: [string, 'null']
    ModelChoiceInput:
      type: object
      additionalProperties: false
      required: [model, effort]
      properties:
        model:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          pattern: \S
          description: A model the catalogue offers, or null for the default. Trimmed.
        effort:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
          pattern: \S
          description: >-
            An effort the model takes, or null for its own. Trimmed, and read
            in lower case.
    AiConnectionProvider:
      type: string
      description: >-
        The AI provider OpenBot's Bots run on. openai: OpenAI. anthropic:
        Anthropic. google: Google Gemini. xai: xAI. unbiased: Unbiased AI.
        openai-compatible: any server that speaks OpenAI's API, at an address
        given.
      enum: [openai, anthropic, google, xai, unbiased, openai-compatible]
    AiConnectionLogin:
      type: string
      description: >-
        How OpenBot signs in to the provider. plan: the person's Claude or
        ChatGPT plan (openai, anthropic). api-key: a key from the provider
        (openai, anthropic). endpoint: an address and, where it asks for one,
        a key (google, xai, unbiased, openai-compatible). oauth: the person's
        Google or xAI sign-in (google, xai).
      enum: [plan, api-key, endpoint, oauth]
    AiConnectionSaved:
      type: object
      description: >-
        A connection with a key still kept in the vault, which can be used
        again without pasting the key (useSavedKey). Never the key.
      required: [provider, login, endpointHost]
      properties:
        provider:
          $ref: '#/components/schemas/AiConnectionProvider'
        login:
          $ref: '#/components/schemas/AiConnectionLogin'
        endpointHost:
          type: [string, 'null']
          description: The host of its address, for an endpoint. Null for an API key.
    AiConnection:
      type: object
      description: >-
        How OpenBot reaches its AI provider: who, how it signs in, and
        whether a run can use it now. Never a key.
      required:
        - provider
        - login
        - model
        - endpointHost
        - keySet
        - ready
        - source
        - editable
        - saved
        - changedAt
      properties:
        provider:
          description: The provider. Null while none is chosen yet.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionProvider'
            - type: 'null'
        login:
          description: How OpenBot signs in to it. Null while none is chosen yet.
          oneOf:
            - $ref: '#/components/schemas/AiConnectionLogin'
            - type: 'null'
        model:
          type: [string, 'null']
          description: >-
            The model named for an endpoint or a sign-in. Null for an API key
            or a plan, where the model catalogue offers the provider's models.
        endpointHost:
          type: [string, 'null']
          description: >-
            The host of the endpoint's address, never its path, query or
            anything that signs in. Null unless the login is endpoint.
        keySet:
          type: boolean
          description: Whether a live key for this connection is kept in the vault.
        ready:
          type: boolean
          description: >-
            Whether a run can use it now: its key is kept, its sign-in can be
            read, or its plan's engine answers.
        source:
          type: string
          enum: [stored, environment, none]
          description: >-
            stored: set here, or carried over from how OpenBot was set up.
            environment: set by whoever runs OpenBot, in its configuration.
            none: nothing set yet.
        editable:
          type: boolean
          description: >-
            Whether an administrator can change it here. False where whoever
            runs OpenBot sets the provider: its key is changed in the vault.
        saved:
          type: array
          description: >-
            The connections with a key still kept in the vault, so a switch
            to one of them needs no key pasted.
          items:
            $ref: '#/components/schemas/AiConnectionSaved'
        changedAt:
          type: [string, 'null']
          format: date-time
          description: When it was last changed. Null if never.
    AiConnectionInput:
      type: object
      additionalProperties: false
      description: >-
        The connection to switch to. openai and anthropic take plan or
        api-key; google and xai take endpoint or oauth; unbiased and
        openai-compatible take endpoint. Any other pair is refused.
      required: [provider, login]
      properties:
        provider:
          $ref: '#/components/schemas/AiConnectionProvider'
        login:
          $ref: '#/components/schemas/AiConnectionLogin'
        apiKey:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: >-
            The provider's key. Required for api-key unless useSavedKey;
            optional for an endpoint that asks for none. Encrypted into the
            vault before anything else, and never sent back: no answer
            includes it, now or later.
        useSavedKey:
          type: boolean
          description: >-
            Use the key already kept for this provider (and, for an endpoint,
            this address) instead of sending one.
        baseUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://[^@/?#]+([/?#].*)?$
          description: >-
            The endpoint's address, http or https, with nothing in it that
            signs in. Required for endpoint.
        model:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
          description: The model to run on. Required for endpoint and oauth. Trimmed.
  responses:
    InvalidCredential:
      description: >-
        A field is missing or out of bounds, a connector or app token was sent
        without a key id, or a name or a note holds text that can't be kept.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            invalid:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Credential input is invalid.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    CredentialNotFound:
      description: >-
        No live credential has that id: it never existed or is revoked
        already. Or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/credential-not-found
                title: Credential not found.
                status: 404
                detail: Credential was not found or already revoked
                code: CREDENTIAL_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    CredentialsUnavailable:
      description: This OpenBot keeps no vault.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            noVault:
              value:
                type: https://open.bot/errors/service-unavailable
                title: A service OpenBot depends on is unavailable.
                status: 503
                detail: Credential storage is not configured.
                code: SERVICE_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    ModelKeyNotFound:
      description: >-
        This OpenBot's Bots don't read a model key from the vault. Or the
        organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            none:
              value:
                type: https://open.bot/errors/model-key-not-found
                title: Model key not found.
                status: 404
                detail: The Bots here don't read a model key from the vault.
                code: MODEL_KEY_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidModelChoice:
      description: >-
        The body is malformed, the model isn't one the catalogue offers, or
        the model can't think at that effort.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notOffered:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: That model isn't available. Pick another one.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            effort:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: That model can't think at that level. Pick another one.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    ModelChoiceForbidden:
      description: >-
        The conversation is somebody else's choice to make, an administrator
        turned choosing a model off, or the caller may not use Bots.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can choose the model for their conversations.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            turnedOff:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Choosing a model is turned off. Ask an admin to turn it on.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidAiConnection:
      description: >-
        The body is malformed, the provider doesn't take that login, the
        address isn't http or https or has something in it that signs in, or
        a key, an address or a model the login needs is missing.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            pair:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Google Gemini doesn't take a plan. Pick an API key or a sign-in.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            keyMissing:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Paste a key, or use the saved key.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            credentialsInAddress:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Take the user name and password out of the address, and paste the key in its own field.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    AiConnectionFixed:
      description: >-
        Whoever runs this OpenBot sets its AI provider (editable is false), so
        it can't be changed here. Or the Idempotency-Key was already used for
        a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            fixed:
              value:
                type: https://open.bot/errors/ai-connection-fixed
                title: The AI provider is set by whoever runs OpenBot.
                status: 409
                detail: This OpenBot's AI provider is set by whoever runs it. Change its key in the vault.
                code: AI_CONNECTION_FIXED
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    AiConnectionRefused:
      description: >-
        OpenBot checked the connection and can't use it, so nothing was saved
        and the connection in use keeps running. code says why:
        AI_CONNECTION_KEY_REFUSED, the provider didn't accept the key;
        AI_CONNECTION_UNREACHABLE, the address didn't answer;
        AI_CONNECTION_MODEL_UNAVAILABLE, the key can't use that model;
        AI_CONNECTION_SIGN_IN_MISSING, there's no sign-in to read;
        AI_CONNECTION_ENGINE_NOT_READY, the plan's engine isn't answering
        yet. detail is OpenBot's own sentence, naming the provider or the
        host, never what the provider said.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            keyRefused:
              value:
                type: https://open.bot/errors/ai-connection-refused
                title: OpenBot couldn't use that connection.
                status: 422
                detail: Anthropic didn't accept that key. Check it and paste it again.
                code: AI_CONNECTION_KEY_REFUSED
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            unreachable:
              value:
                type: https://open.bot/errors/ai-connection-refused
                title: OpenBot couldn't use that connection.
                status: 422
                detail: OpenBot couldn't reach api.example.com. Check the address.
                code: AI_CONNECTION_UNREACHABLE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            modelUnavailable:
              value:
                type: https://open.bot/errors/ai-connection-refused
                title: OpenBot couldn't use that connection.
                status: 422
                detail: That key can't use gemini-3-pro. Pick another model.
                code: AI_CONNECTION_MODEL_UNAVAILABLE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            signInMissing:
              value:
                type: https://open.bot/errors/ai-connection-refused
                title: OpenBot couldn't use that connection.
                status: 422
                detail: Sign in to Google first, then try again.
                code: AI_CONNECTION_SIGN_IN_MISSING
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            engineNotReady:
              value:
                type: https://open.bot/errors/ai-connection-refused
                title: OpenBot couldn't use that connection.
                status: 422
                detail: Claude hasn't started yet. Try again in a moment.
                code: AI_CONNECTION_ENGINE_NOT_READY
                category: validation
                retryable: true
                requestId: req_example
                traceId: trace_example
  examples:
    AiConnectionExample:
      summary: An Anthropic key, kept, with an OpenAI key still kept from before.
      value:
        provider: anthropic
        login: api-key
        model: null
        endpointHost: null
        keySet: true
        ready: true
        source: stored
        editable: true
        saved:
          - provider: openai
            login: api-key
            endpointHost: null
        changedAt: '2026-11-17T09:00:00.000Z'
    AiConnectionEndpointExample:
      summary: Google Gemini at its OpenAI-compatible address.
      value:
        provider: google
        login: endpoint
        model: gemini-3-pro
        endpointHost: generativelanguage.googleapis.com
        keySet: true
        ready: true
        source: stored
        editable: true
        saved:
          - provider: google
            login: endpoint
            endpointHost: generativelanguage.googleapis.com
        changedAt: '2026-11-17T09:00:00.000Z'
    AiConnectionFixedExample:
      summary: A team's OpenBot, where whoever runs it sets the provider.
      value:
        provider: openai
        login: api-key
        model: null
        endpointHost: null
        keySet: true
