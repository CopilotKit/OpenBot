        this changes their default: the connection saved becomes the default,
        in place of the provider's own connection where they already had one
        (its id stays the provider), and a default of another provider stays
        connected as one of the others, no longer the default.
        Recorded on the audit trail, never with a key. Only the person
        themselves may set it, and only where available is true.
