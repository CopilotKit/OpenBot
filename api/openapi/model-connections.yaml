  /api/v2/organizations/{organizationId}/people/{personId}/ai-connection/sign-ins:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    post:
      tags: [Models]
      operationId: startPersonalAiSignIn
      summary: Start signing in to an AI provider
      description: >-
        Start a sign-in to an AI provider that the server runs itself, for a
        provider PersonalAiConnection lists in signIns. The answer holds the
        address the person approves it at, in their browser, the code to
        check there where the provider shows one, and how it finishes. With
        finish poll, read the sign-in (getPersonalAiSignIn) every interval
        seconds until it is approved, failed or expired. With finish code,
        the person approves, copies the code Claude's page shows them or
        the address ChatGPT sends their browser to, and sends it back with
        finishPersonalAiSignIn. Inside OpenBot Desktop nobody copies
        anything: Desktop listens on the person's own computer for the
        provider's redirect and the app sends what arrives with
        finishPersonalAiSignIn. For Claude, loopbackPort names the port
        Desktop listens on; ChatGPT's browser sign-in always redirects to
        localhost:1455. Approved, what the
        provider handed OpenBot is kept for the person alone, never sent to
        the browser: an Unbiased AI key as a saved key (connect with
        useSavedKey), a Claude or ChatGPT plan's sign-in (connect with login
        plan), or a Google or xAI sign-in (connect with login oauth). The
        server renews a sign-in that expires itself. Only the person
        themselves may sign in, and only where available is true.
      security:
        - webSession: []
        - appOAuth: [personal-ai-connection:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSignInInput'
            examples:
              unbiased:
                value:
                  provider: unbiased
              chatgpt:
                value:
                  provider: openai
              chatgptWithACode:
                value:
                  provider: openai
                  method: device
              claude:
                value:
                  provider: anthropic
              claudeInDesktop:
                value:
                  provider: anthropic
                  loopbackPort: 53682
      responses:
        '201':
          description: The sign-in, waiting for the person to approve it.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSignIn'
              examples:
                waiting:
                  $ref: '#/components/examples/AiSignInExample'
                chatgpt:
                  $ref: '#/components/examples/AiSignInChatGptBrowserExample'
                chatgptWithACode:
                  $ref: '#/components/examples/AiSignInChatGptExample'
                claude:
                  $ref: '#/components/examples/AiSignInClaudeExample'
        '400':
          $ref: '#/components/responses/InvalidAiConnection'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/PersonNotFound'
        '409':
          $ref: '#/components/responses/PersonalAiConnectionUnavailable'
        '422':
          $ref: '#/components/responses/AiConnectionRefused'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/ai-connection/sign-ins/{signInId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
      - $ref: '#/components/parameters/SignInId'
    get:
      tags: [Models]
      operationId: getPersonalAiSignIn
      summary: Read a sign-in to an AI provider
      description: >-
        Ask the provider once whether the person approved the sign-in, and
        say where it stands. pending: not yet, read it again after interval
        seconds. approved: what the provider handed OpenBot is kept for the
        person, never in this answer. failed or expired: it is over, and
        detail says why in OpenBot's own words; start another. Reading it
        again after it is approved answers approved and asks the provider
        nothing. Only the person who started it may read it.
      security:
        - webSession: []
        - appOAuth: [personal-ai-connection:write]
        - apiKey: []
      responses:
        '200':
          description: Where the sign-in stands. Never a key.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSignInStatus'
              examples:
                pending:
                  $ref: '#/components/examples/AiSignInPendingExample'
                approved:
                  $ref: '#/components/examples/AiSignInApprovedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: '#/components/responses/AiSignInNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/ai-connection/sign-ins/{signInId}/code:
