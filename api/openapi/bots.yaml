# Bots: the Bots a person can see, and creating, changing and deleting them.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/bots:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Bots]
      operationId: listBots
      summary: List Bots
      description: >-
        Return one page of the Bots the caller can see: theirs, the ones shared
        with them, the ones assigned to them and the ones that come with
        OpenBot, oldest first, and by id among Bots made at the same moment.
        Somebody else's private Bot is never among them, an admin's list
        included. hidden=true lists only the Bots the caller hid from their own
        list instead. scope=organization lists every Bot in the organization,
        people's private Bots included, for an admin's screens that decide what
        Bots may hold; it is refused to anybody who is not an admin of the
        organization. Somebody else's private Bot comes withheld there: its
        name and avatar, and nothing from inside it (see the Bot's withheld).
        A missing cursor starts at the first page and nextCursor null ends the
        list.
      security:
        - webSession: []
        - appOAuth: [bots:read]
        - apiKey: []
      parameters:
        - name: hidden
          in: query
          description: List the Bots the caller hid instead of the ones they did not.
          schema:
            type: boolean
            default: false
        - name: scope
          in: query
          description: >-
            Whose Bots: caller, the Bots the caller can see; organization, every
            Bot in the organization, for an admin of it only.
          schema:
            type: string
            enum: [caller, organization]
            default: caller
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of Bots.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/BotPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Bots]
      operationId: createBot
      summary: Create a Bot
      description: >-
        Create a Bot owned by the caller. With no endpoint it runs inside
        OpenBot on its role description; with one, OpenBot sends each turn to
        that AG-UI address, which the server checks before saving. A key, when
        given, is stored encrypted and never returned. Asking for isolated
        needs the caller's Isolated Bots switch and a deployment that can give
        a Bot a computer of its own. A repeated request with the same
        Idempotency-Key and body returns the first result.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
            examples:
              builtIn:
                summary: A Bot that runs inside OpenBot.
                value:
                  name: Expense Review
                  title: Finance Operations
                  roleDescription: Review receipts, categorize expenses, and prepare reimbursement reports.
                  visibility: private
              ownAgent:
                summary: An agent somebody runs themselves, behind a key.
                value:
                  name: Expense Review
                  title: ''
                  roleDescription: Review receipts.
                  visibility: private
                  endpoint: https://agents.example.com/ag-ui
                  auth:
                    header: Authorization
                    value: Bearer example-key
                  harness: langgraph
      responses:
        '201':
          description: The Bot was created.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            Location:
              description: The new Bot's address.
              schema:
                type: string
              example: /api/v2/organizations/default/bots/agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                created:
                  $ref: '#/components/examples/CreatedBot'
        '400':
          $ref: '#/components/responses/InvalidBot'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    get:
      tags: [Bots]
      operationId: getBot
      summary: Read one Bot
      description: >-
        Return one Bot the caller can see. A Bot that does not exist, was
        deleted, or is private to somebody else is not found.
      security:
        - webSession: []
        - appOAuth: [bots:read]
        - apiKey: []
      responses:
        '200':
          description: The Bot.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                starter:
                  $ref: '#/components/examples/StarterBot'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    patch:
      tags: [Bots]
      operationId: updateBot
      summary: Change a Bot
      description: >-
        Replace a Bot's name, title, role description and visibility, which are
        all required, and change any optional field that is present. An absent
        endpoint, key, isolated or default model leaves that setting as it is, so an edit to
        a name never drops a key or moves a Bot between computers. Only whoever
        may manage the Bot may change it, and a Bot that comes with OpenBot
        cannot be changed. Making a Bot public reports what that means for the
        shared app accounts it uses.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotRequest'
            examples:
              rename:
                value:
                  name: Expense Review Desk
                  title: Finance Operations
                  roleDescription: Review receipts, categorize expenses, and prepare reimbursement reports.
                  visibility: private
      responses:
        '200':
          description: The changed Bot.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBotResponse'
              examples:
                renamed:
                  $ref: '#/components/examples/CreatedBot'
                published:
                  $ref: '#/components/examples/PublishedBot'
        '400':
          $ref: '#/components/responses/InvalidBot'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    delete:
      tags: [Bots]
      operationId: deleteBot
      summary: Delete a Bot
      description: >-
        Delete a Bot for everyone and retire its key. Conversations with it
        stay readable. Only whoever may manage the Bot may delete it, and a
        Bot that comes with OpenBot cannot be deleted. A Bot that is already
        deleted is not found.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The Bot was deleted.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/test-connection:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Bots]
      operationId: testBotConnection
      summary: Test a Bot's address
      description: >-
        Send one short run to an AG-UI address from where OpenBot's runs will
        reach it, before a Bot is saved with it, and say what came back. The
        address is checked as saving checks it, so this can't reach an address
        a Bot could not be saved with. A failed test is an answer, not an
        error: ok is false and reason says what went wrong in words a person
        can act on. An address this deployment runs is tried with the token
        its runs use. Nothing is saved.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotConnectionTestRequest'
            examples:
              withKey:
                value:
                  endpoint: https://agents.example.com/ag-ui
                  headers:
                    Authorization: Bearer example-key
      responses:
        '200':
          description: What the address answered, or why it couldn't be reached.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotConnectionTest'
              examples:
                answered:
                  $ref: '#/components/examples/BotConnectionAnswered'
                refused:
                  $ref: '#/components/examples/BotConnectionRefused'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/duplicate:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    post:
      tags: [Bots]
      operationId: duplicateBot
      summary: Duplicate a Bot
      description: >-
        Make a private copy of a Bot the caller can see, owned by the caller,
        with its address and its key. The copy keeps a computer of its own
        only when the caller may give it one. Needs the caller's Bots switch.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The copy.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            Location:
              description: The copy's address.
              schema:
                type: string
              example: /api/v2/organizations/default/bots/agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                copied:
                  $ref: '#/components/examples/CreatedBot'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/hide:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    post:
      tags: [Bots]
      operationId: hideBot
      summary: Hide a Bot from the caller's list
      description: >-
        Take a Bot the caller can see out of their own list, for them only;
        listBots with hidden=true lists it. Nobody else's list changes. Hiding
        a hidden Bot changes nothing.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The Bot, hidden.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                hidden:
                  $ref: '#/components/examples/CreatedBot'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: '#/components/responses/BotAssigned'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/unhide:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    post:
      tags: [Bots]
      operationId: unhideBot
      summary: Put a Bot back in the caller's list
      description: >-
        Put a Bot the caller hid back in their own list. Showing a Bot that is
        not hidden changes nothing.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The Bot, back in the list.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                shown:
                  $ref: '#/components/examples/CreatedBot'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/pin:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    post:
      tags: [Bots]
      operationId: pinBot
      summary: Pin a Bot to the top of the caller's list
      description: >-
        Pin a Bot the caller can see to the top of their own list, for them
        only. Pinning a pinned Bot changes nothing.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The Bot, pinned.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                pinned:
                  $ref: '#/components/examples/CreatedBot'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/unpin:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    post:
      tags: [Bots]
      operationId: unpinBot
      summary: Unpin a Bot
      description: >-
        Unpin a Bot from the top of the caller's own list. Unpinning a Bot
        that is not pinned changes nothing.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The Bot, unpinned.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                unpinned:
                  $ref: '#/components/examples/CreatedBot'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/issue-callback-token:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    post:
      tags: [Bots]
      operationId: issueBotCallbackToken
      summary: Issue a Bot's callback token
      description: >-
        Give a Bot a new credential for calling OpenBot's tools back, and
        return it this once: it is never returned again, and the audit trail
        records that one was issued, never what it is. Issuing one for a Bot
        that has one replaces it, which is how a leaked token is retired. Only
        whoever may manage the Bot may issue one.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The new token, shown once.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotCallbackToken'
              examples:
                issued:
                  $ref: '#/components/examples/BotCallbackTokenExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/revoke-callback-token:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    post:
      tags: [Bots]
      operationId: revokeBotCallbackToken
      summary: Revoke a Bot's callback token
      description: >-
        Take away a Bot's credential for calling OpenBot's tools back. It can
        still hold a conversation; it can't reach anything outside one. Only
        whoever may manage the Bot may revoke it. Revoking a token that is not
        there changes nothing.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The Bot, with no callback token.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                revoked:
                  $ref: '#/components/examples/CreatedBot'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/report-decline:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    post:
      tags: [Bots]
      operationId: reportBotDecline
      summary: Record that a Bot declined a request
      description: >-
        Put on the audit trail that a Bot declined something it was asked to
        do, in its own words. The Bot reports it through the conversation it
        is in, so the row says the Bot reported it itself: it is evidence of
        what the Bot is being asked, not a control, and a Bot that declines
        without reporting writes nothing. Only a Bot the caller can reach can
        be reported on.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotDeclineReport'
            examples:
              declined:
                value:
