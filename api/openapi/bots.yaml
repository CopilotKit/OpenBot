      operationId: answerTeamBotConsent
      summary: Answer whether a Team Bot may use the caller's account
      description: >-
        Record the caller's answer when a Team Bot somebody else published
        asks to use one of the caller's own app accounts: this once, always
        for this Bot, always for every Team Bot, or skip, which takes back an
        earlier answer for this Bot. It is the caller's own answer and binds
        nobody else. Allowing is only for an app the Bot uses, one it holds a
        tool of; any other app is refused with VALIDATION_ERROR. Skip is
        accepted for any app.
      security:
        - webSession: []
        - appOAuth: [team-bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamBotConsentAnswer'
            examples:
              always:
                value:
                  serverId: composio-gmail
                  decision: allow_always
      responses:
        '204':
          description: Recorded.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TeamBotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}/clear-team-bot-consents:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    post:
      tags: [Team Bots]
      operationId: clearTeamBotConsents
      summary: Forget every answer a person gave Team Bots
      description: >-
        Forget every answer the person gave a Team Bot about using their own
        app accounts, so each Team Bot asks again. It is the person's own:
        nobody else, an administrator included, may do it for them.
      security:
        - webSession: []
        - appOAuth: [team-bots:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Forgotten.
          headers:
            X-Request-Id:
              $ref: './common.yaml#/components/headers/RequestId'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/OwnOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  parameters:
    BotId:
      name: botId
      in: path
      required: true
      description: The Bot's id.
      schema:
        type: string
        minLength: 1
        pattern: \S
      example: agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
    DirectoryGroup:
      name: group
      in: path
      required: true
      description: >-
        A directory group, by the name the identity provider gives it, or *
        for everybody. A team is written team: followed by the team's id, as
        in team:Tm4Qx8LpV2nWc7RbY1sKd0Ze.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
      example: finance
  schemas:
    BotVisibility:
      type: string
      enum: [public, private]
      description: Public Bots are shared with everybody in the organization.
    Bot:
      type: object
      description: >-
        A Bot as the caller sees it. canManage, mine, systemOwned and the
        isolation fields are the server's verdicts for this caller; a client
        renders them and never recomputes them. No secret is ever part of a
        Bot: hasAuth and hasCallbackToken say whether one is set.
      required:
        - id
        - name
        - title
        - roleDescription
        - avatarSeed
        - visibility
        - hidden
        - pinned
        - systemOwned
        - endpoint
        - hasAuth
        - hasCallbackToken
        - isolated
        - canManage
        - mine
        - assignedToMe
        - builtIn
        - runsOnOpenBotModel
        - keyFromOpenBot
        - isolationActive
        - isolationOffReason
      properties:
        id:
          type: string
          description: The Bot's id.
        name:
          type: string
          description: What the Bot is called.
        title:
          type: string
          description: The subtitle under its name. May be empty.
        roleDescription:
          type: string
          description: What it does, in its owner's words.
        avatarSeed:
          type: string
          description: The seed its avatar is drawn from.
        visibility:
          $ref: '#/components/schemas/BotVisibility'
        hidden:
          type: boolean
          description: Whether the caller hid it from their own list.
        pinned:
          type: boolean
          description: Whether the caller pinned it to the top of their own list.
        systemOwned:
          type: boolean
          description: Whether it comes with OpenBot rather than belonging to a person.
        packageBotId:
          type: [string, 'null']
          readOnly: true
          description: >-
            Which of the Bots an OpenBot starts with this one is, so a client
            recognises it in whichever organization it is in. It is the id
            that Bot has in the install package: the same as id in the
            organization `default`, and the package's id on another
            organization's copy, whose own id is generated. Null for a Bot
            somebody made. Never accepted when a Bot is created or changed.
        endpoint:
          type: [string, 'null']
          description: >-
            The AG-UI address it runs at, as it was stored. Null for a Bot that
            runs inside OpenBot. Every address saved through this API is an
            absolute http or https address (see the request's endpoint), but
            one saved by an older release is returned as it is, so this field
            states no format.
        hasAuth:
          type: boolean
          description: Whether a key is set for its address. Never the key.
        hasCallbackToken:
          type: boolean
          description: >-
            Whether it holds a credential for calling OpenBot's tools back.
            Never the credential.
        isolated:
          type: boolean
          description: >-
            Whether its owner asked for it to have a computer of its own.
            isolationActive says whether it has one now.
        instructions:
          type: string
          description: >-
            What the starter Bot is told, kept apart from its role description.
            Only the starter Bot has instructions.
        framework:
          type: string
          description: >-
            What runs it, by the name a person reads ("LangChain", "OpenBot").
            Absent when OpenBot doesn't know.
        canManage:
          type: boolean
          description: Whether the caller may change and delete it.
        mine:
          type: boolean
          description: >-
            Whether the caller created it. Separate from canManage, which is
            also true for an administrator on everybody's Bots.
        withheld:
          type: boolean
          description: >-
            Whether it is somebody else's private Bot, listed for an admin's
            screens (listBots with scope=organization) and nothing more. Such
            a Bot carries its id, name, avatar and the caller's own state with
            it only: title and roleDescription are empty, endpoint is null,
            instructions and framework are absent, hasAuth, hasCallbackToken,
            isolated, builtIn, runsOnOpenBotModel, keyFromOpenBot and canManage
            are false. Absent or false on every other Bot.
        assignedToMe:
          type: boolean
          description: Whether an administrator assigned this Bot to the caller.
        lastConversationAt:
          type: [string, 'null']
          format: date-time
          description: >-
            When a conversation of the caller's with this Bot last had a
            message, the Bot's or anybody's, or was started if it has none yet;
            null when the caller has none. Counts the conversations
            listConversations lists. Set on listBots.
        builtIn:
          type: boolean
          description: >-
            Whether it runs at the deployment's own managed address, so it
            needs no callback credential of its own.
        runsOnOpenBotModel:
          type: boolean
          description: >-
            Whether it runs on OpenBot's model, so a person can pick the model
            per conversation.
        defaultModel:
          type: [object, 'null']
          description: The Bot's saved default model and thinking level. Null follows the deployment default.
          required: [model, effort, source]
          properties:
            model:
              type: string
            effort:
              type: [string, 'null']
            source:
              type: string
              description: The model connection source when the default was saved.
        keyFromOpenBot:
          type: boolean
          description: >-
            Whether OpenBot gives it a key for its tools on every run, because
            OpenBot runs it.
        isolationActive:
          type: boolean
          description: Whether its next run gets a computer of its own.
        isolationOffReason:
          type: [string, 'null']
          enum: [admin, deployment, null]
          description: >-
            Why an isolated Bot runs on a shared computer instead. admin: its
            owner no longer holds Isolated Bots. deployment: this deployment
            cannot make another computer. Null otherwise.
    BotPage:
      type: object
      required: [bots, nextCursor]
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    BotResponse:
      type: object
      required: [bot]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
    SharedApp:
      type: object
      required: [serverId, title]
      properties:
        serverId:
          type: string
          description: The app's id.
        title:
          type: string
          description: The app's name.
    SharedAppsAfterChange:
      type: object
      description: >-
        What making a Bot public means for the shared app accounts it uses. An
        administrator's change approves them; anybody else's lists the ones an
        administrator still has to approve. While the organization's apps are
        open (getAppsSetting), nothing needs approving and needsApproval is
        empty.
      required: [approved, needsApproval]
      properties:
        approved:
          type: array
          items:
            $ref: '#/components/schemas/SharedApp'
        needsApproval:
          type: array
          items:
            $ref: '#/components/schemas/SharedApp'
    UpdateBotResponse:
      type: object
      required: [bot]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
        sharedApps:
          $ref: '#/components/schemas/SharedAppsAfterChange'
    BotKey:
      type: object
      description: >-
        A key the Bot's address sits behind. Write-only: stored encrypted and
        never returned. A blank value sets no key.
      additionalProperties: false
      required: [value]
      properties:
        header:
          type: string
          pattern: ^[A-Za-z0-9-]*$
          description: The header it is sent in. Blank or absent means Authorization.
        value:
          type: string
          writeOnly: true
          description: The header's value.
    BotName:
      type: string
      minLength: 1
      maxLength: 80
      description: What the Bot is called, 1 to 80 characters once trimmed.
    BotTitle:
      type: string
      maxLength: 120
      description: The subtitle under its name, up to 120 characters. May be empty.
    BotRoleDescription:
      type: string
      minLength: 1
      maxLength: 5000
      description: >-
        What it does, 1 to 5000 characters once trimmed. A Bot with no endpoint
        runs on these words.
    BotEndpoint:
      type: string
      description: >-
        The AG-UI address it runs at: empty, or an absolute http or https
        address, the only kinds the server has ever taken. Empty or absent on
        create means it runs inside OpenBot; empty or absent on a change leaves
        it as it is. An address that fits can still be refused: the server
        refuses one this deployment may not reach, such as a private network
        address on a deployment that keeps Bots off it.
      anyOf:
        - type: string
          maxLength: 0
        - type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
    BotIsolated:
      type: boolean
      description: >-
        Whether it gets a computer of its own. Absent leaves it as it is. True
        needs the owner's Isolated Bots switch.
    BotInstructions:
      type: string
      minLength: 1
      maxLength: 5000
      description: >-
        New instructions for the starter Bot, 1 to 5000 characters once
        trimmed. Absent leaves them as they are; every other Bot ignores them.
    BotFields:
      type: object
      additionalProperties: false
      required: [name, title, roleDescription, visibility]
      properties:
        name:
          $ref: '#/components/schemas/BotName'
        title:
          $ref: '#/components/schemas/BotTitle'
        roleDescription:
          $ref: '#/components/schemas/BotRoleDescription'
        visibility:
          $ref: '#/components/schemas/BotVisibility'
        endpoint:
          $ref: '#/components/schemas/BotEndpoint'
        auth:
          $ref: '#/components/schemas/BotKey'
        isolated:
          $ref: '#/components/schemas/BotIsolated'
        instructions:
          $ref: '#/components/schemas/BotInstructions'
        defaultModel:
          type: [object, 'null']
          additionalProperties: false
          description: >-
            A model from the connected provider and its thinking level. Null resets
            to the deployment default. Omit to keep the current setting.
          required: [model, effort]
          properties:
            model:
              type: string
              minLength: 1
              maxLength: 500
              pattern: \S
            effort:
              type: [string, 'null']
              minLength: 1
              maxLength: 40
              pattern: \S
            source:
              type: string
              minLength: 1
              maxLength: 40
              pattern: ^[a-z][a-z0-9-]*$
              description: >-
                Who serves the model, as the catalogue's connections name it
                (ModelCatalogueConnection source). The default applies for a
                person with a connection of that kind that can run. Omit for
                the default connection's.
    CreateBotRequest:
      description: >-
        A new Bot: a Bot's fields, and the framework it is built on. One closed
        object, not BotFields with harness added in an allOf, because each
        closed part of an allOf would refuse the other's fields.
      type: object
      additionalProperties: false
      required: [name, title, roleDescription, visibility]
      properties:
        name:
          $ref: '#/components/schemas/BotName'
        title:
          $ref: '#/components/schemas/BotTitle'
        roleDescription:
          $ref: '#/components/schemas/BotRoleDescription'
        visibility:
          $ref: '#/components/schemas/BotVisibility'
        endpoint:
          $ref: '#/components/schemas/BotEndpoint'
        auth:
          $ref: '#/components/schemas/BotKey'
        isolated:
          $ref: '#/components/schemas/BotIsolated'
        instructions:
          $ref: '#/components/schemas/BotInstructions'
        harness:
          type: string
          description: >-
            The framework an agent somebody runs themselves is built on, by
            its id in OpenBot's harness list (shared/harnesses.json), which
            the server checks every create against. Empty means none was
            named, as for an agent somebody already runs. "byo-url" is not
            one: it names no framework. Kept only with an endpoint, with one
            exception: "langgraph-ts" sent with no endpoint asks for a Bot
            that runs inside OpenBot on OpenBot's own LangGraph (TypeScript)
            engine, which is what the New Bot sheet sends. The deployment
            decides what each run uses: a Claude plan keeps the Claude Agent
            SDK engine, a ChatGPT plan signed in on OpenBot Desktop the
            OpenAI Agents SDK engine, and an administrator may switch new Bots
            back to the built-in agent.
          enum:
            - ''
            - crewai
            - llamaindex
            - agno
            - langgraph
            - langgraph-ts
            - google-adk
            - antigravity
            - pydantic-ai
            - microsoft-agent-framework
            - claude-agent-sdk
            - openai-agents-sdk
            - strands
            - ag2
            - langroid
            - mastra
    UpdateBotRequest:
      description: A Bot's fields after the change.
      allOf:
        - $ref: '#/components/schemas/BotFields'
    BotConnectionTestRequest:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint:
          type: string
          maxLength: 2048
          description: >-
            The AG-UI address to try. Anything that is not an address a Bot
            could be saved with is answered with ok false and the reason.
        headers:
          type: object
          description: >-
            Headers to send with the run, such as the key the address sits
            behind, as name to value. Never stored.
          maxProperties: 32
          propertyNames:
            pattern: ^[A-Za-z0-9-]{1,64}$
          additionalProperties:
            type: string
            maxLength: 4096
            pattern: ^[\x01-\x09\x0B\x0C\x0E-\xFF]*$
    BotConnectionTest:
      type: object
      description: >-
        What the address answered. ok true: it answered with AG-UI events,
        listed in events. ok false: reason says why not.
      required: [ok, events, reason]
      properties:
        ok:
          type: boolean
          description: Whether an AG-UI agent answered at the address.
        events:
          type: array
          description: The AG-UI event types that came back, in order. Empty when ok is false.
          items:
            type: string
        reason:
          type: [string, 'null']
          description: Why the test failed, in words a person can act on. Null when ok is true.
    BotCallbackToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: >-
            The Bot's credential for calling OpenBot's tools back. Returned
            this once and never again.
    BotDeclineReport:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: Why the Bot declined, in its own words. The trail keeps the first 500 characters.
        request:
          type: string
          maxLength: 2000
          pattern: ^[^\x00]*$
          description: What it was asked to do, in a few words. The trail keeps the first 500 characters.
    BotHandoff:
      type: object
      required: [enabled, canGrant, reachable, grantable]
      properties:
        enabled:
          type: boolean
          description: >-
            Whether this deployment lets Bots hand work to each other at all.
            False means a grant would never be used.
        canGrant:
          type: boolean
          description: Whether the caller may change which Bots this one may hand work to. Only an administrator may.
        reachable:
          type: array
          description: The ids of the Bots this Bot may hand work to today.
          items:
            type: string
        grantable:
          type: boolean
          description: >-
            Whether this Bot can be given that permission at all. False means
            every grant would be refused.
    BotNotify:
      type: string
      enum: [all, needs_input, none]
      description: >-
        How loudly a Bot may reach the person outside the web app: everything,
        only what needs them, or nothing. Badges in the web app always show.
    BotLifecycle:
      type: object
      description: The caller's own state with one Bot.
      required: [botId, paused, pausedAt, notify]
      properties:
        botId:
          type: string
          description: The Bot.
        paused:
          type: boolean
          description: Whether the caller paused it.
        pausedAt:
          type: [string, 'null']
          format: date-time
          description: When they paused it. Null when it is not paused.
        notify:
          $ref: '#/components/schemas/BotNotify'
    BotPause:
      type: object
      required: [lifecycle, stoppedTurns]
      properties:
        lifecycle:
          $ref: '#/components/schemas/BotLifecycle'
        stoppedTurns:
          type: integer
          minimum: 0
          description: How many of its turns for the caller were stopped.
    BotResetRequest:
      type: object
      additionalProperties: false
      required: [validateOnly]
      properties:
        validateOnly:
          type: boolean
          description: >-
            True counts what a reset would delete and deletes nothing. False
            deletes it. Required, so a reset is never asked for by omission.
    BotResetCounts:
      type: object
      description: What a reset deletes, by kind, for the caller only.
      required:
        - conversations
        - sharedConversationsKept
        - memorySources
        - memories
        - routines
        - responsibilities
        - followUps
        - formedMemories
        - backgroundResearch
        - standingApprovals
      properties:
        conversations:
          type: integer
          minimum: 0
          description: The caller's conversations with the Bot.
        sharedConversationsKept:
          type: integer
          minimum: 0
          description: Conversations with the Bot shared with other people, which are kept.
        memorySources:
          type: integer
          minimum: 0
          description: What the Bot reads to remember the caller.
        memories:
          type: integer
          minimum: 0
          description: What it remembers about the caller.
        routines:
          type: integer
          minimum: 0
          description: The caller's routines with it.
        responsibilities:
          type: integer
          minimum: 0
          description: The goals the caller gave it.
        followUps:
          type: integer
          minimum: 0
          description: Follow-ups it set itself for the caller.
        formedMemories:
          type: integer
          minimum: 0
          description: Memories it formed itself from what it read for the caller.
        backgroundResearch:
          type: integer
          minimum: 0
          description: Research it did in the background for the caller, with its suggestions.
        standingApprovals:
          type: integer
          minimum: 0
          description: The "always allow" and pre-approved rules the caller gave it.
    BotReset:
      type: object
      required: [validateOnly, deleted]
      properties:
        validateOnly:
          type: boolean
          description: Whether this only counted, as the request asked.
        deleted:
          $ref: '#/components/schemas/BotResetCounts'
    BotActivityItem:
      type: object
      required:
        - id
        - kind
        - title
        - detail
        - status
        - at
        - channelId
        - needsYou
        - stoppable
        - cancellable
      properties:
        id:
          type: string
          description: >-
            Unique in the activity. For a handoff, what stop-handoff takes; for
            a follow-up, what cancelling it takes.
        kind:
          type: string
          enum: [routine, responsibility, handoff, approval, question, follow_up]
        title:
          type: string
        detail:
          type: [string, 'null']
        status:
          type: string
          description: A short state a person reads, such as running, waiting for you or queued.
        at:
          type: string
          format: date-time
          description: When it started, is due, or ended, by section.
        channelId:
          type: [string, 'null']
          description: The conversation it belongs to, when one can be named.
        needsYou:
          type: boolean
          description: Whether it needs the caller to do something.
        stoppable:
          type: boolean
          description: A handoff that can still be stopped.
        cancellable:
          type: boolean
          description: A follow-up that can still be cancelled.
    BotActivity:
      type: object
      required: [inProgress, scheduled, onDemand, completed]
      properties:
        inProgress:
          type: array
          items:
            $ref: '#/components/schemas/BotActivityItem'
        scheduled:
          type: array
          items:
            $ref: '#/components/schemas/BotActivityItem'
        onDemand:
          type: array
          description: Goals that run only when somebody asks.
          items:
            $ref: '#/components/schemas/BotActivityItem'
        completed:
          type: array
          maxItems: 25
          description: The most recently finished, newest first.
          items:
            $ref: '#/components/schemas/BotActivityItem'
    StopBotHandoffRequest:
      type: object
      additionalProperties: false
      required: [handoffId]
      properties:
        handoffId:
          type: string
          minLength: 1
          maxLength: 500
          description: The handoff's id, as the Bot's activity lists it.
    BotAttention:
      type: object
      description: What one Bot has waiting on the person.
      required:
        - botId
        - name
        - questions
        - approvals
        - handoffs
        - unread
        - paused
        - notify
        - items
        - tasks
        - waitingIn
      properties:
        botId:
          type: string
        name:
          type: string
          description: The Bot's name.
        questions:
          type: integer
          minimum: 0
          description: Questions it asked the person that are still open.
        approvals:
          type: integer
          minimum: 0
          description: Its actions waiting on the person's approval.
        handoffs:
          type: integer
          minimum: 0
          description: Work handed to it or by it that has stalled waiting on the person.
        unread:
          type: integer
          minimum: 0
          description: Its messages the person hasn't read.
        paused:
          type: boolean
          description: Whether the person paused it.
        notify:
          $ref: '#/components/schemas/BotNotify'
        items:
          type: integer
          minimum: 0
          description: Open items from its check-ins.
        tasks:
          type: object
          required: [needsInput, ready, failed]
          properties:
            needsInput:
              type: integer
              minimum: 0
              description: Tasks waiting on an approval or an answer.
            ready:
              type: integer
              minimum: 0
              description: Tasks with a reply to read.
            failed:
              type: integer
              minimum: 0
              description: Tasks that couldn't finish.
        waitingIn:
          type: [string, 'null']
          description: >-
            The conversation of the newest thing it waits on the person for,
            where a notice about it opens. Null when it waits on nothing in a
            conversation.
    BotAttentionPage:
      type: object
      required: [attention, lastPingId, nextCursor]
      properties:
        attention:
          type: array
          items:
            $ref: '#/components/schemas/BotAttention'
        lastPingId:
          type: [string, 'null']
          description: >-
            The person's newest ping across all their Bots. A client notifies
            once each time it changes. Null before the first.
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    TeamBotAudience:
      type: string
      enum: [team, people]
      description: >-
        team is everyone in the organization; people is the people, teams and
        groups named.
    TeamBot:
      type: object
      description: >-
        A published Bot, as the caller sees it. Who it reaches (people, teams,
        groups and assignedGroups) is present only for its owner and
        administrators.
      required:
        - botId
        - name
        - title
        - roleDescription
        - mine
        - audience
        - publishedAt
        - assigned
        - visibleToTeam
      properties:
        botId:
          type: string
        name:
          type: string
        title:
          type: string
        roleDescription:
          type: string
        mine:
          type: boolean
          description: Whether the caller published it.
        audience:
          $ref: '#/components/schemas/TeamBotAudience'
        publishedAt:
          type: string
          format: date-time
        assigned:
          type: boolean
          description: Whether an administrator put it in the caller's Bots list, where they can't hide it.
        visibleToTeam:
          type: boolean
          description: >-
            False while its name or description would leave the people it is
            published to unable to tell it apart, so they can't see it.
        people:
          type: array
          description: The people it is published to, by email.
          items:
            type: string
        groups:
          type: array
          description: The directory groups it is published to.
          items:
            type: string
        teams:
          type: array
          description: The teams it is published to, by each team's id.
          items:
            type: string
        assignedGroups:
          type: array
          description: The directory groups an administrator assigned it to; * is everybody.
          items:
            type: string
    TeamBotPage:
      type: object
      required: [teamBots, nextCursor]
      properties:
        teamBots:
          type: array
          items:
            $ref: '#/components/schemas/TeamBot'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    TeamBotResponse:
      type: object
      required: [teamBot]
      properties:
        teamBot:
          $ref: '#/components/schemas/TeamBot'
    TeamBotPublication:
      type: object
      additionalProperties: false
      required: [audience]
      properties:
        audience:
          $ref: '#/components/schemas/TeamBotAudience'
        emails:
          type: array
          maxItems: 200
          description: With people, the people to publish to, by the email they sign in with.
          items:
            type: string
            maxLength: 320
        groups:
          type: array
          maxItems: 100
          description: With people, the directory groups to publish to.
          items:
            type: string
            maxLength: 200
        teams:
          type: array
          maxItems: 100
          description: >-
            With people, the teams to publish to, by each team's id. Every
            one must be a team of this organization. The people in a team,
            and in the teams under it, can use the Bot, and nobody else in
            the organization can.
          items:
            type: string
            minLength: 1
            maxLength: 200
            pattern: ^[A-Za-z0-9_-]+$
    PublishedTeamBot:
      type: object
      required: [teamBot, sharedApps]
      properties:
        teamBot:
          $ref: '#/components/schemas/TeamBot'
        sharedApps:
          $ref: '#/components/schemas/SharedAppsAfterChange'
    TeamBotConsentAnswer:
      type: object
      additionalProperties: false
      required: [serverId, decision]
      properties:
        serverId:
          type: string
          minLength: 1
          maxLength: 200
          description: The app whose account the Team Bot asked to use.
        decision:
          type: string
          enum: [allow_once, allow_always, allow_all_team_bots, skip]
          description: >-
            allow_once: this time. allow_always: always, for this Team Bot.
            allow_all_team_bots: always, for every Team Bot. skip: not now,
            taking back an earlier answer for this Team Bot.
  responses:
    InvalidBot:
      description: >-
        A field is missing or out of bounds, the address is one this deployment
        may not reach, or the deployment cannot give a Bot a computer of its
        own.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            name:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Name must be text between 1 and 80 characters.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            noIsolation:
              value:
                type: https://open.bot/errors/isolation-unavailable
                title: This OpenBot can't give a Bot a computer of its own.
                status: 400
                detail: This OpenBot can't give a Bot a computer of its own, so it runs on yours.
                code: ISOLATION_UNAVAILABLE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    BotForbidden:
      description: >-
        The caller may not manage this Bot, the Bot comes with OpenBot, or the
        caller may not give it a computer of its own.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: You can't manage this Bot.
                status: 403
                detail: You can't manage this Bot.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            isolation:
              value:
                type: https://open.bot/errors/capability-required
                title: Your admin hasn't turned on Isolated Bots for you.
                status: 403
                detail: Your admin hasn't turned on Isolated Bots for you.
                code: CAPABILITY_REQUIRED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
                capability: isolatedComputers
    BotNotFound:
      description: >-
        The Bot does not exist, was deleted, or is not visible to the caller,
        or the organization is not.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/bot-not-found
                title: Bot not found.
                status: 404
                detail: Couldn't find that Bot.
                code: BOT_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    HandoffNotFound:
      description: >-
        The handoff is not running or queued for the caller, the Bot is not
        one the caller can see, or the organization is not found.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            finished:
              value:
                type: https://open.bot/errors/handoff-not-found
                title: Handoff not found.
                status: 404
                detail: That delegated task is not running or queued.
                code: HANDOFF_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    TeamBotNotFound:
      description: >-
        The Bot is not published, not published to the caller, not theirs to
        publish, or the organization is not found.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/team-bot-not-found
                title: Team Bot not found.
                status: 404
                detail: That Team Bot was not found.
                code: TEAM_BOT_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    TeamBotForbidden:
      description: An administrator hasn't turned on Team Bots for the caller.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            switchedOff:
              value:
                type: https://open.bot/errors/capability-required
                title: An admin hasn't turned this on for you.
                status: 403
                detail: Your admin hasn't turned on Team Bots for you.
                code: CAPABILITY_REQUIRED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
                capability: teamBots
    InvalidTeamBot:
      description: >-
        A field is out of bounds, the Bot has no real name or description, a
        person named has never signed in here, nobody is named for people, or
        the Bot is not published yet.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            undescribed:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Give this Bot a name and a description before publishing it to your team.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    BotAssigned:
      description: >-
        An admin assigned this Team Bot to the caller, so it stays in their
        list, or the Idempotency-Key was already used for a different request.
      headers:
        X-Request-Id:
          $ref: './common.yaml#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            assigned:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: This Bot was assigned to you by an admin and can't be hidden.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
