# Computers: a Bot's computer, its screen, who drives it, what a Bot does on it, its files, and the administrator's list.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/computers:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Computers]
      operationId: listComputers
      summary: List the organization's computers
      description: >-
        Return one page of the computers Bots run on: each person's, and each
        isolated Bot's. Where every person's Bots share one computer, each
        entry is one person's seat on one Bot there. Ordered by whose computer
        it is, then by Bot. Only an administrator may read them. A missing
        cursor starts at the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [computers:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of computers, and how they are separated.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerPage'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerPageExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/stop:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Computers]
      operationId: stopComputer
      summary: Stop a computer
      description: >-
        Stop one computer from the list now, and record it on the audit trail.
        Its files and sign-ins stay, and it starts again when a Bot next needs
        it. The computer is named by whose it is, person:<id> or bot:<id>;
        botId names one Bot's seat on a shared computer. Only an administrator
        may do this.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerTarget'
            examples:
              request:
                value:
                  computer: 'person:user_2b8kq4'
      responses:
        '200':
          description: Whether it was running.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerStopped'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerStoppedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/reset:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Computers]
      operationId: resetComputer
      summary: Reset a computer
      description: >-
        Delete one computer's browser profile, and every sign-in with it, and
        record it on the audit trail. The computer is named by whose it is,
        person:<id> or bot:<id>; botId names one Bot's seat on a shared
        computer. Only an administrator may do this.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerTarget'
            examples:
              request:
                value:
                  computer: 'person:user_2b8kq4'
      responses:
        '200':
          description: Whether there was a profile to delete.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerReset'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerResetExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/update:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    post:
      tags: [Computers]
      operationId: updateComputer
      summary: Update a computer
      description: >-
        Move one computer onto the image this OpenBot now runs, and record it
        on the audit trail. Files and sign-ins stay; a running computer
        restarts. The computer is named by whose it is, person:<id> or
        bot:<id>. Only an administrator may do this.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerTarget'
            examples:
              request:
                value:
                  computer: 'person:user_2b8kq4'
      responses:
        '200':
          description: Whether it moved, and whether it was running.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerUpdated'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerUpdatedExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    get:
      tags: [Computers]
      operationId: getComputer
      summary: Read a Bot's computer
      description: >-
        Say where the Bot's computer is in its life for the caller: absent
        (not running, and it starts on the Bot's next action), starting, ready
        or unreachable. Reading it never starts the computer.
      security:
        - webSession: []
        - appOAuth: [computers:read]
        - apiKey: []
      responses:
        '200':
          description: The computer's state.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerStatus'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerStatusExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/wake:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    post:
      tags: [Computers]
      operationId: wakeComputer
      summary: Start a Bot's computer
      description: >-
        Start the Bot's computer when it is off, because a person opened its
        screen or terminal, and answer at once with its state without waiting
        for it to come up. The audit trail records a computer resumed this
        way.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The computer's state, starting for one just started.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerStatus'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerStatusExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/screenshot:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    get:
      tags: [Computers]
      operationId: getComputerScreenshot
      summary: Read one frame of a Bot's screen
      description: >-
        Return a picture of the Bot's screen as it is now, as a base64 PNG in
        JSON. A computer that is asleep or starting is not woken: the answer
        is ready false with its state.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [computers:read]
        - apiKey: []
      responses:
        '200':
          description: The frame, or the state of a computer that is not ready.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerScreenshot'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerScreenshotExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/page-frames/{toolCallId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
      - $ref: '#/components/parameters/ComputerToolCallId'
    get:
      tags: [Computers]
      operationId: getComputerPageFrame
      summary: Read the frame kept when a page was opened
      description: >-
        Return the picture taken when one tool call of the caller's opened its
        page, for reading a conversation back. frame is null when none was
        kept. Only the caller's own frames are ever returned.
      security:
        - webSession: []
        - appOAuth: [computers:read]
        - apiKey: []
      responses:
        '200':
          description: The frame, or null when none was kept.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerPageFrameAnswer'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerPageFrameExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/page:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    get:
      tags: [Computers]
      operationId: readComputerPage
      summary: Read the page a Bot's browser is on
      description: >-
        Return the text of the page the Bot's browser is showing, with its
        address and title.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [computers:read]
        - apiKey: []
      responses:
        '200':
          description: The page's address, title and text.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerPageText'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerPageTextExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '409':
          $ref: '#/components/responses/ComputerActionConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/control:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    get:
      tags: [Computers]
      operationId: getComputerControl
      summary: Read who is driving a Bot's computer
      description: >-
        Say whether the Bot or a person holds the mouse and keyboard, and any
        request the Bot has made for a person's help. With requestId, the
        state as that request sees it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [computers:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ComputerControlRequestId'
      responses:
        '200':
          description: Who is driving, and what has been asked.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerControl'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerControlExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '409':
          $ref: '#/components/responses/ComputerControlConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/control/request:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    post:
      tags: [Computers]
      operationId: requestComputerControl
      summary: Ask a person to take over a Bot's computer
      description: >-
        Raise a request for a person to drive the Bot's computer: the Bot
        asking for help with something it cannot do, or a person asking to
        take over themselves (source manual).
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerControlAsk'
            examples:
              request:
                value:
                  reason: Sign in to the bank, then hand it back.
      responses:
        '200':
          description: The control state, with the request.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerControl'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerControlExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '409':
          $ref: '#/components/responses/ComputerControlConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/control/take:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    post:
      tags: [Computers]
      operationId: takeComputerControl
      summary: Take over a Bot's computer
      description: >-
        Give the caller the mouse and keyboard for a request. The Bot's
        actions are refused until it is handed back. The audit trail records
        the takeover.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerControlRequestRef'
            examples:
              request:
                value:
                  requestId: 6f1c2b9a-0d4e-4e1b-9a53-1f2e3d4c5b6a
      responses:
        '200':
          description: The control state afterwards.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerControl'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerControlExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '409':
          $ref: '#/components/responses/ComputerControlConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/control/release:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    post:
      tags: [Computers]
      operationId: releaseComputerControl
      summary: Hand a Bot's computer back
      description: >-
        Hand the mouse and keyboard back to the Bot. Any recording in the
        Bot's browser ends, and a task that stopped for the person carries on.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerControlRequestRef'
            examples:
              request:
                value:
                  requestId: 6f1c2b9a-0d4e-4e1b-9a53-1f2e3d4c5b6a
      responses:
        '200':
          description: The control state afterwards.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerControl'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerControlExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '409':
          $ref: '#/components/responses/ComputerControlConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/control/cancel:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    post:
      tags: [Computers]
      operationId: cancelComputerControl
      summary: Decline a request to take over
      description: >-
        Decline the Bot's request without taking over. A task that stopped for
        the person carries on from the refusal.
      security:
        - webSession: []
        - appOAuth: [computers:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerControlRequestRef'
            examples:
              request:
                value:
                  requestId: 6f1c2b9a-0d4e-4e1b-9a53-1f2e3d4c5b6a
      responses:
        '200':
          description: The control state afterwards.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerControl'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerControlExample'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComputerBotNotFound'
        '409':
          $ref: '#/components/responses/ComputerControlConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ComputerUnavailable'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computers/{botId}/control/secret:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/BotId'
    post:
