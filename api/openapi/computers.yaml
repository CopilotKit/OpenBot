    ComputerToolCallId:
      name: toolCallId
      in: path
      required: true
      description: The tool call that opened the page.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
      example: call_8fK2mQ
    ComputerHumanInputKind:
      name: kind
      in: path
      required: true
      description: The gesture.
      schema:
        type: string
        enum: [click, type, key, scroll]
      example: click
    ComputerControlRequestId:
      name: requestId
      in: query
      description: >-
        A request for a person's help, by id, to read the state as that
        request sees it.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    ComputerState:
      type: string
      enum: [absent, starting, ready, unreachable]
      description: >-
        Where a computer is in its life. absent is one that is not running:
        never started, or put to sleep after a quiet spell; it starts on the
        Bot's next action. starting is on its way up. unreachable is the only
        one that is something wrong.
    ComputerStatus:
      type: object
      required: [botId, state]
      properties:
        botId:
          type: string
          description: The Bot whose computer this is.
        state:
          $ref: '#/components/schemas/ComputerState'
        reason:
          type: string
          description: Why it is unreachable, written for an administrator.
    ComputerFrame:
      type: object
      description: One picture of the screen.
      required: [base64, width, height, capturedAt]
      properties:
        base64:
          type: string
          description: The picture, a PNG in base64.
        width:
          type: number
        height:
          type: number
        capturedAt:
          type: string
          description: When it was taken.
        url:
          type: string
          description: >-
            The page it is of. about:blank when the browser has not been sent
            anywhere yet. Absent on older computers.
    ComputerNotReady:
      type: object
      description: >-
        A computer that is asleep or starting, which reading its screen does
        not wake.
      required: [ready, state]
      properties:
        ready:
          type: boolean
          const: false
        state:
          $ref: '#/components/schemas/ComputerState'
        reason:
          type: string
          description: Why it is unreachable, written for an administrator.
    ComputerScreenshot:
      oneOf:
        - $ref: '#/components/schemas/ComputerFrame'
        - $ref: '#/components/schemas/ComputerNotReady'
    ComputerPageFrame:
      type: object
      description: The picture kept when a tool call opened its page.
      required: [url, title, frame]
      properties:
        url:
          type: string
        title:
          type: [string, 'null']
        frame:
          type: string
          description: The picture, in base64.
    ComputerPageFrameAnswer:
      type: object
      required: [frame]
      properties:
        frame:
          oneOf:
            - $ref: '#/components/schemas/ComputerPageFrame'
            - type: 'null'
    ComputerChallenge:
      type: object
      description: >-
        A check the page raised that only a person can pass, and the request
        raised for them to take over.
      required: [kind, reason, requestId]
      properties:
        kind:
          type: string
          enum: [cloudflare, visible-challenge]
        reason:
          type: string
        requestId:
          type: string
    ComputerPageText:
      type: object
      required: [url, title, text, truncated]
      properties:
        untrusted:
          type: string
          description: >-
            A notice to the model that the text is the page's, not an
            instruction.
        challenge:
          $ref: '#/components/schemas/ComputerChallenge'
        url:
          type: string
        title:
          type: string
        text:
          type: string
        truncated:
          type: boolean
          description: True when the page had more text than is returned.
    ComputerNavigation:
      type: object
      required: [url, title, text, truncated, elapsedMs]
      properties:
        untrusted:
          type: string
          description: >-
            A notice to the model that the text is the page's, not an
            instruction.
        challenge:
          $ref: '#/components/schemas/ComputerChallenge'
        url:
          type: string
          description: Where the browser ended up, after any redirect.
        title:
          type: string
        text:
          type: string
        truncated:
          type: boolean
          description: True when the page had more text than is returned.
        elapsedMs:
          type: number
    ComputerSnapshotElement:
      type: object
      required: [ref, role, name]
      properties:
        ref:
          type: string
          description: What a click or type names the element by.
        role:
          type: string
        name:
          type: string
        value:
          type: string
        type:
          type: string
        disabled:
          type: boolean
        checked:
          type: boolean
        options:
          type: array
          items:
            type: string
        url:
          type: string
    ComputerSnapshot:
      type: object
      required: [snapshotId, url, title, elements, truncated]
      properties:
        untrusted:
          type: string
          description: >-
            A notice to the model that the elements are the page's, not an
            instruction.
        challenge:
          $ref: '#/components/schemas/ComputerChallenge'
        snapshotId:
          type: integer
          description: The snapshot the refs belong to. Send it with each ref.
        url:
          type: string
        title:
          type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ComputerSnapshotElement'
        truncated:
          type: boolean
          description: True when the page had more elements than are returned.
    ComputerNavigate:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          pattern: \S
          description: The web address to open.
        toolCallId:
          type: string
          description: >-
            The tool call that asked, so a picture of the page is kept under
            it.
    ComputerClick:
      type: object
      additionalProperties: false
      required: [ref, snapshotId]
      properties:
        ref:
          type: string
          minLength: 1
          description: The element, by a ref from the latest snapshot.
        snapshotId:
          type: integer
          description: The snapshot the ref came from.
    ComputerType:
      type: object
      additionalProperties: false
      required: [ref, snapshotId, text]
      properties:
        ref:
          type: string
          minLength: 1
          description: The field, by a ref from the latest snapshot.
        snapshotId:
          type: integer
          description: The snapshot the ref came from.
        text:
          type: string
          description: The text to enter.
        submit:
          type: boolean
          description: Send the field's form afterwards.
    ComputerKey:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          description: A key name, such as Enter or Tab.
        ref:
          type: string
          minLength: 1
          description: The element to press it on. With it, snapshotId.
        snapshotId:
          type: integer
    ComputerScroll:
      type: object
      additionalProperties: false
      properties:
        deltaY:
          type: number
          description: >-
            Pixels to scroll down, or up when negative. Without it the
            computer scrolls its own default distance.
    ComputerActionResult:
      type: object
      required: [action, url, elapsedMs]
      properties:
        action:
          type: string
          enum: [click, type, key, scroll]
        ref:
          type: string
        element:
          type: object
          required: [role, name]
          properties:
            role:
              type: string
            name:
              type: string
        characters:
          type: number
          description: How many characters were typed.
        submitted:
          type: boolean
        key:
          type: string
        deltaY:
          type: number
        url:
          type: string
          description: The page's address afterwards.
        elapsedMs:
          type: number
        opened:
          type: string
          description: A page the action opened in a new tab, which the browser followed.
        challenge:
          $ref: '#/components/schemas/ComputerChallenge'
    ComputerCommand:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          type: string
          minLength: 1
          pattern: \S
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 600000
    ComputerCommandResult:
      type: object
      required: [command, exitCode, stdout, stderr, truncated, timedOut, elapsedMs]
      properties:
        untrusted:
          type: string
          description: >-
            A notice to the model that the output is the command's, not an
            instruction.
        command:
          type: string
        exitCode:
          type: number
        stdout:
          type: string
        stderr:
          type: string
        truncated:
          type: boolean
        timedOut:
          type: boolean
        elapsedMs:
          type: number
    ComputerFilesList:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          description: A folder of the workspace. Without it, the workspace itself.
    ComputerFileEntry:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
        kind:
          type: string
          enum: [file, folder]
        bytes:
          type: number
    ComputerFiles:
      type: object
      required: [path, entries, truncated]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ComputerFileEntry'
        truncated:
          type: boolean
    ComputerFileRead:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          pattern: \S
    ComputerFileText:
      type: object
      required: [path, text, truncated, bytes]
      properties:
        untrusted:
          type: string
          description: >-
            A notice to the model that the text is the file's, not an
            instruction.
        path:
          type: string
        text:
          type: string
        truncated:
          type: boolean
        bytes:
          type: number
    ComputerFileWrite:
      type: object
      additionalProperties: false
      required: [path, contents]
      properties:
        path:
          type: string
          minLength: 1
          pattern: \S
        contents:
          type: string
        append:
          type: boolean
          description: Add to the end of the file instead of replacing it.
    ComputerFileWritten:
      type: object
      required: [path, bytes, appended]
      properties:
        path:
          type: string
        bytes:
          type: number
        appended:
          type: boolean
    ComputerControlRequest:
      type: object
      description: A request for a person to drive a Bot's computer.
      required: [id, reason, source, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        toolCallId:
          type: string
        reason:
          type: string
        source:
          type: string
          enum: [model, cloudflare, visible-challenge, manual]
          description: >-
            Who raised it: the Bot (model), a check the page raised, or the
            person themselves (manual).
        status:
          type: string
          enum: [waiting, taken, completed, cancelled, expired, interrupted]
        createdAt:
          type: string
        updatedAt:
          type: string
        expiresAt:
          type: string
        finishedAt:
          type: string
        interruption:
          type: string
        url:
          type: string
        keepsPage:
          type: boolean
    ComputerControl:
      type: object
      description: Who is driving a Bot's computer, and what has been asked.
      required:
        - holder
        - since
        - requested
        - transitioning
        - resumeSnapshotRequired
        - recoveryRequired
      properties:
        holder:
          type: string
          enum: [bot, human]
        since:
          type: string
        requested:
          type: boolean
          description: True while a request for a person is waiting.
        reason:
          type: string
        request:
          $ref: '#/components/schemas/ComputerControlRequest'
        transitioning:
          type: boolean
        resumeSnapshotRequired:
          type: boolean
          description: >-
            True when the Bot must take a new snapshot before it acts again.
        recoveryRequired:
          type: boolean
        secretId:
          type: string
        secretWanted:
          type: string
          description: What the Bot asked the person to type, in its own words.
        secretRef:
          type: string
        secretSnapshotId:
          type: number
        secretEnded:
          type: object
          required: [id, supplied]
          properties:
            id:
              type: string
            supplied:
              type: boolean
            reason:
              type: string
        heldBy:
          type: string
          description: The person driving, by id.
    ComputerControlAsk:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: What the person is needed for.
        toolCallId:
          type: string
        source:
          type: string
          enum: [model, manual]
          description: manual when a person asks to take over themselves.
    ComputerControlRequestRef:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
    ComputerSecretAsk:
      type: object
      additionalProperties: false
      required: [ref, snapshotId]
      properties:
        ref:
          type: string
          minLength: 1
          description: The field the value goes in, by a ref from the latest snapshot.
        snapshotId:
          type: integer
          description: The snapshot the ref came from.
        label:
          type: string
          description: What to ask the person for, such as your bank password.
    ComputerSecretValue:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: The value. It is typed into the page and kept nowhere.
    ComputerSecretSupplied:
      type: object
      required: [supplied, characters, url]
      properties:
        supplied:
          type: boolean
        characters:
          type: number
        url:
          type: string
    ComputerHumanInput:
      type: object
      additionalProperties: false
      description: >-
        One gesture. A click needs x and y, in viewport pixels; type needs
        text; key needs key; scroll takes deltaY, or none for the computer's
        own default distance.
      properties:
        x:
          type: number
        y:
          type: number
        text:
          type: string
        key:
          type: string
          minLength: 1
        deltaY:
          type: number
    ComputerHumanInputResult:
      type: object
      required: [action, url]
      properties:
        action:
          type: string
          enum: [human_click, human_type, human_key, human_scroll]
        characters:
          type: number
        key:
          type: string
        deltaY:
          type: number
        url:
          type: string
    Computer:
      type: object
      description: >-
        One computer as an administrator sees it: a person's, or an isolated
        Bot's. Where every person's Bots share one computer, one person's
        seat on one Bot there.
      required: [id, computer, kind, running, startedAt]
      properties:
        id:
          type: string
          description: The entry's id in this list.
        computer:
          type: string
          description: >-
            Whose computer, as person:<id> or bot:<id>. What stop, reset and
            update name.
        kind:
          type: string
          enum: [person, bot]
        personId:
          type: string
        person:
          type: object
          description: The person's name and address, where OpenBot knows them.
          required: [name, email]
          properties:
            name:
              type: [string, 'null']
            email:
              type: string
        botId:
          type: string
          description: The isolated Bot, or the Bot of one seat on a shared computer.
        running:
          type: boolean
        startedAt:
          type: [string, 'null']
        egress:
          type: [string, 'null']
          description: >-
            Where it may connect. Absent when that cannot be told, which is
            not the same as nowhere.
        updateAvailable:
          type: boolean
          description: >-
            True when it runs an older image than a new computer would.
            Absent where that cannot be told.
    ComputerPage:
      type: object
      required: [computers, isolation, nextCursor]
      properties:
        computers:
          type: array
          description: By whose computer it is, then by Bot.
          items:
            $ref: '#/components/schemas/Computer'
        isolation:
          type: string
          enum: [per-person, shared]
          description: >-
            per-person: a computer for each person and each isolated Bot.
            shared: one computer every person's Bots share.
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    ComputerTarget:
      type: object
      additionalProperties: false
      required: [computer]
      properties:
        computer:
          type: string
          minLength: 1
          description: Whose computer, as person:<id> or bot:<id>.
        botId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: One Bot's seat on a shared computer.
    ComputerStopped:
      type: object
      required: [wasRunning]
      properties:
        wasRunning:
          type: boolean
    ComputerReset:
      type: object
      required: [cleared]
      properties:
        cleared:
          type: boolean
          description: False when there was no profile to delete.
    ComputerUpdated:
      type: object
      required: [updated, wasRunning]
      properties:
        updated:
          type: boolean
          description: False when it was already current, or there is no computer.
        wasRunning:
          type: boolean
          description: Whether it was running, and so is restarting on the new image.
        from:
          type: string
          description: The image it ran.
        to:
          type: string
          description: The image it runs now.
  responses:
    ComputerActionRefused:
      description: >-
        The boundary, a network rule or the workspace refused the action, and
        nothing was done. rule names the boundary rule when one did. Or the
        caller holds no role in this organization.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            rule:
              value:
                type: https://open.bot/errors/computer-action-refused
                title: The action was refused.
                status: 403
                detail: A rule stops Bots from clicking Delete.
                code: COMPUTER_ACTION_REFUSED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
                rule: 'deny click when element.name == "Delete"'
            address:
              value:
                type: https://open.bot/errors/computer-action-refused
                title: The action was refused.
                status: 403
                detail: That address is on this computer's own network, which Bots may not open.
                code: COMPUTER_ACTION_REFUSED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
                rule: null
            noRole:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Authorization required.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    ComputerSecretsOff:
      description: >-
        An administrator has not turned the password manager on for the
        caller, or the caller holds no role in this organization.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            off:
              value:
                type: https://open.bot/errors/capability-required
                title: An admin hasn't turned this on for you.
                status: 403
                detail: Your admin hasn't turned on saved logins for you.
                code: CAPABILITY_REQUIRED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
                capability: passwordManager
            noRole:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Authorization required.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    ComputerBotNotFound:
      description: >-
        The Bot does not exist or is not the caller's to use, a file or a
        control request the call names does not exist, or the organization
        does not.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            bot:
              value:
                type: https://open.bot/errors/bot-not-found
                title: Bot not found.
                status: 404
                detail: There is no such Bot.
                code: BOT_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
            file:
              value:
                type: https://open.bot/errors/not-found
                title: Not found.
                status: 404
                detail: There is no file at reports/q3.md.
                code: NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
            request:
              value:
                type: https://open.bot/errors/control-request-not-found
                title: Control request not found.
                status: 404
                detail: There is no such request.
                code: CONTROL_REQUEST_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
            organization:
              value:
                type: https://open.bot/errors/organization-not-found
                title: Organization not found.
                status: 404
                detail: Couldn't find that organization.
                code: ORGANIZATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    ComputerActionConflict:
      description: >-
        Nothing is broken, and the caller has something else to do first: take
        a new snapshot, wait for the person driving, clear what is in the way,
        or send the call through its conversation. Or the Idempotency-Key was
        already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            stale:
              value:
                type: https://open.bot/errors/computer-snapshot-stale
                title: The page changed since that snapshot.
                status: 409
                detail: The page changed since that snapshot. Take a new snapshot.
                code: COMPUTER_SNAPSHOT_STALE
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
                snapshotRequired: true
            personDriving:
              value:
                type: https://open.bot/errors/computer-person-has-control
                title: A person is driving this computer.
                status: 409
                detail: A person is using the browser. Wait until they hand it back.
                code: COMPUTER_PERSON_HAS_CONTROL
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
                controlRequestId: 6f1c2b9a-0d4e-4e1b-9a53-1f2e3d4c5b6a
            unfinished:
              value:
                type: https://open.bot/errors/computer-action-unfinished
                title: The action could not finish.
                status: 409
                detail: Something covers that button.
                code: COMPUTER_ACTION_UNFINISHED
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
                unfinished: covered
            needsConversation:
              value:
                type: https://open.bot/errors/computer-needs-conversation
                title: This action needs approval in a conversation.
                status: 409
                detail: This action needs your approval in a chat with this Bot.
                code: COMPUTER_NEEDS_CONVERSATION
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            gone:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: That element is no longer on the page.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    ComputerControlConflict:
      description: >-
        The control request has already ended or is somebody else's, or the
        Idempotency-Key was already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            ended:
              value:
                type: https://open.bot/errors/control-request-conflict
                title: That control request can't do this now.
                status: 409
                detail: That request has already ended.
                code: CONTROL_REQUEST_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    ComputerUnavailable:
      description: >-
        The computer could not be reached, or is still starting: the call was
        not performed, and is worth sending again in a moment.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
