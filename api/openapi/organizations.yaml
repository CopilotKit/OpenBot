# Organizations: the organizations a person is a member of, and each one's members.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/people/me/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List the caller's organizations
      description: >-
        Return one page of the organizations the caller is a member of, the
        one they joined first at the top, each with the caller's role in it.
        active marks the one the caller's session is working in, which is
        where every address outside /api/v2 reads and writes. A request
        signed in with an API key has no session, so none is active. An
        app's token has no session either: for it, active marks the
        organization its OpenBot-Organization header names, or the caller's
        own when it sends none. The header is checked against the caller's
        membership, as on every address that names no organization, so one
        they are not in answers not found. A session and an API key ignore
        it. To work in another one, set it as the
        session's active organization
        (POST /api/auth/organization/set-active). Made with an app's token,
        that call checks that the caller is a member, stores nothing and
        answers the organization. A missing cursor starts at the first page
        and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [organizations:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: OpenBot-Organization
          in: header
          required: false
          description: >-
            For a request signed in with an app's token: the organization it
            works in, by id or slug, which the list marks active. Without it
            the caller's own is active. One the caller is not a member of
            answers not found, and one that is not a single id or slug 400.
            Ignored for a session and an API key.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: One page of organizations.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/OrganizationPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organization
      description: >-
        Create an organization with the caller as its owner. It starts with
        what a fresh install starts with, its starter Bots included, and no
        conversations. Everybody already has an organization of
        their own, made when they first signed in; this is for making another,
        which anybody signed in may do where OpenBot keeps more than one.
        Without a slug, one is made from the name. The caller's session keeps
        working where it was. A repeated request with the same
        Idempotency-Key and body returns the first result.
      security:
        - webSession: []
        - appOAuth: [organizations:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
            examples:
              named:
                value:
                  name: Acme Research
                  slug: acme-research
      responses:
        '201':
          description: The organization was created.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
              examples:
                created:
                  $ref: '#/components/examples/CreatedOrganization'
        '400':
          $ref: '#/components/responses/InvalidOrganization'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OrganizationConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/OrganizationNotCreated'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/profile:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Rename an organization
      description: >-
        Give the organization a new name. Its id and its slug stay as they
        are, so every address that names it keeps working. An organization
        OpenBot named after its person stops following what that person is
        called once it has been renamed. Only an owner or an admin of this
        organization can. A repeated request with the same Idempotency-Key
        and body returns the first result.
      security:
        - webSession: []
        - appOAuth: [organizations:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
            examples:
              renamed:
                value:
                  name: Acme Research Lab
      responses:
        '200':
          description: The organization, renamed.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
              examples:
                renamed:
                  $ref: '#/components/examples/RenamedOrganization'
        '400':
          $ref: '#/components/responses/InvalidOrganization'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: './common.yaml#/components/responses/IdempotencyConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      summary: Delete an organization
      description: >-
        Delete the organization and what is in it. Nobody can work in it
        again: its Bots stop, its computers are removed, an API key made for
        it alone stops working, and it leaves every member's list of
        organizations. Its members keep their accounts and their other
        organizations. Only an owner of this organization can. A person's own
        organization and `default` stay, and are refused. A repeated request
        with the same Idempotency-Key returns the first result.
      security:
        - webSession: []
        - appOAuth: [organizations:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The organization is deleted.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OwnerOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OrganizationStays'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/OrganizationNotDeleted'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/members:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: listOrganizationMembers
      summary: List an organization's members
      description: >-
        Return one page of the organization's members, in the order they
        joined. Any member can read it. A missing cursor starts at the first
        page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [organizations:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of members.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/OrganizationMemberPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/members/{personId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: './common.yaml#/components/parameters/PersonId'
    patch:
      tags: [Organizations]
      operationId: updateOrganizationMember
      summary: Change a member's role
      description: >-
        Give a member of the organization another role. An owner or an admin
        changes anybody between admin and member. Only an owner makes
        somebody an owner, or changes an owner's role, their own included,
        and the organization always keeps an owner: the last one cannot step
        down. A person's own organization keeps exactly its one owner. The
        members list says which roles the caller may give each member, as
        assignableRoles. A repeated request with the same Idempotency-Key
        and body returns the first result.
      security:
        - webSession: []
        - appOAuth: [organizations:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationMemberRequest'
            examples:
              owner:
                value:
                  role: owner
      responses:
        '200':
          description: The member, with their new role.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberResponse'
              examples:
                owner:
                  $ref: '#/components/examples/PromotedOrganizationMember'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/PersonNotFound'
        '409':
          $ref: '#/components/responses/OwnerStays'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    delete:
      tags: [Organizations]
      operationId: removeOrganizationMember
      summary: Remove a member, or leave an organization
      description: >-
        End somebody's membership of the organization. An owner or an admin
        of it can remove anybody whose membership can end, and any such
        member can leave by naming themselves or `me`. The owner stays, so
        nobody leaves their own organization, and so does somebody this
        OpenBot's settings keep as an admin of it. The person keeps their account and their
        other organizations, and what they made here stays here. Removing
        somebody who is not a member answers the same as removing one.
      security:
        - webSession: []
        - appOAuth: [organizations:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '204':
          description: They are not a member.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OwnerStays'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/invitations:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: listOrganizationInvitations
      summary: List the invitations an organization has sent
      description: >-
        Return one page of the organization's invitations that have not been
        accepted or canceled, the newest first: the ones still waiting, the
        ones that expired and the ones that were declined. Only an owner or an
        admin of this organization can read it. A missing cursor starts at the
        first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [organizations:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of invitations.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/OrganizationInvitationPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
    post:
      tags: [Organizations]
      operationId: createOrganizationInvitation
      summary: Invite somebody to an organization
      description: >-
        Invite the person with this email address to join the organization
        with a role. They need no account yet: the invitation waits for
        whoever signs in with that address, and they see it in OpenBot then.
        Where OpenBot can send email, it also emails them; delivery says
        which happened, so the inviter knows whether to pass the link on
        themselves. The invitation lasts seven days. Inviting an address
        again after its invitation expired or was declined starts a new one.
        Only an owner or an admin of this organization can. A repeated
        request with the same Idempotency-Key and body returns the first
        result.
      security:
        - webSession: []
        - appOAuth: [organizations:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationInvitationRequest'
            examples:
              member:
                value:
                  email: sam.ortiz@acme.com
                  role: member
      responses:
        '201':
          description: The invitation was made.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
            Location:
              description: The organization's invitations.
              schema:
                type: string
              example: /api/v2/organizations/Jq3xT9mLw2Vb8RnC5sYd0fKe/invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationResponse'
              examples:
                invited:
                  $ref: '#/components/examples/CreatedOrganizationInvitation'
        '400':
          $ref: '#/components/responses/InvalidOrganizationInvitation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: './common.yaml#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OrganizationInvitationConflict'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Organizations]
      operationId: cancelOrganizationInvitation
      summary: Cancel an invitation
      description: >-
        Take back an invitation the organization sent, whatever state it is
        in. It leaves the organization's list and the invited person's. Only
        an owner or an admin of this organization can.
      security:
        - webSession: []
        - appOAuth: [organizations:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '204':
          description: The invitation is canceled.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationOrInvitationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/people/me/invitations:
    get:
      tags: [Organizations]
      operationId: listInvitations
      summary: List the caller's invitations
      description: >-
        Return one page of the invitations sent to the caller's email address
        that they have not answered, the newest first, each with the
        organization and who invited them. One that ran out of time is listed
        as expired until it is canceled or replaced. A missing cursor starts
        at the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [organizations:read]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of invitations.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/InvitationPageLast'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/people/me/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    get:
      tags: [Organizations]
      operationId: getInvitation
      summary: Read one of the caller's invitations
      description: >-
        Return an invitation sent to the caller's email address, in whatever
        state it is in, so the page a link opens can say what happened to it.
        An invitation sent to another address answers as one that does not
        exist.
      security:
        - webSession: []
        - appOAuth: [organizations:read]
        - apiKey: []
      responses:
        '200':
          description: The invitation.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
              examples:
                waiting:
                  $ref: '#/components/examples/WaitingInvitation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/people/me/invitations/{invitationId}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Organizations]
      operationId: acceptInvitation
      summary: Accept an invitation
      description: >-
        Join the organization the invitation is for, with the role it offers.
        The caller's session keeps working where it was; switch to the new
        organization to work in it. An invitation that expired, was canceled
        or was already answered is refused in words. A repeated request with
        the same Idempotency-Key returns the first result.
      security:
        - webSession: []
        - appOAuth: [organizations:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The caller is now a member of the organization.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
              examples:
                joined:
                  $ref: '#/components/examples/JoinedOrganization'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          $ref: '#/components/responses/InvitationNotWaiting'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
  /api/v2/people/me/invitations/{invitationId}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Organizations]
      operationId: declineInvitation
      summary: Decline an invitation
      description: >-
        Turn the invitation down. It leaves the caller's list, and the
        organization sees that it was declined. A repeated request with the
        same Idempotency-Key returns the first result.
      security:
        - webSession: []
        - appOAuth: [organizations:write]
        - apiKey: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The invitation is declined.
          headers:
            Cache-Control:
              $ref: './common.yaml#/components/headers/PrivateNoStore'
        '400':
          $ref: './common.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          $ref: '#/components/responses/InvitationNotWaiting'
        '500':
          $ref: './common.yaml#/components/responses/ServerError'
        default:
          $ref: './common.yaml#/components/responses/UnexpectedError'
components:
  parameters:
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: The invitation's id. Opaque.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
  schemas:
    Organization:
      type: object
      description: >-
        One organization, as one of its members sees it. role and active are
        the server's verdicts about the caller.
      required: [id, slug, name, role, active, personal]
      properties:
        personal:
          type: boolean
          description: >-
            Whether this is the caller's own organization: the one OpenBot
            made for them when they first signed in.
        id:
          type: string
          description: The organization's id. Opaque.
        slug:
          type: string
          description: Its short name, which also addresses it.
        name:
          type: string
          description: What people call it.
        role:
          $ref: './common.yaml#/components/schemas/PersonRoleAnswer'
        active:
          type: boolean
          description: >-
            Whether the caller is working in this one: the organization their
            session works in, or for an app's token the one its
            OpenBot-Organization header names, else the caller's own. Always
            false for a request made with an API key.
    OrganizationPage:
      type: object
      required: [organizations, canCreate, nextCursor]
      properties:
        organizations:
          type: array
          description: The one the caller joined first at the top.
          items:
            $ref: '#/components/schemas/Organization'
        canCreate:
          type: boolean
          description: >-
            Whether the caller may create another organization: the server's
            verdict, true for anybody signed in where OpenBot keeps more than
            one organization. The same on every page.
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    OrganizationResponse:
      type: object
      required: [organization]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: What people call it.
        slug:
          type: string
          minLength: 2
          maxLength: 48
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: >-
            Its short name: lowercase letters, digits and single hyphens.
            Unique in the install. Made from the name when absent.
    OrganizationMember:
      type: object
      description: One member of an organization.
      required: [id, email, name, image, role, joinedAt, removable, assignableRoles]
      properties:
        removable:
          type: boolean
          description: >-
            Whether this membership can end: an admin can remove them and
            they can leave. The server's verdict. False for the
            organization's last owner, who stays in it, for the owner of
            their own organization, and for somebody this OpenBot's settings
            keep as an admin of the organization.
        assignableRoles:
          type: array
          description: >-
            The roles the caller may give this member, their current one left
            out. The server's verdict. Empty when the caller may not change
            this member's role.
          items:
            $ref: './common.yaml#/components/schemas/PersonRoleAnswer'
        id:
          type: string
          description: The person's id.
        email:
          type: string
          description: Their address.
        name:
          type: [string, 'null']
          description: What OpenBot calls them. Null until they choose.
        image:
          type: [string, 'null']
          description: Their picture's address, when they have one.
        role:
          $ref: './common.yaml#/components/schemas/PersonRoleAnswer'
        joinedAt:
          type: string
          format: date-time
          description: When they became a member.
    OrganizationMemberPage:
      type: object
      required: [members, nextCursor]
      properties:
        members:
          type: array
          description: In the order they joined.
          items:
            $ref: '#/components/schemas/OrganizationMember'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    OrganizationMemberResponse:
      type: object
      required: [member]
      properties:
        member:
          $ref: '#/components/schemas/OrganizationMember'
    UpdateOrganizationMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: './common.yaml#/components/schemas/PersonRole'
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\x00]*[^\s\x00][^\x00]*$
          description: What people call it.
    InvitationSender:
      type: object
      description: Who sent an invitation.
      required: [name, email]
      properties:
        name:
          type: [string, 'null']
          description: What OpenBot calls them. Null until they choose.
        email:
          type: string
          description: Their address.
    OrganizationInvitation:
      type: object
      description: >-
        An invitation an organization sent, as its admins see it. status is
        the server's verdict.
      required: [id, email, role, status, invitedBy, createdAt, expiresAt]
      properties:
        id:
          type: string
          description: The invitation's id. Opaque.
        email:
          type: string
          description: The address it was sent to.
        role:
          $ref: './common.yaml#/components/schemas/AssignableRole'
        status:
          type: string
          x-extensible-enum: [pending, expired, declined]
          description: >-
            pending while it waits for an answer, expired once its seven days
            ran out, declined when the person turned it down.
        invitedBy:
          $ref: '#/components/schemas/InvitationSender'
        createdAt:
          type: string
          format: date-time
          description: When it was sent.
        expiresAt:
          type: string
          format: date-time
          description: When it stops being accepted.
    OrganizationInvitationPage:
      type: object
      required: [invitations, nextCursor]
      properties:
        invitations:
          type: array
          description: The newest first.
          items:
            $ref: '#/components/schemas/OrganizationInvitation'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    OrganizationInvitationResponse:
      type: object
      required: [invitation, delivery]
      properties:
        invitation:
          $ref: '#/components/schemas/OrganizationInvitation'
        delivery:
          type: string
          enum: [emailed, link]
          description: >-
            How the person hears of it. emailed when OpenBot sent them an
            email. link when it could not or is not set up to, so the inviter
            passes the invitation's link on themselves. Either way the person
            sees the invitation in OpenBot when they sign in.
    CreateOrganizationInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          pattern: ^[^\s\x00]+@[^\s\x00]+$
          description: The address of the person to invite.
        role:
          $ref: './common.yaml#/components/schemas/AssignableRole'
    Invitation:
      type: object
      description: >-
        An invitation as the person it was sent to sees it. status is the
        server's verdict.
      required: [id, organization, role, status, invitedBy, createdAt, expiresAt]
      properties:
        id:
          type: string
          description: The invitation's id. Opaque.
        organization:
          type: object
          description: The organization it is an invitation to.
          required: [id, slug, name]
          properties:
            id:
              type: string
              description: The organization's id. Opaque.
            slug:
              type: string
              description: Its short name.
            name:
              type: string
              description: What people call it.
        role:
          $ref: './common.yaml#/components/schemas/AssignableRole'
        status:
          type: string
          x-extensible-enum: [pending, expired, accepted, declined, canceled]
          description: >-
            pending while it can still be answered. expired once its seven
            days ran out, accepted or declined once the person answered,
            canceled when the organization took it back.
        invitedBy:
          $ref: '#/components/schemas/InvitationSender'
        createdAt:
          type: string
          format: date-time
          description: When it was sent.
        expiresAt:
          type: string
          format: date-time
          description: When it stops being accepted.
    InvitationPage:
      type: object
      required: [invitations, nextCursor]
      properties:
        invitations:
          type: array
          description: The newest first.
          items:
            $ref: '#/components/schemas/Invitation'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    InvitationResponse:
      type: object
      required: [invitation]
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
  responses:
    InvalidOrganization:
      description: The name or the slug is missing or malformed, or the Idempotency-Key is.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            name:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: A name of 1 to 100 characters is required.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    OrganizationConflict:
      description: >-
        Another organization has that slug. Or the Idempotency-Key was used
        for a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            slugTaken:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: Another organization already uses that slug. Choose another.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    OrganizationNotCreated:
      description: >-
        This OpenBot could not finish setting the organization up, so it was
        not created. Nothing of it is left behind.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            unfinished:
              value:
                type: https://open.bot/errors/service-unavailable
                title: A service OpenBot depends on is unavailable.
                status: 503
                detail: The organization couldn't be set up, so it wasn't created. Try again.
                code: SERVICE_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    OwnerOnly:
      description: >-
        The caller is not an owner of the organization, or holds no role in
        it.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            notOwner:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only an owner can delete this organization.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    OrganizationStays:
      description: >-
        The organization can't be deleted: it is a person's own organization,
        or it is `default`. Or the Idempotency-Key was used for a different
        request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            personal:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: This is your own organization, so it stays. You can delete organizations you created.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            default:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: This organization comes with OpenBot, so it stays.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    OrganizationNotDeleted:
      description: >-
        This OpenBot could not finish deleting the organization, so it was
        not deleted. Asking again may work.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            unfinished:
              value:
                type: https://open.bot/errors/service-unavailable
                title: A service OpenBot depends on is unavailable.
                status: 503
                detail: The organization couldn't be deleted. Try again.
                code: SERVICE_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    OwnerStays:
      description: >-
        The person stays in the organization: they own it, or this OpenBot's
        settings keep them as an admin of it. The members list says who, as
        removable.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            owner:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: They own this organization, so they stay a member of it.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    OrganizationOrInvitationNotFound:
      description: >-
        The organization does not exist or is not visible to the caller, or
        it has no such invitation.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            organization:
              value:
                type: https://open.bot/errors/organization-not-found
                title: Organization not found.
                status: 404
                detail: Couldn't find that organization.
                code: ORGANIZATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
            invitation:
              value:
                type: https://open.bot/errors/invitation-not-found
                title: Invitation not found.
                status: 404
                detail: Couldn't find that invitation.
                code: INVITATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvitationNotFound:
      description: >-
        There is no such invitation, or it was sent to another address.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            invitation:
              value:
                type: https://open.bot/errors/invitation-not-found
                title: Invitation not found.
                status: 404
                detail: Couldn't find that invitation. Check that you're signed in with the address it was sent to.
                code: INVITATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvitationNotWaiting:
      description: >-
        The invitation expired, was canceled or was already answered. Or the
        Idempotency-Key was used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            expired:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: This invitation has expired. Ask whoever invited you to send a new one.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidOrganizationInvitation:
      description: The address or the role is missing or malformed, or the Idempotency-Key is.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            role:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: A role of admin or member is required.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    OrganizationInvitationConflict:
      description: >-
        They are already a member, or already have an invitation waiting. Or
        the Idempotency-Key was used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/Problem'
          examples:
            already:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: They're already a member of this organization.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            invited:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: They already have an invitation waiting. Cancel it to send a new one.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
