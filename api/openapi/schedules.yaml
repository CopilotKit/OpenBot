        "200":
          description: The secret.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalTriggerSecret"
              examples:
                answer:
                  $ref: "#/components/examples/GoalTriggerSecretExample"
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/GoalTriggerNotFound"
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/goals/{goalId}/triggers/{goalTriggerId}/replace-secret:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/GoalId"
      - $ref: "#/components/parameters/GoalTriggerId"
    post:
      tags:
        - Goals
      operationId: replaceGoalTriggerSecret
      summary: Replace a trigger's secret
      description: Replace a trigger's secret. With no secret sent, OpenBot makes a
        new one for a webhook or GitHub trigger and answers it once; with one,
        it stores the secret pasted from the provider. The old secret stops
        working at once.
      security:
        - webSession: []
        - appOAuth:
            - goals:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGoalTriggerSecretRequest"
            examples:
              request:
                value: {}
      responses:
        "200":
          description: The trigger, and its new secret when OpenBot made one.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalTriggerWithSecret"
              examples:
                answer:
                  $ref: "#/components/examples/GoalTriggerWithSecretExample"
        "400":
          $ref: "#/components/responses/InvalidGoal"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/GoalTriggerNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/github-event-sources:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
    get:
      tags:
        - Goals
      operationId: listGithubEventSources
      summary: List GitHub event sources
      description: Return one page of the GitHub repositories whose events reach the
        caller's goals, oldest first. Never a webhook secret. A missing cursor
        starts at the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth:
            - goals:read
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/Limit
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: One page of GitHub event sources.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubEventSourcePage"
              examples:
                answer:
                  $ref: "#/components/examples/GithubEventSourcePageExample"
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./common.yaml#/components/responses/OrganizationNotFound
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
    post:
      tags:
        - Goals
      operationId: createGithubEventSource
      summary: Connect a GitHub repository's events
      description: "Connect a GitHub repository's webhook to the caller's goals. The
        secret is the one set on the repository's webhook: it is stored
        encrypted and never returned. The answer names the address to give
        GitHub."
      security:
        - webSession: []
        - appOAuth:
            - goals:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGithubEventSourceRequest"
            examples:
              request:
                value:
                  repository: acme/storefront
                  secret: example-secret
      responses:
        "201":
          description: The GitHub event source.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubEventSourceResponse"
              examples:
                answer:
                  $ref: "#/components/examples/GithubEventSourceResponseExample"
        "400":
          $ref: "#/components/responses/InvalidGoal"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./common.yaml#/components/responses/OrganizationNotFound
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/github-event-sources/{githubEventSourceId}:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/GithubEventSourceId"
    delete:
      tags:
        - Goals
      operationId: deleteGithubEventSource
      summary: Disconnect a GitHub repository's events
      description: Disconnect a GitHub repository's events and revoke its stored
        webhook secret.
      security:
        - webSession: []
        - appOAuth:
            - goals:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "204":
          description: The source was disconnected.
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/GithubEventSourceNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/bots/{botId}/follow-ups/{followUpId}/cancel:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: ./bots.yaml#/components/parameters/BotId
      - $ref: "#/components/parameters/FollowUpId"
    post:
      tags:
        - Follow-ups
      operationId: cancelFollowUp
      summary: Cancel a follow-up
      description: Cancel a follow-up a Bot scheduled for the caller, so the Bot does
        not come back to it. One that already ran, or was cancelled already, is
        not found.
      security:
        - webSession: []
        - appOAuth:
            - bots:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: The follow-up was cancelled.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUpCancelled"
              examples:
                answer:
                  $ref: "#/components/examples/FollowUpCancelledExample"
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/FollowUpNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
components:
  parameters:
    RoutineId:
      name: routineId
      in: path
      required: true
      description: The routine's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    CheckInId:
      name: checkInId
      in: path
      required: true
      description: The check-in's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    CheckInItemId:
      name: checkInItemId
      in: path
      required: true
      description: The item's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    GoalId:
      name: goalId
      in: path
      required: true
      description: The goal's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    GoalTriggerId:
      name: goalTriggerId
      in: path
      required: true
      description: The trigger's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    GithubEventSourceId:
      name: githubEventSourceId
      in: path
      required: true
      description: The GitHub event source's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    FollowUpId:
      name: followUpId
      in: path
      required: true
      description: The follow-up's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
  schemas:
    Routine:
      type: object
      description: "One of a person's routines. schedule is display text and never a
        value to parse: words for the schedules OpenBot can describe, the five
        cron fields for anything stranger. nextRunAt is the one time to rely
        on."
      required:
        - id
        - botId
        - schedule
        - cron
        - timezone
        - instruction
        - title
        - conversation
        - enabled
        - nextRunAt
        - lastRun
        - goalId
        - createdAt
      properties:
        id:
          type: string
          description: The routine's id.
        botId:
          type: string
          description: The Bot that carries it out.
        schedule:
          type: string
          description: When it runs, as text to show.
        cron:
          type: string
          description: "The schedule as it is kept, five cron fields: minute, hour, day
            of month, month, day of week. What a form that changes the schedule
            starts from."
        timezone:
          type: string
          description: The IANA time zone the schedule is read in.
        instruction:
          type: string
          description: What the Bot does on each run.
        title:
          type:
            - string
            - "null"
          description: What the person called it, or null when they named it nothing.
        conversation:
          $ref: "#/components/schemas/RoutineConversation"
        enabled:
          type: boolean
          description: False while it is paused. A paused routine never runs.
        nextRunAt:
          type: string
          format: date-time
          description: When it runs next, if it is on.
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/RoutineLastRun"
            - type: "null"
          description: Its newest run, or null when it has never run.
        goalId:
          type:
            - string
            - "null"
          description: The goal it runs, or null when it runs none.
        createdAt:
          type: string
          format: date-time
          description: When it was made.
    RoutineConversation:
      type: object
      description: Where a routine posts.
      required:
        - id
        - name
        - title
        - gone
      properties:
        id:
          type: string
          description: The conversation's id.
        name:
          type:
            - string
            - "null"
          description: The names of the Bots in it, or null when the conversation is gone
            entirely.
        title:
          type:
            - string
            - "null"
          description: The conversation as the sidebar titles it, which is what a person
            knows it by. Null when it is gone entirely.
        gone:
          type: boolean
          description: Whether the conversation was deleted. Such a routine is shown, not
            hidden.
    RoutineLastRun:
      type: object
      required:
        - status
        - at
      properties:
        status:
          type:
            - string
            - "null"
          x-extensible-enum:
            - succeeded
            - failed
            - skipped
            - waiting
          description: How it ended, or null while it is still open. Only failed is a
            failure.
        at:
          type:
            - string
            - "null"
          format: date-time
          description: When it finished, or null while it is still open.
    RoutinePage:
      type: object
      required:
        - routines
        - nextCursor
      properties:
        routines:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/Routine"
        nextCursor: &a2
          type:
            - string
            - "null"
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    CreateRoutineRequest:
      type: object
      additionalProperties: false
      required:
        - botId
        - instruction
        - cron
        - conversationId
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The Bot that carries it out.
        conversationId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: A conversation the caller and the Bot share, where it posts.
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
          description: What the Bot does on each run. At most 2,000 characters.
        title:
          type: string
          description: What to call it. At most 100 characters.
          maxLength: 100
        cron:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: "The schedule, as five cron fields: minute, hour, day of month,
            month, day of week. At most once an hour."
        timezone:
          type: string
          description: The IANA time zone the schedule is read in. UTC when absent.
          maxLength: 100
        goalId:
          type: string
          description: The goal this routine runs, when it runs one.
          maxLength: 200
    UpdateRoutineRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: What to change. Only the fields sent change, and at least one must
        be sent.
      properties:
        title:
          type: string
          description: A new name, at most 100 characters. Empty takes the name away, and
            the routine is called by what it does.
          maxLength: 100
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
          description: What the Bot does on each run from now on. At most 2,000
            characters.
        cron:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: "A new schedule, as five cron fields: minute, hour, day of month,
            month, day of week. The same rules as a new routine's."
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          description: A new IANA time zone to read the schedule in.
    RoutineResponse:
      type: object
      required:
        - routine
      properties:
        routine:
          $ref: "#/components/schemas/Routine"
    RoutineSwitch:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether the routine is on now.
    RoutineRunAccepted:
      type: object
      required:
        - accepted
        - runId
      properties:
        accepted:
          type: boolean
          const: true
        runId:
          type: string
          description: The run that was started.
    RoutineRun:
      type: object
      description: One run of a routine. What the Bot said is in the routine's
        conversation and is not kept here.
      required:
        - id
        - status
        - startedAt
        - finishedAt
        - error
        - source
      properties:
        id:
          type: string
          description: The run's id.
        status:
          type: string
          x-extensible-enum:
            - running
            - succeeded
            - failed
            - skipped
            - waiting
          description: running until it ends; waiting while it waits on the person, for an
            approval or an answer.
        startedAt:
          type: string
          format: date-time
          description: When it started.
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When it ended, or null while it runs.
        error:
          type:
            - string
            - "null"
          description: Why it failed or was skipped, or null.
        source:
          type: string
          enum:
            - schedule
            - run_now
            - trigger
          description: "What started it: the schedule, a person's Run now, or an event."
    RoutineRunPage:
      type: object
      required:
        - runs
        - nextCursor
      properties:
        runs:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/RoutineRun"
        nextCursor: *a2
    LastCheckIn:
      type: object
      description: "A check-in's newest run: how it ended and, for one that was
        skipped or could not finish, why, in one sentence written for the
        person."
      required:
        - outcome
        - trigger
        - skipReason
        - why
        - itemsRaised
        - startedAt
        - finishedAt
      properties:
        outcome:
          type: string
          enum:
            - running
            - quiet
            - raised
            - failed
            - skipped
          description: quiet found nothing; raised opened at least one item; skipped never
            looked.
        trigger:
          type: string
          enum:
            - schedule
            - run_now
          description: What started it.
        skipReason:
          oneOf:
            - $ref: "#/components/schemas/CheckInSkipReason"
            - type: "null"
        why:
          type:
            - string
            - "null"
          description: One sentence on why it was skipped or could not finish, or null.
        itemsRaised:
          type: integer
          minimum: 0
          description: How many items it raised.
        startedAt:
          type: string
          format: date-time
          description: When it started.
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When it ended, or null while it runs.
    CheckInSkipReason:
      type: string
      enum: &a3
        - off_admin
        - off_person
        - paused
        - capped
        - unreachable
        - no_sources
        - busy
      description: "Why a check-in was skipped before the Bot looked: an administrator
        or the person turned check-ins off, the Bot is paused, it used its
        check-ins for the day, the Bot or its conversation is no longer
        reachable, there is nothing connected for it to read, or another
        check-in was still running."
    CheckIn:
      type: object
      description: One thing a Bot checks in on for a person, and how often.
      required:
        - id
        - botId
        - conversationId
        - focus
        - subject
        - sourceLink
        - enabled
        - intervalMinutes
        - nextRunAt
        - lastRunAt
        - lastStatus
        - lastError
        - lastRun
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: The check-in's id.
        botId:
          type: string
          description: The Bot that checks in.
        conversationId:
          type: string
          description: The conversation the check-in belongs to.
        focus:
          type: string
          description: What to look for, in the person's words. May be empty.
        subject:
          type: string
          description: What it watches, in the person's words. Empty for one that watches
            everything the Bot reads.
        sourceLink:
          type:
            - string
            - "null"
          description: The link it watches, or null.
        enabled:
          type: boolean
          description: False while it is paused.
        intervalMinutes:
          type: integer
          minimum: 60
          maximum: 1440
          description: How often it runs, in minutes.
        nextRunAt:
          type: string
          format: date-time
          description: When it runs next, if it is on.
        lastRunAt:
          type:
            - string
            - "null"
          format: date-time
          description: When it last ran, or null.
        lastStatus:
          type: string
          x-extensible-enum:
            - idle
            - running
            - succeeded
            - error
        lastError:
          type:
            - string
            - "null"
          description: What stopped its last run, or null.
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/LastCheckIn"
            - type: "null"
          description: Its newest check-in, or null before the first.
        createdAt:
          type: string
          format: date-time
          description: When it was turned on first.
        updatedAt:
          type: string
          format: date-time
          description: When it last changed.
    CheckInPage:
      type: object
      required:
        - checkIns
        - nextCursor
        - allowed
      properties:
        checkIns:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/CheckIn"
        allowed:
          type: boolean
          description: False when an administrator turned check-ins off for the caller, so
            the caller's own switches can say who turned them off.
        nextCursor: *a2
    CreateCheckInRequest:
      type: object
      additionalProperties: false
      required:
        - botId
        - conversationId
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
          description: The Bot that checks in.
        conversationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
          description: A conversation the caller and the Bot share.
        focus:
          type: string
          description: What to look for.
          maxLength: 1000
          default: ""
        subject:
          type: string
          description: What it watches, in a few words.
          maxLength: 120
          default: ""
        sourceLink:
          type:
            - string
            - "null"
          format: uri
          maxLength: 2000
          pattern: ^https?://
          description: A web link it watches.
        intervalMinutes:
          type: integer
          minimum: 60
          maximum: 1440
          default: 1440
          description: "How often it runs, in minutes: hourly at most, daily at least."
        enabled:
          type: boolean
          default: true
    UpdateCheckInRequest:
      type: object
      additionalProperties: false
      properties:
        focus:
          type: string
          description: What to look for.
          maxLength: 1000
        intervalMinutes:
          type: integer
          minimum: 60
          maximum: 1440
          description: How often it runs, in minutes.
        enabled:
          type: boolean
          description: False pauses it; true resumes it.
    CheckInResponse:
      type: object
      required:
        - checkIn
      properties:
        checkIn:
          $ref: "#/components/schemas/CheckIn"
    CheckInRunAnswer:
      type: object
      description: "What Run now did: queued, or skipped at once with the reason and
        its sentence."
      required:
        - queued
      properties:
        queued:
          type: boolean
          description: Whether a check-in was queued.
        skipped:
          $ref: "#/components/schemas/CheckInSkipReason"
        why:
          type: string
          description: Why it was skipped, in one sentence. Present when skipped.
    CheckInItem:
      type: object
      description: "Something a Bot's check-in found that needs the person: what it
        is, why, and where the Bot read it."
      required:
        - id
        - botId
        - checkInId
        - title
        - detail
        - sourceApp
        - sourceRef
        - sourceLink
        - status
        - pingId
        - deliveredAt
        - resolvedAt
        - createdAt
      properties:
        id:
          type: string
          description: The item's id.
        botId:
          type: string
          description: The Bot that raised it.
        checkInId:
          type: string
          description: The check-in that found it.
        title:
          type: string
          description: What to do, in plain words.
        detail:
          type: string
          description: Why it was raised and what the Bot found.
        sourceApp:
          type:
            - string
            - "null"
          description: The app the Bot read it in, or null.
        sourceRef:
          type:
            - string
            - "null"
          description: What the Bot read it with, or null.
        sourceLink:
          type:
            - string
            - "null"
          description: Where it can be opened, or null.
        status:
          type: string
          x-extensible-enum:
            - open
            - dismissed
            - started
            - superseded
          description: "open until the person starts or hides it. superseded is the Bot's
            own: a later check-in cleared it as no longer needed."
        pingId:
          type:
            - string
            - "null"
          description: The notice that told the person about it, or null while it waits
            for their next one.
        deliveredAt:
          type:
            - string
            - "null"
          format: date-time
          description: When that notice went out, or null.
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When it was started, hidden or cleared.
        createdAt:
          type: string
          format: date-time
          description: When it was raised.
    CheckInItemPage:
      type: object
      required:
        - checkInItems
        - nextCursor
      properties:
        checkInItems:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/CheckInItem"
        nextCursor: *a2
    CheckInItemResponse:
      type: object
      required:
        - checkInItem
      properties:
        checkInItem:
          $ref: "#/components/schemas/CheckInItem"
    StartedCheckInItem:
      type: object
      required:
        - checkInItem
        - task
      properties:
        checkInItem:
          $ref: "#/components/schemas/CheckInItem"
        task:
          type: object
          description: The task the item became.
          required:
            - id
            - conversationId
          properties:
            id:
              type: string
              description: The task's id.
            conversationId:
              type: string
              description: The task's own conversation.
    CheckInUsage:
      type: object
      description: How check-ins are going, per Bot. Counts only.
      required:
        - days
        - dailyRuns
        - bots
        - pings
      properties:
        days:
          type: integer
          enum:
            - 7
            - 30
        dailyRuns:
          type: integer
          description: How many check-ins a Bot may run for one person in a day.
        bots:
          type: array
          items:
            $ref: "#/components/schemas/BotCheckInUsage"
        pings:
          type: object
          description: Notices sent. One notice folds every Bot's items for a person, so
            they are counted once for everybody.
          required:
            - sent
            - itemsPerPing
          properties:
            sent:
              type: integer
              minimum: 0
            itemsPerPing:
              type:
                - number
                - "null"
              description: Items per notice, or null when none was sent.
    BotCheckInUsage:
      type: object
      required:
        - botId
        - name
        - avatarSeed
        - peopleOn
        - runs
        - items
        - acceptance
        - pinged
      properties:
        botId:
          type: string
          description: The Bot.
        name:
          type: string
          description: What the Bot is called.
        avatarSeed:
          type: string
          description: What the Bot's picture is drawn from.
        peopleOn:
          type: integer
          minimum: 0
          description: People with check-ins on for this Bot.
        runs:
          type: object
          required:
            - quiet
            - raised
            - failed
            - skipped
          properties:
            quiet:
              type: integer
              minimum: 0
            raised:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            skipped:
              type: object
              description: Skipped check-ins, by reason.
              required: *a3
              properties:
                off_admin:
                  type: integer
                  minimum: 0
                off_person:
                  type: integer
                  minimum: 0
                paused:
                  type: integer
                  minimum: 0
                capped:
                  type: integer
                  minimum: 0
                unreachable:
                  type: integer
                  minimum: 0
                no_sources:
                  type: integer
                  minimum: 0
                busy:
                  type: integer
                  minimum: 0
        items:
          type: object
          description: The items it raised in the window, by where each stands now. raised
            is the sum of the other four.
          required:
            - raised
            - started
            - hidden
            - cleared
            - open
          properties:
            raised:
              type: integer
              minimum: 0
            started:
              type: integer
              minimum: 0
            hidden:
              type: integer
              minimum: 0
            cleared:
              type: integer
              minimum: 0
            open:
              type: integer
              minimum: 0
        acceptance:
          type:
            - number
            - "null"
          description: "Of the items people decided on, the share they started: started
            divided by started plus hidden. Null until somebody decided one."
        pinged:
          type: integer
          minimum: 0
          description: This Bot's items that a notice carried.
    GoalSubscription:
      type: object
      additionalProperties: false
      description: A kind of event that wakes the goal.
      required:
        - source
        - eventType
      properties:
        source:
          type: string
          enum:
            - manual
            - slack
            - github
            - schedule
            - connector
            - webhook
            - linear
            - sentry
            - pagerduty
            - email
        eventType:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
    Goal:
      type: object
      description: An outcome a Bot works toward for a person.
      required:
        - id
        - botId
        - conversationId
        - threadId
        - title
        - instruction
        - successCriteria
        - status
        - progress
        - lastResult
        - subscriptions
        - recurring
        - endsWhenMet
        - createdAt
        - updatedAt
        - completedAt
      properties:
        id:
          type: string
          description: The goal's id.
        botId:
          type: string
          description: The Bot that works on it.
        conversationId:
          type: string
          description: The conversation it belongs to.
        threadId:
          type: string
          description: The thread its runs are kept in.
        title:
          type: string
          description: What the goal is called.
        instruction:
          type: string
          description: What the Bot is to do.
        successCriteria:
          type: string
          description: When it is done. May be empty.
        status:
          type: string
          x-extensible-enum:
            - active
            - paused
            - completed
        progress:
          type: string
          description: Where it stands, as the Bot last recorded it.
        lastResult:
          type:
            - string
            - "null"
          description: What its newest run said, or null.
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/GoalSubscription"
        recurring:
          type: boolean
          description: Done again and again, and never finished by one run.
        endsWhenMet:
          type: boolean
          description: A run that meets the success criteria completes it.
        createdAt:
          type: string
          format: date-time
          description: When it was made.
        updatedAt:
          type: string
          format: date-time
          description: When it last changed.
        completedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When it was completed, or null.
    GoalPage:
      type: object
      required:
        - goals
        - nextCursor
      properties:
        goals:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/Goal"
        nextCursor: *a2
    CreateGoalRequest:
      type: object
      additionalProperties: false
      required:
        - botId
        - conversationId
        - title
        - instruction
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
          description: The Bot that works on it.
        conversationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
          description: A conversation the caller and the Bot share.
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: \S
          description: What the goal is called.
        instruction:
          type: string
          minLength: 1
          maxLength: 6000
          pattern: \S
          description: What the Bot is to do.
        successCriteria:
          type: string
          description: When it is done.
          maxLength: 3000
          default: ""
        subscriptions:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: "#/components/schemas/GoalSubscription"
        recurring:
          type: boolean
          default: false
        endsWhenMet:
          type: boolean
          default: false
    UpdateGoalRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: \S
          description: What the goal is called.
        instruction:
          type: string
          minLength: 1
          maxLength: 6000
          pattern: \S
          description: What the Bot is to do.
        successCriteria:
          type: string
          description: When it is done.
          maxLength: 3000
        subscriptions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/GoalSubscription"
        recurring:
          type: boolean
        endsWhenMet:
          type: boolean
    GoalResponse:
      type: object
      required:
        - goal
      properties:
        goal:
          $ref: "#/components/schemas/Goal"
        sharedApps:
          $ref: ./bots.yaml#/components/schemas/SharedAppsAfterChange
    GoalRunAccepted:
      type: object
      required:
        - eventId
        - duplicate
        - runIds
      properties:
        eventId:
          type: string
          description: The request, as the goal's event log keeps it.
        duplicate:
          type: boolean
          description: Whether this request had been taken already.
        runIds:
          type: array
          description: The runs it started.
          items:
            type: string
    GoalRun:
      type: object
      description: One run of a goal, with what the Bot said.
      required:
        - id
        - status
        - replyText
        - error
        - waiting
        - startedAt
        - finishedAt
        - createdAt
      properties:
        id:
          type: string
          description: The run's id.
        status:
          type: string
          x-extensible-enum:
            - queued
            - running
            - waiting
            - succeeded
            - failed
            - skipped
        replyText:
          type:
            - string
            - "null"
          description: What the Bot said, or null.
        error:
          type:
            - string
            - "null"
          description: Why it failed or was skipped, or null.
        waiting:
          oneOf:
            - type: object
              description: What the run waits on the person for.
              required:
                - kind
              properties:
                kind:
                  type: string
                  description: What kind of answer it waits for.
                requestId:
                  type: string
                  description: The approval or question it waits on.
              additionalProperties: true
            - type: "null"
        startedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When it started, or null while queued.
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When it ended, or null.
        createdAt:
          type: string
          format: date-time
          description: When it was asked for.
    GoalRunPage:
      type: object
      required:
        - runs
        - nextCursor
      properties:
        runs:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/GoalRun"
        nextCursor: *a2
    GoalTriggerFilter:
      type: object
      additionalProperties: false
      description: Which of the events this kind delivers fire the trigger.
      properties:
        eventTypes:
          type: array
          maxItems: 20
          default: []
          description: "Event types that fire the trigger. Empty means every event. A type
            matches itself and its sub-types: issues matches issues.opened."
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: \S
        field:
          type: object
          additionalProperties: false
          required:
            - path
            - equals
          description: One field of the event that must equal a value.
          properties:
            path:
              type: string
              pattern: ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+){0,7}$
              description: A dotted path into the event, such as data.team.key.
            equals:
              type: string
              minLength: 1
              maxLength: 256
              pattern: \S
    GoalTriggerConfig:
      description: What a trigger listens for, by its kind.
      oneOf:
        - $ref: "#/components/schemas/WebhookTriggerConfig"
        - $ref: "#/components/schemas/GithubTriggerConfig"
        - $ref: "#/components/schemas/LinearTriggerConfig"
        - $ref: "#/components/schemas/SentryTriggerConfig"
        - $ref: "#/components/schemas/PagerdutyTriggerConfig"
        - $ref: "#/components/schemas/EmailTriggerConfig"
        - $ref: "#/components/schemas/SlackTriggerConfig"
      discriminator:
        propertyName: kind
        mapping:
          webhook: "#/components/schemas/WebhookTriggerConfig"
          github: "#/components/schemas/GithubTriggerConfig"
          linear: "#/components/schemas/LinearTriggerConfig"
          sentry: "#/components/schemas/SentryTriggerConfig"
          pagerduty: "#/components/schemas/PagerdutyTriggerConfig"
          email: "#/components/schemas/EmailTriggerConfig"
          slack: "#/components/schemas/SlackTriggerConfig"
    WebhookTriggerConfig:
      type: object
      additionalProperties: false
      description: Any service that can send a signed webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: webhook
        filter:
          $ref: "#/components/schemas/GoalTriggerFilter"
    GithubTriggerConfig:
      type: object
      additionalProperties: false
      description: A GitHub webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: github
        repository:
          type: string
          maxLength: 256
          pattern: ^[\w.-]+/[\w.-]+$
          description: The repository, as owner/name. Deliveries for any other are refused.
        filter:
          $ref: "#/components/schemas/GoalTriggerFilter"
    LinearTriggerConfig:
      type: object
      additionalProperties: false
      description: A Linear webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: linear
        filter:
          $ref: "#/components/schemas/GoalTriggerFilter"
    SentryTriggerConfig:
      type: object
      additionalProperties: false
      description: A Sentry webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: sentry
        filter:
          $ref: "#/components/schemas/GoalTriggerFilter"
    PagerdutyTriggerConfig:
      type: object
      additionalProperties: false
      description: A PagerDuty webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: pagerduty
        filter:
          $ref: "#/components/schemas/GoalTriggerFilter"
    EmailTriggerConfig:
      type: object
      additionalProperties: false
      description: An email to the trigger's own address.
      required:
        - kind
      properties:
        kind:
          type: string
          const: email
        allowedSenders:
          type: array
          maxItems: 20
          default: []
          description: Addresses or domains allowed to send. Empty admits any sender.
          items:
            type: string
            minLength: 1
            maxLength: 254
            pattern: \S
        filter:
          $ref: "#/components/schemas/GoalTriggerFilter"
    SlackTriggerConfig:
      type: object
      additionalProperties: false
      description: A Slack message in a workspace where the goal's owner linked their
        own Slack account.
      required:
        - kind
        - teamId
        - mode
      properties:
        kind:
          type: string
          const: slack
        teamId:
          type: string
          pattern: ^[A-Z0-9]{2,32}$
          description: The Slack workspace's id, such as T0123ABCD.
        mode:
          type: string
          enum:
            - mention
            - phrase
            - reaction
            - message
        phrases:
          type: array
          maxItems: 20
          default: []
          description: "For phrase: any one of these, in any case, fires it."
          items:
            type: string
            minLength: 1
            maxLength: 200
            pattern: \S
        reactions:
          type: array
          maxItems: 20
          default: []
          description: "For reaction: emoji names without colons. Empty means any reaction."
          items:
            type: string
            pattern: ^[a-z0-9_+'-]{1,100}$
        channels:
          type: array
          maxItems: 50
          default: []
          description: Slack channel ids. Empty means every channel the Bot is in.
          items:
            type: string
            pattern: ^[CDG][A-Z0-9]{2,32}$
    GoalTrigger:
      type: object
      description: "A registered way for an outside event to start a run of a goal.
        Never its secret: hasSecret says whether one is set."
      required:
        - id
        - goalId
        - kind
        - config
        - hasSecret
        - enabled
        - path
        - address
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: The trigger's id.
        goalId:
          type: string
          description: The goal it starts.
        kind:
          type: string
          enum:
            - webhook
            - github
            - linear
            - sentry
            - pagerduty
            - email
            - slack
        config:
          $ref: "#/components/schemas/GoalTriggerConfig"
        hasSecret:
          type: boolean
        enabled:
          type: boolean
          description: "False while it is off: it acknowledges deliveries and never starts
            a run."
        path:
          type:
            - string
            - "null"
          description: The path on this server the sending service posts to, for webhook
            and provider kinds. Null for email and Slack.
        address:
          type:
            - string
            - "null"
          description: The address to send mail to, for an email trigger where inbound
            email is set up. Null otherwise.
        emailConfigured:
          type: boolean
          description: For an email trigger, whether this OpenBot can receive email at all.
        createdAt:
          type: string
          format: date-time
          description: When it was added.
        updatedAt:
          type: string
          format: date-time
          description: When it last changed.
    GoalTriggerPage:
      type: object
      required:
        - triggers
        - nextCursor
      properties:
        triggers:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/GoalTrigger"
        nextCursor: *a2
    CreateGoalTriggerRequest:
      type: object
      additionalProperties: false
      required:
        - config
      properties:
        config:
          $ref: "#/components/schemas/GoalTriggerConfig"
        secret:
          type: string
          writeOnly: true
          maxLength: 4096
          description: The signing secret pasted from the provider, for kinds whose secret
            the provider makes. Stored encrypted.
    UpdateGoalTriggerRequest:
      type: object
      additionalProperties: false
      required:
        - config
      properties:
        config:
          $ref: "#/components/schemas/GoalTriggerConfig"
    GoalTriggerResponse:
      type: object
      required:
        - trigger
      properties:
        trigger:
          $ref: "#/components/schemas/GoalTrigger"
        sharedApps:
          $ref: ./bots.yaml#/components/schemas/SharedAppsAfterChange
    GoalTriggerWithSecret:
      type: object
      required:
        - trigger
        - secret
      properties:
        trigger:
          $ref: "#/components/schemas/GoalTrigger"
        secret:
          type:
            - string
            - "null"
          description: The secret OpenBot made, shown this once. Null when the secret was
            pasted, or the kind has none.
        sharedApps:
          $ref: ./bots.yaml#/components/schemas/SharedAppsAfterChange
    GoalTriggerSecret:
      type: object
      required:
        - secret
      properties:
        secret:
          type:
            - string
            - "null"
          description: The secret, or null for a kind that has none.
    ReplaceGoalTriggerSecretRequest:
      type: object
      additionalProperties: false
      properties:
        secret:
          type: string
          writeOnly: true
          maxLength: 4096
          description: The provider's new signing secret. Absent has OpenBot make one, for
            a webhook or GitHub trigger.
    GithubEventSource:
      type: object
      description: A GitHub repository whose webhook reaches the person's goals. Never
        its secret.
      required:
        - id
        - source
        - repository
        - createdAt
        - webhookPath
      properties:
        id:
          type: string
          description: The source's id.
        source:
          type: string
          const: github
        repository:
          type: string
          description: The repository, as owner/name.
        createdAt:
          type: string
          format: date-time
          description: When it was connected.
        webhookPath:
          type: string
          description: The path on this server to give the repository's webhook, with the
            source's secret. A client shows it on this server's own address and never
            builds it.
    GithubEventSourcePage:
      type: object
      required:
        - githubEventSources
        - nextCursor
      properties:
        githubEventSources:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/GithubEventSource"
        nextCursor: *a2
    CreateGithubEventSourceRequest:
      type: object
      additionalProperties: false
      required:
        - repository
        - secret
      properties:
        repository:
          type: string
          maxLength: 256
          pattern: ^[\w.-]+/[\w.-]+$
          description: The repository, as owner/name.
        secret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: The secret set on the repository's webhook.
    GithubEventSourceResponse:
      type: object
      required:
        - githubEventSource
      properties:
        githubEventSource:
          $ref: "#/components/schemas/GithubEventSource"
    FollowUpCancelled:
      type: object
      required:
        - cancelled
      properties:
        cancelled:
          type: boolean
          const: true
  responses:
    InvalidRoutine:
      description: A field is missing or out of bounds, the schedule is not five cron
        fields or runs more often than hourly, the Bot is not in that
        conversation, the routine is paused or already running, or the caller
        has 20 routines switched on.
      content:
        application/problem+json:
          schema:
            $ref: ./common.yaml#/components/schemas/Problem
          examples:
            invalid:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Choose when it runs.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    RoutineNotFound:
      description: The routine does not exist or is somebody else's, or the
        organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: ./common.yaml#/components/schemas/Problem
          examples:
            missing:
              value:
                type: https://open.bot/errors/routine-not-found
                title: Routine not found.
                status: 404
                detail: That routine does not exist.
                code: ROUTINE_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidCheckIn:
      description: A field is missing or out of bounds, the Bot or the conversation is
        not one the caller can use, or a check-in is running already or ran in
        the last ten minutes.
      content:
        application/problem+json:
          schema:
            $ref: ./common.yaml#/components/schemas/Problem
          examples:
            invalid:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Invalid settings.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    CheckInConflict:
      description: The Bot already checks in on this and refuseExisting was asked for,
        or the Idempotency-Key was already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: ./common.yaml#/components/schemas/Problem
          examples:
            sameCheckIn:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: This Bot already checks in on this. Give this one a different name, or
                  change that one on its row.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    CheckInNotFound:
      description: The check-in does not exist or is somebody else's, or the
        organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: ./common.yaml#/components/schemas/Problem
          examples:
            missing:
              value:
                type: https://open.bot/errors/check-in-not-found
                title: Check-in not found.
                status: 404
                detail: This could not be found.
                code: CHECK_IN_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    CheckInItemNotFound:
      description: The item does not exist, is somebody else's or is no longer open,
        or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: ./common.yaml#/components/schemas/Problem
          examples:
            missing:
              value:
                type: https://open.bot/errors/check-in-item-not-found
                title: Item not found.
                status: 404
                detail: This could not be found.
                code: CHECK_IN_ITEM_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidGoal:
      description: A field is missing or out of bounds, the Bot or the conversation is
        not one the caller can use, the goal both repeats and ends when met, the
        goal is paused or completed, or a trigger's configuration or secret is
        not one its kind takes.
      content:
        application/problem+json:
          schema:
            $ref: ./common.yaml#/components/schemas/Problem
          examples:
            invalid:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: A goal can't both repeat and end when it's met. Turn one of them off.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    GoalNotFound:
