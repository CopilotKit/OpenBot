# Schedules: routines, check-ins and the items they raise, goals with their triggers and GitHub event sources, and a Bot's follow-ups.
#
# One area of OpenBot's REST API. `bun run api:bundle` joins every area with common.yaml into
# api/openapi.yaml, the file every client and check reads. See api/README.md.
paths:
  /api/v2/organizations/{organizationId}/routines:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
    get:
      tags:
        - Routines
      operationId: listRoutines
      summary: List routines
      description: Return one page of the caller's own routines, newest first. A
        routine that runs a goal names it in goalId. A missing cursor starts at
        the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth:
            - routines:read
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/Limit
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: One page of routines.
          headers: &a1
            Cache-Control:
              $ref: ./common.yaml#/components/headers/PrivateNoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutinePage"
              examples:
                answer:
                  $ref: "#/components/examples/RoutinePageExample"
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./common.yaml#/components/responses/OrganizationNotFound
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
    post:
      tags:
        - Routines
      operationId: createRoutine
      summary: Create a routine
      description: "Create a routine owned by the caller: the Bot carries out the
        instruction on the schedule and posts in the conversation, which must be
        one the caller and the Bot share. With goalId it is the routine that
        runs that goal on a schedule. A person may have 20 routines switched on,
        and a routine runs at most once an hour. updateRoutine changes one. A
        repeated request with the same Idempotency-Key and body returns the
        first result."
      security:
        - webSession: []
        - appOAuth:
            - routines:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoutineRequest"
            examples:
              request:
                value:
                  botId: agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
                  conversationId: 5f0c2a52-3f1e-4a55-9d0a-7f6d2b1c8e90
                  title: Morning brief
                  instruction: Summarize my unread mail and today's calendar.
                  cron: 0 9 * * 1-5
                  timezone: America/New_York
      responses:
        "201":
          description: The routine was created.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineResponse"
              examples:
                answer:
                  $ref: "#/components/examples/RoutineResponseExample"
        "400":
          $ref: "#/components/responses/InvalidRoutine"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./common.yaml#/components/responses/OrganizationNotFound
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/routines/{routineId}:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/RoutineId"
    patch:
      tags:
        - Routines
      operationId: updateRoutine
      summary: Change a routine
      description: "Change one of the caller's routines: its name, what the Bot does,
        its schedule or its time zone. Only the fields sent change. It keeps
        its id, its conversation and its runs. A new schedule or time zone
        follows the same rules as a new routine's, and its next run is worked
        out from now. One that does not exist, or is somebody else's, is not
        found. A repeated request with the same Idempotency-Key and body
        returns the first result."
      security:
        - webSession: []
        - appOAuth:
            - routines:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoutineRequest"
            examples:
              request:
                value:
                  instruction: Summarize my unread mail, today's calendar and the
                    weather.
                  cron: 30 8 * * 1-5
      responses:
        "200":
          description: The routine, as saved.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineResponse"
              examples:
                answer:
                  $ref: "#/components/examples/RoutineResponseExample"
        "400":
          $ref: "#/components/responses/InvalidRoutine"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/RoutineNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
    delete:
      tags:
        - Routines
      operationId: deleteRoutine
      summary: Delete a routine
      description: Delete one of the caller's routines. It never runs again; what its
        runs already said stays in its conversation. One that does not exist, or
        is somebody else's, is not found.
      security:
        - webSession: []
        - appOAuth:
            - routines:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "204":
          description: The routine was deleted.
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/RoutineNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/routines/{routineId}/pause:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/RoutineId"
    post:
      tags:
        - Routines
      operationId: pauseRoutine
      summary: Pause a routine
      description: Switch one of the caller's routines off. A paused routine keeps its
        schedule and never runs, by the schedule or by Run now, until it is
        resumed. Pausing one that is paused already changes nothing.
      security:
        - webSession: []
        - appOAuth:
            - routines:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: The routine, paused.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineSwitch"
              examples:
                answer:
                  $ref: "#/components/examples/RoutineSwitchExample"
        "400":
          $ref: "#/components/responses/InvalidRoutine"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/RoutineNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/routines/{routineId}/resume:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/RoutineId"
    post:
      tags:
        - Routines
      operationId: resumeRoutine
      summary: Resume a routine
      description: Switch one of the caller's routines back on, from its next
        scheduled time. Refused when its goal is complete, when its time zone is
        one OpenBot does not know, or when the caller already has 20 routines
        switched on.
      security:
        - webSession: []
        - appOAuth:
            - routines:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: The routine, switched on.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineSwitch"
              examples:
                answer:
                  $ref: "#/components/examples/RoutineSwitchExample"
        "400":
          $ref: "#/components/responses/InvalidRoutine"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/RoutineNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/routines/{routineId}/run:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/RoutineId"
    post:
      tags:
        - Routines
      operationId: runRoutine
      summary: Run a routine now
      description: "Start one run of the routine now. It does real work: the Bot
        carries out the instruction in the routine's conversation exactly as a
        scheduled run would. Accepted, not finished: the run appears in the
        routine's runs, and what the Bot says appears in the conversation. A
        paused routine is refused, and so is a second run while one is still
        open. Recorded on the audit trail."
      security:
        - webSession: []
        - appOAuth:
            - routines:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "202":
          description: The run was accepted.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineRunAccepted"
              examples:
                answer:
                  $ref: "#/components/examples/RoutineRunAcceptedExample"
        "400":
          $ref: "#/components/responses/InvalidRoutine"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/RoutineNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/routines/{routineId}/runs:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/RoutineId"
    get:
      tags:
        - Routines
      operationId: listRoutineRuns
      summary: List a routine's runs
      description: "Return one page of the routine's newest runs, newest first: how
        each ended and what started it. What a run said is not kept here: it is
        in the routine's conversation, where the Bot posted it. A missing cursor
        starts at the first page and nextCursor null ends the list."
      security:
        - webSession: []
        - appOAuth:
            - routines:read
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/Limit
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: One page of runs.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineRunPage"
              examples:
                answer:
                  $ref: "#/components/examples/RoutineRunPageExample"
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/RoutineNotFound"
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/check-ins:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
    get:
      tags:
        - Check-ins
      operationId: listCheckIns
      summary: List check-ins
      description: Return one page of the caller's own check-ins, newest first, each
        with how its last check-in ended, and whether an administrator allows
        the caller's Bots to check in at all. A missing cursor starts at the
        first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth:
            - check-ins:read
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/Limit
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: One page of check-ins.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInPage"
              examples:
                answer:
                  $ref: "#/components/examples/CheckInPageExample"
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./common.yaml#/components/responses/OrganizationNotFound
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
    post:
      tags:
        - Check-ins
      operationId: createCheckIn
      summary: Turn on a check-in
      description: Have a Bot check in for the caller on one thing, in a conversation
        they share. A check-in on a thing the Bot already watches (the same
        link, or the same subject) is turned back on with what was sent, which
        is what accepting a Bot's offer means. With refuseExisting=true that one
        is refused instead, for a screen that asked for a new one. A repeated
        request with the same Idempotency-Key and body returns the first result.
      security:
        - webSession: []
        - appOAuth:
            - check-ins:write
        - apiKey: []
      parameters:
        - name: refuseExisting
          in: query
          description: Refuse, with 409, a check-in on a thing the Bot already watches,
            instead of turning that one back on.
          schema:
            type: boolean
            default: false
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckInRequest"
            examples:
              request:
                value:
                  botId: agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
                  conversationId: 5f0c2a52-3f1e-4a55-9d0a-7f6d2b1c8e90
                  subject: Vendor contract renewal
                  focus: Tell me when the vendor replies about the renewal.
                  intervalMinutes: 1440
      responses:
        "201":
          description: The check-in, on.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
              examples:
                answer:
                  $ref: "#/components/examples/CheckInResponseExample"
        "400":
          $ref: "#/components/responses/InvalidCheckIn"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./common.yaml#/components/responses/OrganizationNotFound
        "409":
          $ref: "#/components/responses/CheckInConflict"
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/check-ins/{checkInId}:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/CheckInId"
    patch:
      tags:
        - Check-ins
      operationId: updateCheckIn
      summary: Change a check-in
      description: "Change one of the caller's check-ins: pause or resume it with
        enabled, how often it runs, or what it looks for. Only the fields sent
        change."
      security:
        - webSession: []
        - appOAuth:
            - check-ins:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCheckInRequest"
            examples:
              request:
                value:
                  enabled: false
      responses:
        "200":
          description: The check-in, as saved.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
              examples:
                answer:
                  $ref: "#/components/examples/CheckInResponseExample"
        "400":
          $ref: "#/components/responses/InvalidCheckIn"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/CheckInNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
    delete:
      tags:
        - Check-ins
      operationId: deleteCheckIn
      summary: Remove a check-in
      description: Remove one of the caller's check-ins. The Bot stops looking; items
        it already raised stay until they are started or hidden.
      security:
        - webSession: []
        - appOAuth:
            - check-ins:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "204":
          description: The check-in was removed.
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/CheckInNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/check-ins/{checkInId}/run:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/CheckInId"
    post:
      tags:
        - Check-ins
      operationId: runCheckIn
      summary: Run a check-in now
      description: Have the Bot check in now. The answer says whether it was queued,
        or skipped at once for the reason a scheduled check-in would have been
        skipped anyway. Refused when one is running already, or one ran in the
        last ten minutes.
      security:
        - webSession: []
        - appOAuth:
            - check-ins:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: Queued, or skipped and why.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInRunAnswer"
              examples:
                answer:
                  $ref: "#/components/examples/CheckInRunAnswerExample"
        "400":
          $ref: "#/components/responses/InvalidCheckIn"
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/CheckInNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/check-in-items:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
    get:
      tags:
        - Check-ins
      operationId: listCheckInItems
      summary: List what check-ins found
      description: "Return one page of the open items the caller's Bots raised in
        their check-ins, newest first: what each is, why it was raised and where
        the Bot read it. Starting or hiding an item takes it off this list. A
        missing cursor starts at the first page and nextCursor null ends the
        list."
      security:
        - webSession: []
        - appOAuth:
            - check-ins:read
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/Limit
        - $ref: ./common.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: One page of open items.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInItemPage"
              examples:
                answer:
                  $ref: "#/components/examples/CheckInItemPageExample"
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./common.yaml#/components/responses/OrganizationNotFound
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/check-in-items/{checkInItemId}/start:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/CheckInItemId"
    post:
      tags:
        - Check-ins
      operationId: startCheckInItem
      summary: Start an item as a task
      description: "Start an item: its Bot takes it on as a task in a conversation of
        its own, as the caller's own turn, so anything it sends or changes still
        asks first. Starting an item that was started already answers the task
        the first start opened. One that is no longer open, or is somebody
        else's, is refused."
      security:
        - webSession: []
        - appOAuth:
            - check-ins:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: The item, started, and the task it opened.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedCheckInItem"
              examples:
                answer:
                  $ref: "#/components/examples/StartedCheckInItemExample"
        "400":
          $ref: ./common.yaml#/components/responses/InvalidRequest
        "401":
          $ref: ./common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: ./common.yaml#/components/responses/Forbidden
        "404":
          $ref: "#/components/responses/CheckInItemNotFound"
        "409":
          $ref: ./common.yaml#/components/responses/IdempotencyConflict
        "500":
          $ref: ./common.yaml#/components/responses/ServerError
        default:
          $ref: ./common.yaml#/components/responses/UnexpectedError
  /api/v2/organizations/{organizationId}/check-in-items/{checkInItemId}/dismiss:
    parameters:
      - $ref: ./common.yaml#/components/parameters/OrganizationId
      - $ref: "#/components/parameters/CheckInItemId"
    post:
      tags:
        - Check-ins
      operationId: dismissCheckInItem
      summary: Hide an item
      description: Hide an item. It leaves the list, and later check-ins do not raise
        the same thing again for 30 days. One that is no longer open, or is
        somebody else's, is refused.
      security:
        - webSession: []
        - appOAuth:
            - check-ins:write
        - apiKey: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: The item, hidden.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInItemResponse"
              examples:
                answer:
                  $ref: "#/components/examples/CheckInItemResponseExample"
        "400":
