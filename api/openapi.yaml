          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/PersonNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/network-policies:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Network policies]
      operationId: listNetworkPolicies
      summary: List where Bot computers may connect
      description: >-
        Return one page of the network policies: where Bot computers may
        connect, for the organization and for a directory group. A group's
        policy applies to its members unless the organization's is locked.
        The organization's first, then each group's by name. Only an
        administrator may read them. A missing cursor starts at the first page
        and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [network-policies:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of network policies.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPolicyPage'
              examples:
                organization:
                  $ref: '#/components/examples/NetworkPolicyPageExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/network-policies/{networkPolicyId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/NetworkPolicyId'
    put:
      tags: [Network policies]
      operationId: replaceNetworkPolicy
      summary: Set where Bot computers may connect
      description: >-
        Set the organization's network policy, or a directory group's, making
        it if there is none. The list is checked as the computers read it, and
        the policy reaches every running computer it covers. The audit trail
        records the policy, and the sentence it was written from when it was
        described in English. Only an administrator may set one.
      security:
        - webSession: []
        - appOAuth: [network-policies:write]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkPolicyInput'
            examples:
              allowlist:
                value:
                  mode: allowlist_only
                  rules:
                    - type: domain
                      value: salesforce.com
                  locked: false
      responses:
        '200':
          description: The policy, as saved.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPolicy'
              examples:
                answer:
                  $ref: '#/components/examples/NetworkPolicyExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [Network policies]
      operationId: deleteNetworkPolicy
      summary: Remove a network policy
      description: >-
        Remove the organization's network policy, or a group's, so the level
        beneath decides: the group falls back to the organization's, and the
        organization to the default list. Recorded on the audit trail. Only an
        administrator may remove one. One that was never set is not found.
      security:
        - webSession: []
        - appOAuth: [network-policies:write]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The policy was removed.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/NetworkPolicyNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/network-policies/translate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Network policies]
      operationId: translateNetworkPolicy
      summary: Write a network list from a description
      description: >-
        Turn a description in English into a list of hosts and addresses Bot
        computers may connect to, written by the deployment's model and
        checked as a save would check it. Nothing is saved. The audit trail
        records the description and what it became. Only an administrator may
        ask.
      security:
        - webSession: []
        - appOAuth: [network-policies:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDescription'
            examples:
              crm:
                value:
                  text: Only our CRM and GitHub.
      responses:
        '200':
          description: The proposed list, and what it makes reachable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkTranslation'
              examples:
                answer:
                  $ref: '#/components/examples/NetworkTranslationExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ModelFailed'
        '503':
          $ref: '#/components/responses/ModelNotConfigured'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/network-policies/replay:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Network policies]
      operationId: replayNetworkPolicy
      summary: Test a network policy against recent page visits
      description: >-
        Say what a policy would have done to the pages Bots visited lately,
        without saving it: which sites it would block that are allowed today,
        and the other way round. Only an administrator may ask.
      security:
        - webSession: []
        - appOAuth: [network-policies:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkPolicyCandidate'
      responses:
        '200':
          description: What the policy would have done.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkReplayReport'
              examples:
                answer:
                  $ref: '#/components/examples/NetworkReplayReportExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/NoTrailToReplay'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/model-usage:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organization settings]
      operationId: getModelUsage
      summary: Read which models Bots ran on
      description: >-
        Return which models Bots ran on over the last days, with how many runs,
        refusals and people each had, and the newest 50 runs. Only an
        administrator may read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [model-usage:read]
        - apiKey: []
      parameters:
        - name: days
          in: query
          description: How many days back, 1 to 365.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Which models Bots ran on.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelUsage'
              examples:
                answer:
                  $ref: '#/components/examples/ModelUsageExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/computer-actions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organization settings]
      operationId: listComputerActions
      summary: List recorded computer actions
      description: >-
        Return one page of the actions recorded on Bot computers while
        recording computer actions is on, newest first. Records are kept for
        actionRecordRetentionDays. Only an administrator may read them. A
        missing cursor starts at the newest and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [computer-actions:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of recorded actions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerActionPage'
              examples:
                answer:
                  $ref: '#/components/examples/ComputerActionPageExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
