      additionalProperties: false
      properties:
        focus:
          type: string
          description: What to look for.
          maxLength: 1000
        intervalMinutes:
          type: integer
          minimum: 60
          maximum: 1440
          description: How often it runs, in minutes.
        enabled:
          type: boolean
