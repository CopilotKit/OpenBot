      - $ref: '#/components/parameters/BotId'
    post:
      tags:
        - Bot grants
      operationId: batchUpdateBotGrants
      summary: Change a Bot's actions in one app at once
      description: 'Turn several of one app''s actions on and off for a Bot as one change, or none of them: one that can''t be made refuses them all, and problems says which. Each action is checked as replaceBotGrant and deleteBotGrant check it, and an action turned on must be one the app offers now. The audit trail records the change once, with the sentence it was chosen from when it was described in English (translateBotGrants). An administrator may turn actions on and off. A Bot''s owner may only turn on actions of their own app.'
      security:
        - webSession: []
        - appOAuth:
            - bot-grants:write
        - apiKey: []
