    UnexpectedError:
      description: >-
        Any other status, in the same problem details shape. The statuses
        listed for an operation are the ones its own rules produce; this
        covers the rest, such as a proxy in front of the server refusing a
        request too large to read (413, 414, 431) or a gateway that cannot
        reach it (502, 503, 504). A client reads detail and retryable from
        it like any other problem.
      content:
        application/problem+json:
