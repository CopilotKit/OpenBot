    LinkedAccountProviderPage:
      type: object
      required:
        - linkedAccountProviders
        - nextCursor
      properties:
        linkedAccountProviders:
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccountProvider'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
