    post:
      tags:
        - API keys
      operationId: createApiKey
      summary: Make an API key
      description: 'Make an API key that acts as the person, inside this organization, on the API only. The key itself is in this answer and never again: OpenBot keeps only a hash of it. Only the person themselves may make one, signed in to OpenBot: a key can never make another key, and neither can an app''s sign-in. A key ends when it expires, when it is deleted, or when an administrator removes the person.'
