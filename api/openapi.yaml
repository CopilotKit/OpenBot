    put:
      tags:
        - Apps
      operationId: replaceApp
      summary: Add or replace a server at a chosen id
      description: Add a server by its address at an id an administrator chooses, or replace the server at that id. It is for pointing OpenBot at a server of the organization's own, such as one reached as the signed-in person through Microsoft Entra ID (entraScope). Unlike createApp, it doesn't ask the server how it is reached and doesn't check the MCP allowlist. The id is 2 to 40 lower-case letters, numbers and hyphens, and can't be a catalogue entry's, a screen's, or one kept for apps from the directory. credentialId names a vault credential (createCredential) the server is reached with. An absent entraScope keeps the one the server has, and null takes it away. Recorded on the audit trail. Answers the server, whether it was added or replaced. Only an administrator may.
      security:
        - webSession: []
        - appOAuth:
            - apps:write
