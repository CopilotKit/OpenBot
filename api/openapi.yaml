        - allowed
      properties:
        checkIns:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/CheckIn'
        allowed:
          type: boolean
          description: False when an administrator turned check-ins off for the caller, so the caller's own switches can say who turned them off.
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    CreateCheckInRequest:
      type: object
      additionalProperties: false
      required:
        - botId
        - conversationId
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
          description: The Bot that checks in.
        conversationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
          description: A conversation the caller and the Bot share.
        focus:
          type: string
          description: What to look for.
          maxLength: 1000
          default: ''
        subject:
          type: string
          description: What it watches, in a few words.
          maxLength: 120
          default: ''
        sourceLink:
          type:
            - string
            - 'null'
          format: uri
          maxLength: 2000
          pattern: ^https?://
          description: A web link it watches.
        intervalMinutes:
          type: integer
          minimum: 60
          maximum: 1440
          default: 1440
          description: 'How often it runs, in minutes: hourly at most, daily at least.'
        enabled:
          type: boolean
          default: true
    CheckInResponse:
      type: object
      required:
        - checkIn
      properties:
        checkIn:
          $ref: '#/components/schemas/CheckIn'
    UpdateCheckInRequest:
