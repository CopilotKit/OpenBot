          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    RoutineConversation:
      type: object
      description: Where a routine posts.
      required:
        - id
        - name
        - title
        - gone
      properties:
        id:
          type: string
          description: The conversation's id.
        name:
          type:
            - string
            - 'null'
          description: The names of the Bots in it, or null when the conversation is gone entirely.
        title:
          type:
            - string
            - 'null'
          description: The conversation as the sidebar titles it, which is what a person knows it by. Null when it is gone entirely.
        gone:
          type: boolean
          description: Whether the conversation was deleted. Such a routine is shown, not hidden.
    RoutineLastRun:
      type: object
      required:
        - status
        - at
      properties:
        status:
          type:
            - string
            - 'null'
          enum:
            - succeeded
            - failed
            - skipped
            - waiting
            - null
          description: How it ended, or null while it is still open. Only failed is a failure.
        at:
          type:
            - string
            - 'null'
          format: date-time
          description: When it finished, or null while it is still open.
    Routine:
      type: object
      description: 'One of a person''s routines. schedule is display text and never a value to parse: words for the schedules OpenBot can describe, the five cron fields for anything stranger. nextRunAt is the one time to rely on.'
      required:
        - id
        - botId
        - schedule
        - timezone
        - instruction
        - title
        - conversation
        - enabled
        - nextRunAt
        - lastRun
        - goalId
        - createdAt
      properties:
        id:
          type: string
          description: The routine's id.
        botId:
          type: string
          description: The Bot that carries it out.
        schedule:
          type: string
          description: When it runs, as text to show.
        timezone:
          type: string
          description: The IANA time zone the schedule is read in.
        instruction:
          type: string
          description: What the Bot does on each run.
        title:
          type:
            - string
            - 'null'
          description: What the person called it, or null when they named it nothing.
        conversation:
          $ref: '#/components/schemas/RoutineConversation'
        enabled:
          type: boolean
          description: False while it is paused. A paused routine never runs.
        nextRunAt:
          type: string
          format: date-time
          description: When it runs next, if it is on.
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/RoutineLastRun'
            - type: 'null'
          description: Its newest run, or null when it has never run.
        goalId:
          type:
            - string
            - 'null'
          description: The goal it runs, or null when it runs none.
        createdAt:
          type: string
          format: date-time
          description: When it was made.
    RoutinePage:
      type: object
      required:
        - routines
        - nextCursor
      properties:
        routines:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/Routine'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    CreateRoutineRequest:
      type: object
      additionalProperties: false
      required:
        - botId
        - instruction
        - cron
        - conversationId
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The Bot that carries it out.
        conversationId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: A conversation the caller and the Bot share, where it posts.
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
          description: What the Bot does on each run. At most 2,000 characters.
        title:
          type: string
          description: What to call it. At most 100 characters.
          maxLength: 100
        cron:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: 'The schedule, as five cron fields: minute, hour, day of month, month, day of week. At most once an hour.'
        timezone:
          type: string
          description: The IANA time zone the schedule is read in. UTC when absent.
          maxLength: 100
        goalId:
          type: string
          description: The goal this routine runs, when it runs one.
          maxLength: 200
    RoutineResponse:
      type: object
      required:
        - routine
      properties:
        routine:
          $ref: '#/components/schemas/Routine'
    RoutineSwitch:
      type: object
      required:
        - enabled
      properties:
