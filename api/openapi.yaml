              schema:
                $ref: '#/components/schemas/GithubEventSourceResponse'
              examples:
                answer:
                  $ref: '#/components/examples/GithubEventSourceResponseExample'
        '400':
          $ref: '#/components/responses/InvalidGoal'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/github-event-sources/{githubEventSourceId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/GithubEventSourceId'
    delete:
      tags:
        - Goals
      operationId: deleteGithubEventSource
      summary: Disconnect a GitHub repository's events
      description: Disconnect a GitHub repository's events and revoke its stored webhook secret.
      security:
        - webSession: []
        - appOAuth:
            - goals:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The source was disconnected.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/GithubEventSourceNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}/follow-ups/{followUpId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
      - $ref: '#/components/parameters/FollowUpId'
    post:
      tags:
        - Follow-ups
      operationId: cancelFollowUp
      summary: Cancel a follow-up
      description: Cancel a follow-up a Bot scheduled for the caller, so the Bot does not come back to it. One that already ran, or was cancelled already, is not found.
      security:
        - webSession: []
        - appOAuth:
            - bots:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The follow-up was cancelled.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpCancelled'
              examples:
                answer:
                  $ref: '#/components/examples/FollowUpCancelledExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FollowUpNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/people/me/organizations:
    get:
      tags:
        - Organizations
      operationId: listOrganizations
      summary: List the caller's organizations
      description: Return one page of the organizations the caller is a member of, the one they joined first at the top, each with the caller's role in it. active marks the one the caller's session is working in, which is where every address outside /api/v2 reads and writes; a request signed in with an API key or an app's token has no session, so none is active. To work in another one, set it as the session's active organization (POST /api/auth/organization/set-active). A missing cursor starts at the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth:
            - organizations:read
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of organizations.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/OrganizationPageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags:
        - Organizations
      operationId: createOrganization
      summary: Create an organization
      description: 'Create an organization with the caller as its owner. It starts with no Bots and no conversations. Who may create one is the deployment''s choice: its admins (the admins of `default`) unless it lets anybody signed in. Without a slug, one is made from the name. The caller''s session keeps working where it was. A repeated request with the same Idempotency-Key and body returns the first result.'
      security:
        - webSession: []
        - appOAuth:
            - organizations:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
            examples:
              named:
                value:
                  name: Acme Research
                  slug: acme-research
      responses:
        '201':
          description: The organization was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
              examples:
                created:
                  $ref: '#/components/examples/CreatedOrganization'
        '400':
          $ref: '#/components/responses/InvalidOrganization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '409':
          $ref: '#/components/responses/OrganizationConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/OrganizationNotCreated'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - Organizations
      operationId: listOrganizationMembers
      summary: List an organization's members
      description: Return one page of the organization's members, in the order they joined. Any member can read it. A missing cursor starts at the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth:
            - organizations:read
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of members.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/OrganizationMemberPageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags:
        - Organizations
      operationId: addOrganizationMember
      summary: Add a person to an organization
      description: Make somebody who already has an account here a member of the organization, by their email address, with a role. Only an owner or an admin of this organization can. A repeated request with the same Idempotency-Key and body returns the first result.
      security:
        - webSession: []
        - appOAuth:
            - organizations:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrganizationMemberRequest'
            examples:
              member:
                value:
                  email: sam.ortiz@acme.com
                  role: member
      responses:
        '201':
          description: The person is now a member.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              description: The organization's members.
              schema:
                type: string
              example: /api/v2/organizations/Jq3xT9mLw2Vb8RnC5sYd0fKe/members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberResponse'
              examples:
                added:
                  $ref: '#/components/examples/AddedOrganizationMember'
        '400':
          $ref: '#/components/responses/InvalidOrganizationMember'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationOrPersonNotFound'
        '409':
          $ref: '#/components/responses/OrganizationMemberConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: The web app's server-side session, so no token ever reaches the browser. Served over HTTPS the cookie is __Secure-better-auth.session_token. A single-user install signs its one person in without a cookie.
    appOAuth:
      type: oauth2
      description: Desktop, mobile and the CLI. OAuth 2.1 authorization code with PKCE (RFC 7636, S256 only); the access token is sent as a bearer token. The server does not accept it yet.
      flows:
        authorizationCode:
          authorizationUrl: /api/auth/oauth2/authorize
          tokenUrl: /api/auth/oauth2/token
          refreshUrl: /api/auth/oauth2/token
          scopes:
            conversations:read: Read the signed-in person's conversations, and watch a Bot's runs in them.
            computers:read: Watch the signed-in person's Bots' screens and terminals.
            computers:write: Use the mouse and keyboard on the signed-in person's Bots' computers.
            bots:read: Read the Bots the signed-in person can see.
            bots:write: Create, change and delete the signed-in person's Bots.
            reactions:read: Read the reactions Bots left on the signed-in person's messages.
            audit-events:read: Read the organization's audit trail, when the signed-in person is an administrator.
            people:read: Read the signed-in person, their standing instructions and preferences, and for an administrator everybody in the organization.
            people:write: Change the signed-in person's name, onboarding, standing instructions and preferences, and for an administrator anybody's role and access.
            linked-accounts:read: Read the signed-in person's linked accounts, and which services can be linked.
            linked-accounts:write: Link and unlink the signed-in person's accounts at other services.
            identity-providers:read: Read the organization's identity providers, when the signed-in person is an administrator.
            identity-providers:write: Remove the organization's identity providers, when the signed-in person is an administrator.
            settings:read: Read the organization's settings, when the signed-in person is an administrator.
            settings:write: Change the organization's settings and stop idle computers, when the signed-in person is an administrator.
            capabilities:read: Read the permission switches, and describe and preview changes to them, when the signed-in person is an administrator.
            capabilities:write: Change the permission switches, when the signed-in person is an administrator.
            network-policies:read: Read where Bot computers may connect, and describe and test a policy, when the signed-in person is an administrator.
            network-policies:write: Set and remove where Bot computers may connect, when the signed-in person is an administrator.
            model-usage:read: Read which models Bots ran on, when the signed-in person is an administrator.
            computer-actions:read: Read the actions recorded on Bot computers, when the signed-in person is an administrator.
            setup-checklist:read: Read the setup checklist, and check it again.
            credentials:read: Read which credentials the vault keeps and where the Bots' model key is filed, never a secret, when the signed-in person is an administrator.
            credentials:write: Add credentials to the vault and revoke them, when the signed-in person is an administrator.
            model-catalogue:read: Read the models Bots can run on.
            model-choices:read: Read the model the signed-in person chose for each of their conversations.
            model-choices:write: Choose the model the signed-in person's conversations answer on.
            devices:read: Read the phones the signed-in person registered for push notifications.
            devices:write: Register the signed-in person's phones for push notifications, and remove them.
            destinations:read: Read where the signed-in person continues conversations in Slack, Microsoft Teams and text messages.
            destinations:write: Connect and disconnect the signed-in person's Slack, Microsoft Teams and text message destinations.
            deliveries:read: Read what Bots sent the signed-in person outside OpenBot.
            notification-settings:read: Read where the signed-in person's updates go, how much each Bot may send them, and the ways this deployment can reach people.
            notification-settings:write: Change where the signed-in person's updates go and how much each Bot may send them.
            routines:read: Read the signed-in person's routines and their runs.
            routines:write: Create, pause, resume, run and delete the signed-in person's routines.
            check-ins:read: Read the signed-in person's check-ins and the items they raised, and for an administrator how check-ins are going.
            check-ins:write: Turn the signed-in person's check-ins on and off, change and run them, and start or hide the items they raised.
            goals:read: Read the signed-in person's goals, their runs, their triggers and their GitHub event sources. Reading a trigger's secret needs goals:write.
            goals:write: Create, change, pause, resume, complete, run and delete the signed-in person's goals, their triggers and their GitHub event sources.
            organizations:read: Read the organizations the signed-in person is a member of, and their members.
            organizations:write: Create organizations and add members to them, where the signed-in person may.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: OpenBot API key
      description: Automation. An API key acts as the person who created it, inside one organization. The server does not accept it yet.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: The organization, by its id or its slug. Every install has one addressed as `default`.
      schema:
        type: string
        minLength: 1
      example: default
    PersonId:
      name: personId
      in: path
      required: true
      description: 'The person: me for the caller, or a person''s id. A person''s own things (their instructions, preferences, API keys, sessions and linked accounts) answer only the person themselves, by either.'
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
      example: me
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      description: The API key's id. Never the key itself.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    SessionId:
      name: sessionId
      in: path
      required: true
      description: The session's id. Never its token.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    LinkedAccountId:
      name: linkedAccountId
      in: path
      required: true
      description: The linked account's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    IdentityProviderId:
      name: identityProviderId
      in: path
      required: true
      description: The identity provider's id, as it was registered.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    CapabilityIdParameter:
      name: capabilityId
      in: path
      required: true
      description: The permission switch.
      schema:
        $ref: '#/components/schemas/CapabilityId'
    NetworkPolicyId:
      name: networkPolicyId
      in: path
      required: true
      description: organization, or group:<name> for a directory group's.
      schema:
        type: string
        minLength: 1
        maxLength: 206
        pattern: ^(organization|group:[^\x00]*\S[^\x00]*)$
    BotId:
      name: botId
      in: path
      required: true
      description: The Bot's id.
      schema:
        type: string
        minLength: 1
        pattern: \S
      example: agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
    Limit:
      name: limit
      in: query
      description: Most items in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 'Opaque continuation from the previous page''s nextCursor, bound to the organization and the filters that made it. The server only ever issues cursors written in URL-safe base64 (letters, digits, - and _, no padding) and refuses anything else, so the pattern says so. A cursor that fits the pattern can still be refused: one this list never gave out, or one made for another organization or other filters.'
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: ^[A-Za-z0-9_-]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Generated by the caller for each write it means to make once. Reuse the same key and the same request for 24 hours after an uncertain response; the same key with a different request is a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuditEventTypes:
      name: eventType
      in: query
      description: Events of any of these types, separated by commas, such as computer.action_refused,mcp.call_rejected.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditExcludedEventTypes:
      name: excludeEventType
      in: query
      description: Leave out events of these types, separated by commas.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditExcludedCalls:
      name: excludeCalls
      in: query
      description: 'Leave out the app calls of these tools that succeeded, separated by commas: calls whose change has an event of its own. A call that failed is kept.'
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditActor:
      name: actorUserId
      in: query
      description: Events that ran on this person's authority, by their user id.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditInitiatorKinds:
      name: initiatorKind
      in: query
      description: 'Events started in any of these ways, separated by commas: person, deployment, routine, responsibility, memory or handoff.'
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditTargetTypes:
      name: targetType
      in: query
      description: Events about any of these kinds of thing, separated by commas, such as agent or computer.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditTargetId:
      name: targetId
      in: query
      description: Events about this one thing, by its id.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditBots:
      name: bot
      in: query
      description: 'The events of any of these Bots, by id, separated by commas: what each Bot did and what was done to it.'
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditApps:
      name: app
      in: query
      description: App calls to any of these apps, separated by commas, by the app's key (gmail), whichever way the app was connected.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditTools:
      name: tool
      in: query
      description: App calls of any of these tools, separated by commas, by the name the trail records, in any case.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditEffect:
      name: effect
      in: query
      description: App calls that only read (read), or that change something (write).
      schema:
        $ref: '#/components/schemas/AuditEffect'
    AuditIntents:
      name: intent
      in: query
      description: Actions that did any of these, separated by commas, in the boundary's own words (AuditIntent). A word outside those matches nothing.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditRule:
      name: rule
      in: query
      description: Refusals by this one boundary rule, its text exactly as recorded. One rule, not a list, because a rule can hold commas.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditFrom:
      name: from
      in: query
      description: Events after this moment.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Events before this moment.
      schema:
        type: string
        format: date-time
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: The conversation's id.
      schema:
        type: string
        minLength: 1
        pattern: \S
      example: 5f0d6c0e-2f1a-4a53-9d51-6f3d6b1f6f10
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: The credential's id.
      schema:
        type: string
        format: uuid
      example: 3b9a5f8e-6c1d-4e2a-9f47-1d2c3b4a5e6f
    ModelCatalogueView:
      name: view
      in: query
      description: 'offered, the default: the models people may pick, narrowed to the ones an administrator allowed. all: every model the provider or gateway lists, before that narrowing, for an administrator choosing which to allow. Only an administrator may ask for all.'
      schema:
        type: string
        enum:
          - offered
          - all
        default: offered
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 'The device''s id: a UUID the OpenBot app makes once on the phone and keeps, so registering again replaces rather than adds.'
      schema:
        type: string
        format: uuid
      example: 2b7c4d1e-9f3a-4e6b-8c5d-1a2b3c4d5e6f
    DestinationId:
      name: destinationId
      in: path
      required: true
      description: The destination's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    RoutineId:
      name: routineId
      in: path
      required: true
      description: The routine's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    CheckInId:
      name: checkInId
      in: path
      required: true
      description: The check-in's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    CheckInItemId:
      name: checkInItemId
      in: path
      required: true
      description: The item's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    GoalId:
      name: goalId
      in: path
      required: true
      description: The goal's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    GoalTriggerId:
      name: goalTriggerId
      in: path
      required: true
      description: The trigger's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    GithubEventSourceId:
      name: githubEventSourceId
      in: path
      required: true
      description: The GitHub event source's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    FollowUpId:
      name: followUpId
      in: path
      required: true
      description: The follow-up's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
  headers:
    PrivateNoStore:
      description: A Bot is private to the caller.
      schema:
        type: string
        const: private, no-store
  schemas:
    BotVisibility:
      type: string
      enum:
        - public
        - private
      description: Public Bots are shared with everybody in the organization.
    Bot:
      type: object
      description: 'A Bot as the caller sees it. canManage, mine, systemOwned and the isolation fields are the server''s verdicts for this caller; a client renders them and never recomputes them. No secret is ever part of a Bot: hasAuth and hasCallbackToken say whether one is set.'
      required:
        - id
        - name
        - title
        - roleDescription
        - avatarSeed
        - visibility
        - hidden
        - pinned
        - systemOwned
        - endpoint
        - hasAuth
        - hasCallbackToken
        - isolated
        - canManage
        - mine
        - assignedToMe
        - builtIn
        - runsOnOpenBotModel
        - keyFromOpenBot
        - isolationActive
        - isolationOffReason
      properties:
        id:
          type: string
          description: The Bot's id.
        name:
          type: string
          description: What the Bot is called.
        title:
          type: string
          description: The subtitle under its name. May be empty.
        roleDescription:
          type: string
          description: What it does, in its owner's words.
        avatarSeed:
          type: string
          description: The seed its avatar is drawn from.
        visibility:
          $ref: '#/components/schemas/BotVisibility'
        hidden:
          type: boolean
          description: Whether the caller hid it from their own list.
        pinned:
          type: boolean
          description: Whether the caller pinned it to the top of their own list.
        systemOwned:
          type: boolean
          description: Whether it comes with OpenBot rather than belonging to a person.
        endpoint:
          type:
            - string
            - 'null'
          description: The AG-UI address it runs at, as it was stored. Null for a Bot that runs inside OpenBot. Every address saved through this API is an absolute http or https address (see the request's endpoint), but one saved by an older release is returned as it is, so this field states no format.
        hasAuth:
          type: boolean
          description: Whether a key is set for its address. Never the key.
        hasCallbackToken:
          type: boolean
          description: Whether it holds a credential for calling OpenBot's tools back. Never the credential.
        isolated:
          type: boolean
          description: Whether its owner asked for it to have a computer of its own. isolationActive says whether it has one now.
        instructions:
          type: string
          description: What the starter Bot is told, kept apart from its role description. Only the starter Bot has instructions.
        framework:
          type: string
          description: What runs it, by the name a person reads ("LangChain", "OpenBot"). Absent when OpenBot doesn't know.
        canManage:
          type: boolean
          description: Whether the caller may change and delete it.
        mine:
          type: boolean
          description: Whether the caller created it. Separate from canManage, which is also true for an administrator on everybody's Bots.
        assignedToMe:
          type: boolean
          description: Whether an administrator assigned this Bot to the caller.
        builtIn:
          type: boolean
          description: Whether it runs at the deployment's own managed address, so it needs no callback credential of its own.
        runsOnOpenBotModel:
          type: boolean
          description: Whether it runs on OpenBot's model, so a person can pick the model per conversation.
        keyFromOpenBot:
          type: boolean
          description: Whether OpenBot gives it a key for its tools on every run, because OpenBot runs it.
        isolationActive:
          type: boolean
          description: Whether its next run gets a computer of its own.
        isolationOffReason:
          type:
            - string
            - 'null'
          enum:
            - admin
            - deployment
            - null
          description: 'Why an isolated Bot runs on a shared computer instead. admin: its owner no longer holds Isolated Bots. deployment: this deployment cannot make another computer. Null otherwise.'
    BotPage:
      type: object
      required:
        - bots
        - nextCursor
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    Reaction:
      type: object
      required:
        - messageId
        - agentId
        - emoji
        - createdAt
      properties:
        messageId:
          type: string
          description: The person's message the reaction is on, by the id its conversation gives it.
        agentId:
          type: string
          description: The Bot that reacted.
        emoji:
          type: string
          description: The reaction itself.
          example: 👍
        createdAt:
          type: string
          format: date-time
    ReactionPage:
      type: object
      required:
        - reactions
        - nextCursor
      properties:
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    BotResponse:
      type: object
      required:
        - bot
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
    SharedApp:
      type: object
      required:
        - serverId
        - title
      properties:
        serverId:
          type: string
          description: The app's id.
        title:
          type: string
          description: The app's name.
    SharedAppsAfterChange:
      type: object
      description: What making a Bot public means for the shared app accounts it uses. An administrator's change approves them; anybody else's lists the ones an administrator still has to approve.
      required:
        - approved
        - needsApproval
      properties:
        approved:
          type: array
          items:
            $ref: '#/components/schemas/SharedApp'
        needsApproval:
          type: array
          items:
            $ref: '#/components/schemas/SharedApp'
    UpdateBotResponse:
      type: object
      required:
        - bot
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
        sharedApps:
          $ref: '#/components/schemas/SharedAppsAfterChange'
    BotKey:
      type: object
      description: 'A key the Bot''s address sits behind. Write-only: stored encrypted and never returned. A blank value sets no key.'
      required:
        - value
      properties:
        header:
          type: string
          pattern: ^[A-Za-z0-9-]*$
          description: The header it is sent in. Blank or absent means Authorization.
        value:
          type: string
          writeOnly: true
          description: The header's value.
    BotFields:
      type: object
      required:
        - name
        - title
        - roleDescription
        - visibility
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: What the Bot is called, 1 to 80 characters once trimmed.
        title:
          type: string
          maxLength: 120
          description: The subtitle under its name, up to 120 characters. May be empty.
        roleDescription:
          type: string
          minLength: 1
          maxLength: 1000
          description: What it does, 1 to 1000 characters once trimmed. A Bot with no endpoint runs on these words.
        visibility:
          $ref: '#/components/schemas/BotVisibility'
        endpoint:
          type: string
          description: 'The AG-UI address it runs at: empty, or an absolute http or https address, the only kinds the server has ever taken. Empty or absent on create means it runs inside OpenBot; empty or absent on a change leaves it as it is. An address that fits can still be refused: the server refuses one this deployment may not reach, such as a private network address on a deployment that keeps Bots off it.'
          anyOf:
            - type: string
              maxLength: 0
            - type: string
              format: uri
              pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
        auth:
          $ref: '#/components/schemas/BotKey'
        isolated:
          type: boolean
          description: Whether it gets a computer of its own. Absent leaves it as it is. True needs the owner's Isolated Bots switch.
        instructions:
          type: string
          minLength: 1
          maxLength: 1000
          description: New instructions for the starter Bot, 1 to 1000 characters once trimmed. Absent leaves them as they are; every other Bot ignores them.
    CreateBotRequest:
      description: A new Bot.
      allOf:
        - $ref: '#/components/schemas/BotFields'
        - type: object
          properties:
            harness:
              type: string
              description: 'The framework an agent somebody runs themselves is built on, by its id in OpenBot''s harness list (shared/harnesses.json), which the server checks every create against. Empty means none was named, as for an agent somebody already runs. "byo-url" is not one: it names no framework. Kept only with an endpoint.'
              enum:
                - ''
                - crewai
                - llamaindex
                - agno
                - langgraph
                - google-adk
                - antigravity
                - pydantic-ai
                - microsoft-agent-framework
                - claude-agent-sdk
                - strands
                - ag2
                - langroid
                - mastra
    UpdateBotRequest:
      description: A Bot's fields after the change.
      allOf:
        - $ref: '#/components/schemas/BotFields'
    AuditFilterText:
      type: string
      maxLength: 4096
      pattern: ^[^\x00]*$
      description: Text a filter on the audit trail matches. Blank is no filter. It never holds a NUL character, which no event can.
    AuditEffect:
      type: string
      enum:
        - read
        - write
      description: Whether an app call only reads, or changes something.
    AuditIntent:
      type: string
      description: What an action did, in the words of the boundary that judged it.
      enum:
        - activate
        - type
        - navigate
        - read
        - read_file
        - download_file
        - write_file
        - list_files
        - run_command
        - read_tool
        - write_tool
    AuditEvent:
      type: object
      description: One thing that happened, as the trail recorded it. Secrets are redacted from the payload before it is written.
      required:
        - id
        - actorUserId
        - initiatorKind
        - initiatorId
        - eventType
        - targetType
        - targetId
        - payload
        - createdAt
      properties:
        id:
          type: string
          description: The event's id.
        actorUserId:
          type:
            - string
            - 'null'
          description: The person whose authority it ran on, by user id. Null when it ran on nobody's, such as the deployment acting at start-up.
        initiatorKind:
          type: string
          description: 'What started it: person, deployment, routine, responsibility, memory or handoff. Read back as it was written, so an event from a later release may name another.'
        initiatorId:
          type:
            - string
            - 'null'
          description: Which routine, responsibility, memory or Bot started it. Null when a person or the deployment did.
        eventType:
          type: string
          description: What happened, such as computer.action_refused.
        targetType:
          type: string
          description: The kind of thing it happened to, such as agent or computer.
        targetId:
          type:
            - string
            - 'null'
          description: The thing it happened to, by id. Null when it names none.
        payload:
          type: object
          additionalProperties: true
          description: What the event recorded. Its fields depend on eventType.
        createdAt:
          type: string
          format: date-time
          description: When it happened.
    AuditEventPage:
      type: object
      required:
        - auditEvents
        - nextCursor
      properties:
        auditEvents:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next, older page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    AuditVocabulary:
      type: object
      description: What a filter on the audit trail can name in this organization.
      required:
        - bots
        - people
        - apps
        - tools
        - rules
      properties:
        bots:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
        people:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - email
            properties:
              id:
                type: string
                description: Their user id, as actorUserId names them.
              name:
                type:
                  - string
                  - 'null'
              email:
                type: string
        apps:
          type: array
          description: Apps by their key (gmail), whichever way they were connected.
          items:
            type: object
            required:
              - key
              - name
            properties:
              key:
                type: string
              name:
                type: string
                description: The app's name, as the Apps page shows it.
        tools:
          type: array
          description: The tools of each app, most called first.
          items:
            type: object
            required:
              - app
              - tool
              - calls
            properties:
              app:
                type: string
                description: The app's key.
              tool:
                type: string
              calls:
                type: integer
                minimum: 0
                description: How many events the trail holds for it; 0 for a tool never called.
        rules:
          type: array
          description: 'Boundary rules: the policy''s current ones, and any that refused something in the trail.'
          items:
            type: object
            required:
              - rule
              - name
              - refusals
            properties:
              rule:
                type: string
                description: The rule's text, as the rule filter takes it.
              name:
                type:
                  - string
                  - 'null'
                description: The name an administrator gave it, if any.
              refusals:
                type: integer
                minimum: 0
                description: How many refusals by it the trail holds.
    AuditQuestion:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^[^\x00]*$
          description: The question, 1 to 500 characters once trimmed.
        timeZone:
          type: string
          maxLength: 100
          description: Where the person asking is, as an IANA time zone (Europe/London), so yesterday is their yesterday. Absent or unknown means UTC.
    AuditFilters:
      type: object
      description: 'Filters on the audit trail, as listing audit events takes them, each list joined with commas: every filter narrows the events, and the values in a list are alternatives. Empty means every event.'
      properties:
        eventType:
          type: array
          items:
            type: string
        bot:
          type: string
          description: One Bot, by id.
        actorUserId:
          type: string
        initiatorKind:
          type: array
          items:
            type: string
        app:
          type: array
          items:
            type: string
        tool:
          type: array
          items:
            type: string
        effect:
          $ref: '#/components/schemas/AuditEffect'
        intent:
          type: array
          items:
            $ref: '#/components/schemas/AuditIntent'
        rule:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    AuditFilterLabels:
      type: object
      description: 'The names for the values in a set of filters, so each reads as a name: Bots and people by id, apps by key, rules by their text.'
      required:
        - bots
        - people
        - apps
        - rules
      properties:
        bots:
          type: object
          additionalProperties:
            type: string
        people:
          type: object
          additionalProperties:
            type: string
        apps:
          type: object
          additionalProperties:
            type: string
        rules:
          type: object
          additionalProperties:
            type: string
    AuditAnswer:
      type: object
      description: A question about the trail, as filters. The events the filters list are the answer.
      required:
        - answerable
        - unanswered
        - filters
        - reading
        - labels
      properties:
        answerable:
          type: string
          enum:
            - 'yes'
            - partly
            - 'no'
          description: Whether the trail answers all of the question, part of it, or none of it.
        unanswered:
          type:
            - string
            - 'null'
          description: What the trail can't answer, and why. Null when it answers all of it.
        filters:
          $ref: '#/components/schemas/AuditFilters'
        reading:
          type:
            - string
            - 'null'
          description: The filters read back in one line by a call that never saw the question. Null when the trail can't answer any of it.
        labels:
          $ref: '#/components/schemas/AuditFilterLabels'
    PersonRole:
      type: string
      enum:
        - owner
        - admin
        - member
      description: 'The person''s role as a member of the organization. An owner or an admin governs it: its people, its sign-in and its policy. A member uses it. The owner is whoever created the organization; `default` has admins and no owner.'
    AssignableRole:
      type: string
      enum:
        - admin
        - member
      description: A role an admin can give a person.
    OnboardingStatus:
      type: object
      description: Where a person is in first-run onboarding.
      required:
        - step
        - completedAt
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The step they were last on, by the app's own number for it. 0 is not started.
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When they finished it. Null until they do, which the apps read as onboarding still to do.
    Person:
      type: object
      description: 'Somebody in the organization. People are here because they signed in, not because they were invited: the identity provider decides who exists, and the organization decides what they may do. role, needsName, revoked and configuredAdmin are the server''s verdicts; a client renders them and never recomputes them.'
      required:
        - id
        - email
        - name
        - image
        - role
        - needsName
        - onboarding
        - providers
        - lastSignedInAt
        - revoked
        - configuredAdmin
      properties:
        id:
          type: string
          description: The person's id.
        email:
          type: string
          description: The address they sign in with.
        name:
          type:
            - string
            - 'null'
          description: What OpenBot calls them. Null when nothing has named them.
        image:
          type:
            - string
            - 'null'
          description: The picture their identity provider gave, when it gave one.
        role:
          $ref: '#/components/schemas/PersonRole'
        needsName:
          type: boolean
          description: Whether they have still to choose what OpenBot calls them, because their name is missing or is only their address.
        onboarding:
          description: Where they are in first-run onboarding. Null where the deployment does not track it, which the apps read as nothing to finish.
          oneOf:
            - $ref: '#/components/schemas/OnboardingStatus'
            - type: 'null'
        providers:
          type: array
          description: The identity providers they have signed in through. More than one is normal while a company moves between providers.
          items:
            type: string
        lastSignedInAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When they last signed in. Null if never.
        revoked:
          type: boolean
          description: Whether an administrator removed their access. They keep their record and their history.
        configuredAdmin:
          type: boolean
          description: 'Whether the deployment''s configuration names them as an administrator, which nobody can change here: they stay an administrator and keep their access.'
    PersonPage:
      type: object
      required:
        - people
        - nextCursor
      properties:
        people:
          type: array
          description: The most recently signed in first.
          items:
            $ref: '#/components/schemas/Person'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    PersonResponse:
      type: object
      required:
        - person
      properties:
        person:
          $ref: '#/components/schemas/Person'
    GetPersonResponse:
      type: object
      required:
        - person
        - openbotVersion
      properties:
        person:
          $ref: '#/components/schemas/Person'
        openbotVersion:
          type:
            - string
            - 'null'
          description: The OpenBot release the server runs, such as v1.0.3, which the apps show under the person's name. Null when the server was built without one. Only ever given to somebody signed in.
    UpdatePersonRequest:
      type: object
      description: The changes to make. At least one.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\x00]*$
          description: What OpenBot calls the person, 1 to 100 characters once trimmed. Only the person themselves may change it.
        role:
          $ref: '#/components/schemas/AssignableRole'
    AdvanceOnboardingRequest:
      type: object
      additionalProperties: false
      required:
        - step
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The step the person is now on, by the app's own number for it.
    OnboardingResponse:
      type: object
      required:
        - onboarding
      properties:
        onboarding:
          $ref: '#/components/schemas/OnboardingStatus'
    StandingInstructions:
      type: object
      description: What a person tells every Bot that works for them, in their own words. Empty means they wrote none.
      additionalProperties: false
      required:
        - instructions
      properties:
        instructions:
          type: string
          maxLength: 4000
          pattern: ^[^\x00]*$
          description: At most 4,000 characters, kept trimmed.
    MessageListEmphasis:
      type: string
      enum:
        - agent
        - thread
      description: What the conversation list leads with, the Bot or the conversation.
    OnOff:
      type: string
      enum:
        - 'on'
        - 'off'
    SkinId:
      type: string
      enum:
        - openbot
        - openduet
        - opendots
        - openfuse
      description: How OpenBot looks. openbot is OpenBot as it is without a skin.
    Preferences:
      type: object
      description: How a person set OpenBot up for themselves, on every device they sign in from.
      required:
        - messageListEmphasis
        - selfHostBannerDismissed
        - narration
        - skin
        - proactive
      properties:
        messageListEmphasis:
          $ref: '#/components/schemas/MessageListEmphasis'
        selfHostBannerDismissed:
          type: boolean
          description: Whether they closed the banner offering help self-hosting OpenBot.
        narration:
          description: Whether they narrate their recordings in OpenBot's browser, which opens the microphone only when on. Null until they choose, which the browser asks before their first recording.
          oneOf:
            - $ref: '#/components/schemas/OnOff'
            - type: 'null'
        skin:
          $ref: '#/components/schemas/SkinId'
        proactive:
          $ref: '#/components/schemas/OnOff'
          description: Whether their Bots check in on their behalf at all. off stops every Bot's check-ins, whatever each Bot's own setting says.
        starterTourChannelId:
          type: string
          readOnly: true
          description: The conversation the starter tour is offered in, set by the server when the person starts their first one. Absent until then.
    UpdatePreferencesRequest:
      type: object
      description: The preferences to change. At least one; the rest stay as they are.
      additionalProperties: false
      minProperties: 1
      properties:
        messageListEmphasis:
          $ref: '#/components/schemas/MessageListEmphasis'
        selfHostBannerDismissed:
          type: boolean
        narration:
          $ref: '#/components/schemas/OnOff'
        skin:
          $ref: '#/components/schemas/SkinId'
        proactive:
          $ref: '#/components/schemas/OnOff'
    ApiKey:
      type: object
      description: An API key a person made. Never the key itself.
      required:
        - id
        - name
        - start
        - createdAt
        - expiresAt
        - lastUsedAt
      properties:
        id:
          type: string
          description: The key's id.
        name:
          type:
            - string
            - 'null'
          description: What the person called it.
        start:
          type:
            - string
            - 'null'
          description: The key's first characters, enough to tell keys apart.
          example: obk_Xy
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it stops working. Null if it never expires.
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it last signed a request. Null if never.
    ApiKeyPage:
      type: object
      required:
        - apiKeys
        - nextCursor
      properties:
        apiKeys:
          type: array
          description: Newest first, then by id.
          items:
            $ref: '#/components/schemas/ApiKey'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[^\x00]*$
          description: What the key is for, so the person can tell it apart later.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Days until the key stops working. Absent, it never expires.
    CreatedApiKey:
      type: object
      required:
        - apiKey
        - key
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        key:
          type: string
          description: 'The key itself, to send as Authorization: Bearer. Shown in this answer and never again.'
    Session:
      type: object
      description: Somewhere a person is signed in. Never the session's token.
      required:
        - id
        - createdAt
        - lastActiveAt
        - expiresAt
        - ipAddress
        - userAgent
        - current
      properties:
        id:
          type: string
          description: The session's id.
        createdAt:
          type: string
          format: date-time
          description: When they signed in.
        lastActiveAt:
          type: string
          format: date-time
          description: When the session was last renewed.
        expiresAt:
          type: string
          format: date-time
          description: When it ends unless it is used again.
        ipAddress:
          type:
            - string
            - 'null'
          description: The address they signed in from, when it was known.
        userAgent:
          type:
            - string
            - 'null'
          description: The browser or app they signed in with, as it named itself.
        current:
          type: boolean
          description: Whether this request came on this session.
    SessionPage:
      type: object
      required:
        - sessions
        - nextCursor
      properties:
        sessions:
          type: array
          description: The newest sign-in first, then by id, an order that doesn't move while somebody pages.
          items:
            $ref: '#/components/schemas/Session'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    LinkedAccountProviderId:
      type: string
      enum:
        - slack
        - github
      description: A service a person can link an account at.
    LinkedAccount:
      type: object
      description: A person's account at another service, which OpenBot knows is theirs. Never the credential it holds.
      required:
        - id
        - provider
        - title
        - handle
        - status
        - createdAt
      properties:
        id:
          type: string
          description: The link's id.
        provider:
          $ref: '#/components/schemas/LinkedAccountProviderId'
        title:
          type: string
          description: The service's name, as a person reads it.
        handle:
          type:
            - string
            - 'null'
          description: Who they are there, such as their GitHub login, when the service said.
        status:
          type: string
          enum:
            - active
            - needs_reconnect
          description: needs_reconnect when the service stopped accepting what the link holds, and linking again mends it.
        createdAt:
          type: string
          format: date-time
    LinkedAccountPage:
      type: object
      required:
        - linkedAccounts
        - nextCursor
      properties:
        linkedAccounts:
          type: array
          description: The oldest link first, then by id.
          items:
            $ref: '#/components/schemas/LinkedAccount'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    LinkedAccountProvider:
      type: object
      required:
        - id
        - title
      properties:
        id:
          $ref: '#/components/schemas/LinkedAccountProviderId'
        title:
          type: string
          description: The service's name, as a person reads it.
    LinkedAccountProviderPage:
      type: object
      required:
        - linkedAccountProviders
        - nextCursor
      properties:
        linkedAccountProviders:
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccountProvider'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    LinkAccountRequest:
      type: object
      additionalProperties: false
      required:
        - provider
      properties:
        provider:
          $ref: '#/components/schemas/LinkedAccountProviderId'
    SlackLinkCode:
      type: object
      description: A one-time code the person sends the OpenBot app in Slack.
      required:
        - provider
        - code
        - expiresAt
        - instruction
      properties:
        provider:
          type: string
          const: slack
        code:
          type: string
          description: The code. It works once, and only for the person it was made for.
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working.
        instruction:
          type: string
          description: What to send, and where, as a person reads it.
    GitHubAuthorization:
      type: object
      description: GitHub's consent page, which sends the person back to OpenBot once they agree.
      required:
        - provider
        - authorizationUrl
      properties:
        provider:
          type: string
          const: github
        authorizationUrl:
          type: string
          format: uri
          description: The address to open. Always GitHub's own authorize page, over HTTPS.
    AccountLinkStart:
      description: What the person does next, by service.
      oneOf:
        - $ref: '#/components/schemas/SlackLinkCode'
        - $ref: '#/components/schemas/GitHubAuthorization'
      discriminator:
        propertyName: provider
        mapping:
          slack: '#/components/schemas/SlackLinkCode'
          github: '#/components/schemas/GitHubAuthorization'
    IdentityProviderProtocol:
      type: string
      enum:
        - saml
        - oidc
      description: How the provider speaks. SAML is what most companies' identity teams supply.
    IdentityProvider:
      type: object
      description: A company's own identity provider, registered for single sign-on at its email domain. Never its client secret or signing certificate.
      required:
        - id
        - issuer
        - domain
        - protocol
        - registeredBy
      properties:
        id:
          type: string
          description: The provider's id, as it was registered.
        issuer:
          type: string
          description: Who issues its sign-ins.
        domain:
          type: string
          description: The email domain that sends somebody to it.
        protocol:
          $ref: '#/components/schemas/IdentityProviderProtocol'
        registeredBy:
          type:
            - string
            - 'null'
          description: The id of the person who registered it, while they still have an account here. Null once they are gone; the provider stays.
    IdentityProviderPage:
      type: object
      required:
        - identityProviders
        - nextCursor
      properties:
        identityProviders:
          type: array
          description: By domain, then by id.
          items:
            $ref: '#/components/schemas/IdentityProvider'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    IdentityProviderResponse:
      type: object
      required:
        - identityProvider
      properties:
        identityProvider:
          $ref: '#/components/schemas/IdentityProvider'
    IdentityProviderText:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[^\x00]*\S[^\x00]*$
    IdentityProviderAddress:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      pattern: ^https?://[^\x00\s]+$
    SamlIdentityProviderRequest:
      type: object
      additionalProperties: false
      required:
        - protocol
        - id
        - domain
        - issuer
        - entryPoint
        - metadata
      properties:
        protocol:
          type: string
          const: saml
        id:
          $ref: '#/components/schemas/NewIdentityProviderId'
        domain:
          $ref: '#/components/schemas/IdentityProviderDomains'
        issuer:
          $ref: '#/components/schemas/IdentityProviderAddress'
        entryPoint:
          $ref: '#/components/schemas/IdentityProviderAddress'
        metadata:
          type: string
          minLength: 1
          maxLength: 200000
          pattern: ^[^\x00]*\S[^\x00]*$
          description: The provider's SAML metadata XML, as its identity team supplied it.
    OidcIdentityProviderRequest:
      type: object
      additionalProperties: false
      required:
        - protocol
        - id
        - domain
        - issuer
        - clientId
        - clientSecret
      properties:
        protocol:
          type: string
          const: oidc
        id:
          $ref: '#/components/schemas/NewIdentityProviderId'
        domain:
          $ref: '#/components/schemas/IdentityProviderDomains'
        issuer:
          $ref: '#/components/schemas/IdentityProviderAddress'
        clientId:
          $ref: '#/components/schemas/IdentityProviderText'
        clientSecret:
          $ref: '#/components/schemas/IdentityProviderText'
    NewIdentityProviderId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[^\x00]*\S[^\x00]*$
      description: An id for the provider, unique in the organization, such as acme-okta.
    IdentityProviderDomains:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[^\x00]*\S[^\x00]*$
      description: The email domain whose people it signs in, such as acme.com. Several are separated by commas.
    CreateIdentityProviderRequest:
      description: A SAML or an OIDC provider, by protocol.
      oneOf:
        - $ref: '#/components/schemas/SamlIdentityProviderRequest'
        - $ref: '#/components/schemas/OidcIdentityProviderRequest'
      discriminator:
        propertyName: protocol
        mapping:
          saml: '#/components/schemas/SamlIdentityProviderRequest'
          oidc: '#/components/schemas/OidcIdentityProviderRequest'
    Deployment:
      type: object
      description: What this OpenBot offers and how people sign in to it.
      required:
        - edition
        - localEvaluation
        - generativeUi
        - selfHostBanner
        - transcription
        - voice
        - durableHistory
        - authProviders
        - ssoConfigured
        - ssoRequired
      properties:
        edition:
          type: string
          enum:
            - team
            - personal
          description: team is OpenBot as an organization runs it; personal is one person on their own machine, with no sign-in and none of the screens that govern other people.
        localEvaluation:
          type: boolean
          description: Whether somebody is trying OpenBot on their own machine, with nobody else able to reach it.
        generativeUi:
          type: boolean
          description: Whether a Bot may answer with an interface it wrote itself.
        selfHostBanner:
          type: boolean
          description: Whether to offer help self-hosting OpenBot.
        transcription:
          type: boolean
          description: Whether a person can dictate a message.
        voice:
          type: boolean
          description: Whether a person can talk to a Bot.
        durableHistory:
          type: boolean
          description: Whether conversations are kept between restarts.
        authProviders:
          type: array
          description: The social sign-ins offered, by id.
          items:
            type: string
            enum:
              - google
              - microsoft
              - okta
        ssoConfigured:
          type: boolean
          description: Whether a company's own identity provider is registered, so an email address can be sent to it. Never which.
        ssoRequired:
          type: boolean
          description: Whether an administrator requires single sign-on; social sign-in then stays only as the configured administrators' way in.
    AllowlistEntry:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[^\x00]*\S[^\x00]*$
    OrganizationSettingValues:
      type: object
      properties:
        ssoRequired:
          type: boolean
          description: Whether people must sign in through the organization's identity provider. The administrators the deployment's configuration names keep social sign-in as their way in.
        actionRecording:
          type: boolean
          description: Whether what Bots do on their computers is recorded, to read in computer actions.
        inactiveComputerDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: Days a Bot computer may sit idle before it is stopped. 0 never stops one.
        modelAllowlist:
          type: object
          additionalProperties: false
          required:
            - enabled
            - models
          properties:
            enabled:
              type: boolean
              description: Whether the list limits anything. Off, every model is allowed.
            models:
              type: array
              maxItems: 500
              description: The models Bots may run on, as provider/model.
              items:
                $ref: '#/components/schemas/AllowlistEntry'
        mcpAllowlist:
          type: object
          additionalProperties: false
          required:
            - enabled
            - servers
          properties:
            enabled:
              type: boolean
              description: Whether the list limits anything. Off, every app is allowed.
            servers:
              type: array
              maxItems: 500
              description: The apps Bots may use, by id.
              items:
                $ref: '#/components/schemas/AllowlistEntry'
        skillSharing:
          type: boolean
          description: Whether people may open the skills learned from their recordings to every Bot.
        proactiveDailyRuns:
          type: integer
          minimum: 1
          maximum: 1440
          description: How many check-ins each Bot may run for one person in a day.
        modelSelection:
          type: boolean
          description: Whether people may pick the model a built-in Bot answers on, per conversation.
    OrganizationSettings:
      allOf:
        - $ref: '#/components/schemas/OrganizationSettingValues'
        - type: object
          required:
            - ssoRequired
            - actionRecording
            - inactiveComputerDays
            - modelAllowlist
            - mcpAllowlist
            - skillSharing
            - proactiveDailyRuns
            - modelSelection
            - context
          properties:
            context:
              $ref: '#/components/schemas/OrganizationSettingsContext'
    OrganizationSettingsContext:
      type: object
      readOnly: true
      description: What an administrator needs to set the settings. Read only.
      required:
        - builtInModel
        - directoryGroups
        - apps
        - defaultDestinations
        - scim
        - otel
        - actionRecordRetentionDays
      properties:
        builtInModel:
          type:
            - string
            - 'null'
          description: The model OpenBot's own Bots run on, when one is set.
        directoryGroups:
          type: array
          description: The directory groups people belong to, by name.
          items:
            type: string
        apps:
          type: array
          description: The apps an allowlist can name.
          items:
            type: object
            required:
              - id
              - title
              - url
            properties:
              id:
                type: string
              title:
                type: string
              url:
                type: string
        defaultDestinations:
          type: array
          description: The package registries and source hosts every computer may reach unless the list is the only thing allowed.
          items:
            type: string
        scim:
          type: object
          required:
            - configured
            - connectionId
            - baseUrl
            - rotating
          properties:
            configured:
              type: boolean
            connectionId:
              type: string
            baseUrl:
              type:
                - string
                - 'null'
            rotating:
              type: boolean
              description: Whether a second token is set while the first is being replaced.
        otel:
          type: object
          required:
            - configured
          properties:
            configured:
              type: boolean
        actionRecordRetentionDays:
          type: integer
          description: How many days recorded computer actions are kept.
    UpdateOrganizationSettingsRequest:
      allOf:
        - $ref: '#/components/schemas/OrganizationSettingValues'
      description: The settings to change. At least one; the rest stay as they are.
      minProperties: 1
    InactiveComputersStopped:
      type: object
      required:
        - stopped
        - skipped
      properties:
        stopped:
          type: array
          description: The Bots whose computers stopped.
          items:
            type: string
        skipped:
          type:
            - string
            - 'null'
          description: Why nothing was stopped, when nothing was looked at.
    PersonComputersStopped:
      type: object
      required:
        - stopped
        - failed
      properties:
        stopped:
          type: array
          description: 'The computers stopped: `person:<id>` for the person''s own, which every Bot they use runs on, and `bot:<id>` for each of their Bots that has a computer of its own.'
          items:
            type: string
        failed:
          type: array
          description: The ones that would not stop, and why.
          items:
            type: object
            required:
              - computer
              - reason
            properties:
              computer:
                type: string
                description: The computer, named as in `stopped`.
              reason:
                type: string
    CapabilityId:
      type: string
      enum:
        - useBots
        - cloudBrowser
        - cloudNetwork
        - cloudComputer
        - localComputer
        - customRules
        - passwordManager
        - slackTeams
        - teamBots
        - ownerApps
        - isolatedComputers
        - proactive
      description: A permission switch.
    Capability:
      type: object
      description: A permission switch, and what each level set it to. Null at a level means it sets nothing and the level beneath decides.
      required:
        - id
        - title
        - description
        - default
        - organization
        - roles
        - groups
      properties:
        id:
          $ref: '#/components/schemas/CapabilityId'
        title:
          type: string
        description:
          type: string
        default:
          type: boolean
          description: What applies where nothing is set.
        organization:
          type:
            - boolean
            - 'null'
        roles:
          type: object
          description: What each member role is set to, by role. A role absent sets nothing.
          properties:
            owner:
              type: boolean
            admin:
              type: boolean
            member:
              type: boolean
        groups:
          type: object
          description: What each directory group is set to, by the group's name. A group absent sets nothing. Team scopes will be added when teams arrive.
          additionalProperties:
            type: boolean
    CapabilityPage:
      type: object
      required:
        - capabilities
        - nextCursor
      properties:
        capabilities:
          type: array
          description: In the order the screens show them.
          items:
            $ref: '#/components/schemas/Capability'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    SwitchValue:
      type:
        - boolean
        - 'null'
      description: On, off, or null to clear it so the level beneath decides.
    UpdateCapabilityRequest:
      type: object
      description: The levels to set or clear. At least one.
      additionalProperties: false
      minProperties: 1
      properties:
        organization:
          $ref: '#/components/schemas/SwitchValue'
        roles:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            admin:
              $ref: '#/components/schemas/SwitchValue'
            member:
              $ref: '#/components/schemas/SwitchValue'
        groups:
          type: object
          minProperties: 1
          maxProperties: 100
          description: By directory group name, 1 to 200 characters. Team scopes will be added when teams arrive.
          propertyNames:
            minLength: 1
            maxLength: 200
            pattern: ^[^\x00]*\S[^\x00]*$
          additionalProperties:
            $ref: '#/components/schemas/SwitchValue'
    CapabilityChange:
      type: object
      additionalProperties: false
      required:
        - scopeKind
        - capability
        - allowed
      properties:
        scopeKind:
          type: string
          enum:
            - organization
            - role
            - group
          description: 'Whose switch: the organization''s, a member role''s, or a directory group''s. Team scopes will be added when teams arrive.'
        scopeId:
          type: string
          maxLength: 200
          pattern: ^[^\x00]*$
          description: Empty for the organization; admin or member for a role; a directory group's name for a group. Team scopes will be added when teams arrive.
        capability:
          $ref: '#/components/schemas/CapabilityId'
        allowed:
          $ref: '#/components/schemas/SwitchValue'
    Authoring:
      type: object
      additionalProperties: false
      required:
        - source
        - text
      description: The sentence in English a change was written from, recorded with it.
      properties:
        source:
          type: string
          const: english
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^[^\x00]*\S[^\x00]*$
    CapabilityChangesToPreview:
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          description: 'Changes to check and preview, as a screen holds them while an admin edits what a description wrote. One that names a permission, role or group that isn''t one is not refused: the answer''s `check` says what is wrong with it.'
          items:
            $ref: '#/components/schemas/CapabilityChangeToCheck'
    CapabilityChangeToCheck:
      type: object
      additionalProperties: false
      required:
        - scopeKind
        - capability
        - allowed
      properties:
        scopeKind:
          type: string
          enum:
            - organization
            - role
            - group
          description: 'Whose switch: the organization''s, a member role''s, or a directory group''s. Team scopes will be added when teams arrive.'
        scopeId:
          type: string
          maxLength: 200
          pattern: ^[^\x00]*$
          description: Empty for the organization; admin or member for a role; a directory group's name for a group. Team scopes will be added when teams arrive.
        capability:
          type: string
          maxLength: 100
          pattern: ^[^\x00]*$
          description: The permission, by its id. One that isn't a permission is named in `check`.
        allowed:
          $ref: '#/components/schemas/SwitchValue'
    CapabilityChanges:
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CapabilityChange'
        authoring:
          $ref: '#/components/schemas/Authoring'
    SavedCapabilityChanges:
      type: object
      required:
        - saved
      properties:
        saved:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityChange'
    ChangeDescription:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: ^[^\x00]*\S[^\x00]*$
          description: The change in a sentence or two, at most 1,000 characters once trimmed.
    RuleCheck:
      type: object
      description: Whether a proposal passes the rule a save applies, and what is wrong when it doesn't.
      required:
        - ok
      properties:
        ok:
          type: boolean
        error:
          type: string
        problems:
          type: array
          items: {}
    CapabilityTranslation:
      type: object
      required:
        - changes
        - summary
        - explanation
        - check
        - warning
      properties:
        changes:
          type: array
          description: The changes the model wrote. When `check.ok` is true each is a valid CapabilityChange; when it is false they are as written, so the admin can see what failed, and `check.problems` says which.
          items:
            $ref: '#/components/schemas/WrittenCapabilityChange'
        summary:
          type:
            - string
            - 'null'
        explanation:
          type:
            - string
            - 'null'
        check:
          $ref: '#/components/schemas/RuleCheck'
        warning:
          type:
            - string
            - 'null'
    WrittenCapabilityChange:
      type: object
      description: A switch change as the model wrote it, before it is checked.
      required:
        - scopeKind
        - scopeId
        - capability
        - allowed
      properties:
        scopeKind:
          type: string
          enum:
            - organization
            - role
            - group
          description: 'Whose switch: the organization''s, a member role''s, or a directory group''s. Team scopes will be added when teams arrive.'
        scopeId:
          type: string
          description: Empty for the organization; admin or member for a role; a directory group's name for a group.
        capability:
          type: string
        allowed:
          $ref: '#/components/schemas/SwitchValue'
    CapabilityAnswer:
      type: object
      required:
        - allowed
        - decidedBy
        - scopeId
      properties:
        allowed:
          type: boolean
        decidedBy:
          type: string
          enum:
            - default
            - organization
            - role
            - group
        scopeId:
          type: string
          description: The role or group that decided it. Empty otherwise.
    CapabilityPreview:
      type: object
      required:
        - check
        - people
        - counts
        - activity
        - warning
      properties:
        check:
          $ref: '#/components/schemas/RuleCheck'
        people:
          type: array
          items:
            type: object
            required:
              - id
              - email
              - name
              - role
              - groups
              - capabilities
            properties:
              id:
                type: string
              email:
                type: string
              name:
                type:
                  - string
                  - 'null'
              role:
                $ref: '#/components/schemas/PersonRole'
              groups:
                type: array
                items:
                  type: string
              capabilities:
                type: array
                items:
                  type: object
                  required:
                    - capability
                    - title
                    - before
                    - after
                  properties:
                    capability:
                      $ref: '#/components/schemas/CapabilityId'
                    title:
                      type: string
                    before:
                      $ref: '#/components/schemas/CapabilityAnswer'
                    after:
                      $ref: '#/components/schemas/CapabilityAnswer'
                    activity:
                      type: object
                      required:
                        - what
                        - count
                        - more
                        - recent
                      properties:
                        what:
                          type: string
                        count:
                          type: integer
                        more:
                          type: boolean
                        recent:
                          type: array
                          items:
                            $ref: '#/components/schemas/AuditEvent'
        counts:
          type: object
          required:
            - people
            - losing
            - gaining
            - keeping
            - unchanged
          properties:
            people:
              type: integer
            losing:
              type: integer
            gaining:
              type: integer
            keeping:
              type: integer
            unchanged:
              type: integer
        activity:
          type: object
          required:
            - days
            - unmapped
          properties:
            days:
              type: integer
            unmapped:
              type: array
              items:
                type: object
                required:
                  - capability
                  - title
                properties:
                  capability:
                    $ref: '#/components/schemas/CapabilityId'
                  title:
                    type: string
        warning:
          type:
            - string
            - 'null'
    PersonCapabilities:
      type: object
      required:
        - capabilities
        - enforced
      properties:
        capabilities:
          type: object
          description: Each switch, on or off for this person.
          additionalProperties:
            type: boolean
        enforced:
          type: boolean
          description: False where the deployment keeps no switches and every default applies.
    NetworkMode:
      type: string
      enum:
        - allow_all
        - defaults_plus_allowlist
        - allowlist_only
      description: allow_all lets computers connect anywhere; defaults_plus_allowlist to the list and the default destinations; allowlist_only to the list alone.
    EgressRule:
      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - domain
            - cidr
        value:
          type: string
          minLength: 1
          maxLength: 253
          description: A host, which covers its subdomains, or an IP range in CIDR form.
        ports:
          type: string
          maxLength: 100
          description: Ports, such as 443 or 8000-8100, separated by commas. Absent is every port.
    WrittenEgressRule:
      type: object
      description: An allowlist entry as the model wrote it, before it is parsed.
      required:
        - type
        - value
      properties:
        type:
          type: string
        value:
          type: string
        ports:
          type: string
    NetworkPolicy:
      type: object
      required:
        - id
        - scopeKind
        - scopeId
        - mode
        - rules
        - locked
        - updatedBy
        - updatedAt
      properties:
        id:
          type: string
          description: organization, or group:<name> for a directory group. Team scopes will be added when teams arrive.
        scopeKind:
          type: string
          enum:
            - organization
