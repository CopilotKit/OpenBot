    get:
      tags:
        - Devices
      operationId: listDevices
      summary: List a person's devices
      description: Return one page of the phones a person registered for push notifications, the first registered first. Never a device's push token. Only the person themselves may list them; there is no administrator view. A missing cursor starts at the first page and nextCursor null ends the list.
      security:
