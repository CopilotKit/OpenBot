          minLength: 1
          maxLength: 128
          pattern: \S
          description: A conversation the caller and the Bot share.
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: \S
          description: What the goal is called.
        instruction:
          type: string
          minLength: 1
          maxLength: 6000
          pattern: \S
          description: What the Bot is to do.
        successCriteria:
          type: string
          description: When it is done.
          maxLength: 3000
          default: ''
        subscriptions:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: '#/components/schemas/GoalSubscription'
        recurring:
          type: boolean
          default: false
        endsWhenMet:
          type: boolean
          default: false
    GoalResponse:
      type: object
      required:
        - goal
      properties:
        goal:
          $ref: '#/components/schemas/Goal'
        sharedApps:
          $ref: '#/components/schemas/SharedAppsAfterChange'
    UpdateGoalRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: \S
          description: What the goal is called.
        instruction:
          type: string
          minLength: 1
          maxLength: 6000
          pattern: \S
          description: What the Bot is to do.
        successCriteria:
          type: string
          description: When it is done.
          maxLength: 3000
        subscriptions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/GoalSubscription'
        recurring:
          type: boolean
        endsWhenMet:
          type: boolean
    GoalRunAccepted:
      type: object
      required:
        - eventId
        - duplicate
        - runIds
      properties:
        eventId:
          type: string
          description: The request, as the goal's event log keeps it.
        duplicate:
          type: boolean
          description: Whether this request had been taken already.
        runIds:
          type: array
          description: The runs it started.
          items:
            type: string
    GoalRun:
      type: object
      description: One run of a goal, with what the Bot said.
      required:
        - id
        - status
        - replyText
        - error
        - waiting
        - startedAt
        - finishedAt
        - createdAt
      properties:
        id:
          type: string
          description: The run's id.
        status:
          type: string
          enum:
            - queued
            - running
            - waiting
            - succeeded
            - failed
            - skipped
        replyText:
          type:
            - string
            - 'null'
          description: What the Bot said, or null.
        error:
          type:
            - string
            - 'null'
          description: Why it failed or was skipped, or null.
        waiting:
          oneOf:
            - type: object
              description: What the run waits on the person for.
              required:
                - kind
              properties:
                kind:
                  type: string
                  description: What kind of answer it waits for.
                requestId:
                  type: string
                  description: The approval or question it waits on.
              additionalProperties: true
            - type: 'null'
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it started, or null while queued.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it ended, or null.
        createdAt:
          type: string
          format: date-time
          description: When it was asked for.
    GoalRunPage:
      type: object
      required:
        - runs
        - nextCursor
      properties:
        runs:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/GoalRun'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    GoalTriggerFilter:
      type: object
      additionalProperties: false
      description: Which of the events this kind delivers fire the trigger.
      properties:
        eventTypes:
          type: array
          maxItems: 20
          default: []
          description: 'Event types that fire the trigger. Empty means every event. A type matches itself and its sub-types: issues matches issues.opened.'
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: \S
        field:
          type: object
          additionalProperties: false
          required:
            - path
            - equals
          description: One field of the event that must equal a value.
          properties:
            path:
              type: string
              pattern: ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+){0,7}$
              description: A dotted path into the event, such as data.team.key.
            equals:
              type: string
              minLength: 1
              maxLength: 256
              pattern: \S
    WebhookTriggerConfig:
      type: object
      additionalProperties: false
      description: Any service that can send a signed webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: webhook
        filter:
          $ref: '#/components/schemas/GoalTriggerFilter'
    GithubTriggerConfig:
      type: object
      additionalProperties: false
      description: A GitHub webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: github
        repository:
          type: string
          maxLength: 256
          pattern: ^[\w.-]+/[\w.-]+$
          description: The repository, as owner/name. Deliveries for any other are refused.
        filter:
          $ref: '#/components/schemas/GoalTriggerFilter'
    LinearTriggerConfig:
      type: object
      additionalProperties: false
      description: A Linear webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: linear
        filter:
          $ref: '#/components/schemas/GoalTriggerFilter'
    SentryTriggerConfig:
      type: object
      additionalProperties: false
      description: A Sentry webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: sentry
        filter:
          $ref: '#/components/schemas/GoalTriggerFilter'
    PagerdutyTriggerConfig:
      type: object
      additionalProperties: false
      description: A PagerDuty webhook.
      required:
        - kind
      properties:
        kind:
          type: string
          const: pagerduty
        filter:
          $ref: '#/components/schemas/GoalTriggerFilter'
    EmailTriggerConfig:
      type: object
      additionalProperties: false
      description: An email to the trigger's own address.
      required:
        - kind
      properties:
        kind:
          type: string
          const: email
        allowedSenders:
          type: array
          maxItems: 20
          default: []
          description: Addresses or domains allowed to send. Empty admits any sender.
          items:
            type: string
            minLength: 1
            maxLength: 254
            pattern: \S
        filter:
          $ref: '#/components/schemas/GoalTriggerFilter'
    SlackTriggerConfig:
      type: object
      additionalProperties: false
      description: A Slack message in a workspace where the goal's owner linked their own Slack account.
      required:
        - kind
        - teamId
        - mode
      properties:
        kind:
          type: string
          const: slack
        teamId:
          type: string
          pattern: ^[A-Z0-9]{2,32}$
          description: The Slack workspace's id, such as T0123ABCD.
        mode:
          type: string
          enum:
            - mention
            - phrase
            - reaction
            - message
        phrases:
          type: array
          maxItems: 20
          default: []
          description: 'For phrase: any one of these, in any case, fires it.'
          items:
            type: string
            minLength: 1
            maxLength: 200
            pattern: \S
        reactions:
          type: array
          maxItems: 20
          default: []
          description: 'For reaction: emoji names without colons. Empty means any reaction.'
          items:
            type: string
            pattern: ^[a-z0-9_+'-]{1,100}$
        channels:
          type: array
          maxItems: 50
          default: []
          description: Slack channel ids. Empty means every channel the Bot is in.
          items:
            type: string
            pattern: ^[CDG][A-Z0-9]{2,32}$
    GoalTriggerConfig:
      description: What a trigger listens for, by its kind.
      oneOf:
        - $ref: '#/components/schemas/WebhookTriggerConfig'
        - $ref: '#/components/schemas/GithubTriggerConfig'
        - $ref: '#/components/schemas/LinearTriggerConfig'
        - $ref: '#/components/schemas/SentryTriggerConfig'
        - $ref: '#/components/schemas/PagerdutyTriggerConfig'
        - $ref: '#/components/schemas/EmailTriggerConfig'
        - $ref: '#/components/schemas/SlackTriggerConfig'
      discriminator:
        propertyName: kind
        mapping:
          webhook: '#/components/schemas/WebhookTriggerConfig'
          github: '#/components/schemas/GithubTriggerConfig'
          linear: '#/components/schemas/LinearTriggerConfig'
          sentry: '#/components/schemas/SentryTriggerConfig'
          pagerduty: '#/components/schemas/PagerdutyTriggerConfig'
          email: '#/components/schemas/EmailTriggerConfig'
          slack: '#/components/schemas/SlackTriggerConfig'
    GoalTrigger:
      type: object
      description: 'A registered way for an outside event to start a run of a goal. Never its secret: hasSecret says whether one is set.'
      required:
        - id
        - goalId
        - kind
        - config
        - hasSecret
        - enabled
        - path
        - address
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: The trigger's id.
        goalId:
          type: string
          description: The goal it starts.
        kind:
          type: string
          enum:
            - webhook
            - github
            - linear
            - sentry
            - pagerduty
            - email
            - slack
        config:
          $ref: '#/components/schemas/GoalTriggerConfig'
        hasSecret:
          type: boolean
        enabled:
          type: boolean
          description: 'False while it is off: it acknowledges deliveries and never starts a run.'
        path:
          type:
            - string
            - 'null'
          description: The path on this server the sending service posts to, for webhook and provider kinds. Null for email and Slack.
        address:
          type:
            - string
            - 'null'
          description: The address to send mail to, for an email trigger where inbound email is set up. Null otherwise.
        emailConfigured:
          type: boolean
          description: For an email trigger, whether this OpenBot can receive email at all.
        createdAt:
          type: string
          format: date-time
          description: When it was added.
        updatedAt:
          type: string
          format: date-time
          description: When it last changed.
    GoalTriggerPage:
      type: object
      required:
        - triggers
        - nextCursor
      properties:
        triggers:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/GoalTrigger'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    CreateGoalTriggerRequest:
      type: object
      additionalProperties: false
      required:
        - config
      properties:
        config:
          $ref: '#/components/schemas/GoalTriggerConfig'
        secret:
          type: string
          writeOnly: true
          maxLength: 4096
          description: The signing secret pasted from the provider, for kinds whose secret the provider makes. Stored encrypted.
    GoalTriggerWithSecret:
      type: object
      required:
        - trigger
        - secret
      properties:
        trigger:
          $ref: '#/components/schemas/GoalTrigger'
        secret:
          type:
            - string
            - 'null'
          description: The secret OpenBot made, shown this once. Null when the secret was pasted, or the kind has none.
        sharedApps:
          $ref: '#/components/schemas/SharedAppsAfterChange'
    UpdateGoalTriggerRequest:
      type: object
      additionalProperties: false
      required:
        - config
      properties:
        config:
          $ref: '#/components/schemas/GoalTriggerConfig'
    GoalTriggerResponse:
      type: object
      required:
        - trigger
      properties:
        trigger:
          $ref: '#/components/schemas/GoalTrigger'
        sharedApps:
          $ref: '#/components/schemas/SharedAppsAfterChange'
    GoalTriggerSecret:
      type: object
      required:
        - secret
      properties:
        secret:
          type:
            - string
            - 'null'
          description: The secret, or null for a kind that has none.
    ReplaceGoalTriggerSecretRequest:
      type: object
      additionalProperties: false
      properties:
        secret:
          type: string
          writeOnly: true
          maxLength: 4096
          description: The provider's new signing secret. Absent has OpenBot make one, for a webhook or GitHub trigger.
    GithubEventSource:
      type: object
      description: A GitHub repository whose webhook reaches the person's goals. Never its secret.
      required:
        - id
        - source
        - repository
        - createdAt
      properties:
        id:
          type: string
          description: The source's id.
        source:
          type: string
          const: github
        repository:
          type: string
          description: The repository, as owner/name.
        createdAt:
          type: string
          format: date-time
          description: When it was connected.
        webhookPath:
          type: string
          description: The path on this server to give the repository's webhook. Answered when the source is made.
    GithubEventSourcePage:
      type: object
      required:
        - githubEventSources
        - nextCursor
      properties:
        githubEventSources:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/GithubEventSource'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    CreateGithubEventSourceRequest:
      type: object
      additionalProperties: false
      required:
        - repository
        - secret
      properties:
        repository:
          type: string
          maxLength: 256
          pattern: ^[\w.-]+/[\w.-]+$
          description: The repository, as owner/name.
        secret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: The secret set on the repository's webhook.
    GithubEventSourceResponse:
      type: object
      required:
        - githubEventSource
      properties:
        githubEventSource:
          $ref: '#/components/schemas/GithubEventSource'
    FollowUpCancelled:
      type: object
      required:
        - cancelled
      properties:
        cancelled:
          type: boolean
          const: true
    Organization:
      type: object
      description: One organization, as one of its members sees it. role and active are the server's verdicts about the caller.
      required:
        - id
        - slug
        - name
        - role
        - active
      properties:
        id:
          type: string
          description: The organization's id. Opaque.
        slug:
          type: string
          description: Its short name, which also addresses it.
        name:
          type: string
          description: What people call it.
        role:
          $ref: '#/components/schemas/PersonRole'
        active:
          type: boolean
          description: Whether the caller's session is working in this one. Always false for a request with no session.
    OrganizationPage:
      type: object
      required:
        - organizations
        - canCreate
        - nextCursor
      properties:
        organizations:
          type: array
          description: The one the caller joined first at the top.
          items:
            $ref: '#/components/schemas/Organization'
        canCreate:
          type: boolean
          description: 'Whether the caller may create an organization: the server''s verdict, true for the deployment''s admins and for anybody signed in when the deployment lets them. The same on every page.'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\x00]*\S[^\x00]*$
          description: What people call it.
        slug:
          type: string
          minLength: 2
          maxLength: 48
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: 'Its short name: lowercase letters, digits and single hyphens. Unique in the install. Made from the name when absent.'
    OrganizationResponse:
      type: object
      required:
        - organization
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
    OrganizationMember:
      type: object
      description: One member of an organization.
      required:
        - id
        - email
        - name
        - image
        - role
        - joinedAt
      properties:
        id:
          type: string
          description: The person's id.
        email:
          type: string
          description: Their address.
        name:
          type:
            - string
            - 'null'
          description: What OpenBot calls them. Null until they choose.
        image:
          type:
            - string
            - 'null'
          description: Their picture's address, when they have one.
        role:
          $ref: '#/components/schemas/PersonRole'
        joinedAt:
          type: string
          format: date-time
          description: When they became a member.
    OrganizationMemberPage:
      type: object
      required:
        - members
        - nextCursor
      properties:
        members:
          type: array
          description: In the order they joined.
          items:
            $ref: '#/components/schemas/OrganizationMember'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    AddOrganizationMemberRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          pattern: ^[^\s\x00]+@[^\s\x00]+$
          description: The address of somebody who already has an account here.
        role:
          $ref: '#/components/schemas/AssignableRole'
    OrganizationMemberResponse:
      type: object
      required:
        - member
      properties:
        member:
          $ref: '#/components/schemas/OrganizationMember'
  responses:
    InvalidRequest:
      description: A parameter is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: A Bot id is required.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidBot:
      description: A field is missing or out of bounds, the address is one this deployment may not reach, or the deployment cannot give a Bot a computer of its own.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            name:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Name must be text between 1 and 80 characters.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            noIsolation:
              value:
                type: https://open.bot/errors/isolation-unavailable
                title: This OpenBot can't give a Bot a computer of its own.
                status: 400
                detail: This OpenBot can't give a Bot a computer of its own, so it runs on yours.
                code: ISOLATION_UNAVAILABLE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    Unauthenticated:
      description: The caller is not signed in.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/auth-unauthenticated
                title: Authentication is required.
                status: 401
                detail: Authentication required.
                code: AUTH_UNAUTHENTICATED
                category: auth
                retryable: false
                requestId: req_example
                traceId: trace_example
    Forbidden:
      description: The caller holds no role in this organization.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noRole:
              value:
                type: https://open.bot/errors/permission-denied
                title: Authorization required.
                status: 403
                detail: Authorization required.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    BotForbidden:
      description: The caller may not manage this Bot, the Bot comes with OpenBot, or the caller may not give it a computer of its own.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: You can't manage this Bot.
                status: 403
                detail: You can't manage this Bot.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            isolation:
              value:
                type: https://open.bot/errors/capability-required
                title: Your admin hasn't turned on Isolated Bots for you.
                status: 403
                detail: Your admin hasn't turned on Isolated Bots for you.
                code: CAPABILITY_REQUIRED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
                capability: isolatedComputers
    AdminOnly:
      description: The caller is not an administrator of the organization, or holds no role in it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAdmin:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only an admin can do this.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidAuditQuestion:
      description: The question is blank or longer than 500 characters once trimmed, holds a character OpenBot can't keep, or a parameter is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            blank:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Ask a question first.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            long:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Keep the question under 500 characters. Ask one thing at a time.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    AuditQuestionNotUnderstood:
      description: The model's filters still failed their check on its second try, so none are given.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notUnderstood:
              value:
                type: https://open.bot/errors/question-not-understood
                title: Couldn't turn that question into filters.
                status: 422
                detail: Couldn't turn that question into filters. Ask it another way, or set the filters yourself.
                code: QUESTION_NOT_UNDERSTOOD
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    ModelFailed:
      description: The model didn't answer, or didn't answer usefully. Asking again may work.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unreachable:
              value:
                type: https://open.bot/errors/model-failed
                title: The model didn't answer.
                status: 502
                detail: Couldn't reach the model. Try again.
                code: MODEL_FAILED
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    ModelNotConfigured:
      description: The deployment has no model to read a question with.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noModel:
              value:
                type: https://open.bot/errors/model-not-configured
                title: OpenBot has no model to answer with.
                status: 503
                detail: OpenBot needs a model key to answer a question. Add one in the Vault, or set the filters yourself.
                code: MODEL_NOT_CONFIGURED
                category: dependency
                retryable: false
                requestId: req_example
                traceId: trace_example
    OrganizationNotFound:
      description: The organization does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/organization-not-found
                title: Organization not found.
                status: 404
                detail: Couldn't find that organization.
                code: ORGANIZATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    BotNotFound:
      description: The Bot does not exist, was deleted, or is not visible to the caller, or the organization is not.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
