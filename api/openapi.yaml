        - runId
        - realtime
      properties:
        joinToken:
          type: string
          minLength: 1
          description: Sent as the join_token query parameter when opening the socket. It works once.
        expiresAt:
          type: string
          format: date-time
          description: After this the token no longer opens a socket. A socket it already opened stays open.
        threadId:
          type: string
          minLength: 1
          description: The conversation's thread, as the caller sees it.
        runId:
          type:
            - string
            - 'null'
          description: The run in progress in the thread, or null when the Bot is not working.
        realtime:
          type: object
          description: Where to use the token.
          required:
            - clientUrl
            - topic
          properties:
            clientUrl:
              type: string
              minLength: 1
              description: The socket's address, without the /websocket it ends in or its query. A ws or wss address, or a path on this server.
            topic:
              type: string
              pattern: ^thread:.+$
              description: The topic to join on the socket, thread:{threadId}.
    CredentialKind:
      type: string
      description: 'What a credential is for. model: a key OpenBot''s Bots call a model with. connector: an app''s key. mcp: a token for an app''s server. agent: a key for a company''s own agent. mcp_oauth_client: the organization''s registration with an app. mcp_user_token: one person''s sign-in to an app, kept when they connected it.'
      enum:
        - model
        - connector
        - agent
        - mcp
        - mcp_oauth_client
        - mcp_user_token
    Credential:
      type: object
      description: 'A credential in the vault as the API shows it: what it is for and whether it is live. Never its secret, which only ever goes in.'
      required:
        - id
        - kind
        - provider
        - keyId
        - metadata
        - createdAt
        - revokedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CredentialKind'
        provider:
          type: string
          description: 'Who the secret is for: a model provider such as openai, an app, or an app''s server.'
        keyId:
          type: string
          description: The name it is kept under. A key holds one live credential at a time.
        metadata:
          type: object
          additionalProperties: true
          description: What was said about it when it was added. Never secret.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was revoked. Null while it is live.
    CredentialPage:
      type: object
      required:
        - credentials
        - nextCursor
      properties:
        credentials:
          type: array
          description: Oldest first, and by id among credentials added at the same moment.
          items:
            $ref: '#/components/schemas/Credential'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    CredentialInput:
      type: object
      additionalProperties: false
      required:
        - kind
        - provider
        - secret
      properties:
        kind:
          type: string
          description: 'model, connector or mcp. The other kinds are written by what they belong to: an app''s registration when it is added, a person''s sign-in when they connect it.'
          enum:
            - model
            - connector
            - mcp
        provider:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: 'Who the secret is for: for a model key, the provider the Bots run on (getModelKey). Trimmed.'
        keyId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The name to keep it under. Required, except for a model key, which is filed under the name the Bots read (getModelKey). Trimmed.
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 1000
          description: What to say about it. Never secret. Empty when left out.
        secret:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: 'The secret itself. Encrypted before it is kept, and never sent back: no answer includes it, now or later.'
    ModelKey:
      type: object
      description: Where OpenBot's own Bots find their model key in the vault, and whether one is kept there. Never the key.
      required:
        - provider
        - keyId
        - set
      properties:
        provider:
          type: string
          enum:
            - openai
            - anthropic
          description: The provider the Bots run on.
        keyId:
          type: string
          description: The name the key is kept under.
        set:
          type: boolean
          description: Whether a live model key is kept under that name.
    ModelOption:
      type: object
      description: One model a Bot can run on.
      required:
        - id
        - label
      properties:
        id:
          type: string
          description: What a run sends upstream.
        label:
          type: string
          description: What a model picker shows.
        vendor:
          type: string
          description: Who makes it, as a brand id such as openai or anthropic. Absent for a gateway's own alias, which names no maker.
        efforts:
          type: array
          description: How hard it can be asked to think, weakest first, such as none, minimal, low, medium, high, xhigh and max. Absent when it takes no effort, or nothing says which it takes.
          items:
            type: string
        defaultEffort:
          type: string
          description: The effort it thinks at when none is sent, when its provider says.
    ModelCatalogue:
      type: object
      description: The models Bots can run on, and which one a run uses by default.
      required:
        - provider
        - source
        - exposure
        - default
        - models
        - choosable
        - listed
      properties:
        provider:
          type: string
          enum:
            - openai
            - anthropic
          description: 'The provider prefix the model allowlist names models with (provider/model). Not who serves the models: that is source.'
        source:
          type: string
          enum:
            - openai
            - anthropic
            - google
            - xai
            - gateway
            - chatgpt
            - claude
          description: 'Who serves the models: a provider''s own API, an OpenAI-compatible gateway in front of one, or a ChatGPT or Claude plan.'
        exposure:
          type: string
          enum:
            - all
            - allowed
          description: 'Who decides what people may pick. all: one person on their own machine, offered every model listed. allowed: a team, offered the models an administrator allowed.'
        default:
          type: string
          description: What a run uses when nobody picked. Always one of models.
        models:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/ModelOption'
        choosable:
          type: boolean
          description: Whether people have anything to pick. False until an administrator allows a model in a team, or while the listing can't be read.
        listed:
          type: boolean
          description: Whether the listing was read. False means only the deployment's own model is known.
    ModelChoice:
      type: object
      description: 'The model and thinking effort a person chose for one conversation. Null model: the default model. Null effort: none is sent, so the model thinks on its own default.'
      required:
        - model
        - effort
      properties:
        model:
          type:
            - string
            - 'null'
        effort:
          type:
            - string
            - 'null'
    ModelChoiceInput:
      type: object
      additionalProperties: false
      required:
        - model
        - effort
      properties:
        model:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 500
          pattern: \S
          description: A model the catalogue offers, or null for the default. Trimmed.
        effort:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 40
          pattern: \S
          description: An effort the model takes, or null for its own. Trimmed, and read in lower case.
    PlaygroundSource:
      type: object
      description: The published source of a component written in Playground. It runs in an isolated frame and reaches nothing but the arguments it is drawn with.
      required:
        - html
        - css
        - jsFunctions
        - argumentSchema
        - revision
      properties:
        html:
          type: string
        css:
          type: string
        jsFunctions:
          type: string
          description: Script that fills in the HTML from window.__args.
        argumentSchema:
          type: object
          description: The arguments the model fills in, as JSON Schema. Empty when it takes none.
          additionalProperties: true
        revision:
          type: integer
          minimum: 1
          description: How many times it has been published.
    PlaygroundDraftSource:
      type: object
      additionalProperties: false
      description: A Playground component's source, as an admin edits it.
      required:
        - html
        - css
        - jsFunctions
        - argumentSchema
        - sampleArguments
      properties:
        html:
          type: string
        css:
          type: string
        jsFunctions:
          type: string
          description: Script that fills in the HTML from window.__args.
        argumentSchema:
          type: object
          description: The arguments the model fills in, as JSON Schema.
          additionalProperties: true
        sampleArguments:
          type: object
          description: The arguments Playground previews it with.
          additionalProperties: true
    ComponentDraft:
      type: object
      description: A component's working copy. For one that comes with OpenBot only the description is drafted, and source is null.
      required:
        - title
        - description
        - source
      properties:
        title:
          type: string
        description:
          type: string
          description: The description the model will read once it is published.
        source:
          oneOf:
            - $ref: '#/components/schemas/PlaygroundDraftSource'
            - type: 'null'
    Component:
      type: object
      description: 'Something a Bot draws in a conversation instead of answering in text: a chart, a card, or one an admin wrote in Playground. draft, hasUnpublishedChanges, withheldFrom, functions and updatedBy are for an admin, and null for anybody else.'
      required:
        - name
        - title
        - kind
        - published
        - publishedAt
        - description
        - source
        - draft
        - hasUnpublishedChanges
        - withheldFrom
        - functions
        - updatedBy
        - updatedAt
      properties:
        name:
          type: string
          minLength: 1
          description: The tool name a Bot draws it by, and its address. custom_ and a name for one written in Playground.
        title:
          type: string
          description: What people call it.
        kind:
          type: string
          minLength: 1
          description: 'How the Components page groups it: chart, card and so on, or playground for one written in Playground.'
        published:
          type: boolean
          description: Whether Bots may draw it. Changed only by publishComponent and unpublishComponent.
        publishedAt:
    DevicePlatform:
      type: string
      enum:
        - ios
        - android
      description: The phone's operating system.
    Device:
      type: object
      description: A phone that gets push notifications for the person, from every one of their Bots. Never its push token.
      required:
        - id
        - platform
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: The id the OpenBot app made for the phone.
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        createdAt:
          type: string
          format: date-time
          description: When OpenBot first registered the phone.
    DevicePage:
      type: object
      required:
        - devices
        - nextCursor
      properties:
        devices:
          type: array
          description: The first registered first, then by id.
          items:
            $ref: '#/components/schemas/Device'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - projectId
        - platform
      properties:
        token:
          type: string
          maxLength: 256
          pattern: ^(Expo|Exponent)PushToken\[[A-Za-z0-9_-]+\]$
          description: 'The phone''s Expo push token, as the OpenBot app read it when it started. It is a credential: OpenBot never sends it back.'
        projectId:
          type: string
          format: uuid
          description: The OpenBot app's project, which must be the one this deployment sends push notifications through.
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    DeviceResponse:
      type: object
      required:
        - device
      properties:
        device:
          $ref: '#/components/schemas/Device'
    DestinationTransport:
      type: string
      enum:
        - slack
        - teams
        - sms
      description: Slack, Microsoft Teams, or text messages.
    Destination:
      type: object
      description: 'Somewhere outside OpenBot a person continues one conversation with one Bot: a Slack or Microsoft Teams chat, or a phone number.'
      required:
        - id
        - transport
        - conversationId
        - botId
        - address
        - optedOutAt
        - createdAt
      properties:
        id:
          type: string
          description: The destination's id.
        transport:
          $ref: '#/components/schemas/DestinationTransport'
        conversationId:
          type: string
          description: The conversation it continues.
        botId:
          type: string
          description: The Bot that answers there.
        address:
          type: string
          description: 'Where the Bot sends: the phone number for text messages, or the chat''s own id in Slack or Teams.'
        optedOutAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was last published. Null if it never was.
        description:
          type:
            - string
            - 'null'
          description: 'The published description: what the model reads when it decides whether to draw it. Null until it is first published.'
        source:
          description: For a published Playground component, the source a conversation draws it from. Null for one that comes with OpenBot, and for one that isn't published.
          oneOf:
            - $ref: '#/components/schemas/PlaygroundSource'
            - type: 'null'
        draft:
          description: The working copy publishing would make live. For an admin.
          oneOf:
            - $ref: '#/components/schemas/ComponentDraft'
            - type: 'null'
        hasUnpublishedChanges:
          type:
            - boolean
            - 'null'
          description: Whether the draft differs from what is published. For an admin.
        withheldFrom:
          type:
            - array
            - 'null'
          description: The Bots held back from it, by id. Every other Bot may draw it while it is published, including Bots added later. For an admin.
          items:
            type: string
        functions:
          type:
            - array
            - 'null'
          description: The data functions it may read, by name. Empty when it shows only what the Bot passes it. For an admin.
          items:
            type: string
        updatedBy:
          type:
            - string
            - 'null'
          description: 'Who last changed it: an admin''s email address, or the build for one nobody here has changed. For an admin.'
        updatedAt:
          type: string
          format: date-time
    ComponentPage:
      type: object
      required:
        - components
        - nextCursor
      properties:
        components:
          type: array
          description: By kind, then title, then name.
          items:
            $ref: '#/components/schemas/Component'
          description: 'Text messages only: when the person texted STOP. Nothing is texted until they text START. Null while they can be texted.'
        createdAt:
          type: string
          format: date-time
          description: When it was connected.
    DestinationPage:
      type: object
      required:
        - destinations
        - nextCursor
      properties:
        destinations:
          type: array
          description: The first connected first, then by id.
          items:
            $ref: '#/components/schemas/Destination'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    AnnouncedComponent:
      type: object
      additionalProperties: false
      required:
        - name
        - title
        - kind
        - description
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: The tool name a Bot draws it by. Trimmed.
        title:
          type: string
          minLength: 1
          pattern: \S
          description: Trimmed.
        kind:
          type: string
          minLength: 1
          pattern: \S
          description: How the Components page groups it. Trimmed.
        description:
          type: string
          minLength: 1
          pattern: \S
          description: What the model reads, used only when the component is new. Trimmed.
    ComponentAnnouncement:
      type: object
      additionalProperties: false
      required:
        - components
      properties:
        components:
          type: array
          description: Every component this version of the app can draw. Empty is allowed and adds nothing.
          items:
            $ref: '#/components/schemas/AnnouncedComponent'
    AnnouncedComponents:
      type: object
      required:
        - added
      properties:
        added:
          type: array
          description: The names of the components this announcement added.
          items:
            type: string
    ComponentDraftInput:
      type: object
      additionalProperties: false
      description: A draft to save. For a component that comes with OpenBot, send its description; a title or source that differs from what it has is refused. For a Playground component, send all three.
      required:
        - description
      properties:
        description:
          type: string
          description: Trimmed. Required for a component that comes with OpenBot. A Playground draft may leave it empty until it is published.
        title:
          type: string
          minLength: 1
          pattern: \S
          description: Trimmed. Required for a Playground component.
        source:
          oneOf:
            - $ref: '#/components/schemas/PlaygroundDraftSource'
            - type: 'null'
    DataFunction:
      type: object
      description: Data a component may read for itself, so the figures it shows come from OpenBot and not from the model.
      required:
        - name
        - description
        - reads
        - granted
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          description: What it returns, for an admin deciding whether to allow it.
        reads:
          type: string
          description: What it reads, in a few words.
        granted:
          type: boolean
          description: Whether this component may read it.
    DataFunctionPage:
      type: object
      required:
        - functions
        - nextCursor
      properties:
        functions:
          type: array
          description: By name.
          items:
            $ref: '#/components/schemas/DataFunction'
    DestinationConversationId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: \S
      description: One of the person's conversations, by its id.
    DestinationBotId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: \S
      description: A Bot in that conversation, by its id.
    LinkChatDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - platform
        - conversationId
        - botId
      properties:
        platform:
          type: string
          enum:
            - slack
            - teams
          description: Slack or Microsoft Teams.
        conversationId:
          $ref: '#/components/schemas/DestinationConversationId'
        botId:
          $ref: '#/components/schemas/DestinationBotId'
    ChatLinkCode:
      type: object
      description: A one-time code the person sends the OpenBot app in Slack or Teams.
      required:
        - platform
        - code
        - command
        - expiresAt
      properties:
        platform:
          type: string
          enum:
            - slack
            - teams
        code:
          type: string
          description: The code. It works once, and only for the person it was made for.
        command:
          type: string
          description: The message to send the OpenBot app, the code in it.
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working.
    VerifyPhoneDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - conversationId
        - botId
      properties:
        phone:
          type: string
          pattern: ^\+[1-9]\d{7,14}$
          description: The phone number in international form, such as +14155550123.
        conversationId:
          $ref: '#/components/schemas/DestinationConversationId'
        botId:
          $ref: '#/components/schemas/DestinationBotId'
    PhoneVerification:
      type: object
      description: A code on its way to a phone, to confirm under this verification.
      required:
        - verificationId
        - expiresAt
      properties:
        verificationId:
          type: string
          format: uuid
          description: Send this with the code to confirmPhoneDestination.
        expiresAt:
          type: string
          format: date-time
          description: When the verification stops working.
    ConfirmPhoneDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - verificationId
        - code
      properties:
        verificationId:
          type: string
          format: uuid
          description: The verification verifyPhoneDestination answered.
        code:
          type: string
          pattern: ^\d{4,10}$
          description: The code the phone was texted.
    DestinationResponse:
      type: object
      required:
        - destination
      properties:
        destination:
          $ref: '#/components/schemas/Destination'
    NotificationTransport:
      type: string
      enum:
        - push
        - slack
        - teams
        - sms
      description: 'A way OpenBot reaches a person outside it: push notifications to their phones, Slack, Microsoft Teams, or text messages.'
    DeliveryKind:
      type: string
      enum:
        - reply
        - question
        - approval
        - attention
      description: 'What was sent: a Bot''s reply, a question it asked, an approval it needs, or what the person''s Bots'' check-ins found that needs them.'
    DeliveryState:
      type: string
      enum:
        - queued
        - running
        - accepted
        - sent
        - delivered
        - failed
        - unknown
        - opted_out
      description: Where it got to. accepted is the provider taking it without saying yet that it arrived. unknown is a send that may or may not have gone. opted_out is a text message not sent because the person texted STOP.
    Delivery:
      type: object
      description: One update a Bot sent a person outside OpenBot.
      required:
        - id
        - transport
        - kind
        - state
        - error
        - conversationId
        - botId
        - createdAt
      properties:
        id:
          type: string
          description: The delivery's id.
        transport:
          $ref: '#/components/schemas/NotificationTransport'
        kind:
          $ref: '#/components/schemas/DeliveryKind'
        state:
          $ref: '#/components/schemas/DeliveryState'
        error:
          type:
            - string
            - 'null'
          description: Why it failed or may not have arrived, as the provider said. Null otherwise.
        conversationId:
          type: string
          description: The conversation it was about.
        botId:
          type: string
          description: The Bot that sent it.
        createdAt:
          type: string
          format: date-time
          description: When it was sent.
    DeliveryPage:
      type: object
      required:
        - deliveries
        - nextCursor
      properties:
        deliveries:
          type: array
          description: The newest first, then by id.
          items:
            $ref: '#/components/schemas/Delivery'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    BotComponent:
      type: object
      description: A component one Bot may draw now.
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          description: The tool name to offer the Bot.
        description:
          type: string
          minLength: 1
          description: The published description, which the model reads.
    BotComponentPage:
      type: object
      required:
        - components
        - nextCursor
      properties:
        components:
          type: array
          description: By name.
          items:
            $ref: '#/components/schemas/BotComponent'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    ComponentCheckRequest:
      type: object
      additionalProperties: false
      properties:
        functions:
          type: array
          description: The data functions the component will read when it is drawn with these arguments, so the answer covers them too. None when left out.
          items:
            type: string
            minLength: 1
            pattern: \S
    ComponentCheck:
      type: object
      required:
        - allowed
        - reason
      properties:
        allowed:
          type: boolean
        reason:
          type:
            - string
            - 'null'
          description: Why not, for the model and for the person, when allowed is false. Null when it is true.
    ComponentCallRequest:
      type: object
      additionalProperties: false
      required:
        - function
      properties:
        function:
          type: string
          minLength: 1
          description: The data function to run, such as botActivity.
        arguments:
          type: object
          description: The function's arguments. None when left out.
          additionalProperties: true
    ComponentCall:
      type: object
      required:
        - allowed
        - data
        - reason
      properties:
        allowed:
          type: boolean
        data:
          description: What the function read, when allowed is true; null otherwise. botActivity answers days and rows of bot and actions; recentRefusals answers rows of at, bot, what and reason.
        reason:
          type:
            - string
            - 'null'
          description: Why it didn't run, when allowed is false. Null when it ran.
    Skill:
      type: object
      description: A named instruction a person runs with / in a conversation, on a Bot that offers it.
      required:
        - slug
        - title
        - summary
        - instructions
        - tools
        - ownerId
        - botIds
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 40
          description: What a person types after /, and the skill's address.
        title:
          type: string
        summary:
          type: string
          description: One line, shown in the / menu. May be empty.
        instructions:
          type: string
          description: What the Bot is told when the skill runs.
        tools:
          type: array
          description: 'The actions it needs, as appId/toolName. Naming one gives no Bot access to it: a Bot uses only what it can already use.'
          items:
            type: string
        ownerId:
          type:
            - string
            - 'null'
          description: Whose it is, by person id. Null when it is the organization's.
        botIds:
          type: array
          description: The Bots that offer it, by id.
          items:
            type: string
    SkillPage:
      type: object
      required:
        - skills
        - nextCursor
      properties:
        skills:
          type: array
          description: By title, then slug.
          items:
            $ref: '#/components/schemas/Skill'
    UpdateRoute:
      description: 'Where one kind of update may go. all: every way the person can be reached, now and any set up later. A list: only those ways; an empty list keeps that kind in OpenBot.'
      oneOf:
        - type: string
          enum:
            - all
        - type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationTransport'
    UpdateRouting:
      type: object
      description: Where each kind of update may go.
      required:
        - progress
        - decision
        - question
        - attention
      properties:
        progress:
          $ref: '#/components/schemas/UpdateRoute'
        decision:
          $ref: '#/components/schemas/UpdateRoute'
        question:
          $ref: '#/components/schemas/UpdateRoute'
        attention:
          $ref: '#/components/schemas/UpdateRoute'
    NotificationSettings:
      type: object
      description: 'Where a person''s updates go, for every one of their Bots at once. progress: replies and results from work they weren''t watching. decision: approvals a Bot needs before it acts. question: what a Bot asked and waits on. attention: what their Bots'' check-ins found, at most once an hour, every Bot in one message.'
      required:
        - routing
      properties:
        routing:
          $ref: '#/components/schemas/UpdateRouting'
    UpdateNotificationSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - routing
      properties:
        routing:
          type: object
          description: The kinds of update to change. At least one.
          additionalProperties: false
          minProperties: 1
          properties:
            progress:
              $ref: '#/components/schemas/UpdateRoute'
            decision:
              $ref: '#/components/schemas/UpdateRoute'
            question:
              $ref: '#/components/schemas/UpdateRoute'
            attention:
              $ref: '#/components/schemas/UpdateRoute'
    BotNotifyLevel:
      type: string
      enum:
        - all
        - needs_input
        - none
      description: 'How much one Bot may reach the person outside OpenBot: all of it, only what needs them (its questions and approvals), or nothing.'
    BotNotificationSettings:
      type: object
      required:
        - botId
        - notify
      properties:
        botId:
          type: string
          description: The Bot.
        notify:
          $ref: '#/components/schemas/BotNotifyLevel'
    UpdateBotNotificationSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - notify
      properties:
        notify:
          $ref: '#/components/schemas/BotNotifyLevel'
    NotificationTransportOption:
      type: object
      required:
        - id
        - title
      properties:
        id:
          $ref: '#/components/schemas/NotificationTransport'
        title:
          type: string
          description: Its name, as a person reads it.
    NotificationTransportPage:
      type: object
      required:
        - notificationTransports
        - nextCursor
      properties:
        notificationTransports:
          type: array
          description: Push, then Slack, Microsoft Teams and text messages, as set up.
          items:
            $ref: '#/components/schemas/NotificationTransportOption'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    SkillInput:
      type: object
      additionalProperties: false
      required:
        - title
        - instructions
        - tools
      properties:
        title:
          type: string
          minLength: 1
          pattern: \S
          description: Trimmed.
        summary:
          type: string
          default: ''
          description: One line, shown in the / menu.
        instructions:
          type: string
          minLength: 1
          pattern: \S
          description: Trimmed.
        tools:
          type: array
          description: Every action the skill needs, as appId/toolName, each one OpenBot has seen. Replaces what it named before; empty names none.
          items:
            type: string
            minLength: 1
            pattern: \S
        forEveryone:
          type: boolean
          default: false
          description: 'Make a new skill the organization''s. Only an admin may. It applies when the skill is made: rewriting one keeps whose it is.'
  responses:
    InvalidRequest:
      description: A parameter is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: A Bot id is required.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidBot:
      description: A field is missing or out of bounds, the address is one this deployment may not reach, or the deployment cannot give a Bot a computer of its own.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            name:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Name must be text between 1 and 80 characters.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            noIsolation:
              value:
                type: https://open.bot/errors/isolation-unavailable
                title: This OpenBot can't give a Bot a computer of its own.
                status: 400
                detail: This OpenBot can't give a Bot a computer of its own, so it runs on yours.
                code: ISOLATION_UNAVAILABLE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    Unauthenticated:
      description: The caller is not signed in.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/auth-unauthenticated
                title: Authentication is required.
                status: 401
                detail: Authentication required.
                code: AUTH_UNAUTHENTICATED
                category: auth
                retryable: false
                requestId: req_example
                traceId: trace_example
    Forbidden:
      description: The caller holds no role in this organization.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noRole:
              value:
                type: https://open.bot/errors/permission-denied
                title: Authorization required.
                status: 403
                detail: Authorization required.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    BotForbidden:
      description: The caller may not manage this Bot, the Bot comes with OpenBot, or the caller may not give it a computer of its own.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: You can't manage this Bot.
                status: 403
                detail: You can't manage this Bot.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            isolation:
              value:
                type: https://open.bot/errors/capability-required
                title: Your admin hasn't turned on Isolated Bots for you.
                status: 403
                detail: Your admin hasn't turned on Isolated Bots for you.
                code: CAPABILITY_REQUIRED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
                capability: isolatedComputers
    AdminOnly:
      description: The caller is not an administrator of the organization, or holds no role in it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAdmin:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only an admin can do this.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidAuditQuestion:
      description: The question is blank or longer than 500 characters once trimmed, holds a character OpenBot can't keep, or a parameter is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            blank:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Ask a question first.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            long:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Keep the question under 500 characters. Ask one thing at a time.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    AuditQuestionNotUnderstood:
      description: The model's filters still failed their check on its second try, so none are given.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notUnderstood:
              value:
                type: https://open.bot/errors/question-not-understood
                title: Couldn't turn that question into filters.
                status: 422
                detail: Couldn't turn that question into filters. Ask it another way, or set the filters yourself.
                code: QUESTION_NOT_UNDERSTOOD
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    ModelFailed:
      description: The model didn't answer, or didn't answer usefully. Asking again may work.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unreachable:
              value:
                type: https://open.bot/errors/model-failed
                title: The model didn't answer.
                status: 502
                detail: Couldn't reach the model. Try again.
                code: MODEL_FAILED
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    ModelNotConfigured:
      description: The deployment has no model to read a question with.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noModel:
              value:
                type: https://open.bot/errors/model-not-configured
                title: OpenBot has no model to answer with.
                status: 503
                detail: OpenBot needs a model key to answer a question. Add one in the Vault, or set the filters yourself.
                code: MODEL_NOT_CONFIGURED
                category: dependency
                retryable: false
                requestId: req_example
                traceId: trace_example
    OrganizationNotFound:
      description: The organization does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/organization-not-found
                title: Organization not found.
                status: 404
                detail: Couldn't find that organization.
                code: ORGANIZATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    BotNotFound:
      description: The Bot does not exist, was deleted, or is not visible to the caller, or the organization is not.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/bot-not-found
                title: Bot not found.
                status: 404
                detail: Couldn't find that Bot.
                code: BOT_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    IdempotencyConflict:
      description: The Idempotency-Key was already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidPerson:
      description: The change is empty, names something a person doesn't have, or the name is blank or longer than 100 characters once trimmed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            name:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Enter a name between 1 and 100 characters.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    PersonForbidden:
      description: The caller asked about or changed somebody else without being an administrator, changed somebody else's name, or changed a role without being an administrator.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAdmin:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only an admin can see someone else's account.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            name:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can change their name.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    OwnOnly:
      description: 'The caller asked about somebody else''s own things, which only that person may read or change: an administrator can''t either.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can see their standing instructions.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignedInOwnOnly:
      description: The caller asked about somebody else's API keys or sessions, or signed the request with an API key or an app's sign-in rather than signing in to OpenBot.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can see their API keys.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            key:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: An API key or an app can't manage API keys or sessions. Sign in to OpenBot to do this.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignedInAdminOnly:
      description: The caller is not an administrator, or signed the request with an API key or an app's sign-in rather than signing in to OpenBot.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAdmin:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only an admin can do this.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    PersonNotFound:
      description: 'Nobody with that id has signed in here, or the organization does not exist. Only an administrator is told so: anybody else is refused first.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/person-not-found
                title: Person not found.
                status: 404
                detail: That person is not here.
                code: PERSON_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    PersonConflict:
      description: 'The change would leave the organization without a way back in: an administrator removing their own role or access, or a change to somebody the deployment''s configuration names as an administrator. Or the Idempotency-Key was used for a different request.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ownRole:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: You can't remove your own admin role.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    ApiKeyNotFound:
      description: The person has no such API key, it was deleted, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/api-key-not-found
                title: API key not found.
                status: 404
                detail: Couldn't find that API key.
                code: API_KEY_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    SessionNotFound:
      description: The person has no such session, it ended, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/session-not-found
                title: Session not found.
                status: 404
                detail: Couldn't find that session. It may have ended already.
                code: SESSION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    LinkedAccountNotFound:
      description: 'The person has no such linked account: it was unlinked already, or never was. Or the organization does not exist.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/linked-account-not-found
                title: Linked account not found.
                status: 404
                detail: Linked account not found.
                code: LINKED_ACCOUNT_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    LinkProviderUnavailable:
      description: This deployment can't link an account at that service, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://open.bot/errors/link-provider-unavailable
                title: That account type can't be linked here.
                status: 404
                detail: That account type cannot be linked here.
                code: LINK_PROVIDER_UNAVAILABLE
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    LinkedAccountsUnavailable:
      description: This deployment keeps no linked accounts at all. The apps read this as nothing to show, unlike any other 503.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://open.bot/errors/linked-accounts-unavailable
                title: Linked accounts aren't available here.
                status: 503
                detail: Linked accounts are not available.
                code: LINKED_ACCOUNTS_UNAVAILABLE
                category: dependency
                retryable: false
                requestId: req_example
                traceId: trace_example
    IdentityProviderNotFound:
      description: No identity provider has that id, it was removed, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/identity-provider-not-found
                title: Identity provider not found.
                status: 404
                detail: There is no such provider.
                code: IDENTITY_PROVIDER_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    IdentityProviderConflict:
      description: A provider with that id is registered already, or the Idempotency-Key was used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            taken:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: An identity provider with that name is registered already. Choose another name.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignInUnavailable:
      description: This deployment signs nobody in, as OpenBot Desktop runs for one person, so it has no API keys, no sessions and no single sign-on to set up.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            single:
              value:
                type: https://open.bot/errors/sign-in-unavailable
                title: This OpenBot signs nobody in.
                status: 503
                detail: This OpenBot signs nobody in, so it has no API keys.
                code: SIGN_IN_UNAVAILABLE
                category: dependency
                retryable: false
                requestId: req_example
                traceId: trace_example
    SettingsConflict:
      description: Single sign-on can't be required before an identity provider is registered, or the Idempotency-Key was used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noProvider:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: Register an identity provider before requiring SSO, or nobody but the break-glass administrators can sign in.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignOutUnfinished:
      description: Single sign-on is now required, but not everybody could be signed out yet. Saving it again finishes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            again:
              value:
                type: https://open.bot/errors/service-unavailable
                title: A service OpenBot depends on is unavailable.
                status: 503
                detail: SSO is now required, but not everybody could be signed out yet. Save it again to finish.
                code: SERVICE_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    CapabilityNotFound:
      description: No permission switch has that id, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/capability-not-found
                title: Permission not found.
                status: 404
                detail: There is no such permission.
                code: CAPABILITY_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidCapabilityChanges:
      description: A change is malformed, or one the rule would ignore, such as a group nobody is in. problems says which.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            empty:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Add at least one change.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    NetworkPolicyNotFound:
      description: No such network policy is set, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/network-policy-not-found
                title: Network policy not found.
                status: 404
                detail: There is no such network policy.
                code: NETWORK_POLICY_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    NoTrailToReplay:
      description: This OpenBot keeps no audit trail it can read, so there is nothing to test against.
      content:
