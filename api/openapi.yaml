          type: boolean
          const: true
        runId:
          type: string
          description: The run that was started.
    RoutineRun:
      type: object
      description: One run of a routine. What the Bot said is in the routine's conversation and is not kept here.
      required:
        - id
        - status
        - startedAt
        - finishedAt
        - error
        - source
      properties:
        id:
          type: string
          description: The run's id.
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
            - skipped
            - waiting
          description: running until it ends; waiting while it waits on the person, for an approval or an answer.
        startedAt:
          type: string
          format: date-time
          description: When it started.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it ended, or null while it runs.
        error:
          type:
            - string
            - 'null'
          description: Why it failed or was skipped, or null.
        source:
          type: string
          enum:
            - schedule
            - run_now
            - trigger
          description: 'What started it: the schedule, a person''s Run now, or an event.'
    RoutineRunPage:
      type: object
      required:
        - runs
        - nextCursor
      properties:
        runs:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/RoutineRun'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    CheckInSkipReason:
      type: string
      enum:
        - off_admin
        - off_person
        - paused
        - capped
        - unreachable
        - no_sources
        - busy
      description: 'Why a check-in was skipped before the Bot looked: an administrator or the person turned check-ins off, the Bot is paused, it used its check-ins for the day, the Bot or its conversation is no longer reachable, there is nothing connected for it to read, or another check-in was still running.'
    LastCheckIn:
      type: object
      description: 'A check-in''s newest run: how it ended and, for one that was skipped or could not finish, why, in one sentence written for the person.'
      required:
        - outcome
        - trigger
        - skipReason
        - why
        - itemsRaised
        - startedAt
        - finishedAt
      properties:
        outcome:
          type: string
          enum:
            - running
            - quiet
            - raised
            - failed
            - skipped
          description: quiet found nothing; raised opened at least one item; skipped never looked.
        trigger:
          type: string
          enum:
            - schedule
            - run_now
          description: What started it.
        skipReason:
          oneOf:
            - $ref: '#/components/schemas/CheckInSkipReason'
            - type: 'null'
        why:
          type:
            - string
            - 'null'
          description: One sentence on why it was skipped or could not finish, or null.
        itemsRaised:
          type: integer
          minimum: 0
          description: How many items it raised.
        startedAt:
          type: string
          format: date-time
          description: When it started.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it ended, or null while it runs.
    CheckIn:
      type: object
      description: One thing a Bot checks in on for a person, and how often.
      required:
        - id
        - botId
        - conversationId
        - focus
        - subject
        - sourceLink
        - enabled
        - intervalMinutes
        - nextRunAt
        - lastRunAt
        - lastStatus
        - lastError
        - lastRun
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: The check-in's id.
        botId:
          type: string
          description: The Bot that checks in.
        conversationId:
          type: string
          description: The conversation the check-in belongs to.
        focus:
          type: string
          description: What to look for, in the person's words. May be empty.
        subject:
          type: string
          description: What it watches, in the person's words. Empty for one that watches everything the Bot reads.
        sourceLink:
          type:
            - string
            - 'null'
          description: The link it watches, or null.
        enabled:
          type: boolean
          description: False while it is paused.
        intervalMinutes:
          type: integer
          minimum: 60
          maximum: 1440
          description: How often it runs, in minutes.
        nextRunAt:
          type: string
          format: date-time
          description: When it runs next, if it is on.
        lastRunAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it last ran, or null.
        lastStatus:
          type: string
          enum:
            - idle
            - running
            - succeeded
            - error
        lastError:
          type:
            - string
            - 'null'
          description: What stopped its last run, or null.
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/LastCheckIn'
            - type: 'null'
          description: Its newest check-in, or null before the first.
        createdAt:
          type: string
          format: date-time
          description: When it was turned on first.
        updatedAt:
          type: string
          format: date-time
          description: When it last changed.
    CheckInPage:
      type: object
      required:
        - checkIns
