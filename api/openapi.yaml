        - cloudNetwork
        - cloudComputer
        - localComputer
        - customRules
        - passwordManager
        - slackTeams
        - teamBots
        - ownerApps
        - isolatedComputers
        - proactive
      description: A permission switch.
    Capability:
      type: object
      description: A permission switch, and what each level set it to. Null at a level means it sets nothing and the level beneath decides.
      required:
        - id
        - title
        - description
        - default
        - organization
        - roles
        - groups
