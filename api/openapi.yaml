    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - Credentials
      operationId: listCredentials
      summary: List the credentials in the vault
      description: 'Return one page of the credentials the vault keeps, live and revoked, oldest first. A credential says what it is for and whether it is live, and never holds its secret: nothing in the API reads a secret back out. Only an administrator may list them. A missing cursor starts at the first page and nextCursor null ends the list.'
      security:
        - webSession: []
        - appOAuth:
            - credentials:read
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of credentials.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPage'
              examples:
                modelKey:
                  $ref: '#/components/examples/CredentialPageExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags:
        - Credentials
      operationId: createCredential
      summary: Add a credential to the vault
      description: 'Encrypt a secret and keep it in the vault under one key: a kind, a provider and a key id. A key holds one live credential, so adding one for a key that already has one replaces it, and the one it replaces is revoked in the same write. A model key sent without a key id is filed under the name OpenBot''s own Bots read (getModelKey). The secret is write-only: no answer includes it, now or later. Recorded on the audit trail. Only an administrator may add one.'
      security:
        - webSession: []
        - appOAuth:
            - credentials:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInput'
            examples:
              modelKey:
                value:
                  kind: model
                  provider: openai
                  secret: sk-example
      responses:
        '201':
          description: The credential, as kept. Never its secret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                modelKey:
                  $ref: '#/components/examples/CredentialExample'
        '400':
          $ref: '#/components/responses/InvalidCredential'
