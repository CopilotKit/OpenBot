    get:
      tags: [Organization settings]
      operationId: getOrganizationSettings
      summary: Read the organization's settings
      description: >-
        Return the settings an administrator sets for everybody: single
        sign-on, recording computer actions, stopping idle computers, the
        model and app allowlists, sharing learned skills, check-ins a day and
        choosing a model. Beside them, read only, what an administrator needs
        to set them: the model OpenBot runs on, the directory groups, the apps
