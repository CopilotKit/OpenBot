  /api/v2/organizations/{organizationId}/identity-providers:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Identity providers]
      operationId: listIdentityProviders
      summary: List identity providers
      description: >-
        Return one page of the identity providers registered for single sign-on,
        by email domain: a company's own SAML or OIDC provider, which signs in
        everybody at its domain. Every administrator sees every provider,
        whoever registered it. Never a client secret or a signing
        certificate. Only an administrator may list them. A missing cursor
        starts at the first page and nextCursor null ends the list.
      security:
        - webSession: []
        - appOAuth: [identity-providers:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of identity providers.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/IdentityProviderPageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Identity providers]
      operationId: createIdentityProvider
      summary: Register an identity provider
      description: >-
        Register a company's identity provider, so everybody it vouches for at
        its email domain can sign in. SAML takes the metadata the company's
        identity team supplies; OIDC takes the issuer, which describes itself,
        and a client. Only an administrator may register one, signed in to
        OpenBot rather than with a key or an app's sign-in. The audit trail
        records who registered it.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentityProviderRequest'
            examples:
              saml:
                value:
                  protocol: saml
                  id: acme-okta
                  domain: acme.com
                  issuer: http://www.okta.com/exk1a2b3c4d5e6f7g8h9
                  entryPoint: https://acme.okta.com/app/acme_openbot/exk1a2b3c4d5e6f7g8h9/sso/saml
                  metadata: <EntityDescriptor xmlns="urn:oasis:names:tc:SAML:2.0:metadata" entityID="http://www.okta.com/exk1a2b3c4d5e6f7g8h9"/>
      responses:
        '201':
          description: The provider, registered.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              description: The new provider's address.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderResponse'
              examples:
                saml:
                  $ref: '#/components/examples/IdentityProviderExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SignedInAdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdentityProviderConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/SignInUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/identity-providers/{identityProviderId}:
    parameters:
