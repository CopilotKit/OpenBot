            - admin
            - member
          description: Who the checklist was written for.
        rows:
          type: array
          items:
            type: object
            required:
              - id
              - scope
              - title
              - required
              - status
              - ready
              - detail
              - fix
            properties:
              id:
                type: string
                enum:
                  - intelligence
                  - model
                  - computer
                  - apps
                  - chat
              scope:
                type: string
                const: deployment
              title:
                type: string
              required:
                type: boolean
              status:
                type: string
                enum:
                  - ready
                  - needs_setup
                  - not_checked
              ready:
