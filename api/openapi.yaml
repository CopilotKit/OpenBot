  /api/v2/organizations/{organizationId}/setup-checklist:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organization settings]
      operationId: getSetupChecklist
      summary: Read the setup checklist
      description: >-
        Return what this OpenBot has set up and what it still needs, each row
        with its fix. An administrator, or somebody running OpenBot on their
        own, reads it as the one who sets it up; anybody else reads which
        parts work, and that an administrator sets the rest up.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [setup-checklist:read]
        - apiKey: []
      responses:
        '200':
          description: The setup checklist.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupChecklist'
              examples:
                answer:
                  $ref: '#/components/examples/SetupChecklistExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/setup-checklist/check:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Organization settings]
      operationId: checkSetup
      summary: Check the setup again
      description: >-
        Ask Intelligence, the model provider and the computers again, then
        return the checklist as getSetupChecklist does.
      security:
        - webSession: []
        - appOAuth: [setup-checklist:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The setup checklist, checked again.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupChecklist'
              examples:
                answer:
                  $ref: '#/components/examples/SetupChecklistExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        The web app's server-side session, so no token ever reaches the
        browser. Served over HTTPS the cookie is
        __Secure-better-auth.session_token. A single-user install signs its
        one person in without a cookie.
    appOAuth:
      type: oauth2
      description: >-
        Desktop, mobile and the CLI. OAuth 2.1 authorization code with PKCE
        (RFC 7636, S256 only); the access token is sent as a bearer token. The
        server does not accept it yet.
      flows:
        authorizationCode:
          authorizationUrl: /api/auth/oauth2/authorize
          tokenUrl: /api/auth/oauth2/token
          refreshUrl: /api/auth/oauth2/token
          scopes:
            bots:read: Read the Bots the signed-in person can see.
            bots:write: Create, change and delete the signed-in person's Bots.
            reactions:read: Read the reactions Bots left on the signed-in person's messages.
            audit-events:read: Read the organization's audit trail, when the signed-in person is an administrator.
            people:read: Read the signed-in person, their standing instructions and preferences, and for an administrator everybody in the organization.
            people:write: Change the signed-in person's name, onboarding, standing instructions and preferences, and for an administrator anybody's role and access.
            linked-accounts:read: Read the signed-in person's linked accounts, and which services can be linked.
            linked-accounts:write: Link and unlink the signed-in person's accounts at other services.
            identity-providers:read: Read the organization's identity providers, when the signed-in person is an administrator.
            identity-providers:write: Remove the organization's identity providers, when the signed-in person is an administrator.
            settings:read: Read the organization's settings, when the signed-in person is an administrator.
            settings:write: Change the organization's settings and stop idle computers, when the signed-in person is an administrator.
            capabilities:read: Read the permission switches, and describe and preview changes to them, when the signed-in person is an administrator.
            capabilities:write: Change the permission switches, when the signed-in person is an administrator.
            network-policies:read: Read where Bot computers may connect, and describe and test a policy, when the signed-in person is an administrator.
            network-policies:write: Set and remove where Bot computers may connect, when the signed-in person is an administrator.
            model-usage:read: Read which models Bots ran on, when the signed-in person is an administrator.
            computer-actions:read: Read the actions recorded on Bot computers, when the signed-in person is an administrator.
            setup-checklist:read: Read the setup checklist, and check it again.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: OpenBot API key
      description: >-
        Automation. An API key acts as the person who created it, inside one
        organization. The server does not accept it yet.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: >-
        The organization. Until multi-organization lands every install has one,
        addressed as `default`.
      schema:
        type: string
        minLength: 1
      example: default
    PersonId:
      name: personId
      in: path
      required: true
      description: >-
        The person: me for the caller, or a person's id. A person's own
        things (their instructions, preferences, API keys, sessions and
        linked accounts) answer only the person themselves, by either.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
      example: me
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      description: The API key's id. Never the key itself.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    SessionId:
      name: sessionId
      in: path
      required: true
      description: The session's id. Never its token.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    LinkedAccountId:
      name: linkedAccountId
      in: path
      required: true
      description: The linked account's id.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    IdentityProviderId:
      name: identityProviderId
      in: path
      required: true
      description: The identity provider's id, as it was registered.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: \S
    CapabilityIdParameter:
      name: capabilityId
      in: path
      required: true
      description: The permission switch.
      schema:
        $ref: '#/components/schemas/CapabilityId'
    NetworkPolicyId:
      name: networkPolicyId
      in: path
      required: true
      description: organization, or group:<name> for a directory group's.
      schema:
        type: string
        minLength: 1
        maxLength: 206
        pattern: ^(organization|group:[^\x00]*\S[^\x00]*)$
    BotId:
      name: botId
      in: path
      required: true
      description: The Bot's id.
      schema:
        type: string
        minLength: 1
        pattern: \S
      example: agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
    Limit:
      name: limit
      in: query
      description: Most items in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque continuation from the previous page's nextCursor, bound to the
        organization and the filters that made it. The server only ever issues
        cursors written in URL-safe base64 (letters, digits, - and _, no
        padding) and refuses anything else, so the pattern says so. A cursor
        that fits the pattern can still be refused: one this list never gave
        out, or one made for another organization or other filters.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: ^[A-Za-z0-9_-]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Generated by the caller for each write it means to make once. Reuse the
        same key and the same request for 24 hours after an uncertain response;
        the same key with a different request is a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuditEventTypes:
      name: eventType
      in: query
      description: >-
        Events of any of these types, separated by commas, such as
        computer.action_refused,mcp.call_rejected.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditExcludedEventTypes:
      name: excludeEventType
      in: query
      description: Leave out events of these types, separated by commas.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditExcludedCalls:
      name: excludeCalls
      in: query
      description: >-
        Leave out the app calls of these tools that succeeded, separated by
        commas: calls whose change has an event of its own. A call that failed
        is kept.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditActor:
      name: actorUserId
      in: query
      description: Events that ran on this person's authority, by their user id.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditInitiatorKinds:
      name: initiatorKind
      in: query
      description: >-
        Events started in any of these ways, separated by commas: person,
        deployment, routine, responsibility, memory or handoff.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditTargetTypes:
      name: targetType
      in: query
      description: >-
        Events about any of these kinds of thing, separated by commas, such as
        agent or computer.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditTargetId:
      name: targetId
      in: query
      description: Events about this one thing, by its id.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditBots:
      name: bot
      in: query
      description: >-
        The events of any of these Bots, by id, separated by commas: what each
        Bot did and what was done to it.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditApps:
      name: app
      in: query
      description: >-
        App calls to any of these apps, separated by commas, by the app's key
        (gmail), whichever way the app was connected.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditTools:
      name: tool
      in: query
      description: >-
        App calls of any of these tools, separated by commas, by the name the
        trail records, in any case.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditEffect:
      name: effect
      in: query
      description: App calls that only read (read), or that change something (write).
      schema:
        $ref: '#/components/schemas/AuditEffect'
    AuditIntents:
      name: intent
      in: query
      description: >-
        Actions that did any of these, separated by commas, in the boundary's
        own words (AuditIntent). A word outside those matches nothing.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditRule:
      name: rule
      in: query
      description: >-
        Refusals by this one boundary rule, its text exactly as recorded. One
        rule, not a list, because a rule can hold commas.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditFrom:
      name: from
      in: query
      description: Events after this moment.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Events before this moment.
      schema:
        type: string
        format: date-time
  headers:
    PrivateNoStore:
      description: A Bot is private to the caller.
      schema:
        type: string
        const: private, no-store
  schemas:
    BotVisibility:
      type: string
      enum: [public, private]
      description: Public Bots are shared with everybody in the organization.
    Bot:
      type: object
      description: >-
        A Bot as the caller sees it. canManage, mine, systemOwned and the
        isolation fields are the server's verdicts for this caller; a client
        renders them and never recomputes them. No secret is ever part of a
        Bot: hasAuth and hasCallbackToken say whether one is set.
      required:
        - id
        - name
        - title
        - roleDescription
        - avatarSeed
        - visibility
        - hidden
        - pinned
        - systemOwned
        - endpoint
        - hasAuth
        - hasCallbackToken
        - isolated
        - canManage
        - mine
        - assignedToMe
        - builtIn
        - runsOnOpenBotModel
        - keyFromOpenBot
        - isolationActive
        - isolationOffReason
      properties:
        id:
          type: string
          description: The Bot's id.
        name:
          type: string
          description: What the Bot is called.
        title:
          type: string
          description: The subtitle under its name. May be empty.
        roleDescription:
          type: string
          description: What it does, in its owner's words.
        avatarSeed:
          type: string
          description: The seed its avatar is drawn from.
        visibility:
          $ref: '#/components/schemas/BotVisibility'
        hidden:
          type: boolean
          description: Whether the caller hid it from their own list.
        pinned:
          type: boolean
          description: Whether the caller pinned it to the top of their own list.
        systemOwned:
          type: boolean
          description: Whether it comes with OpenBot rather than belonging to a person.
        endpoint:
          type: [string, 'null']
          description: >-
            The AG-UI address it runs at, as it was stored. Null for a Bot that
            runs inside OpenBot. Every address saved through this API is an
            absolute http or https address (see the request's endpoint), but
            one saved by an older release is returned as it is, so this field
            states no format.
        hasAuth:
          type: boolean
          description: Whether a key is set for its address. Never the key.
        hasCallbackToken:
          type: boolean
          description: >-
            Whether it holds a credential for calling OpenBot's tools back.
            Never the credential.
        isolated:
          type: boolean
          description: >-
            Whether its owner asked for it to have a computer of its own.
            isolationActive says whether it has one now.
        instructions:
          type: string
          description: >-
            What the starter Bot is told, kept apart from its role description.
            Only the starter Bot has instructions.
        framework:
          type: string
          description: >-
            What runs it, by the name a person reads ("LangChain", "OpenBot").
            Absent when OpenBot doesn't know.
        canManage:
          type: boolean
          description: Whether the caller may change and delete it.
        mine:
          type: boolean
          description: >-
            Whether the caller created it. Separate from canManage, which is
            also true for an administrator on everybody's Bots.
        assignedToMe:
          type: boolean
          description: Whether an administrator assigned this Bot to the caller.
        builtIn:
          type: boolean
          description: >-
            Whether it runs at the deployment's own managed address, so it
            needs no callback credential of its own.
        runsOnOpenBotModel:
          type: boolean
          description: >-
            Whether it runs on OpenBot's model, so a person can pick the model
            per conversation.
        keyFromOpenBot:
          type: boolean
          description: >-
            Whether OpenBot gives it a key for its tools on every run, because
            OpenBot runs it.
        isolationActive:
          type: boolean
          description: Whether its next run gets a computer of its own.
        isolationOffReason:
          type: [string, 'null']
          enum: [admin, deployment, null]
          description: >-
            Why an isolated Bot runs on a shared computer instead. admin: its
            owner no longer holds Isolated Bots. deployment: this deployment
            cannot make another computer. Null otherwise.
    BotPage:
      type: object
      required: [bots, nextCursor]
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    Reaction:
      type: object
      required: [messageId, agentId, emoji, createdAt]
      properties:
        messageId:
          type: string
          description: The person's message the reaction is on, by the id its conversation gives it.
        agentId:
          type: string
          description: The Bot that reacted.
        emoji:
          type: string
          description: The reaction itself.
          example: 👍
        createdAt:
          type: string
          format: date-time
    ReactionPage:
      type: object
      required: [reactions, nextCursor]
      properties:
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    BotResponse:
      type: object
      required: [bot]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
    SharedApp:
      type: object
      required: [serverId, title]
      properties:
        serverId:
          type: string
          description: The app's id.
        title:
          type: string
          description: The app's name.
    SharedAppsAfterChange:
      type: object
      description: >-
        What making a Bot public means for the shared app accounts it uses. An
        administrator's change approves them; anybody else's lists the ones an
        administrator still has to approve.
      required: [approved, needsApproval]
      properties:
        approved:
          type: array
          items:
            $ref: '#/components/schemas/SharedApp'
        needsApproval:
          type: array
          items:
            $ref: '#/components/schemas/SharedApp'
    UpdateBotResponse:
      type: object
      required: [bot]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
        sharedApps:
          $ref: '#/components/schemas/SharedAppsAfterChange'
    BotKey:
      type: object
      description: >-
        A key the Bot's address sits behind. Write-only: stored encrypted and
        never returned. A blank value sets no key.
      required: [value]
      properties:
        header:
          type: string
          pattern: ^[A-Za-z0-9-]*$
          description: The header it is sent in. Blank or absent means Authorization.
        value:
          type: string
          writeOnly: true
          description: The header's value.
    BotFields:
      type: object
      required: [name, title, roleDescription, visibility]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: What the Bot is called, 1 to 80 characters once trimmed.
        title:
          type: string
          maxLength: 120
          description: The subtitle under its name, up to 120 characters. May be empty.
        roleDescription:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            What it does, 1 to 1000 characters once trimmed. A Bot with no
            endpoint runs on these words.
        visibility:
          $ref: '#/components/schemas/BotVisibility'
        endpoint:
          type: string
          description: >-
            The AG-UI address it runs at: empty, or an absolute http or https
            address, the only kinds the server has ever taken. Empty or absent
            on create means it runs inside OpenBot; empty or absent on a
            change leaves it as it is. An address that fits can still be
            refused: the server refuses one this deployment may not reach,
            such as a private network address on a deployment that keeps Bots
            off it.
          anyOf:
            - type: string
              maxLength: 0
            - type: string
              format: uri
              pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
        auth:
          $ref: '#/components/schemas/BotKey'
        isolated:
          type: boolean
          description: >-
            Whether it gets a computer of its own. Absent leaves it as it is.
            True needs the owner's Isolated Bots switch.
        instructions:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            New instructions for the starter Bot, 1 to 1000 characters once
            trimmed. Absent leaves them as they are; every other Bot ignores
            them.
    CreateBotRequest:
      description: A new Bot.
      allOf:
        - $ref: '#/components/schemas/BotFields'
        - type: object
          properties:
            harness:
              type: string
              description: >-
                The framework an agent somebody runs themselves is built on,
                by its id in OpenBot's harness list (shared/harnesses.json),
                which the server checks every create against. Empty means none
                was named, as for an agent somebody already runs. "byo-url" is
                not one: it names no framework. Kept only with an endpoint.
              enum:
                - ''
                - crewai
                - llamaindex
                - agno
                - langgraph
                - google-adk
                - antigravity
                - pydantic-ai
                - microsoft-agent-framework
                - claude-agent-sdk
                - strands
                - ag2
                - langroid
                - mastra
    UpdateBotRequest:
      description: A Bot's fields after the change.
      allOf:
        - $ref: '#/components/schemas/BotFields'
    AuditFilterText:
      type: string
      maxLength: 4096
      pattern: ^[^\x00]*$
      description: >-
        Text a filter on the audit trail matches. Blank is no filter. It never
        holds a NUL character, which no event can.
    AuditEffect:
      type: string
      enum: [read, write]
      description: Whether an app call only reads, or changes something.
    AuditIntent:
      type: string
      description: What an action did, in the words of the boundary that judged it.
      enum:
        - activate
        - type
        - navigate
        - read
        - read_file
        - download_file
        - write_file
        - list_files
        - run_command
        - read_tool
        - write_tool
    AuditEvent:
      type: object
      description: >-
        One thing that happened, as the trail recorded it. Secrets are
        redacted from the payload before it is written.
      required:
        - id
        - actorUserId
        - initiatorKind
        - initiatorId
        - eventType
        - targetType
        - targetId
        - payload
        - createdAt
      properties:
        id:
          type: string
          description: The event's id.
        actorUserId:
          type: [string, 'null']
          description: >-
            The person whose authority it ran on, by user id. Null when it ran
            on nobody's, such as the deployment acting at start-up.
        initiatorKind:
          type: string
          description: >-
            What started it: person, deployment, routine, responsibility,
            memory or handoff. Read back as it was written, so an event from a
            later release may name another.
        initiatorId:
          type: [string, 'null']
          description: >-
            Which routine, responsibility, memory or Bot started it. Null when
            a person or the deployment did.
        eventType:
          type: string
          description: What happened, such as computer.action_refused.
        targetType:
          type: string
          description: The kind of thing it happened to, such as agent or computer.
        targetId:
          type: [string, 'null']
          description: The thing it happened to, by id. Null when it names none.
        payload:
          type: object
          additionalProperties: true
          description: What the event recorded. Its fields depend on eventType.
        createdAt:
          type: string
          format: date-time
          description: When it happened.
    AuditEventPage:
      type: object
      required: [auditEvents, nextCursor]
      properties:
        auditEvents:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next, older page. Null ends the list.
            Written in URL-safe base64, the only form the cursor parameter
            accepts.
    AuditVocabulary:
      type: object
      description: What a filter on the audit trail can name in this organization.
      required: [bots, people, apps, tools, rules]
      properties:
        bots:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        people:
          type: array
          items:
            type: object
            required: [id, name, email]
            properties:
              id:
                type: string
                description: Their user id, as actorUserId names them.
              name:
                type: [string, 'null']
              email:
                type: string
        apps:
          type: array
          description: Apps by their key (gmail), whichever way they were connected.
          items:
            type: object
            required: [key, name]
            properties:
              key:
                type: string
              name:
                type: string
                description: The app's name, as the Apps page shows it.
        tools:
          type: array
          description: The tools of each app, most called first.
          items:
            type: object
            required: [app, tool, calls]
            properties:
              app:
                type: string
                description: The app's key.
              tool:
                type: string
              calls:
                type: integer
                minimum: 0
                description: How many events the trail holds for it; 0 for a tool never called.
        rules:
          type: array
          description: >-
            Boundary rules: the policy's current ones, and any that refused
            something in the trail.
          items:
            type: object
            required: [rule, name, refusals]
            properties:
              rule:
                type: string
                description: The rule's text, as the rule filter takes it.
              name:
                type: [string, 'null']
                description: The name an administrator gave it, if any.
              refusals:
                type: integer
                minimum: 0
                description: How many refusals by it the trail holds.
    AuditQuestion:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^[^\x00]*$
          description: The question, 1 to 500 characters once trimmed.
        timeZone:
          type: string
          maxLength: 100
          description: >-
            Where the person asking is, as an IANA time zone (Europe/London),
            so yesterday is their yesterday. Absent or unknown means UTC.
    AuditFilters:
      type: object
      description: >-
        Filters on the audit trail, as listing audit events takes them, each
        list joined with commas: every filter narrows the events, and the
        values in a list are alternatives. Empty means every event.
      properties:
        eventType:
          type: array
          items:
            type: string
        bot:
          type: string
          description: One Bot, by id.
        actorUserId:
          type: string
        initiatorKind:
          type: array
          items:
            type: string
        app:
          type: array
          items:
            type: string
        tool:
          type: array
          items:
            type: string
        effect:
          $ref: '#/components/schemas/AuditEffect'
        intent:
          type: array
          items:
            $ref: '#/components/schemas/AuditIntent'
        rule:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    AuditFilterLabels:
      type: object
      description: >-
        The names for the values in a set of filters, so each reads as a name:
        Bots and people by id, apps by key, rules by their text.
      required: [bots, people, apps, rules]
      properties:
        bots:
          type: object
          additionalProperties:
            type: string
        people:
          type: object
          additionalProperties:
            type: string
        apps:
          type: object
          additionalProperties:
            type: string
        rules:
          type: object
          additionalProperties:
            type: string
    AuditAnswer:
      type: object
      description: >-
        A question about the trail, as filters. The events the filters list
        are the answer.
      required: [answerable, unanswered, filters, reading, labels]
      properties:
        answerable:
          type: string
          enum: ['yes', 'partly', 'no']
          description: Whether the trail answers all of the question, part of it, or none of it.
        unanswered:
          type: [string, 'null']
          description: What the trail can't answer, and why. Null when it answers all of it.
        filters:
          $ref: '#/components/schemas/AuditFilters'
        reading:
          type: [string, 'null']
          description: >-
            The filters read back in one line by a call that never saw the
            question. Null when the trail can't answer any of it.
        labels:
          $ref: '#/components/schemas/AuditFilterLabels'
    PersonRole:
      type: string
      enum: [admin, user]
      description: >-
        What a person may do in the organization. An administrator governs
        it: its people, its sign-in and its policy.
    OnboardingStatus:
      type: object
      description: Where a person is in first-run onboarding.
      required: [step, completedAt]
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: >-
            The step they were last on, by the app's own number for it. 0 is
            not started.
        completedAt:
          type: [string, 'null']
          format: date-time
          description: When they finished it. Null until they do, which the apps read as onboarding still to do.
    Person:
      type: object
      description: >-
        Somebody in the organization. People are here because they signed in,
        not because they were invited: the identity provider decides who
        exists, and the organization decides what they may do. role,
        needsName, revoked and configuredAdmin are the server's verdicts; a
        client renders them and never recomputes them.
      required:
        - id
        - email
        - name
        - image
        - role
        - needsName
        - onboarding
        - providers
        - lastSignedInAt
        - revoked
        - configuredAdmin
      properties:
        id:
          type: string
          description: The person's id.
        email:
          type: string
          description: The address they sign in with.
        name:
          type: [string, 'null']
          description: What OpenBot calls them. Null when nothing has named them.
        image:
          type: [string, 'null']
          description: The picture their identity provider gave, when it gave one.
        role:
          $ref: '#/components/schemas/PersonRole'
        needsName:
          type: boolean
          description: >-
            Whether they have still to choose what OpenBot calls them, because
            their name is missing or is only their address.
        onboarding:
          description: >-
            Where they are in first-run onboarding. Null where the deployment
            does not track it, which the apps read as nothing to finish.
          oneOf:
            - $ref: '#/components/schemas/OnboardingStatus'
            - type: 'null'
        providers:
          type: array
          description: >-
            The identity providers they have signed in through. More than one
            is normal while a company moves between providers.
          items:
            type: string
        lastSignedInAt:
          type: [string, 'null']
          format: date-time
          description: When they last signed in. Null if never.
        revoked:
          type: boolean
          description: >-
            Whether an administrator removed their access. They keep their
            record and their history.
        configuredAdmin:
          type: boolean
          description: >-
            Whether the deployment's configuration names them as an
            administrator, which nobody can change here: they stay an
            administrator and keep their access.
    PersonPage:
      type: object
      required: [people, nextCursor]
      properties:
        people:
          type: array
          description: The most recently signed in first.
          items:
            $ref: '#/components/schemas/Person'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    PersonResponse:
      type: object
      required: [person]
      properties:
        person:
          $ref: '#/components/schemas/Person'
    GetPersonResponse:
      type: object
      required: [person, openbotVersion]
      properties:
        person:
          $ref: '#/components/schemas/Person'
        openbotVersion:
          type: [string, 'null']
          description: >-
            The OpenBot release the server runs, such as v1.0.3, which the
            apps show under the person's name. Null when the server was built
            without one. Only ever given to somebody signed in.
    UpdatePersonRequest:
      type: object
      description: The changes to make. At least one.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\x00]*$
          description: >-
            What OpenBot calls the person, 1 to 100 characters once trimmed.
            Only the person themselves may change it.
        role:
          $ref: '#/components/schemas/PersonRole'
    AdvanceOnboardingRequest:
      type: object
      additionalProperties: false
      required: [step]
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The step the person is now on, by the app's own number for it.
    OnboardingResponse:
      type: object
      required: [onboarding]
      properties:
        onboarding:
          $ref: '#/components/schemas/OnboardingStatus'
    StandingInstructions:
      type: object
      description: >-
        What a person tells every Bot that works for them, in their own words.
        Empty means they wrote none.
      additionalProperties: false
      required: [instructions]
      properties:
        instructions:
          type: string
          maxLength: 4000
          pattern: ^[^\x00]*$
          description: At most 4,000 characters, kept trimmed.
    MessageListEmphasis:
      type: string
      enum: [agent, thread]
      description: What the conversation list leads with, the Bot or the conversation.
    OnOff:
      type: string
      enum: ['on', 'off']
    SkinId:
      type: string
      enum: [openbot, openduet, opendots, openfuse]
      description: How OpenBot looks. openbot is OpenBot as it is without a skin.
    Preferences:
      type: object
      description: How a person set OpenBot up for themselves, on every device they sign in from.
      required:
        - messageListEmphasis
        - selfHostBannerDismissed
        - narration
        - skin
        - proactive
      properties:
        messageListEmphasis:
          $ref: '#/components/schemas/MessageListEmphasis'
        selfHostBannerDismissed:
          type: boolean
          description: Whether they closed the banner offering help self-hosting OpenBot.
        narration:
          description: >-
            Whether they narrate their recordings in OpenBot's browser, which
            opens the microphone only when on. Null until they choose, which
            the browser asks before their first recording.
          oneOf:
            - $ref: '#/components/schemas/OnOff'
            - type: 'null'
        skin:
          $ref: '#/components/schemas/SkinId'
        proactive:
          $ref: '#/components/schemas/OnOff'
          description: >-
            Whether their Bots check in on their behalf at all. off stops
            every Bot's check-ins, whatever each Bot's own setting says.
        starterTourChannelId:
          type: string
          readOnly: true
          description: >-
            The conversation the starter tour is offered in, set by the server
            when the person starts their first one. Absent until then.
    UpdatePreferencesRequest:
      type: object
      description: The preferences to change. At least one; the rest stay as they are.
      additionalProperties: false
      minProperties: 1
      properties:
        messageListEmphasis:
          $ref: '#/components/schemas/MessageListEmphasis'
        selfHostBannerDismissed:
          type: boolean
        narration:
          $ref: '#/components/schemas/OnOff'
        skin:
          $ref: '#/components/schemas/SkinId'
        proactive:
          $ref: '#/components/schemas/OnOff'
    ApiKey:
      type: object
      description: An API key a person made. Never the key itself.
      required: [id, name, start, createdAt, expiresAt, lastUsedAt]
      properties:
        id:
          type: string
          description: The key's id.
        name:
          type: [string, 'null']
          description: What the person called it.
        start:
          type: [string, 'null']
          description: The key's first characters, enough to tell keys apart.
          example: obk_Xy
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When it stops working. Null if it never expires.
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: When it last signed a request. Null if never.
    ApiKeyPage:
      type: object
      required: [apiKeys, nextCursor]
      properties:
        apiKeys:
          type: array
          description: Newest first, then by id.
          items:
            $ref: '#/components/schemas/ApiKey'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[^\x00]*$
          description: What the key is for, so the person can tell it apart later.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Days until the key stops working. Absent, it never expires.
    CreatedApiKey:
      type: object
      required: [apiKey, key]
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        key:
          type: string
          description: >-
            The key itself, to send as Authorization: Bearer. Shown in this
            answer and never again.
    Session:
      type: object
      description: Somewhere a person is signed in. Never the session's token.
      required: [id, createdAt, lastActiveAt, expiresAt, ipAddress, userAgent, current]
      properties:
        id:
          type: string
          description: The session's id.
        createdAt:
          type: string
          format: date-time
          description: When they signed in.
        lastActiveAt:
          type: string
          format: date-time
          description: When the session was last renewed.
        expiresAt:
          type: string
          format: date-time
          description: When it ends unless it is used again.
        ipAddress:
          type: [string, 'null']
          description: The address they signed in from, when it was known.
        userAgent:
          type: [string, 'null']
          description: The browser or app they signed in with, as it named itself.
        current:
          type: boolean
          description: Whether this request came on this session.
    SessionPage:
      type: object
      required: [sessions, nextCursor]
      properties:
        sessions:
          type: array
          description: >-
            The newest sign-in first, then by id, an order that doesn't move
            while somebody pages.
          items:
            $ref: '#/components/schemas/Session'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    LinkedAccountProviderId:
      type: string
      enum: [slack, github]
      description: A service a person can link an account at.
    LinkedAccount:
      type: object
      description: >-
        A person's account at another service, which OpenBot knows is theirs.
        Never the credential it holds.
      required: [id, provider, title, handle, status, createdAt]
      properties:
        id:
          type: string
          description: The link's id.
        provider:
          $ref: '#/components/schemas/LinkedAccountProviderId'
        title:
          type: string
          description: The service's name, as a person reads it.
        handle:
          type: [string, 'null']
          description: Who they are there, such as their GitHub login, when the service said.
        status:
          type: string
          enum: [active, needs_reconnect]
          description: needs_reconnect when the service stopped accepting what the link holds, and linking again mends it.
        createdAt:
          type: string
          format: date-time
    LinkedAccountPage:
      type: object
      required: [linkedAccounts, nextCursor]
      properties:
        linkedAccounts:
          type: array
          description: The oldest link first, then by id.
          items:
            $ref: '#/components/schemas/LinkedAccount'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    LinkedAccountProvider:
      type: object
      required: [id, title]
      properties:
        id:
          $ref: '#/components/schemas/LinkedAccountProviderId'
        title:
          type: string
          description: The service's name, as a person reads it.
    LinkedAccountProviderPage:
      type: object
      required: [linkedAccountProviders, nextCursor]
      properties:
        linkedAccountProviders:
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccountProvider'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    LinkAccountRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/LinkedAccountProviderId'
    SlackLinkCode:
      type: object
      description: A one-time code the person sends the OpenBot app in Slack.
      required: [provider, code, expiresAt, instruction]
      properties:
        provider:
          type: string
          const: slack
        code:
          type: string
          description: The code. It works once, and only for the person it was made for.
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working.
        instruction:
          type: string
          description: What to send, and where, as a person reads it.
    GitHubAuthorization:
      type: object
      description: GitHub's consent page, which sends the person back to OpenBot once they agree.
      required: [provider, authorizationUrl]
      properties:
        provider:
          type: string
          const: github
        authorizationUrl:
          type: string
          format: uri
          description: The address to open. Always GitHub's own authorize page, over HTTPS.
    AccountLinkStart:
      description: What the person does next, by service.
      oneOf:
        - $ref: '#/components/schemas/SlackLinkCode'
        - $ref: '#/components/schemas/GitHubAuthorization'
      discriminator:
        propertyName: provider
        mapping:
          slack: '#/components/schemas/SlackLinkCode'
          github: '#/components/schemas/GitHubAuthorization'
    IdentityProviderProtocol:
      type: string
      enum: [saml, oidc]
      description: How the provider speaks. SAML is what most companies' identity teams supply.
    IdentityProvider:
      type: object
      description: >-
        A company's own identity provider, registered for single sign-on at
        its email domain. Never its client secret or signing certificate.
      required: [id, issuer, domain, protocol, registeredBy]
      properties:
        id:
          type: string
          description: The provider's id, as it was registered.
        issuer:
          type: string
          description: Who issues its sign-ins.
        domain:
          type: string
          description: The email domain that sends somebody to it.
        protocol:
          $ref: '#/components/schemas/IdentityProviderProtocol'
        registeredBy:
          type: [string, 'null']
          description: >-
            The id of the person who registered it, while they still have an
            account here. Null once they are gone; the provider stays.
    IdentityProviderPage:
      type: object
      required: [identityProviders, nextCursor]
      properties:
        identityProviders:
          type: array
          description: By domain, then by id.
          items:
            $ref: '#/components/schemas/IdentityProvider'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    IdentityProviderResponse:
      type: object
      required: [identityProvider]
      properties:
        identityProvider:
          $ref: '#/components/schemas/IdentityProvider'
    IdentityProviderText:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[^\x00]*\S[^\x00]*$
    IdentityProviderAddress:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      pattern: ^https?://[^\x00\s]+$
    SamlIdentityProviderRequest:
      type: object
      additionalProperties: false
      required: [protocol, id, domain, issuer, entryPoint, metadata]
      properties:
        protocol:
          type: string
          const: saml
        id:
          $ref: '#/components/schemas/NewIdentityProviderId'
        domain:
          $ref: '#/components/schemas/IdentityProviderDomains'
        issuer:
          $ref: '#/components/schemas/IdentityProviderAddress'
        entryPoint:
          $ref: '#/components/schemas/IdentityProviderAddress'
        metadata:
          type: string
          minLength: 1
          maxLength: 200000
          pattern: ^[^\x00]*\S[^\x00]*$
          description: The provider's SAML metadata XML, as its identity team supplied it.
    OidcIdentityProviderRequest:
      type: object
      additionalProperties: false
      required: [protocol, id, domain, issuer, clientId, clientSecret]
      properties:
        protocol:
          type: string
          const: oidc
        id:
          $ref: '#/components/schemas/NewIdentityProviderId'
        domain:
          $ref: '#/components/schemas/IdentityProviderDomains'
        issuer:
          $ref: '#/components/schemas/IdentityProviderAddress'
        clientId:
          $ref: '#/components/schemas/IdentityProviderText'
        clientSecret:
          $ref: '#/components/schemas/IdentityProviderText'
    NewIdentityProviderId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[^\x00]*\S[^\x00]*$
      description: An id for the provider, unique in the organization, such as acme-okta.
    IdentityProviderDomains:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[^\x00]*\S[^\x00]*$
      description: >-
        The email domain whose people it signs in, such as acme.com. Several
        are separated by commas.
    CreateIdentityProviderRequest:
      description: A SAML or an OIDC provider, by protocol.
      oneOf:
        - $ref: '#/components/schemas/SamlIdentityProviderRequest'
        - $ref: '#/components/schemas/OidcIdentityProviderRequest'
      discriminator:
        propertyName: protocol
        mapping:
          saml: '#/components/schemas/SamlIdentityProviderRequest'
          oidc: '#/components/schemas/OidcIdentityProviderRequest'
    Deployment:
      type: object
      description: What this OpenBot offers and how people sign in to it.
      required:
        - edition
        - localEvaluation
        - generativeUi
        - selfHostBanner
        - transcription
        - voice
        - durableHistory
        - authProviders
        - ssoConfigured
        - ssoRequired
      properties:
        edition:
          type: string
          enum: [team, personal]
          description: >-
            team is OpenBot as an organization runs it; personal is one person
            on their own machine, with no sign-in and none of the screens that
            govern other people.
        localEvaluation:
          type: boolean
          description: Whether somebody is trying OpenBot on their own machine, with nobody else able to reach it.
        generativeUi:
          type: boolean
          description: Whether a Bot may answer with an interface it wrote itself.
        selfHostBanner:
          type: boolean
          description: Whether to offer help self-hosting OpenBot.
        transcription:
          type: boolean
          description: Whether a person can dictate a message.
        voice:
          type: boolean
          description: Whether a person can talk to a Bot.
        durableHistory:
          type: boolean
          description: Whether conversations are kept between restarts.
        authProviders:
          type: array
          description: The social sign-ins offered, by id.
          items:
            type: string
            enum: [google, microsoft, okta]
        ssoConfigured:
          type: boolean
          description: >-
            Whether a company's own identity provider is registered, so an
            email address can be sent to it. Never which.
        ssoRequired:
          type: boolean
          description: >-
            Whether an administrator requires single sign-on; social sign-in
            then stays only as the configured administrators' way in.
    AllowlistEntry:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[^\x00]*\S[^\x00]*$
    OrganizationSettingValues:
      type: object
      properties:
        ssoRequired:
          type: boolean
          description: >-
            Whether people must sign in through the organization's identity
            provider. The administrators the deployment's configuration names
            keep social sign-in as their way in.
        actionRecording:
          type: boolean
          description: Whether what Bots do on their computers is recorded, to read in computer actions.
        inactiveComputerDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: Days a Bot computer may sit idle before it is stopped. 0 never stops one.
        modelAllowlist:
          type: object
          additionalProperties: false
          required: [enabled, models]
          properties:
            enabled:
              type: boolean
              description: Whether the list limits anything. Off, every model is allowed.
            models:
              type: array
              maxItems: 500
              description: The models Bots may run on, as provider/model.
              items:
                $ref: '#/components/schemas/AllowlistEntry'
        mcpAllowlist:
          type: object
          additionalProperties: false
          required: [enabled, servers]
          properties:
            enabled:
              type: boolean
              description: Whether the list limits anything. Off, every app is allowed.
            servers:
              type: array
              maxItems: 500
              description: The apps Bots may use, by id.
              items:
                $ref: '#/components/schemas/AllowlistEntry'
        skillSharing:
          type: boolean
          description: Whether people may open the skills learned from their recordings to every Bot.
        proactiveDailyRuns:
          type: integer
          minimum: 1
          maximum: 1440
          description: How many check-ins each Bot may run for one person in a day.
        modelSelection:
          type: boolean
          description: Whether people may pick the model a built-in Bot answers on, per conversation.
    OrganizationSettings:
      allOf:
        - $ref: '#/components/schemas/OrganizationSettingValues'
        - type: object
          required:
            - ssoRequired
            - actionRecording
            - inactiveComputerDays
            - modelAllowlist
            - mcpAllowlist
            - skillSharing
            - proactiveDailyRuns
            - modelSelection
            - context
          properties:
            context:
              $ref: '#/components/schemas/OrganizationSettingsContext'
    OrganizationSettingsContext:
      type: object
      readOnly: true
      description: What an administrator needs to set the settings. Read only.
      required:
        - builtInModel
        - directoryGroups
        - apps
        - defaultDestinations
        - scim
        - otel
        - actionRecordRetentionDays
      properties:
        builtInModel:
          type: [string, 'null']
          description: The model OpenBot's own Bots run on, when one is set.
        directoryGroups:
          type: array
          description: The directory groups people belong to, by name.
          items:
            type: string
        apps:
          type: array
          description: The apps an allowlist can name.
          items:
            type: object
            required: [id, title, url]
            properties:
              id:
                type: string
              title:
                type: string
              url:
                type: string
        defaultDestinations:
          type: array
          description: The package registries and source hosts every computer may reach unless the list is the only thing allowed.
          items:
            type: string
        scim:
          type: object
          required: [configured, connectionId, baseUrl, rotating]
          properties:
            configured:
              type: boolean
            connectionId:
              type: string
            baseUrl:
              type: [string, 'null']
            rotating:
              type: boolean
              description: Whether a second token is set while the first is being replaced.
        otel:
          type: object
          required: [configured]
          properties:
            configured:
              type: boolean
        actionRecordRetentionDays:
          type: integer
          description: How many days recorded computer actions are kept.
    UpdateOrganizationSettingsRequest:
      allOf:
        - $ref: '#/components/schemas/OrganizationSettingValues'
      description: The settings to change. At least one; the rest stay as they are.
      minProperties: 1
    InactiveComputersStopped:
      type: object
      required: [stopped, skipped]
      properties:
        stopped:
          type: array
          description: The Bots whose computers stopped.
          items:
            type: string
        skipped:
          type: [string, 'null']
          description: Why nothing was stopped, when nothing was looked at.
    PersonComputersStopped:
      type: object
      required: [stopped, failed]
      properties:
        stopped:
          type: array
          description: >-
            The computers stopped: `person:<id>` for the person's own, which every
            Bot they use runs on, and `bot:<id>` for each of their Bots that has a
            computer of its own.
          items:
            type: string
        failed:
          type: array
          description: The ones that would not stop, and why.
          items:
            type: object
            required: [computer, reason]
            properties:
              computer:
                type: string
                description: The computer, named as in `stopped`.
              reason:
                type: string
    CapabilityId:
      type: string
      enum:
        - useBots
        - cloudBrowser
        - cloudNetwork
        - cloudComputer
        - localComputer
        - customRules
        - passwordManager
        - slackTeams
        - teamBots
        - ownerApps
        - isolatedComputers
        - proactive
      description: A permission switch.
    Capability:
      type: object
      description: >-
        A permission switch, and what each level set it to. Null at a level
        means it sets nothing and the level beneath decides.
      required: [id, title, description, default, organization, roles, groups]
      properties:
        id:
          $ref: '#/components/schemas/CapabilityId'
        title:
          type: string
        description:
          type: string
        default:
          type: boolean
          description: What applies where nothing is set.
        organization:
          type: [boolean, 'null']
        roles:
          type: object
          description: What each role is set to, by role. A role absent sets nothing.
          properties:
            admin:
              type: boolean
            user:
              type: boolean
        groups:
          type: object
          description: What each directory group is set to, by name. A group absent sets nothing.
          additionalProperties:
            type: boolean
    CapabilityPage:
      type: object
      required: [capabilities, nextCursor]
      properties:
        capabilities:
          type: array
          description: In the order the screens show them.
          items:
            $ref: '#/components/schemas/Capability'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    SwitchValue:
      type: [boolean, 'null']
      description: On, off, or null to clear it so the level beneath decides.
    UpdateCapabilityRequest:
      type: object
      description: The levels to set or clear. At least one.
      additionalProperties: false
      minProperties: 1
      properties:
        organization:
          $ref: '#/components/schemas/SwitchValue'
        roles:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            admin:
              $ref: '#/components/schemas/SwitchValue'
            user:
              $ref: '#/components/schemas/SwitchValue'
        groups:
          type: object
          minProperties: 1
          maxProperties: 100
          description: By directory group name, 1 to 200 characters.
          propertyNames:
            minLength: 1
            maxLength: 200
            pattern: ^[^\x00]*\S[^\x00]*$
          additionalProperties:
            $ref: '#/components/schemas/SwitchValue'
    CapabilityChange:
      type: object
      additionalProperties: false
      required: [scopeKind, capability, allowed]
      properties:
        scopeKind:
          type: string
          enum: [organization, role, group]
        scopeId:
          type: string
          maxLength: 200
          pattern: ^[^\x00]*$
          description: Empty for the organization; admin or user for a role; the group's name for a group.
        capability:
          $ref: '#/components/schemas/CapabilityId'
        allowed:
          $ref: '#/components/schemas/SwitchValue'
    Authoring:
      type: object
      additionalProperties: false
      required: [source, text]
      description: The sentence in English a change was written from, recorded with it.
      properties:
        source:
          type: string
          const: english
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^[^\x00]*\S[^\x00]*$
    CapabilityChangesToPreview:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CapabilityChange'
    CapabilityChanges:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CapabilityChange'
        authoring:
          $ref: '#/components/schemas/Authoring'
    SavedCapabilityChanges:
      type: object
      required: [saved]
      properties:
        saved:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityChange'
    ChangeDescription:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: ^[^\x00]*\S[^\x00]*$
          description: The change in a sentence or two, at most 1,000 characters once trimmed.
    RuleCheck:
      type: object
      description: Whether a proposal passes the rule a save applies, and what is wrong when it doesn't.
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
        problems:
          type: array
          items: {}
    CapabilityTranslation:
      type: object
      required: [changes, summary, explanation, check, warning]
      properties:
        changes:
          type: array
          description: >-
            The changes the model wrote. When `check.ok` is true each is a valid
            CapabilityChange; when it is false they are as written, so the admin
            can see what failed, and `check.problems` says which.
          items:
            $ref: '#/components/schemas/WrittenCapabilityChange'
        summary:
          type: [string, 'null']
        explanation:
          type: [string, 'null']
        check:
          $ref: '#/components/schemas/RuleCheck'
        warning:
          type: [string, 'null']
    WrittenCapabilityChange:
      type: object
      description: A switch change as the model wrote it, before it is checked.
      required: [scopeKind, scopeId, capability, allowed]
      properties:
        scopeKind:
          type: string
          enum: [organization, role, group]
        scopeId:
          type: string
        capability:
          type: string
        allowed:
          $ref: '#/components/schemas/SwitchValue'
    CapabilityAnswer:
      type: object
      required: [allowed, decidedBy, scopeId]
      properties:
        allowed:
          type: boolean
        decidedBy:
          type: string
          enum: [default, organization, role, group]
        scopeId:
          type: string
          description: The role or group that decided it. Empty otherwise.
    CapabilityPreview:
      type: object
      required: [check, people, counts, activity, warning]
      properties:
        check:
          $ref: '#/components/schemas/RuleCheck'
        people:
          type: array
          items:
            type: object
            required: [id, email, name, role, groups, capabilities]
            properties:
              id:
                type: string
              email:
                type: string
              name:
                type: [string, 'null']
              role:
                $ref: '#/components/schemas/PersonRole'
              groups:
                type: array
                items:
                  type: string
              capabilities:
                type: array
                items:
                  type: object
                  required: [capability, title, before, after]
                  properties:
                    capability:
                      $ref: '#/components/schemas/CapabilityId'
                    title:
                      type: string
                    before:
                      $ref: '#/components/schemas/CapabilityAnswer'
                    after:
                      $ref: '#/components/schemas/CapabilityAnswer'
                    activity:
                      type: object
                      required: [what, count, more, recent]
                      properties:
                        what:
                          type: string
                        count:
                          type: integer
                        more:
                          type: boolean
                        recent:
                          type: array
                          items:
                            $ref: '#/components/schemas/AuditEvent'
        counts:
          type: object
          required: [people, losing, gaining, keeping, unchanged]
          properties:
            people:
              type: integer
            losing:
              type: integer
            gaining:
              type: integer
            keeping:
              type: integer
            unchanged:
              type: integer
        activity:
          type: object
          required: [days, unmapped]
          properties:
            days:
              type: integer
            unmapped:
              type: array
              items:
                type: object
                required: [capability, title]
                properties:
                  capability:
                    $ref: '#/components/schemas/CapabilityId'
                  title:
                    type: string
        warning:
          type: [string, 'null']
    PersonCapabilities:
      type: object
      required: [capabilities, enforced]
      properties:
        capabilities:
          type: object
          description: Each switch, on or off for this person.
          additionalProperties:
            type: boolean
        enforced:
          type: boolean
          description: False where the deployment keeps no switches and every default applies.
    NetworkMode:
      type: string
      enum: [allow_all, defaults_plus_allowlist, allowlist_only]
      description: >-
        allow_all lets computers connect anywhere; defaults_plus_allowlist to
        the list and the default destinations; allowlist_only to the list
        alone.
    EgressRule:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          enum: [domain, cidr]
        value:
          type: string
          minLength: 1
          maxLength: 253
          description: A host, which covers its subdomains, or an IP range in CIDR form.
        ports:
          type: string
          maxLength: 100
          description: Ports, such as 443 or 8000-8100, separated by commas. Absent is every port.
    WrittenEgressRule:
      type: object
      description: An allowlist entry as the model wrote it, before it is parsed.
      required: [type, value]
      properties:
        type:
          type: string
        value:
          type: string
        ports:
          type: string
    NetworkPolicy:
      type: object
      required: [id, scopeKind, scopeId, mode, rules, locked, updatedBy, updatedAt]
      properties:
        id:
          type: string
          description: organization, or group:<name> for a directory group.
        scopeKind:
          type: string
          enum: [organization, group]
        scopeId:
          type: string
          description: The group's name. Empty for the organization.
        mode:
          $ref: '#/components/schemas/NetworkMode'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/EgressRule'
        locked:
          type: boolean
          description: For the organization's, whether it applies to every group too.
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: string
          format: date-time
    NetworkPolicyPage:
      type: object
      required: [networkPolicies, nextCursor]
      properties:
        networkPolicies:
          type: array
          description: The organization's first, then each group's by name.
          items:
            $ref: '#/components/schemas/NetworkPolicy'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    NetworkPolicyInput:
      type: object
      additionalProperties: false
      required: [mode, rules]
      properties:
        mode:
          $ref: '#/components/schemas/NetworkMode'
        rules:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/EgressRule'
        locked:
          type: boolean
          default: false
        authoring:
          $ref: '#/components/schemas/Authoring'
    NetworkPolicyCandidate:
      type: object
      additionalProperties: false
      required: [scopeKind, mode, rules]
      properties:
        scopeKind:
          type: string
          enum: [organization, group]
        scopeId:
          type: string
          maxLength: 200
          pattern: ^[^\x00]*$
          description: The group's name. Empty for the organization.
        mode:
          $ref: '#/components/schemas/NetworkMode'
        rules:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/EgressRule'
        locked:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 2000
          description: How many recent page visits to test against. 500 when absent.
    NetworkTranslation:
      type: object
      required: [mode, rules, summary, reachable, explanation, check, warning]
      properties:
        mode:
          type: string
          enum: [allowlist_only, defaults_plus_allowlist]
        rules:
          type: array
          description: >-
            The entries. Parsed and tidied when `check.ok` is true, each then a
            valid EgressRule; as the model wrote them when it is false, so the
            admin can see and fix what failed.
          items:
            $ref: '#/components/schemas/WrittenEgressRule'
        summary:
          type: [string, 'null']
        reachable:
          type: array
          description: What becomes reachable, one line per service.
          items:
            type: string
        explanation:
          type: [string, 'null']
        check:
          $ref: '#/components/schemas/RuleCheck'
        warning:
          type: [string, 'null']
    NetworkReplayReport:
      type: object
      required: [scanned, covered, wouldBlock, wouldAllow, undecided, unchanged, hosts, sites]
      properties:
        scanned:
          type: integer
        covered:
          type: integer
        wouldBlock:
          type: integer
        wouldAllow:
          type: integer
        undecided:
          type: integer
        unchanged:
          type: integer
        hosts:
          type: array
          items:
            type: object
            required: [host, change, visits, bots, lastVisit]
            properties:
              host:
                type: string
              change:
                type: string
                enum: [block, allow]
              visits:
                type: integer
              bots:
                type: array
                items:
                  type: string
              lastVisit:
                type: string
        sites:
          type: integer
    ModelUsage:
      type: object
      required: [days, summary, recent]
      properties:
        days:
          type: integer
        summary:
          type: array
          items:
            type: object
            required: [model, source, runs, refused, people, lastUsedAt]
            properties:
              model:
                type: string
              source:
                type: string
              runs:
                type: integer
              refused:
                type: integer
              people:
                type: integer
              lastUsedAt:
                type: string
                format: date-time
        recent:
          type: array
          description: The newest 50 runs.
          items:
            type: object
            required: [id, email, agentId, model, source, allowed, createdAt]
            properties:
              id:
                type: string
              email:
                type: [string, 'null']
              agentId:
                type: string
              model:
                type: string
              source:
                type: string
              allowed:
                type: boolean
              createdAt:
                type: string
                format: date-time
    ComputerAction:
      type: object
      required: [id, surface, botId, toolName, command, outcome, createdAt]
      properties:
        id:
          type: string
        surface:
          type: string
          enum: [cloud, local]
        botId:
          type: [string, 'null']
        toolName:
          type: string
        command:
          type: string
        outcome:
          type: string
        createdAt:
          type: string
          format: date-time
    ComputerActionPage:
      type: object
      required: [computerActions, nextCursor]
      properties:
        computerActions:
          type: array
          description: Newest first, then by id.
          items:
            $ref: '#/components/schemas/ComputerAction'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    SetupChecklist:
      type: object
      required: [audience, rows]
      properties:
        audience:
          type: string
          enum: [admin, member]
          description: Who the checklist was written for.
        rows:
          type: array
          items:
            type: object
            required: [id, scope, title, required, status, ready, detail, fix]
            properties:
              id:
                type: string
                enum: [intelligence, model, computer, apps, chat]
              scope:
                type: string
                const: deployment
              title:
                type: string
              required:
                type: boolean
              status:
                type: string
                enum: [ready, needs_setup, not_checked]
              ready:
                type: boolean
              detail:
                type: string
              fix:
                oneOf:
                  - type: object
                    required: [kind, names, docsUrl]
                    properties:
                      kind:
                        type: string
                        const: env
                      names:
                        type: array
                        items:
                          type: string
                      docsUrl:
                        type: string
                      page:
                        type: object
                        required: [label, path]
                        properties:
                          label:
                            type: string
                          path:
                            type: string
                  - type: object
                    required: [kind, label, path]
                    properties:
                      kind:
                        type: string
                        const: page
                      label:
                        type: string
                      path:
                        type: string
                      docsUrl:
                        type: string
                  - type: 'null'
    Problem:
      type: object
      description: >-
        RFC 9457 problem details, in the shape CopilotKit Intelligence's v2
        API uses. status equals the HTTP status; code and type name the same
        stable error. detail is the sentence a person reads.
      required:
        - type
        - title
        - status
        - detail
        - code
        - category
        - retryable
        - requestId
        - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
        category:
          type: string
          enum:
            - validation
            - auth
            - permission
            - not_found
            - conflict
            - rate_limit
            - internal
            - dependency
        retryable:
          type: boolean
        requestId:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        capability:
          type: string
          description: >-
            The switch an administrator can turn on for this person, when the
            refusal is for want of one (isolatedComputers).
  responses:
    InvalidRequest:
      description: A parameter is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: A Bot id is required.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidBot:
      description: >-
        A field is missing or out of bounds, the address is one this deployment
        may not reach, or the deployment cannot give a Bot a computer of its
        own.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            name:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Name must be text between 1 and 80 characters.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            noIsolation:
              value:
                type: https://open.bot/errors/isolation-unavailable
                title: This OpenBot can't give a Bot a computer of its own.
                status: 400
                detail: This OpenBot can't give a Bot a computer of its own, so it runs on yours.
                code: ISOLATION_UNAVAILABLE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    Unauthenticated:
      description: The caller is not signed in.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/auth-unauthenticated
                title: Authentication is required.
                status: 401
                detail: Authentication required.
                code: AUTH_UNAUTHENTICATED
                category: auth
                retryable: false
                requestId: req_example
                traceId: trace_example
    Forbidden:
      description: The caller holds no role in this organization.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noRole:
              value:
                type: https://open.bot/errors/permission-denied
                title: Authorization required.
                status: 403
                detail: Authorization required.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    BotForbidden:
      description: >-
        The caller may not manage this Bot, the Bot comes with OpenBot, or the
        caller may not give it a computer of its own.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: You can't manage this Bot.
                status: 403
                detail: You can't manage this Bot.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            isolation:
              value:
                type: https://open.bot/errors/capability-required
                title: Your admin hasn't turned on Isolated Bots for you.
                status: 403
                detail: Your admin hasn't turned on Isolated Bots for you.
                code: CAPABILITY_REQUIRED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
                capability: isolatedComputers
    AdminOnly:
      description: >-
        The caller is not an administrator of the organization, or holds no
        role in it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAdmin:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only an admin can do this.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidAuditQuestion:
      description: >-
        The question is blank or longer than 500 characters once trimmed, holds
        a character OpenBot can't keep, or a parameter is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            blank:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Ask a question first.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            long:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Keep the question under 500 characters. Ask one thing at a time.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    AuditQuestionNotUnderstood:
      description: >-
        The model's filters still failed their check on its second try, so
        none are given.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notUnderstood:
              value:
                type: https://open.bot/errors/question-not-understood
                title: Couldn't turn that question into filters.
                status: 422
                detail: Couldn't turn that question into filters. Ask it another way, or set the filters yourself.
                code: QUESTION_NOT_UNDERSTOOD
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    ModelFailed:
      description: The model didn't answer, or didn't answer usefully. Asking again may work.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unreachable:
              value:
                type: https://open.bot/errors/model-failed
                title: The model didn't answer.
                status: 502
                detail: Couldn't reach the model. Try again.
                code: MODEL_FAILED
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    ModelNotConfigured:
      description: The deployment has no model to read a question with.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noModel:
              value:
                type: https://open.bot/errors/model-not-configured
                title: OpenBot has no model to answer with.
                status: 503
                detail: OpenBot needs a model key to answer a question. Add one in the Vault, or set the filters yourself.
                code: MODEL_NOT_CONFIGURED
                category: dependency
                retryable: false
                requestId: req_example
                traceId: trace_example
    OrganizationNotFound:
      description: The organization does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/organization-not-found
                title: Organization not found.
                status: 404
                detail: Couldn't find that organization.
                code: ORGANIZATION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    BotNotFound:
      description: >-
        The Bot does not exist, was deleted, or is not visible to the caller,
        or the organization is not.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/bot-not-found
                title: Bot not found.
                status: 404
                detail: Couldn't find that Bot.
                code: BOT_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    IdempotencyConflict:
      description: The Idempotency-Key was already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidPerson:
      description: >-
        The change is empty, names something a person doesn't have, or the
        name is blank or longer than 100 characters once trimmed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            name:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Enter a name between 1 and 100 characters.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    PersonForbidden:
      description: >-
        The caller asked about or changed somebody else without being an
        administrator, changed somebody else's name, or changed a role
        without being an administrator.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAdmin:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only an admin can see someone else's account.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            name:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can change their name.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    OwnOnly:
      description: >-
        The caller asked about somebody else's own things, which only that
        person may read or change: an administrator can't either.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can see their standing instructions.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignedInOwnOnly:
      description: >-
        The caller asked about somebody else's API keys or sessions, or signed
        the request with an API key or an app's sign-in rather than signing
        in to OpenBot.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only they can see their API keys.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            key:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: An API key or an app can't manage API keys or sessions. Sign in to OpenBot to do this.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignedInAdminOnly:
      description: >-
        The caller is not an administrator, or signed the request with an API
        key or an app's sign-in rather than signing in to OpenBot.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAdmin:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only an admin can do this.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    PersonNotFound:
      description: >-
        Nobody with that id has signed in here, or the organization does not
        exist. Only an administrator is told so: anybody else is refused
        first.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/person-not-found
                title: Person not found.
                status: 404
                detail: That person is not here.
                code: PERSON_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    PersonConflict:
      description: >-
        The change would leave the organization without a way back in: an
        administrator removing their own role or access, or a change to
        somebody the deployment's configuration names as an administrator.
        Or the Idempotency-Key was used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ownRole:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: You can't remove your own admin role.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
            reused:
              value:
                type: https://open.bot/errors/idempotency-key-conflict
                title: That Idempotency-Key was used for a different request.
                status: 409
                detail: That Idempotency-Key was used for a different request.
                code: IDEMPOTENCY_KEY_CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    ApiKeyNotFound:
      description: The person has no such API key, it was deleted, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/api-key-not-found
                title: API key not found.
                status: 404
                detail: Couldn't find that API key.
                code: API_KEY_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    SessionNotFound:
      description: The person has no such session, it ended, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/session-not-found
                title: Session not found.
                status: 404
                detail: Couldn't find that session. It may have ended already.
                code: SESSION_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    LinkedAccountNotFound:
      description: >-
        The person has no such linked account: it was unlinked already, or
        never was. Or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/linked-account-not-found
                title: Linked account not found.
                status: 404
                detail: Linked account not found.
                code: LINKED_ACCOUNT_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    LinkProviderUnavailable:
      description: >-
        This deployment can't link an account at that service, or the
        organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://open.bot/errors/link-provider-unavailable
                title: That account type can't be linked here.
                status: 404
                detail: That account type cannot be linked here.
                code: LINK_PROVIDER_UNAVAILABLE
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    LinkedAccountsUnavailable:
      description: >-
        This deployment keeps no linked accounts at all. The apps read this
        as nothing to show, unlike any other 503.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://open.bot/errors/linked-accounts-unavailable
                title: Linked accounts aren't available here.
                status: 503
                detail: Linked accounts are not available.
                code: LINKED_ACCOUNTS_UNAVAILABLE
                category: dependency
                retryable: false
                requestId: req_example
                traceId: trace_example
    IdentityProviderNotFound:
      description: No identity provider has that id, it was removed, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/identity-provider-not-found
                title: Identity provider not found.
                status: 404
                detail: There is no such provider.
                code: IDENTITY_PROVIDER_NOT_FOUND
                category: not_found
                retryable: false
                requestId: req_example
                traceId: trace_example
    IdentityProviderConflict:
      description: >-
        A provider with that id is registered already, or the Idempotency-Key
        was used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            taken:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: An identity provider with that name is registered already. Choose another name.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignInUnavailable:
      description: >-
        This deployment signs nobody in, as OpenBot Desktop runs for one
        person, so it has no API keys, no sessions and no single sign-on to set
        up.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            single:
              value:
                type: https://open.bot/errors/sign-in-unavailable
                title: This OpenBot signs nobody in.
                status: 503
                detail: This OpenBot signs nobody in, so it has no API keys.
                code: SIGN_IN_UNAVAILABLE
                category: dependency
                retryable: false
                requestId: req_example
                traceId: trace_example
    SettingsConflict:
      description: >-
        Single sign-on can't be required before an identity provider is
        registered, or the Idempotency-Key was used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noProvider:
              value:
                type: https://open.bot/errors/conflict
                title: The request conflicts with the current state.
                status: 409
                detail: Register an identity provider before requiring SSO, or nobody but the break-glass administrators can sign in.
                code: CONFLICT
                category: conflict
                retryable: false
                requestId: req_example
                traceId: trace_example
    SignOutUnfinished:
      description: >-
        Single sign-on is now required, but not everybody could be signed out
        yet. Saving it again finishes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            again:
              value:
                type: https://open.bot/errors/service-unavailable
                title: A service OpenBot depends on is unavailable.
                status: 503
                detail: SSO is now required, but not everybody could be signed out yet. Save it again to finish.
                code: SERVICE_UNAVAILABLE
                category: dependency
                retryable: true
                requestId: req_example
                traceId: trace_example
    CapabilityNotFound:
      description: No permission switch has that id, or the organization does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/capability-not-found
                title: Permission not found.
                status: 404
                detail: There is no such permission.
                code: CAPABILITY_NOT_FOUND
