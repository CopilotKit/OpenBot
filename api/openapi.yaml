        - id
        - transport
        - conversationId
        - botId
        - address
        - optedOutAt
        - createdAt
      properties:
        id:
          type: string
          description: The destination's id.
        transport:
          $ref: '#/components/schemas/DestinationTransport'
        conversationId:
          type: string
          description: The conversation it continues.
        botId:
          type: string
          description: The Bot that answers there.
        address:
          type: string
          description: 'Where the Bot sends: the phone number for text messages, or the chat''s own id in Slack or Teams.'
        optedOutAt:
          type:
            - string
            - 'null'
          format: date-time
          description: 'Text messages only: when the person texted STOP. Nothing is texted until they text START. Null while they can be texted.'
        createdAt:
          type: string
          format: date-time
          description: When it was connected.
    DestinationPage:
      type: object
      required:
        - destinations
        - nextCursor
      properties:
