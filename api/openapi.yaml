        and the sessions, API keys and app sign-ins they hold end at once.
        They keep their record and their history, and restoring their access
        lets them sign in again. Their connected credentials are retired too.
        Only an administrator may do this, never to themselves, and never to
        somebody the deployment's configuration names as an administrator.
        Removing somebody already removed retires anything left and records
        nothing new.
      security:
        - webSession: []
        - appOAuth: [people:write]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
