    get:
      tags: [API keys]
      operationId: listApiKeys
      summary: List a person's API keys
      description: >-
        Return one page of the API keys a person made, newest first. Never a
        key itself: start is its first characters, enough to tell keys apart.
        Only the person themselves may list them, signed in to OpenBot rather
        than with a key or an app's sign-in. A missing cursor starts at the
        first page and nextCursor null ends the list.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of API keys.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/ApiKeyPageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SignedInOwnOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [API keys]
      operationId: createApiKey
      summary: Make an API key
      description: >-
        Make an API key that acts as the person, inside this organization,
        on the API only. The key itself is in this answer and never again:
        OpenBot keeps only a hash of it. Only the person themselves may make
        one, signed in to OpenBot: a key can never make another key, and
        neither can an app's sign-in. A key ends when it expires, when it is
        deleted, or when an administrator removes the person.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            examples:
              script:
                value:
                  name: Nightly report
                  expiresInDays: 90
      responses:
        '201':
          description: The key, shown this once.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              description: The new key's address.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiKey'
              examples:
                made:
                  $ref: '#/components/examples/CreatedApiKeyExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SignedInOwnOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/SignInUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
