    put:
      tags:
        - Components
      operationId: replaceComponentDraft
      summary: Save a component's draft
      description: 'Replace a component''s draft. Nothing a Bot sees changes until the component is published. For a component that comes with OpenBot the draft is its description, which the model reads when it decides to draw it; a title or source that differs from what it has is refused. For a Playground component the draft is its title, description and source. Saving one under a new name writes a new Playground component, unpublished: the name is custom_ and then lower-case letters, numbers and underscores. Recorded on the audit trail. Only an admin may save a draft.'
      security:
        - webSession: []
        - appOAuth:
            - components:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentDraftInput'
            examples:
              description:
                summary: A new description for a component that comes with OpenBot.
                value:
                  description: Compare values across categories with a bar chart. Use it for up to twelve bars.
              playground:
                summary: A Playground component's whole draft.
                value:
                  title: Weather card
                  description: Show today's weather for one city.
                  source:
                    html: <div class="card"><h3 id="city"></h3><p id="forecast"></p></div>
                    css: '.card { padding: 12px; }'
                    jsFunctions: document.getElementById("city").textContent = window.__args.city;
