        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/CredentialsUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
