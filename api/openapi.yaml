  /api/v2/organizations/{organizationId}/bots/{botId}/grants/{grantId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
      - name: grantId
        in: path
        required: true
        description: 'The grant: action:<app id>:<action name> for one action of an app, skill:<slug> for a skill, or bot:<Bot id> for another Bot this Bot may hand work to. Percent-encode it in the path.'
        schema:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^(action:[^:]+:|skill:|bot:)\S
        example: action:notion:notion-search
    put:
      tags:
        - Bot grants
      operationId: replaceBotGrant
      summary: Give a Bot an action, a skill or another Bot
      description: Give a Bot one thing to use, or keep what it has. An administrator may give a Bot an action of an app OpenBot has added, even one the app no longer lists, any skill, or another Bot to hand work to. A Bot's owner may give it their own skill, or one action their own app offers now when the app is open to owners; that action runs on the account of whoever asks. For an action of an app with one shared account, approval says who may have the Bot use that account. Without it, an administrator's grant approves the people who can use the Bot now, unless an administrator already chose. Recorded on the audit trail.
      security:
        - webSession: []
        - appOAuth:
            - bot-grants:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotGrantInput'
            examples:
              plain:
                value: {}
      responses:
        '200':
          description: The grant, as the Bot has it now.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotGrant'
              examples:
                action:
                  $ref: '#/components/examples/BotGrantExample'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotGrantForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags:
        - Bot grants
      operationId: deleteBotGrant
      summary: Take something from a Bot
      description: Take one action, skill or Bot from a Bot. An administrator may take any of them, including one whose app or skill is gone. A Bot's owner may take their own skill from it, and takes back the actions they gave with takeBackBotApp. Routines can't be taken. In OpenBot Personal neither can an app's actions or another Bot, since every Bot has them. Recorded on the audit trail. A grant the Bot doesn't have is not found.
      security:
        - webSession: []
        - appOAuth:
            - bot-grants:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The Bot no longer has it.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotGrantForbidden'
        '404':
          $ref: '#/components/responses/BotGrantNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
