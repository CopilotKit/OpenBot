          properties:
            progress:
              $ref: '#/components/schemas/UpdateRoute'
            decision:
              $ref: '#/components/schemas/UpdateRoute'
            question:
              $ref: '#/components/schemas/UpdateRoute'
            attention:
              $ref: '#/components/schemas/UpdateRoute'
    BotNotifyLevel:
      type: string
