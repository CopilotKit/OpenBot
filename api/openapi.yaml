        decision:
          $ref: '#/components/schemas/UpdateRoute'
        question:
          $ref: '#/components/schemas/UpdateRoute'
        attention:
          $ref: '#/components/schemas/UpdateRoute'
    NotificationSettings:
      type: object
      description: 'Where a person''s updates go, for every one of their Bots at once. progress: replies and results from work they weren''t watching. decision: approvals a Bot needs before it acts. question: what a Bot asked and waits on. attention: what their Bots'' check-ins found, at most once an hour, every Bot in one message.'
      required:
        - routing
      properties:
        routing:
          $ref: '#/components/schemas/UpdateRouting'
    UpdateNotificationSettingsRequest:
      type: object
