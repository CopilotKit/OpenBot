          type: array
          description: By domain, then by id.
          items:
            $ref: '#/components/schemas/IdentityProvider'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    IdentityProviderResponse:
      type: object
      required:
        - identityProvider
      properties:
        identityProvider:
          $ref: '#/components/schemas/IdentityProvider'
    IdentityProviderText:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[^\x00]*\S[^\x00]*$
    IdentityProviderAddress:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      pattern: ^https?://[^\x00\s]+$
    SamlIdentityProviderRequest:
      type: object
      additionalProperties: false
      required:
        - protocol
        - id
        - domain
        - issuer
        - entryPoint
        - metadata
      properties:
        protocol:
          type: string
          const: saml
        id:
          $ref: '#/components/schemas/NewIdentityProviderId'
        domain:
          $ref: '#/components/schemas/IdentityProviderDomains'
        issuer:
          $ref: '#/components/schemas/IdentityProviderAddress'
        entryPoint:
          $ref: '#/components/schemas/IdentityProviderAddress'
        metadata:
          type: string
          minLength: 1
          maxLength: 200000
          pattern: ^[^\x00]*\S[^\x00]*$
          description: The provider's SAML metadata XML, as its identity team supplied it.
    OidcIdentityProviderRequest:
      type: object
      additionalProperties: false
      required:
        - protocol
        - id
        - domain
        - issuer
        - clientId
        - clientSecret
      properties:
        protocol:
          type: string
          const: oidc
        id:
          $ref: '#/components/schemas/NewIdentityProviderId'
        domain:
          $ref: '#/components/schemas/IdentityProviderDomains'
        issuer:
          $ref: '#/components/schemas/IdentityProviderAddress'
        clientId:
          $ref: '#/components/schemas/IdentityProviderText'
        clientSecret:
          $ref: '#/components/schemas/IdentityProviderText'
    NewIdentityProviderId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[^\x00]*\S[^\x00]*$
      description: An id for the provider, unique in the organization, such as acme-okta.
    IdentityProviderDomains:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[^\x00]*\S[^\x00]*$
      description: The email domain whose people it signs in, such as acme.com. Several are separated by commas.
    CreateIdentityProviderRequest:
      description: A SAML or an OIDC provider, by protocol.
      oneOf:
        - $ref: '#/components/schemas/SamlIdentityProviderRequest'
        - $ref: '#/components/schemas/OidcIdentityProviderRequest'
      discriminator:
        propertyName: protocol
        mapping:
          saml: '#/components/schemas/SamlIdentityProviderRequest'
          oidc: '#/components/schemas/OidcIdentityProviderRequest'
    Deployment:
      type: object
      description: What this OpenBot offers and how people sign in to it.
      required:
        - edition
        - localEvaluation
        - generativeUi
        - selfHostBanner
        - transcription
        - voice
        - durableHistory
        - authProviders
        - ssoConfigured
        - ssoRequired
      properties:
        edition:
          type: string
          enum:
            - team
            - personal
          description: team is OpenBot as an organization runs it; personal is one person on their own machine, with no sign-in and none of the screens that govern other people.
        localEvaluation:
          type: boolean
          description: Whether somebody is trying OpenBot on their own machine, with nobody else able to reach it.
        generativeUi:
          type: boolean
          description: Whether a Bot may answer with an interface it wrote itself.
        selfHostBanner:
          type: boolean
          description: Whether to offer help self-hosting OpenBot.
        transcription:
          type: boolean
          description: Whether a person can dictate a message.
        voice:
          type: boolean
          description: Whether a person can talk to a Bot.
        durableHistory:
          type: boolean
          description: Whether conversations are kept between restarts.
        authProviders:
          type: array
          description: The social sign-ins offered, by id.
          items:
            type: string
            enum:
              - google
              - microsoft
              - okta
        ssoConfigured:
          type: boolean
          description: Whether a company's own identity provider is registered, so an email address can be sent to it. Never which.
        ssoRequired:
          type: boolean
          description: Whether an administrator requires single sign-on; social sign-in then stays only as the configured administrators' way in.
    AllowlistEntry:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[^\x00]*\S[^\x00]*$
    OrganizationSettingValues:
      type: object
      properties:
        ssoRequired:
          type: boolean
          description: Whether people must sign in through the organization's identity provider. The administrators the deployment's configuration names keep social sign-in as their way in.
        actionRecording:
          type: boolean
          description: Whether what Bots do on their computers is recorded, to read in computer actions.
        inactiveComputerDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: Days a Bot computer may sit idle before it is stopped. 0 never stops one.
        modelAllowlist:
          type: object
          additionalProperties: false
          required:
            - enabled
            - models
          properties:
            enabled:
              type: boolean
              description: Whether the list limits anything. Off, every model is allowed.
            models:
              type: array
              maxItems: 500
              description: The models Bots may run on, as provider/model.
              items:
                $ref: '#/components/schemas/AllowlistEntry'
        mcpAllowlist:
          type: object
          additionalProperties: false
          required:
            - enabled
            - servers
          properties:
            enabled:
              type: boolean
              description: Whether the list limits anything. Off, every app is allowed.
            servers:
              type: array
              maxItems: 500
              description: The apps Bots may use, by id.
              items:
                $ref: '#/components/schemas/AllowlistEntry'
        skillSharing:
          type: boolean
          description: Whether people may open the skills learned from their recordings to every Bot.
        proactiveDailyRuns:
          type: integer
          minimum: 1
          maximum: 1440
          description: How many check-ins each Bot may run for one person in a day.
        modelSelection:
          type: boolean
          description: Whether people may pick the model a built-in Bot answers on, per conversation.
    OrganizationSettings:
      allOf:
        - $ref: '#/components/schemas/OrganizationSettingValues'
        - type: object
          required:
            - ssoRequired
            - actionRecording
            - inactiveComputerDays
            - modelAllowlist
            - mcpAllowlist
            - skillSharing
            - proactiveDailyRuns
            - modelSelection
            - context
          properties:
            context:
              $ref: '#/components/schemas/OrganizationSettingsContext'
    OrganizationSettingsContext:
      type: object
      readOnly: true
      description: What an administrator needs to set the settings. Read only.
      required:
        - builtInModel
        - directoryGroups
        - apps
        - defaultDestinations
        - scim
        - otel
        - actionRecordRetentionDays
      properties:
        builtInModel:
          type:
            - string
            - 'null'
          description: The model OpenBot's own Bots run on, when one is set.
        directoryGroups:
          type: array
          description: The directory groups people belong to, by name.
          items:
            type: string
        apps:
          type: array
          description: The apps an allowlist can name.
          items:
            type: object
            required:
              - id
              - title
              - url
            properties:
              id:
                type: string
              title:
                type: string
              url:
                type: string
        defaultDestinations:
          type: array
          description: The package registries and source hosts every computer may reach unless the list is the only thing allowed.
          items:
            type: string
        scim:
          type: object
          required:
            - configured
            - connectionId
            - baseUrl
            - rotating
          properties:
            configured:
              type: boolean
            connectionId:
              type: string
            baseUrl:
              type:
                - string
                - 'null'
            rotating:
              type: boolean
              description: Whether a second token is set while the first is being replaced.
        otel:
          type: object
          required:
            - configured
          properties:
            configured:
              type: boolean
        actionRecordRetentionDays:
          type: integer
          description: How many days recorded computer actions are kept.
    UpdateOrganizationSettingsRequest:
      allOf:
        - $ref: '#/components/schemas/OrganizationSettingValues'
      description: The settings to change. At least one; the rest stay as they are.
      minProperties: 1
    InactiveComputersStopped:
      type: object
      required:
        - stopped
        - skipped
      properties:
        stopped:
          type: array
          description: The Bots whose computers stopped.
          items:
            type: string
        skipped:
          type:
            - string
            - 'null'
          description: Why nothing was stopped, when nothing was looked at.
    PersonComputersStopped:
      type: object
      required:
        - stopped
        - failed
      properties:
        stopped:
          type: array
          description: 'The computers stopped: `person:<id>` for the person''s own, which every Bot they use runs on, and `bot:<id>` for each of their Bots that has a computer of its own.'
          items:
            type: string
        failed:
          type: array
          description: The ones that would not stop, and why.
          items:
            type: object
            required:
              - computer
              - reason
            properties:
              computer:
                type: string
                description: The computer, named as in `stopped`.
              reason:
                type: string
    CapabilityId:
      type: string
      enum:
        - useBots
        - cloudBrowser
        - cloudNetwork
        - cloudComputer
        - localComputer
        - customRules
        - passwordManager
        - slackTeams
        - teamBots
        - ownerApps
        - isolatedComputers
        - proactive
      description: A permission switch.
    Capability:
      type: object
      description: A permission switch, and what each level set it to. Null at a level means it sets nothing and the level beneath decides.
      required:
        - id
        - title
        - description
        - default
        - organization
        - roles
        - groups
      properties:
        id:
          $ref: '#/components/schemas/CapabilityId'
        title:
          type: string
        description:
          type: string
        default:
          type: boolean
          description: What applies where nothing is set.
        organization:
          type:
            - boolean
            - 'null'
        roles:
          type: object
          description: What each member role is set to, by role. A role absent sets nothing.
          properties:
            owner:
              type: boolean
            admin:
              type: boolean
            member:
              type: boolean
        groups:
          type: object
          description: What each directory group is set to, by the group's name. A group absent sets nothing. Team scopes will be added when teams arrive.
          additionalProperties:
            type: boolean
    CapabilityPage:
      type: object
      required:
        - capabilities
        - nextCursor
      properties:
        capabilities:
          type: array
          description: In the order the screens show them.
          items:
            $ref: '#/components/schemas/Capability'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    SwitchValue:
      type:
        - boolean
        - 'null'
      description: On, off, or null to clear it so the level beneath decides.
    UpdateCapabilityRequest:
      type: object
      description: The levels to set or clear. At least one.
      additionalProperties: false
      minProperties: 1
      properties:
        organization:
          $ref: '#/components/schemas/SwitchValue'
        roles:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            admin:
              $ref: '#/components/schemas/SwitchValue'
            member:
              $ref: '#/components/schemas/SwitchValue'
        groups:
          type: object
          minProperties: 1
          maxProperties: 100
          description: By directory group name, 1 to 200 characters. Team scopes will be added when teams arrive.
          propertyNames:
            minLength: 1
            maxLength: 200
            pattern: ^[^\x00]*\S[^\x00]*$
          additionalProperties:
            $ref: '#/components/schemas/SwitchValue'
    CapabilityChange:
      type: object
      additionalProperties: false
      required:
        - scopeKind
        - capability
        - allowed
      properties:
        scopeKind:
          type: string
          enum:
            - organization
            - role
            - group
          description: 'Whose switch: the organization''s, a member role''s, or a directory group''s. Team scopes will be added when teams arrive.'
        scopeId:
          type: string
          maxLength: 200
          pattern: ^[^\x00]*$
          description: Empty for the organization; admin or member for a role; a directory group's name for a group. Team scopes will be added when teams arrive.
        capability:
          $ref: '#/components/schemas/CapabilityId'
        allowed:
          $ref: '#/components/schemas/SwitchValue'
    Authoring:
      type: object
      additionalProperties: false
      required:
        - source
        - text
      description: The sentence in English a change was written from, recorded with it.
      properties:
        source:
          type: string
          const: english
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^[^\x00]*\S[^\x00]*$
    CapabilityChangesToPreview:
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          description: 'Changes to check and preview, as a screen holds them while an admin edits what a description wrote. One that names a permission, role or group that isn''t one is not refused: the answer''s `check` says what is wrong with it.'
          items:
            $ref: '#/components/schemas/CapabilityChangeToCheck'
    CapabilityChangeToCheck:
      type: object
      additionalProperties: false
      required:
        - scopeKind
        - capability
        - allowed
      properties:
        scopeKind:
          type: string
          enum:
            - organization
            - role
            - group
          description: 'Whose switch: the organization''s, a member role''s, or a directory group''s. Team scopes will be added when teams arrive.'
        scopeId:
          type: string
          maxLength: 200
          pattern: ^[^\x00]*$
          description: Empty for the organization; admin or member for a role; a directory group's name for a group. Team scopes will be added when teams arrive.
        capability:
          type: string
          maxLength: 100
          pattern: ^[^\x00]*$
          description: The permission, by its id. One that isn't a permission is named in `check`.
        allowed:
          $ref: '#/components/schemas/SwitchValue'
    CapabilityChanges:
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CapabilityChange'
        authoring:
          $ref: '#/components/schemas/Authoring'
    SavedCapabilityChanges:
      type: object
      required:
        - saved
      properties:
        saved:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityChange'
    ChangeDescription:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: ^[^\x00]*\S[^\x00]*$
          description: The change in a sentence or two, at most 1,000 characters once trimmed.
    RuleCheck:
      type: object
      description: Whether a proposal passes the rule a save applies, and what is wrong when it doesn't.
      required:
        - ok
      properties:
        ok:
          type: boolean
        error:
          type: string
        problems:
          type: array
          items: {}
    CapabilityTranslation:
      type: object
      required:
        - changes
        - summary
        - explanation
        - check
        - warning
      properties:
        changes:
          type: array
          description: The changes the model wrote. When `check.ok` is true each is a valid CapabilityChange; when it is false they are as written, so the admin can see what failed, and `check.problems` says which.
          items:
            $ref: '#/components/schemas/WrittenCapabilityChange'
        summary:
          type:
            - string
            - 'null'
        explanation:
          type:
            - string
            - 'null'
        check:
          $ref: '#/components/schemas/RuleCheck'
        warning:
          type:
            - string
            - 'null'
    WrittenCapabilityChange:
      type: object
      description: A switch change as the model wrote it, before it is checked.
      required:
        - scopeKind
        - scopeId
        - capability
        - allowed
      properties:
        scopeKind:
          type: string
          enum:
            - organization
            - role
            - group
          description: 'Whose switch: the organization''s, a member role''s, or a directory group''s. Team scopes will be added when teams arrive.'
        scopeId:
          type: string
          description: Empty for the organization; admin or member for a role; a directory group's name for a group.
        capability:
          type: string
        allowed:
          $ref: '#/components/schemas/SwitchValue'
    CapabilityAnswer:
      type: object
      required:
        - allowed
        - decidedBy
        - scopeId
      properties:
        allowed:
          type: boolean
        decidedBy:
          type: string
          enum:
            - default
            - organization
            - role
            - group
        scopeId:
          type: string
          description: The role or group that decided it. Empty otherwise.
    CapabilityPreview:
      type: object
      required:
        - check
        - people
        - counts
        - activity
        - warning
      properties:
        check:
          $ref: '#/components/schemas/RuleCheck'
        people:
          type: array
          items:
            type: object
            required:
              - id
              - email
              - name
              - role
              - groups
              - capabilities
            properties:
              id:
                type: string
              email:
                type: string
              name:
                type:
                  - string
                  - 'null'
              role:
                $ref: '#/components/schemas/PersonRole'
              groups:
                type: array
                items:
                  type: string
              capabilities:
                type: array
                items:
                  type: object
                  required:
                    - capability
                    - title
                    - before
                    - after
                  properties:
                    capability:
                      $ref: '#/components/schemas/CapabilityId'
                    title:
                      type: string
                    before:
                      $ref: '#/components/schemas/CapabilityAnswer'
                    after:
                      $ref: '#/components/schemas/CapabilityAnswer'
                    activity:
                      type: object
                      required:
                        - what
                        - count
                        - more
                        - recent
                      properties:
                        what:
                          type: string
                        count:
                          type: integer
                        more:
                          type: boolean
                        recent:
                          type: array
                          items:
                            $ref: '#/components/schemas/AuditEvent'
        counts:
          type: object
          required:
            - people
            - losing
            - gaining
            - keeping
            - unchanged
          properties:
            people:
              type: integer
            losing:
              type: integer
            gaining:
              type: integer
            keeping:
              type: integer
            unchanged:
              type: integer
        activity:
          type: object
          required:
            - days
            - unmapped
          properties:
            days:
              type: integer
            unmapped:
              type: array
              items:
                type: object
                required:
                  - capability
                  - title
                properties:
                  capability:
                    $ref: '#/components/schemas/CapabilityId'
                  title:
                    type: string
        warning:
          type:
            - string
            - 'null'
    PersonCapabilities:
      type: object
      required:
        - capabilities
        - enforced
      properties:
        capabilities:
          type: object
          description: Each switch, on or off for this person.
          additionalProperties:
            type: boolean
        enforced:
          type: boolean
          description: False where the deployment keeps no switches and every default applies.
    NetworkMode:
      type: string
      enum:
        - allow_all
        - defaults_plus_allowlist
        - allowlist_only
      description: allow_all lets computers connect anywhere; defaults_plus_allowlist to the list and the default destinations; allowlist_only to the list alone.
    EgressRule:
      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - domain
            - cidr
        value:
          type: string
          minLength: 1
          maxLength: 253
          description: A host, which covers its subdomains, or an IP range in CIDR form.
        ports:
          type: string
          maxLength: 100
          description: Ports, such as 443 or 8000-8100, separated by commas. Absent is every port.
    WrittenEgressRule:
      type: object
      description: An allowlist entry as the model wrote it, before it is parsed.
      required:
        - type
        - value
      properties:
        type:
          type: string
        value:
          type: string
        ports:
          type: string
    NetworkPolicy:
      type: object
      required:
        - id
        - scopeKind
        - scopeId
        - mode
        - rules
        - locked
        - updatedBy
        - updatedAt
      properties:
        id:
          type: string
          description: organization, or group:<name> for a directory group. Team scopes will be added when teams arrive.
        scopeKind:
          type: string
          enum:
            - organization
            - group
          description: 'Whose policy: the organization''s, or a directory group''s. Team scopes will be added when teams arrive.'
        scopeId:
          type: string
          description: The directory group's name. Empty for the organization.
        mode:
          $ref: '#/components/schemas/NetworkMode'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/EgressRule'
        locked:
          type: boolean
          description: For the organization's, whether it applies to every group too.
        updatedBy:
          type:
            - string
            - 'null'
        updatedAt:
          type: string
          format: date-time
    NetworkPolicyPage:
      type: object
      required:
        - networkPolicies
        - nextCursor
      properties:
        networkPolicies:
          type: array
          description: The organization's first, then each group's by name.
          items:
            $ref: '#/components/schemas/NetworkPolicy'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    NetworkPolicyInput:
      type: object
      additionalProperties: false
      required:
        - mode
        - rules
      properties:
        mode:
          $ref: '#/components/schemas/NetworkMode'
        rules:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/EgressRule'
        locked:
          type: boolean
          default: false
        authoring:
          $ref: '#/components/schemas/Authoring'
    NetworkPolicyCandidate:
      type: object
      additionalProperties: false
      required:
        - scopeKind
        - mode
        - rules
      properties:
        scopeKind:
          type: string
          enum:
            - organization
            - group
          description: 'Whose policy: the organization''s, or a directory group''s. Team scopes will be added when teams arrive.'
        scopeId:
          type: string
          maxLength: 200
          pattern: ^[^\x00]*$
          description: The directory group's name. Empty for the organization.
        mode:
          $ref: '#/components/schemas/NetworkMode'
        rules:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/EgressRule'
        locked:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 2000
          description: How many recent page visits to test against. 500 when absent.
    NetworkTranslation:
      type: object
      required:
        - mode
        - rules
        - summary
        - reachable
        - explanation
        - check
        - warning
      properties:
        mode:
          type: string
          enum:
            - allowlist_only
            - defaults_plus_allowlist
        rules:
          type: array
          description: The entries. Parsed and tidied when `check.ok` is true, each then a valid EgressRule; as the model wrote them when it is false, so the admin can see and fix what failed.
          items:
            $ref: '#/components/schemas/WrittenEgressRule'
        summary:
          type:
            - string
            - 'null'
        reachable:
          type: array
          description: What becomes reachable, one line per service.
          items:
            type: string
        explanation:
          type:
            - string
            - 'null'
        check:
          $ref: '#/components/schemas/RuleCheck'
        warning:
          type:
            - string
            - 'null'
    NetworkReplayReport:
      type: object
      required:
        - scanned
        - covered
        - wouldBlock
        - wouldAllow
        - undecided
        - unchanged
        - hosts
        - sites
      properties:
        scanned:
          type: integer
        covered:
          type: integer
        wouldBlock:
          type: integer
        wouldAllow:
          type: integer
        undecided:
          type: integer
        unchanged:
          type: integer
        hosts:
          type: array
          items:
            type: object
            required:
              - host
              - change
              - visits
              - bots
              - lastVisit
            properties:
              host:
                type: string
              change:
                type: string
                enum:
                  - block
                  - allow
              visits:
                type: integer
              bots:
                type: array
                items:
                  type: string
              lastVisit:
                type: string
        sites:
          type: integer
    ModelUsage:
      type: object
      required:
        - days
        - summary
        - recent
      properties:
        days:
          type: integer
        summary:
          type: array
          items:
            type: object
            required:
              - model
              - source
              - runs
              - refused
              - people
              - lastUsedAt
            properties:
              model:
                type: string
              source:
                type: string
              runs:
                type: integer
              refused:
                type: integer
              people:
                type: integer
              lastUsedAt:
                type: string
                format: date-time
        recent:
          type: array
          description: The newest 50 runs.
          items:
            type: object
            required:
              - id
              - email
              - agentId
              - model
              - source
              - allowed
              - createdAt
            properties:
              id:
                type: string
              email:
                type:
                  - string
                  - 'null'
              agentId:
                type: string
              model:
                type: string
              source:
                type: string
              allowed:
                type: boolean
              createdAt:
                type: string
                format: date-time
    ComputerAction:
      type: object
      required:
        - id
        - surface
        - botId
        - toolName
        - command
        - outcome
        - createdAt
      properties:
        id:
          type: string
        surface:
          type: string
          enum:
            - cloud
            - local
        botId:
          type:
            - string
            - 'null'
        toolName:
          type: string
        command:
          type: string
        outcome:
          type: string
        createdAt:
          type: string
          format: date-time
    ComputerActionPage:
      type: object
      required:
        - computerActions
        - nextCursor
      properties:
        computerActions:
          type: array
          description: Newest first, then by id.
          items:
            $ref: '#/components/schemas/ComputerAction'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    SetupChecklist:
      type: object
      required:
        - audience
        - rows
      properties:
        audience:
          type: string
          enum:
            - admin
            - member
          description: Who the checklist was written for.
        rows:
          type: array
          items:
            type: object
            required:
              - id
              - scope
              - title
              - required
              - status
              - ready
              - detail
              - fix
            properties:
              id:
                type: string
                enum:
                  - intelligence
                  - model
                  - computer
                  - apps
                  - chat
              scope:
                type: string
                const: deployment
              title:
                type: string
              required:
                type: boolean
              status:
                type: string
                enum:
                  - ready
                  - needs_setup
                  - not_checked
              ready:
                type: boolean
              detail:
                type: string
              fix:
                oneOf:
                  - type: object
                    required:
                      - kind
                      - names
                      - docsUrl
                    properties:
                      kind:
                        type: string
                        const: env
                      names:
                        type: array
                        items:
                          type: string
                      docsUrl:
                        type: string
                      page:
                        type: object
                        required:
                          - label
                          - path
                        properties:
                          label:
                            type: string
                          path:
                            type: string
                  - type: object
                    required:
                      - kind
                      - label
                      - path
                    properties:
                      kind:
                        type: string
                        const: page
                      label:
                        type: string
                      path:
                        type: string
                      docsUrl:
                        type: string
                  - type: 'null'
    Problem:
      type: object
      description: RFC 9457 problem details, in the shape CopilotKit Intelligence's v2 API uses. status equals the HTTP status; code and type name the same stable error. detail is the sentence a person reads.
      required:
        - type
        - title
        - status
        - detail
        - code
        - category
        - retryable
        - requestId
        - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
        category:
          type: string
          enum:
            - validation
            - auth
            - permission
            - not_found
            - conflict
            - rate_limit
            - internal
            - dependency
        retryable:
          type: boolean
        requestId:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        capability:
          type: string
          description: The switch an administrator can turn on for this person, when the refusal is for want of one (isolatedComputers).
        appId:
          type: string
          minLength: 1
          description: The app the refusal is about, when it names one that is already here (APP_ALREADY_ADDED), so a client can open it.
        problems:
          type: array
          description: 'What is wrong, item by item, when a refusal has more than one reason: each entry names the item and says what is wrong with it.'
          items:
            type: object
    ConversationJoinToken:
      type: object
      description: 'What a client needs to watch a conversation live: a token, and the socket and topic to use it on (the threadStream channel of api/asyncapi.yaml).'
      required:
        - joinToken
        - expiresAt
        - threadId
        - runId
        - realtime
      properties:
        joinToken:
          type: string
          minLength: 1
          description: Sent as the join_token query parameter when opening the socket. It works once.
        expiresAt:
          type: string
          format: date-time
          description: After this the token no longer opens a socket. A socket it already opened stays open.
        threadId:
          type: string
          minLength: 1
          description: The conversation's thread, as the caller sees it.
        runId:
          type:
            - string
            - 'null'
          description: The run in progress in the thread, or null when the Bot is not working.
        realtime:
          type: object
          description: Where to use the token.
          required:
            - clientUrl
            - topic
          properties:
            clientUrl:
              type: string
              minLength: 1
              description: The socket's address, without the /websocket it ends in or its query. A ws or wss address, or a path on this server.
            topic:
              type: string
              pattern: ^thread:.+$
              description: The topic to join on the socket, thread:{threadId}.
    CredentialKind:
      type: string
      description: 'What a credential is for. model: a key OpenBot''s Bots call a model with. connector: an app''s key. mcp: a token for an app''s server. agent: a key for a company''s own agent. mcp_oauth_client: the organization''s registration with an app. mcp_user_token: one person''s sign-in to an app, kept when they connected it.'
      enum:
        - model
        - connector
        - agent
        - mcp
        - mcp_oauth_client
        - mcp_user_token
    Credential:
      type: object
      description: 'A credential in the vault as the API shows it: what it is for and whether it is live. Never its secret, which only ever goes in.'
      required:
        - id
        - kind
        - provider
        - keyId
        - metadata
        - createdAt
        - revokedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CredentialKind'
        provider:
          type: string
          description: 'Who the secret is for: a model provider such as openai, an app, or an app''s server.'
        keyId:
          type: string
          description: The name it is kept under. A key holds one live credential at a time.
        metadata:
          type: object
          additionalProperties: true
          description: What was said about it when it was added. Never secret.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was revoked. Null while it is live.
    CredentialPage:
      type: object
      required:
        - credentials
        - nextCursor
      properties:
        credentials:
          type: array
          description: Oldest first, and by id among credentials added at the same moment.
          items:
            $ref: '#/components/schemas/Credential'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    CredentialInput:
      type: object
      additionalProperties: false
      required:
        - kind
        - provider
        - secret
      properties:
        kind:
          type: string
          description: 'model, connector or mcp. The other kinds are written by what they belong to: an app''s registration when it is added, a person''s sign-in when they connect it.'
          enum:
            - model
            - connector
            - mcp
        provider:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: 'Who the secret is for: for a model key, the provider the Bots run on (getModelKey). Trimmed.'
        keyId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The name to keep it under. Required, except for a model key, which is filed under the name the Bots read (getModelKey). Trimmed.
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 1000
          description: What to say about it. Never secret. Empty when left out.
        secret:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: 'The secret itself. Encrypted before it is kept, and never sent back: no answer includes it, now or later.'
    ModelKey:
      type: object
      description: Where OpenBot's own Bots find their model key in the vault, and whether one is kept there. Never the key.
      required:
        - provider
        - keyId
        - set
      properties:
        provider:
          type: string
          enum:
            - openai
            - anthropic
          description: The provider the Bots run on.
        keyId:
          type: string
          description: The name the key is kept under.
        set:
          type: boolean
          description: Whether a live model key is kept under that name.
    ModelOption:
      type: object
      description: One model a Bot can run on.
      required:
        - id
        - label
      properties:
        id:
          type: string
          description: What a run sends upstream.
        label:
          type: string
          description: What a model picker shows.
        vendor:
          type: string
          description: Who makes it, as a brand id such as openai or anthropic. Absent for a gateway's own alias, which names no maker.
        efforts:
          type: array
          description: How hard it can be asked to think, weakest first, such as none, minimal, low, medium, high, xhigh and max. Absent when it takes no effort, or nothing says which it takes.
          items:
            type: string
        defaultEffort:
          type: string
          description: The effort it thinks at when none is sent, when its provider says.
    ModelCatalogue:
      type: object
      description: The models Bots can run on, and which one a run uses by default.
      required:
        - provider
        - source
        - exposure
        - default
        - models
        - choosable
        - listed
      properties:
        provider:
          type: string
          enum:
            - openai
            - anthropic
          description: 'The provider prefix the model allowlist names models with (provider/model). Not who serves the models: that is source.'
        source:
          type: string
          enum:
            - openai
            - anthropic
            - google
            - xai
            - gateway
            - chatgpt
            - claude
          description: 'Who serves the models: a provider''s own API, an OpenAI-compatible gateway in front of one, or a ChatGPT or Claude plan.'
        exposure:
          type: string
          enum:
            - all
            - allowed
          description: 'Who decides what people may pick. all: one person on their own machine, offered every model listed. allowed: a team, offered the models an administrator allowed.'
        default:
          type: string
          description: What a run uses when nobody picked. Always one of models.
        models:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/ModelOption'
        choosable:
          type: boolean
          description: Whether people have anything to pick. False until an administrator allows a model in a team, or while the listing can't be read.
        listed:
          type: boolean
          description: Whether the listing was read. False means only the deployment's own model is known.
    ModelChoice:
      type: object
      description: 'The model and thinking effort a person chose for one conversation. Null model: the default model. Null effort: none is sent, so the model thinks on its own default.'
      required:
        - model
        - effort
      properties:
        model:
          type:
            - string
            - 'null'
        effort:
          type:
            - string
            - 'null'
    ModelChoiceInput:
      type: object
      additionalProperties: false
      required:
        - model
        - effort
      properties:
        model:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 500
          pattern: \S
          description: A model the catalogue offers, or null for the default. Trimmed.
        effort:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 40
          pattern: \S
          description: An effort the model takes, or null for its own. Trimmed, and read in lower case.
    SharedAccountApproval:
      type: object
      additionalProperties: false
      description: 'Who may have a Bot use an app''s one shared account, approved by an administrator: only the Bot''s owner, named people and directory groups, or everybody; and whether the Bot may act on what people outside the organization send it.'
      required:
        - audience
        - outsideInput
        - members
      properties:
        audience:
          type: string
          enum:
            - owner
            - people
            - team
        outsideInput:
          type: boolean
        members:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
              - kind
              - value
            properties:
              kind:
                type: string
                enum:
                  - user
                  - group
              value:
                type: string
                minLength: 1
                maxLength: 320
                pattern: \S
    AppSource:
      type: string
      enum:
        - catalogue
        - address
        - directory
      description: 'How the app was added: from OpenBot''s own catalogue, as a server at an address somebody typed, or from the wider app directory.'
    AppConnectsWith:
      type: string
      enum:
        - sign-in
        - key
        - nothing
        - unreadable
      description: 'How a person connects an app from the directory: by signing in at the app, by typing a key, or with nothing at all. unreadable when OpenBot can''t tell from what it recorded when the app was added.'
    AppAccountMode:
      type: string
      enum:
        - personal
        - shared
      description: Each person's own account, or one account OpenBot holds for everybody.
    AppOwnerGrants:
      type: string
      enum:
        - any
        - admin
      description: 'Who may give the app to a Bot: any Bot''s owner, for their own Bot, or only an administrator.'
    AppTool:
      type: object
      description: One action an app offers.
      required:
        - name
        - ref
        - description
        - effect
        - destructive
        - grantedTo
      properties:
        name:
          type: string
          description: The action's name, as the app lists it.
        ref:
          type: string
          description: The app's id and the action's name, joined by a slash. What a Bot is given.
        description:
          type: string
          description: What the app says the action does.
        effect:
          type: string
          enum:
            - read
            - write
          description: Whether the action only reads or may change something. Anything not known to be a read is a write.
        destructive:
          type: boolean
          description: Whether the app warns that the action deletes or destroys something. False means the app made no such claim.
        grantedTo:
          type: array
          description: The ids of the Bots that may use the action.
          items:
            type: string
    AppWithdrawnGrant:
      type: object
      description: An action Bots were given that the app no longer offers. No Bot can use it while the app doesn't offer it, and it comes back if the app offers it again.
      required:
        - ref
        - name
        - grantedTo
      properties:
        ref:
          type: string
          description: The app's id and the action's name, joined by a slash.
        name:
          type: string
          description: The action's name.
        grantedTo:
          type: array
          description: The ids of the Bots that were given it.
          items:
            type: string
    App:
      type: object
      description: 'An app this OpenBot has added for its Bots, with the actions it offers. No secret is ever part of an app: hasCredential says whether a key or client is kept for it.'
      required:
        - id
        - title
        - source
        - directoryEntryId
        - address
        - logo
        - vendor
        - summary
        - docsUrl
        - connectsWith
        - hasCredential
        - dynamicClient
        - signIn
        - entraScope
        - accountMode
        - sharedAccountConnected
        - sharedOnly
        - ownerGrants
        - ownerGrantsChosen
        - addedBy
        - toolsRefreshedAt
        - lastError
        - skippedTools
        - tools
        - withdrawn
      properties:
        id:
          type: string
          description: 'The app''s id: a catalogue entry''s key, the id a server was given when it was added by its address, or the id an app from the directory was given when it was added.'
        title:
          type: string
          description: The app's name, as people see it.
        source:
          $ref: '#/components/schemas/AppSource'
        directoryEntryId:
          type:
            - string
            - 'null'
          description: The listAppDirectory entry the app was added from, or null for a server added by its address.
        address:
          type:
            - string
            - 'null'
          description: The server's address, or null for an app from the directory, which OpenBot reaches through the directory's own service.
        logo:
          type:
            - string
            - 'null'
          description: The address of the app's logo, where it has one.
        vendor:
          type:
            - string
            - 'null'
          description: Who makes the app, or the host a server was added at. Null for an app from the directory.
        summary:
          type: string
          description: What the app is for, from the catalogue. Empty for any other app.
        docsUrl:
          type: string
          description: The vendor's documentation, from the catalogue. Empty for any other app.
        connectsWith:
          oneOf:
            - $ref: '#/components/schemas/AppConnectsWith'
            - type: 'null'
          description: How a person connects an app from the directory, or null for any other app.
        hasCredential:
          type: boolean
          description: Whether a key or an OAuth client is kept for the app.
        dynamicClient:
          type: boolean
          description: Whether OpenBot registers its own OAuth client with the app's vendor, so an administrator has none to set (setAppOAuthClient).
        signIn:
          type: boolean
          description: Whether a server added by its address signs each person in, so each person connects their own account and every action runs as them.
        entraScope:
          type:
            - string
            - 'null'
          description: The Microsoft Entra ID scope a server is reached with as the signed-in person, or null when it is reached with its own key.
        accountMode:
          oneOf:
            - $ref: '#/components/schemas/AppAccountMode'
            - type: 'null'
          description: 'Whose account an app from the directory acts in: each person''s own, or one account OpenBot holds for everybody. Null for an app with no account at all, and for any other app.'
        sharedAccountConnected:
          type: boolean
          description: Whether a shared app's one account is connected. False for any other app.
        sharedOnly:
          type: boolean
          description: Whether the app can only hold one shared account and never a person's own, because it connects with this OpenBot's own client.
        ownerGrants:
          $ref: '#/components/schemas/AppOwnerGrants'
        ownerGrantsChosen:
          oneOf:
            - $ref: '#/components/schemas/AppOwnerGrants'
            - type: 'null'
          description: What an administrator chose for ownerGrants, or null where the default for the app's account applies.
        addedBy:
          type:
            - string
            - 'null'
          description: The email address of whoever added the app, where OpenBot knows it.
        toolsRefreshedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When OpenBot last recorded what the app offers.
        lastError:
          type:
            - string
            - 'null'
          description: Why OpenBot couldn't last ask the app what it offers, or null.
        skippedTools:
          type: array
          description: Actions the app listed that a model can't be offered, because of their names. The rest were recorded.
          items:
            type: string
        tools:
          type: array
          description: The actions the app offers, by name.
          items:
            $ref: '#/components/schemas/AppTool'
        withdrawn:
          type: array
          description: Actions Bots were given that the app no longer offers. Empty for a healthy app.
          items:
            $ref: '#/components/schemas/AppWithdrawnGrant'
    AppPage:
      type: object
      required:
        - apps
        - nextCursor
      properties:
        apps:
          type: array
          description: By title, then by id.
          items:
            $ref: '#/components/schemas/App'
    DevicePlatform:
      type: string
      enum:
        - ios
        - android
      description: The phone's operating system.
    Device:
      type: object
      description: A phone that gets push notifications for the person, from every one of their Bots. Never its push token.
      required:
        - id
        - platform
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: The id the OpenBot app made for the phone.
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        createdAt:
          type: string
          format: date-time
          description: When OpenBot first registered the phone.
    DevicePage:
      type: object
      required:
        - devices
        - nextCursor
      properties:
        devices:
          type: array
          description: The first registered first, then by id.
          items:
            $ref: '#/components/schemas/Device'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    AddAppFromDirectory:
      type: object
      additionalProperties: false
      description: An entry of listAppDirectory. instanceHost and credentialId are for a catalogue entry only.
      required:
        - from
        - directoryEntryId
      properties:
        from:
          type: string
          const: directory
        directoryEntryId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^(catalogue|directory):\S
          description: The entry's id, as listAppDirectory answers it.
        instanceHost:
          type: string
          minLength: 1
          maxLength: 253
          pattern: \S
          description: The host of the organization's own instance, for a vendor that gives every customer one (perInstance). Checked against the hosts that vendor uses.
        credentialId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The vault credential (createCredential) the app is reached with, for a catalogue entry reached with a key.
    AddAppByAddress:
      type: object
      additionalProperties: false
      description: A server added by its address.
      required:
        - from
        - title
        - url
      properties:
        from:
          type: string
          const: address
        title:
          type: string
          minLength: 1
          maxLength: 60
          pattern: \S
          description: What people will call the server, 1 to 60 characters once trimmed. Its id is made from it.
        url:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: \S
          description: The server's public HTTPS address, with no key in it. Trimmed. An address on a private network, or over plain HTTP, is refused.
        token:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: \S
          description: The key the server is reached with, kept in the vault and never answered. Only an administrator may give one.
    CreateAppRequest:
      description: An entry of the app directory, or a server by its address.
      oneOf:
        - $ref: '#/components/schemas/AddAppFromDirectory'
        - $ref: '#/components/schemas/AddAppByAddress'
      discriminator:
        propertyName: from
        mapping:
          directory: '#/components/schemas/AddAppFromDirectory'
          address: '#/components/schemas/AddAppByAddress'
    ReplaceAppRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - url
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: What people will call the server. Trimmed.
        url:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: \S
          description: The server's HTTPS address, with no key in it. Trimmed. An address on a private network, or over plain HTTP, is refused.
        credentialId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The vault credential (createCredential) the server is reached with.
        entraScope:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^\S+$
          description: One Microsoft Entra ID scope, such as api://hr-api/.default, to reach the server with as the signed-in person. It needs Microsoft sign-in set up, and takes no credentialId. Null reaches the server with its credential again; absent keeps what the server has.
    UpdateAppRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The changes to make. At least one.
      properties:
        ownerGrants:
          oneOf:
            - $ref: '#/components/schemas/AppOwnerGrants'
            - type: 'null'
          description: Who may give the app to a Bot, or null for the default for its account.
    AppAccountModeRequest:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/AppAccountMode'
        approvals:
          type: object
          maxProperties: 500
          description: 'For switching to shared: the approval each Bot gets, by the Bot''s id. A Bot not named gets its default.'
          propertyNames:
            minLength: 1
            maxLength: 200
            pattern: \S
          additionalProperties:
            $ref: '#/components/schemas/SharedAccountApproval'
        validateOnly:
          type: boolean
          default: false
          description: Change nothing, and answer what the switch would do.
    AppAccountModeChange:
      type: object
      required:
        - mode
        - applied
        - accountsEnded
        - bots
      properties:
        mode:
          $ref: '#/components/schemas/AppAccountMode'
        applied:
          type: boolean
          description: Whether the switch was made. False for validateOnly.
        accountsEnded:
          type: object
          description: The accounts the switch ended, or would end.
          required:
            - holder
            - count
          properties:
            holder:
              type: string
              enum:
                - person
                - deployment
              description: 'Whose accounts they are: people''s own (person), or the one OpenBot holds for everybody (deployment).'
            count:
              type: integer
              minimum: 0
        bots:
          type: array
          description: 'For switching to shared: each Bot that uses the app, and the approval it gets, or would get. Empty for switching to personal.'
          items:
            type: object
            required:
              - botId
              - approval
            properties:
              botId:
                type: string
              approval:
                $ref: '#/components/schemas/SharedAccountApproval'
    AppOAuthClientRequest:
      type: object
      additionalProperties: false
      required:
        - clientId
        - clientSecret
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
          description: The client's id, as the vendor issued it. Trimmed.
        clientSecret:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: \S
          writeOnly: true
          description: The client's secret. Kept in the vault and never answered. Trimmed.
    AppDirectorySource:
      type: string
      enum:
        - catalogue
        - directory
      description: OpenBot's own catalogue, or the wider app directory.
    CatalogueAppEntry:
      type: object
      description: An app in OpenBot's own catalogue.
      required:
        - id
        - source
        - title
        - summary
        - appId
        - vendor
        - docsUrl
        - auth
        - perInstance
        - oneStep
      properties:
        id:
          type: string
          description: The entry's id, for createApp.
        source:
          type: string
          const: catalogue
        title:
          type: string
        summary:
          type: string
          description: What the app is for.
        appId:
          type:
            - string
            - 'null'
          description: The app it was added as, or null.
        vendor:
          type: string
          description: Who makes the app.
        docsUrl:
          type: string
          description: The vendor's documentation.
        auth:
          type: string
          enum:
            - none
            - deployment-bearer
            - user-oauth
            - builtin
          description: 'How the app is reached: needing nothing, with a key an administrator gives for everybody, as each person through their own sign-in, or inside OpenBot itself.'
        perInstance:
          type: boolean
          description: Whether the vendor gives every customer their own host (instanceHost).
        oneStep:
          type: boolean
          description: 'Whether connecting needs nothing typed first: no account at all, or a vendor OpenBot registers itself with.'
    DirectoryAppEntry:
      type: object
      description: An app from the wider app directory.
      required:
        - id
        - source
        - title
        - summary
        - appId
        - logo
        - categories
        - actionCount
        - classifiedCount
        - permissionCount
        - scopedActionCount
        - connectsWith
      properties:
        id:
          type: string
          description: The entry's id, for createApp.
        source:
          type: string
          const: directory
        title:
          type: string
        summary:
          type: string
          description: What the directory says the app does.
        appId:
          type:
            - string
            - 'null'
          description: The app it was added as, or null.
        logo:
          type:
            - string
            - 'null'
          description: The address of the app's logo, where it has one.
        categories:
          type: array
          items:
            type: string
        actionCount:
          type: integer
          minimum: 0
          description: How many actions the app offers. Adding it offers every one of them to Bots.
        classifiedCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: How many of those actions say whether they only read. 0 means none do, so each is asked about like a change. Null means the directory doesn't say.
        permissionCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: How many separate permissions the actions ask a person for. Null means the directory doesn't say.
        scopedActionCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: How many actions ask for a permission at all. The rest work with any connection. Null means the directory doesn't say.
        connectsWith:
          type: string
          enum:
            - sign-in
            - key
            - nothing
          description: How a person connects the app once it is added.
    AppDirectoryEntry:
      description: One app that can be added, by where it comes from.
      oneOf:
        - $ref: '#/components/schemas/CatalogueAppEntry'
        - $ref: '#/components/schemas/DirectoryAppEntry'
      discriminator:
        propertyName: source
        mapping:
          catalogue: '#/components/schemas/CatalogueAppEntry'
          directory: '#/components/schemas/DirectoryAppEntry'
    AppDirectoryPage:
      type: object
      required:
        - entries
        - nextCursor
      properties:
        entries:
          type: array
          description: The catalogue, then the wider directory, each by title and then by id.
          items:
            $ref: '#/components/schemas/AppDirectoryEntry'
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - projectId
        - platform
      properties:
        token:
          type: string
          maxLength: 256
          pattern: ^(Expo|Exponent)PushToken\[[A-Za-z0-9_-]+\]$
          description: 'The phone''s Expo push token, as the OpenBot app read it when it started. It is a credential: OpenBot never sends it back.'
        projectId:
          type: string
          format: uuid
          description: The OpenBot app's project, which must be the one this deployment sends push notifications through.
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    DeviceResponse:
      type: object
      required:
        - device
      properties:
        device:
          $ref: '#/components/schemas/Device'
    DestinationTransport:
      type: string
      enum:
        - slack
        - teams
        - sms
      description: Slack, Microsoft Teams, or text messages.
    Destination:
      type: object
      description: 'Somewhere outside OpenBot a person continues one conversation with one Bot: a Slack or Microsoft Teams chat, or a phone number.'
      required:
        - id
        - transport
        - conversationId
        - botId
        - address
        - optedOutAt
        - createdAt
      properties:
        id:
          type: string
          description: The destination's id.
        transport:
          $ref: '#/components/schemas/DestinationTransport'
        conversationId:
          type: string
          description: The conversation it continues.
        botId:
          type: string
          description: The Bot that answers there.
        address:
          type: string
          description: 'Where the Bot sends: the phone number for text messages, or the chat''s own id in Slack or Teams.'
        optedOutAt:
          type:
            - string
            - 'null'
          format: date-time
          description: 'Text messages only: when the person texted STOP. Nothing is texted until they text START. Null while they can be texted.'
        createdAt:
          type: string
          format: date-time
          description: When it was connected.
    DestinationPage:
      type: object
      required:
        - destinations
        - nextCursor
      properties:
        destinations:
          type: array
          description: The first connected first, then by id.
          items:
            $ref: '#/components/schemas/Destination'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    AppSetup:
      type: object
      description: How apps are set up on this OpenBot. Never a key.
      required:
        - directoryAvailable
        - directoryProvider
        - redirectUri
        - authorizesPerAction
        - botsMayCallBack
      properties:
        directoryAvailable:
          type: boolean
          description: Whether apps from the wider directory can be listed and added here.
        directoryProvider:
          type:
            - string
            - 'null'
          enum:
            - composio
            - arcade
            - null
          description: The service the app directory comes from. The screens read it to open their own page for the directory and to name the setting an administrator sets to turn it on. Null when this OpenBot names none.
        redirectUri:
          type:
            - string
            - 'null'
          description: The address to register with a vendor for an OAuth client (setAppOAuthClient), exactly as OpenBot sends it. Null when this OpenBot has no public address, so nobody can sign in to an app through it.
        authorizesPerAction:
          type: boolean
          description: Whether a connection is approved one action at a time, so a person approves each action the first time a Bot uses it.
        botsMayCallBack:
          type: boolean
          description: Whether a Bot with no key of its own can still use an app's actions. Without it, only a Bot that holds its own key can.
    ShortenedToolNames:
      type: object
      required:
        - names
      properties:
        names:
          type: object
          description: Each shortened name, with the whole name it stands for.
          propertyNames:
            maxLength: 64
          additionalProperties:
            type: string
    ConnectionCheckState:
      type: object
      description: What the last check of a connection found, and whether it can be checked now.
      required:
        - verified
        - verifiedAt
        - checkedAction
        - checkable
      properties:
        verified:
          type: boolean
          description: Whether the last check made a real call with the connection, and it worked.
        verifiedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When verified was last earned. Null when it never was.
        checkedAction:
          type:
            - string
            - 'null'
          description: The action the last check called. Null when nothing was tried, because the app offered nothing safe to call.
        checkable:
          type: boolean
          description: Whether the app offers a safe action to check the connection with now, as recheckConnection does.
    Connection:
      type: object
      description: 'A person''s connection to an app: their own account there, which their Bots act as. Never the credential behind it.'
      required:
        - appId
        - connectedAt
        - revoked
        - scope
        - check
        - canAddAccount
      properties:
        appId:
          type: string
          description: The app, as listApps answers it.
        connectedAt:
          type: string
          format: date-time
          description: When the person first connected it.
        revoked:
          type: boolean
          description: Whether the access behind it was withdrawn. A revoked connection can't be used until the person connects again.
        scope:
          type:
            - string
            - 'null'
          description: What the app granted, in its own words, where OpenBot keeps the sign-in itself. Null where the app keeps it.
        check:
          description: The last check of the connection with the app. Null where OpenBot keeps the sign-in itself, which leaves nothing to check.
          oneOf:
            - $ref: '#/components/schemas/ConnectionCheckState'
            - type: 'null'
        canAddAccount:
          type: boolean
          description: Whether the person can connect a second account at this app beside this one, with connectApp's anotherAccount.
    ConnectionPage:
      type: object
      required:
        - connections
        - nextCursor
      properties:
        connections:
          type: array
          description: The oldest connection first, then by app id.
          items:
            $ref: '#/components/schemas/Connection'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    ConnectionReturnTo:
      type: string
      enum:
        - connections
        - apps
        - desktop
      default: connections
      description: 'Which of OpenBot''s own pages the app sends the person back to: connections, the person''s own page for the app; apps, the app''s page for administrators; desktop, back to OpenBot Desktop. Never an address.'
    ConnectionValues:
      type: object
      description: What the person typed into the boxes a form answer asked for, by each box's name. Sent once to the app and never logged or kept here.
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 16384
    ConnectAppRequest:
      type: object
      additionalProperties: false
      properties:
        returnTo:
          $ref: '#/components/schemas/ConnectionReturnTo'
        anotherAccount:
          type: boolean
          default: false
          description: Connect a second account at the app beside the one connected already, such as a work mailbox beside a personal one. Without it, connecting again asks for more permissions on the same account.
        values:
          $ref: '#/components/schemas/ConnectionValues'
    ConnectionConsent:
      type: object
      description: The app's own sign-in page, which sends the person back to OpenBot once they agree.
      required:
        - next
        - authorizationUrl
      properties:
        next:
          type: string
          const: consent
        authorizationUrl:
          type: string
          format: uri
          description: The address to open. Works once, for this person only.
    ConnectionField:
      type: object
      description: One box an app that takes a key asks for, as the app describes it.
      required:
        - name
        - label
        - help
        - required
        - secret
        - default
      properties:
        name:
          type: string
          description: The name to send it back under, in values. Not shown to the person.
        label:
          type: string
          description: The box's label.
        help:
          type: string
          description: What to put in it, written for the person filling it in.
        required:
          type: boolean
        secret:
          type: boolean
          description: Whether to hide what is typed, as for a password.
        default:
          type:
            - string
            - 'null'
          description: What the box starts with. Null for nothing.
    ConnectionKeyGuide:
      type: object
      description: Where the person gets the key an app asks for.
      required:
        - steps
        - url
      properties:
        steps:
          type: string
          description: What to do at the app, in a sentence or two.
        url:
          type:
            - string
            - 'null'
          format: uri
          description: The app's own page for making the key. Null where there is none.
    ConnectionForm:
      type: object
      description: The boxes an app that takes a key asks for. Send what the person types back to the same operation as values.
      required:
        - next
        - fields
        - guide
      properties:
        next:
          type: string
          const: form
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionField'
        guide:
          description: Where the person gets the key. Null where OpenBot has no guide for this app.
          oneOf:
            - $ref: '#/components/schemas/ConnectionKeyGuide'
            - type: 'null'
    ConnectionMade:
      type: object
      description: The account is connected, with nothing more for the person to do.
      required:
        - next
        - verified
        - checkedAction
      properties:
        next:
          type: string
          const: connected
        verified:
          type:
            - boolean
            - 'null'
          description: For a key, whether a real call with it worked. Null where the account was already connected at the app and nothing was checked.
        checkedAction:
          type:
            - string
            - 'null'
          description: The action the check called. Null when nothing was tried.
    ConnectionStart:
      description: What happens next, after starting to connect an app.
      oneOf:
        - $ref: '#/components/schemas/ConnectionConsent'
        - $ref: '#/components/schemas/ConnectionForm'
        - $ref: '#/components/schemas/ConnectionMade'
      discriminator:
        propertyName: next
        mapping:
          consent: '#/components/schemas/ConnectionConsent'
          form: '#/components/schemas/ConnectionForm'
          connected: '#/components/schemas/ConnectionMade'
    ConnectionConfirmation:
      type: object
      required:
        - connected
      properties:
        connected:
          type: boolean
          description: Whether the app says the account is connected.
    ConnectionCheck:
      type: object
      description: What one check of a connection found.
      required:
        - verified
        - verifiedAt
        - checkedAction
      properties:
        verified:
          type: boolean
          description: Whether the call was made and worked.
        verifiedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When verified was last earned. Null when it never was.
        checkedAction:
          type:
            - string
            - 'null'
          description: The action the check called. Null when the app offers nothing safe to call, so nothing was tried.
    Disconnection:
      type: object
      required:
        - revocationRequested
      properties:
        revocationRequested:
          type: boolean
          description: Whether the app was asked to end the access. False where the app had nothing to end, such as a connection already gone or a key the app never kept a sign-in for.
    DisconnectPreview:
      type: object
      required:
        - alsoEnds
        - uncheckedCount
      properties:
        alsoEnds:
          type: array
          description: The other apps a disconnect would also end, by name, sorted.
          items:
            type: string
        uncheckedCount:
          type: integer
          minimum: 0
          description: How many other apps on the same sign-in couldn't be checked, and may end too.
    ActionAuthorized:
      type: object
      description: The account may use the action.
      required:
        - action
        - state
        - scopes
        - authorization
      properties:
        action:
          type: string
        state:
          type: string
          const: authorized
        scopes:
          type: array
          items:
            type: string
          description: What the app granted for it, in its own words.
        authorization:
          type: string
          enum:
            - held
            - not-required
          description: held when somebody consented to it; not-required when the app asks nobody to consent to it.
    ActionNeedsConsent:
      type: object
      description: The account may use the action once its holder consents to it.
      required:
        - action
        - state
        - scopes
      properties:
        action:
          type: string
        state:
          type: string
          const: needs-consent
        scopes:
          type: array
          items:
            type: string
          description: What consenting would grant, in the app's own words.
    ActionNeedsAdmin:
      type: object
      description: The action needs something an administrator sets up once for everybody. No consent changes it.
      required:
        - action
        - state
        - missing
      properties:
        action:
          type: string
        state:
          type: string
          const: needs-admin
        missing:
          type: array
          items:
            type: string
          description: What is missing, by name.
    ActionStateUnknown:
      type: object
      description: The app didn't say whether the account may use the action.
      required:
        - action
        - state
        - reason
      properties:
        action:
          type: string
        state:
          type: string
          const: unknown
        reason:
          type: string
          description: Why, as a person reads it.
    ActionAuthorization:
      description: What an account may do with one action of an app.
      oneOf:
        - $ref: '#/components/schemas/ActionAuthorized'
        - $ref: '#/components/schemas/ActionNeedsConsent'
        - $ref: '#/components/schemas/ActionNeedsAdmin'
        - $ref: '#/components/schemas/ActionStateUnknown'
      discriminator:
        propertyName: state
        mapping:
          authorized: '#/components/schemas/ActionAuthorized'
          needs-consent: '#/components/schemas/ActionNeedsConsent'
          needs-admin: '#/components/schemas/ActionNeedsAdmin'
          unknown: '#/components/schemas/ActionStateUnknown'
    ActionAuthorizations:
      type: object
      required:
        - readable
        - reason
        - actions
      properties:
        readable:
          type: boolean
          description: Whether the app could be asked. False leaves actions empty.
        reason:
          type:
            - string
            - 'null'
          description: Why the app couldn't be asked, as a person reads it. Null when it could.
        actions:
          type: array
          description: Every action of the app, by name.
          items:
            $ref: '#/components/schemas/ActionAuthorization'
    AuthorizeActionRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The action's name, exactly as getConnectionAuthorizations lists it.
        returnTo:
          $ref: '#/components/schemas/ConnectionReturnTo'
    AuthorizationStart:
      type: object
      description: The app's consent page, which sends the person back to OpenBot once they agree.
      required:
        - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
          description: The address to open. Works once, for this person only.
    ConnectedAccount:
      type: object
      description: One of a person's accounts at an app.
      required:
        - id
        - identity
        - label
        - isDefault
        - connectedAt
      properties:
        id:
          type: string
          description: The account's id here.
        identity:
          type:
            - string
            - 'null'
          description: Who the account is at the app, such as an email address. Null where the app didn't say.
        label:
          type: string
          description: What the person and their Bots call it, the identity or "account 2" where there is none.
        isDefault:
          type: boolean
          description: Whether this is the account their Bots use when they name none.
        connectedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was connected. Null where the app didn't say.
    ConnectedAccountPage:
      type: object
      required:
        - accounts
        - nextCursor
      properties:
        accounts:
          type: array
          description: In the order the person connected them, then by id.
          items:
            $ref: '#/components/schemas/ConnectedAccount'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    AccountDisconnection:
      type: object
      required:
        - remaining
        - connectionEnded
        - revocationRequested
      properties:
        remaining:
          type: integer
          minimum: 0
          description: How many of the person's accounts at the app are left.
        connectionEnded:
          type: boolean
          description: Whether that was the last account, which ends the connection.
        revocationRequested:
          type: boolean
          description: Whether the app was asked to end the access. False where it had nothing to end.
    SharedConnection:
      type: object
      description: The one account an app in Shared mode acts as for everybody. Never the credential behind it.
      required:
        - appId
        - connected
        - connectedAt
        - connectedBy
        - accountName
        - check
      properties:
        appId:
          type: string
          description: The app, as listApps answers it.
        connected:
          type: boolean
          description: Whether an account is connected. False until an administrator connects one.
        connectedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was connected. Null when it isn't.
        connectedBy:
          type:
            - string
            - 'null'
          description: The email address of the administrator who connected it, where known.
        accountName:
          type:
            - string
            - 'null'
          description: The app's own name for the account, such as a workspace. Null where it didn't say.
        check:
          description: The last check of the account with the app. Null when it isn't connected.
          oneOf:
            - $ref: '#/components/schemas/ConnectionCheckState'
            - type: 'null'
    SharedConnectionReturnTo:
      type: string
      enum:
        - apps
        - desktop
      default: apps
      description: 'Which of OpenBot''s own pages the app sends the administrator back to: apps, the app''s page for administrators; desktop, back to OpenBot Desktop. Never an address.'
    ConnectSharedAppRequest:
      type: object
      additionalProperties: false
      properties:
        returnTo:
          $ref: '#/components/schemas/SharedConnectionReturnTo'
        values:
          $ref: '#/components/schemas/ConnectionValues'
    BotGrantKind:
      type: string
      description: 'What a grant gives a Bot: one action of an app, a skill, or another Bot it may hand work to.'
      enum:
        - action
        - skill
        - bot
    BotGrantAction:
      type: object
      description: One action of an app, as the Bot is offered it.
      required:
        - appId
        - name
        - description
        - destructive
        - read
      properties:
        appId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        destructive:
          type: boolean
          description: The app warns that it destroys something. OpenBot always asks first.
        read:
          type: boolean
          description: It only reads. Anything else is treated as a change.
    BotGrantSkill:
      type: object
      description: A skill, as the Bot's / menu offers it.
      required:
        - slug
        - title
        - summary
      properties:
        slug:
          type: string
          minLength: 1
        title:
          type: string
        summary:
          type: string
    BotGrant:
      type: object
      description: One thing a Bot may use.
      required:
        - id
        - kind
        - ref
        - action
        - skill
      properties:
        id:
          type: string
          minLength: 1
          description: 'The grant''s address: action:<app id>:<action name>, skill:<slug> or bot:<Bot id>.'
        kind:
          $ref: '#/components/schemas/BotGrantKind'
        ref:
          type: string
          minLength: 1
          description: 'What it names: an action as <app id>/<action name>, a skill''s slug, or a Bot''s id.'
        action:
          description: The action, while its app offers it. Null for a skill or a Bot, and for an action the app no longer lists, which is kept but not offered.
          oneOf:
            - $ref: '#/components/schemas/BotGrantAction'
            - type: 'null'
        skill:
          description: The skill, for a skill that exists. Null otherwise.
          oneOf:
            - $ref: '#/components/schemas/BotGrantSkill'
            - type: 'null'
    BotGrantPage:
      type: object
      required:
        - grants
        - nextCursor
      properties:
        grants:
          type: array
          description: In order of their id.
          items:
            $ref: '#/components/schemas/BotGrant'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    BotGrantChanges:
      type: object
      additionalProperties: false
      description: One app's actions to turn on and off for a Bot. Each action is written <app id>/<action name>, and every one must be the app's. An action can't be in both lists, and at least one list must name one.
      required:
        - appId
        - add
        - remove
      properties:
        appId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        add:
          type: array
          maxItems: 2000
          description: The actions to turn on. Repeats count once.
          items:
            type: string
            minLength: 1
            maxLength: 300
            pattern: \S
        remove:
          type: array
          maxItems: 2000
          description: The actions to turn off. Repeats count once.
          items:
            type: string
            minLength: 1
            maxLength: 300
            pattern: \S
        authoring:
          type: object
          additionalProperties: false
          description: The description the actions were chosen from (translateBotGrants), recorded with the change.
          required:
            - source
            - text
          properties:
            source:
              type: string
              enum:
                - english
            text:
              type: string
              minLength: 1
              maxLength: 2000
              pattern: ^[^\x00]*\S[^\x00]*$
        approval:
          $ref: '#/components/schemas/SharedAccountApproval'
    BotGrantChangesSaved:
      type: object
      required:
        - added
        - removed
      properties:
        added:
          type: array
          description: The actions turned on, once each.
          items:
            type: string
        removed:
          type: array
          description: The actions turned off, once each.
          items:
            type: string
    BotGrantDescription:
      type: object
      additionalProperties: false
      required:
        - appId
        - text
      properties:
        appId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        text:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: ^[^\x00]*\S[^\x00]*$
          description: What the Bot may do in the app, in a sentence or two, at most 1,000 characters once trimmed.
    BotGrantCheck:
      type: object
      description: Whether every action named is one the app offers now, and what is wrong with each one that isn't.
      required:
        - ok
      properties:
        ok:
          type: boolean
        error:
          type: string
        problems:
          type: array
          items:
            type: object
            required:
              - action
              - message
            properties:
              action:
                type: string
              message:
                type: string
    BotGrantTranslation:
      type: object
      required:
        - actions
        - grants
        - otherApps
        - summary
        - explanation
        - check
        - warning
      properties:
        actions:
          type: array
          description: The action names the model chose, as it wrote them.
          items:
            type: string
        grants:
          type: array
          description: The chosen actions the app offers, written <app id>/<action name>. Saveable with batchUpdateBotGrants when check.ok is true.
          items:
            type: string
        otherApps:
          type: array
          description: Other apps the description names, which this set doesn't touch.
          items:
            type: string
        summary:
          type:
            - string
            - 'null'
          description: What the set lets the Bot do, in one sentence. Null when it doesn't check.
        explanation:
          type:
            - string
            - 'null'
          description: What the set lets the Bot do, read from the set alone by a call that never saw the description. Null when it doesn't check.
        check:
          $ref: '#/components/schemas/BotGrantCheck'
        warning:
          type:
            - string
            - 'null'
          description: Set when the set destroys things, or gives nothing at all.
    BotGrantCandidate:
      type: object
      additionalProperties: false
      required:
        - appId
        - grants
      properties:
        appId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        grants:
          type: array
          maxItems: 2000
          description: Every action of the app the Bot would have, written <app id>/<action name> or by the action's name alone.
          items:
            type: string
            maxLength: 300
    BotGrantActionChange:
      type: object
      description: One action a change turns on or off.
      required:
        - ref
        - name
        - effect
        - destructive
      properties:
        ref:
          type: string
        name:
          type: string
        effect:
          type: string
          enum:
            - read
            - write
        destructive:
          type: boolean
    BotGrantReplayedAction:
      type: object
      description: An action the replay names, with how often the Bot called it.
      required:
        - ref
        - name
        - effect
        - destructive
        - calls
        - lastCalled
      properties:
        ref:
          type: string
        name:
          type: string
        effect:
          type: string
          enum:
            - read
            - write
        destructive:
          type: boolean
        calls:
          type: integer
          minimum: 0
        lastCalled:
          type: string
          format: date-time
    BotGrantReplayReport:
      type: object
      description: What the change would have meant for the Bot's recent calls to the app.
      required:
        - calls
        - runs
        - since
        - removedUsed
        - callsLost
        - refusedGiven
        - callsGained
        - addedUnusedWrites
        - addedUnusedReads
      properties:
        calls:
          type: integer
          minimum: 0
          description: The Bot's calls to this app on the audit trail, each counted once.
        runs:
          type: integer
          minimum: 0
          description: Runs it was offered tools in.
        since:
          type:
            - string
            - 'null'
          format: date-time
          description: The oldest row replayed, or null with nothing to replay.
        removedUsed:
          type: array
          description: Actions the change takes away that the Bot called, most called first.
          items:
            $ref: '#/components/schemas/BotGrantReplayedAction'
        callsLost:
          type: integer
          minimum: 0
        refusedGiven:
          type: array
          description: Actions the Bot was refused for not having, that the change gives it.
          items:
            $ref: '#/components/schemas/BotGrantReplayedAction'
        callsGained:
          type: integer
          minimum: 0
        addedUnusedWrites:
          type: array
          description: Changes the change gives that the Bot never called or tried.
          items:
            type: object
            required:
              - ref
              - name
              - destructive
            properties:
              ref:
                type: string
              name:
                type: string
              destructive:
                type: boolean
        addedUnusedReads:
          type: integer
          minimum: 0
          description: Reads the change gives that the Bot never called or tried.
    BotGrantReplay:
      type: object
      required:
        - check
        - warning
        - changes
        - report
      properties:
        check:
          $ref: '#/components/schemas/BotGrantCheck'
        warning:
          type:
            - string
            - 'null'
        changes:
          type: object
          description: Against what the Bot has now.
          required:
            - added
            - removed
          properties:
            added:
              type: array
              items:
                $ref: '#/components/schemas/BotGrantActionChange'
            removed:
              type: array
              items:
                $ref: '#/components/schemas/BotGrantActionChange'
        report:
          description: Null where OpenBot keeps no audit trail it can read.
          oneOf:
            - $ref: '#/components/schemas/BotGrantReplayReport'
            - type: 'null'
    BotGrantInput:
      type: object
      additionalProperties: false
      description: What a grant may carry. Only an administrator's grant of an action of an app with one shared account reads it.
      properties:
        approval:
          $ref: '#/components/schemas/SharedAccountApproval'
    AppAccessRequestKind:
      type: string
      description: 'What an administrator is asked for: to turn the app on, to give it to the Bot, or to connect its shared account.'
      enum:
        - enable
        - grant
        - connect_shared
    BotAppPendingRequest:
      type: object
      required:
        - id
        - kind
        - createdAt
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/AppAccessRequestKind'
        createdAt:
          type: string
          format: date-time
    BotApp:
      type: object
      description: 'One app as it stands for the person asking, on one Bot. state is OpenBot''s: a client draws it and never works it out from the other fields.'
      required:
        - id
        - title
        - logo
        - source
        - account
        - connect
        - state
        - unavailable
        - accountHolder
        - asksFirst
        - granted
        - ownerGrants
        - givenByOwner
        - needsConnect
        - connectedAt
        - requestKind
        - pendingRequest
      properties:
        id:
          type: string
          minLength: 1
          description: The app's id, or the one turning it on would give it.
        title:
          type: string
          description: The app's own name, such as Gmail.
        logo:
          type:
            - string
            - 'null'
        source:
          type: string
          description: 'Where the app comes from: OpenBot''s catalogue, a server added by its address, or the directory of apps OpenBot can add.'
          enum:
            - catalogue
            - address
            - directory
        account:
          type: string
          description: 'Whose account the app''s actions use: each person''s own, one shared account an administrator connects, or no person''s.'
          enum:
            - personal
            - shared
            - deployment
        connect:
          description: 'How the person''s account is connected: OpenBot''s own sign-in, the directory''s sign-in, a key, or nothing to connect.'
          oneOf:
            - type: string
              enum:
                - oauth
                - consent
                - key
            - type: 'null'
        state:
          type: string
          description: 'ready: usable now. not_connected and reconnect: waiting on an account the person connects (see accountHolder). shared_not_connected: waiting on the shared account. shared_not_approved: an administrator hasn''t approved who may use the shared account through this Bot. disabled: turned off (see unavailable). not_granted: the Bot wasn''t given it. owner_grantable: the same, and the person may give it themselves.'
          enum:
            - ready
            - not_connected
            - reconnect
            - shared_not_connected
            - shared_not_approved
            - disabled
            - not_granted
            - owner_grantable
        unavailable:
          description: 'Why the app is turned off, when state is disabled: nobody turned it on, the directory isn''t set up here, OpenBot can''t read how it connects, or it is missing the OAuth client or the key an administrator adds. Null otherwise.'
          oneOf:
            - type: string
              enum:
                - absent
                - directory_unavailable
                - scheme_unreadable
                - oauth_client_missing
                - token_missing
            - type: 'null'
        accountHolder:
          description: 'Whose own account the actions use for this person: theirs, or on somebody else''s shared Bot the owner''s, which only the owner can reconnect. Null where no person''s own account is used.'
          oneOf:
            - type: string
              enum:
                - you
                - owner
            - type: 'null'
        asksFirst:
          type: boolean
          description: The first use on the person's own account through somebody else's shared Bot asks them first. state is still ready.
        granted:
          type: boolean
          description: The Bot was given at least one of the app's actions.
        ownerGrants:
          type: string
          description: 'Who may give the app to a Bot: any Bot''s owner, or only an administrator.'
          enum:
            - any
            - admin
        givenByOwner:
          type: boolean
          description: Everything the Bot has of the app was given by its owner, who may take it back.
        needsConnect:
          type: boolean
          description: When state is owner_grantable, giving the app starts with connecting the person's own account. False otherwise.
        connectedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the account the app uses for this person was connected, or null.
        requestKind:
          description: What a request would ask an administrator for in this state (createAppAccessRequest), or null where the next step is the person's own.
          oneOf:
            - $ref: '#/components/schemas/AppAccessRequestKind'
            - type: 'null'
        pendingRequest:
          description: The person's own waiting request of that kind, or null.
          oneOf:
            - $ref: '#/components/schemas/BotAppPendingRequest'
            - type: 'null'
    BotAppPage:
      type: object
      required:
        - apps
        - nextCursor
      properties:
        apps:
          type: array
          description: By title, and by id among apps with the same title.
          items:
            $ref: '#/components/schemas/BotApp'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    BotAppGiven:
      type: object
      required:
        - given
      properties:
        given:
          type: array
          description: The actions given, written <app id>/<action name>. Empty when the Bot already had the app.
          items:
            type: string
    BotAppTakenBack:
      type: object
      required:
        - takenBack
      properties:
        takenBack:
          type: array
          description: The actions taken back, written <app id>/<action name>.
          items:
            type: string
    AppAccessRequest:
      type: object
      description: A person's request to an administrator about one app, as the person and the administrator both read it.
      required:
        - id
        - appId
        - appTitle
        - kind
        - status
        - botId
        - botName
        - requestedBy
        - requesterEmail
        - requesterName
        - createdAt
        - resolvedAt
        - resolvedBy
      properties:
        id:
          type: string
          minLength: 1
        appId:
          type: string
          minLength: 1
        appTitle:
          type: string
        kind:
          $ref: '#/components/schemas/AppAccessRequestKind'
        status:
          type: string
          description: 'Read only: waiting, approved, dismissed, or withdrawn by the person who asked. Answering a request is approveAppAccessRequest or dismissAppAccessRequest.'
          enum:
            - pending
            - approved
            - dismissed
            - cancelled
        botId:
          type:
            - string
            - 'null'
          description: The Bot it is for, or null for a request about the app alone.
        botName:
          type:
            - string
            - 'null'
        requestedBy:
          type: string
          description: The id of the person who asked.
        requesterEmail:
          type:
            - string
            - 'null'
        requesterName:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
        resolvedBy:
          type:
            - string
            - 'null'
          description: The id of the person who answered or withdrew it.
    AppAccessApproval:
      type: object
      required:
        - appAccessRequest
        - enabled
        - granted
      properties:
        appAccessRequest:
          $ref: '#/components/schemas/AppAccessRequest'
        enabled:
          type: boolean
          description: The app was turned on.
        granted:
          type: array
          description: The actions given to the Bot, written <app id>/<action name>.
          items:
            type: string
    GiveableApp:
      type: object
      description: An app a person could give Bots they own.
      required:
        - id
        - title
        - logo
        - account
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
        logo:
          type:
            - string
            - 'null'
        account:
          type: string
          description: Whose account the app's actions use.
          enum:
            - personal
            - shared
            - deployment
    GiveableAppPage:
      type: object
      required:
        - apps
        - nextCursor
      properties:
        apps:
          type: array
          description: By title, and by id among apps with the same title.
          items:
            $ref: '#/components/schemas/GiveableApp'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    AppAccessRequestPage:
      type: object
      required:
        - appAccessRequests
        - nextCursor
      properties:
        appAccessRequests:
          type: array
          description: Newest first, and by id among requests made at the same moment.
          items:
            $ref: '#/components/schemas/AppAccessRequest'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    AppAccessRequestInput:
      type: object
      additionalProperties: false
      required:
        - botId
        - appId
      properties:
        botId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        appId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: The app's id, or its name.
    AppAccessApprovalInput:
      type: object
      additionalProperties: false
      properties:
        actions:
          type: array
          maxItems: 2000
          description: The actions to give the Bot, written <app id>/<action name>. Left out, the Bot gets only the actions that only read.
          items:
            type: string
            minLength: 1
            maxLength: 300
            pattern: \S
    DestinationConversationId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: \S
      description: One of the person's conversations, by its id.
    DestinationBotId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: \S
      description: A Bot in that conversation, by its id.
    LinkChatDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - platform
        - conversationId
        - botId
      properties:
        platform:
          type: string
          enum:
            - slack
            - teams
          description: Slack or Microsoft Teams.
        conversationId:
          $ref: '#/components/schemas/DestinationConversationId'
        botId:
          $ref: '#/components/schemas/DestinationBotId'
    ChatLinkCode:
      type: object
      description: A one-time code the person sends the OpenBot app in Slack or Teams.
      required:
        - platform
        - code
        - command
        - expiresAt
      properties:
        platform:
          type: string
          enum:
            - slack
            - teams
        code:
          type: string
          description: The code. It works once, and only for the person it was made for.
        command:
          type: string
          description: The message to send the OpenBot app, the code in it.
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working.
    VerifyPhoneDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - conversationId
        - botId
      properties:
        phone:
          type: string
          pattern: ^\+[1-9]\d{7,14}$
          description: The phone number in international form, such as +14155550123.
        conversationId:
          $ref: '#/components/schemas/DestinationConversationId'
        botId:
          $ref: '#/components/schemas/DestinationBotId'
    PhoneVerification:
      type: object
      description: A code on its way to a phone, to confirm under this verification.
      required:
        - verificationId
        - expiresAt
      properties:
        verificationId:
          type: string
          format: uuid
          description: Send this with the code to confirmPhoneDestination.
        expiresAt:
          type: string
          format: date-time
          description: When the verification stops working.
    ConfirmPhoneDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - verificationId
        - code
      properties:
        verificationId:
          type: string
          format: uuid
          description: The verification verifyPhoneDestination answered.
        code:
          type: string
          pattern: ^\d{4,10}$
          description: The code the phone was texted.
    DestinationResponse:
      type: object
      required:
        - destination
      properties:
        destination:
          $ref: '#/components/schemas/Destination'
    NotificationTransport:
      type: string
      enum:
        - push
        - slack
        - teams
        - sms
      description: 'A way OpenBot reaches a person outside it: push notifications to their phones, Slack, Microsoft Teams, or text messages.'
    DeliveryKind:
      type: string
      enum:
        - reply
        - question
        - approval
        - attention
      description: 'What was sent: a Bot''s reply, a question it asked, an approval it needs, or what the person''s Bots'' check-ins found that needs them.'
    DeliveryState:
      type: string
      enum:
        - queued
        - running
        - accepted
        - sent
        - delivered
        - failed
        - unknown
        - opted_out
      description: Where it got to. accepted is the provider taking it without saying yet that it arrived. unknown is a send that may or may not have gone. opted_out is a text message not sent because the person texted STOP.
    Delivery:
      type: object
      description: One update a Bot sent a person outside OpenBot.
      required:
        - id
        - transport
        - kind
        - state
        - error
        - conversationId
        - botId
        - createdAt
      properties:
        id:
          type: string
          description: The delivery's id.
        transport:
          $ref: '#/components/schemas/NotificationTransport'
        kind:
          $ref: '#/components/schemas/DeliveryKind'
        state:
          $ref: '#/components/schemas/DeliveryState'
        error:
          type:
            - string
            - 'null'
          description: Why it failed or may not have arrived, as the provider said. Null otherwise.
        conversationId:
          type: string
          description: The conversation it was about.
        botId:
          type: string
          description: The Bot that sent it.
        createdAt:
          type: string
          format: date-time
          description: When it was sent.
    DeliveryPage:
      type: object
      required:
        - deliveries
        - nextCursor
      properties:
        deliveries:
          type: array
          description: The newest first, then by id.
          items:
            $ref: '#/components/schemas/Delivery'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: Pass as cursor for the next page. Null ends the list. Written in URL-safe base64, the only form the cursor parameter accepts.
    UpdateRoute:
      description: 'Where one kind of update may go. all: every way the person can be reached, now and any set up later. A list: only those ways; an empty list keeps that kind in OpenBot.'
      oneOf:
        - type: string
          enum:
            - all
        - type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationTransport'
    UpdateRouting:
      type: object
      description: Where each kind of update may go.
      required:
        - progress
        - decision
        - question
        - attention
      properties:
        progress:
          $ref: '#/components/schemas/UpdateRoute'
        decision:
          $ref: '#/components/schemas/UpdateRoute'
        question:
          $ref: '#/components/schemas/UpdateRoute'
        attention:
          $ref: '#/components/schemas/UpdateRoute'
    NotificationSettings:
      type: object
      description: 'Where a person''s updates go, for every one of their Bots at once. progress: replies and results from work they weren''t watching. decision: approvals a Bot needs before it acts. question: what a Bot asked and waits on. attention: what their Bots'' check-ins found, at most once an hour, every Bot in one message.'
      required:
        - routing
      properties:
        routing:
          $ref: '#/components/schemas/UpdateRouting'
    UpdateNotificationSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - routing
      properties:
        routing:
          type: object
          description: The kinds of update to change. At least one.
          additionalProperties: false
          minProperties: 1
          properties:
            progress:
              $ref: '#/components/schemas/UpdateRoute'
            decision:
              $ref: '#/components/schemas/UpdateRoute'
            question:
              $ref: '#/components/schemas/UpdateRoute'
            attention:
              $ref: '#/components/schemas/UpdateRoute'
    BotNotifyLevel:
      type: string
      enum:
        - all
        - needs_input
        - none
      description: 'How much one Bot may reach the person outside OpenBot: all of it, only what needs them (its questions and approvals), or nothing.'
    BotNotificationSettings:
      type: object
      required:
        - botId
        - notify
      properties:
        botId:
          type: string
          description: The Bot.
        notify:
          $ref: '#/components/schemas/BotNotifyLevel'
    UpdateBotNotificationSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - notify
      properties:
        notify:
          $ref: '#/components/schemas/BotNotifyLevel'
    NotificationTransportOption:
      type: object
      required:
        - id
        - title
      properties:
        id:
          $ref: '#/components/schemas/NotificationTransport'
        title:
          type: string
          description: Its name, as a person reads it.
    NotificationTransportPage:
      type: object
      required:
        - notificationTransports
        - nextCursor
      properties:
        notificationTransports:
          type: array
          description: Push, then Slack, Microsoft Teams and text messages, as set up.
          items:
            $ref: '#/components/schemas/NotificationTransportOption'
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
