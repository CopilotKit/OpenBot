      tags:
        - Apps
      operationId: listApps
      summary: List the apps added here
      description: 'Return one page of the apps this OpenBot has added for its Bots: the ones from its catalogue, the ones added from the app directory, and servers added by their address. Each app comes with the actions it offers and the Bots that may use each one. Anybody signed in may read them. Ordered by title, then by id. A missing cursor starts at the first page and nextCursor null ends the list.'
      security:
