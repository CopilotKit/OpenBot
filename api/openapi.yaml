        - title
        - detail
        - sourceApp
        - sourceRef
        - sourceLink
        - status
        - pingId
        - deliveredAt
        - resolvedAt
        - createdAt
      properties:
        id:
          type: string
          description: The item's id.
        botId:
          type: string
          description: The Bot that raised it.
        checkInId:
          type: string
          description: The check-in that found it.
        title:
          type: string
          description: What to do, in plain words.
        detail:
          type: string
          description: Why it was raised and what the Bot found.
        sourceApp:
          type:
            - string
            - 'null'
          description: The app the Bot read it in, or null.
        sourceRef:
          type:
            - string
            - 'null'
          description: What the Bot read it with, or null.
        sourceLink:
          type:
            - string
            - 'null'
          description: Where it can be opened, or null.
        status:
          type: string
          enum:
            - open
            - dismissed
            - started
            - superseded
          description: 'open until the person starts or hides it. superseded is the Bot''s own: a later check-in cleared it as no longer needed.'
        pingId:
          type:
            - string
            - 'null'
          description: The notice that told the person about it, or null while it waits for their next one.
        deliveredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When that notice went out, or null.
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was started, hidden or cleared.
        createdAt:
          type: string
          format: date-time
          description: When it was raised.
    CheckInItemPage:
      type: object
      required:
        - checkInItems
