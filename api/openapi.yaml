openapi: 3.1.1
info:
  title: OpenBot API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    The one API every OpenBot client uses: the web app, Desktop, mobile, the
    Recorder and the CLI. It follows the conventions of CopilotKit
    Intelligence's v2 API so both read as one API, and OpenBot's resources sit
    beside Intelligence's under the same organization address
    (/api/v2/organizations/{organizationId}/...). Errors are RFC 9457 problem
    details (application/problem+json), lists page with an opaque cursor and a
    limit, and every write takes an Idempotency-Key.


    Until multi-organization lands, an OpenBot install has exactly one
    organization, and organizationId is that organization. Clients address it
    as `default`; the server treats any other value as an organization that
    does not exist.


    This file is the single source of truth: the clients, the server's types,
    the docs and the contract tests are all generated from it or checked
    against it. A change that breaks an existing client fails the pull request.
servers:
  - url: http://127.0.0.1:3001
    description: An OpenBot server on this machine (the default local port).
tags:
  - name: Bots
    description: >-
      The Bots a person can see: their own, those shared with them, the ones an
      administrator assigned them, and the ones that come with OpenBot.
  - name: Reactions
    description: >-
      The reactions a Bot leaves on a person's message in place of a line of
      its own, when the message only needs an acknowledgement.
  - name: Audit events
    description: >-
      The audit trail: what people and Bots did in the organization, and what
      its policy refused, newest first. Only an administrator can read it. It
      is read-only: events are written by what they record, never through the
      API.
paths:
  /api/v2/organizations/{organizationId}/reactions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Reactions]
      operationId: listReactions
      summary: List reactions in a conversation
      description: >-
        Return one page of the reactions Bots left on the caller's messages in
        one of their conversations, named by its thread. Another person's
        thread answers with an empty list. A missing cursor starts at the
        first page and nextCursor null ends the list. Today's server returns
        every reaction on the first page.
      security:
        - webSession: []
        - appOAuth: [reactions:read]
        - apiKey: []
      parameters:
        - name: threadId
          in: query
          required: true
          description: The conversation's thread, as its messages name it.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of reactions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/ReactionPageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Bots]
      operationId: listBots
      summary: List Bots
      description: >-
        Return one page of the Bots the caller can see: theirs, the ones shared
        with them, the ones assigned to them and the ones that come with
        OpenBot, in the order the server keeps them. hidden=true lists only
        the Bots the caller hid from their own list instead. A missing cursor
        starts at the first page and nextCursor null ends the list. Today's
        server returns every Bot on the first page.
      security:
        - webSession: []
        - appOAuth: [bots:read]
        - apiKey: []
      parameters:
        - name: hidden
          in: query
          description: List the Bots the caller hid instead of the ones they did not.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of Bots.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/BotPageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Bots]
      operationId: createBot
      summary: Create a Bot
      description: >-
        Create a Bot owned by the caller. With no endpoint it runs inside
        OpenBot on its role description; with one, OpenBot sends each turn to
        that AG-UI address, which the server checks before saving. A key, when
        given, is stored encrypted and never returned. Asking for isolated
        needs the caller's Isolated Bots switch and a deployment that can give
        a Bot a computer of its own. A repeated request with the same
        Idempotency-Key and body returns the first result.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
            examples:
              builtIn:
                summary: A Bot that runs inside OpenBot.
                value:
                  name: Expense Review
                  title: Finance Operations
                  roleDescription: Review receipts, categorize expenses, and prepare reimbursement reports.
                  visibility: private
              ownAgent:
                summary: An agent somebody runs themselves, behind a key.
                value:
                  name: Expense Review
                  title: ''
                  roleDescription: Review receipts.
                  visibility: private
                  endpoint: https://agents.example.com/ag-ui
                  auth:
                    header: Authorization
                    value: Bearer example-key
                  harness: langgraph
      responses:
        '201':
          description: The Bot was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              description: The new Bot's address.
              schema:
                type: string
              example: /api/v2/organizations/default/bots/agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                created:
                  $ref: '#/components/examples/CreatedBot'
        '400':
          $ref: '#/components/responses/InvalidBot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    get:
      tags: [Bots]
      operationId: getBot
      summary: Read one Bot
      description: >-
        Return one Bot the caller can see. A Bot that does not exist, was
        deleted, or is private to somebody else is not found.
      security:
        - webSession: []
        - appOAuth: [bots:read]
        - apiKey: []
      responses:
        '200':
          description: The Bot.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                starter:
                  $ref: '#/components/examples/StarterBot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      tags: [Bots]
      operationId: updateBot
      summary: Change a Bot
      description: >-
        Replace a Bot's name, title, role description and visibility, which are
        all required, and change any optional field that is present. An absent
        endpoint, key or isolated leaves that setting as it is, so an edit to
        a name never drops a key or moves a Bot between computers. Only whoever
        may manage the Bot may change it, and a Bot that comes with OpenBot
        cannot be changed. Making a Bot public reports what that means for the
        shared app accounts it uses.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotRequest'
            examples:
              rename:
                value:
                  name: Expense Review Desk
                  title: Finance Operations
                  roleDescription: Review receipts, categorize expenses, and prepare reimbursement reports.
                  visibility: private
      responses:
        '200':
          description: The changed Bot.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBotResponse'
              examples:
                renamed:
                  $ref: '#/components/examples/CreatedBot'
                published:
                  $ref: '#/components/examples/PublishedBot'
        '400':
          $ref: '#/components/responses/InvalidBot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [Bots]
      operationId: deleteBot
      summary: Delete a Bot
      description: >-
        Delete a Bot for everyone and retire its key. Conversations with it
        stay readable. Only whoever may manage the Bot may delete it, and a
        Bot that comes with OpenBot cannot be deleted. A Bot that is already
        deleted is not found.
      security:
        - webSession: []
        - appOAuth: [bots:write]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The Bot was deleted.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Audit events]
      operationId: listAuditEvents
      summary: List audit events
      description: >-
        Return one page of the audit trail, newest first, narrowed by the
        filters given. Each filter narrows the events, and a filter that takes
        several values separated by commas matches any of them. A value that
        names nothing in the trail matches no event rather than being refused.
        A missing cursor starts at the newest event and nextCursor null ends
        the list. A cursor belongs to the filters that made it, so changing a
        filter starts again without one; limit may change from page to page.
        Only an administrator may read the trail.
      security:
        - webSession: []
        - appOAuth: [audit-events:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AuditEventTypes'
        - $ref: '#/components/parameters/AuditExcludedEventTypes'
        - $ref: '#/components/parameters/AuditExcludedCalls'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditInitiatorKinds'
        - $ref: '#/components/parameters/AuditTargetTypes'
        - $ref: '#/components/parameters/AuditTargetId'
        - $ref: '#/components/parameters/AuditBots'
        - $ref: '#/components/parameters/AuditApps'
        - $ref: '#/components/parameters/AuditTools'
        - $ref: '#/components/parameters/AuditEffect'
        - $ref: '#/components/parameters/AuditIntents'
        - $ref: '#/components/parameters/AuditRule'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: One page of audit events.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
              examples:
                firstPage:
                  $ref: '#/components/examples/AuditEventPageFirst'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/audit-events/export:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Audit events]
      operationId: exportAuditEvents
      summary: Export audit events as CSV
      description: >-
        Return every event the filters match, newest first, as one CSV file
        (RFC 4180): the same filters as listing audit events, without its
        paging, so the file and the list agree. The file holds at most 5,000
        events; when more match, OpenBot-Export-Truncated says how many it
        holds, and narrowing the dates exports the rest. A cell a spreadsheet
        would run as a formula starts with an apostrophe. Each export is
        recorded on the trail. Only an administrator may export the trail.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [audit-events:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/AuditEventTypes'
        - $ref: '#/components/parameters/AuditExcludedEventTypes'
        - $ref: '#/components/parameters/AuditExcludedCalls'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditInitiatorKinds'
        - $ref: '#/components/parameters/AuditTargetTypes'
        - $ref: '#/components/parameters/AuditTargetId'
        - $ref: '#/components/parameters/AuditBots'
        - $ref: '#/components/parameters/AuditApps'
        - $ref: '#/components/parameters/AuditTools'
        - $ref: '#/components/parameters/AuditEffect'
        - $ref: '#/components/parameters/AuditIntents'
        - $ref: '#/components/parameters/AuditRule'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: >-
            The matching events as CSV, one header row and one row per event.
            The columns are id, createdAt, eventType, actorUserId,
            initiatorKind, initiatorId, targetType, targetId, decisionAllowed,
            decisionRule, bot and payload, the event's payload as JSON.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Content-Disposition:
              description: An attachment named after the day it was exported.
              schema:
                type: string
              example: attachment; filename="audit-events-2026-11-14.csv"
            OpenBot-Export-Truncated:
              description: >-
                Present only when more events matched than the file holds: the
                number of events it holds.
              schema:
                type: integer
                minimum: 1
              example: 5000
          content:
            text/csv:
              schema:
                type: string
              example: |
                id,createdAt,eventType,actorUserId,initiatorKind,initiatorId,targetType,targetId,decisionAllowed,decisionRule,bot,payload
                0b8f3a52-5d0e-4f5c-9a43-1c2b6c3e9f10,2026-11-14T09:12:44.501Z,computer.action_refused,,routine,routine_7f2c,computer,research-assistant,false,network.deny,research-assistant,"{""bot"":""research-assistant"",""decision"":{""allowed"":false,""rule"":""network.deny""}}"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/audit-events/vocabulary:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Audit events]
      operationId: getAuditEventVocabulary
      summary: Read what the audit filters can name
      description: >-
        Return what a filter on the audit trail can name in this
        organization: its Bots, its people, the apps and tools the trail has
        seen, and the boundary rules, both the policy's current ones and any
        that refused something in the trail. These are the only values a
        question asked of the trail can turn into. Only an administrator may
        read it.
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth: [audit-events:read]
        - apiKey: []
      responses:
        '200':
          description: What the audit filters can name.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVocabulary'
              examples:
                vocabulary:
                  $ref: '#/components/examples/AuditVocabularyExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/audit-events/ask:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Audit events]
      operationId: askAuditEvents
      summary: Ask the audit trail a question
      description: >-
        Turn a question in English into filters on the audit trail. The
        deployment's model chooses the filters and never answers the question
        itself: the events the filters list are the answer. Every filter is
        checked against what the trail can name (getAuditEventVocabulary), and
        filters that still fail on the model's second try are refused, never
        guessed at. A second call that never sees the question reads the
        filters back in one line. Nothing changes but the trail, which records
        each question with the filters it became. Only an administrator may
        ask. A repeated request with the same Idempotency-Key and body returns
        the first answer without asking the model again.
      security:
        - webSession: []
        - appOAuth: [audit-events:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditQuestion'
            examples:
              blocked:
                value:
                  question: What did the Research Assistant try to do yesterday that was blocked?
                  timeZone: Europe/London
      responses:
        '200':
          description: >-
            The filters the question became, or why the trail can't answer it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAnswer'
              examples:
                answered:
                  $ref: '#/components/examples/AuditAnswerExample'
        '400':
          $ref: '#/components/responses/InvalidAuditQuestion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/AuditQuestionNotUnderstood'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ModelFailed'
        '503':
          $ref: '#/components/responses/ModelNotConfigured'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        The web app's server-side session, so no token ever reaches the
        browser. Served over HTTPS the cookie is
        __Secure-better-auth.session_token. A single-user install signs its
        one person in without a cookie.
    appOAuth:
      type: oauth2
      description: >-
        Desktop, mobile and the CLI. OAuth 2.1 authorization code with PKCE
        (RFC 7636, S256 only); the access token is sent as a bearer token. The
        server does not accept it yet.
      flows:
        authorizationCode:
          authorizationUrl: /api/auth/oauth2/authorize
          tokenUrl: /api/auth/oauth2/token
          refreshUrl: /api/auth/oauth2/token
          scopes:
            bots:read: Read the Bots the signed-in person can see.
            bots:write: Create, change and delete the signed-in person's Bots.
            reactions:read: Read the reactions Bots left on the signed-in person's messages.
            audit-events:read: Read the organization's audit trail, when the signed-in person is an administrator.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: OpenBot API key
      description: >-
        Automation. An API key acts as the person who created it, inside one
        organization. The server does not accept it yet.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: >-
        The organization. Until multi-organization lands every install has one,
        addressed as `default`.
      schema:
        type: string
        minLength: 1
      example: default
    BotId:
      name: botId
      in: path
      required: true
      description: The Bot's id.
      schema:
        type: string
        minLength: 1
        pattern: \S
      example: agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
    Limit:
      name: limit
      in: query
      description: Most items in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque continuation from the previous page's nextCursor, bound to the
        organization and the filters that made it. The server only ever issues
        cursors written in URL-safe base64 (letters, digits, - and _, no
        padding) and refuses anything else, so the pattern says so. A cursor
        that fits the pattern can still be refused: one this list never gave
        out, or one made for another organization or other filters.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: ^[A-Za-z0-9_-]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Generated by the caller for each write it means to make once. Reuse the
        same key and the same request for 24 hours after an uncertain response;
        the same key with a different request is a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuditEventTypes:
      name: eventType
      in: query
      description: >-
        Events of any of these types, separated by commas, such as
        computer.action_refused,mcp.call_rejected.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditExcludedEventTypes:
      name: excludeEventType
      in: query
      description: Leave out events of these types, separated by commas.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditExcludedCalls:
      name: excludeCalls
      in: query
      description: >-
        Leave out the app calls of these tools that succeeded, separated by
        commas: calls whose change has an event of its own. A call that failed
        is kept.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditActor:
      name: actorUserId
      in: query
      description: Events that ran on this person's authority, by their user id.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditInitiatorKinds:
      name: initiatorKind
      in: query
      description: >-
        Events started in any of these ways, separated by commas: person,
        deployment, routine, responsibility, memory or handoff.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditTargetTypes:
      name: targetType
      in: query
      description: >-
        Events about any of these kinds of thing, separated by commas, such as
        agent or computer.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditTargetId:
      name: targetId
      in: query
      description: Events about this one thing, by its id.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditBots:
      name: bot
      in: query
      description: >-
        The events of any of these Bots, by id, separated by commas: what each
        Bot did and what was done to it.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditApps:
      name: app
      in: query
      description: >-
        App calls to any of these apps, separated by commas, by the app's key
        (gmail), whichever way the app was connected.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditTools:
      name: tool
      in: query
      description: >-
        App calls of any of these tools, separated by commas, by the name the
        trail records, in any case.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditEffect:
      name: effect
      in: query
      description: App calls that only read (read), or that change something (write).
      schema:
        $ref: '#/components/schemas/AuditEffect'
    AuditIntents:
      name: intent
      in: query
      description: >-
        Actions that did any of these, separated by commas, in the boundary's
        own words (AuditIntent). A word outside those matches nothing.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditRule:
      name: rule
      in: query
      description: >-
        Refusals by this one boundary rule, its text exactly as recorded. One
        rule, not a list, because a rule can hold commas.
      schema:
        $ref: '#/components/schemas/AuditFilterText'
    AuditFrom:
      name: from
      in: query
      description: Events after this moment.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Events before this moment.
      schema:
        type: string
        format: date-time
  headers:
    PrivateNoStore:
      description: A Bot is private to the caller.
      schema:
        type: string
        const: private, no-store
  schemas:
    BotVisibility:
      type: string
      enum: [public, private]
      description: Public Bots are shared with everybody in the organization.
    Bot:
      type: object
      description: >-
        A Bot as the caller sees it. canManage, mine, systemOwned and the
        isolation fields are the server's verdicts for this caller; a client
        renders them and never recomputes them. No secret is ever part of a
        Bot: hasAuth and hasCallbackToken say whether one is set.
      required:
        - id
        - name
        - title
        - roleDescription
        - avatarSeed
        - visibility
        - hidden
        - pinned
        - systemOwned
        - endpoint
        - hasAuth
        - hasCallbackToken
        - isolated
        - canManage
        - mine
        - assignedToMe
        - builtIn
        - runsOnOpenBotModel
        - keyFromOpenBot
        - isolationActive
        - isolationOffReason
      properties:
        id:
          type: string
          description: The Bot's id.
        name:
          type: string
          description: What the Bot is called.
        title:
          type: string
          description: The subtitle under its name. May be empty.
        roleDescription:
          type: string
          description: What it does, in its owner's words.
        avatarSeed:
          type: string
          description: The seed its avatar is drawn from.
        visibility:
          $ref: '#/components/schemas/BotVisibility'
        hidden:
          type: boolean
          description: Whether the caller hid it from their own list.
        pinned:
          type: boolean
          description: Whether the caller pinned it to the top of their own list.
        systemOwned:
          type: boolean
          description: Whether it comes with OpenBot rather than belonging to a person.
        endpoint:
          type: [string, 'null']
          description: >-
            The AG-UI address it runs at, as it was stored. Null for a Bot that
            runs inside OpenBot. Every address saved through this API is an
            absolute http or https address (see the request's endpoint), but
            one saved by an older release is returned as it is, so this field
            states no format.
        hasAuth:
          type: boolean
          description: Whether a key is set for its address. Never the key.
        hasCallbackToken:
          type: boolean
          description: >-
            Whether it holds a credential for calling OpenBot's tools back.
            Never the credential.
        isolated:
          type: boolean
          description: >-
            Whether its owner asked for it to have a computer of its own.
            isolationActive says whether it has one now.
        instructions:
          type: string
          description: >-
            What the starter Bot is told, kept apart from its role description.
            Only the starter Bot has instructions.
        framework:
          type: string
          description: >-
            What runs it, by the name a person reads ("LangChain", "OpenBot").
            Absent when OpenBot doesn't know.
        canManage:
          type: boolean
          description: Whether the caller may change and delete it.
        mine:
          type: boolean
          description: >-
            Whether the caller created it. Separate from canManage, which is
            also true for an administrator on everybody's Bots.
        assignedToMe:
          type: boolean
          description: Whether an administrator assigned this Bot to the caller.
        builtIn:
          type: boolean
          description: >-
            Whether it runs at the deployment's own managed address, so it
            needs no callback credential of its own.
        runsOnOpenBotModel:
          type: boolean
          description: >-
            Whether it runs on OpenBot's model, so a person can pick the model
            per conversation.
        keyFromOpenBot:
          type: boolean
          description: >-
            Whether OpenBot gives it a key for its tools on every run, because
            OpenBot runs it.
        isolationActive:
          type: boolean
          description: Whether its next run gets a computer of its own.
        isolationOffReason:
          type: [string, 'null']
          enum: [admin, deployment, null]
          description: >-
            Why an isolated Bot runs on a shared computer instead. admin: its
            owner no longer holds Isolated Bots. deployment: this deployment
            cannot make another computer. Null otherwise.
    BotPage:
      type: object
      required: [bots, nextCursor]
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    Reaction:
      type: object
      required: [messageId, agentId, emoji, createdAt]
      properties:
        messageId:
          type: string
          description: The person's message the reaction is on, by the id its conversation gives it.
        agentId:
          type: string
          description: The Bot that reacted.
        emoji:
          type: string
          description: The reaction itself.
          example: 👍
        createdAt:
          type: string
          format: date-time
    ReactionPage:
      type: object
      required: [reactions, nextCursor]
      properties:
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next page. Null ends the list. Written in
            URL-safe base64, the only form the cursor parameter accepts.
    BotResponse:
      type: object
      required: [bot]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
    SharedApp:
      type: object
      required: [serverId, title]
      properties:
        serverId:
          type: string
          description: The app's id.
        title:
          type: string
          description: The app's name.
    SharedAppsAfterChange:
      type: object
      description: >-
        What making a Bot public means for the shared app accounts it uses. An
        administrator's change approves them; anybody else's lists the ones an
        administrator still has to approve.
      required: [approved, needsApproval]
      properties:
        approved:
          type: array
          items:
            $ref: '#/components/schemas/SharedApp'
        needsApproval:
          type: array
          items:
            $ref: '#/components/schemas/SharedApp'
    UpdateBotResponse:
      type: object
      required: [bot]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
        sharedApps:
          $ref: '#/components/schemas/SharedAppsAfterChange'
    BotKey:
      type: object
      description: >-
        A key the Bot's address sits behind. Write-only: stored encrypted and
        never returned. A blank value sets no key.
      required: [value]
      properties:
        header:
          type: string
          pattern: ^[A-Za-z0-9-]*$
          description: The header it is sent in. Blank or absent means Authorization.
        value:
          type: string
          writeOnly: true
          description: The header's value.
    BotFields:
      type: object
      required: [name, title, roleDescription, visibility]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: What the Bot is called, 1 to 80 characters once trimmed.
        title:
          type: string
          maxLength: 120
          description: The subtitle under its name, up to 120 characters. May be empty.
        roleDescription:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            What it does, 1 to 1000 characters once trimmed. A Bot with no
            endpoint runs on these words.
        visibility:
          $ref: '#/components/schemas/BotVisibility'
        endpoint:
          type: string
          description: >-
            The AG-UI address it runs at: empty, or an absolute http or https
            address, the only kinds the server has ever taken. Empty or absent
            on create means it runs inside OpenBot; empty or absent on a
            change leaves it as it is. An address that fits can still be
            refused: the server refuses one this deployment may not reach,
            such as a private network address on a deployment that keeps Bots
            off it.
          anyOf:
            - type: string
              maxLength: 0
            - type: string
              format: uri
              pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
        auth:
          $ref: '#/components/schemas/BotKey'
        isolated:
          type: boolean
          description: >-
            Whether it gets a computer of its own. Absent leaves it as it is.
            True needs the owner's Isolated Bots switch.
        instructions:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            New instructions for the starter Bot, 1 to 1000 characters once
            trimmed. Absent leaves them as they are; every other Bot ignores
            them.
    CreateBotRequest:
      description: A new Bot.
      allOf:
        - $ref: '#/components/schemas/BotFields'
        - type: object
          properties:
            harness:
              type: string
              description: >-
                The framework an agent somebody runs themselves is built on,
                by its id in OpenBot's harness list (shared/harnesses.json),
                which the server checks every create against. Empty means none
                was named, as for an agent somebody already runs. "byo-url" is
                not one: it names no framework. Kept only with an endpoint.
              enum:
                - ''
                - crewai
                - llamaindex
                - agno
                - langgraph
                - google-adk
                - antigravity
                - pydantic-ai
                - microsoft-agent-framework
                - claude-agent-sdk
                - strands
                - ag2
                - langroid
                - mastra
    UpdateBotRequest:
      description: A Bot's fields after the change.
      allOf:
        - $ref: '#/components/schemas/BotFields'
    AuditFilterText:
      type: string
      maxLength: 4096
      pattern: ^[^\x00]*$
      description: >-
        Text a filter on the audit trail matches. Blank is no filter. It never
        holds a NUL character, which no event can.
    AuditEffect:
      type: string
      enum: [read, write]
      description: Whether an app call only reads, or changes something.
    AuditIntent:
      type: string
      description: What an action did, in the words of the boundary that judged it.
      enum:
        - activate
        - type
        - navigate
        - read
        - read_file
        - download_file
        - write_file
        - list_files
        - run_command
        - read_tool
        - write_tool
    AuditEvent:
      type: object
      description: >-
        One thing that happened, as the trail recorded it. Secrets are
        redacted from the payload before it is written.
      required:
        - id
        - actorUserId
        - initiatorKind
        - initiatorId
        - eventType
        - targetType
        - targetId
        - payload
        - createdAt
      properties:
        id:
          type: string
          description: The event's id.
        actorUserId:
          type: [string, 'null']
          description: >-
            The person whose authority it ran on, by user id. Null when it ran
            on nobody's, such as the deployment acting at start-up.
        initiatorKind:
          type: string
          description: >-
            What started it: person, deployment, routine, responsibility,
            memory or handoff. Read back as it was written, so an event from a
            later release may name another.
        initiatorId:
          type: [string, 'null']
          description: >-
            Which routine, responsibility, memory or Bot started it. Null when
            a person or the deployment did.
        eventType:
          type: string
          description: What happened, such as computer.action_refused.
        targetType:
          type: string
          description: The kind of thing it happened to, such as agent or computer.
        targetId:
          type: [string, 'null']
          description: The thing it happened to, by id. Null when it names none.
        payload:
          type: object
          additionalProperties: true
          description: What the event recorded. Its fields depend on eventType.
        createdAt:
          type: string
          format: date-time
          description: When it happened.
    AuditEventPage:
      type: object
      required: [auditEvents, nextCursor]
      properties:
        auditEvents:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type: [string, 'null']
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Pass as cursor for the next, older page. Null ends the list.
            Written in URL-safe base64, the only form the cursor parameter
            accepts.
    AuditVocabulary:
      type: object
      description: What a filter on the audit trail can name in this organization.
      required: [bots, people, apps, tools, rules]
      properties:
        bots:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        people:
          type: array
          items:
            type: object
            required: [id, name, email]
            properties:
              id:
                type: string
                description: Their user id, as actorUserId names them.
              name:
                type: [string, 'null']
              email:
                type: string
        apps:
          type: array
          description: Apps by their key (gmail), whichever way they were connected.
          items:
            type: object
            required: [key, name]
            properties:
              key:
                type: string
              name:
                type: string
                description: The app's name, as the Apps page shows it.
        tools:
          type: array
          description: The tools of each app, most called first.
          items:
            type: object
            required: [app, tool, calls]
            properties:
              app:
                type: string
                description: The app's key.
              tool:
                type: string
              calls:
                type: integer
                minimum: 0
                description: How many events the trail holds for it; 0 for a tool never called.
        rules:
          type: array
          description: >-
            Boundary rules: the policy's current ones, and any that refused
            something in the trail.
          items:
            type: object
            required: [rule, name, refusals]
            properties:
              rule:
                type: string
                description: The rule's text, as the rule filter takes it.
              name:
                type: [string, 'null']
                description: The name an administrator gave it, if any.
              refusals:
                type: integer
                minimum: 0
                description: How many refusals by it the trail holds.
    AuditQuestion:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^[^\x00]*$
          description: The question, 1 to 500 characters once trimmed.
        timeZone:
          type: string
          maxLength: 100
          description: >-
            Where the person asking is, as an IANA time zone (Europe/London),
            so yesterday is their yesterday. Absent or unknown means UTC.
    AuditFilters:
      type: object
      description: >-
        Filters on the audit trail, as listing audit events takes them, each
        list joined with commas: every filter narrows the events, and the
        values in a list are alternatives. Empty means every event.
      properties:
        eventType:
          type: array
          items:
            type: string
        bot:
          type: string
          description: One Bot, by id.
        actorUserId:
          type: string
        initiatorKind:
          type: array
          items:
            type: string
        app:
          type: array
          items:
            type: string
        tool:
          type: array
          items:
            type: string
        effect:
          $ref: '#/components/schemas/AuditEffect'
        intent:
          type: array
          items:
            $ref: '#/components/schemas/AuditIntent'
        rule:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    AuditFilterLabels:
      type: object
      description: >-
        The names for the values in a set of filters, so each reads as a name:
        Bots and people by id, apps by key, rules by their text.
      required: [bots, people, apps, rules]
      properties:
        bots:
          type: object
          additionalProperties:
            type: string
        people:
          type: object
          additionalProperties:
            type: string
        apps:
          type: object
          additionalProperties:
            type: string
        rules:
          type: object
          additionalProperties:
            type: string
    AuditAnswer:
      type: object
      description: >-
        A question about the trail, as filters. The events the filters list
        are the answer.
      required: [answerable, unanswered, filters, reading, labels]
      properties:
        answerable:
          type: string
          enum: ['yes', 'partly', 'no']
          description: Whether the trail answers all of the question, part of it, or none of it.
        unanswered:
          type: [string, 'null']
          description: What the trail can't answer, and why. Null when it answers all of it.
        filters:
          $ref: '#/components/schemas/AuditFilters'
        reading:
          type: [string, 'null']
          description: >-
            The filters read back in one line by a call that never saw the
            question. Null when the trail can't answer any of it.
        labels:
          $ref: '#/components/schemas/AuditFilterLabels'
    Problem:
      type: object
      description: >-
        RFC 9457 problem details, in the shape CopilotKit Intelligence's v2
        API uses. status equals the HTTP status; code and type name the same
        stable error. detail is the sentence a person reads.
      required:
        - type
        - title
        - status
        - detail
        - code
        - category
        - retryable
        - requestId
        - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
        category:
          type: string
          enum:
            - validation
            - auth
            - permission
            - not_found
            - conflict
            - rate_limit
            - internal
            - dependency
        retryable:
          type: boolean
        requestId:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        capability:
          type: string
          description: >-
            The switch an administrator can turn on for this person, when the
            refusal is for want of one (isolatedComputers).
  responses:
    InvalidRequest:
      description: A parameter is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: A Bot id is required.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidBot:
      description: >-
        A field is missing or out of bounds, the address is one this deployment
        may not reach, or the deployment cannot give a Bot a computer of its
        own.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            name:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Name must be text between 1 and 80 characters.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            noIsolation:
              value:
                type: https://open.bot/errors/isolation-unavailable
                title: This OpenBot can't give a Bot a computer of its own.
                status: 400
                detail: This OpenBot can't give a Bot a computer of its own, so it runs on yours.
                code: ISOLATION_UNAVAILABLE
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    Unauthenticated:
      description: The caller is not signed in.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://open.bot/errors/auth-unauthenticated
                title: Authentication is required.
                status: 401
                detail: Authentication required.
                code: AUTH_UNAUTHENTICATED
                category: auth
                retryable: false
                requestId: req_example
                traceId: trace_example
    Forbidden:
      description: The caller holds no role in this organization.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noRole:
              value:
                type: https://open.bot/errors/permission-denied
                title: Authorization required.
                status: 403
                detail: Authorization required.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    BotForbidden:
      description: >-
        The caller may not manage this Bot, the Bot comes with OpenBot, or the
        caller may not give it a computer of its own.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notYours:
              value:
                type: https://open.bot/errors/permission-denied
                title: You can't manage this Bot.
                status: 403
                detail: You can't manage this Bot.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
            isolation:
              value:
                type: https://open.bot/errors/capability-required
                title: Your admin hasn't turned on Isolated Bots for you.
                status: 403
                detail: Your admin hasn't turned on Isolated Bots for you.
                code: CAPABILITY_REQUIRED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
                capability: isolatedComputers
    AdminOnly:
      description: >-
        The caller is not an administrator of the organization, or holds no
        role in it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAdmin:
              value:
                type: https://open.bot/errors/permission-denied
                title: Permission denied.
                status: 403
                detail: Only an admin can do this.
                code: PERMISSION_DENIED
                category: permission
                retryable: false
                requestId: req_example
                traceId: trace_example
    InvalidAuditQuestion:
      description: >-
        The question is blank or longer than 500 characters once trimmed, holds
        a character OpenBot can't keep, or a parameter is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            blank:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Ask a question first.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
            long:
              value:
                type: https://open.bot/errors/validation-error
                title: Request validation failed.
                status: 400
                detail: Keep the question under 500 characters. Ask one thing at a time.
                code: VALIDATION_ERROR
                category: validation
                retryable: false
                requestId: req_example
                traceId: trace_example
    AuditQuestionNotUnderstood:
      description: >-
        The model's filters still failed their check on its second try, so
        none are given.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notUnderstood:
              value:
                type: https://open.bot/errors/question-not-understood
                title: Couldn't turn that question into filters.
                status: 422
                detail: Couldn't turn that question into filters. Ask it another way, or set the filters yourself.
                code: QUESTION_NOT_UNDERSTOOD
                category: validation
                retryable: false
