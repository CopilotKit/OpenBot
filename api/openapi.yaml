openapi: 3.1.1
info:
  title: OpenBot API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |-
    The one API every OpenBot client uses: the web app, Desktop, mobile, the Recorder and the CLI. It follows the conventions of CopilotKit Intelligence's v2 API so both read as one API, and OpenBot's resources sit beside Intelligence's under the same organization address (/api/v2/organizations/{organizationId}/...). Errors are RFC 9457 problem details (application/problem+json), lists page with an opaque cursor and a limit, and every write takes an Idempotency-Key.

    Until multi-organization lands, an OpenBot install has exactly one organization, and organizationId is that organization. Clients address it as `default`; the server treats any other value as an organization that does not exist.

    This file is the single source of truth: the clients, the server's types, the docs and the contract tests are all generated from it or checked against it. A change that breaks an existing client fails the pull request.
servers:
  - url: http://127.0.0.1:3001
    description: An OpenBot server on this machine (the default local port).
tags:
  - name: Bots
    description: 'The Bots a person can see: their own, those shared with them, the ones an administrator assigned them, and the ones that come with OpenBot.'
  - name: Reactions
    description: The reactions a Bot leaves on a person's message in place of a line of its own, when the message only needs an acknowledgement.
  - name: Audit events
    description: 'The audit trail: what people and Bots did in the organization, and what its policy refused, newest first. Only an administrator can read it. It is read-only: events are written by what they record, never through the API.'
  - name: People
    description: 'The people in the organization: who they are, what they may do, and what is theirs alone (their standing instructions, preferences and first-run onboarding). An administrator sees everybody; anybody else sees themselves, as me.'
  - name: Linked accounts
    description: A person's accounts at other services, such as Slack and GitHub, that OpenBot knows are theirs, so a Bot answering there knows who it is talking to.
  - name: Identity providers
    description: The companies' own identity providers registered for single sign-on, by email domain. Only an administrator manages them.
  - name: API keys
    description: The keys a person makes for automation. A key acts as them, inside the organization, on the API only, and only a person signed in to OpenBot can make or manage one.
  - name: Sessions
    description: Where a person is signed in to OpenBot, so they can see each browser and device and sign one out.
  - name: Organization settings
    description: 'What an administrator sets for everybody, and what this OpenBot offers: sign-in, recording, idle computers, allowlists, the setup checklist, and which models Bots ran on.'
  - name: Capabilities
    description: The permission switches that decide what people may do, set for the organization, a role or a directory group, and each person's answer.
  - name: Network policies
    description: Where Bot computers may connect, for the organization and for a directory group.
  - name: Conversations
    description: A person's conversations with Bots. What a Bot is doing in one streams over a WebSocket, described in api/asyncapi.yaml; the operations here hand out what that socket needs.
  - name: Credentials
    description: 'The vault: the model keys, app keys and app tokens OpenBot keeps encrypted for its Bots. A secret goes in and is never read back out. Only an administrator manages them.'
  - name: Models
    description: The models Bots can run on, and the one a person chose for each of their conversations.
  - name: Apps
    description: The apps this OpenBot has added for its Bots to use, from the directory of apps it can add or by a server's address, and how apps are set up here.
  - name: Connections
    description: 'A person''s connections to apps: the accounts they signed in with so their Bots can act there for them, and an app''s one shared account when an administrator connects it for everybody.'
  - name: Bot grants
    description: 'What each Bot may use: the app actions, skills and other Bots it was given, and each app as it stands for the person asking.'
  - name: App access requests
    description: A person asking an administrator to turn an app on, give it to a Bot, or connect its shared account.
  - name: Devices
    description: The phones a person signed in to the OpenBot app on and turned notifications on for, which their Bots send push notifications to.
  - name: Destinations
    description: 'Where a person continues a conversation with a Bot outside OpenBot: a Slack or Microsoft Teams chat, or a phone number for text messages.'
  - name: Deliveries
    description: What Bots sent a person outside OpenBot, and where each one got to.
  - name: Notification settings
    description: 'How a person hears from their Bots while they''re away: which ways each kind of update may use, how much each Bot may send, and which ways this deployment can reach anyone at all.'
paths:
  /api/v2/organizations/{organizationId}/reactions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - Reactions
      operationId: listReactions
      summary: List reactions in a conversation
      description: Return one page of the reactions Bots left on the caller's messages in one of their conversations, named by its thread. Another person's thread answers with an empty list. A missing cursor starts at the first page and nextCursor null ends the list. Today's server returns every reaction on the first page.
      security:
        - webSession: []
        - appOAuth:
            - reactions:read
        - apiKey: []
      parameters:
        - name: threadId
          in: query
          required: true
          description: The conversation's thread, as its messages name it.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of reactions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/ReactionPageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - Bots
      operationId: listBots
      summary: List Bots
      description: 'Return one page of the Bots the caller can see: theirs, the ones shared with them, the ones assigned to them and the ones that come with OpenBot, in the order the server keeps them. hidden=true lists only the Bots the caller hid from their own list instead. A missing cursor starts at the first page and nextCursor null ends the list. Today''s server returns every Bot on the first page.'
      security:
        - webSession: []
        - appOAuth:
            - bots:read
        - apiKey: []
      parameters:
        - name: hidden
          in: query
          description: List the Bots the caller hid instead of the ones they did not.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of Bots.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/BotPageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags:
        - Bots
      operationId: createBot
      summary: Create a Bot
      description: Create a Bot owned by the caller. With no endpoint it runs inside OpenBot on its role description; with one, OpenBot sends each turn to that AG-UI address, which the server checks before saving. A key, when given, is stored encrypted and never returned. Asking for isolated needs the caller's Isolated Bots switch and a deployment that can give a Bot a computer of its own. A repeated request with the same Idempotency-Key and body returns the first result.
      security:
        - webSession: []
        - appOAuth:
            - bots:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
            examples:
              builtIn:
                summary: A Bot that runs inside OpenBot.
                value:
                  name: Expense Review
                  title: Finance Operations
                  roleDescription: Review receipts, categorize expenses, and prepare reimbursement reports.
                  visibility: private
              ownAgent:
                summary: An agent somebody runs themselves, behind a key.
                value:
                  name: Expense Review
                  title: ''
                  roleDescription: Review receipts.
                  visibility: private
                  endpoint: https://agents.example.com/ag-ui
                  auth:
                    header: Authorization
                    value: Bearer example-key
                  harness: langgraph
      responses:
        '201':
          description: The Bot was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              description: The new Bot's address.
              schema:
                type: string
              example: /api/v2/organizations/default/bots/agent_9b1c6f0e-7f0e-4c1e-9d55-2f4a8c1b6e21
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                created:
                  $ref: '#/components/examples/CreatedBot'
        '400':
          $ref: '#/components/responses/InvalidBot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/bots/{botId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/BotId'
    get:
      tags:
        - Bots
      operationId: getBot
      summary: Read one Bot
      description: Return one Bot the caller can see. A Bot that does not exist, was deleted, or is private to somebody else is not found.
      security:
        - webSession: []
        - appOAuth:
            - bots:read
        - apiKey: []
      responses:
        '200':
          description: The Bot.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
              examples:
                starter:
                  $ref: '#/components/examples/StarterBot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      tags:
        - Bots
      operationId: updateBot
      summary: Change a Bot
      description: Replace a Bot's name, title, role description and visibility, which are all required, and change any optional field that is present. An absent endpoint, key or isolated leaves that setting as it is, so an edit to a name never drops a key or moves a Bot between computers. Only whoever may manage the Bot may change it, and a Bot that comes with OpenBot cannot be changed. Making a Bot public reports what that means for the shared app accounts it uses.
      security:
        - webSession: []
        - appOAuth:
            - bots:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotRequest'
            examples:
              rename:
                value:
                  name: Expense Review Desk
                  title: Finance Operations
                  roleDescription: Review receipts, categorize expenses, and prepare reimbursement reports.
                  visibility: private
      responses:
        '200':
          description: The changed Bot.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBotResponse'
              examples:
                renamed:
                  $ref: '#/components/examples/CreatedBot'
                published:
                  $ref: '#/components/examples/PublishedBot'
        '400':
          $ref: '#/components/responses/InvalidBot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags:
        - Bots
      operationId: deleteBot
      summary: Delete a Bot
      description: Delete a Bot for everyone and retire its key. Conversations with it stay readable. Only whoever may manage the Bot may delete it, and a Bot that comes with OpenBot cannot be deleted. A Bot that is already deleted is not found.
      security:
        - webSession: []
        - appOAuth:
            - bots:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The Bot was deleted.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BotForbidden'
        '404':
          $ref: '#/components/responses/BotNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - Audit events
      operationId: listAuditEvents
      summary: List audit events
      description: Return one page of the audit trail, newest first, narrowed by the filters given. Each filter narrows the events, and a filter that takes several values separated by commas matches any of them. A value that names nothing in the trail matches no event rather than being refused. A missing cursor starts at the newest event and nextCursor null ends the list. A cursor belongs to the filters that made it, so changing a filter starts again without one; limit may change from page to page. Only an administrator may read the trail.
      security:
        - webSession: []
        - appOAuth:
            - audit-events:read
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AuditEventTypes'
        - $ref: '#/components/parameters/AuditExcludedEventTypes'
        - $ref: '#/components/parameters/AuditExcludedCalls'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditInitiatorKinds'
        - $ref: '#/components/parameters/AuditTargetTypes'
        - $ref: '#/components/parameters/AuditTargetId'
        - $ref: '#/components/parameters/AuditBots'
        - $ref: '#/components/parameters/AuditApps'
        - $ref: '#/components/parameters/AuditTools'
        - $ref: '#/components/parameters/AuditEffect'
        - $ref: '#/components/parameters/AuditIntents'
        - $ref: '#/components/parameters/AuditRule'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: One page of audit events.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
              examples:
                firstPage:
                  $ref: '#/components/examples/AuditEventPageFirst'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/audit-events/export:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - Audit events
      operationId: exportAuditEvents
      summary: Export audit events as CSV
      description: 'Return every event the filters match, newest first, as one CSV file (RFC 4180): the same filters as listing audit events, without its paging, so the file and the list agree. The file holds at most 5,000 events; when more match, OpenBot-Export-Truncated says how many it holds, and narrowing the dates exports the rest. A cell a spreadsheet would run as a formula starts with an apostrophe. Each export is recorded on the trail. Only an administrator may export the trail.'
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth:
            - audit-events:read
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/AuditEventTypes'
        - $ref: '#/components/parameters/AuditExcludedEventTypes'
        - $ref: '#/components/parameters/AuditExcludedCalls'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditInitiatorKinds'
        - $ref: '#/components/parameters/AuditTargetTypes'
        - $ref: '#/components/parameters/AuditTargetId'
        - $ref: '#/components/parameters/AuditBots'
        - $ref: '#/components/parameters/AuditApps'
        - $ref: '#/components/parameters/AuditTools'
        - $ref: '#/components/parameters/AuditEffect'
        - $ref: '#/components/parameters/AuditIntents'
        - $ref: '#/components/parameters/AuditRule'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: The matching events as CSV, one header row and one row per event. The columns are id, createdAt, eventType, actorUserId, initiatorKind, initiatorId, targetType, targetId, decisionAllowed, decisionRule, bot and payload, the event's payload as JSON.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Content-Disposition:
              description: An attachment named after the day it was exported.
              schema:
                type: string
              example: attachment; filename="audit-events-2026-11-14.csv"
            OpenBot-Export-Truncated:
              description: 'Present only when more events matched than the file holds: the number of events it holds.'
              schema:
                type: integer
                minimum: 1
              example: 5000
          content:
            text/csv:
              schema:
                type: string
              example: |
                id,createdAt,eventType,actorUserId,initiatorKind,initiatorId,targetType,targetId,decisionAllowed,decisionRule,bot,payload
                0b8f3a52-5d0e-4f5c-9a43-1c2b6c3e9f10,2026-11-14T09:12:44.501Z,computer.action_refused,,routine,routine_7f2c,computer,research-assistant,false,network.deny,research-assistant,"{""bot"":""research-assistant"",""decision"":{""allowed"":false,""rule"":""network.deny""}}"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/audit-events/vocabulary:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - Audit events
      operationId: getAuditEventVocabulary
      summary: Read what the audit filters can name
      description: 'Return what a filter on the audit trail can name in this organization: its Bots, its people, the apps and tools the trail has seen, and the boundary rules, both the policy''s current ones and any that refused something in the trail. These are the only values a question asked of the trail can turn into. Only an administrator may read it.'
      x-openbot-singleton: true
      security:
        - webSession: []
        - appOAuth:
            - audit-events:read
        - apiKey: []
      responses:
        '200':
          description: What the audit filters can name.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVocabulary'
              examples:
                vocabulary:
                  $ref: '#/components/examples/AuditVocabularyExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/audit-events/ask:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags:
        - Audit events
      operationId: askAuditEvents
      summary: Ask the audit trail a question
      description: 'Turn a question in English into filters on the audit trail. The deployment''s model chooses the filters and never answers the question itself: the events the filters list are the answer. Every filter is checked against what the trail can name (getAuditEventVocabulary), and filters that still fail on the model''s second try are refused, never guessed at. A second call that never sees the question reads the filters back in one line. Nothing changes but the trail, which records each question with the filters it became. Only an administrator may ask. A repeated request with the same Idempotency-Key and body returns the first answer without asking the model again.'
      security:
        - webSession: []
        - appOAuth:
            - audit-events:read
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditQuestion'
            examples:
              blocked:
                value:
                  question: What did the Research Assistant try to do yesterday that was blocked?
                  timeZone: Europe/London
      responses:
        '200':
          description: The filters the question became, or why the trail can't answer it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAnswer'
              examples:
                answered:
                  $ref: '#/components/examples/AuditAnswerExample'
        '400':
          $ref: '#/components/responses/InvalidAuditQuestion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/AuditQuestionNotUnderstood'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ModelFailed'
        '503':
          $ref: '#/components/responses/ModelNotConfigured'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - People
      operationId: listPeople
      summary: List people
      description: Return one page of the people in the organization, the most recently signed in first. An administrator sees everybody who has signed in; anybody else sees only themselves. search narrows the list to people whose address or name holds it, ignoring case. A missing cursor starts at the first page and nextCursor null ends the list. A cursor belongs to the search that made it, so changing the search starts again without one; limit may change from page to page.
      security:
        - webSession: []
        - appOAuth:
            - people:read
        - apiKey: []
      parameters:
        - name: search
          in: query
          description: Part of an address or a name, matched without regard to case.
          schema:
            type: string
            maxLength: 200
            pattern: ^[^\x00]*$
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of people.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/PersonPageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/organizations/{organizationId}/people/{personId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/PersonId'
    get:
      tags:
        - People
      operationId: getPerson
      summary: Get a person
      description: 'Return one person: the caller, as me or by their own id, or for an administrator anybody in the organization. Somebody who is not an administrator asking about anybody else is refused, whether or not that person exists. The answer also carries the OpenBot release the server runs, which the apps show under the person''s name.'
      security:
        - webSession: []
        - appOAuth:
            - people:read
