      description: 'Say what a set of one app''s actions would change for a Bot against what it has now, and what that would have meant for its recent calls to the app: actions it used that the set takes away, and actions it was refused that the set gives. Nothing is saved. report is null where OpenBot keeps no audit trail it can read. Only an administrator may ask.'
