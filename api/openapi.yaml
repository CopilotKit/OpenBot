            application/json:
              schema:
                $ref: '#/components/schemas/AppPage'
              examples:
                lastPage:
                  $ref: '#/components/examples/AppPageExample'
                $ref: '#/components/schemas/DevicePage'
              examples:
                lastPage:
                  $ref: '#/components/examples/DevicePageLast'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
          $ref: '#/components/responses/OwnOnly'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags:
        - Apps
      operationId: createApp
      summary: Add an app
      description: 'Add an app in one of two ways. With from=directory, add an entry of listAppDirectory: a catalogue entry, with the instance host or vault credential it needs, or an app from the wider directory. Only an administrator may. With from=address, add a server by its HTTPS address, and anybody signed in may. OpenBot asks the server how it is reached first. It refuses an address the MCP allowlist doesn''t approve, a server that needs a key nobody gave, and an address already added, naming that app in the problem''s appId. Only an administrator may give a server a key, because every Bot that uses the server uses it. A server that signs each person in answers with signIn true, and each person then connects their own account. Answers 201 with the app. Adding a directory entry that is already added updates that app with what the request names, and answers it the same way. A repeated request with the same Idempotency-Key and body returns the first result.'
      security:
        - webSession: []
        - appOAuth:
            - apps:write
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
            examples:
              catalogue:
                summary: A catalogue entry reached with a vault credential.
                value:
                  from: directory
                  directoryEntryId: catalogue:exa-authenticated
                  credentialId: 3b9a5f8e-6c1d-4e2a-9f47-1d2c3b4a5e6f
              directory:
                summary: An app from the wider directory.
                value:
                  from: directory
                  directoryEntryId: directory:linear
              address:
                summary: A server added by its address.
                value:
                  from: address
                  title: Acme Wiki
                  url: https://mcp.acme.com/mcp
      responses:
        '201':
          description: The app was added.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              description: The new app's address.
              schema:
                type: string
              example: /api/v2/organizations/default/apps/acme-wiki
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
              examples:
                address:
                  $ref: '#/components/examples/AddressAppExample'
        '400':
          $ref: '#/components/responses/InvalidApp'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AppAddForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/AppAddConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/AppServiceFailed'
        '503':
          $ref: '#/components/responses/AppDirectoryUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
