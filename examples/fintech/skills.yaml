# Skills this deployment ships, and the tools each one needs.
#
# A skill is a named instruction anybody here can invoke with `/`. It adds no capability: it can only
# ask a Bot to use what that Bot was already granted, and every one of those calls is still decided,
# policy-checked and recorded.
#
# `tools:` is the second thing a skill is for, and the reason this file exists rather than a screen.
# A Bot holding more than a handful of tools is offered, per run, only the tools of the skills that
# match the message, because a model picks the right tool reliably out of about ten and unreliably
# out of thirty. That matching needs skills to match against, and a deployment starts with none — so
# left to a screen, the narrowing is switched off on every clone until somebody maps tools to skills
# by hand, in each deployment, again after each new connector. Shipping the declaration with the
# skill is what makes connecting a connector the only step.
#
# NAMING A TOOL HERE GRANTS NOBODY ANYTHING. What a Bot may call is its grants, and the offer is
# always intersected with them: a skill naming a tool its Bot does not hold loads nothing. So this
# file may name tools for connectors this deployment has not added, and should — that is what makes
# them work the moment somebody does.
#
# Refs are `<serverId>/<toolName>`, the same form a grant is written in. `google-drive` and `notion`
# are catalogue connectors; a server an administrator adds by URL uses the id it was given.
skills:
  - slug: find-a-document
    title: Find a document
    summary: Search the connected document sources for a file and read what it says.
    instructions: >-
      Find the document the person is asking about before answering anything about its contents.
      Search first, then read the file you found rather than answering from its title. If the search
      returns nothing, say so and say what you searched for, rather than guessing at what the
      document might contain. Name the document you used.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content
      - google-drive/get_file_metadata

  - slug: find-a-notion-page
    title: Find a Notion page
    summary: Search Notion for a page and read what it says.
    instructions: >-
      Find the Notion page the person is asking about before answering anything about its contents.
      Search first, then fetch the page you found rather than answering from its title. If the search
      returns nothing, say so and say what you searched for, rather than guessing at what the page
      might contain. Name the page you used.
    tools:
      - notion/notion-search
      - notion/notion-fetch

  - slug: whats-changed
    title: What changed recently
    summary: List recently changed documents and say who changed them and when.
    instructions: >-
      List what has changed recently in the sources you can reach, newest first. Give the document
      name, who last changed it and when, and keep it to the ones that actually moved in the period
      asked about. Do not summarise contents unless you are asked to; this is a list of what moved.
    tools:
      - google-drive/list_recent_files
      - google-drive/get_file_metadata

  - slug: who-owns-this
    title: Who owns this
    summary: Find who owns a document and when they last touched it.
    instructions: >-
      Identify the owner of the document being asked about, and say when it was last changed. Search
      for the document first if you were given a name rather than a link. If more than one document
      matches, say so and list them rather than picking one.
    tools:
      - google-drive/search_files
      - google-drive/get_file_metadata

  - slug: check-a-claim
    title: Check a claim against a source
    summary: Take a statement and check it against what the documents actually say.
    instructions: >-
      You are checking a claim, not answering a question. Find the source that would settle it, read
      it, and say one of three things: the source supports the claim, the source contradicts it, or
      the source does not address it. Quote the sentence you are relying on. Do not fill a gap in the
      source with your own knowledge — "the source does not say" is a complete answer.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content

  # Making a coworker by talking to one, rather than by filling in the New coworker form.
  #
  # DECLARES NO TOOLS, and that is not an omission. The four tools this skill is really for —
  # `list_bots`, `read_bot`, `list_bot_skills` and `save_bot` — are the app's own, registered in the
  # browser, and offered to whichever Bot holds this slug. `tools:` here is intersected with a Bot's
  # MCP GRANTS, so naming them would name nothing. The grant of this skill is the whole gate.
  - slug: bot-creator
    title: Make a coworker
    summary: Work out what a new coworker should be, then put it in front of you to create.
    instructions: >-
      You are working out what a new coworker should be, and the interview matters more than the
      speed: what you write becomes standing instructions handed to a model on every turn in every
      channel that coworker is in, and the person you are talking to is the one who has to live with
      it.

      Start by calling list_bots. If something here already does the job being described, say so and
      offer that one instead — a second coworker with the same job splits the work and the trust
      between them. Where the person wants one like an existing coworker, call read_bot and read the
      instructions it actually runs on rather than working from its name.

      Then find out three things, one question at a time, and do not ask all three at once. What
      job it does, in the words the person would use. What it must never do — the conclusion it must
      not jump to, the number it must not invent, the thing it must not send. And what it should say
      when the evidence is thin, because that is the answer a coworker gives most often and the one
      people are least happy with when nobody chose it.

      Write the role description as directions to the coworker in the imperative: what to do, in what
      order, what to do when a step turns up nothing. Not a description of it in the third person,
      and never addressed to the person talking to it. Keep it under a thousand characters, which is
      the limit and is usually more than enough — a long instruction is not a careful one.

      Call list_bot_skills and offer only the skills that fit the job. Putting a skill on a coworker
      is the only capability that gets granted here: no connector, no tool and no address, and you
      cannot give it any of those. Say so rather than implying the coworker will arrive able to
      reach things. Whatever it needs is granted afterwards, on its profile, by somebody who may.

      Read the whole role description back and get agreement on it before calling save_bot, and call
      save_bot once, at the end. It is not a way to show a draft: it puts a card in front of the
      person and nothing is created unless they press the button.
    tools: []
