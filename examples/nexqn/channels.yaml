# `allowed_groups` is stored and enforces nothing yet; access is decided by channel membership.
# See docs/configuration.md#channelsyaml.
channels:
  - id: general-assistant
    name: General Assistant
    description: Ask for help with everyday work.
    permitted_agents: [general-assistant]
    allowed_groups: [all]
  - id: company-knowledge
    name: Company Knowledge
    description: Find authorized answers from company documents.
    permitted_agents: [knowledge]
    allowed_groups: [all]
  - id: research
    name: Research
    description: Research a question on the public web, with sources.
    permitted_agents: [research]
    allowed_groups: [all]
