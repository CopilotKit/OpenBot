        @property --angle {
          syntax: "<angle>";
          inherits: false;
          initial-value: 0deg;
        }

        .agent-orb {
          display: grid;
          grid-template-areas: "stack";
          overflow: hidden;
          border-radius: 50%;
          position: relative;
          isolation: isolate;
        }

        .agent-orb::before,
        .agent-orb::after,
        .agent-orb > .agent-orb-layer {
          content: "";
          display: block;
          grid-area: stack;
          width: 100%;
          height: 100%;
          border-radius: 50%;
        }

        /* Glassy highlight that drifts, so the sheen never sits still enough to
           read as a printed-on gradient. */
        .agent-orb-sheen {
          background:
            radial-gradient(circle at 30% 24%, hsl(0 0% 100% / 0.32), transparent 34%),
            radial-gradient(circle at 72% 80%, hsl(0 0% 100% / 0.07), transparent 48%);
          mix-blend-mode: screen;
          animation: agent-drift var(--drift-duration) ease-in-out infinite alternate;
        }

        /* Lit top edge, shaded bottom, thin inner ring. */
        .agent-orb-rim {
          box-shadow:
            inset 0 0 0 1px hsl(0 0% 100% / 0.16),
            inset 0 calc(var(--rim) * 1) calc(var(--rim) * 2) hsl(0 0% 100% / 0.22),
            inset 0 calc(var(--rim) * -1.2) calc(var(--rim) * 2.4) hsl(0 0% 0% / 0.4);
          pointer-events: none;
        }

        @keyframes agent-drift {
          0% { transform: translate(-6%, -4%) scale(1.05); }
          100% { transform: translate(7%, 6%) scale(1.12); }
        }

        .agent-orb::before {
          background:
            conic-gradient(
              from calc(var(--angle) * 2) at 25% 70%,
              var(--c3),
              transparent 20% 80%,
              var(--c3)
            ),
            conic-gradient(
              from calc(var(--angle) * 2) at 45% 75%,
              var(--c2),
              transparent 30% 60%,
              var(--c2)
            ),
            conic-gradient(
              from calc(var(--angle) * -3) at 80% 20%,
              var(--c1),
              transparent 40% 60%,
              var(--c1)
            ),
            conic-gradient(
              from calc(var(--angle) * 1.5) at 60% 35%,
              var(--c4),
              transparent 25% 75%,
              var(--c4)
            ),
            conic-gradient(
              from calc(var(--angle) * 2) at 15% 5%,
              var(--c2),
              transparent 10% 90%,
              var(--c2)

            conic-gradient(
              from calc(var(--angle) * 1) at 20% 80%,
              var(--c1),
              transparent 10% 90%,
              var(--c1)

            conic-gradient(

 account:{name:'Account',title:'Get your free license key',lede:'OpenBot needs a free license key. Sign in to get one.',section:0,time:'0:21',states:[['waiting','Waiting for browser'],['checking','Checking account'],['signed','Signed in']],description:'Keep the heading in place. Center the compact sign-in interaction in the space below it; keep the code, browser link and Cancel together.',notes:['Heading stays aligned','Short form sits lower','One grouped interaction']},

let active='account',mode='proposed',state='waiting',theme='dark',width=1000,selectedDay='';
const el=id=>document.getElementById(id);
const spinner='<span class="spinner" aria-hidden="true"></span>';
const btn=(text,action,quiet=false,disabled=false)=>'<button class="btn '+(quiet?'quiet':'')+'"'+(action?' data-action="'+action+'"':'')+(disabled?' disabled':'')+'>'+text+'</button>';
const link=(text,action)=>'<button class="link" data-action="'+action+'">'+text+'</button>';
const progress=(amount)=>'<div class="progress" role="progressbar" aria-label="Download progress" aria-valuenow="'+amount+'" aria-valuemin="0" aria-valuemax="100" style="--amount:'+amount+'%"><span></span></div>';
function rail(section){let rows='';['Account','Install','AI','Start'].forEach((name,i)=>{const cls=i<section?'done':i===section?'current':'';rows+='<li class="'+cls+'"><span class="mark" aria-hidden="true"></span>'+name+'</li>'});const background=['account','license','ai'].includes(active);return '<aside class="rail" aria-label="Setup"><div class="brand"><div class="orb"><div class="agent-orb" data-still style="'+orbStyle+'"><span class="agent-orb-layer agent-orb-sheen"></span><span class="agent-orb-layer agent-orb-rim"></span></div></div><span>OpenBot<sup>™</sup></span></div><h2>Set up OpenBot</h2>'+(section>=0?'<ol class="sections">'+rows+'</ol>':'<div class="muted small" style="padding:10px 12px">OpenBot for Business</div>')+(background?'<div class="rail-foot"><strong class="rail-label">Preparing OpenBot</strong><p>Downloading OpenBot.</p>'+progress(65)+'<p class="tiny">568.9 MB of 872.8 MB</p></div>':'')+'</aside>'}
function account(){let body='';if(state==='checking')body='<div class="status">'+spinner+'Checking your OpenBot account…</div>';else if(state==='signed')body='<div class="status"><span class="success-icon">✓</span>Signed in to OpenBot.</div>'+btn('Continue','license');else body='<h3>Finish signing in to OpenBot in your browser</h3><div class="status">'+spinner+'Waiting for you to finish signing in…</div><div class="device-code"><span>Check that the page shows this code</span><strong>DEMO–1234</strong></div>'+link('Open the sign-in page','check')+'<p class="tiny" style="margin:16px 0 0">If your browser shows a dashboard after you choose an organization, open the sign-in page again.</p><div class="actions">'+btn('Cancel','cancel',true)+'</div>';return '<div class="work-area"><div class="content-block"><p class="small">Signing in gets your free license key and sets up your apps. OpenBot keeps your conversations and files on this computer.</p><div class="auth-box">'+body+'</div></div></div>'}
function license(){return '<div class="work-area"><div class="content-block"><div class="auth-box"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="margin-bottom:18px;color:var(--ob-muted-foreground)"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><p style="color:var(--ob-foreground)">To run OpenBot on this computer, accept the OpenBot by CopilotKit license agreement.</p>'+link('Read the license agreement','terms')+'<div id="terms" hidden class="small muted" style="margin-top:16px">In the app, this opens the license agreement for you to read.</div><div class="actions">'+btn('Accept','install')+'</div></div></div></div>'}
function ai(){let inner='<div class="auth-tabs"><button data-action="plan" class="'+(state!=='key'?'selected':'')+'">Sign in with my plan</button><button data-action="key" class="'+(state==='key'?'selected':'')+'">Use an API key</button></div>';if(state==='key')inner+='<label for="keyInput">Anthropic API key</label><input id="keyInput" type="password" placeholder="Enter your API key" autocomplete="off"><p class="small">Use an Anthropic API key for your Bots.</p>';else inner+='<p class="small">Approve the request in your browser. Anthropic will finish this on its own.</p><div class="status">'+(state==='signed'?'<span class="success-icon">✓</span>Signed in to Anthropic. Your plan will be used.':spinner+'Waiting for you to approve it…')+'</div>'+(state==='signed'?'':'<p style="margin:16px 0 0" class="small">Didn’t open? '+link('Open the sign-in page','sign')+'</p>')+'<p class="tiny" style="margin:22px 0 0">A Claude plan carries a separate monthly pool of Agent SDK credits. When that pool is empty, Bots stop until it renews or you add API credits. '+link('What this means','help')+'</p>';return '<div class="provider"><span class="provider-mark"><img alt="" width="26" height="26" src="data:image/svg+xml;base64,PHN2ZyBmaWxsPSJjdXJyZW50Q29sb3IiIGZpbGwtcnVsZT0iZXZlbm9kZCIgaGVpZ2h0PSIxZW0iIHN0eWxlPSJmbGV4Om5vbmU7bGluZS1oZWlnaHQ6MSIgdmlld0JveD0iMCAwIDI0IDI0IiB3aWR0aD0iMWVtIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0aXRsZT5BbnRocm9waWM8L3RpdGxlPjxwYXRoIGQ9Ik0xMy44MjcgMy41MmgzLjYwM0wyNCAyMGgtMy42MDNsLTYuNTctMTYuNDh6bS03LjI1OCAwaDMuNzY3TDE2LjkwNiAyMGgtMy42NzRsLTEuMzQzLTMuNDYxSDUuMDE3bC0xLjM0NCAzLjQ2SDBMNi41NyAzLjUyMnptNC4xMzIgOS45NTlMOC40NTMgNy42ODcgNi4yMDUgMTMuNDhIMTAuN3oiPjwvcGF0aD48L3N2Zz4="></span><div><strong>Anthropic</strong><p>Sign in with a Claude Pro, Max, Team or Enterprise plan.</p></div>'+link('Change','change')+'</div><div class="work-area"><div class="content-block auth-box">'+inner+'</div></div><div class="pane-actions">'+btn('Continue','finish',false,state==='waiting')+'</div>'}
function taskList(rows){return '<ul class="task-list">'+rows.map(name=>'<li><span class="tick">✓</span><span>'+name+'</span><span class="value">Complete</span></li>').join('')+'</ul>'}
function install(){let title=state==='unpack'?'Unpacking OpenBot':'Downloading OpenBot';return '<div class="work-area"><div class="content-block"><div class="current-progress"><h3>'+spinner+title+'</h3><p>Less than a minute left</p>'+progress(state==='unpack'?100:65)+'<p class="tiny">'+(state==='unpack'?'872.8 MB downloaded':'568.9 MB of 872.8 MB')+'</p></div>'+taskList(['Preparing this computer'])+'</div></div><div class="pane-actions">'+btn('Cancel','cancel',true)+'</div>'}
function finish(){const title=state==='last'?'Starting OpenBot’s apps':state==='start'?'Starting the software OpenBot runs on':'Preparing where OpenBot keeps your data';const rows=state==='last'?['Setting up OpenBot','Connecting OpenBot','Getting OpenBot ready']:state==='start'?['Setting up OpenBot','Connecting OpenBot']:[];return '<div class="work-area"><div class="content-block"><div class="current-progress"><h3>'+spinner+title+'</h3><p>'+(state==='data'?'About 3 minutes left':'About a minute left')+'</p>'+progress(state==='last'?82:state==='start'?63:32)+'</div>'+(rows.length?taskList(rows):'')+'<div class="actions">'+(state==='last'?'<p class="cancel-note">You can’t cancel this last step. Stopping it partway could leave OpenBot half started.</p>':btn('Cancel','cancel',true))+'</div></div></div><label class="telemetry"><input type="checkbox" checked><span>Help make OpenBot better by sharing diagnostics like errors, hangs, updates and available memory, never any content. OpenBot is built to respect your privacy. '+link('What OpenBot sends','help')+'</span></label>'}
function booking(){let content='<div class="status">'+spinner+'<span>Loading available times…</span></div>';if(state==='loaded'){content='<div class="calendar"><h3>Select a day</h3><div class="month">November 2026</div><div class="days">'+['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>'<span class="weekday">'+d+'</span>').join('');content+='<span></span>'.repeat(6);for(let i=1;i<=30;i++)content+='<button class="day '+([25,26,27,30].includes(i)?'available ':'')+(selectedDay===String(i)?'picked':'')+'" data-day="'+i+'" '+(![25,26,27,30].includes(i)?'disabled':'')+'>'+i+'</button>';content+='</div><p class="tiny muted" style="margin:22px 0 0">Pacific Time — US &amp; Canada</p>'+(selectedDay?'<p class="small" style="margin-top:16px">Selected November '+selectedDay+'</p>':'')+'</div>'}return '<div class="work-area"><div class="booking-frame">'+content+'</div></div><div class="pane-actions">'+btn('Back','account',true)+'</div>'}
function render(){const s=screens[active];el('tabs').innerHTML=Object.keys(screens).map(key=>'<button role="tab" aria-selected="'+(active===key)+'" data-screen="'+key+'">'+screens[key].name+'</button>').join('');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(mode===b.dataset.mode)));el('stateLabel').style.display=s.states.length&&mode==='proposed'?'flex':'none';el('state').innerHTML=s.states.map(pair=>'<option value="'+pair[0]+'" '+(state===pair[0]?'selected':'')+'>'+pair[1]+'</option>').join('');const height=width===720?560:800;el('stage').style.width=width+'px';el('stage').style.height=height+'px';el('stage').innerHTML=mode==='recorded'?'<img class="recorded" alt="Recorded '+s.name+' screen at '+s.time+'" src="'+recorded[active]+'">':'<div class="mock '+theme+(width===720?' narrow':'')+'"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>'+rail(s.section)+'<section class="pane" aria-label="'+s.name+'"><header class="pane-header"><h1>'+s.title+'</h1>'+(s.lede?'<p class="lede">'+s.lede+'</p>':'')+'</header>'+({account,license,ai,install,finish,booking}[active]())+'</section></div>';el('caption').textContent=mode==='recorded'?'Recorded · '+s.name:'Proposed · '+s.name;el('timestamp').textContent=mode==='recorded'?'Recording at approximately '+s.time+' · original size':'Layout prototype · illustrative status and values';el('explanation').textContent=s.description;el('notes').innerHTML=s.notes.map(note=>'<span>'+note+'</span>').join('');fit()}
function fit(){const scale=Math.min(1,el('stageWrap').clientWidth/width);el('stage').style.transform='translateX(-50%) scale('+scale+')';el('stageWrap').style.height=((width===720?560:800)*scale)+'px'}
function navigate(key){active=key;state=screens[key].states[0]?.[0]||'';selectedDay='';render()}
document.addEventListener('click',e=>{const screen=e.target.closest('[data-screen]');if(screen){navigate(screen.dataset.screen);return}const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;render();return}const day=e.target.closest('[data-day]');if(day&&!day.disabled){selectedDay=day.dataset.day;render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(screens[a])navigate(a);else if(a==='terms')el('terms').hidden=!el('terms').hidden;else if(a==='key'||a==='plan'){state=a==='key'?'key':'waiting';render()}else if(a==='sign'){state='signed';render()}else if(a==='check'){state='checking';render()}else if(a==='cancel'){state=screens[active].states[0]?.[0]||'';render()}else if(a==='change'){navigate('ai')}});
el('state').addEventListener('change',e=>{state=e.target.value;render()});el('theme').addEventListener('change',e=>{theme=e.target.value;render()});el('size').addEventListener('change',e=>{width=Number(e.target.value);render()});new ResizeObserver(fit).observe(el('stageWrap'));render();
</script></body></html>
