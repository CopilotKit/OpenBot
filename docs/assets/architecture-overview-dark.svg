<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 686" width="920" height="686" role="img" aria-labelledby="arch-title arch-desc" font-family="Arial, Helvetica, sans-serif">
<title id="arch-title">OpenBot architecture</title>
<desc id="arch-desc">OpenBot frontends (Desktop, Web, iOS, Android, Slack and Teams) connect to the OpenBot backend. Inside your infrastructure, deployed on Kubernetes with Helm, the OpenBot backend provides the workspace API, identity and permissions, policy and approvals, and audit, and enforces those controls at its API. Built-in Bots run in the OpenBot server. The backend manages computer use, a separate service for browser, files and shell, and sends it only governed actions. CopilotKit Intelligence is deployed separately in the same infrastructure and provides durable conversations, memory, learning and enterprise governance services. Outside the boundary, your agents run on any agent execution platform and connect to the backend through AG-UI, alongside Built-in Bots in the same workspace. Your tools connect through MCP. On a laptop, desktop setup runs the same stack locally.</desc>
