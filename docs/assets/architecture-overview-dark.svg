<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 592" width="920" height="592" role="img" aria-labelledby="arch-title arch-desc" font-family="Arial, Helvetica, sans-serif">
<title id="arch-title">OpenBot architecture</title>
<desc id="arch-desc">OpenBot frontends (Mac, Windows, Web, iOS, Android, Slack and Teams) connect to the OpenBot backend. Inside your infrastructure, deployed on Kubernetes with Helm, the backend provides the workspace API, identity and permissions, policy and approvals, and audit, enforced at its API. CopilotKit Intelligence is deployed separately alongside it and provides durable conversations, memory, learning and enterprise governance services. The backend connects to three lanes, each with an option inside your infrastructure and a bring-your-own option outside it. Agents use AG-UI: Built-in Bots run in-process in the OpenBot server, and your agents run on any agent execution platform; either or both can serve the same workspace. Computers use the computer provider interface: Kubernetes by default, providing browser, files and shell, or your own sandbox provider through an adapter, for example Daytona, E2B or Modal. Tools share a common interface: built-in tools such as Routines, MCP servers and hubs, and other adapters. On a laptop, setup runs this stack locally.</desc>
