[test]
# Both of these run before any test file is imported, because each has to. See
# tests/support/network-guard.ts, which closes the process's egress before a vendor client can bind a
# transport, and app/tests/preload.ts, which evaluates Base UI while a DOM exists so its layout
# effect is not a no-op for every file that follows.
#
# This applies to `bun test` run from the repository root. Bun reads bunfig.toml from the current
# working directory only, so app/bunfig.toml repeats the declaration for `bun test` run from inside
# app/. Keep the two preload lists in agreement; tests/bunfig-preload.test.ts fails if they drift.
preload = ["./tests/support/network-guard.ts", "./app/tests/preload.ts"]
