# This overlay intentionally changes only the OpenBot application configuration. It must always be
# layered after the existing hardened base and browser-supervisor Compose files; it never replaces
# their network, port, volume, security, or browser topology.
services:
  openbot:
    build:
      args:
        TENANT_PACKAGE_DIR: ../examples/netsfera
    environment:
      TENANT_PACKAGE_DIR: ../examples/netsfera
      HANDOFF_ATTACHMENTS_ENABLED: ${HANDOFF_ATTACHMENTS_ENABLED:-false}
      HANDOFF_ATTACHMENT_PAIRS: ${HANDOFF_ATTACHMENT_PAIRS:-}
      WORKSPACE_TRANSFER_NETSFERA_ERP_SERVER_ID: ${WORKSPACE_TRANSFER_NETSFERA_ERP_SERVER_ID:-}
      WORKSPACE_TRANSFER_CLEANUP_DRY_RUN: ${WORKSPACE_TRANSFER_CLEANUP_DRY_RUN:-true}
      # The current loader accepts AGENT_COMPUTER_POLICY as JSON, not a file path. The rendered
      # overlay is structurally compared with agent-computer-policy.json by netsfera-overlay.test.ts.
      AGENT_COMPUTER_POLICY: >-
        {"mode":"enforce","deny":["bot.id == \"jefe-erp\" && matches(tool.name, \"^computer_\")","bot.id == \"recolector-documentos\" && tool.name in [\"computer_run_command\",\"computer_write_file\"]","bot.id == \"recolector-documentos\" && tool.name in [\"computer_key\",\"computer_type\"] && intent == \"activate\"","bot.id == \"recolector-documentos\" && intent in [\"navigate\",\"activate\",\"type\"] && page.host != \"\" && !(page.host in [\"chatgpt.com\",\"auth.openai.com\",\"platform.openai.com\",\"accounts.hetzner.com\",\"console.hetzner.cloud\",\"invoice.stripe.com\"])","bot.id == \"recolector-documentos\" && intent in [\"navigate\",\"activate\",\"type\"] && (contains(page.url, \"payment\") || contains(page.url, \"billing/plan\") || contains(page.url, \"member\") || contains(page.url, \"credential\") || contains(page.url, \"api-key\") || contains(page.url, \"password\"))","bot.id == \"recolector-documentos\" && intent in [\"activate\",\"type\"] && (contains(element.name, \"buy\") || contains(element.name, \"purchase\") || contains(element.name, \"upgrade\") || contains(element.name, \"payment method\") || contains(element.name, \"api key\") || contains(element.name, \"password\"))"],"allow":["bot.id == \"recolector-documentos\" && tool.name in [\"computer_navigate\",\"computer_click\",\"computer_type\",\"computer_key\",\"computer_scroll\"] && page.host in [\"chatgpt.com\",\"auth.openai.com\",\"platform.openai.com\",\"accounts.hetzner.com\",\"console.hetzner.cloud\",\"invoice.stripe.com\"]","bot.id == \"recolector-documentos\" && tool.name == \"computer_list_files\" && file.path == \".\"","bot.id == \"recolector-documentos\" && tool.name in [\"computer_read_file\",\"computer_list_files\"] && matches(file.path, \"^downloads(/|$)\")"]}
