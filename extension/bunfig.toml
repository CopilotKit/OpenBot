[test]
# The same declaration as the bunfig.toml at the repository root, with the paths written relative to
# this directory.
#
# Bun reads bunfig.toml from the current working directory and nowhere else, so the root one applies
# to `bun test extension/tests` run from the root and not to `bun test` run from here. Without this
# file nothing evaluates Base UI while a DOM exists (see app/tests/preload.ts): its layout effect is
# fixed as a no-op, the popup's Discard dialog mounts nothing, and each test that waits for its words
# fails at testing-library's one-second timeout, while passing from the root.
#
# tests/bunfig-preload.test.ts at the repository root fails if this list stops agreeing with the
# root one.
preload = [
  "../tests/support/network-guard.ts",
  "../tests/support/one-react.ts",
  "../app/tests/preload.ts",
]
