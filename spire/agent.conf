# The agent every computer asks for its identity.
#
# The Docker attestor identifies the calling container and selects on labels. The Unix attestor needs
# a shared PID namespace, which does not hold when each Bot runs in its own runtime-created container.
agent {
  data_dir     = "/opt/spire/data/agent"
  log_level    = "INFO"
  trust_domain = "openbot.local"
  server_address = "spire-server"
  server_port    = "8081"

  # Local bootstrap only. A real deployment provisions the trust bundle through a hardware attestor
  # (x509pop, TPM, or a cloud instance identity document) rather than trusting first contact.
  insecure_bootstrap = true

  socket_path = "/tmp/spire-agent/public/api.sock"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "memory" {
    plugin_data {}
  }

  # Selects on the labels the supervisor sets when it creates a computer.
  WorkloadAttestor "docker" {
    plugin_data {
      docker_socket_path = "unix:///var/run/docker.sock"
    }
  }
}
