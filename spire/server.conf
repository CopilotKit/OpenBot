# The identity authority for this deployment.
#
# The workloads here are per-Bot containers rather than Kubernetes pods, so the agent attests with
# the docker plugin and selects on container labels.
#
# A single-tier CA with no upstream: SPIRE signs leaf SVIDs directly from the trust bundle root, so
# nothing has to reach a CA outside this deployment. That is what makes it work air-gapped, which is
# the deployment this product is for.
server {
  bind_address = "0.0.0.0"
  bind_port    = "8081"
  trust_domain = "openbot.local"
  data_dir     = "/opt/spire/data/server"
  log_level    = "INFO"

  ca_key_type  = "rsa-2048"
  ca_ttl       = "720h"
  # An hour, so a stolen SVID stops working on its own. The agent renews long before it expires.
  default_x509_svid_ttl = "1h"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/opt/spire/data/server/datastore.sqlite3"
    }
  }

  KeyManager "disk" {
    plugin_data {
      keys_path = "/opt/spire/data/server/keys.json"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }
}
