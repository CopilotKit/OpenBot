# Test build only (never merged): the amd64 halves of the images the pinned test installer uses,
# built on native runners because Bun aborts under QEMU. Pushed by digest, untagged.
name: test build amd64 images
on:
  push:
    branches: [dustywusty/sam-test-0f85313]
    paths: [.github/workflows/test-build-amd64-images.yml]
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, supervisor, agent-computer, agent-bot, agent-langgraph]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/copilotkit/openbot-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,compression=zstd,force-compression=true
          provenance: false
      - run: echo "DIGEST ${{ matrix.image }} ${{ steps.push.outputs.digest }}"
