name: iOS shell

# Builds the experimental iOS shell in ios-shell/ for the simulator and runs its UI tests in 4
# parallel jobs, each on its own simulator:
# - real: suite 1, against the hosted web app at my.open.bot (a Release build, a fresh install per
#   test, and the Debug-only session-cookie journey), plus the Release and store build checks;
# - flow-a, flow-b: suite 2, ShellFlowUITests in 2 halves (and the demo tour), against two mock
#   stacks of the real built web app (app/workbench/mock-server.ts);
# - edges: the hardening tests, the probe site (ios-shell/Probe) and the unit tests.
#
# Artifacts per job: ios-shell-shots-<run id>-<job> (downscaled screenshots, SUMMARY.md,
# diagnostics.jsonl), ios-shell-<run id>-<job> (everything else that is not a real account's) and,
# only when a test used a real account, ios-shell-private-<run id>-<job>. Recordings are made by
# ios-shell-video.yml. Simulator only: no signing.
#
# Optional repository secrets for the tests against a real account (skipped when empty):
# OPENBOT_SHELL_TEST_SESSION, OPENBOT_SHELL_GOOGLE_EMAIL, OPENBOT_SHELL_GOOGLE_PASSWORD,
# OPENBOT_SHELL_GOOGLE_TOTP_SECRET.

on:
  push:
    branches:
      - ios-webview-shell
      - ios-webview-shell/**
    paths:
      - ios-shell/**
      - .github/workflows/ios-shell.yml
      - app/src/lib/native-shell/**
      - app/workbench/mock-server.ts
  workflow_dispatch:
    inputs:
      google_sign_in:
        description: Run the Google sign-in in the system sheet (sends one sign-in prompt to the account's phone)
        type: boolean
        default: false
      google_sign_in_webview:
        description: Also run the Google sign-in in the app's web view (a second prompt)
        type: boolean
        default: false
      real_backend_only:
        description: Run only the real-backend suite (skip the mock suite, the probe and the demo)
        type: boolean
        default: false
      device:
        description: The simulator to run on (an iPad runs everything but the real-backend suites)
        type: choice
        options: [iphone, ipad]
        default: iphone

permissions: {}

concurrency:
  group: ios-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Test on the iOS simulator (${{ matrix.shard }})
    if: github.repository == 'CopilotKit/OpenBot'
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # real_backend_only: suite 1 alone. An iPad: everything but the real-backend suites.
        shard: ${{ fromJSON(inputs.real_backend_only && '["real"]' || (inputs.device == 'ipad' && '["flow-a","flow-b","edges"]' || '["real","flow-a","flow-b","edges"]')) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pick a simulator and boot it in the background
        env:
          DEVICE: ${{ inputs.device || 'iphone' }}
        run: |
          mkdir -p artifacts
          echo "XCODE_VERSION=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          picked="$(python3 ios-shell/ci/pick_simulator.py "$DEVICE")"
          udid="$(printf '%s' "$picked" | cut -f1)"
          name="$(printf '%s' "$picked" | cut -f2)"
          runtime="$(printf '%s' "$picked" | cut -f3)"
          echo "Using $name ($runtime) $udid"
          {
            echo "SIM_UDID=$udid"
            echo "SIM_NAME=$name"
            echo "SIM_RUNTIME=$runtime"
          } >> "$GITHUB_ENV"
          # The software keyboard, as on a phone, for the keyboard tests.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          # Booting takes minutes on a fresh runner: it runs while the rest of the job does. No
          # one-time "slide to type" tip over the keyboard.
          nohup bash -c 'xcrun simctl boot "$1" || true; xcrun simctl bootstatus "$1" -b \
            && xcrun simctl spawn "$1" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true; \
            xcrun simctl spawn "$1" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true; \
            sleep 15; touch "$2"' boot "$udid" "$RUNNER_TEMP/simulator.ready" > "$RUNNER_TEMP/boot.log" 2>&1 &

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xcodegen-dist
          key: ios-shell-video-xcodegen-v1

      - name: Generate the Xcode project
        run: |
          if [ ! -x ~/xcodegen-dist/xcodegen/bin/xcodegen ]; then
            mkdir -p ~/xcodegen-dist
            curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip \
              && unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d ~/xcodegen-dist || true
          fi
          if [ -x ~/xcodegen-dist/xcodegen/bin/xcodegen ]; then
            (cd ios-shell && ~/xcodegen-dist/xcodegen/bin/xcodegen generate)
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
            (cd ios-shell && xcodegen generate)
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData
          key: ios-shell-dd-Debug-${{ hashFiles('ios-shell/**') }}
          restore-keys: ios-shell-dd-Debug-

      # The app builds while the web app does.
      - name: Start the Debug build in the background
        run: |
          nohup bash -c 'xcodebuild build-for-testing -project ios-shell/OpenBotShell.xcodeproj -scheme OpenBotShell \
            -configuration Debug -destination "generic/platform=iOS Simulator" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO > xcodebuild-build.log 2>&1; echo $? > "$2"' build "$SIM_UDID" \
            "$RUNNER_TEMP/build.status" > /dev/null 2>&1 &

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.shard != 'real'
        with:
          bun-version: 1.4.3

      # From git's own object ids: hashFiles over the workspace timed out once DerivedData was in it.
      - name: Work out the web app's cache key
        if: matrix.shard != 'real'
        id: web-key
        run: |
          sum="$( (git rev-parse HEAD:app/src HEAD:app/public HEAD:shared HEAD:tokens; \
            git hash-object app/index.html app/package.json app/vite.config.* app/tsconfig*.json bun.lock package.json .env.example) | shasum | cut -c1-40)"
          echo "key=ios-shell-web-v2-$sum" >> "$GITHUB_OUTPUT"

      - name: Look for the built web app in the cache
        if: matrix.shard != 'real'
        id: web-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/dist
          key: ${{ steps.web-key.outputs.key }}

      - name: Install dependencies and build the web app if needed
        if: matrix.shard != 'real'
        timeout-minutes: 15
        env:
          WEB_CACHED: ${{ steps.web-cache.outputs.cache-hit }}
        run: |
          bun install --frozen-lockfile
          cp .env.example .env
          if [ "$WEB_CACHED" != "true" ]; then (cd app && bun run build); else echo "web app from the cache"; fi

      - name: Keep the built web app for the next run
        if: matrix.shard != 'real' && steps.web-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/dist
          key: ${{ steps.web-cache.outputs.cache-primary-key }}

      - name: Start the mock stacks
        if: matrix.shard != 'real'
        run: |
          # A: signed out unless the mock's cookie is sent, with the sign-in hand-off.
          MOCK_REPLY=1 MOCK_SIGNED_OUT=1 SERVER_PORT=3001 nohup bun app/workbench/mock-server.ts > artifacts/mock-a.log 2>&1 &
          APP_PORT=3010 SERVER_PORT=3001 nohup bun app/serve.ts > artifacts/app-a.log 2>&1 &
          # B: the same without the hand-off.
          MOCK_NO_HANDOFF=1 MOCK_SIGNED_OUT=1 SERVER_PORT=3002 nohup bun app/workbench/mock-server.ts > artifacts/mock-b.log 2>&1 &
          APP_PORT=3011 SERVER_PORT=3002 nohup bun app/serve.ts > artifacts/app-b.log 2>&1 &
          challenge="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          for _ in $(seq 1 60); do
            a_page="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3010/ || true)"
            b_page="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3011/ || true)"
            a_handoff="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3010/api/auth/shell/handoff?challenge=$challenge" || true)"
            b_handoff="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3011/api/auth/shell/handoff?challenge=$challenge" || true)"
            a_config="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3010/api/auth/shell/config?platform=ios" || true)"
            b_config="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3011/api/auth/shell/config?platform=ios" || true)"
            if [ "$a_page" = 200 ] && [ "$b_page" = 200 ] && [ "$a_handoff" = 200 ] && [ "$b_handoff" = 404 ] \
              && [ "$a_config" = 200 ] && [ "$b_config" = 404 ]; then
              echo "mock stacks are up (A hand-off $a_handoff, B hand-off $b_handoff)"
              exit 0
            fi
            sleep 1
          done
          echo "mock stacks did not start: A $a_page/$a_handoff/$a_config, B $b_page/$b_handoff/$b_config"
          tail -n 40 artifacts/mock-a.log artifacts/app-a.log artifacts/mock-b.log artifacts/app-b.log
          exit 1

      - name: Arm the late stack
        if: matrix.shard == 'flow-b'
        run: |
          # testLockLiftsWhenServerComesBack writes the trigger file, then expects OpenBot to come up
          # on 3012 (over mock A's server) about 8 s later.
          trigger="$RUNNER_TEMP/openbot-shell-late-stack"
          echo "LATE_STACK_TRIGGER=$trigger" >> "$GITHUB_ENV"
          nohup bash -c 'while [ ! -f "$1" ]; do sleep 1; done; sleep 8; echo "starting the late stack"; APP_PORT=3012 SERVER_PORT=3001 exec bun app/serve.ts' \
            late-stack "$trigger" > artifacts/app-late.log 2>&1 &

      - name: Start the probe server
        if: matrix.shard != 'real'
        run: |
          nohup python3 ios-shell/Probe/serve.py > artifacts/probe-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null && curl -sS -o /dev/null http://127.0.0.1:8766/cors; then
              echo "probe server is up"
              exit 0
            fi
            sleep 1
          done
          echo "probe server did not start"
          cat artifacts/probe-server.log
          exit 1

      - name: Start the server that never answers
        if: matrix.shard == 'edges'
        run: |
          # testSlowServerShowsSkeletonThenLock: accepts connections on 3013 and never answers.
          nohup python3 -c '
          import socket, time
          s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 3013)); s.listen(64); held = []
          while True:
              c, _ = s.accept(); held.append(c)
          ' > artifacts/silent-server.log 2>&1 &

      - name: Wait for the Debug build
        id: build
        timeout-minutes: 15
        run: |
          while [ ! -f "$RUNNER_TEMP/build.status" ]; do sleep 2; done
          grep -E "error:|warning: .*(OpenBotShell|ios-shell)|BUILD (SUCCEEDED|FAILED)" xcodebuild-build.log || true
          [ "$(cat "$RUNNER_TEMP/build.status")" = 0 ]

      - name: Build for testing (Release) and check what ships
        id: build-release
        if: matrix.shard == 'real'
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios-shell/OpenBotShell.xcodeproj \
            -scheme OpenBotShell \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedDataRelease \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=OPENBOT_TEST_ENVIRONMENT \
            2>&1 | tee xcodebuild-build-release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" xcodebuild-build-release.log
          # The store build: Release as it is, without the test build's flag. It must read nothing from
          # its launch environment, so none of those names may be in its binary.
          xcodebuild build -project ios-shell/OpenBotShell.xcodeproj -scheme OpenBotShell -configuration Release \
            -destination "generic/platform=iOS Simulator" -derivedDataPath DerivedDataStore CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-build-store.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild-build-store.log
          store_app="$(ls -d DerivedDataStore/Build/Products/Release-iphonesimulator/OpenBotShell.app)"
          store_found="$(strings -a "$store_app/OpenBotShell" | grep -E 'OPENBOT_BASE_URL|OPENBOT_SHELL_' || true)"
          if [ -n "$store_found" ]; then
            echo "::error::the store build reads its launch environment:"
            echo "$store_found"
            exit 1
          fi
          echo "the store build reads nothing from its launch environment"
          app="$(ls -d DerivedDataRelease/Build/Products/Release-iphonesimulator/OpenBotShell.app)"
          found="$(strings -a "$app/OpenBotShell" | grep -E 'OPENBOT_SHELL_(TEST_SESSION_COOKIE|TEST_PLAIN_SESSION_COOKIE|TEST_STALE_SESSION|FORCE_OFFLINE|FORCE_DARK|DELAY_FIRST_LOAD|TEST_KILL_CONTENT|TEST_ENTER_PROBE|TEST_LATE_SESSION|HANDOFF_AUTO|DEBUG_SHEET_URL|PLAIN_WEBVIEW|RESET)|debug-state' || true)"
          if [ -n "$found" ]; then
            echo "::error::DEBUG-only hooks are in the Release binary:"
            echo "$found"
            exit 1
          fi
          echo "no DEBUG-only hook names in the Release binary"
          if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$app/Info.plist" 2>/dev/null; then
            echo "::error::the Release Info.plist has an App Transport Security exception"
            exit 1
          fi
          echo "no App Transport Security exception in the Release Info.plist"
          echo "RELEASE_XCTESTRUN=$(ls DerivedDataRelease/Build/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"

      - name: Wait for the simulator
        run: |
          for _ in $(seq 1 300); do [ -f "$RUNNER_TEMP/simulator.ready" ] && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/boot.log"
          exit 1

      - name: Run the UI tests (Debug)
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          # xcodebuild hands TEST_RUNNER_* to the test runner without the prefix. Empty: those tests skip.
          TEST_RUNNER_OPENBOT_SHELL_TEST_SESSION: ${{ secrets.OPENBOT_SHELL_TEST_SESSION }}
          TEST_RUNNER_OPENBOT_SHELL_GOOGLE_EMAIL: ${{ secrets.OPENBOT_SHELL_GOOGLE_EMAIL }}
          TEST_RUNNER_OPENBOT_SHELL_GOOGLE_PASSWORD: ${{ secrets.OPENBOT_SHELL_GOOGLE_PASSWORD }}
          TEST_RUNNER_OPENBOT_SHELL_GOOGLE_TOTP_SECRET: ${{ secrets.OPENBOT_SHELL_GOOGLE_TOTP_SECRET }}
          TEST_RUNNER_OPENBOT_SHELL_RUN_GOOGLE: ${{ inputs.google_sign_in }}
          TEST_RUNNER_OPENBOT_SHELL_RUN_GOOGLE_WEBVIEW: ${{ inputs.google_sign_in_webview }}
        run: |
          export TEST_RUNNER_OPENBOT_SHELL_LATE_STACK_TRIGGER="${LATE_STACK_TRIGGER:-}"
          t=OpenBotShellUITests
          case "$SHARD" in
            real) only=(-only-testing:$t/RealBackendDebugUITests -only-testing:$t/ShellUITests/testLoadsHostedWebApp) ;;
            # Suite 2 in 2 halves of about the same length.
            flow-a) f=$t/ShellFlowUITests
                    only=(-only-testing:$f/testTabsRouteTheWebView -only-testing:$f/testNoBrowserNotificationOffersInTheShell
                          -only-testing:$f/testKeyboardKeepsTheMessageBoxVisible -only-testing:$f/testKeyboardHidesTabBar
                          -only-testing:$f/testResumeFromBackground -only-testing:$f/testLoadingSkeleton
                          -only-testing:$f/testFallbackToWebSignIn) ;;
            flow-b) f=$t/ShellFlowUITests
                    only=(-only-testing:$f -skip-testing:$f/testTabsRouteTheWebView
                          -skip-testing:$f/testNoBrowserNotificationOffersInTheShell -skip-testing:$f/testKeyboardKeepsTheMessageBoxVisible
                          -skip-testing:$f/testKeyboardHidesTabBar -skip-testing:$f/testResumeFromBackground
                          -skip-testing:$f/testLoadingSkeleton -skip-testing:$f/testFallbackToWebSignIn
                          -only-testing:$t/DemoTourUITests/testDemoTour) ;;
            edges) only=(-only-testing:$t/HardeningUITests -only-testing:$t/ShellUITests
                         -only-testing:$t/HandoffConfigTests -only-testing:$t/ShellURLsTests
                         -skip-testing:$t/ShellUITests/testLoadsHostedWebApp) ;;
          esac
          set -o pipefail
          xcodebuild test-without-building "${only[@]}" \
            -project ios-shell/OpenBotShell.xcodeproj \
            -scheme OpenBotShell \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Copy the Debug app's diagnostics
        if: always()
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            container="$(xcrun simctl get_app_container "$SIM_UDID" ai.openbot.shell data 2>/dev/null || true)"
            if [ -n "$container" ] && [ -f "$container/Documents/diagnostics.jsonl" ]; then
              cp "$container/Documents/diagnostics.jsonl" artifacts/diagnostics.jsonl
            else
              echo "no diagnostics.jsonl in the app container ($container)"
            fi
          fi

      - name: Run the real-backend suite on the Release build (a fresh install per test)
        if: always() && matrix.shard == 'real' && steps.build-release.outcome == 'success'
        timeout-minutes: 30
        env:
          TEST_RUNNER_OPENBOT_SHELL_GOOGLE_EMAIL: ${{ secrets.OPENBOT_SHELL_GOOGLE_EMAIL }}
          TEST_RUNNER_OPENBOT_SHELL_GOOGLE_PASSWORD: ${{ secrets.OPENBOT_SHELL_GOOGLE_PASSWORD }}
          TEST_RUNNER_OPENBOT_SHELL_GOOGLE_TOTP_SECRET: ${{ secrets.OPENBOT_SHELL_GOOGLE_TOTP_SECRET }}
          TEST_RUNNER_OPENBOT_SHELL_RUN_GOOGLE: ${{ inputs.google_sign_in }}
          TEST_RUNNER_OPENBOT_SHELL_RUN_GOOGLE_WEBVIEW: ${{ inputs.google_sign_in_webview }}
        run: |
          status=0
          : > xcodebuild-release.log
          for test in testRealFirstScreenAndWebSignIn testRealLockScreenWhenBackendUnreachable testRealGoogleSignInInWebViewAndJourney; do
            xcrun simctl uninstall "$SIM_UDID" ai.openbot.shell || true
            xcodebuild test-without-building \
              -xctestrun "$RELEASE_XCTESTRUN" \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -resultBundlePath "Release-$test.xcresult" \
              -only-testing:"OpenBotShellUITests/RealBackendUITests/$test" \
              > "xcodebuild-release-$test.log" 2>&1 || status=1
            cat "xcodebuild-release-$test.log" >> xcodebuild-release.log
            container="$(xcrun simctl get_app_container "$SIM_UDID" ai.openbot.shell data 2>/dev/null || true)"
            if [ -n "$container" ] && [ -f "$container/Documents/diagnostics.jsonl" ]; then
              cat "$container/Documents/diagnostics.jsonl" >> artifacts/diagnostics.jsonl
            fi
          done
          grep -E "Test Case .*(passed|failed|skipped)|error: -\[" xcodebuild-release.log || true
          exit $status

      - name: Export screenshots and attachments
        if: always()
        run: |
          mkdir -p artifacts/attachments
          for bundle in TestResults.xcresult Release-*.xcresult; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool export attachments --path "$bundle" --output-path "artifacts/attachments/${bundle%.xcresult}" \
              || echo "could not export attachments from $bundle"
          done
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl spawn "$SIM_UDID" log show --last 120m --style compact \
              --predicate 'process == "OpenBotShell"' > artifacts/simulator-app.log 2>&1 || true
          fi

      - name: Write the summary and collect the screenshots
        if: always()
        run: |
          bundles="$(ls -d TestResults.xcresult Release-*.xcresult 2>/dev/null | paste -sd: -)"
          logs="$(ls xcodebuild.log xcodebuild-release.log 2>/dev/null | paste -sd: -)"
          python3 ios-shell/ci/summarize.py artifacts "$bundles" "$logs" || true
          python3 ios-shell/ci/collect_shots.py artifacts || true
          if [ -f artifacts/SUMMARY.md ]; then
            cat artifacts/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/diagnostics.jsonl ]; then
            echo "::group::diagnostics.jsonl (tests with a real account left out)"
            cat artifacts/diagnostics.jsonl
            echo "::endgroup::"
          fi
          if [ -d private-artifacts ] && [ -n "$(ls -A private-artifacts/shots 2>/dev/null)" ]; then
            echo "HAS_PRIVATE=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-shell-shots-${{ github.run_id }}-${{ matrix.shard }}
          path: artifacts/shots/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-shell-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            artifacts/
            !artifacts/shots/
            xcodebuild*.log
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.HAS_PRIVATE == '1'
        with:
          name: ios-shell-private-${{ github.run_id }}-${{ matrix.shard }}
          path: private-artifacts/
          retention-days: 7
          if-no-files-found: ignore
