name: iOS shell

# Builds the experimental iOS shell in ios-shell/ for the simulator and runs its UI tests: against
# the local probe site (ios-shell/Probe), against two mock stacks of the real built web app
# (app/workbench/mock-server.ts), and against the hosted web app at my.open.bot.
#
# Artifacts: ios-shell-<run id> (everything that is not a real account's), ios-shell-shots-<run id>
# (downscaled screenshots, SUMMARY.md, diagnostics.jsonl) and, only when a test used a real account,
# ios-shell-private-<run id>. Simulator only: no signing.
#
# Optional repository secrets for the tests against a real account (skipped when empty):
# OPENBOT_SHELL_TEST_SESSION, OPENBOT_SHELL_GOOGLE_EMAIL, OPENBOT_SHELL_GOOGLE_PASSWORD,
# OPENBOT_SHELL_GOOGLE_TOTP_SECRET.
on:
  push:
    branches:
      - ios-webview-shell
      - ios-webview-shell/**
    paths:
      - ios-shell/**
      - .github/workflows/ios-shell.yml
      - app/src/lib/native-shell/**
      - app/workbench/mock-server.ts
  workflow_dispatch:

permissions: {}

concurrency:
  group: ios-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build and test on the iOS simulator
    if: github.repository == 'CopilotKit/OpenBot'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode and simulators
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcrun simctl list runtimes available
          xcrun simctl list devices available
          mkdir -p artifacts
          echo "XCODE_VERSION=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install dependencies and build the web app
        timeout-minutes: 15
        run: |
          bun install --frozen-lockfile
          cp .env.example .env
          cd app && bun run build

      - name: Start the mock stacks
        run: |
          # A: signed out unless the mock's cookie is sent, with the sign-in hand-off.
          MOCK_SIGNED_OUT=1 SERVER_PORT=3001 nohup bun app/workbench/mock-server.ts > artifacts/mock-a.log 2>&1 &
          APP_PORT=3010 SERVER_PORT=3001 nohup bun app/serve.ts > artifacts/app-a.log 2>&1 &
          # B: the same without the hand-off.
          MOCK_NO_HANDOFF=1 MOCK_SIGNED_OUT=1 SERVER_PORT=3002 nohup bun app/workbench/mock-server.ts > artifacts/mock-b.log 2>&1 &
          APP_PORT=3011 SERVER_PORT=3002 nohup bun app/serve.ts > artifacts/app-b.log 2>&1 &
          challenge="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          for _ in $(seq 1 60); do
            a_page="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3010/ || true)"
            b_page="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3011/ || true)"
            a_handoff="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3010/api/auth/shell/handoff?challenge=$challenge" || true)"
            b_handoff="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3011/api/auth/shell/handoff?challenge=$challenge" || true)"
            if [ "$a_page" = 200 ] && [ "$b_page" = 200 ] && [ "$a_handoff" = 200 ] && [ "$b_handoff" = 404 ]; then
              echo "mock stacks are up (A hand-off $a_handoff, B hand-off $b_handoff)"
              exit 0
            fi
            sleep 1
          done
          echo "mock stacks did not start: A $a_page/$a_handoff, B $b_page/$b_handoff"
          tail -n 40 artifacts/mock-a.log artifacts/app-a.log artifacts/mock-b.log artifacts/app-b.log
          exit 1

      - name: Arm the late stack
        run: |
          # testLockLiftsWhenServerComesBack writes the trigger file, then expects OpenBot to come up
          # on 3012 (over mock A's server) about 8 s later.
          trigger="$RUNNER_TEMP/openbot-shell-late-stack"
          echo "LATE_STACK_TRIGGER=$trigger" >> "$GITHUB_ENV"
          nohup bash -c 'while [ ! -f "$1" ]; do sleep 1; done; sleep 8; echo "starting the late stack"; APP_PORT=3012 SERVER_PORT=3001 exec bun app/serve.ts' \
            late-stack "$trigger" > artifacts/app-late.log 2>&1 &

      - name: Start the probe server
        run: |
          nohup python3 ios-shell/Probe/serve.py > artifacts/probe-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null && curl -sS -o /dev/null http://127.0.0.1:8766/cors; then
              echo "probe server is up"
              exit 0
            fi
            sleep 1
          done
          echo "probe server did not start"
          cat artifacts/probe-server.log
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios-shell
        run: xcodegen generate

      - name: Pick and boot a simulator
        run: |
          picked="$(python3 ios-shell/ci/pick_simulator.py)"
          udid="$(printf '%s' "$picked" | cut -f1)"
          name="$(printf '%s' "$picked" | cut -f2)"
          runtime="$(printf '%s' "$picked" | cut -f3)"
          echo "Using $name ($runtime) $udid"
          # The software keyboard, as on a phone, for the keyboard test and the demo recording.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          {
            echo "SIM_UDID=$udid"
            echo "SIM_NAME=$name"
            echo "SIM_RUNTIME=$runtime"
          } >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build for testing
        id: build
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios-shell/OpenBotShell.xcodeproj \
            -scheme OpenBotShell \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-build.log | grep -E "error:|warning: .*(OpenBotShell|ios-shell)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" xcodebuild-build.log

      - name: Run the UI tests
        timeout-minutes: 50
        env:
          # xcodebuild hands TEST_RUNNER_* to the test runner without the prefix. Empty: those tests skip.
          TEST_RUNNER_OPENBOT_SHELL_TEST_SESSION: ${{ secrets.OPENBOT_SHELL_TEST_SESSION }}
          TEST_RUNNER_OPENBOT_SHELL_GOOGLE_EMAIL: ${{ secrets.OPENBOT_SHELL_GOOGLE_EMAIL }}
          TEST_RUNNER_OPENBOT_SHELL_GOOGLE_PASSWORD: ${{ secrets.OPENBOT_SHELL_GOOGLE_PASSWORD }}
          TEST_RUNNER_OPENBOT_SHELL_GOOGLE_TOTP_SECRET: ${{ secrets.OPENBOT_SHELL_GOOGLE_TOTP_SECRET }}
        run: |
          export TEST_RUNNER_OPENBOT_SHELL_LATE_STACK_TRIGGER="$LATE_STACK_TRIGGER"
          set -o pipefail
          xcodebuild test-without-building \
            -project ios-shell/OpenBotShell.xcodeproj \
            -scheme OpenBotShell \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -skip-testing:OpenBotShellUITests/DemoTourUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Record the demo tour
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 12
        run: |
          mkdir -p artifacts/video
          xcrun simctl io "$SIM_UDID" recordVideo --codec h264 --force artifacts/video/demo-tour.mp4 > artifacts/video-record.log 2>&1 &
          recorder=$!
          sleep 3
          set +e
          xcodebuild test-without-building \
            -project ios-shell/OpenBotShell.xcodeproj \
            -scheme OpenBotShell \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath DemoTour.xcresult \
            -only-testing:OpenBotShellUITests/DemoTourUITests/testDemoTour \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild-demo.log 2>&1
          status=$?
          grep -E "Test Case|error:" xcodebuild-demo.log
          # SIGINT and wait, so the recorder writes a playable file.
          kill -INT "$recorder"
          wait "$recorder"
          ls -la artifacts/video
          size=$(stat -f %z artifacts/video/demo-tour.mp4 2>/dev/null || echo 0)
          if [ "$size" -gt 41943040 ] && command -v ffmpeg > /dev/null; then
            ffmpeg -loglevel error -y -i artifacts/video/demo-tour.mp4 -vf scale=720:-2 -c:v libx264 -crf 28 artifacts/video/demo-tour-720.mp4 \
              && mv artifacts/video/demo-tour-720.mp4 artifacts/video/demo-tour.mp4
          fi
          exit $status

      - name: Export screenshots and attachments
        if: always()
        run: |
          mkdir -p artifacts/attachments
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path artifacts/attachments \
              || echo "xcresulttool export attachments is not available on this Xcode"
          else
            echo "no TestResults.xcresult"
          fi

      - name: Copy the app's diagnostics and log
        if: always()
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            container="$(xcrun simctl get_app_container "$SIM_UDID" ai.openbot.shell data 2>/dev/null || true)"
            if [ -n "$container" ] && [ -f "$container/Documents/diagnostics.jsonl" ]; then
              cp "$container/Documents/diagnostics.jsonl" artifacts/diagnostics.jsonl
            else
              echo "no diagnostics.jsonl in the app container ($container)"
            fi
            xcrun simctl spawn "$SIM_UDID" log show --last 90m --style compact \
              --predicate 'process == "OpenBotShell"' > artifacts/simulator-app.log 2>&1 || true
          fi

      - name: Write the summary and collect the screenshots
        if: always()
        run: |
          python3 ios-shell/ci/summarize.py artifacts TestResults.xcresult xcodebuild.log || true
          python3 ios-shell/ci/collect_shots.py artifacts || true
          if [ -f artifacts/SUMMARY.md ]; then
            cat artifacts/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/diagnostics.jsonl ]; then
            echo "::group::diagnostics.jsonl (tests with a real account left out)"
            cat artifacts/diagnostics.jsonl
            echo "::endgroup::"
          fi
          if [ -d private-artifacts ] && [ -n "$(ls -A private-artifacts/shots 2>/dev/null)" ]; then
            echo "HAS_PRIVATE=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-shell-shots-${{ github.run_id }}
          path: artifacts/shots/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-shell-video-${{ github.run_id }}
          path: artifacts/video/
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-shell-${{ github.run_id }}
          path: |
            artifacts/
            !artifacts/shots/
            !artifacts/video/
            xcodebuild.log
            xcodebuild-build.log
            xcodebuild-demo.log
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.HAS_PRIVATE == '1'
        with:
          name: ios-shell-private-${{ github.run_id }}
          path: private-artifacts/
          retention-days: 7
          if-no-files-found: ignore
