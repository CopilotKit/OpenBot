name: CI watch

# After every run of CI and Desktop: a job that failed and then passed on the same commit opens or
# updates a `flaky-test` issue naming each test that failed, and a job or a run over its budget in
# .github/ci-budgets.json opens or updates a `ci-budget` issue (scripts/ci-watch.ts). It reads runs,
# jobs and logs through the API only; nothing here checks out or runs a pull request's code, and
# runs from forks are left alone.
on:
  workflow_run:
    workflows: [CI, Desktop]
    types: [completed]
  workflow_dispatch:
    inputs:
      run:
        description: The id of a run to read.
        required: true
        type: string
      dry_run:
        description: Say what would be filed, and file nothing.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-watch-${{ github.event.workflow_run.id || inputs.run }}
  cancel-in-progress: false

jobs:
  watch:
    name: flakes and budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # To read the run's jobs and logs.
      actions: read
      # To open and update the flaky-test and ci-budget issues.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true
      - name: Flakes and budgets
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$RUN_ID" ]; then args+=(--run "$RUN_ID"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          bun scripts/ci-watch.ts "${args[@]}"
