name: OpenBot Mobile build

# Starts a build of OpenBot Mobile (mobile/) on Expo's build service, EAS Build, in the Expo project
# mobile/app.config.ts names. The build itself runs on Expo's machines and is listed on expo.dev
# with its install link: this job only starts it and prints that link. mobile/README.md says what
# each profile is for.
#
# Run by hand. A preview or development build starts from main or from any branch of this
# repository. A production build is the one the stores get, so it runs in the `mobile-release`
# environment: a reviewer approves the run, and only main and mobile may start it. With `submit`
# on, Expo uploads the finished build to TestFlight and to Google Play's internal testing track.
# Nobody outside the team gets the app from there: a release to the public is made by hand, in
# App Store Connect and in the Play Console.
#
# EXPO_TOKEN is the token of a robot user of the Expo organization. Each of the two environments
# holds its own, so one can be revoked without the other. The signing certificates, the Android
# keystore and the stores' upload keys stay on Expo's side, so this repository holds none of them.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: The build profile in mobile/eas.json.
        type: choice
        options:
          - preview
          - development
          - development-simulator
          - production
        default: preview
      platform:
        description: The phones to build for.
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      submit:
        description: Upload the build to TestFlight and Google Play internal testing. Production only.
        type: boolean
        default: false

permissions: {}

# A second start of the same build from the same branch waits for the first: each one is a build
# Expo charges for.
concurrency:
  group: mobile-build-${{ github.ref }}-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Start the build on Expo
    if: github.repository == 'CopilotKit/OpenBot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.profile == 'production' && 'mobile-release' || 'mobile-preview' }}
    permissions:
      contents: read
    steps:
      - name: Refuse an upload of a build that is not for the stores
        if: inputs.submit && inputs.profile != 'production'
        run: |
          echo "::error::Only a production build is uploaded to the stores. Pick the production profile, or turn submit off."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache, here or for the EAS CLI below: this job starts a build people install, so it
      # reads nothing another run could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # The EAS CLI reads mobile/app.config.ts, which needs the app's own packages.
      - run: npm ci --prefix mobile --ignore-scripts
      - uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: 27.11.0
          eas-cache: false
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start the build
        working-directory: mobile
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
        # --auto-submit queues the upload on Expo's side: it starts when the build is done, so this
        # job still ends as soon as the build has started.
        run: |
          args=(--profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait)
          if [ "$SUBMIT" = "true" ]; then
            args+=(--auto-submit)
          fi
          eas build "${args[@]}"
