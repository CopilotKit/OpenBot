name: Deploy to ECS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ecs-main
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: >-
      github.event_name == 'push' || 
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      LANGGRAPH_ECR_REPOSITORY: ${{ vars.LANGGRAPH_ECR_REPOSITORY || 'agent-langgraph' }}
      LANGGRAPH_ECS_SERVICE: ${{ vars.LANGGRAPH_ECS_SERVICE }}
      LANGGRAPH_ECS_TASK_FAMILY: ${{ vars.LANGGRAPH_ECS_TASK_FAMILY }}
      LANGGRAPH_ECS_CONTAINER_NAME: ${{ vars.LANGGRAPH_ECS_CONTAINER_NAME }}
      ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
      ECS_SECURITY_GROUP_IDS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
      ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP }}
      SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: openbot-ecs-deploy

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build and push image to ECR
        id: image
        run: |
          set -euo pipefail
          for name in AWS_REGION ECR_REPOSITORY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Set the GitHub repository variable $name."
              exit 1
            fi
          done

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_tag="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tagged_image="${registry}/${ECR_REPOSITORY}:${image_tag}"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          docker buildx build \
            --file Dockerfile \
            --platform linux/arm64 \
            --provenance=false \
            --push \
            --tag "$tagged_image" \
            .

          # ECS/Fargate should pull the exact single-platform manifest that was just pushed,
          # rather than resolving a mutable tag at task start.
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$image_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::ECR did not return a valid digest for $tagged_image (got: $digest)."
            exit 1
          fi
          image="${registry}/${ECR_REPOSITORY}@${digest}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build and push LangGraph Bot image to ECR
        id: langgraph-image
        run: |
          set -euo pipefail
          for name in AWS_REGION LANGGRAPH_ECR_REPOSITORY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Set the GitHub repository variable $name."
              exit 1
            fi
          done

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_tag="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tagged_image="${registry}/${LANGGRAPH_ECR_REPOSITORY}:${image_tag}"

          docker buildx build \
            --file agent-langgraph/Dockerfile \
            --platform linux/arm64 \
            --provenance=false \
            --push \
            --tag "$tagged_image" \
            .

          digest="$(aws ecr describe-images \
            --repository-name "$LANGGRAPH_ECR_REPOSITORY" \
            --image-ids "imageTag=$image_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::ECR did not return a valid digest for $tagged_image (got: $digest)."
            exit 1
          fi
          image="${registry}/${LANGGRAPH_ECR_REPOSITORY}@${digest}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Prepare task definitions
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          for name in ECS_CLUSTER ECS_SERVICE ECS_TASK_FAMILY ECS_CONTAINER_NAME \
                      ECS_SUBNET_IDS ECS_SECURITY_GROUP_IDS ECS_ASSIGN_PUBLIC_IP; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Set the GitHub repository variable $name."
              exit 1
            fi
          done
          case "$ECS_ASSIGN_PUBLIC_IP" in
            ENABLED | DISABLED) ;;
            *) echo "::error::ECS_ASSIGN_PUBLIC_IP must be ENABLED or DISABLED."; exit 1 ;;
          esac

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > /tmp/task-definition.json

          jq --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE" '
            if any(.containerDefinitions[]; .name == $name) then
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
              | .containerDefinitions |= map(
                  if .name == $name then
                    .image = $image
                    | del(.entryPoint, .command)
                  else . end
                )
            else
              error("ECS_CONTAINER_NAME does not match a container in the task definition")
            end
          ' /tmp/task-definition.json > /tmp/deploy-task-definition.json

          jq --arg name "$ECS_CONTAINER_NAME" '
            .containerDefinitions |= map(
              if .name == $name then
                .entryPoint = ["sh"]
                | .command = ["-c", "cd /app/server && bun scripts/migrate.ts"]
              else . end
            )
          ' /tmp/deploy-task-definition.json > /tmp/migration-task-definition.json

      - name: Prepare LangGraph Bot task definition
        env:
          IMAGE: ${{ steps.langgraph-image.outputs.image }}
        run: |
          set -euo pipefail
          for name in LANGGRAPH_ECS_SERVICE LANGGRAPH_ECS_TASK_FAMILY LANGGRAPH_ECS_CONTAINER_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Set the GitHub repository variable $name."
              exit 1
            fi
          done

          aws ecs describe-task-definition \
            --task-definition "$LANGGRAPH_ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > /tmp/langgraph-task-definition.json

          jq --arg name "$LANGGRAPH_ECS_CONTAINER_NAME" --arg image "$IMAGE" '
            if any(.containerDefinitions[]; .name == $name) then
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
              | .containerDefinitions |= map(
                  if .name == $name then
                    .image = $image
                    | del(.entryPoint, .command)
                  else . end
                )
            else
              error("LANGGRAPH_ECS_CONTAINER_NAME does not match a container in the task definition")
            end
          ' /tmp/langgraph-task-definition.json > /tmp/deploy-langgraph-task-definition.json

      - name: Run database migrations
        id: migrate
        run: |
          set -euo pipefail
          migration_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/migration-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"

          network="awsvpcConfiguration={subnets=[$ECS_SUBNET_IDS],securityGroups=[$ECS_SECURITY_GROUP_IDS],assignPublicIp=$ECS_ASSIGN_PUBLIC_IP}"
          result="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$migration_definition" \
            --network-configuration "$network" \
            --output json)"
          task_arn="$(printf '%s' "$result" | jq -r '.tasks[0].taskArn // empty')"
          if [ -z "$task_arn" ]; then
            echo "::error::ECS could not start the migration task."
            printf '%s\n' "$result"
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          task="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" --output json)"
          exit_code="$(printf '%s' "$task" | jq -r --arg name "$ECS_CONTAINER_NAME" \
            '.tasks[0].containers[] | select(.name == $name) | .exitCode // empty')"
          if [ "$exit_code" != "0" ]; then
            echo "::error::The database migration task did not exit successfully."
            printf 'Task: %s\n' "$task_arn"
            printf 'Stop code: %s\n' "$(printf '%s' "$task" | jq -r '.tasks[0].stopCode // "unknown"')"
            printf 'Stop reason: %s\n' "$(printf '%s' "$task" | jq -r '.tasks[0].stoppedReason // "unknown"')"
            printf 'Container exit code: %s\n' "${exit_code:-unknown}"
            printf 'Container reason: %s\n' "$(printf '%s' "$task" | jq -r --arg name "$ECS_CONTAINER_NAME" \
              '.tasks[0].containers[] | select(.name == $name) | .reason // "none"')"

            log_options="$(jq -c --arg name "$ECS_CONTAINER_NAME" \
              '.containerDefinitions[] | select(.name == $name) | .logConfiguration // {}' \
              /tmp/task-definition.json)"
            log_group="$(printf '%s' "$log_options" | jq -r '.options["awslogs-group"] // empty')"
            log_prefix="$(printf '%s' "$log_options" | jq -r '.options["awslogs-stream-prefix"] // empty')"
            if [ -n "$log_group" ] && [ -n "$log_prefix" ]; then
              task_id="${task_arn##*/}"
              printf 'CloudWatch log group: %s\n' "$log_group"
              printf 'CloudWatch log stream: %s/%s/%s\n' \
                "$log_prefix" "$ECS_CONTAINER_NAME" "$task_id"
            else
              echo "No awslogs group/stream prefix is configured for this container; inspect the stopped task in the ECS console."
            fi
            exit 1
          fi

      - name: Update LangGraph Bot ECS service
        run: |
          set -euo pipefail
          task_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/deploy-langgraph-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$LANGGRAPH_ECS_SERVICE" \
            --task-definition "$task_definition" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$LANGGRAPH_ECS_SERVICE"

      - name: Update ECS service
        run: |
          set -euo pipefail
          task_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/deploy-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$task_definition" \
            --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
