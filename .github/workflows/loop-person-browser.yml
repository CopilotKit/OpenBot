# TEMPORARY: loops the person-browser test before and after the fix, then is removed before merge.
name: loop person browser
on:
  pull_request:
    paths:
      - .github/workflows/loop-person-browser.yml
permissions:
  contents: read
jobs:
  loop:
    name: loop (${{ matrix.which }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        which: [before, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: agent-computer
      - run: bunx playwright install --with-deps --no-shell chromium
        working-directory: agent-computer
      # main's rule: every process on the profile with no --type is a browser.
      - name: Put back main's rule
        if: matrix.which == 'before'
        run: perl -0pi -e 's/\.filter\(\(\{ ppid \}\) => !pids\.has\(ppid\)\)/.filter(() => pids.size > 0)/' agent-computer/tests/fixtures/browser-process.ts && git diff --stat
      - name: Run the test 50 times
        working-directory: agent-computer
        env:
          OPENBOT_COMPUTER_BROWSER: '1'
          COMPUTER_BROWSER_MODE: headless
        run: |
          failed=0; passed=0
          for i in $(seq 1 50); do
            bun test tests/person-browser.test.ts -t "Desktop: installed.*there is one browser" > run.log 2>&1 || true
            if grep -q "(pass) Desktop: installed Google Chrome, headless here > there is one browser" run.log; then
              passed=$((passed + 1))
            elif grep -q "(fail) Desktop: installed Google Chrome, headless here > there is one browser" run.log; then
              failed=$((failed + 1))
              [ "$failed" -le 2 ] && grep -B2 -A6 "product-version" run.log | cut -c1-300 | head -20
            else
              echo "iteration $i did not run the test"; tail -30 run.log
            fi
          done
          echo "RESULT ${{ matrix.which }}: passed=$passed failed=$failed of 50"
