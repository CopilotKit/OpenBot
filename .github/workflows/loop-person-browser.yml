# TEMPORARY: loops the person-browser test before and after the fix, then is removed before merge.
name: loop person browser
on:
  pull_request:
    paths:
      - .github/workflows/loop-person-browser.yml
permissions:
  contents: read
jobs:
  loop:
    name: loop (${{ matrix.which }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        which: [before, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: agent-computer
      - run: bunx playwright install --with-deps --no-shell chromium
        working-directory: agent-computer
      - name: Put back the test as main has it
        if: matrix.which == 'before'
        run: git show origin/main:agent-computer/tests/person-browser.test.ts > agent-computer/tests/person-browser.test.ts
      # Samples the process table every few milliseconds while the test runs, and for each person
      # profile asks both rules how many browsers it has: main's (every process on the profile with
      # no --type) and this branch's (browsersOnProfile).
      - name: Write the sampler
        working-directory: agent-computer
        run: |
          cat > sampler.ts <<'TS'
          import { browsersOnProfile } from "./tests/fixtures/browser-process";
          const seen = new Map<number, string>();
          let samples = 0, oldMore = 0, newMore = 0;
          const stop = Date.now() + Number(process.argv[2] ?? "60000");
          while (Date.now() < stop) {
            const listing = Bun.spawnSync(["ps", "-axo", "pid=,ppid=,command="]).stdout.toString();
            samples += 1;
            const profiles = new Set(
              [...listing.matchAll(/--user-data-dir=(\S*openbot-person-browser\S*)/g)].map((m) => m[1] as string),
            );
            for (const profile of profiles) {
              const old = listing.split("\n").filter(
                (line) => line.includes(`--user-data-dir=${profile}`) && !line.includes("--type="),
              );
              if (old.length > 1) oldMore += 1;
              if (browsersOnProfile(listing, profile).length > 1) newMore += 1;
            }
            for (const line of listing.split("\n"))
              if (line.includes("--product-version") && line.includes("openbot-person-browser")) {
                const pid = Number.parseInt(line.trim(), 10);
                if (!seen.has(pid)) seen.set(pid, line.trim().split(/\s+/).slice(0, 3).join(" "));
              }
            await Bun.sleep(3);
          }
          console.log(`SAMPLER samples=${samples} oldRuleSawTwo=${oldMore} newRuleSawTwo=${newMore} productVersionChildren=${seen.size} ${[...seen.values()].join(" | ")}`);
          TS
      # The sampler on its own, for the whole of one run each time, so its line is printed.
      - name: Sample the process table across 30 runs
        working-directory: agent-computer
        env:
          OPENBOT_COMPUTER_BROWSER: '1'
          COMPUTER_BROWSER_MODE: headless
        run: |
          for i in $(seq 1 30); do
            bun sampler.ts 40000 &
            sampler=$!
            bun test tests/person-browser.test.ts -t "Desktop: installed" > run.log 2>&1 || true
            wait $sampler
          done
