# TEMPORARY: loops the person-browser test before and after the fix, then is removed before merge.
name: loop person browser
on:
  pull_request:
    paths:
      - .github/workflows/loop-person-browser.yml
permissions:
  contents: read
jobs:
  loop:
    name: loop (${{ matrix.which }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        which: [before, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: agent-computer
      - run: bunx playwright install --with-deps --no-shell chromium
        working-directory: agent-computer
      - name: Put back the test as main has it
        if: matrix.which == 'before'
        run: git show origin/main:agent-computer/tests/person-browser.test.ts > agent-computer/tests/person-browser.test.ts
      - name: Run the installed-Chrome variant 50 times
        working-directory: agent-computer
        env:
          OPENBOT_COMPUTER_BROWSER: '1'
          COMPUTER_BROWSER_MODE: headless
        run: |
          failed=0; found2=0; ran=0
          for i in $(seq 1 50); do
            bun test tests/person-browser.test.ts -t "Desktop: installed" > run.log 2>&1 || true
            ran=$((ran + 1))
            if grep -q "(fail) Desktop: installed Google Chrome, headless here > a browser that stops answering" run.log; then
              failed=$((failed + 1))
              grep -q "found 2" run.log && found2=$((found2 + 1))
              grep -A3 "found 2" run.log | cut -c1-400 || true
            fi
            grep -q "(pass) Desktop: installed Google Chrome, headless here > a browser that stops answering" run.log || grep -q "(fail) Desktop: installed Google Chrome, headless here > a browser that stops answering" run.log || { echo "iteration $i did not run the test"; tail -30 run.log; }
          done
          echo "RESULT ${{ matrix.which }}: ran=$ran failed=$failed found2=$found2"
