name: Build Android APK (TWA)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Deployed app domain (e.g. app.example.com) — leave blank to build with placeholder"
        required: false
        default: "example.com"
        type: string
  release:
    types: [published]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set domain
        id: vars
        run: |
          DOMAIN="${{ github.event.inputs.domain || 'example.com' }}"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Patch domain into Android resources
        run: |
          DOMAIN="${{ steps.vars.outputs.domain }}"
          sed -i "s|YOUR_DOMAIN_HERE|$DOMAIN|g" \
            twa/android/app/src/main/res/values/strings.xml

      - name: Set up Gradle wrapper
        working-directory: twa/android
        run: |
          gradle wrapper --gradle-version 8.6

      - name: Grant gradlew execute permission
        working-directory: twa/android
        run: chmod +x gradlew

      - name: Generate keystore
        working-directory: twa/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias openbot \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OpenBot, O=OpenBot, C=US" \
              -storepass openbot123 -keypass openbot123
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — generated a throwaway keystore. The APK installs but cannot be updated on Play Store."
          fi

      - name: Build release APK
        working-directory: twa/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'openbot123' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'openbot' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'openbot123' }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Print SHA-256 fingerprint
        working-directory: twa/android
        run: |
          echo "=== Certificate fingerprint for assetlinks.json ==="
          keytool -printcert \
            -jarfile app/build/outputs/apk/release/app-release.apk \
            2>/dev/null | grep "SHA256:" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbot-release.apk
          path: twa/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: twa/android/app/build/outputs/apk/release/app-release.apk
