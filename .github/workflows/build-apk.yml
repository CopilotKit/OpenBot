name: Build Android APK (TWA)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Deployed app domain (e.g. app.example.com)"
        required: true
        type: string
  release:
    types: [published]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Set domain
        id: domain
        run: |
          DOMAIN="${{ github.event.inputs.domain || 'localhost' }}"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Patch twa-manifest.json with domain
        run: |
          DOMAIN="${{ steps.domain.outputs.domain }}"
          sed -i "s|YOUR_DOMAIN_HERE|$DOMAIN|g" twa/twa-manifest.json

      - name: Restore or generate keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p twa/android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > twa/android.keystore
          else
            keytool -genkeypair -v \
              -keystore twa/android.keystore \
              -alias openbot \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OpenBot, O=OpenBot, C=US" \
              -storepass openbot123 -keypass openbot123
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — generated a throwaway keystore."
          fi

      - name: Init Bubblewrap project
        working-directory: twa
        run: |
          bubblewrap init \
            --manifest "https://${{ steps.domain.outputs.domain }}/manifest.webmanifest" \
            --directory android \
            --skipPwaValidation || true

      - name: Build APK
        working-directory: twa/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'openbot123' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'openbot' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'openbot123' }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=../android.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openbot-release.apk
          path: twa/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: twa/android/app/build/outputs/apk/release/app-release.apk
