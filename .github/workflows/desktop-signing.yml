name: Desktop Windows signing

on:
  workflow_dispatch:
    inputs:
      signing-mode:
        description: Opt in to signing with the protected Azure Key Vault certificate
        type: choice
        options: [none, keyvault]
        default: none
        required: true
      release-tag:
        description: Attach the signed installer to this existing release. Run from that tag.
        type: string
        default: ""
        required: false
      # publish-release.yml says whether the release becomes Latest. A stable release becomes
      # Latest once both this and Desktop macOS signing have attached their signed installers,
      # in whichever finishes second. Signing a release again by hand leaves Latest alone unless
      # this is set.
      make-latest:
        description: Mark the release Latest once every signed installer is attached, unless a newer release already is
        type: boolean
        default: false
        required: false
  # A label permits validation before this workflow exists on main. New pushes
  # run only the checks: remove/reapply the label to request signing a new head.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - desktop/**
      - package.json
      - .github/workflows/desktop-signing.yml
      - .github/workflows/publish-release.yml
      - scripts/release-*
      - docs/windows-signing.md

permissions:
  contents: read

concurrency:
  group: desktop-windows-signing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Match the source publisher's exact repository/distribution identity in official and fork builds.
env:
  OPENBOT_DISTRIBUTION_ID: ${{ vars.OPENBOT_DISTRIBUTION_ID || github.repository }}
  OPENBOT_RELEASE_REPOSITORY: ${{ github.repository }}
  OPENBOT_RELEASE_CHANNEL: ${{ vars.OPENBOT_RELEASE_CHANNEL || 'stable' }}

jobs:
  checks:
    name: Signing regressions (no Azure access)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: PowerShell signing regressions
        shell: pwsh
        run: ./desktop/scripts/test-windows-signing.ps1
      # A stable release becomes Latest only once this workflow's signed installer is on it too, so
      # the Windows download link never serves the unsigned one. The scripts behind it run in
      # Updater regressions (no Apple access) and the main test suite; this checks the wiring here.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true
      - name: Latest waits for the signed Windows installer
        run: bun test scripts/signing-workflows.test.ts
        working-directory: desktop

  sign:
    name: Sign and verify app and NSIS installer
    needs: checks
    outputs:
      # The artifact of the attempt that signed, so a re-run of `publish` alone attaches the
      # installer that attempt verified, not one from an earlier attempt.
      artifact: openbot-windows-signed-${{ github.run_id }}-${{ github.run_attempt }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.signing-mode == 'keyvault') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'windows-signing' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_KEY_VAULT_URL: ${{ vars.AZURE_KEY_VAULT_URL }}
      CODE_SIGNING_CERT_NAME: ${{ vars.CODE_SIGNING_CERT_NAME }}
      SIGNING_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check signing configuration
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_KEY_VAULT_URL', 'CODE_SIGNING_CERT_NAME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing windows-signing environment variable: $name"
            }
          }
          if ((git rev-parse HEAD) -ne $env:SIGNING_SOURCE_SHA) { throw 'Checkout does not match requested source SHA.' }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check certificate access
        run: |
          az keyvault certificate show --id "$env:AZURE_KEY_VAULT_URL/certificates/$env:CODE_SIGNING_CERT_NAME" --query id --output tsv --only-show-errors
          if ($LASTEXITCODE -ne 0) { throw 'Could not read signing certificate.' }
      # No caches in this job, Rust or Bun: a release attaches what it builds, and a signed
      # installer must come from the tree and the lockfiles, not from anything an earlier run left
      # behind. The same rule as Desktop macOS signing.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install pinned AzureSignTool
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'azuresigntool-7.0.1'
          New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
          $tool = Join-Path $toolDirectory 'AzureSignTool.exe'
          Invoke-WebRequest 'https://github.com/vcsjones/AzureSignTool/releases/download/v7.0.1/AzureSignTool-x64.exe' -OutFile $tool
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash -ne 'DC85A3F24BCD5978C63FCFD167A9B41313AF9116722B99B831400F05F387FCBA') {
            throw 'AzureSignTool download hash mismatch.'
          }
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run typecheck
        working-directory: desktop
      # A tag is a release, and its installer carries the release version, as the unsigned one
      # it replaces does. Anything else is an internal build named after its commit.
      - name: Prepare the build version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            bun scripts/desktop-version.ts release
          } else {
            bun scripts/desktop-version.ts internal
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the build version.' }
          Get-Content build-version.json
        working-directory: desktop
      # signed-build.ts builds what desktop-build.yml built for the same release: a candidate or
      # beta pinned to its release's images, and the CLI whenever the tree can bundle one. On a
      # release this signed installer replaces the unsigned one, so it must be the same product.
      # Anything else (a pull request, a branch) is an ordinary internal build, as before.
      - name: Build and sign
        env:
          WINDOWS_SIGNING: keyvault
          # To read the release's container-images.json when this build is a candidate.
          GH_TOKEN: ${{ github.token }}
          OPENBOT_GOOGLE_MODEL_OAUTH_CLIENT_ID: ${{ vars.OPENBOT_GOOGLE_MODEL_OAUTH_CLIENT_ID }}
          OPENBOT_GOOGLE_MODEL_OAUTH_CLIENT_SECRET: ${{ secrets.OPENBOT_GOOGLE_MODEL_OAUTH_CLIENT_SECRET }}
          OPENBOT_GOOGLE_MODEL_OAUTH_QUOTA_PROJECT: ${{ vars.OPENBOT_GOOGLE_MODEL_OAUTH_QUOTA_PROJECT }}
        run: bun scripts/signed-build.ts win32 x64 src-tauri/tauri.windows-signing.conf.json --bundles nsis
        working-directory: desktop
      # Tauri restores the unsigned build output after bundling. Verify the app
      # employees receive by extracting its signed payload from the installer.
      - name: Extract signed app from NSIS installer
        run: |
          $installers = @(Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          & 7z e $installers[0].FullName '-odesktop/signed-app' '-r' '-y' 'openbot-desktop.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract signed app from NSIS installer.' }
      - name: Verify publisher, trust, and timestamp on both executables
        run: |
          $build = Get-Content desktop/build-version.json -Raw | ConvertFrom-Json
          ./desktop/scripts/verify-windows-signatures.ps1 -ExpectedVersion $build.version
      - name: Retain verified binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbot-windows-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/signed-app/openbot-desktop.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/build-version.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbot-windows-signatures-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop/signing-evidence/
          if-no-files-found: warn
          retention-days: 14

  # The signed installer onto the release, from a job of its own so the signing job never holds a
  # token that can write to the repository. It replaces the unsigned installer the release was
  # published with, under the name Tauri gave it and under the fixed name a web page links to
  # (scripts/release-download-names.sh). Both, or the stable link keeps serving the unsigned build.
  # `--clobber` makes a re-run replace them again. The details are in
  # desktop/scripts/publish-signed-windows.sh.
  publish:
    name: Attach to the release
    needs: sign
    # One attach job at a time per release, across Desktop macOS signing and Desktop Windows
    # signing: each ends by asking whether every signed installer is on the release, and the one
    # that runs second must see what the first attached, or neither would make it Latest. Same
    # group in both workflows; an attach that is running is never cancelled.
    concurrency:
      group: release-attach-${{ inputs.release-tag || github.ref_name }}
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.release-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `actions: write` to start Downloads sync when this run makes the release Latest
    # (scripts/release-make-latest.sh).
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      MAKE_LATEST: ${{ inputs.make-latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.outputs.artifact }}
          path: artifacts
      - name: Attach to the release
        env:
          ARTIFACTS: artifacts
        run: desktop/scripts/publish-signed-windows.sh
