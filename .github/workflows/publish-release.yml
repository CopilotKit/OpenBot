name: Publish release

# Merging a release PR is the trigger. Nothing here is dispatched by hand, so a published release is
# always a reviewed commit on main, and the tag is created by this workflow rather than by a person
# with a terminal.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Identity belongs to this repository. Forks must explicitly declare their upstream baseline; never
# inherit another publisher's registry. The compatibility and upgrade policy is not configuration:
# it is release-policy.json in the release commit, reviewed with the release.
env:
  OPENBOT_DISTRIBUTION_ID: ${{ vars.OPENBOT_DISTRIBUTION_ID || github.repository }}
  OPENBOT_UPSTREAM_REPOSITORY: ${{ vars.OPENBOT_UPSTREAM_REPOSITORY || 'CopilotKit/openbot' }}
  OPENBOT_UPSTREAM_COMMIT: ${{ vars.OPENBOT_UPSTREAM_COMMIT }}
  OPENBOT_RELEASE_CHANNEL: ${{ vars.OPENBOT_RELEASE_CHANNEL || 'stable' }}

jobs:
  # Every push to main runs this, and almost none of them are releases. This job decides which, and
  # it decides from the merged pull request rather than from the commit message, because a commit
  # message is something anybody can write.
  metadata:
    name: classify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pulls } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: context.sha,
              });
            const pull = pulls.find((candidate) =>
              candidate.base.ref === "main" &&
              candidate.merged_at !== null &&
              candidate.merge_commit_sha === context.sha
            );
            if (!pull) {
              // Not a merge commit of a reviewed PR. That is most pushes; it is not an error.
              core.setOutput("head_ref", "");
              core.setOutput("trusted", "false");
              return;
            }
            // A release branch name is not enough on its own: a fork can open a PR from a branch
            // with any name it likes. The branch must be in this repository and the PR must carry
            // the label, which only somebody with write access can add.
            const trusted =
              /^release\/publish\/v\d+\.\d+\.\d+$/.test(pull.head.ref) &&
              pull.head.repo?.full_name === `${owner}/${repo}` &&
              pull.labels.some((label) => label.name === "release");
            core.setOutput("head_ref", pull.head.ref);
            core.setOutput("trusted", String(trusted));
      - id: release
        name: Decide
        env:
          HEAD_REF: ${{ steps.pull-request.outputs.head_ref }}
          TRUSTED: ${{ steps.pull-request.outputs.trusted }}
        run: |
          set -euo pipefail
          if [ "$TRUSTED" != true ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit."
            exit 0
          fi
          version="${HEAD_REF#release/publish/}"
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  # The version in the tree has to agree with the branch that is publishing it. They are written by
  # the same workflow, so disagreement means something was edited by hand after review.
  verify:
    name: verify
    needs: metadata
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.components.outputs.components }}
      image_repository: ${{ steps.registry.outputs.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test "v$(bun -e 'console.log(require("./package.json").version)')" = "$VERSION"
          grep -q "^## ${VERSION#v}$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for ${VERSION#v}."
            exit 1
          }
      # release-policy.json must name this version. One left over from the previous release names
      # that release, and is refused here, before anything is built or pushed.
      - name: Validate release compatibility and source baseline
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bun scripts/release-manifest.ts --validate-policy
      - id: registry
        name: Resolve this distribution's registry namespace
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          repository="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< "$REPOSITORY")"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      # The services published alongside the image above. Read from the tree rather than written
      # here, because CI checks the same file when it proves those Dockerfiles still build, so the
      # set that is tested and the set that is published cannot drift apart.
      - id: components
        run: echo "components=$(jq -c . .github/published-images.json)" >> "$GITHUB_OUTPUT"

  # The same checks CI runs, against the commit being published. This is the gate: nothing is built
  # or tagged unless they pass here, on this exact tree.
  checks:
    needs: [metadata, verify]
    if: needs.metadata.outputs.is_release == 'true'
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  # One image, built once. Everything downstream refers to it by digest, so what was tested is what
  # is deployed and there is no second build to disagree with the first.
  image:
    name: image
    needs: [metadata, verify, checks]
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The attestation is signed with the workflow's own OIDC identity, so there is no key to hold
      # and the signature says which workflow, repository and commit produced the image.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            OPENBOT_BUILD_VERSION=${{ needs.metadata.outputs.version }}
            OPENBOT_BUILD_COMMIT=${{ github.sha }}
            OPENBOT_BUILD_DISTRIBUTION_ID=${{ env.OPENBOT_DISTRIBUTION_ID }}
            OPENBOT_BUILD_REPOSITORY=${{ github.repository }}
            OPENBOT_BUILD_CHANNEL=${{ env.OPENBOT_RELEASE_CHANNEL }}
          # The version, the commit, and a moving latest. The version tag is the one to deploy; the
          # commit tag is how you find out what a running image actually contains.
          tags: |
            ${{ needs.verify.outputs.image_repository }}:${{ needs.metadata.outputs.version }}
            ${{ needs.verify.outputs.image_repository }}:${{ github.sha }}
            ${{ needs.verify.outputs.image_repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      # BuildKit's own attestations above travel inside the image. This one is the record GitHub
      # holds, and it is what `gh attestation verify oci://${{ needs.verify.outputs.image_repository }}:vX.Y.Z
      # -R CopilotKit/OpenBot` checks before anybody deploys it. Bound to the digest, never a tag,
      # because a tag can be moved to point at something else afterwards.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.verify.outputs.image_repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The images the installer pulls instead of building. `docker-compose.yml` builds these from
  # source on every machine, which needs a toolchain and several minutes a desktop install does not
  # have. Published here, from the same commit as the image above, so a deployment and a laptop run
  # the same code.
  #
  # Two architectures, because the machines are laptops: arm64 Macs and amd64 everything else. Built
  # on native runners rather than under QEMU. Emulated `bun install` and `vite build` are a known
  # source of release-day flakiness, and arm64 runners are free to a public repository, so emulation
  # would be the slower and less reliable option at no saving.
  component-images:
    name: ${{ matrix.image }} ${{ matrix.platform.arch }}
    needs: [metadata, verify, checks]
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing should not hide whether the others build, and a half-finished run leaves
      # nothing deployable: these builds are pushed untagged, and the tags are written by the job
      # below only once both architectures of an image exist.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.verify.outputs.components) }}
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest and deliberately untagged. A tag written here would name one architecture,
      # and the two jobs for one image would race to own it, so the last to finish would decide what
      # the tag meant.
      #
      # zstd, not gzip. A pull is already a compressed transfer, so this is not about compressing
      # something that was not; it is a better algorithm for the same job. `force-compression`
      # reaches layers that came from somebody else's registry; without it only our own thin layers
      # change and the saving rounds to nothing. The cost is that these images no longer share layers
      # with a gzip pull of the same base, and that a client which cannot read zstd cannot read them,
      # which is why this is here and not on the `openbot` image above: that one is pulled by servers
      # with whatever they have, and these are pulled by an installer that ships Podman. After the
      # Chromium-only `agent-computer` Dockerfile change, while keeping Node/npm/npx from the
      # official Node 24.18.1 image, local zstd OCI layer descriptors measured 535.0 MiB on arm64
      # and 518.1 MiB on amd64.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            OPENBOT_BUILD_VERSION=${{ needs.metadata.outputs.version }}
            OPENBOT_BUILD_COMMIT=${{ github.sha }}
            OPENBOT_BUILD_DISTRIBUTION_ID=${{ env.OPENBOT_DISTRIBUTION_ID }}
            OPENBOT_BUILD_REPOSITORY=${{ github.repository }}
            OPENBOT_BUILD_CHANNEL=${{ env.OPENBOT_RELEASE_CHANNEL }}
          # `oci-mediatypes=true` because zstd layers have no Docker-schema2 media type to be
          # described by. It is buildx's default for this exporter and is stated rather than
          # assumed, since the push fails without it and the reason would not be obvious.
          outputs: type=image,name=${{ needs.verify.outputs.image_repository }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,compression=zstd,force-compression=true
          # Scoped per image and per architecture. One shared scope would have ten builds
          # overwriting each other's cache and none of them reading their own.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          provenance: true
          sbom: true
      # A matrix job's outputs are not addressable by the jobs that consume them, so the digest
      # travels as a file. One artifact per image and architecture, because same-named artifacts
      # from different matrix legs collide.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p digests
          echo "$DIGEST" > "digests/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: digests/
          retention-days: 1

  # Two per-architecture images become one reference. Whatever pulls it, a laptop or a cluster, names
  # the manifest list and gets its own architecture without being told which one it is.
  component-manifests:
    name: ${{ matrix.image }} manifest
    needs: [metadata, verify, checks, component-images]
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Same identity and the same reason as the image above: the attestation says which workflow,
      # repository and commit produced this, and there is no key to hold.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.verify.outputs.components) }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Exact artifact names, one per architecture, not a `digest-<image>-*` glob. An image whose
      # name is a prefix of another — `agent-langgraph` of `agent-langgraph-agui` — would otherwise
      # match the other's digest artifacts too, and `merge-multiple` would overwrite this image's own
      # `amd64`/`arm64` file with the other's. That shipped once: this image's manifest list was built
      # from a digest that lived in the other's repository, so the join failed with "not found".
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-amd64
          path: digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-arm64
          path: digests
      - id: merge
        name: Write the tags over both architectures
        env:
          REPOSITORY: ${{ needs.verify.outputs.image_repository }}-${{ matrix.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Both architectures or neither. A manifest list holding one of them installs on half the
          # machines and looks exactly like one holding both until somebody's laptop says
          # "no matching manifest".
          refs=()
          for arch in amd64 arm64; do
            digest="$(cat "digests/$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            refs+=("$REPOSITORY@$digest")
          done
          docker buildx imagetools create \
            --tag "$REPOSITORY:$VERSION" \
            --tag "$REPOSITORY:$COMMIT" \
            --tag "$REPOSITORY:latest" \
            "${refs[@]}"
          # The list's own digest, which is what anything downstream pins. Read back from the
          # registry rather than derived here, and checked, so a template that stops returning a
          # digest fails now instead of writing something unusable into the release.
          digest="$(docker buildx imagetools inspect "$REPOSITORY:$VERSION" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.verify.outputs.image_repository }}-${{ matrix.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
      # For the same reason the digests above travel as files: a matrix cannot hand a value to a
      # later job.
      - name: Record the manifest
        env:
          NAME: ${{ matrix.image }}
          REPOSITORY: ${{ needs.verify.outputs.image_repository }}-${{ matrix.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p manifests
          jq -n --arg name "$NAME" --arg repository "$REPOSITORY" --arg digest "$DIGEST" \
            '{name: $name, repository: $repository, digest: $digest}' > "manifests/$NAME.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-${{ matrix.image }}
          path: manifests/
          retention-days: 1

  # The tag and the release, last, so nothing is announced that was not built. The manifest is the
  # useful artefact: it pins the digest, so a deploy or a rollback names an exact image rather than a
  # tag somebody could move.
  github-release:
    name: tag and release
    needs: [metadata, verify, checks, image, component-manifests]
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No credential is left in the runner: the tag is created through the API below rather than
      # with `git push`, so nothing here needs one, and no later step or action can read one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: manifest-*
          path: manifests
          merge-multiple: true
      - name: Write the image manifest
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          COMMIT: ${{ github.sha }}
          COMPONENTS: ${{ needs.verify.outputs.components }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Every image this release published, or the file is not written. A missing entry is a
          # service whatever reads this would quietly build from source instead, which is the thing
          # publishing them was for, and it would only be noticed on somebody's laptop.
          expected="$(jq -r 'length' <<< "$COMPONENTS")"
          found="$(find manifests -name '*.json' -type f | wc -l | tr -d ' ')"
          if [ "$found" != "$expected" ]; then
            echo "::error::Expected $expected component manifests, found $found."
            exit 1
          fi
          components="$(jq -s 'map({
            (.name): {
              repository: .repository,
              digest: .digest,
              reference: (.repository + "@" + .digest),
            }
          }) | add' manifests/*.json)"
          # Keep the legacy image manifest intact for existing installers.
          jq -n \
            --arg version "$VERSION" \
            --arg digest "$DIGEST" \
            --arg commit "$COMMIT" \
            --arg repository "${{ needs.verify.outputs.image_repository }}" \
            --argjson components "$components" \
            '{
              version: $version,
              commit: $commit,
              images: ({
                openbot: {
                  repository: $repository,
                  digest: $digest,
                  reference: ($repository + "@" + $digest),
                },
              } + $components),
            }' > container-images.json
          cat container-images.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Package this release's chart
        run: |
          set -euo pipefail
          helm dependency build charts/openbot
          mkdir -p release-assets
          helm package charts/openbot --destination release-assets
          chart_version="$(helm show chart charts/openbot | sed -n 's/^version: //p')"
          test -f "release-assets/openbot-$chart_version.tgz"
          echo "OPENBOT_CHART_PATH=release-assets/openbot-$chart_version.tgz" >> "$GITHUB_ENV"
          echo "OPENBOT_CHART_VERSION=$chart_version" >> "$GITHUB_ENV"
      # A rerun of a half-published release. `helm package` stamps the time it ran and the provenance
      # bundle is signed again on every run, so this run's bytes never equal the published ones even
      # when nothing changed. What was published is fetched first; each asset this run produces is
      # compared with it by content, and the published bytes are kept, so the manifest and the
      # attestation below describe exactly what is downloadable.
      - name: Fetch what an earlier attempt already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/published"
          mkdir -p "$published"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/existing-assets.json" 2>/dev/null; then
            if [ "$(jq '.assets | length' "$RUNNER_TEMP/existing-assets.json")" -gt 0 ]; then
              gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$published"
            fi
            echo "OPENBOT_PUBLISHED_ASSETS=$published" >> "$GITHUB_ENV"
          fi
      - name: Archive exact source and write release manifest
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bun scripts/release-manifest.ts
      - id: source-provenance
        name: Authenticate release metadata and source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/release-manifest.json
            release-assets/openbot-source.tar.gz
            release-assets/openbot-*.tgz
            container-images.json
      - name: Save portable provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.source-provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" release-assets/release-provenance.sigstore.json
          bun scripts/release-manifest.ts --adopt-provenance release-assets/release-provenance.sigstore.json
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          # The notes are the section a person wrote, not a list of commits.
          awk -v v="## ${VERSION#v}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          test -s notes.md

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" > tag.json 2>/dev/null; then
            test "$(jq -r .object.sha tag.json)" = "$GITHUB_SHA" || {
              echo "::error::$VERSION already identifies another source commit."
              exit 1
            }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA" >/dev/null
          fi

          if [ -n "${OPENBOT_PUBLISHED_ASSETS:-}" ]; then
            # Release-specific source/chart URLs are immutable after first publication. A rerun
            # fills in what is missing. Every asset that was published already was compared by
            # content and kept above, so it is byte-identical here. The one exception is the
            # provenance bundle, replaced only when the published one attests assets that were
            # never published.
            gh release edit "$VERSION" --title "$VERSION" --notes-file notes.md
            for artifact in container-images.json release-assets/*; do
              name="$(basename "$artifact")"
              published="$OPENBOT_PUBLISHED_ASSETS/$name"
              if [ ! -e "$published" ]; then
                gh release upload "$VERSION" "$artifact"
              elif ! cmp -s "$artifact" "$published"; then
                if [ "$name" != release-provenance.sigstore.json ]; then
                  echo "::error::Published asset $name differs; publish a new release version."
                  exit 1
                fi
                gh release upload "$VERSION" "$artifact" --clobber
              fi
            done
          else
            gh release create "$VERSION" container-images.json release-assets/* \
              --title "$VERSION" --notes-file notes.md
          fi
