name: Desktop

# The shell is the one thing here that cannot be proved by running it on Linux: it is a macOS app, a
# Windows app and a Linux app built from one tree, and the ways they differ are exactly the ways
# this fails. So it tests and builds on all three, on every change to it.
# `shared/harnesses.json` and `shared/marks/**` are watched here even though they are not under
# desktop/: the catalogue the setup window draws moved there so the web app could read one copy, and
# these jobs are the only ones that prove it still deserializes into `Harness` — `catalogue()` parses
# it at runtime with an `expect`, so a bad row panics the window rather than failing a type check.
on:
  pull_request:
    paths: ["desktop/**", "shared/harnesses.json", "shared/marks/**", "shared/recorder-extension.json", "shared/fixtures/client-version/**", "package.json", ".github/workflows/desktop.yml", ".github/workflows/desktop-build.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "shared/harnesses.json", "shared/marks/**", "shared/recorder-extension.json", "shared/fixtures/client-version/**", "package.json", ".github/workflows/desktop.yml", ".github/workflows/desktop-build.yml"]
  workflow_call:
    secrets:
      OPENBOT_GOOGLE_MODEL_OAUTH_CLIENT_SECRET:
        required: false

permissions:
  contents: read

# Pull requests from forks share one group, one run at a time, as in CI.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'desktop-forks' || format('desktop-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

# Match the source publisher's exact repository/distribution identity in official and fork builds.
env:
  OPENBOT_DISTRIBUTION_ID: ${{ vars.OPENBOT_DISTRIBUTION_ID || github.repository }}
  OPENBOT_RELEASE_REPOSITORY: ${{ github.repository }}
  OPENBOT_RELEASE_CHANNEL: ${{ vars.OPENBOT_RELEASE_CHANNEL || 'stable' }}

jobs:
  # What this push has to run (scripts/ci-changes.ts), as in CI: on a pull request, a job whose
  # inputs are unchanged since a commit where it passed is skipped. The setup window's own tests run
  # in CI's suite, so a change to them alone builds no app here, and neither does a release PR that
  # moves only the versions. Any other event builds everything.
  changes:
    name: changes
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'openbot-ubuntu-16core' }}
    permissions:
      contents: read
      actions: read
    outputs:
      core: ${{ steps.decide.outputs.core }}
      app: ${{ steps.decide.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Strings, since 0 is falsy and `&& 0 || 1` would always give 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: ${{ github.event_name == 'pull_request' && 'blob:none' || '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - id: decide
        name: Decide what runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-changes.ts desktop

  # Fast formatting and lint checks. Rust regression tests run once per platform below.
  core:
    name: core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    # Clippy over the whole crate is CPU-bound: the 16-core larger runner, except for forks.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'openbot-ubuntu-16core' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      # Linux is the only target needing system libraries, and it needs them even to check.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri

  # The three artifacts, built by the shared workflow. A pull request build is unchanged: unpinned, no CLI, kept 7 days.
  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: $/.github/workflows/desktop-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      channel: internal
      bundle_cli: false
      manifest_artifact: ""
      retention_days: 7
      platforms: '["macos","windows","linux"]'
    secrets:
      OPENBOT_GOOGLE_MODEL_OAUTH_CLIENT_SECRET: ${{ secrets.OPENBOT_GOOGLE_MODEL_OAUTH_CLIENT_SECRET }}
