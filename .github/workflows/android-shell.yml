name: Android shell

# Builds the experimental Android shell in android-shell/ and runs its instrumented tests on an
# emulator: against the hosted web app at my.open.bot (suite 1), against two mock stacks of this
# branch's built web app (app/workbench/mock-server.ts, suite 2), and against the probe site in
# android-shell/probe (web view basics). One job builds the APKs (a compile error stops everything there), one runs
# lint, the unit tests and the release checks beside the tests, and two emulators run the
# instrumented tests in parallel: "mock" (suite 2 and the hardening tests, against this branch's web
# build) and "other" (the probe site and suite 1, the real backend).
#
# Artifacts: android-shell-<run id>-<shard> (SUMMARY.md, diagnostics, logcat, screenshots under
# shots/), android-shell-checks-<run id> (lint, unit tests, what ships) and, only when a test used a
# real account, android-shell-private-<run id>-<shard>. Recordings come from android-shell-video.yml.
#
# Optional repository secrets for the tests against a real account (skipped when empty):
# OPENBOT_SHELL_TEST_SESSION, OPENBOT_SHELL_GOOGLE_EMAIL, OPENBOT_SHELL_GOOGLE_PASSWORD,
# OPENBOT_SHELL_GOOGLE_TOTP_SECRET.
on:
  push:
    branches:
      - android-webview-shell
    paths:
      - android-shell/**
      - .github/workflows/android-shell.yml
      - app/workbench/mock-server.ts
  workflow_dispatch:
    inputs:
      google_sign_in:
        description: Run the Google sign-in in a Custom Tab (sends one sign-in prompt to the account's phone)
        type: boolean
        default: false
      api_level:
        description: Emulator API level (35 or 36)
        type: string
        default: "35"
      real_backend_only:
        description: Run only the real-backend suite (skip the mock suite, the probe and the demo)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: android-shell-${{ github.ref }}-${{ inputs.api_level || '35' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the APKs
    if: github.repository == 'CopilotKit/OpenBot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-shell/**/*.gradle.kts
            android-shell/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug, its tests, releaseTest and release
        working-directory: android-shell
        run: |
          tasks="assembleDebug assembleDebugAndroidTest assembleReleaseTest assembleRelease"
          log=/tmp/gradle-build.log
          # Maven Central answers 429 now and then: up to three tries.
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            if ./gradlew --no-daemon --stacktrace $tasks 2>&1 | tee "$log"; then exit_code=0; else exit_code=1; fi
            if [ "$exit_code" = 0 ] || ! grep -q "Could not resolve\|status code 429\|Could not GET" "$log"; then break; fi
            echo "dependency download failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          exit "$exit_code"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-shell-apks-${{ github.run_id }}
          path: android-shell/app/build/outputs/apk/
          retention-days: 3
          if-no-files-found: error

  checks:
    name: Lint, unit tests and what ships
    if: github.repository == 'CopilotKit/OpenBot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-shell/**/*.gradle.kts
            android-shell/gradle/wrapper/gradle-wrapper.properties

      - name: Lint, unit tests, release build
        working-directory: android-shell
        run: |
          mkdir -p "$GITHUB_WORKSPACE/checks"
          tasks="testDebugUnitTest lint lintRelease assembleRelease assembleReleaseTest"
          log="$GITHUB_WORKSPACE/checks/gradle.log"
          # Maven Central answers 429 now and then: up to three tries.
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            if ./gradlew --no-daemon --stacktrace $tasks 2>&1 | tee "$log"; then exit_code=0; else exit_code=1; fi
            if [ "$exit_code" = 0 ] || ! grep -q "Could not resolve\|status code 429\|Could not GET" "$log"; then break; fi
            echo "dependency download failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          mkdir -p "$GITHUB_WORKSPACE/checks/lint"
          cp app/build/reports/lint-results-*.{html,xml,txt} "$GITHUB_WORKSPACE/checks/lint/" 2>/dev/null || true
          cp -r app/build/reports/tests "$GITHUB_WORKSPACE/checks/unit-tests" 2>/dev/null || true
          for report in app/build/reports/lint-results-*.txt; do
            [ -f "$report" ] && { echo "::group::$report"; cat "$report"; echo "::endgroup::"; }
          done
          exit "$exit_code"

      - name: Check what ships
        working-directory: android-shell
        run: |
          ci/check_apk.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/releaseTest/app-releaseTest.apk | tee "$GITHUB_WORKSPACE/checks/check-apk.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-shell-checks-${{ github.run_id }}
          path: checks/
          retention-days: 14
          if-no-files-found: warn

  emulator:
    name: Instrumented tests (${{ matrix.shard }})
    needs: build
    if: github.repository == 'CopilotKit/OpenBot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [mock, other]
    env:
      API_LEVEL: ${{ inputs.api_level || '35' }}
      SHARD: ${{ matrix.shard }}
      ARTIFACTS: ${{ github.workspace }}/artifacts
      PRIVATE_ARTIFACTS: ${{ github.workspace }}/private-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-shell-apks-${{ github.run_id }}
          path: android-shell/app/build/outputs/apk/

      - name: Cache the emulator's system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ env.API_LEVEL }}/google_apis/x86_64
          key: android-system-image-${{ env.API_LEVEL }}-google_apis-x86_64-v1

      - name: Enable KVM and start the emulator booting
        run: |
          mkdir -p "$ARTIFACTS" "$PRIVATE_ARTIFACTS"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Boots while the web app builds; the "Wait" step below joins it.
          nohup android-shell/ci/emulator.sh boot > "$ARTIFACTS/emulator-boot.log" 2>&1 &
          echo $! > /tmp/emulator-boot.pid

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Build the web app and start the mock stacks
        timeout-minutes: 4
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          bun install --frozen-lockfile
          cp .env.example .env
          (cd app && bun run build)
          # A: signed out unless the mock's cookie is sent, with the sign-in hand-off ("OpenBot
          # Cloud" in the tests).
          MOCK_SIGNED_OUT=1 SERVER_PORT=3001 nohup bun app/workbench/mock-server.ts > "$ARTIFACTS/mock-a.log" 2>&1 &
          APP_PORT=3010 SERVER_PORT=3001 nohup bun app/serve.ts > "$ARTIFACTS/app-a.log" 2>&1 &
          if [ "$SHARD" = mock ]; then
            # B: the same without the hand-off.
            MOCK_NO_HANDOFF=1 MOCK_SIGNED_OUT=1 SERVER_PORT=3002 nohup bun app/workbench/mock-server.ts > "$ARTIFACTS/mock-b.log" 2>&1 &
            APP_PORT=3011 SERVER_PORT=3002 nohup bun app/serve.ts > "$ARTIFACTS/app-b.log" 2>&1 &
            second="http://127.0.0.1:3011/api/auth/shell/config?platform=android"; want=404
          else
            # C: a self-hosted OpenBot on another origin, with the hand-off.
            MOCK_PERSON_NAME="Priya Shah" MOCK_ORG_NAME="Northwind" MOCK_SIGNED_OUT=1 SERVER_PORT=3003 nohup bun app/workbench/mock-server.ts > "$ARTIFACTS/mock-c.log" 2>&1 &
            APP_PORT=3013 SERVER_PORT=3003 nohup bun app/serve.ts > "$ARTIFACTS/app-c.log" 2>&1 &
            second="http://127.0.0.1:3013/api/auth/shell/config?platform=android"; want=200
          fi
          for _ in $(seq 1 60); do
            a="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3010/ || true)"
            b="$(curl -s -o /dev/null -w '%{http_code}' "$second" || true)"
            if [ "$a" = 200 ] && [ "$b" = "$want" ]; then echo "mock stacks are up"; exit 0; fi
            sleep 1
          done
          echo "mock stacks did not start"; tail -n 40 "$ARTIFACTS"/mock-*.log "$ARTIFACTS"/app-*.log; exit 1

      - name: Start the probe and the silent server
        if: matrix.shard == 'other'
        run: |
          nohup python3 android-shell/probe/serve.py > "$ARTIFACTS/probe-server.log" 2>&1 &
          nohup python3 android-shell/ci/silent_server.py > "$ARTIFACTS/silent-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then echo "probe is up"; exit 0; fi
            sleep 1
          done
          echo "the probe did not start"; exit 1

      - name: Wait for the emulator and prepare it
        timeout-minutes: 5
        run: |
          while kill -0 "$(cat /tmp/emulator-boot.pid)" 2>/dev/null; do sleep 2; done
          cat "$ARTIFACTS/emulator-boot.log" | tail -n 5
          android-shell/ci/emulator.sh prepare
          android-shell/ci/emulator.sh describe

      - name: Install the apps
        run: |
          adb install -r -g android-shell/app/build/outputs/apk/debug/app-debug.apk
          adb install -r -g android-shell/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # The releaseTest build is installed by the runner right before its tests, after the
          # hand-off tests (two apps claiming openbotshell:// would make Chrome ask which one).

      - name: Run the instrumented tests
        timeout-minutes: 14
        env:
          OPENBOT_SHELL_TEST_SESSION: ${{ secrets.OPENBOT_SHELL_TEST_SESSION }}
          OPENBOT_SHELL_GOOGLE_EMAIL: ${{ secrets.OPENBOT_SHELL_GOOGLE_EMAIL }}
          OPENBOT_SHELL_GOOGLE_PASSWORD: ${{ secrets.OPENBOT_SHELL_GOOGLE_PASSWORD }}
          OPENBOT_SHELL_GOOGLE_TOTP_SECRET: ${{ secrets.OPENBOT_SHELL_GOOGLE_TOTP_SECRET }}
          GOOGLE_SIGN_IN: ${{ inputs.google_sign_in }}
          REAL_BACKEND_ONLY: ${{ inputs.real_backend_only }}
          TEST_BUDGET_SECONDS: "780"
        run: python3 android-shell/ci/run_tests.py "$ARTIFACTS" "$PRIVATE_ARTIFACTS" "$GITHUB_WORKSPACE"

      - name: Write the summary and collect the screenshots
        if: always()
        run: |
          free -m; sudo dmesg 2>/dev/null | grep -i -E "killed process|out of memory" | tail -5 || true
          python3 android-shell/ci/summarize.py "$ARTIFACTS" || true
          python3 android-shell/ci/collect.py "$ARTIFACTS" "$PRIVATE_ARTIFACTS" || true
          if [ -f "$ARTIFACTS/SUMMARY.md" ]; then cat "$ARTIFACTS/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$(ls -A "$PRIVATE_ARTIFACTS/shots" "$PRIVATE_ARTIFACTS/video" 2>/dev/null)" ]; then echo "HAS_PRIVATE=1" >> "$GITHUB_ENV"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-shell-${{ github.run_id }}-${{ matrix.shard }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.HAS_PRIVATE == '1'
        with:
          name: android-shell-private-${{ github.run_id }}-${{ matrix.shard }}
          path: private-artifacts/
          retention-days: 7
          if-no-files-found: ignore
