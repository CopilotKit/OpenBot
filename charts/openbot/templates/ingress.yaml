{{- if .Values.ingress.enabled }}
{{- $fullname := include "openbot.fullname" . -}}
{{- $port := .Values.server.service.port -}}
{{/*
Getting traffic in, one of two ways.

`className` has no default because the controller differs on every cluster and always will, and the
annotations that configure it differ with it. Naming one here would be a chart that installs on the
cluster it was written on.

The AWS usage tag (`openbot.awsAttributionTags`) goes on for every class, because a controller other
than the AWS Load Balancer Controller ignores the annotation. In an Ingress group that controller
merges every member's tags onto the shared load balancer, so a shared one is tagged too.
*/}}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) -}}
{{- $tags := "alb.ingress.kubernetes.io/tags" -}}
{{- $_ := set $annotations $tags (include "openbot.awsAttributionTags" (dict "annotations" .Values.ingress.annotations "annotation" $tags "path" "ingress.annotations")) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
{{ include "openbot.labels" . | indent 4 }}
  annotations:
{{ toYaml $annotations | indent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullname }}-server
                port:
                  number: {{ $port }}
          {{- end }}
    {{- end }}
{{- end }}
