{{- $separate := and (eq .Values.computers.mode "sandbox") (ne (include "openbot.computersNamespace" .) .Release.Namespace) }}
{{- $egressProxy := (.Values.computers).egressProxy | default dict }}
{{- $needsToken := not .Values.computers.existingTokenSecret }}
{{- $needsProxy := and $egressProxy.enabled (not $egressProxy.existingSecret) }}
{{- if and $separate (not .Values.secrets.existingSecret) (or $needsToken $needsProxy) }}
{{/*
What a computer reads, in the namespace the computers run in.

A pod reads Secrets from its own namespace only, so a Sandbox in a computers namespace of its own
cannot read the release's Secret. This carries the two keys a computer reads, and nothing else: the
token the server presents to it, and the egress proxy URL when one is on. The key that encrypts the
credential vault, the Intelligence key and the sign-in secrets stay in the release's namespace, where
the computers cannot reach them. See `openbot.computerSecretName` in `_helpers.tpl`.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- $data := list }}
{{- range .Values.externalSecrets.data }}
{{- if or (and $needsToken (eq .secretKey "computer-token")) (and $needsProxy (eq .secretKey "egress-proxy-url")) }}
{{- $data = append $data . }}
{{- end }}
{{- end }}
{{- if $data }}
{{- /*
  From the same store, by the same remote keys. A `ClusterSecretStore` serves every namespace; a
  namespaced `SecretStore` has to exist in the computers namespace too.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "openbot.computerSecretName" . }}
  namespace: {{ include "openbot.computersNamespace" . }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "computer") | indent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "openbot.computerSecretName" . }}
    creationPolicy: Owner
  data:
{{ toYaml $data | indent 4 }}
{{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openbot.computerSecretName" . }}
  namespace: {{ include "openbot.computersNamespace" . }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "computer") | indent 4 }}
type: Opaque
stringData:
  {{- if $needsToken }}
  computer-token: {{ required "secrets.computerToken is required: it is the only thing standing between a computer and anybody who can reach its port. Generate one with: openssl rand -hex 32" .Values.secrets.computerToken | quote }}
  {{- end }}
  {{- if $needsProxy }}
  egress-proxy-url: {{ required "secrets.egressProxyUrl is required when computers.egressProxy.enabled and computers.egressProxy.existingSecret is empty." (.Values.secrets).egressProxyUrl | quote }}
  {{- end }}
{{- end }}
{{- end }}
