{{- if and (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
{{/*
The fallback, and the default, because a plain Kubernetes Secret is what a self-hosted cluster has.

A deployment on a cloud points `externalSecrets` at its own store instead and this renders nothing.
Either way the templates that read these keys are identical, which is the point: no vendor appears
anywhere except in a values block.

`helm.sh/resource-policy: keep` is deliberate. `KEY_ENCRYPTION_KEY` is what the credential vault is
encrypted with, so a `helm uninstall` that took it would leave every stored credential unreadable
even after a reinstall against the same database.

With the bundled database, the key encryption key and the computer token need not be given: each is
generated once and read back from this Secret on every upgrade (`openbot.generatesCredentials`). A
value given in `secrets` always wins.
*/}}
{{- $generates := include "openbot.generatesCredentials" . }}
{{- $keyEncryptionKey := .Values.secrets.keyEncryptionKey }}
{{- if and (not $keyEncryptionKey) $generates }}
{{- $keyEncryptionKey = include "openbot.keptValue" (dict "root" . "secret" (include "openbot.secretName" .) "key" "key-encryption-key" "generate" (randBytes 32)) }}
{{- end }}
{{- $computerToken := .Values.secrets.computerToken }}
{{- if and (not $computerToken) $generates (ne .Values.computers.mode "external") (not .Values.computers.existingTokenSecret) }}
{{- $computerToken = include "openbot.keptValue" (dict "root" . "secret" (include "openbot.secretName" .) "key" "computer-token" "generate" (randAlphaNum 64)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openbot.secretName" . }}
  labels:
{{ include "openbot.labels" . | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key-encryption-key: {{ required "secrets.keyEncryptionKey is required with a database of your own: that database outlives this namespace and a key generated here would not, leaving every stored credential unreadable after a reinstall. Generate one, keep it, and pass it with --set-string or a values file you do not commit: openssl rand -base64 32" $keyEncryptionKey | quote }}
  {{- /* The bundled Intelligence's key is not a value: the key Job writes it to a Secret of its own. */}}
  {{- if not (include "openbot.intelligenceBundled" .) }}
  intelligence-api-key: {{ required "secrets.intelligenceApiKey is required with intelligence.enabled=false. OpenBot needs CopilotKit Intelligence and refuses to start without it." .Values.secrets.intelligenceApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.licenseToken }}
  license-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.composioApiKey }}
  composio-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.betterAuthSecret }}
  better-auth-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.modelApiKey }}
  model-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.managedAgentToken }}
  managed-agent-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleClientSecret }}
  google-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.microsoftClientSecret }}
  microsoft-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oktaClientSecret }}
  okta-client-secret: {{ . | quote }}
  {{- end }}
  {{- with $computerToken }}
  computer-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.supervisorToken }}
  supervisor-token: {{ . | quote }}
  {{- end }}
  {{- /*
    No `worker-shared-secret` here: the routines worker's secret has a Secret of its own, written
    whenever nobody else holds one (templates/routines/secret.yaml).

    The delivery and directory switches: `commonEnv` references these keys whenever the switch is on,
    so the switch without its secret fails here rather than in a pod.
  */}}
  {{- if (.Values.config.opentag).enabled }}
  opentag-shared-secret: {{ required "secrets.opentagSharedSecret is required when config.opentag.enabled. Generate one with: openssl rand -hex 32" .Values.secrets.opentagSharedSecret | quote }}
  {{- end }}
  {{- if (.Values.config.sms).enabled }}
  twilio-auth-token: {{ required "secrets.twilioAuthToken is required when config.sms.enabled." .Values.secrets.twilioAuthToken | quote }}
  {{- end }}
  {{- if (.Values.config.scim).enabled }}
  scim-bearer-token: {{ required "secrets.scimBearerToken is required when config.scim.enabled. Generate one with: openssl rand -hex 32" .Values.secrets.scimBearerToken | quote }}
  {{- end }}
  {{- with .Values.secrets.scimBearerTokenNext }}
  scim-bearer-token-next: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.expoAccessToken }}
  expo-access-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.otelLogsHeaders }}
  otel-logs-headers: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.otelHeaders }}
  otel-headers: {{ . | quote }}
  {{- end }}
  {{- with (.Values.secrets).webBotAuthKey }}
  web-bot-auth-key: {{ . | quote }}
  {{- end }}
  {{- /*
    The computers reference this key whenever the proxy is on and names no Secret of its own, so the
    switch without the URL fails here rather than as a computer whose every page fails.
  */}}
  {{- $egressProxy := (.Values.computers).egressProxy | default dict }}
  {{- if and $egressProxy.enabled (not $egressProxy.existingSecret) }}
  egress-proxy-url: {{ required "secrets.egressProxyUrl is required when computers.egressProxy.enabled and computers.egressProxy.existingSecret is empty. It is the proxy URL with its credentials, such as http://user:password@gateway.provider.example:8000." (.Values.secrets).egressProxyUrl | quote }}
  {{- end }}
{{- end }}
