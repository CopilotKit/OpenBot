{{- if (.Values.routines).enabled }}
{{- $worker := include "openbot.workerSecretRef" . | fromYaml }}
{{- if $worker.write }}
{{/*
The secret the routines CronJob presents and the API server checks, written here whenever nobody
else holds one (see `openbot.workerSecretRef`): `secrets.workerSharedSecret` when it is given, and
otherwise a random value generated once and read back on every upgrade.

Its own Secret rather than a key in this chart's, so it is the same object whether this chart, the
operator or a store holds everything else.

NOT KEPT ON UNINSTALL, unlike the Secrets beside it. Nothing is encrypted with this and nothing
stored refers to it: a reinstall generates a new one, and both pods read whatever is here.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $worker.name }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "routines") | indent 4 }}
type: Opaque
stringData:
  {{ $worker.key }}: {{ .Values.secrets.workerSharedSecret | default (include "openbot.keptValue" (dict "root" . "secret" $worker.name "key" $worker.key "generate" (randAlphaNum 48))) | quote }}
{{- end }}
{{- end }}
