{{- if include "openbot.postgresqlSecretWritten" . }}
{{/*
The bundled database's password, written here so nobody has to make one, under the name the
subchart would have given its own Secret (see `openbot.postgresqlSecretWritten`). The subchart reads
it as `postgresql.auth.existingSecret`, and the API server reads the same key (`openbot.databaseUrlEnv`).

`postgresql.auth.password` when it is given; otherwise a random value generated once and read back on
every upgrade. A release installed before this chart wrote it has the subchart's own Secret under
this same name, so the password that database was initialized with is the one read back.

KEPT ON UNINSTALL, because the database's volume is: PostgreSQL takes its password at first boot
only, so a reinstall onto that volume has to find the password it was made with.
*/}}
{{- $name := include "openbot.postgresqlSecretName" . }}
{{- $auth := .Values.postgresql.auth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "postgresql") | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- /* Bitnami keeps the superuser's password under `postgres-password`, anyone else's under `password`. */}}
  {{- if eq $auth.username "postgres" }}
  postgres-password: {{ $auth.password | default (include "openbot.keptValue" (dict "root" . "secret" $name "key" "postgres-password" "generate" (randAlphaNum 32))) | quote }}
  {{- else }}
  password: {{ $auth.password | default (include "openbot.keptValue" (dict "root" . "secret" $name "key" "password" "generate" (randAlphaNum 32))) | quote }}
  postgres-password: {{ $auth.postgresPassword | default (include "openbot.keptValue" (dict "root" . "secret" $name "key" "postgres-password" "generate" (randAlphaNum 32))) | quote }}
  {{- end }}
{{- end }}
