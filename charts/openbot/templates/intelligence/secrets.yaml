{{- if include "openbot.intelligenceBundled" . }}
{{/*
Every credential the bundled Intelligence needs, generated here so that nobody writes one down.

The Intelligence chart can render its own from values (`localDevSecrets`), but only from literals
somebody types into a values file, which is exactly what this chart never asks for. So each is a
random value, written once and read back on every upgrade (`openbot.keptValue`): PostgreSQL and
Redis take their password at first boot only, and a new one on the second install would lock
Intelligence out of its own data.

KEPT ON UNINSTALL, like this chart's own Secret, for the same reason: the databases' volumes outlive
the release, and a reinstall has to find the passwords they were made with.

Each name is read from the Intelligence chart's values under `intelligence`, so the two can only
agree.
*/}}
{{- $values := .Values.intelligence }}
{{- $intelligence := include "openbot.intelligenceFullname" . }}
{{- $postgresql := index $values "postgresql" | default dict }}
{{- $postgresqlAuth := $postgresql.auth | default dict }}
{{- $postgresqlSecret := required "intelligence.postgresql.auth.existingSecret names the Secret this chart generates the bundled Intelligence's database passwords into." $postgresqlAuth.existingSecret }}
{{- $databaseSecret := (($values.database | default dict).existingSecret) }}
{{- if ne $databaseSecret $postgresqlSecret }}
{{- fail "intelligence.database.existingSecret must be the same Secret as intelligence.postgresql.auth.existingSecret: this chart writes the password and the URL built from it side by side, so they cannot drift apart." }}
{{- end }}
{{- $postgresqlUser := $postgresqlAuth.username | default "postgres" }}
{{- $postgresqlPasswordKey := eq $postgresqlUser "postgres" | ternary "postgres-password" "password" }}
{{- $postgresqlPassword := include "openbot.keptValue" (dict "root" . "secret" $postgresqlSecret "key" $postgresqlPasswordKey "generate" (randAlphaNum 32)) }}
{{- $postgresqlHost := include "openbot.subchartFullname" (dict "root" . "values" $postgresql "chart" "postgresql") }}
{{- $redis := index $values "redis-subchart" | default dict }}
{{- $redisAuth := $redis.auth | default dict }}
{{- $redisSecret := required "intelligence.redis-subchart.auth.existingSecret names the Secret this chart generates the bundled Intelligence's Redis password into." $redisAuth.existingSecret }}
{{- if ne (($values.redis | default dict).existingSecret) $redisSecret }}
{{- fail "intelligence.redis.existingSecret must be the same Secret as intelligence.redis-subchart.auth.existingSecret: this chart writes the password and the URL built from it side by side." }}
{{- end }}
{{- $redisPasswordKey := default "redis-password" $redisAuth.existingSecretPasswordKey }}
{{- $redisPassword := include "openbot.keptValue" (dict "root" . "secret" $redisSecret "key" $redisPasswordKey "generate" (randAlphaNum 32)) }}
{{- $redisHost := printf "%s-master" (include "openbot.subchartFullname" (dict "root" . "values" $redis "chart" "redis-subchart")) }}
{{- $authSecret := required "intelligence.auth.existingSecret names the Secret this chart generates the bundled Intelligence's session secret into." (($values.auth | default dict).existingSecret) }}
{{- $gateway := $values.realtimeGateway | default dict }}
{{- $gatewaySecret := required "intelligence.realtimeGateway.existingSecret names the Secret this chart generates the bundled Intelligence's gateway secrets into." $gateway.existingSecret }}
{{- $cookie := (($gateway.beam | default dict).cookieSecret | default dict) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresqlSecret }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "intelligence") | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- /* Bitnami keeps the superuser's password under `postgres-password`, anyone else's under `password`. */}}
  {{ $postgresqlPasswordKey }}: {{ $postgresqlPassword | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s:5432/%s" $postgresqlUser $postgresqlPassword $postgresqlHost ($postgresqlAuth.database | default "intelligence") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $redisSecret }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "intelligence") | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $redisPasswordKey }}: {{ $redisPassword | quote }}
  redis-url: {{ printf "redis://:%s@%s:6379/0" $redisPassword $redisHost | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authSecret }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "intelligence") | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- /* Signs Intelligence's own sessions, which nobody opens here; required at 32 characters or more. */}}
  auth-secret: {{ include "openbot.keptValue" (dict "root" . "secret" $authSecret "key" "auth-secret" "generate" (randAlphaNum 48)) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gatewaySecret }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "intelligence") | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  runner-auth-secret: {{ include "openbot.keptValue" (dict "root" . "secret" $gatewaySecret "key" "runner-auth-secret" "generate" (randAlphaNum 64)) | quote }}
  {{- /* Phoenix's, at least 64 characters. */}}
  secret-key-base: {{ include "openbot.keptValue" (dict "root" . "secret" $gatewaySecret "key" "secret-key-base" "generate" (randAlphaNum 96)) | quote }}
  {{- if eq ($cookie.name | default "") $gatewaySecret }}
  {{ $cookie.key | default "release-cookie" }}: {{ include "openbot.keptValue" (dict "root" . "secret" $gatewaySecret "key" ($cookie.key | default "release-cookie") "generate" (randAlphaNum 48)) | quote }}
  {{- end }}
{{- $keyRef := include "openbot.intelligenceKeyRef" . | fromYaml }}
{{- with $keyRef.name }}
---
{{- /*
  OpenBot's runtime key in the bundled Intelligence, made here rather than by anybody signing in.
  Intelligence's bootstrap Job stores its hash under OpenBot's project (`bootstrap.projects`), and
  the server reads this Secret as INTELLIGENCE_API_KEY. The shape is Intelligence's project key,
  `cpk-<label>_<short>_<long>`: a short token it finds the key by (unique per key) and a long one it
  keeps only the hash of. Kept across upgrades like every credential here; a different key put in
  this Secret is stored by the next upgrade and the old one revoked.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ . }}
  labels:
{{ include "openbot.componentLabels" (dict "root" $ "component" "intelligence") | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $keyRef.key }}: {{ include "openbot.keptValue" (dict "root" $ "secret" . "key" $keyRef.key "generate" (printf "cpk-openbot_%s_%s" (randAlphaNum 16) (randAlphaNum 48))) | quote }}
{{- end }}
{{- $learning := $values.learning | default dict }}
{{- if $learning.enabled }}
{{- $agent := $learning.agent | default dict }}
{{- $learningSecret := required "intelligence.learning.agent.tokenSecret.existingSecret names the Secret this chart generates the bundled Intelligence's Learning agent token into." (($agent.tokenSecret | default dict).existingSecret) }}
{{- /*
  The model keys the Learning agent spends: `secrets.modelApiKey` and `secrets.anthropicApiKey`, or
  `model-api-key` and `anthropic-api-key` from the operator's own Secret, read as they stand at
  install and upgrade. A key held in a store is not readable here; `intelligence.learning.agent.env`
  names it instead.

  And the model it runs, which follows the keys: `anthropic/claude-sonnet-5-5` when the Anthropic key
  is the only one, and `openai/gpt-5.5` otherwise, which is also what it ran before there was a
  choice. `config.learning.model` names one outright. It reaches the agent as LEARNING_AGENT_MODEL
  from this Secret, not from `intelligence.learning.agent.model`, because a value there is one model
  for every install (see values.yaml).

  In that environment `learning-agent-model` gets the model, `anthropic-api-key` the Anthropic key,
  and every other key the OpenAI one: the agent is handed the Anthropic key under its own name, and
  never under the OpenAI one.
*/}}
{{- $modelKey := .Values.secrets.modelApiKey }}
{{- if and (not $modelKey) .Values.secrets.existingSecret }}
{{- $modelKey = include "openbot.keptValue" (dict "root" . "secret" .Values.secrets.existingSecret "key" "model-api-key" "generate" "") }}
{{- end }}
{{- $anthropicKey := .Values.secrets.anthropicApiKey }}
{{- if and (not $anthropicKey) .Values.secrets.existingSecret }}
{{- $anthropicKey = include "openbot.keptValue" (dict "root" . "secret" .Values.secrets.existingSecret "key" "anthropic-api-key" "generate" "") }}
{{- end }}
{{- $learningModel := ((.Values.config.learning | default dict).model | default "" | toString | trim) }}
{{- if not $learningModel }}
{{- $learningModel = ternary "anthropic/claude-sonnet-5-5" "openai/gpt-5.5" (and (not $modelKey) (not (empty $anthropicKey))) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $learningSecret }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "intelligence") | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- /* What Intelligence's Learning runners present to its Learning agent. */}}
  {{ ($agent.tokenSecret).key | default "learning-agent-token" }}: {{ include "openbot.keptValue" (dict "root" . "secret" $learningSecret "key" (($agent.tokenSecret).key | default "learning-agent-token") "generate" (randAlphaNum 64)) | quote }}
  {{- /* Every key the agent's environment reads from this Secret, so the two can only agree. */}}
  {{- range ($agent.env | default list) }}
  {{- $ref := ((.valueFrom | default dict).secretKeyRef | default dict) }}
  {{- if and (eq ($ref.name | default "") $learningSecret) (ne $ref.key (($agent.tokenSecret).key | default "learning-agent-token")) }}
  {{- $value := $modelKey }}
  {{- if eq $ref.key "anthropic-api-key" }}
  {{- $value = $anthropicKey }}
  {{- else if eq $ref.key "learning-agent-model" }}
  {{- $value = $learningModel }}
  {{- end }}
  {{- if $value }}
  {{ $ref.key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- $storage := $values.objectStorage | default dict }}
{{- if (($values.localObjectStorage | default dict).enabled) }}
{{- $storageSecret := required "intelligence.objectStorage.existingSecret names the Secret this chart generates the bundled object store's credentials into." $storage.existingSecret }}
{{- $storageKeys := $storage.secretKeys | default dict }}
{{- $accessKey := $storageKeys.accessKey | default "s3-access-key" }}
{{- $secretKey := $storageKeys.secretKey | default "s3-secret-key" }}
---
{{- /*
  The bundled object store's own credentials: it starts with them as its root user, and every
  Intelligence service that reads or writes Learning's files signs in with them.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $storageSecret }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" "intelligence") | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $accessKey }}: {{ include "openbot.keptValue" (dict "root" . "secret" $storageSecret "key" $accessKey "generate" (printf "openbot%s" (randAlphaNum 16 | lower))) | quote }}
  {{ $secretKey }}: {{ include "openbot.keptValue" (dict "root" . "secret" $storageSecret "key" $secretKey "generate" (randAlphaNum 48)) | quote }}
{{- end }}
{{- end }}
{{- with .Values.secrets.licenseToken }}
{{- $license := (($values.appApi | default dict).licenseSecret | default dict) }}
---
{{- /*
  The licence, given once as `secrets.licenseToken`, for Intelligence's side. OpenBot's side reads the
  same value from this chart's own Secret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $license.existingSecret }}
  labels:
{{ include "openbot.componentLabels" (dict "root" $ "component" "intelligence") | indent 4 }}
type: Opaque
stringData:
  {{ $license.key | default "license-token" }}: {{ . | quote }}
{{- end }}
{{- end }}
