{{- if include "openbot.intelligenceBundled" . }}
{{- $component := "intelligence-key" -}}
{{- $keySecret := include "openbot.intelligenceKeySecretName" . -}}
{{- $token := dict -}}
{{- range .Values.intelligence.appApi.serviceTokens.tokens }}{{- if eq .name "openbot" }}{{- $token = . }}{{- end }}{{- end -}}
{{/*
OpenBot's project and runtime key in the bundled Intelligence, made with nobody signing in.

Runs `server/src/intelligence-key.ts` from the server image on every install and upgrade: it keeps a
key Intelligence still accepts, and otherwise creates a project and key with the organization's
service token and writes them to `<fullname>-intelligence-key`, the Secret the server's
INTELLIGENCE_API_KEY reads. The server's pods wait for that Secret and start once it exists.

AN ORDINARY JOB, NOT A HOOK, like the first migration with the bundled database and for the mirror of
its reason. Intelligence 0.15.1 creates the organization in a post-install hook and will not start its
API until it exists; a pre-install hook here would wait for an API that cannot start yet, and a
post-install one would hold the release on a timeout it does not need. As an ordinary Job it starts
with everything else and waits out the API's restarts itself.

Only this Job may write that Secret: the Role below names it, and creating Secrets is the one verb a
Role cannot narrow to a name. No NetworkPolicy selects it, like the other Jobs: it runs once and
reaches only the Kubernetes API and Intelligence's.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openbot.componentName" (dict "root" . "component" $component) | trunc 52 | trimSuffix "-" }}-{{ .Release.Revision }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" $component) | indent 4 }}
spec:
  backoffLimit: 3
  # A first install on a fresh cluster pulls every image and starts two databases before the API
  # answers, and the API's restart backoff adds up to five minutes after that.
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
{{ include "openbot.componentSelectorLabels" (dict "root" . "component" $component) | indent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "openbot.componentName" (dict "root" . "component" $component) }}
      automountServiceAccountToken: true
      {{- with .Values.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: intelligence-key
          image: {{ include "openbot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app/server
          {{- with .Values.securityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          command: ["/usr/local/bin/bun", "src/intelligence-key.ts"]
          env:
            - name: HOME
              value: /tmp/home
            - name: INTELLIGENCE_API_URL
              value: {{ include "openbot.intelligenceApiUrl" . | quote }}
            - name: INTELLIGENCE_ORGANIZATION_ID
              value: {{ include "openbot.intelligenceOrganizationId" . | quote }}
            - name: INTELLIGENCE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $token.secret.name }}
                  key: {{ $token.secret.key }}
            - name: INTELLIGENCE_KEY_SECRET
              value: {{ $keySecret | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openbot.componentName" (dict "root" . "component" $component) }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" $component) | indent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openbot.componentName" (dict "root" . "component" $component) }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" $component) | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $keySecret | quote }}]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openbot.componentName" (dict "root" . "component" $component) }}
  labels:
{{ include "openbot.componentLabels" (dict "root" . "component" $component) | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openbot.componentName" (dict "root" . "component" $component) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openbot.componentName" (dict "root" . "component" $component) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
