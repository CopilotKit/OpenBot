{{- if .Values.externalSecrets.enabled }}
{{/*
The same keys, from whatever the cluster's secret store is.

Backend-agnostic on purpose: Secrets Manager, Secret Manager and Key Vault are all a `secretStoreRef`
and a list of remote keys, so none of them appears in this chart by name.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "openbot.secretName" . }}
  labels:
{{ include "openbot.labels" . | indent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled is true" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "openbot.secretName" . }}
    creationPolicy: Owner
  data:
{{ toYaml (required "externalSecrets.data must name at least key-encryption-key" .Values.externalSecrets.data) | indent 4 }}
{{- end }}
