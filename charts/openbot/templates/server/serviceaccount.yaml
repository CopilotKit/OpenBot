{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openbot.serviceAccountName" . }}
  labels:
{{ include "openbot.labels" . | indent 4 }}
  {{- /*
    IRSA, Workload Identity and AKS workload identity are all annotations here, which is why this is
    one map and not three code paths. The chart never learns which cloud it is on.
  */}}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "openbot.automountToken" . }}
{{- end }}
