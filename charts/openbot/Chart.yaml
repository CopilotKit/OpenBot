apiVersion: v2
name: openbot
description: Run OpenBot on any Kubernetes cluster, managed or your own
type: application
# The chart's own version, bumped when templates or defaults change.
version: 0.1.0
# The OpenBot release this chart's default image tag points at.
appVersion: "0.0.4"
home: https://github.com/CopilotKit/OpenBot
sources:
  - https://github.com/CopilotKit/OpenBot
keywords:
  - openbot
  - copilotkit
  - agents
maintainers:
  - name: CopilotKit
    url: https://github.com/CopilotKit
dependencies:
  # BUNDLED FOR SOMEBODY TRYING IT, OFF FOR ANYBODY WITH A DATABASE. A deployment with RDS, Cloud SQL
  # or Azure Database sets `postgresql.enabled: false` and a connection URL, which is the same line
  # the Intelligence chart draws, so somebody who has deployed that does not have to relearn it.
  - name: postgresql
    version: "~16"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
