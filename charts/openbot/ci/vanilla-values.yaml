# The vanilla install the chart README gives, exactly: one person, from their own computer, over
# `kubectl port-forward`, with OpenBot's bundled database and the bundled Intelligence.
#
# The README has the person write the `secrets` and the database password into a file of their own
# that is kept and never committed; these are placeholders in its place. The licence is given once,
# and the chart writes it to OpenBot's Secret and the bundled Intelligence's.
config:
  singleUser: true
postgresql:
  enabled: true
  auth:
    password: "example-for-rendering-only"
secrets:
  licenseToken: "example-for-rendering-only"
  modelApiKey: "example-for-rendering-only"
  computerToken: "example-for-rendering-only"
  # keyEncryptionKey is generated by CI, as it is for every target.
