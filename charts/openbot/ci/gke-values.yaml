# GKE. Cloud SQL, Workload Identity, Secret Manager through external-secrets, Gateway API.
config:
  initialAdminEmails: admin@example.com
  intelligence:
    apiUrl: https://api.cloud.copilotkit.ai
    gatewayWsUrl: wss://gateway.cloud.copilotkit.ai
  auth:
    google:
      clientId: example.apps.googleusercontent.com
  publicUrl: https://openbot.example.com
postgresql:
  enabled: false
database:
  existingSecret: openbot-database
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: openbot@example-project.iam.gserviceaccount.com
externalSecrets:
  enabled: true
  secretStoreRef:
    name: gcp-secret-manager
  data:
    - secretKey: key-encryption-key
      remoteRef:
        key: openbot-key-encryption-key
    # Sessions are signed with this. The server refuses to start when sign-in is configured and it
    # is missing, so every provider store has to carry it.
    - secretKey: better-auth-secret
      remoteRef:
        key: openbot-better-auth-secret
    - secretKey: intelligence-api-key
      remoteRef:
        key: openbot-intelligence-api-key
    - secretKey: google-client-secret
      remoteRef:
        key: openbot/google-client-secret
    - secretKey: computer-token
      remoteRef:
        key: openbot/computer-token
    - secretKey: license-token
      remoteRef:
        key: openbot-license-token
# Gateway API rather than an Ingress, which the same chart supports without a second code path.
ingress:
  enabled: false
httpRoute:
  enabled: true
  parentRefs:
    - name: openbot-gateway
      namespace: gateway-system
  hostnames:
    - openbot.example.com

computers:
  mode: shared
