<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none">
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Rings -->
  <circle cx="160" cy="200" r="78" stroke="#888" stroke-opacity="0.25" stroke-dasharray="3 6"/>
  <circle cx="160" cy="200" r="130" stroke="#888" stroke-opacity="0.2" stroke-dasharray="3 6"/>

  <!-- One OpenBot to its copies -->
  <g stroke="url(#beam)" stroke-opacity="0.6" stroke-width="1.5">
    <line x1="160" y1="200" x2="238" y2="200"/>
    <line x1="160" y1="200" x2="121" y2="267.5"/>
    <line x1="160" y1="200" x2="121" y2="132.5"/>
  </g>
  <!-- Copies to the people and apps they work with -->
  <g stroke="#888" stroke-opacity="0.35">
    <line x1="238" y1="200" x2="272.6" y2="135"/>
    <line x1="238" y1="200" x2="272.6" y2="265"/>
    <line x1="121" y1="267.5" x2="160" y2="330"/>
    <line x1="121" y1="267.5" x2="47.4" y2="265"/>
    <line x1="121" y1="132.5" x2="47.4" y2="135"/>
    <line x1="121" y1="132.5" x2="160" y2="70"/>
  </g>

  <!-- The orb -->
  <circle cx="160" cy="200" r="80" fill="url(#glow)"/>
  <circle cx="160" cy="200" r="42" fill="url(#orb)"/>
  <circle cx="160" cy="200" r="42" fill="url(#shine)"/>

  <!-- Its copies -->
  <g>
    <circle cx="238" cy="200" r="22" fill="url(#glow)"/>
    <circle cx="238" cy="200" r="11" fill="url(#orb)"/>
    <circle cx="238" cy="200" r="11" fill="url(#shine)"/>
    <circle cx="121" cy="267.5" r="22" fill="url(#glow)"/>
    <circle cx="121" cy="267.5" r="11" fill="url(#orb)"/>
    <circle cx="121" cy="267.5" r="11" fill="url(#shine)"/>
    <circle cx="121" cy="132.5" r="22" fill="url(#glow)"/>
    <circle cx="121" cy="132.5" r="11" fill="url(#orb)"/>
    <circle cx="121" cy="132.5" r="11" fill="url(#shine)"/>
  </g>

  <!-- People -->
  <g>
    <g transform="translate(160 70)">
      <circle r="20" fill="#888" fill-opacity="0.15" stroke="#888" stroke-opacity="0.45"/>
      <circle cy="-4" r="6" fill="#888" fill-opacity="0.7"/>
      <path d="M-10 13a10 9 0 0 1 20 0" fill="#888" fill-opacity="0.7"/>
    </g>
    <g transform="translate(272.6 265)">
      <circle r="20" fill="#888" fill-opacity="0.15" stroke="#888" stroke-opacity="0.45"/>
      <circle cy="-4" r="6" fill="#888" fill-opacity="0.7"/>
      <path d="M-10 13a10 9 0 0 1 20 0" fill="#888" fill-opacity="0.7"/>
    </g>
    <g transform="translate(47.4 265)">
      <circle r="20" fill="#888" fill-opacity="0.15" stroke="#888" stroke-opacity="0.45"/>
      <circle cy="-4" r="6" fill="#888" fill-opacity="0.7"/>
      <path d="M-10 13a10 9 0 0 1 20 0" fill="#888" fill-opacity="0.7"/>
    </g>
    <g transform="translate(47.4 135)">
      <circle r="20" fill="#888" fill-opacity="0.15" stroke="#888" stroke-opacity="0.45"/>
      <circle cy="-4" r="6" fill="#888" fill-opacity="0.7"/>
      <path d="M-10 13a10 9 0 0 1 20 0" fill="#888" fill-opacity="0.7"/>
    </g>
  </g>

  <!-- Where they work: a chat, and a computer -->
  <g transform="translate(272.6 135)">
    <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#888" fill-opacity="0.15" stroke="#888" stroke-opacity="0.45"/>
    <path d="M-9 -7h18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-5 4v-4h-4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" stroke="#888" stroke-opacity="0.85" stroke-width="1.75" stroke-linejoin="round"/>
  </g>
  <g transform="translate(160 330)">
    <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#888" fill-opacity="0.15" stroke="#888" stroke-opacity="0.45"/>
    <rect x="-11" y="-9" width="22" height="14" rx="2" stroke="#888" stroke-opacity="0.85" stroke-width="1.75"/>
    <path d="M-5 10h10M0 5v5" stroke="#888" stroke-opacity="0.85" stroke-width="1.75" stroke-linecap="round"/>
  </g>
</svg>
