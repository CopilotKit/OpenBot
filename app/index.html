<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenBot</title>
    <!-- OpenBot's orb, the icon OpenBot Desktop ships: in a tab, on a phone's home screen and as an installed app. The files are in public/ (scripts/web-icons.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Sets the theme before the first paint. Must stay inline and classic: `defer` or `type="module"` runs too late. -->
    <script>
      // localStorage throws in some privacy modes; a theme is not worth taking the app down for.
      // The theme and the skin each in a try of their own, so neither costs the other.
      try {
        // A "light" or "dark" saved by the Theme setting is the person's own choice. Nothing saved
        // follows the system (lib/theme.ts), and the app's theme provider keeps following it once
        // the app is up. What earlier releases saved under "openbot-theme" was never a choice.
        const theme = window.localStorage.getItem("openbot-theme-choice");
        const dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        // For OpenBot Desktop, whose window follows the system unless the person chose.
        document.documentElement.dataset.themeChoice =
          theme === "light" || theme === "dark" ? theme : "system";
      } catch {}
      try {
        const saved = window.localStorage.getItem("openbot-skin");
        // A skin saved under the id it was renamed from (shared/user-preferences.ts RENAMED_SKIN_IDS).
        const skin = saved === "openmuse" ? "openfuse" : saved;
        if (skin && skin !== "openbot") document.documentElement.dataset.skin = skin;
      } catch {}
      try {
        // Inside the phone app's native shell (lib/native-shell/shell.ts works this out the same
        // way, and app/tests/native-shell.test.ts holds the two together): what the shell
        // injects, then its user agent, then ?native-shell=ios for testing, kept for the tab.
        // Marked for the styles, and the page takes the whole web view, which the shell lays out
        // between its own bars. A browser's viewport is left as it is.
        let remembered = null;
        const asked = new URLSearchParams(window.location.search).get("native-shell");
        try {
          if (asked === "off") window.sessionStorage.removeItem("openbot-native-shell");
          else if (asked === "ios" || asked === "android" || asked === "test")
            window.sessionStorage.setItem("openbot-native-shell", "test");
          remembered = window.sessionStorage.getItem("openbot-native-shell");
        } catch {}
        const injected = window.__OPENBOT_NATIVE_SHELL__;
        const mark = /OpenBotShell-(\w+)/.exec(window.navigator.userAgent);
        const platform =
          injected && (injected.platform === "ios" || injected.platform === "android")
            ? injected.platform
            : mark
              ? mark[1].toLowerCase() === "android"
                ? "android"
                : "ios"
              : asked === "ios" || asked === "android" || asked === "test"
                ? "test"
                : asked !== "off" && remembered === "test"
                  ? "test"
                  : null;
        if (platform) {
          document.documentElement.dataset.nativeShell = platform;
          const viewport = document.querySelector('meta[name="viewport"]');
          if (viewport && !viewport.content.includes("viewport-fit"))
            viewport.content += ", viewport-fit=cover";
        }
      } catch {}
      try {
        // Opened by OpenBot Desktop's setup, which faded out to the window's ground and marked the
        // address once (lib/desktop/from-setup.ts): the first paint fades up from that ground. The
        // mark comes off the address at once, so a reload or a copied link never fades. Not with
        // reduced motion.
        if (window.location.hash === "#from-setup") {
          window.history.replaceState(
            window.history.state,
            "",
            window.location.pathname + window.location.search,
          );
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches)
            document.documentElement.dataset.fromSetup = "";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
