[test]
# Runs before any test file, as the root bunfig.toml does for `bun test` from the repository root.
# Bun reads bunfig.toml from the current working directory only, so this covers `bun test` run from
# inside desktop/. tests/support/one-react.ts: the desktop's code and the app's components share
# one React (the workbench draws with the app's components). app/tests/preload.ts: Base UI loaded
# while a DOM exists, so its popups (Select, Popover, Dialog) mount.
#
# Not the root's network guard: it points the process's proxy at a refusing listener, and the
# desktop's browser tests drive real browsers and servers from here.
# tests/bunfig-preload.test.ts fails if this list stops being part of the root one.
preload = ["../tests/support/one-react.ts", "../app/tests/preload.ts"]
