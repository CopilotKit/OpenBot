[package]
name = "openbot-desktop"
version = "0.0.0"
description = "OpenBot Desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openbot_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "openbot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
flate2 = "1"
# Checking the digest of an installer before running it. See `install.rs`.
sha2 = "0.10"
tar = "0.4"
tauri-plugin-single-instance = "2.0.0-rc.5"
portable-pty = "0.9.0"
tauri-plugin-opener = "2.5.5"

# The Keychain, called directly. See `vault`: the `security` CLI reads a password through a 128-byte
# getpass buffer and truncates anything longer WITHOUT saying so, which silently corrupts every
# OpenAI project key. This has no such limit and puts nothing on a command line.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
