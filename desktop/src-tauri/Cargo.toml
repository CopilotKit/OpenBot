[package]
name = "openbot-desktop"
version = "0.3.2"
description = "OpenBot Desktop"
edition = "2021"
rust-version = "1.90"

[lib]
name = "openbot_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "openbot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Pins a bundled Intelligence CLI to the bytes the app was built with. See build.rs.
sha2 = "0.10"
# Reads the pinned deployment manifest an internal or candidate build carries. See `build.rs`.
serde_json = "1"

[features]
default = []
shell-updater = []

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
flate2 = "1"
# Checking the digest of an installer before running it. See `install.rs`.
sha2 = "0.10"
tar = "0.4"
# Comparing the app's release with its deployment's. See `follow.rs`.
semver = "1"
# Read Bun's release ZIP in-process; no unzip or PowerShell installation is required.
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
tauri-plugin-single-instance = "2.0.0-rc.5"
portable-pty = "0.9.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2"
# Updating a signed Mac build in place. The plugin verifies the minisign signature beside
# each artifact against the public key in `tauri.conf.json`, so an endpoint that is taken
# over still cannot hand this app something to install. See `docs/releasing.md`. The shell
# drives it (`install_app_update_now`), and restarts into what it wrote with `app.restart`.
tauri-plugin-updater = "2"
# Probing a local port without SO_REUSEADDR, which std sets on Unix. See `env::bind_loopbacks`.
socket2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The macOS quit OpenBot did not start (Dock, AppleScript, log out) routed through its own Quit.
# The version Tauri already uses. See `macos_quit` in main.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Narration on the Mac: on-device speech recognition from the microphone. See `speech/macos.rs`.
# The same objc2 generation Tauri and wry already use.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSLocale", "NSOperation", "NSString"] }
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioFormat", "AVAudioBuffer", "AVAudioTime", "AVAudioTypes"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }

# Narration on Windows: the SAPI in-process recognizer. See `speech/sapi.rs`. The version Tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Media_Speech", "Win32_System_Com"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Every local evaluation CLI call checks the pinned runtime and script against their digests,
# about 150 MB. Unoptimized, that hash alone took 4.9 s per call in a debug build; optimized, 0.3 s.
[profile.dev.package.sha2]
opt-level = 3
